<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>内科 A/B 题过关</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#111;--mute:#777;--line:#e6e6e1;--blue:#1565c0;--ok:#1b7f3b;--okb:#e7f4ea;--bad:#c62828;--badb:#fdecea;--pick:#eef3fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang SC",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 80px}h1{font-size:22px;margin:6px 0 2px}h2{font-size:19px;margin:0 0 6px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}.card{background:var(--card);border-radius:12px;padding:14px 16px;margin:12px 0}
button,.b{font:inherit;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-block}
button:hover{background:#f0f0ec}.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.pri:hover{background:#333}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ch{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.ch:hover{border-color:#bbb}.ch.p1{border-left:5px solid #c62828}.ch.p2{border-left:5px solid #e0a100}.ch.p3{color:#888}.ch .pt{font-size:11px;font-weight:700;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}.ch.p1 .pt{background:#c62828;color:#fff}.ch.p2 .pt{background:#fbeeb8;color:#8a5a00}.leg2{font-size:13px;color:var(--mute);margin:14px 0 6px}.leg2 b{font-weight:700;border-radius:5px;padding:0 5px;font-size:11px}.ch.ok{background:var(--okb);border-color:#bfe0c7}.ch.nx{border:2px solid var(--ink)}.ch small{color:var(--mute);font-size:13px}.ch.ok small{color:var(--ok)}
.tag{display:inline-block;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px}.tag.hw{color:var(--bad);border-color:#f2c1bd}
.q{font-size:17px;margin:8px 0 12px;white-space:pre-wrap}.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;padding:10px 12px}.opt b{width:1.2em;flex:none}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}.opt[disabled]{cursor:default;color:var(--ink)}
.res{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:15px}.res.r{background:var(--okb)}.res.w{background:var(--badb)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ink)}
.big{font-size:40px;font-weight:700;line-height:1.1}.pass{color:var(--ok)}.fail{color:var(--bad)}
.wl{border-top:1px solid var(--line);padding:10px 0}.wl:first-child{border-top:0}.wl .a{font-size:14px;margin-top:4px}.x{color:#444;font-size:14px;margin-top:4px}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.stat span{font-size:13px;border-radius:6px;padding:1px 8px;background:#f0f0ec}.stat span.lo{background:var(--badb);color:var(--bad)}
details summary{cursor:pointer;color:var(--blue);font-size:14px}.sheet{overflow-x:auto}.sheet h2{display:none}
.sheet table{border-collapse:collapse;width:100%;font-size:14px}.sheet th{text-align:left;background:#f0f0ec;padding:5px 8px;font-weight:600}.sheet td{border-top:1px solid #eee;padding:5px 8px;vertical-align:top}
.sheet td.f{color:var(--blue);font-weight:600}.sheet td.k{color:var(--bad)}.sheet .h{color:var(--bad);font-size:14px;margin:0 0 4px}.sheet .m{color:#555;font-size:14px;margin:0 0 8px}.sheet small{color:#888}
.hist{font-size:13px;color:var(--mute)}.pri kbd{background:transparent;color:#fff;border-color:#777}kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:#fafafa}
mark{border-radius:3px;padding:0 1px;color:inherit}mark.k{background:#fde2e0;color:#b71c1c;font-weight:700}mark.s{background:#fbeeb8}mark.t{background:none;border-bottom:2px dotted #c04f00}
.gd{margin-top:10px;font-size:15px}.gd h4{font-size:13px;color:var(--mute);margin:12px 0 4px;font-weight:600}.gd ul{margin:0;padding-left:1.1em}.gd li{margin:3px 0}
.why{background:#f4f6fa;border-left:3px solid var(--blue);padding:8px 10px;border-radius:0 8px 8px 0;margin:0}.zz{line-height:1.8}.zz b.ask{background:#fbeeb8;padding:0 3px;border-radius:3px}
.ol li.ra{color:var(--ok)}.ol li.wa{color:var(--bad)}.ol li span{color:#444}.leg{font-size:12px;color:var(--mute);margin-top:6px}
.bo{background:#f7f7f4;border-radius:9px;padding:8px 12px;margin:8px 0 4px;font-size:15px}.bo div{padding:2px 0}.bo b{display:inline-block;width:1.4em}
.bq{border-top:1px solid var(--line);padding:12px 0 4px}.bq:first-of-type{border-top:0}.bq .q{margin:0 0 8px}.bl{display:flex;gap:6px;flex-wrap:wrap}.bl button{min-width:46px;font-weight:700}
.bl button.right{background:var(--okb);border-color:var(--ok)}.bl button.wrong{background:var(--badb);border-color:var(--bad)}.bl button[disabled]{cursor:default;color:var(--ink)}
.img{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.img img{display:block;max-width:none;height:auto;width:min(100%,1100px)}.img img.full{width:auto}
.card dl{display:grid;grid-template-columns:5em 1fr;gap:4px 10px;margin:0;font-size:15px}.card dt{color:var(--mute)}.card dd{margin:0}
.vs{border-top:1px solid var(--line);padding:10px 0}.vs:first-of-type{border-top:0}.vs .p{font-size:15px;margin:4px 0}.vs .kz{font-size:14px;margin:2px 0}.vs .kz b{font-weight:600}.vs .kz mark{margin-right:4px}
</style>

<script>
const D={"order": ["04-01", "04-02", "04-03", "04-04", "04-05", "04-06", "04-07", "05-01", "05-02", "05-03", "05-04", "06-01", "06-02", "06-03", "06-04", "06-05", "06-06", "07-01", "07-02", "07-03", "07-04"], "names": {"04-01": "感冒", "04-02": "咳嗽", "04-03": "哮病", "04-04": "喘证", "04-05": "肺痈", "04-06": "肺痨", "04-07": "肺胀", "05-01": "心悸", "05-02": "胸痹", "05-03": "心衰", "05-04": "不寐", "06-01": "头痛", "06-02": "眩晕", "06-03": "中风", "06-04": "痴呆", "06-05": "癫狂", "06-06": "痫证", "07-01": "胃痛", "07-02": "胃痞", "07-03": "呕吐", "07-04": "噎膈"}, "sheet": {"04-01": "<section id=\"04-01\"><h2>感冒 <small>肺系<\/small><\/h2><p class=\"h\">老师：病因；辨证分类·证型·方；舌脉；方 2 个（风热）<\/p><p class=\"m\"><b>病机<\/b> 邪犯肺卫，卫表不和　<b>治则<\/b> 因势利导，从表而解，解表达邪<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风寒束表<\/b><br><small>风寒感冒<\/small><\/td><td>辛温解表，宣肺散寒<\/td><td class=\"f\">荆防达表汤、荆防败毒散<\/td><td>苔薄白、脉浮、脉浮紧<\/td><td class=\"k\">脉浮紧、清涕<\/td><\/tr><tr><td><b>风热犯表<\/b><br><small>风热感冒<\/small><\/td><td>辛凉解表，疏风清热<\/td><td class=\"f\">银翘散<\/td><td>舌尖红、苔薄白而干、苔薄黄、脉浮数<\/td><td class=\"k\">身热较著、黄稠涕、舌尖红<\/td><\/tr><tr><td><b>暑湿伤表<\/b><br><small>暑湿感冒<\/small><\/td><td>清暑祛湿解表<\/td><td class=\"f\">新加香薷饮<\/td><td>苔白腻、苔黄腻、脉濡数<\/td><td class=\"k\">脉濡数<\/td><\/tr><tr><td><b>气虚感冒<\/b><\/td><td>益气解表，调和营卫<\/td><td class=\"f\">参苏饮<\/td><td>舌淡、苔薄白、脉浮无力<\/td><td class=\"k\">脉浮无力<\/td><\/tr><tr><td><b>阴虚感冒<\/b><\/td><td>滋阴解表<\/td><td class=\"f\">加减葳蕤汤<\/td><td>舌红、苔少、脉细数<\/td><td class=\"k\">舌红少苔、干咳少痰<\/td><\/tr><tr><td><b>阳虚感冒<\/b><\/td><td>助阳解表<\/td><td class=\"f\">麻黄附子细辛汤<\/td><td>舌淡、舌胖、苔白、脉沉细无力<\/td><td class=\"k\">脉沉细无力、四肢不温<\/td><\/tr><\/table>", "04-02": "<section id=\"04-02\"><h2>咳嗽 <small>肺系<\/small><\/h2><p class=\"h\">老师：证治分类 外感/内伤；治法 1–2；证型 2；方（有玉竹的方？风寒用什么方？风燥）；注意病人症状<\/p><p class=\"m\"><b>病机<\/b> 邪犯于肺，肺失宣肃，肺气上逆　<b>治则<\/b> 分清邪正虚实，祛邪利肺，祛邪止咳，扶正补虚<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风寒袭肺<\/b><\/td><td>疏风散寒，宣肺止咳<\/td><td class=\"f\">三拗汤、止嗽散<\/td><td>苔薄白、脉浮、脉浮紧<\/td><td class=\"k\">清涕、白稀痰<\/td><\/tr><tr><td><b>风热犯肺<\/b><\/td><td>疏风清热，宣肺止咳<\/td><td class=\"f\">桑菊饮<\/td><td>舌红、苔薄黄、脉浮数、脉浮滑<\/td><td class=\"k\">喉燥咽痛、黄涕<\/td><\/tr><tr><td><b>风燥伤肺<\/b><br><small>温燥<\/small><\/td><td>疏风清肺，润燥止咳<\/td><td class=\"f\">桑杏汤<\/td><td>舌尖红、苔薄白而干、苔薄黄而干、脉浮数、脉细数<\/td><td class=\"k\">咽喉干痛<\/td><\/tr><tr><td><b>凉燥<\/b><\/td><td>温而不燥，润而不凉<\/td><td class=\"f\">杏苏散<\/td><td>苔薄白而干<\/td><td class=\"k\"><\/td><\/tr><tr><td><b>痰湿蕴肺<\/b><\/td><td>燥湿化痰，理气止咳<\/td><td class=\"f\">二陈平胃散、三子养亲汤<\/td><td>苔白腻、脉濡滑<\/td><td class=\"k\">咳声重浊<\/td><\/tr><tr><td><b>痰热郁肺<\/b><br><small>痰热蕴肺<\/small><\/td><td>清热化痰，肃肺止咳<\/td><td class=\"f\">清金化痰汤<\/td><td>舌红、苔薄黄腻、脉滑数<\/td><td class=\"k\">痰声、热腥味、苔薄黄腻<\/td><\/tr><tr><td><b>肝火犯肺<\/b><\/td><td>清肺泻肝，化痰止咳<\/td><td class=\"f\">黛蛤散、加减泻白散<\/td><td>舌红、苔薄黄少津、脉弦数<\/td><td class=\"k\">情绪波动、上气咳逆、痰滞咽喉<\/td><\/tr><tr><td><b>肺阴亏虚<\/b><br><small>肺阴亏耗<\/small><\/td><td>养阴清热，润肺止咳<\/td><td class=\"f\">沙参麦冬汤<\/td><td>舌红、苔少、脉细数<\/td><td class=\"k\">午后潮热、咳声短促<\/td><\/tr><\/table>", "04-03": "<section id=\"04-03\"><h2>哮病 <small>肺系<\/small><\/h2><p class=\"h\">老师：缓解期 2 题<\/p><p class=\"m\"><b>病机<\/b> 伏痰遇感引触，痰随气升，气因痰阻，相互搏结，壅塞气道　<b>治则<\/b> 发时治标，平时治本<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>寒哮<\/b><br><small>冷哮<\/small><\/td><td>宣肺散寒，化痰平喘<\/td><td class=\"f\">射干麻黄汤、小青龙汤<\/td><td>苔白滑、脉弦紧、脉浮紧<\/td><td class=\"k\">满闷如塞、浮紧<\/td><\/tr><tr><td><b>热哮<\/b><\/td><td>清热宣肺，化痰定喘<\/td><td class=\"f\">定喘汤<\/td><td>舌红、苔黄腻、脉滑数、脉弦滑<\/td><td class=\"k\">气粗息涌、胸高胁胀<\/td><\/tr><tr><td><b>寒包热哮<\/b><\/td><td>解表散寒，清化痰热<\/td><td class=\"f\">小青龙加石膏汤、厚朴麻黄汤<\/td><td>苔白腻罩黄、舌尖红、舌边红、脉弦紧<\/td><td class=\"k\">罩黄、黄白相兼<\/td><\/tr><tr><td><b>风痰哮<\/b><\/td><td>祛风涤痰，降气平喘<\/td><td class=\"f\">三子养亲汤<\/td><td>苔厚浊、脉滑实<\/td><td class=\"k\">拽锯、吹哨笛、曳锯<\/td><\/tr><tr><td><b>虚哮<\/b><\/td><td>补肺纳肾，降气化痰<\/td><td class=\"f\">平喘固本汤<\/td><td>舌紫暗、舌淡、舌红、脉沉细、脉细数<\/td><td class=\"k\">如鼾、持续喘哮<\/td><\/tr><tr><td><b>喘脱危证<\/b><br><small>哮喘脱证<\/small><\/td><td>补肺纳肾，扶正固脱<\/td><td class=\"f\">回阳救急汤、生脉散<\/td><td>舌青暗、苔腻、苔滑、脉浮大无根、脉细数不清<\/td><td class=\"k\">汗出如油、脉浮大无根、喘急面青<\/td><\/tr><tr><td><b>肺虚<\/b><\/td><td>补肺益气<\/td><td class=\"f\">玉屏风散<\/td><td>舌淡、苔白、脉细弱、脉虚大<\/td><td class=\"k\">脉虚大<\/td><\/tr><tr><td><b>脾虚<\/b><\/td><td>健脾益气<\/td><td class=\"f\">六君子汤<\/td><td>舌淡、苔白滑、苔腻、脉细弱<\/td><td class=\"k\">便溏、面色萎黄<\/td><\/tr><tr><td><b>肾虚<\/b><\/td><td>补肾纳气<\/td><td class=\"f\">金匮肾气丸、七味都气丸<\/td><td>舌淡、苔白、舌胖、舌红、苔少、脉沉细、脉细数<\/td><td class=\"k\">呼多吸少、腰酸腿软、脑转耳鸣<\/td><\/tr><\/table>", "04-04": "<section id=\"04-04\"><h2>喘证 <small>肺系<\/small><\/h2><p class=\"h\">老师：病因症状；证型·方 4 题<\/p><p class=\"m\"><b>病机<\/b> 肺气上逆，宣降失职，气无所主，肾失摄纳　<b>治则<\/b> 分清邪正虚实，祛邪利气，培补摄纳<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风寒壅肺<\/b><br><small>风寒袭肺<\/small><\/td><td>宣肺散寒<\/td><td class=\"f\">麻黄汤、华盖散<\/td><td>苔薄白滑、脉浮紧<\/td><td class=\"k\">苔薄白而滑、脉浮紧<\/td><\/tr><tr><td><b>表寒肺热<\/b><br><small>表寒里热<\/small><\/td><td>解表清里，化痰平喘<\/td><td class=\"f\">麻杏石甘汤<\/td><td>舌红、苔薄白、苔薄黄、脉浮数、脉浮滑<\/td><td class=\"k\">喘逆上气、形寒身热<\/td><\/tr><tr><td><b>痰热郁肺<\/b><\/td><td>清热化痰，宣肺平喘<\/td><td class=\"f\">桑白皮汤<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">气涌、喜冷饮<\/td><\/tr><tr><td><b>痰浊阻肺<\/b><\/td><td>祛痰降逆，宣肺平喘<\/td><td class=\"f\">二陈汤、三子养亲汤<\/td><td>舌淡、苔白腻、脉滑、脉濡<\/td><td class=\"k\">胸满闷塞、口黏不渴、胸盈仰息<\/td><\/tr><tr><td><b>肺气郁痹<\/b><br><small>肝气郁痹、肺气郁闭<\/small><\/td><td>开郁降气平喘<\/td><td class=\"f\">五磨饮子<\/td><td>舌红、苔薄白、苔黄、脉弦<\/td><td class=\"k\">咽中如窒、痰鸣不著<\/td><\/tr><tr><td><b>肺气虚耗<\/b><\/td><td>补肺益气<\/td><td class=\"f\">生脉散、补肺汤<\/td><td>舌淡红、舌红、苔少、脉濡弱、脉细数<\/td><td class=\"k\">喘促短气、咳声低弱、喉有鼾声<\/td><\/tr><tr><td><b>肾虚不纳<\/b><\/td><td>补肾纳气<\/td><td class=\"f\">金匮肾气丸、人参蛤蚧散<\/td><td>舌淡、苔白、苔黑润、舌红、舌少津、脉沉弱、脉细数、脉微细<\/td><td class=\"k\">呼多吸少、气不得续、形瘦神惫<\/td><\/tr><tr><td><b>正虚喘脱<\/b><\/td><td>扶阳固脱，镇摄肾气<\/td><td class=\"f\">参附汤、黑锡丹<\/td><td>脉浮大无根、脉微欲绝<\/td><td class=\"k\">浮大无根、汗出如珠、咳喘欲绝<\/td><\/tr><\/table>", "04-05": "<section id=\"04-05\"><h2>肺痈 <small>肺系<\/small><\/h2><p class=\"h\">老师：（「费用」= 肺痈）<\/p><p class=\"m\"><b>病机<\/b> 热伤肺气，蒸液成痰，热壅血瘀，血败肉腐　<b>治则<\/b> 祛邪，清热解毒，化瘀排脓，脓未成清肺消痈，脓已成排脓解毒，有脓必排<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>初期<\/b><\/td><td>疏散风热，清肺化痰，清肺散邪<\/td><td class=\"f\">银翘散<\/td><td>舌尖红、苔薄黄、苔薄白少津、脉浮滑数<\/td><td class=\"k\">痰量由少渐多、口干鼻燥<\/td><\/tr><tr><td><b>成痈期<\/b><\/td><td>清热解毒，化瘀消痈<\/td><td class=\"f\">千金苇茎汤、如金解毒散<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">有腥味、黄绿、振寒<\/td><\/tr><tr><td><b>溃脓期<\/b><\/td><td>排脓解毒<\/td><td class=\"f\">加味桔梗汤<\/td><td>舌红、苔黄腻、脉滑数、脉数实<\/td><td class=\"k\">大量脓血痰、咳吐大量脓痰、腥臭异常<\/td><\/tr><tr><td><b>恢复期<\/b><\/td><td>益气养阴清肺<\/td><td class=\"f\">沙参清肺汤、竹叶石膏汤、桔梗杏仁煎<\/td><td>舌淡红、苔薄、舌红、脉细、脉细数无力<\/td><td class=\"k\">身热渐退、痰液转为清稀<\/td><\/tr><\/table>", "04-06": "<section id=\"04-06\"><h2>肺痨 <small>肺系<\/small><\/h2><p class=\"h\">老师：方 1 · 治法 1 · 证 1<\/p><p class=\"m\"><b>病机<\/b> 痨虫蚀肺，肺阴耗损，阴虚火旺，阴损及阳　<b>治则<\/b> 补虚培元，治痨杀虫<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>肺阴亏损<\/b><\/td><td>滋阴润肺<\/td><td class=\"f\">月华丸<\/td><td>舌红、苔薄少津、脉细、脉细数<\/td><td class=\"k\">手足心热、咳声短促<\/td><\/tr><tr><td><b>虚火灼肺<\/b><\/td><td>补益肺肾，滋阴降火<\/td><td class=\"f\">百合固金汤、秦艽鳖甲散<\/td><td>舌红绛、舌少津、苔薄黄、苔剥、脉细数<\/td><td class=\"k\">盗汗量多、呛咳、时时咯血<\/td><\/tr><tr><td><b>气阴耗伤<\/b><\/td><td>养阴润肺，益气健脾<\/td><td class=\"f\">保真汤<\/td><td>舌红、舌嫩、舌边有齿痕、苔薄、脉细弱而数<\/td><td class=\"k\">血色淡红、咳嗽无力、气短声低<\/td><\/tr><tr><td><b>阴阳两虚<\/b><\/td><td>滋阴补阳，培元固本<\/td><td class=\"f\">补天大造丸<\/td><td>舌红、苔无、舌少津、舌淡、舌胖、舌边有齿痕、脉细数、脉虚大<\/td><td class=\"k\">面浮肢肿、五更泄泻、肢冷<\/td><\/tr><\/table>", "04-07": "<section id=\"04-07\"><h2>肺胀 <small>肺系<\/small><\/h2><p class=\"h\">老师：胸部满；病理性质<\/p><p class=\"m\"><b>病机<\/b> 久病正虚，痰浊、水饮、血瘀互结于肺，气道壅塞，肺气胀满，不能敛降　<b>治则<\/b> 扶正祛邪<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>外寒内饮<\/b><\/td><td>温肺散寒，化饮降逆<\/td><td class=\"f\">小青龙汤<\/td><td>舌胖、舌暗淡、苔白滑、脉浮紧<\/td><td class=\"k\">周身酸楚、脉浮紧、咳痰白稀<\/td><\/tr><tr><td><b>痰浊壅肺<\/b><\/td><td>化痰降气，健脾益肺<\/td><td class=\"f\">三子养亲汤、苏子降气汤<\/td><td>舌暗、苔薄腻、苔浊腻、脉滑<\/td><td class=\"k\">怕风汗多、苔薄腻<\/td><\/tr><tr><td><b>痰热郁肺<\/b><\/td><td>清肺泄热，降逆平喘<\/td><td class=\"f\">越婢加半夏汤、桑白皮汤<\/td><td>舌暗红、苔黄、苔黄腻、脉滑数<\/td><td class=\"k\">目胀睛突、喘息气粗、胸满烦躁<\/td><\/tr><tr><td><b>痰蒙神窍<\/b><\/td><td>涤痰，开窍，息风<\/td><td class=\"f\">涤痰汤<\/td><td>舌暗红、舌淡紫、舌紫绛、苔白腻、苔黄腻、脉细滑数<\/td><td class=\"k\">撮空理线、谵妄、嗜睡<\/td><\/tr><tr><td><b>痰瘀阻肺<\/b><\/td><td>涤痰祛瘀，泻肺平喘<\/td><td class=\"f\">葶苈大枣泻肺汤、桂枝茯苓丸<\/td><td>舌暗、舌紫暗、舌下脉络迂曲增粗、苔腻、苔浊腻、脉弦滑<\/td><td class=\"k\">面色灰白而暗、舌下<\/td><\/tr><tr><td><b>阳虚水泛<\/b><\/td><td>温肾健脾，化饮利水<\/td><td class=\"f\">真武汤、五苓散<\/td><td>舌胖、舌暗、苔白滑、脉沉虚数、脉结、脉代<\/td><td class=\"k\">一身悉肿、面唇青紫<\/td><\/tr><tr><td><b>肺肾气虚<\/b><\/td><td>补肺纳肾，降气平喘<\/td><td class=\"f\">平喘固本汤、补肺汤<\/td><td>舌淡、舌紫暗、苔白润、脉沉细无力<\/td><td class=\"k\">难续、咳声低怯<\/td><\/tr><\/table>", "05-01": "<section id=\"05-01\"><h2>心悸 <small>心系<\/small><\/h2><p class=\"h\">老师：方；治法；舌脉 → 方<\/p><p class=\"m\"><b>病机<\/b> 气血阴阳亏虚，心失所养，邪扰心神，心神不宁　<b>治则<\/b> 分虚实论治，虚证补气养血滋阴温阳，实证祛痰化饮清火行瘀，酌配安神宁心或镇心<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>心虚胆怯<\/b><\/td><td>镇惊定志，养心安神<\/td><td class=\"f\">安神定志丸<\/td><td>苔薄白、脉细数、脉细弦<\/td><td class=\"k\">声响、坐卧不安、善惊易恐<\/td><\/tr><tr><td><b>心血不足<\/b><br><small>气血不足<\/small><\/td><td>补血养心，益气安神<\/td><td class=\"f\">归脾汤<\/td><td>舌淡红、脉细弱<\/td><td class=\"k\">面色无华、产后、细弱<\/td><\/tr><tr><td><b>阴虚火旺<\/b><\/td><td>滋阴清火，养心安神<\/td><td class=\"f\">天王补心丹、朱砂安神丸<\/td><td>舌红、舌少津、苔少、苔无、脉细数<\/td><td class=\"k\">舌红少苔、潮热<\/td><\/tr><tr><td><b>心阳不振<\/b><\/td><td>温补心阳，安神定悸<\/td><td class=\"f\">桂枝甘草龙骨牡蛎汤、参附汤<\/td><td>舌淡、苔白、脉虚弱、脉沉细无力<\/td><td class=\"k\">面色苍白<\/td><\/tr><tr><td><b>水饮凌心<\/b><\/td><td>振奋心阳，化气行水，宁心安神<\/td><td class=\"f\">苓桂术甘汤<\/td><td>舌淡、舌胖、苔白滑、脉弦滑、脉沉细滑<\/td><td class=\"k\">苔白滑、浮肿<\/td><\/tr><tr><td><b>瘀阻心脉<\/b><br><small>心血瘀阻<\/small><\/td><td>活血化瘀，理气通络<\/td><td class=\"f\">桃仁红花煎<\/td><td>舌紫暗、舌有瘀斑、脉涩、脉结、脉代<\/td><td class=\"k\">痛如针刺、唇甲青紫、瘀斑<\/td><\/tr><tr><td><b>痰火扰心<\/b><\/td><td>清热化痰，宁心安神<\/td><td class=\"f\">黄连温胆汤<\/td><td>舌红、苔黄腻、脉弦滑<\/td><td class=\"k\">苔黄腻、口干苦<\/td><\/tr><\/table>", "05-02": "<section id=\"05-02\"><h2>胸痹 <small>心系<\/small><\/h2><p class=\"h\">老师：诊治分类；B 型 证型-推、方 2 题<\/p><p class=\"m\"><b>病机<\/b> 心脉痹阻　<b>治则<\/b> 先治其标，后治其本，标实当泻，尤重活血通脉，本虚宜补，尤重补益心气<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>心血瘀阻<\/b><\/td><td>活血化瘀，通脉止痛<\/td><td class=\"f\">血府逐瘀汤<\/td><td>舌紫暗、舌有瘀点、舌有瘀斑、苔薄、脉弦涩<\/td><td class=\"k\">如刺如绞、刺痛、入夜<\/td><\/tr><tr><td><b>气滞心胸<\/b><\/td><td>疏肝理气，活血通络<\/td><td class=\"f\">柴胡疏肝散<\/td><td>苔薄、苔薄腻、脉细弦<\/td><td class=\"k\">情志、嗳气、太息<\/td><\/tr><tr><td><b>痰浊闭阻<\/b><\/td><td>通阳泄浊，豁痰宣痹<\/td><td class=\"f\">栝蒌薤白半夏汤、涤痰汤<\/td><td>舌胖、舌边有齿痕、苔浊腻、苔白滑、脉滑<\/td><td class=\"k\">痰多、阴雨、脉滑<\/td><\/tr><tr><td><b>寒凝心脉<\/b><\/td><td>辛温散寒，宣通心阳<\/td><td class=\"f\">枳实薤白桂枝汤、当归四逆汤<\/td><td>苔薄白、脉沉紧、脉沉细<\/td><td class=\"k\">心痛如绞、脉沉紧<\/td><\/tr><tr><td><b>气阴两虚<\/b><\/td><td>益气养阴，活血通脉<\/td><td class=\"f\">生脉散、人参养荣汤<\/td><td>舌淡红、舌胖、舌边有齿痕、苔薄白、脉虚细缓、脉结、脉代<\/td><td class=\"k\">虚细<\/td><\/tr><tr><td><b>心肾阴虚<\/b><\/td><td>滋阴清火，养心和络<\/td><td class=\"f\">天王补心丹、炙甘草汤<\/td><td>舌红、舌少津、苔薄、苔剥、脉细数、脉结、脉代、脉促<\/td><td class=\"k\">腰酸、舌红少津<\/td><\/tr><tr><td><b>心肾阳虚<\/b><\/td><td>温补阳气，振奋心阳<\/td><td class=\"f\">参附汤、右归饮<\/td><td>舌淡、舌胖、舌边有齿痕、苔白、苔腻、脉沉细迟<\/td><td class=\"k\">心悸而痛、晄白、沉细迟<\/td><\/tr><\/table>", "05-03": "<section id=\"05-03\"><h2>心衰 <small>心系<\/small><\/h2><p class=\"h\">老师：B 型 2 证<\/p><p class=\"m\"><b>病机<\/b> 心之气血阴阳亏损，血脉瘀阻，痰浊水饮停聚，虚瘀痰水　<b>治则<\/b> 补虚泻实，益气养阴温阳，活血化痰利水<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>气虚血瘀<\/b><\/td><td>益气温阳，活血祛瘀<\/td><td class=\"f\">保元汤、血府逐瘀汤<\/td><td>舌淡、舌胖、舌暗淡、舌有瘀斑、脉沉细、脉涩、脉结、脉代<\/td><td class=\"k\">肢肿时作、㑿白<\/td><\/tr><tr><td><b>气阴两虚<\/b><\/td><td>益气养阴，活血通脉<\/td><td class=\"f\">生脉散<\/td><td>舌暗红、苔少、舌少津、脉细数无力、脉结、脉代<\/td><td class=\"k\">五心烦热、手足心热、入夜尤甚<\/td><\/tr><tr><td><b>阳虚水泛<\/b><\/td><td>益气温阳，活血利水<\/td><td class=\"f\">真武汤、葶苈大枣泻肺汤<\/td><td>舌淡、舌胖、舌边有齿痕、舌有瘀点、舌有瘀斑、脉沉细、脉结、脉代、脉促<\/td><td class=\"k\">面浮肢肿、畏寒、形寒<\/td><\/tr><tr><td><b>喘脱危证<\/b><\/td><td>益气回阳固脱<\/td><td class=\"f\">四逆加人参汤<\/td><td>舌淡、苔白、脉微欲绝、脉疾数无力<\/td><td class=\"k\">不休、欲绝、额汗如油<\/td><\/tr><\/table>", "05-04": "<section id=\"05-04\"><h2>不寐 <small>心系<\/small><\/h2><p class=\"h\">老师：方 2；肝火 / 痰热 / 心脾两虚；睡不好：证 → 治法 → 方<\/p><p class=\"m\"><b>病机<\/b> 阳盛阴衰，阴阳失交　<b>治则<\/b> 补虚泻实，调整阴阳，佐以安神定志<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>肝火扰心<\/b><\/td><td>疏肝泻热，镇心安神<\/td><td class=\"f\">龙胆泻肝汤<\/td><td>舌红、苔黄、脉弦数<\/td><td class=\"k\">急躁易怒、目赤、脉弦数<\/td><\/tr><tr><td><b>痰热扰心<\/b><\/td><td>清化痰热，和中安神<\/td><td class=\"f\">黄连温胆汤<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">苔黄腻、脉滑数、头重<\/td><\/tr><tr><td><b>心脾两虚<\/b><\/td><td>补益心脾，养血安神<\/td><td class=\"f\">归脾汤<\/td><td>舌淡、苔薄、脉细弱<\/td><td class=\"k\">面色少华、多梦易醒、细弱<\/td><\/tr><tr><td><b>心肾不交<\/b><\/td><td>滋阴降火，交通心肾<\/td><td class=\"f\">六味地黄丸、交泰丸<\/td><td>舌红、苔少、脉细数<\/td><td class=\"k\">腰膝酸软、五心烦热、脉细数<\/td><\/tr><tr><td><b>心胆气虚<\/b><\/td><td>益气镇惊，安神定志<\/td><td class=\"f\">安神定志丸、酸枣仁汤<\/td><td>舌淡、脉细弦<\/td><td class=\"k\">终日惕惕、胆怯、触事易惊<\/td><\/tr><tr><td><b>湿盛困脾<\/b><\/td><td>燥湿健脾，醒神开窍<\/td><td class=\"f\">平胃散<\/td><td>舌淡、苔腻、脉濡<\/td><td class=\"k\">头蒙如裹、肢体沉重、脉濡<\/td><\/tr><tr><td><b>瘀血阻滞<\/b><\/td><td>活血通络<\/td><td class=\"f\">通窍活血汤<\/td><td>舌紫暗、舌有瘀斑、脉涩<\/td><td class=\"k\">外伤史、脉涩<\/td><\/tr><tr><td><b>脾气虚弱<\/b><\/td><td>健脾益气<\/td><td class=\"f\">香砂六君子汤<\/td><td>苔薄白、脉虚弱<\/td><td class=\"k\">饭后尤甚、面色萎黄<\/td><\/tr><tr><td><b>阳气虚弱<\/b><br><small>阳气虚衰<\/small><\/td><td>益气温阳<\/td><td class=\"f\">附子理中丸<\/td><td>舌淡、苔薄、脉沉细无力<\/td><td class=\"k\">畏寒肢冷、心神昏浊<\/td><\/tr><\/table>", "06-01": "<section id=\"06-01\"><h2>头痛 <small>脑系<\/small><\/h2><p class=\"h\">老师：方（天麻：肝阳 / 痰）；证<\/p><p class=\"m\"><b>病机<\/b> 外邪上扰清空，壅滞经络，络脉不通，肝脾肾三脏失调　<b>治则<\/b> 外感以祛风为主，兼以散寒、清热、祛湿，内伤虚证补养气血或益肾填精，内伤实证平肝、化痰、行瘀，虚实夹杂补虚泻实<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风寒头痛<\/b><\/td><td>疏散风寒止痛<\/td><td class=\"f\">川芎茶调散<\/td><td>舌淡红、苔薄白、脉浮、脉浮紧<\/td><td class=\"k\">喜裹、遇风尤剧<\/td><\/tr><tr><td><b>风热头痛<\/b><\/td><td>疏风清热和络<\/td><td class=\"f\">芎芷石膏汤<\/td><td>舌尖红、苔薄黄、脉浮数<\/td><td class=\"k\">如裂、脉浮数<\/td><\/tr><tr><td><b>风湿头痛<\/b><\/td><td>祛风胜湿通窍<\/td><td class=\"f\">羌活胜湿汤<\/td><td>舌淡、苔白腻、脉濡<\/td><td class=\"k\">如裹、肢体困重、脉濡<\/td><\/tr><tr><td><b>肝阳头痛<\/b><\/td><td>平肝潜阳息风<\/td><td class=\"f\">天麻钩藤饮<\/td><td>舌红、苔薄黄、脉弦数<\/td><td class=\"k\">而眩、脉弦数<\/td><\/tr><tr><td><b>血虚头痛<\/b><\/td><td>滋阴养血，和络止痛<\/td><td class=\"f\">加味四物汤<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">心悸怔忡、面色少华<\/td><\/tr><tr><td><b>气虚头痛<\/b><\/td><td>健脾益气升清<\/td><td class=\"f\">益气聪明汤<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">时发时止<\/td><\/tr><tr><td><b>痰浊头痛<\/b><br><small>痰湿头痛<\/small><\/td><td>健脾燥湿，化痰降逆<\/td><td class=\"f\">半夏白术天麻汤<\/td><td>舌淡、苔白腻、脉滑、脉弦滑<\/td><td class=\"k\">昏蒙<\/td><\/tr><tr><td><b>肾虚头痛<\/b><\/td><td>养阴补肾，填精生髓<\/td><td class=\"f\">大补元煎<\/td><td>舌红、苔少、脉细弱<\/td><td class=\"k\">且空、少寐健忘<\/td><\/tr><tr><td><b>瘀血头痛<\/b><\/td><td>活血化瘀，通窍止痛<\/td><td class=\"f\">通窍活血汤<\/td><td>舌紫暗、舌有瘀斑、舌有瘀点、苔薄白、脉细、脉细涩<\/td><td class=\"k\">锥刺、外伤、固定不移<\/td><\/tr><\/table>", "06-02": "<section id=\"06-02\"><h2>眩晕 <small>脑系<\/small><\/h2><p class=\"h\">老师：证（不是 xx 的症状）；晕+无力：肾虚、气血虚<\/p><p class=\"m\"><b>病机<\/b> 本虚：肝肾亏虚，气血不足，髓海不足，清窍失养，标实：风、火、痰、瘀，扰乱清窍，本虚标实，以虚证居多　<b>治则<\/b> 补虚泻实，调整阴阳<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>肝阳上亢<\/b><\/td><td>平肝潜阳，清火息风<\/td><td class=\"f\">天麻钩藤饮<\/td><td>舌红、苔黄、脉弦、脉数<\/td><td class=\"k\">郁怒、潮红、肢麻震颤<\/td><\/tr><tr><td><b>痰湿中阻<\/b><br><small>痰浊中阻<\/small><\/td><td>化痰祛湿，健脾和胃<\/td><td class=\"f\">半夏白术天麻汤<\/td><td>苔白腻、脉濡滑<\/td><td class=\"k\">多寐、痰涎、头重如<\/td><\/tr><tr><td><b>瘀血阻窍<\/b><\/td><td>祛瘀生新，活血通窍<\/td><td class=\"f\">通窍活血汤<\/td><td>舌暗、舌有瘀斑、舌下脉络迂曲增粗、脉涩、脉细涩<\/td><td class=\"k\">定处、紫暗、瘀斑<\/td><\/tr><tr><td><b>气血亏虚<\/b><\/td><td>补益气血，调养心脾<\/td><td class=\"f\">归脾汤<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">动则加剧、唇甲不华<\/td><\/tr><tr><td><b>肾精不足<\/b><\/td><td>滋养肝肾，填精益髓<\/td><td class=\"f\">左归丸<\/td><td>舌红、苔少、舌淡、舌嫩、苔白、脉细数、脉沉细无力<\/td><td class=\"k\">精神萎靡<\/td><\/tr><\/table>", "06-03": "<section id=\"06-03\"><h2>中风 <small>脑系<\/small><\/h2><p class=\"h\">老师：方；B 型 代表方<\/p><p class=\"m\"><b>病机<\/b> 阴阳失调，气血逆乱，上犯于脑　<b>治则<\/b> 急性期治标祛邪，中脏腑醒神开窍，闭证清热开窍或化痰开窍，脱证回阳固脱，内闭外脱醒神开窍与扶正固本兼用，恢复期扶正祛邪，标本兼顾<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风痰入络<\/b><br><small>风痰阻络<\/small><\/td><td>息风化痰，活血通络<\/td><td class=\"f\">半夏白术天麻汤、桃仁红花煎<\/td><td>舌暗淡、苔白腻、脉弦滑<\/td><td class=\"k\">口角流涎<\/td><\/tr><tr><td><b>风阳上扰<\/b><\/td><td>清肝泻火，息风潜阳<\/td><td class=\"f\">天麻钩藤饮<\/td><td>舌红、舌红绛、苔薄黄、脉弦有力<\/td><td class=\"k\">手足重滞<\/td><\/tr><tr><td><b>阴虚风动<\/b><\/td><td>滋养肝肾，潜阳息风<\/td><td class=\"f\">镇肝息风汤<\/td><td>舌红绛、舌暗红、苔少、苔无、脉细弦、脉细弦数<\/td><td class=\"k\">多梦、双目干涩<\/td><\/tr><tr><td><b>痰热腑实<\/b><\/td><td>通腑泄热，息风化痰<\/td><td class=\"f\">桃仁承气汤<\/td><td>舌暗红、苔黄腻、脉弦滑、脉弦涩<\/td><td class=\"k\">咳黏稠痰<\/td><\/tr><tr><td><b>痰火瘀闭<\/b><br><small>阳闭<\/small><\/td><td>息风清火，豁痰开窍<\/td><td class=\"f\">羚角钩藤汤、至宝丹、安宫牛黄丸<\/td><td>苔黄腻、脉弦滑数<\/td><td class=\"k\">身热、气粗、躁扰<\/td><\/tr><tr><td><b>痰浊瘀闭<\/b><br><small>阴闭<\/small><\/td><td>化痰息风，宣郁开窍<\/td><td class=\"f\">涤痰汤、苏合香丸<\/td><td>苔白腻、脉沉滑缓<\/td><td class=\"k\">静卧不烦、面白唇暗<\/td><\/tr><tr><td><b>脱证<\/b><\/td><td>回阳救逆，益气固脱<\/td><td class=\"f\">参附汤、生脉散<\/td><td>舌痿、脉细弱、脉微欲绝<\/td><td class=\"k\">目合口张、自遗、手撒<\/td><\/tr><tr><td><b>风痰瘀阻<\/b><\/td><td>搜风化痰，行瘀通络<\/td><td class=\"f\">解语丹<\/td><td>舌紫暗、舌有瘀斑、苔滑腻、脉弦滑、脉涩<\/td><td class=\"k\">舌喑<\/td><\/tr><tr><td><b>气虚血瘀<\/b><br><small>气虚络瘀<\/small><\/td><td>益气扶正，益气养血，化瘀通络<\/td><td class=\"f\">补阳还五汤<\/td><td>舌淡紫、舌有瘀斑、苔薄白、脉细涩、脉细弱<\/td><td class=\"k\">肢软无力、气短乏力<\/td><\/tr><tr><td><b>肝肾亏虚<\/b><\/td><td>滋养肝肾<\/td><td class=\"f\">左归丸、地黄饮子<\/td><td>舌红、舌淡红、脉细、脉沉细<\/td><td class=\"k\">拘挛变形、僵硬<\/td><\/tr><\/table>", "06-04": "<section id=\"06-04\"><h2>痴呆 <small>脑系<\/small><\/h2><p class=\"h\">老师：舌脉；方（xx 证的代表方）；B 型 证型<\/p><p class=\"m\"><b>病机<\/b> 髓减脑消，神机失用　<b>治则<\/b> 补虚泻实，平台期重在补肾，波动期重在治痰，下滑期解毒为急<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>髓海不足<\/b><\/td><td>滋补肝肾，填精补髓<\/td><td class=\"f\">七福饮<\/td><td>舌瘦、舌淡、脉沉细<\/td><td class=\"k\">齿枯发焦、步履艰难、忘失前后<\/td><\/tr><tr><td><b>脾肾亏虚<\/b><br><small>脾肾两虚<\/small><\/td><td>温补脾肾，养元安神<\/td><td class=\"f\">还少丹<\/td><td>舌淡、舌胖、舌边有齿痕、苔白、苔腻、脉沉细无力、脉两尺尤甚<\/td><td class=\"k\">夜尿频多、小便混浊、口涎外溢<\/td><\/tr><tr><td><b>气血不足<\/b><\/td><td>益气健脾，养血安神<\/td><td class=\"f\">归脾汤<\/td><td>舌淡、苔白、脉细弱<\/td><td class=\"k\">爪甲苍白、面唇无华、善忘茫然<\/td><\/tr><tr><td><b>痰浊蒙窍<\/b><\/td><td>化痰开窍，健脾醒神<\/td><td class=\"f\">洗心汤<\/td><td>苔浊腻、脉弦滑<\/td><td class=\"k\">洁秽不分、涎沫、口吐痰涎<\/td><\/tr><tr><td><b>瘀阻脑络<\/b><br><small>瘀血内阻<\/small><\/td><td>活血化瘀，通窍醒神<\/td><td class=\"f\">通窍活血汤<\/td><td>舌紫暗、舌有瘀斑、脉细弦、脉沉迟<\/td><td class=\"k\">半身不遂、头痛难愈、瘀斑<\/td><\/tr><tr><td><b>心肝火旺<\/b><\/td><td>清心平肝，安神定志<\/td><td class=\"f\">天麻钩藤饮<\/td><td>舌红、舌红绛、苔黄、苔黄腻、脉弦滑、脉弦数<\/td><td class=\"k\">耳鸣如潮、口臭、妄闻妄见<\/td><\/tr><tr><td><b>热毒内盛<\/b><\/td><td>清热解毒，通络达邪<\/td><td class=\"f\">黄连解毒汤<\/td><td>舌红绛、苔少、苔浊腻、苔腐秽厚积、脉数<\/td><td class=\"k\">迷蒙昏睡、无欲无语、腐秽厚积<\/td><\/tr><\/table>", "06-05": "<section id=\"06-05\"><h2>癫狂 <small>脑系<\/small><\/h2><p class=\"h\">老师：治法；方 1（重金属 = 重镇）<\/p><p class=\"m\"><b>病机<\/b> 脏腑功能失调，阴阳失于平衡，蒙蔽心窍，心神被扰，神明逆乱　<b>治则<\/b> 调整阴阳，以平为期，理气解郁，泻火豁痰，化瘀通窍，补益心脾，滋阴养血<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>痰气郁结<\/b><\/td><td>疏肝解郁，化痰醒神<\/td><td class=\"f\">逍遥散、涤痰汤<\/td><td>舌红、苔白腻、脉弦滑<\/td><td class=\"k\">时时太息、多疑多虑、苔白腻<\/td><\/tr><tr><td><b>心脾两虚<\/b><\/td><td>健脾养心，解郁安神<\/td><td class=\"f\">养心汤、越鞠丸<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">魂梦颠倒、神思恍惚、善悲欲哭<\/td><\/tr><tr><td><b>痰火扰神<\/b><\/td><td>镇心涤痰，清肝泻火<\/td><td class=\"f\">生铁落饮<\/td><td>舌红绛、苔黄腻、脉弦滑数<\/td><td class=\"k\">骂詈、毁物、怒视<\/td><\/tr><tr><td><b>痰热瘀结<\/b><\/td><td>豁痰化瘀，调畅气血<\/td><td class=\"f\">癫狂梦醒汤<\/td><td>舌紫暗、舌有瘀斑、苔少、苔薄黄而干、脉细弦、脉细涩<\/td><td class=\"k\">面色晦滞、妄思离奇<\/td><\/tr><tr><td><b>火盛阴伤<\/b><br><small>火盛伤阴<\/small><\/td><td>滋阴降火，安神定志<\/td><td class=\"f\">二阴煎、琥珀养心丹<\/td><td>舌红、苔少、苔无、脉细数<\/td><td class=\"k\">时作时止、五心烦热、形瘦面红<\/td><\/tr><\/table>", "06-06": "<section id=\"06-06\"><h2>痫证 <small>脑系<\/small><\/h2><p class=\"h\">老师：抽搐 → 证型；四肢抽搐 → 病<\/p><p class=\"m\"><b>病机<\/b> 气机逆乱，元神失控　<b>治则<\/b> 发作期治标，休止期治本，清泻肝火，豁痰息风，开窍定痫，健脾化痰，滋补肝肾，养心安神<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>阳痫<\/b><\/td><td>开窍醒神，泻热涤痰息风<\/td><td class=\"f\">黄连解毒汤、定痫丸<\/td><td>舌红、苔白腻、苔黄腻、脉弦数、脉弦滑<\/td><td class=\"k\">牙关紧闭、项背强直<\/td><\/tr><tr><td><b>阴痫<\/b><\/td><td>开窍醒神，温化痰涎，顺气定痫<\/td><td class=\"f\">五生饮、二陈汤<\/td><td>舌淡、苔白腻、脉沉细、脉沉迟<\/td><td class=\"k\">半开半合、数秒至数分钟、手足清冷<\/td><\/tr><tr><td><b>肝火痰热<\/b><\/td><td>清肝泻火，化痰宁心<\/td><td class=\"f\">龙胆泻肝汤、涤痰汤<\/td><td>舌红、苔黄腻、脉弦滑数<\/td><td class=\"k\">目赤、咳痰不爽<\/td><\/tr><tr><td><b>脾虚痰盛<\/b><\/td><td>健脾化痰<\/td><td class=\"f\">六君子汤<\/td><td>舌淡、苔白腻、脉濡滑、脉弦细滑<\/td><td class=\"k\">胸脘痞闷、蜷卧拘急、脉濡滑<\/td><\/tr><tr><td><b>肝肾阴虚<\/b><\/td><td>滋养肝肾，填精益髓<\/td><td class=\"f\">大补元煎<\/td><td>舌红、苔薄白、苔薄黄少津、脉沉细数<\/td><td class=\"k\">干涩、腰膝酸软、耳轮焦枯<\/td><\/tr><tr><td><b>瘀阻脑络<\/b><\/td><td>活血化瘀，息风通络<\/td><td class=\"f\">通窍活血汤<\/td><td>舌暗红、舌有瘀斑、苔薄白、脉涩、脉弦<\/td><td class=\"k\">侧肢体抽搐、瘀斑、脉涩<\/td><\/tr><\/table>", "07-01": "<section id=\"07-01\"><h2>胃痛 <small>脾胃<\/small><\/h2><p class=\"h\">老师：治法；主要症状；B 型 方药<\/p><p class=\"m\"><b>病机<\/b> 胃气郁滞，失于和降，不通则痛　<b>治则<\/b> 理气和胃止痛，通则不痛<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>寒邪客胃<\/b><br><small>寒邪犯胃<\/small><\/td><td>温胃散寒，理气止痛<\/td><td class=\"f\">良附丸<\/td><td>苔薄白、脉弦紧<\/td><td class=\"k\">暴作、冷痛、恶寒喜暖<\/td><\/tr><tr><td><b>饮食伤胃<\/b><br><small>宿食积滞<\/small><\/td><td>消食导滞，和中止痛<\/td><td class=\"f\">保和丸<\/td><td>苔厚腻、脉滑<\/td><td class=\"k\">嗳腐吞酸、吐后痛减、腐臭<\/td><\/tr><tr><td><b>肝气犯胃<\/b><\/td><td>疏肝理气，和胃止痛<\/td><td class=\"f\">柴胡疏肝散<\/td><td>苔薄白、脉弦<\/td><td class=\"k\">痛连两胁、连及两胁、叹息<\/td><\/tr><tr><td><b>肝胃郁热<\/b><\/td><td>疏肝泻热，和胃止痛<\/td><td class=\"f\">化肝煎<\/td><td>舌红、苔黄、脉弦、脉数<\/td><td class=\"k\">身体烦热、烦热不安<\/td><\/tr><tr><td><b>湿热中阻<\/b><\/td><td>清化湿热，理气和胃<\/td><td class=\"f\">清中汤<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">苔黄腻、口渴不欲饮、脘痞腹胀<\/td><\/tr><tr><td><b>瘀血停滞<\/b><\/td><td>化瘀通络，理气和胃<\/td><td class=\"f\">失笑散、丹参饮<\/td><td>舌紫暗、舌有瘀斑、脉涩<\/td><td class=\"k\">刺痛、脉涩、痛有定处<\/td><\/tr><tr><td><b>脾胃虚寒<\/b><\/td><td>温中健脾，和胃止痛<\/td><td class=\"f\">黄芪建中汤<\/td><td>舌淡、苔白、脉虚缓无力<\/td><td class=\"k\">空腹痛甚、绵绵不休、喜温喜按<\/td><\/tr><tr><td><b>胃阴不足<\/b><\/td><td>养阴益胃，和中止痛<\/td><td class=\"f\">益胃汤<\/td><td>舌红、舌少津、苔无、脉弦细无力<\/td><td class=\"k\">隐隐灼痛、脉细数、饥不欲食<\/td><\/tr><tr><td><b>热证<\/b><br><small>吐酸热证<\/small><\/td><td>清泻肝火，和胃降逆<\/td><td class=\"f\">左金丸<\/td><td>舌红、苔黄、脉弦数<\/td><td class=\"k\">呛咳<\/td><\/tr><tr><td><b>寒证<\/b><br><small>吐酸寒证<\/small><\/td><td>温中散寒，宽胸下气<\/td><td class=\"f\">香砂六君子汤<\/td><td>舌淡、苔白、脉沉迟<\/td><td class=\"k\">喜唾涎沫<\/td><\/tr><tr><td><b>胃热<\/b><br><small>嘈杂胃热<\/small><\/td><td>清热化痰，降逆和中<\/td><td class=\"f\">黄连温胆汤<\/td><td>舌红、苔黄燥、脉滑数<\/td><td class=\"k\">口渴喜冷、口臭、苔黄干<\/td><\/tr><tr><td><b>胃虚<\/b><br><small>嘈杂胃虚<\/small><\/td><td>益气健脾，调畅气机<\/td><td class=\"f\">四君子汤<\/td><td>舌淡、脉虚<\/td><td class=\"k\">口淡无味、食后脘胀<\/td><\/tr><tr><td><b>血虚<\/b><br><small>嘈杂血虚<\/small><\/td><td>益气养血，健脾和胃<\/td><td class=\"f\">归脾汤<\/td><td>舌淡、脉细弱<\/td><td class=\"k\">面白唇淡、失眠多梦<\/td><\/tr><\/table>", "07-02": "<section id=\"07-02\"><h2>胃痞 <small>脾胃<\/small><\/h2><p class=\"h\">老师：脾胃 治法；2 方<\/p><p class=\"m\"><b>病机<\/b> 中焦气机不利，脾胃升降失职　<b>治则<\/b> 调理脾胃升降，行气除痞消满，实者泻之，虚者补之，虚实夹杂者补泻并用，用药不可过于峻猛<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>饮食内停<\/b><\/td><td>消食和胃，行气消痞<\/td><td class=\"f\">保和丸<\/td><td>苔厚腻、脉滑<\/td><td class=\"k\">进食尤甚、败卵、嗳腐吞酸<\/td><\/tr><tr><td><b>痰湿中阻<\/b><\/td><td>除湿化痰，理气和中<\/td><td class=\"f\">平胃散、二陈汤<\/td><td>苔白厚腻、脉沉滑<\/td><td class=\"k\">身重困倦、苔白厚腻<\/td><\/tr><tr><td><b>湿热阻胃<\/b><\/td><td>清热化湿，和胃消痞<\/td><td class=\"f\">泻心汤、连朴饮<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">灼热嘈杂、苔黄腻<\/td><\/tr><tr><td><b>肝胃不和<\/b><\/td><td>疏肝解郁，和胃消痞<\/td><td class=\"f\">越鞠丸、枳术丸<\/td><td>舌淡红、苔薄白、脉弦<\/td><td class=\"k\">太息、易怒、胸胁胀满<\/td><\/tr><tr><td><b>脾胃虚弱<\/b><\/td><td>补气健脾，升清降浊<\/td><td class=\"f\">补中益气汤<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">喜温喜按、纳呆便溏、少气懒言<\/td><\/tr><tr><td><b>胃阴不足<\/b><\/td><td>养阴益胃，调中消痞<\/td><td class=\"f\">益胃汤<\/td><td>舌红、苔少、脉细数<\/td><td class=\"k\">饥不欲食、口燥咽干、舌红少苔<\/td><\/tr><\/table>", "07-03": "<section id=\"07-03\"><h2>呕吐 <small>脾胃<\/small><\/h2><p class=\"h\">老师：治法；方；证型（脉细数）<\/p><p class=\"m\"><b>病机<\/b> 胃失和降，胃气上逆　<b>治则<\/b> 和胃降逆，实者祛邪，虚者扶正，虚实夹杂者标本兼顾<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>外邪犯胃<\/b><\/td><td>疏邪解表，化浊和中，降逆止呕<\/td><td class=\"f\">藿香正气散<\/td><td>苔白腻、脉濡<\/td><td class=\"k\">头身疼痛<\/td><\/tr><tr><td><b>饮食停滞<\/b><br><small>宿食留胃、饮食积滞<\/small><\/td><td>消食化滞，和胃降逆<\/td><td class=\"f\">保和丸<\/td><td>苔厚腻、脉滑实<\/td><td class=\"k\">酸腐、厌食、臭秽<\/td><\/tr><tr><td><b>痰饮内阻<\/b><\/td><td>温化痰饮，和胃降逆<\/td><td class=\"f\">小半夏汤、苓桂术甘汤<\/td><td>苔白滑、苔腻、脉沉弦滑<\/td><td class=\"k\">清水痰涎、如囊裹水<\/td><\/tr><tr><td><b>肝气犯胃<\/b><\/td><td>疏肝和胃，降逆止呕<\/td><td class=\"f\">半夏厚朴汤、左金丸<\/td><td>舌边红、苔薄腻、苔微黄、脉弦<\/td><td class=\"k\">脘胁胀痛、情志、呕吐吞酸<\/td><\/tr><tr><td><b>脾胃虚寒<\/b><\/td><td>温中健脾，和胃降逆<\/td><td class=\"f\">理中丸<\/td><td>舌淡、脉濡弱<\/td><td class=\"k\">食入难化、四肢不温<\/td><\/tr><tr><td><b>胃阴不足<\/b><br><small>胃阴亏虚<\/small><\/td><td>滋养胃阴，降逆止呕<\/td><td class=\"f\">麦门冬汤<\/td><td>舌红、舌少津、苔少、脉细数<\/td><td class=\"k\">似饥而不欲食、少津<\/td><\/tr><\/table>", "07-04": "<section id=\"07-04\"><h2>噎膈 <small>脾胃<\/small><\/h2><p class=\"h\">老师：（yuge = 噎膈）2 个证 · 方<\/p><p class=\"m\"><b>病机<\/b> 气、痰、瘀交结，阻隔食管、贲门　<b>治则<\/b> 初期治标：理气、化痰、消瘀，后期治本：滋阴润燥，或补气温阳，虚实兼杂标本同治，顾护津液及胃气<\/p><table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>痰气交阻<\/b><\/td><td>开郁化痰，润燥降气<\/td><td class=\"f\">启膈散<\/td><td>舌红、苔薄腻、脉弦滑<\/td><td class=\"k\">情志、脉弦滑<\/td><\/tr><tr><td><b>津亏热结<\/b><\/td><td>滋阴清热，润燥生津<\/td><td class=\"f\">沙参麦冬汤<\/td><td>舌红、苔无、舌有裂纹、舌少津、脉细数<\/td><td class=\"k\">羊粪、细数、梗涩<\/td><\/tr><tr><td><b>瘀血内结<\/b><\/td><td>破结行瘀，滋阴养血<\/td><td class=\"f\">通幽汤<\/td><td>舌紫暗、脉细涩<\/td><td class=\"k\">赤豆汁、肌肤甲错、紫暗<\/td><\/tr><tr><td><b>气虚阳微<\/b><\/td><td>温补脾肾<\/td><td class=\"f\">补气运脾汤<\/td><td>舌淡、苔白、脉细弱<\/td><td class=\"k\">面浮足肿、形寒气短、脉细弱<\/td><\/tr><tr><td><b>脾胃虚寒<\/b><\/td><td>温中健脾，和胃降逆<\/td><td class=\"f\">丁香透膈汤<\/td><td>舌淡、苔白腻、脉细缓无力<\/td><td class=\"k\">朝食暮吐、宿谷不化、吐后则舒<\/td><\/tr><\/table>"}, "head": "", "qs": [{"id": "hw#1", "c": "04-01", "cn": "感冒", "t": "A1型", "q": "感冒的发病季节，以何者为多见", "o": [["A", "春冬"], ["B", "秋冬"], ["C", "春秋"], ["D", "夏秋"], ["E", "春夏"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "感冒四季可发，以冬春两季最多：冬季风寒当令，春季风气主令、气候多变，人体卫外易失。记：冬寒春风 → 感冒高发；夏多夹暑湿、秋多夹燥，只是兼夹而非高峰。", "ol": {"A": "春冬：正确。冬春风寒当令、气候骤变，最易外感。", "B": "秋冬：秋季多燥邪，非发病最多的季节。", "C": "春秋：秋季不是高峰。", "D": "夏秋：夏秋多见暑湿感冒，是兼夹类型，不是最多。", "E": "春夏：夏季发病少，且多为暑湿。"}, "hl": []}, {"id": "hw#2", "c": "04-01", "cn": "感冒", "t": "A1型", "q": "荆防败毒散主要用于", "o": [["A", "风寒感冒"], ["B", "风热感冒"], ["C", "阴虚感冒"], ["D", "气虚感冒"], ["E", "暑湿感冒"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["04-01-1"], "B": ["04-01-2"], "C": ["04-01-5"], "D": ["04-01-4"], "E": ["04-01-3"]}, "z": "04-01-1", "why": "荆防败毒散（荆芥、防风、羌活、独活、柴胡、前胡等）辛温解表、宣肺散寒，是风寒束表证主方（另有荆防达表汤）。记：荆防 = 辛温散风寒。", "ol": {"A": "风寒感冒：正确。恶寒重发热轻、无汗、流清涕、脉浮紧，辛温解表。", "B": "风热感冒：用银翘散，辛凉解表，荆防辛温反助热。", "C": "阴虚感冒：用加减葳蕤汤滋阴解表。", "D": "气虚感冒：用参苏饮益气解表。", "E": "暑湿感冒：用新加香薷饮清暑祛湿解表。"}, "hl": [["荆防败毒散", "k"]]}, {"id": "hw#3", "c": "04-01", "cn": "感冒", "t": "A2型", "q": "林某，男，64岁。患者近一月来寒热持续不解，恶寒重，发热轻，四肢欠温，语音低微，舌质淡胖，脉沉细无力。治疗宜首选", "o": [["A", "荆防败毒散"], ["B", "葱豉桔梗汤"], ["C", "参苏饮"], ["D", "麻黄附子细辛汤"], ["E", "加减葳蕤汤"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["04-01-1"], "C": ["04-01-4"], "D": ["04-01-6"], "E": ["04-01-5"]}, "z": "04-01-6", "why": "64岁、寒热月余不解，恶寒重发热轻 + 四肢欠温、语音低微、舌淡胖、脉沉细无力 → 阳虚感冒，助阳解表，首选麻黄附子细辛汤。决定点在脉：风寒束表也恶寒重发热轻，但脉浮紧；气虚感冒脉浮无力；此为沉细无力、肢冷，属阳虚。", "ol": {"A": "荆防败毒散：风寒束表，脉浮紧、阳不虚；单纯发散会更伤阳气。", "B": "葱豉桔梗汤：辛凉轻剂，用于风热初起，与本例寒象相反。", "C": "参苏饮：气虚感冒，脉浮无力、以气短乏力为主；本例肢冷、脉沉，已是阳虚。", "D": "麻黄附子细辛汤：正确。阳虚外感，温阳与解表并施。", "E": "加减葳蕤汤：阴虚感冒，舌红少苔、脉细数，与舌淡胖相反。"}, "hl": [["恶寒重，发热轻", "k"], ["脉沉细无力", "k"], ["四肢欠温", "k"], ["语音低微", "k"], ["恶寒重", "s"], ["发热轻", "s"]]}, {"id": "hw#4", "c": "04-02", "cn": "咳嗽", "t": "A2型", "q": "李某，男，42岁。患者咳嗽1月，迁延不愈，喉痒，咯痰不畅，仍伴鼻塞，流清涕。此时选用何方", "o": [["A", "荆防败毒散"], ["B", "三拗汤"], ["C", "三子养亲汤"], ["D", "清金化痰汤"], ["E", "止嗽散"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["04-01-1"], "B": ["04-02-1"], "C": ["04-02-5"], "D": ["04-02-6"], "E": ["04-02-1"]}, "z": "04-02-1", "why": "咳嗽1月迁延不愈 + 喉痒、咯痰不畅 + 仍有鼻塞清涕 → 风寒袭肺、表邪未尽的久咳。止嗽散疏风宣肺、止咳化痰，专治外感咳嗽迁延、表邪未尽；三拗汤偏宣肺散寒，用于新起、表寒重。", "ol": {"A": "荆防败毒散：风寒感冒主方，以恶寒发热、头身痛为主，不是止咳方。", "B": "三拗汤：风寒咳嗽新起、表寒较重时用；本例已迁延1月，表邪仅余未尽。", "C": "三子养亲汤：痰湿蕴肺（痰多胸闷、苔白腻），降气化痰；本例咯痰不畅、痰不多。", "D": "清金化痰汤：痰热郁肺（痰黄稠、舌红苔黄腻）；本例流清涕属寒。", "E": "止嗽散：正确。疏风宣肺、止咳化痰，治外感久咳、表邪未尽、喉痒。"}, "hl": [["迁延不愈", "k"], ["咯痰不畅", "k"], ["流清涕", "k"], ["清涕", "k"], ["喉痒", "k"], ["鼻塞", "s"]]}, {"id": "hw#5", "c": "04-02", "cn": "咳嗽", "t": "A1型", "q": "痰湿蕴肺型咳嗽的主症特点为", "o": [["A", "咳声气促，痰多质粘"], ["B", "咳声重浊，痰黄量少"], ["C", "咳嗽频剧，痰少而粘"], ["D", "咳声重浊，痰多胸闷"], ["E", "咳嗽气促，痰黄稠厚"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "痰湿蕴肺：因痰而嗽、咳声重浊，痰多色白黏腻，伴胸闷脘痞、苔白腻脉濡滑。“重浊 + 痰多 + 胸闷”三点齐全只有 D；B 虽有重浊，但痰黄量少属热。", "ol": {"A": "咳声气促、痰多质黏：气促偏痰热或喘，未点出重浊与胸闷。", "B": "咳声重浊、痰黄量少：痰黄属热，量少与“痰多”相反。", "C": "咳嗽频剧、痰少而黏：风热犯肺或燥咳的表现。", "D": "咳声重浊、痰多胸闷：正确。湿痰壅肺、阻滞气机。", "E": "咳嗽气促、痰黄稠厚：痰热郁肺。"}, "hl": [["痰湿蕴肺", "k"]]}, {"id": "hw#6", "c": "04-02", "cn": "咳嗽", "t": "A1型", "q": "“五脏六腑皆令人咳，非独肺也”的记载出自", "o": [["A", "《黄帝内经》"], ["B", "《金匮要略》"], ["C", "《诸病源候论》"], ["D", "《景岳全书》"], ["E", "《医学入门》"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "出自《素问·咳论》，即《黄帝内经》：咳嗽不止于肺，他脏有病传肺亦可致咳。记：“咳论”在《内经》。", "ol": {"A": "《黄帝内经》：正确，见《素问·咳论》。", "B": "《金匮要略》：张仲景论痰饮咳嗽、肺痿肺痈，非此句出处。", "C": "《诸病源候论》：巢元方，提出十种咳，非此句。", "D": "《景岳全书》：张景岳把咳嗽分外感、内伤两大类，非此句。", "E": "《医学入门》：李梴著，非此句出处。"}, "hl": []}, {"id": "hw#7", "c": "04-03", "cn": "哮病", "t": "A1型", "q": "寒哮咳痰特点", "o": [["A", "臭脓痰"], ["B", "痰稠黄粘"], ["C", "痰稀薄多沫"], ["D", "痰质粘起沫"], ["E", "痰黄白相兼"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "寒哮：寒痰伏肺、遇寒触发，痰白稀薄多泡沫、咯吐不爽，伴面色晦暗、口不渴或喜热饮，苔白滑、脉弦紧或浮紧。热哮痰黄稠，寒包热哮痰黄白相兼。", "ol": {"A": "臭脓痰：肺痈溃脓期。", "B": "痰稠黄黏：热哮（或痰热）。", "C": "痰稀薄多沫：正确。寒饮内伏，痰清稀起泡。", "D": "痰质黏起沫：风痰哮、虚哮多见痰黏起泡沫，不突出“稀”。", "E": "痰黄白相兼：寒包热哮（外寒内热）。"}, "hl": [["寒哮", "k"]]}, {"id": "hw#8", "c": "04-03", "cn": "哮病", "t": "A1型", "q": "哮病最主要的发病诱因是", "o": [["A", "气候突变"], ["B", "饮食不当"], ["C", "情志失调"], ["D", "饮食不节"], ["E", "劳累过度"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "哮病以宿痰伏肺为夙根，遇诱因引触而发；诱因以气候突变（外邪侵袭）最常见，其次为饮食、情志、劳倦。记：季节交替、天气骤变最易发作。", "ol": {"A": "气候突变：正确，最主要诱因。", "B": "饮食不当：诱因之一，次要。", "C": "情志失调：诱因之一，次要。", "D": "饮食不节：同 B，次要诱因。", "E": "劳累过度：多诱发虚哮，次要。"}, "hl": []}, {"id": "hw#9", "c": "04-03", "cn": "哮病", "t": "A2型", "q": "陈某，女，40岁。患者形体肥胖，呛咳阵作，喉中痰鸣气粗，胸高胁胀，痰黄质稠，烦闷不安，汗出面赤，舌红苔黄腻，脉弦滑。方宜选用", "o": [["A", "苏子降气汤"], ["B", "三子养亲汤"], ["C", "麻杏石甘汤"], ["D", "桑白皮汤"], ["E", "定喘汤"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["04-07-2"], "B": ["04-03-4"], "C": ["04-04-2"], "D": ["04-04-3", "04-07-3"], "E": ["04-03-2"]}, "z": "04-03-2", "why": "呛咳阵作、喉中痰鸣（哮病发作）+ 气粗、胸高胁胀、痰黄稠、汗出面赤、苔黄腻脉弦滑 → 热哮，清热宣肺、化痰定喘，定喘汤。关键对比：喉中有哮鸣声属哮，与喘证痰热郁肺（桑白皮汤）区分；无恶寒表证，不用麻杏石甘汤。", "ol": {"A": "苏子降气汤：上实下虚的痰浊喘咳（肺胀痰浊壅肺），偏温，不清热。", "B": "三子养亲汤：风痰哮、痰浊阻肺，无热象时用。", "C": "麻杏石甘汤：喘证表寒肺热，需有形寒身热的表证。", "D": "桑白皮汤：喘证痰热郁肺，病名是喘不是哮。", "E": "定喘汤：正确。热哮主方，宣肺清热、化痰定喘。"}, "hl": [["舌红苔黄腻", "k"], ["胸高胁胀", "k"], ["痰黄质稠", "k"], ["汗出面赤", "k"], ["呛咳阵作", "s"], ["苔黄腻", "s"], ["脉弦滑", "s"], ["气粗", "s"], ["呛咳", "s"], ["痰黄", "s"], ["烦闷", "s"], ["汗出", "s"], ["舌红", "s"]]}, {"id": "hw#10", "c": "04-04", "cn": "喘证", "t": "A1型", "q": "“解表清里，化痰平喘”，用于喘证的哪一个证型", "o": [["A", "风寒壅肺"], ["B", "表寒肺热"], ["C", "痰热郁肺"], ["D", "痰浊阻肺"], ["E", "肺气郁闭"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["04-04-1"], "B": ["04-04-2"], "C": ["04-04-3"], "D": ["04-04-4"], "E": ["04-04-5"]}, "z": "04-04-2", "why": "“解表”示表有寒邪，“清里”示肺有郁热 → 喘证表寒肺热（外寒内热），方用麻杏石甘汤；症见形寒身热、喘逆上气、息粗、痰黏。", "ol": {"A": "风寒壅肺：宣肺散寒（麻黄汤合华盖散），无里热，不须“清里”。", "B": "表寒肺热：正确。表寒与里热同见，解表清里。", "C": "痰热郁肺：清热化痰、宣肺平喘（桑白皮汤），无表证，不须“解表”。", "D": "痰浊阻肺：祛痰降逆、宣肺平喘（二陈汤合三子养亲汤）。", "E": "肺气郁闭：开郁降气平喘（五磨饮子），情志诱发。"}, "hl": [["解表清里，化痰平喘", "k"]]}, {"id": "hw#11", "c": "04-04", "cn": "喘证", "t": "A1型", "q": "下列哪项不是实喘的表现", "o": [["A", "呼吸深长"], ["B", "吸入为快"], ["C", "气粗声高"], ["D", "痰鸣咳嗽"], ["E", "脉数有力"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "实喘：呼吸深长有余，以呼出为快，气粗声高，伴痰鸣咳嗽，脉数有力；虚喘：呼吸短促难续，以深吸为快，气怯声低，脉微弱。“吸入为快”是虚喘（肾不纳气）的特征。", "ol": {"A": "呼吸深长：实喘表现。", "B": "吸入为快：正确（本题选“不是”）。属虚喘，肾不纳气、深吸为快。", "C": "气粗声高：实喘表现。", "D": "痰鸣咳嗽：实喘表现，邪壅气道。", "E": "脉数有力：实喘表现。"}, "hl": [["实喘", "k"]]}, {"id": "hw#12", "c": "04-04", "cn": "喘证", "t": "A1型", "q": "静息时亦气喘，动则喘甚的病位在", "o": [["A", "肾"], ["B", "肺"], ["C", "脾"], ["D", "肝"], ["E", "心"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "肺为气之主，肾为气之根：肾虚不纳，静息时也喘、动则更甚、呼多吸少。肺虚喘多为操劳后气短而喘，静时可缓。记：静也喘 → 肾。", "ol": {"A": "肾：正确。肾不纳气，静亦喘、动尤甚。", "B": "肺：肺气虚喘多劳则加重、静时缓，咳声低弱。", "C": "脾：脾虚生痰，是痰浊阻肺实喘的来源，不主静息喘。", "D": "肝：肝气犯肺致肺气郁痹，因情志诱发。", "E": "心：喘脱危证可累及心阳，非本问病位。"}, "hl": [["静息时亦气喘", "k"], ["动则喘甚", "k"]]}, {"id": "hw#13", "c": "04-04", "cn": "喘证", "t": "A1型", "q": "喘而胸满闷塞，咳嗽，痰多黏腻色白，咯吐不利，舌苔白腻，脉象滑。证属", "o": [["A", "肺气郁闭"], ["B", "痰浊阻肺"], ["C", "痰热郁肺"], ["D", "表寒里热"], ["E", "风寒袭肺"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["04-04-5"], "B": ["04-04-4"], "C": ["04-04-3"], "D": ["04-04-2"], "E": ["04-04-1"]}, "z": "04-04-4", "why": "喘而胸满闷塞 + 痰多白黏、咯吐不利 + 苔白腻脉滑 → 痰浊阻肺，祛痰降逆、宣肺平喘（二陈汤合三子养亲汤）。痰白无热象排除痰热郁肺；无恶寒发热排除风寒、表寒里热。", "ol": {"A": "肺气郁闭：情志诱发、胸闷气憋，喉中痰鸣不著。", "B": "痰浊阻肺：正确。痰白黏量多、苔白腻脉滑。", "C": "痰热郁肺：痰黄稠、身热、舌红苔黄腻。", "D": "表寒里热：有形寒身热、痰黏，兼表证。", "E": "风寒袭肺：有恶寒无汗、痰白稀，脉浮紧。"}, "hl": [["痰多黏腻色白", "k"], ["胸满闷塞", "k"], ["苔白腻", "k"], ["脉象滑", "k"], ["喘而胸满闷塞", "s"], ["胸满", "s"], ["痰多", "s"]]}, {"id": "hw#14", "c": "04-05", "cn": "肺痈", "t": "A1型", "q": "咳吐大量脓血痰，或如米粥，腥臭异常，有时咯血，胸中烦满而痛。证属肺痈", "o": [["A", "成痈期"], ["B", "初期"], ["C", "溃脓期"], ["D", "恢复期"], ["E", "以上都不是"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["04-05-2"], "B": ["04-05-1"], "C": ["04-05-3"], "D": ["04-05-4"]}, "z": "04-05-3", "why": "咳吐大量脓血痰、状如米粥、腥臭异常、胸中烦满而痛 → 痈脓溃破外泄，属肺痈溃脓期，排脓解毒，加味桔梗汤。成痈期是黄绿浊痰、喉有腥味，尚未排出大量脓液。", "ol": {"A": "成痈期：痰黄稠或黄绿、喉中腥味，未见大量脓血。", "B": "初期：恶寒发热、咳嗽胸痛、痰白黏，似风热表证。", "C": "溃脓期：正确。脓溃外泄，量多腥臭如米粥。", "D": "恢复期：身热渐退、脓痰渐少、臭味转淡。", "E": "以上都不是：错误，症状典型属溃脓期。"}, "hl": [["大量脓血痰", "k"], ["腥臭异常", "k"], ["如米粥", "k"], ["咳吐大量脓血痰", "s"], ["胸中烦满而痛", "s"], ["咯血", "s"]]}, {"id": "hw#15", "c": "04-05", "cn": "肺痈", "t": "A2型", "q": "蔡某，男，30岁。患者身热甚，汗出身热不解，胸满作痛，转侧不利，咳吐黄稠痰，自觉喉中有腥味，咳嗽气急，口干咽燥，烦躁不安，舌质红，苔黄腻，脉滑数有力。方宜选用", "o": [["A", "大黄牡丹皮汤"], ["B", "银翘散"], ["C", "千金苇茎汤合如金解毒散"], ["D", "加味桔梗汤"], ["E", "桔梗白散"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {"B": ["04-05-1"], "D": ["04-05-3"]}, "z": null, "why": "身热甚、汗出热不解 + 胸满作痛、转侧不利 + 黄稠痰、喉中腥味 → 肺痈成痈期（热毒瘀结成痈），清热解毒、化瘀消痈，千金苇茎汤合如金解毒散。未见大量脓痰（溃脓期）、无恶寒表证（初期）。", "ol": {"A": "大黄牡丹皮汤：肠痈主方，非肺痈。", "B": "银翘散：肺痈初期，恶寒发热、痰白黏量少。", "C": "千金苇茎汤合如金解毒散：正确。成痈期清热解毒、化瘀消痈。", "D": "加味桔梗汤：溃脓期排脓解毒，需大量脓血痰。", "E": "桔梗白散：溃脓期脓浊壅盛、形证俱实时峻驱排脓。"}, "hl": [["汗出身热不解", "k"], ["咳吐黄稠痰", "k"], ["喉中有腥味", "k"], ["转侧不利", "k"]]}, {"id": "hw#16", "c": "04-06", "cn": "肺痨", "t": "A1型", "q": "肺痨重视补虚培元，其治疗大法中以何者为主", "o": [["A", "滋阴"], ["B", "益气"], ["C", "养血"], ["D", "温阳"], ["E", "抗痨"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "肺痨以阴虚为病理基础（肺阴亏损 → 阴虚火旺 → 气阴耗伤 → 阴阳两虚），故补虚培元以滋阴为主，再按需降火、益气、温阳；总治则是补虚培元、抗痨杀虫。", "ol": {"A": "滋阴：正确。阴虚贯穿全程。", "B": "益气：气阴耗伤时兼用，不为主。", "C": "养血：非主要大法。", "D": "温阳：阴阳两虚晚期才用。", "E": "抗痨：属杀虫治本，不属“补虚培元”。"}, "hl": [["补虚培元", "k"]]}, {"id": "hw#17", "c": "04-06", "cn": "肺痨", "t": "A1型", "q": "肺痨日久可以进一步影响其他脏腑，其中关系最密切的是", "o": [["A", "心、肺"], ["B", "脾、肾"], ["C", "心、肝"], ["D", "肝、肾"], ["E", "肝、脾"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "肺痨病位在肺，久则传及脾、肾：肺虚子盗母气 → 脾虚（肺脾同病、气阴两虚）；肺肾金水相生，肺阴亏则肾阴亦虚（肺肾阴虚、虚火灼金）。记：土生金、金生水，上下两头都受累。", "ol": {"A": "心、肺：肺为本脏，心非最密切。", "B": "脾、肾：正确。母脏脾、子脏肾最先受累。", "C": "心、肝：可兼及（虚火扰心、肝火犯肺），非最密切。", "D": "肝、肾：肝非主要传变脏。", "E": "肝、脾：肝非主要传变脏。"}, "hl": []}, {"id": "hw#18", "c": "04-06", "cn": "肺痨", "t": "A2型", "q": "一肺痨患者，男性，25岁。咳嗽无力，气短声低，痰中偶夹血，午后潮红，热势不高，颧红，神疲倦怠，食欲不振，面色㿠白，舌质嫩红，边有齿印，苔薄，脉细弱而数。应辨证为", "o": [["A", "肺脾气虚"], ["B", "阴阳两虚"], ["C", "气阴耗伤"], ["D", "阴虚肺燥"], ["E", "阴虚火旺"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {"B": ["04-06-4"], "C": ["04-06-3"], "E": ["05-01-3", "10-02-6"]}, "z": "04-06-3", "why": "午后潮热、颧红、舌嫩红（阴虚）+ 咳嗽无力、气短声低、神疲食少、面㿠白、舌边齿印（肺脾气虚）+ 脉细弱而数 → 气阴耗伤，养阴润肺、益气健脾，保真汤。阴虚肺燥、阴虚火旺无气虚；阴阳两虚则有畏寒肢冷、浮肿。", "ol": {"A": "肺脾气虚：不是肺痨证型，且漏了潮热颧红的阴虚。", "B": "阴阳两虚：补天大造丸，需畏寒肢冷、面浮肢肿、五更泄。", "C": "气阴耗伤：正确。气虚与阴虚并见，脉细弱而数。", "D": "阴虚肺燥（肺阴亏损）：月华丸，干咳少痰，无气短声低、齿痕。", "E": "阴虚火旺（虚火灼肺）：呛咳、骨蒸、咯血鲜红、急躁，热重而无气虚。"}, "hl": [["脉细弱而数", "k"], ["咳嗽无力", "k"], ["气短声低", "k"], ["面色㿠白", "k"], ["边有齿印", "k"], ["气短", "s"], ["颧红", "s"], ["神疲", "s"], ["倦怠", "s"], ["苔薄", "s"]]}, {"id": "hw#19", "c": "04-07", "cn": "肺胀", "t": "A2型", "q": "贺某，男，68岁。患者咳嗽病史多年，呼吸浅促难续，咳声低怯，胸满短气，甚则张口抬肩，倚息不能平卧，咳嗽，痰如白沫，咳吐不利，心慌，形寒，汗出，面色晦暗，舌淡，脉沉细无力。治疗方剂宜首选", "o": [["A", "真武汤"], ["B", "五苓散"], ["C", "平喘固本汤合补肺汤"], ["D", "苏子降气汤"], ["E", "三子养亲汤"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["04-07-6"], "B": ["04-07-6"], "D": ["04-07-2"], "E": ["04-07-2"]}, "z": null, "why": "多年咳喘 + 呼吸浅促难续、咳声低怯、倚息不能平卧、形寒汗出、脉沉细无力 → 肺胀肺肾气虚（肺不主气、肾不纳气），补肺纳肾、降气平喘，平喘固本汤合补肺汤。张口抬肩各证都可见，只示病重；无面浮肢肿、尿少，排除阳虚水泛。", "ol": {"A": "真武汤：阳虚水泛，需面浮肢肿、尿少。", "B": "五苓散：与真武汤合用于阳虚水泛，利水。", "C": "平喘固本汤合补肺汤：正确。肺肾两虚、气不归元。", "D": "苏子降气汤：痰浊壅肺，痰多胸满，以邪实为主。", "E": "三子养亲汤：痰浊壅肺，降气化痰，不补虚。"}, "hl": [["呼吸浅促难续", "k"], ["脉沉细无力", "k"], ["咳声低怯", "k"], ["形寒", "k"]]}, {"id": "hw#20", "c": "04-07", "cn": "肺胀", "t": "A1型", "q": "肺胀的主要病机是", "o": [["A", "肺叶生疮"], ["B", "肺叶痿弱"], ["C", "肺热叶焦"], ["D", "肺气胀满"], ["E", "肺脾两虚"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "肺胀：慢性肺系疾病反复发作，肺气壅滞、胸中胀满、不能敛降，见胸部膨满、喘咳、憋闷。记：病名“胀”= 肺气胀满。", "ol": {"A": "肺叶生疮：肺痈的病机。", "B": "肺叶痿弱：肺痿的病机。", "C": "肺热叶焦：痿证（“肺热叶焦，发为痿躄”）。", "D": "肺气胀满：正确。", "E": "肺脾两虚：只是虚证一面，说不出“胀”。"}, "hl": []}, {"id": "hw#21", "c": "05-01", "cn": "心悸", "t": "A2型", "q": "林某，男，45岁。患者近日心悸易惊，心烦失眠，五心烦热，舌红苔少，脉细数。其治法为", "o": [["A", "温补心阳，安神定悸"], ["B", "滋阴清火，养心安神"], ["C", "镇惊定志，养心安神"], ["D", "补血养心，益气安神"], ["E", "活血化瘀，理气通络"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["05-01-4"], "B": ["05-01-3"], "C": ["05-01-1"], "D": ["05-01-2"], "E": ["05-01-6"]}, "z": "05-01-3", "why": "心悸 + 心烦失眠、五心烦热、舌红少苔、脉细数 → 心悸阴虚火旺，滋阴清火、养心安神（天王补心丹合朱砂安神丸）。“易惊”容易误认作心虚胆怯，但后者无热象、苔薄白。", "ol": {"A": "温补心阳、安神定悸：心阳不振，畏寒肢冷、舌淡。", "B": "滋阴清火、养心安神：正确。", "C": "镇惊定志、养心安神：心虚胆怯，无五心烦热、舌红。", "D": "补血养心、益气安神：心血不足（归脾汤），面色少华、舌淡。", "E": "活血化瘀、理气通络：瘀阻心脉，胸痛如刺、舌紫暗。"}, "hl": [["五心烦热", "k"], ["心悸易惊", "k"], ["心烦失眠", "k"], ["舌红苔少", "k"], ["脉细数", "s"], ["心悸", "s"], ["易惊", "s"], ["心烦", "s"], ["失眠", "s"], ["舌红", "s"], ["苔少", "s"]]}, {"id": "hw#22", "c": "05-01", "cn": "心悸", "t": "A1型", "q": "心悸瘀阻心脉证的代表方是", "o": [["A", "苓桂术甘汤"], ["B", "桃仁红花煎"], ["C", "黄连温胆汤"], ["D", "桂枝甘草龙骨牡蛎汤"], ["E", "安神定志丸"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["05-01-5"], "B": ["05-01-6"], "C": ["05-01-7"], "D": ["05-01-4"], "E": ["05-01-1"]}, "z": "05-01-6", "why": "瘀阻心脉：心悸胸闷、痛如针刺、唇甲青紫、舌紫暗或有瘀斑、脉涩或结代 → 活血化瘀、理气通络，桃仁红花煎。记：桃红 = 化瘀。", "ol": {"A": "苓桂术甘汤：水饮凌心，眩晕、尿少浮肿、苔白滑。", "B": "桃仁红花煎：正确。", "C": "黄连温胆汤：痰火扰心，苔黄腻、口苦。", "D": "桂枝甘草龙骨牡蛎汤：心阳不振，畏寒肢冷。", "E": "安神定志丸：心虚胆怯，善惊易恐。"}, "hl": [["瘀阻心脉", "k"], ["心悸", "s"]]}, {"id": "hw#23", "c": "05-01", "cn": "心悸", "t": "A2型", "q": "李某，女，30岁。患者平素体健，三日前突受惊吓，现心悸易惊，坐卧不安，不寐多梦，舌苔薄白，脉弦细。治疗宜选", "o": [["A", "朱砂安神丸"], ["B", "归脾汤"], ["C", "天王补心丹"], ["D", "安神定志丸"], ["E", "桂甘龙牡汤"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["05-01-3"], "B": ["05-01-2"], "C": ["05-01-3"], "D": ["05-01-1"]}, "z": "05-01-1", "why": "平素体健、突受惊吓后心悸易惊、坐卧不安、多梦，苔薄白、脉弦细，无热象也无明显虚象 → 心虚胆怯，镇惊定志、养心安神，安神定志丸。", "ol": {"A": "朱砂安神丸：阴虚火旺，需五心烦热、舌红少苔。", "B": "归脾汤：心血不足，面色少华、倦怠、舌淡。", "C": "天王补心丹：阴虚火旺，需舌红少苔、脉细数。", "D": "安神定志丸：正确。惊则气乱，镇惊定志。", "E": "桂甘龙牡汤：心阳不振，畏寒肢冷、动则加重。"}, "hl": [["坐卧不安", "k"], ["平素体健", "k"], ["突受惊吓", "k"], ["心悸易惊", "k"], ["苔薄白", "s"], ["心悸", "s"], ["易惊", "s"], ["多梦", "s"]]}, {"id": "hw#24", "c": "05-02", "cn": "胸痹", "t": "A1型", "q": "胸痹发作时，疼痛可以放射至", "o": [["A", "右胸"], ["B", "肩背"], ["C", "左胁下"], ["D", "右胁下"], ["E", "背正中"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "胸痹以膻中或左胸部发作性憋闷疼痛为主，可放射至肩背、左臂内侧、咽喉、胃脘等，甚至沿手少阴、手厥阴经至中指或小指。记：“心痛彻背，背痛彻心”。", "ol": {"A": "右胸：非典型放射部位。", "B": "肩背：正确。", "C": "左胁下：胁痛范围，不是心痛放射部位。", "D": "右胁下：胆、胁痛的部位。", "E": "背正中：教材表述为肩背，不是背正中。"}, "hl": []}, {"id": "hw#25", "c": "05-02", "cn": "胸痹", "t": "A2型", "q": "胡某，女，58岁。患“冠心病”病史半年，心胸满闷，隐痛阵作，胸胁胀满，嗳气较舒，苔薄，脉细弦。治疗主方宜选", "o": [["A", "柴胡疏肝散"], ["B", "丹栀逍遥丸"], ["C", "当归四逆散"], ["D", "甘麦大枣汤"], ["E", "栝蒌薤白半夏汤"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["05-02-2"], "D": ["10-01-4"], "E": ["05-02-3"]}, "z": "05-02-2", "why": "心胸满闷、隐痛阵作 + 胸胁胀满、嗳气则舒、脉细弦 → 胸痹气滞心胸，疏肝理气、活血通络，柴胡疏肝散。苔薄不腻、无痰多体胖，不是痰浊闭阻。", "ol": {"A": "柴胡疏肝散：正确。", "B": "丹栀逍遥丸：肝郁化火，需心烦口苦、舌红；本例无热象。", "C": "当归四逆汤（题作“散”）：寒凝心脉，需手足厥冷、痛如绞。", "D": "甘麦大枣汤：脏躁、心神失养，善悲欲哭。", "E": "栝蒌薤白半夏汤：痰浊闭阻，胸闷重、体胖痰多、苔浊腻。"}, "hl": [["胸胁胀满", "k"], ["嗳气较舒", "k"], ["脉细弦", "k"], ["嗳气", "k"], ["隐痛阵作", "s"], ["胸满", "s"], ["苔薄", "s"]]}, {"id": "hw#26", "c": "05-02", "cn": "胸痹", "t": "A2型", "q": "患者既往有“冠心病”病史，正值正月发病，证见心痛如绞，心痛彻背，手足不温，冷汗出，心悸，气短，苔白，脉沉紧。其治法应为", "o": [["A", "辛温散寒，宣通心阳"], ["B", "疏肝理气，活血通络"], ["C", "通阳泄浊，豁痰宣痹"], ["D", "活血化瘀，通脉止痛"], ["E", "温振心阳，补益心气"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["05-02-4"], "B": ["05-02-2"], "C": ["05-02-3"], "D": ["05-02-1"]}, "z": "05-02-4", "why": "正月天寒发病 + 心痛如绞、心痛彻背 + 手足不温、冷汗、苔白、脉沉紧 → 胸痹寒凝心脉，辛温散寒、宣通心阳（枳实薤白桂枝汤合当归四逆汤）。心血瘀阻也可痛如绞，但舌紫暗、脉涩；本例寒象突出。", "ol": {"A": "辛温散寒、宣通心阳：正确。", "B": "疏肝理气、活血通络：气滞心胸，胸胁胀满、嗳气则舒。", "C": "通阳泄浊、豁痰宣痹：痰浊闭阻，胸闷重、苔浊腻。", "D": "活血化瘀、通脉止痛：心血瘀阻，刺痛、舌紫暗、脉涩。", "E": "温振心阳、补益心气：阳虚的虚证治法，隐痛、动则加重；本例暴痛属实寒。"}, "hl": [["心痛如绞", "k"], ["正值正月", "k"], ["手足不温", "k"], ["脉沉紧", "k"], ["心痛彻背", "s"], ["冷汗", "s"], ["气短", "s"], ["心悸", "s"]]}, {"id": "hw#27", "c": "05-04", "cn": "不寐", "t": "A1型", "q": "心胆气虚型不寐的代表方为", "o": [["A", "八珍汤"], ["B", "安神定志丸合酸枣仁汤"], ["C", "六君子汤"], ["D", "归脾汤"], ["E", "黄连阿胶汤"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["08-03-5"], "C": ["04-03-8", "06-06-4"], "D": ["05-04-3"], "E": ["07-08-4"]}, "z": null, "why": "心胆气虚不寐：虚烦不寐、胆怯易惊、终日惕惕、气短自汗、舌淡脉弦细 → 益气镇惊、安神定志，安神定志丸合酸枣仁汤。注意：心悸心虚胆怯单用安神定志丸，不寐心胆气虚再合酸枣仁汤。", "ol": {"A": "八珍汤：气血双补，不针对胆怯易惊。", "B": "安神定志丸合酸枣仁汤：正确。", "C": "六君子汤：脾虚痰湿，不安神。", "D": "归脾汤：心脾两虚不寐，多梦易醒、面色少华。", "E": "黄连阿胶汤：阴虚火旺、心肾不交的失眠，舌红少苔。"}, "hl": [["心胆气虚", "k"]]}, {"id": "hw#28", "c": "05-04", "cn": "不寐", "t": "A2型", "q": "吴某，女，17岁。患者半年来因学习压力较大，晚上经常难以入眠，多梦易醒，心悸健忘，神疲，食少，面色少华，舌淡苔薄，脉细无力。辨为", "o": [["A", "心胆气虚证"], ["B", "心脾两虚证"], ["C", "阴虚火旺证"], ["D", "肝火扰心证"], ["E", "痰气郁结证"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "学习压力大、思虑伤心脾 + 难入眠、多梦易醒、心悸健忘、神疲食少、面色少华、舌淡脉细无力 → 不寐心脾两虚（归脾汤）。无胆怯易惊（心胆气虚）、无五心烦热（阴虚）、无急躁口苦（肝火）。", "ol": {"A": "心胆气虚：以胆怯易惊、终日惕惕为主。", "B": "心脾两虚：正确。", "C": "阴虚火旺：五心烦热、舌红少苔、脉细数。", "D": "肝火扰心：急躁易怒、目赤口苦、脉弦数。", "E": "痰气郁结：不是不寐证型（属癫证）；痰证当苔腻。"}, "hl": [["多梦易醒", "k"], ["心悸健忘", "k"], ["面色少华", "k"], ["食少", "k"]]}, {"id": "hw#29", "c": "06-01", "cn": "头痛", "t": "A2型", "q": "丁某，女，45岁。患者头痛经久不愈，痛处固定不移，痛如锥刺，有头部外伤史，舌紫暗，苔薄白，脉细涩。方宜选用", "o": [["A", "加味四物汤"], ["B", "天麻钩藤饮"], ["C", "半夏白术天麻汤"], ["D", "大补元煎"], ["E", "通窍活血汤"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["06-01-5"], "B": ["06-01-4"], "C": ["06-01-7"], "D": ["06-01-8"], "E": ["06-01-9"]}, "z": "06-01-9", "why": "头痛经久不愈 + 痛处固定、痛如锥刺 + 外伤史 + 舌紫暗脉细涩 → 瘀血头痛，活血化瘀、通窍止痛，通窍活血汤。", "ol": {"A": "加味四物汤：血虚头痛，隐痛、面色少华、舌淡。", "B": "天麻钩藤饮：肝阳头痛，胀痛、急躁易怒、脉弦。", "C": "半夏白术天麻汤：痰浊头痛，昏蒙沉重、苔白腻。", "D": "大补元煎：肾虚头痛，空痛、腰膝酸软。", "E": "通窍活血汤：正确。"}, "hl": [["痛处固定不移", "k"], ["头部外伤史", "k"], ["固定不移", "k"], ["痛如锥刺", "k"], ["脉细涩", "k"], ["锥刺", "k"], ["外伤", "k"], ["头痛经久不愈", "s"], ["外伤史", "s"], ["舌紫暗", "s"], ["苔薄白", "s"], ["脉细", "s"]]}, {"id": "hw#30", "c": "05-03", "cn": "心衰", "t": "A2型", "q": "患者心悸，喘息不得卧，面浮肢肿，尿少，神疲乏力，畏寒肢冷，腹胀，便溏，口唇发绀，胸部刺痛，颈脉显露，舌淡胖有齿痕，有瘀点，脉沉细。辨为", "o": [["A", "阳虚水泛证"], ["B", "心脾两虚证"], ["C", "阳气亏虚证"], ["D", "气血两虚证"], ["E", "心肾两虚证"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "心衰 + 面浮肢肿、尿少、畏寒肢冷、腹胀便溏（阳虚水停）+ 唇绀、胸部刺痛、舌有瘀点（兼瘀）→ 阳虚水泛证，益气温阳、活血利水（真武汤合葶苈大枣泻肺汤）。浮肿尿少是与气虚血瘀等证分界的关键。", "ol": {"A": "阳虚水泛证：正确。", "B": "心脾两虚证：心悸不寐、食少，无水肿尿少。", "C": "阳气亏虚证：只说阳虚，没点出水泛。", "D": "气血两虚证：无水停、无畏寒肢冷为主。", "E": "心肾两虚证：笼统，未体现水泛与血瘀。"}, "hl": [["面浮肢肿", "k"], ["畏寒肢冷", "k"], ["颈脉显露", "k"], ["尿少", "k"]]}, {"id": "hw#31", "c": "06-02", "cn": "眩晕", "t": "A2型", "q": "刘某，女，34岁。患者产后出现眩晕，动则加剧，劳累即发，面色㿠白，神疲自汗，倦怠懒言，唇甲不华，发色不泽，心悸少寐，纳少腹胀，舌淡，苔薄白，脉细弱。证属", "o": [["A", "肝阳上亢证"], ["B", "瘀血阻窍证"], ["C", "肾精不足证"], ["D", "痰浊中阻证"], ["E", "气血亏虚证"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "产后失血 + 眩晕动则加剧、劳累即发 + 面色㿠白、神疲自汗、唇甲不华、心悸少寐、纳少 → 眩晕气血亏虚，补益气血、调养心脾，归脾汤。肾精不足应有腰酸耳鸣、齿摇遗精。", "ol": {"A": "肝阳上亢证：头胀痛、急躁易怒、面红、脉弦。", "B": "瘀血阻窍证：头痛有定处、舌暗有瘀斑。", "C": "肾精不足证：腰膝酸软、耳鸣、遗精、经久不愈。", "D": "痰浊中阻证：头重如裹、呕吐痰涎、苔白腻。", "E": "气血亏虚证：正确。"}, "hl": [["动则加剧", "k"], ["劳累即发", "k"], ["唇甲不华", "k"], ["产后", "k"]]}, {"id": "hw#32", "c": "06-02", "cn": "眩晕", "t": "A1型", "q": "下列哪项不是眩晕肝阳上亢证的主症", "o": [["A", "头痛"], ["B", "面潮红"], ["C", "急躁易怒"], ["D", "口苦"], ["E", "呕吐"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "肝阳上亢眩晕：头晕目眩、耳鸣、头胀痛、急躁易怒、面潮红、口苦、遇烦劳郁怒加重，舌红苔黄脉弦。呕吐（尤其呕吐痰涎）属痰湿中阻。", "ol": {"A": "头痛：肝阳上亢主症（头胀痛）。", "B": "面潮红：肝阳上亢主症。", "C": "急躁易怒：肝阳上亢主症。", "D": "口苦：肝阳上亢主症（肝火）。", "E": "呕吐：正确（本题选“不是”）。属痰湿中阻。"}, "hl": [["肝阳上亢", "k"]]}, {"id": "hw#33", "c": "06-02", "cn": "眩晕", "t": "A2型", "q": "患者眩晕，头重如蒙，视物旋转，胸闷恶心，呕吐痰涎，食少多寐，舌苔白腻，脉濡滑。治疗应选方", "o": [["A", "天麻钩藤饮"], ["B", "黄连温胆汤"], ["C", "藿香正气散"], ["D", "半夏厚朴汤"], ["E", "半夏白术天麻汤"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["06-02-1"], "B": ["05-01-7", "05-04-2"], "C": ["07-03-1", "07-07-1"], "D": ["07-03-4", "10-01-3"], "E": ["06-02-2"]}, "z": "06-02-2", "why": "眩晕 + 头重如蒙、胸闷恶心、呕吐痰涎、食少多寐 + 苔白腻脉濡滑 → 痰湿中阻，化痰祛湿、健脾和胃，半夏白术天麻汤。无口苦苔黄，不用黄连温胆汤。", "ol": {"A": "天麻钩藤饮：肝阳上亢，头胀痛、急躁、脉弦。", "B": "黄连温胆汤：痰郁化火，需口苦、苔黄腻。", "C": "藿香正气散：外感风寒内伤湿滞，吐泻兼表证。", "D": "半夏厚朴汤：梅核气（痰气郁结），咽中如有物阻。", "E": "半夏白术天麻汤：正确。"}, "hl": [["视物旋转", "k"], ["呕吐痰涎", "k"], ["头重如蒙", "k"], ["舌苔白腻", "k"], ["头重如", "k"], ["多寐", "k"], ["痰涎", "k"], ["头重", "t"], ["苔白腻", "s"], ["脉濡滑", "s"], ["胸闷", "s"], ["恶心", "s"], ["食少", "s"]]}, {"id": "hw#34", "c": "06-03", "cn": "中风", "t": "A1型", "q": "中风气虚血瘀证的代表方为", "o": [["A", "天麻钩藤饮"], ["B", "补阳还五汤"], ["C", "星蒌承气汤"], ["D", "通窍活血汤"], ["E", "镇肝息风汤"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["06-03-2"], "B": ["06-03-9"], "D": ["05-04-7", "06-01-9"], "E": ["06-03-3"]}, "z": "06-03-9", "why": "中风气虚血瘀：气虚无力行血、瘀阻脉络 → 半身不遂、乏力、面色萎黄、舌淡紫脉细涩，益气活血，补阳还五汤（重用黄芪）。多见于恢复期、后遗症期。", "ol": {"A": "天麻钩藤饮：风阳上扰，急躁、面红、脉弦有力。", "B": "补阳还五汤：正确。", "C": "星蒌承气汤：痰热腑实，通腑化痰，腹胀便秘、苔黄腻。", "D": "通窍活血汤：瘀阻脑络（痴呆、头痛），无气虚为本。", "E": "镇肝息风汤：阴虚风动，舌红少苔、脉细弦。"}, "hl": [["气虚血瘀", "k"]]}, {"id": "hw#35", "c": "06-03", "cn": "中风", "t": "A1型", "q": "以下均是中风脱证的临床表现，除了", "o": [["A", "突然昏仆，不省人事"], ["B", "目合口开"], ["C", "肢冷汗出"], ["D", "肢体强痉"], ["E", "脉微欲绝"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "中风脱证属元气败脱：目合口开、手撒肢冷、汗多、二便自遗、肢体软瘫、脉微欲绝。肢体强痉、牙关紧闭、两手握固属闭证。记：闭证“紧、握、痉”，脱证“开、撒、软”。", "ol": {"A": "突然昏仆、不省人事：闭证、脱证共有。", "B": "目合口开：脱证表现。", "C": "肢冷汗出：脱证表现。", "D": "肢体强痉：正确（本题选“除了”）。属闭证。", "E": "脉微欲绝：脱证表现。"}, "hl": [["脱证", "k"]]}, {"id": "hw#36", "c": "06-03", "cn": "中风", "t": "A1型", "q": "中风的多发年龄是", "o": [["A", "30岁以上"], ["B", "40岁以上"], ["C", "50岁以上"], ["D", "60岁以上"], ["E", "70岁以上"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "中风多见于中老年，40岁以上发病明显增多，年龄越大越多。记：“四十而阴气自半”，40岁是界线。", "ol": {"A": "30岁以上：偏早。", "B": "40岁以上：正确。", "C": "50岁以上：偏晚，范围过窄。", "D": "60岁以上：偏晚。", "E": "70岁以上：偏晚。"}, "hl": []}, {"id": "hw#37", "c": "06-04", "cn": "痴呆", "t": "A1型", "q": "痴呆瘀血内阻证的代表方为", "o": [["A", "还少丹"], ["B", "洗心汤"], ["C", "七福饮"], ["D", "转呆丹"], ["E", "通窍活血汤"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["06-04-2"], "B": ["06-04-4"], "C": ["06-04-1"], "E": ["06-04-5"]}, "z": "06-04-5", "why": "痴呆瘀阻脑络：善忘、反应迟钝、头痛难愈、或有中风史，舌紫暗有瘀斑、脉细涩 → 活血化瘀、通窍醒神，通窍活血汤。", "ol": {"A": "还少丹：脾肾亏虚。", "B": "洗心汤：痰浊蒙窍。", "C": "七福饮：髓海不足。", "D": "转呆丹：痰浊蒙窍加减用方（言语颠倒、歌笑不休时改用）。", "E": "通窍活血汤：正确。"}, "hl": [["瘀血内阻", "k"]]}, {"id": "hw#38", "c": "06-04", "cn": "痴呆", "t": "A1型", "q": "痴呆的主要病位在", "o": [["A", "脑"], ["B", "心"], ["C", "肝"], ["D", "脾"], ["E", "肾"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "痴呆病位在脑（脑为元神之府），与心、肝、脾、肾相关；基本病机为髓减脑消、神机失用。", "ol": {"A": "脑：正确。", "B": "心：相关脏，非主要病位。", "C": "肝：相关脏。", "D": "脾：相关脏。", "E": "肾：相关脏（肾精生髓），非主要病位。"}, "hl": []}, {"id": "hw#39", "c": "05-02", "cn": "胸痹", "t": "A1型", "q": "肺大则多饮，善病", "o": [["A", "胸痹"], ["B", "哮病"], ["C", "咳嗽"], ["D", "痰饮"], ["E", "喘证"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "出自《灵枢·本藏》：“肺大则多饮，善病胸痹、喉痹、逆气。”属胸痹病名的早期记载，记原文即可。", "ol": {"A": "胸痹：正确，原文所载。", "B": "哮病：原文未提。", "C": "咳嗽：原文未提。", "D": "痰饮：“多饮”易误导，原文是胸痹。", "E": "喘证：原文作“逆气”，不是喘证。"}, "hl": [["肺大则多饮", "k"]]}, {"id": "hw#40", "c": "06-05", "cn": "癫狂", "t": "A2型", "q": "患者神思恍惚，魂梦颠倒，心悸易惊，善悲欲哭，言语无序，肢体困乏，面色苍白，舌质淡，苔薄白，脉细弱无力。治宜", "o": [["A", "醒脾化湿，疏肝解郁"], ["B", "健脾益气，重镇安神"], ["C", "健脾养心，解郁安神"], ["D", "理气解郁，豁痰化瘀"], ["E", "理气解郁，化痰醒神"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {"C": ["06-05-2"]}, "z": "06-05-2", "why": "神思恍惚、魂梦颠倒、心悸易惊、善悲欲哭 + 肢体困乏、面色苍白、舌淡脉细弱 → 癫证心脾两虚，健脾养心、解郁安神（养心汤合越鞠丸）。痰气郁结是表情淡漠、喃喃自语、苔白腻脉弦滑，属实。", "ol": {"A": "醒脾化湿、疏肝解郁：偏湿困肝郁，不养心。", "B": "健脾益气、重镇安神：重镇偏治实，本证虚须养心解郁。", "C": "健脾养心、解郁安神：正确。", "D": "理气解郁、豁痰化瘀：近痰热瘀结（癫狂梦醒汤）之法，属实。", "E": "理气解郁、化痰醒神：痰气郁结（逍遥散合涤痰汤）。"}, "hl": [["脉细弱无力", "k"], ["魂梦颠倒", "k"], ["神思恍惚", "k"], ["善悲欲哭", "k"], ["言语无序", "s"], ["面色苍白", "s"], ["苔薄白", "s"], ["脉细弱", "s"], ["心悸", "s"], ["易惊", "s"]]}, {"id": "hw#41", "c": "06-05", "cn": "癫狂", "t": "A1型", "q": "癫狂的病理因素以下列哪一个为先", "o": [["A", "风热"], ["B", "痰火"], ["C", "气郁"], ["D", "血瘀"], ["E", "痰湿"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "癫狂病理因素为气、痰、火、瘀，以气郁为先：气郁生痰 → 痰气郁结（癫）；气郁化火 → 痰火扰神（狂）；久则血瘀。", "ol": {"A": "风热：不是癫狂病理因素。", "B": "痰火：狂证主因，但由气郁化火而来。", "C": "气郁：正确。", "D": "血瘀：后期才见。", "E": "痰湿：由气郁生痰而来，非首发。"}, "hl": [["为先", "k"]]}, {"id": "hw#42", "c": "06-05", "cn": "癫狂", "t": "A1型", "q": "狂证初发，先有性情急躁，头痛失眠，两目怒视，面红目赤，突然狂暴无知，骂詈叫号，不避亲疏，弃衣而走，不食不眠，舌质红绛，苔多黄腻，脉弦滑数。治疗应选方", "o": [["A", "黄连温胆汤"], ["B", "生铁落饮"], ["C", "龙胆泻肝汤"], ["D", "清营汤"], ["E", "镇肝熄风汤"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["05-01-7", "05-04-2"], "B": ["06-05-3"], "C": ["05-04-1", "06-06-3"], "D": ["08-04-9", "11-02-4"], "E": ["11-04-1"]}, "z": "06-05-3", "why": "狂证 + 急躁头痛失眠、两目怒视、面红目赤、狂暴无知、骂詈叫号、不避亲疏 + 舌红绛苔黄腻、脉弦滑数 → 痰火扰神，镇心涤痰、清肝泻火，生铁落饮（生铁落重镇降逆）。", "ol": {"A": "黄连温胆汤：痰火扰心的心悸、痰热不寐，无狂暴。", "B": "生铁落饮：正确。", "C": "龙胆泻肝汤：肝火扰心不寐、痫证肝火痰热，只清肝不镇心涤痰。", "D": "清营汤：温病热入营分。", "E": "镇肝熄风汤：中风阴虚风动。"}, "hl": [["两目怒视", "k"], ["狂暴无知", "k"], ["脉弦滑数", "k"], ["骂詈叫号", "k"], ["骂詈", "k"], ["怒视", "k"], ["突然狂暴无知", "s"], ["不避亲疏", "s"], ["弃衣而走", "s"], ["头痛", "s"], ["失眠", "s"], ["面红", "s"], ["目赤", "s"], ["不食", "s"]]}, {"id": "hw#43", "c": "06-06", "cn": "痫证", "t": "A1型", "q": "痫证的病机关键为", "o": [["A", "元神失控"], ["B", "气血逆乱"], ["C", "清窍蒙蔽"], ["D", "脏腑功能失调"], ["E", "肝阳上亢"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {"E": ["06-02-1"]}, "z": null, "why": "痫证由风、火、痰、瘀致脏腑失调、气机逆乱，痰浊蒙蔽清窍，最终元神失控而发作；教材以“元神失控”为病机关键。记：痫 = 元神一时失控，醒后如常。", "ol": {"A": "元神失控：正确。", "B": "气血逆乱：发病环节之一，偏厥证。", "C": "清窍蒙蔽：痰浊作用的环节，非关键。", "D": "脏腑功能失调：发病基础，非关键。", "E": "肝阳上亢：眩晕、中风的病机。"}, "hl": [["病机关键", "k"]]}, {"id": "hw#44", "c": "06-06", "cn": "痫证", "t": "A1型", "q": "突然昏仆，不省人事，发作时常伴有怪叫、抽搐，口吐涎沫，两目上视等，常反复发作，每次症状相类似，苏醒缓解后可如常人。此为", "o": [["A", "痫证"], ["B", "眩晕"], ["C", "厥证"], ["D", "昏迷"], ["E", "中风"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "突然昏仆 + 抽搐、口吐涎沫、两目上视、怪叫 + 反复发作、每次相似、醒后如常人 → 痫证。中风醒后多留半身不遂、口舌歪斜；厥证无抽搐、口吐涎沫、怪叫。", "ol": {"A": "痫证：正确。", "B": "眩晕：无昏仆抽搐。", "C": "厥证：昏仆、四肢厥冷，无口吐涎沫和怪叫。", "D": "昏迷：持续不醒，不会反复发作后如常。", "E": "中风：醒后多遗半身不遂、口舌歪斜。"}, "hl": [["苏醒缓解后可如常人", "k"], ["口吐涎沫", "k"], ["两目上视", "k"], ["怪叫", "k"]]}, {"id": "hw#45", "c": "07-01", "cn": "胃痛", "t": "A1型", "q": "下列症状对胃痛和胁痛的鉴别诊断，最具有价值者为", "o": [["A", "疼痛的部位"], ["B", "疼痛的性质"], ["C", "疼痛的持续时间"], ["D", "疼痛的兼症"], ["E", "疼痛的诱因"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "胃痛在上腹胃脘近心窝处，胁痛在一侧或两侧胁肋部。二者都可胀痛、可因情志诱发（肝气犯胃），性质、兼症、诱因重叠，只有部位能一刀分开。", "ol": {"A": "疼痛的部位：正确。", "B": "疼痛的性质：二者都可胀痛、刺痛，重叠。", "C": "疼痛的持续时间：无鉴别意义。", "D": "疼痛的兼症：都可兼嗳气、口苦，重叠。", "E": "疼痛的诱因：都可因情志诱发，重叠。"}, "hl": [["胃痛和胁痛", "k"]]}, {"id": "hw#46", "c": "07-01", "cn": "胃痛", "t": "A2型", "q": "张某，男，27岁。患者聚餐后出现胃脘疼痛，胀满拒按，嗳腐吞酸，呕吐不消化食物，其味腐臭，吐后痛减，不思饮食，大便不爽，得矢气及便后稍舒，舌苔厚腻，脉滑。治宜选用", "o": [["A", "大承气汤"], ["B", "小承气汤"], ["C", "藿香正气丸"], ["D", "半夏泻心汤"], ["E", "保和丸"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["07-06-2"], "B": ["10-09-1"], "E": ["07-01-2"]}, "z": "07-01-2", "why": "聚餐暴食后 + 胀满拒按、嗳腐吞酸、吐出腐臭不消化食物、吐后痛减、矢气便后稍舒 + 苔厚腻脉滑 → 胃痛饮食伤胃，消食导滞、和中止痛，保和丸。只是大便不爽，未到痞满燥实，不用承气。", "ol": {"A": "大承气汤：阳明腑实，痞满燥实坚俱备。", "B": "小承气汤：饮食伤胃兼便闭时合用；本例仅大便不爽。", "C": "藿香正气丸：外感风寒、内伤湿滞，吐泻兼表证。", "D": "半夏泻心汤：寒热错杂的心下痞、肠鸣下利。", "E": "保和丸：正确。"}, "hl": [["嗳腐吞酸", "k"], ["吐后痛减", "k"], ["舌苔厚腻", "k"], ["聚餐后", "k"], ["腐臭", "k"], ["呕吐不消化食物", "s"], ["胃脘疼痛", "s"], ["胀满拒按", "s"], ["其味腐臭", "s"], ["大便不爽", "s"], ["便后稍舒", "s"], ["苔厚腻", "s"], ["嗳腐", "s"], ["吞酸", "s"], ["脉滑", "s"]]}, {"id": "hw#47", "c": "07-01", "cn": "胃痛", "t": "A1型", "q": "寒邪客胃之胃痛的脉象多为", "o": [["A", "浮脉"], ["B", "弦脉"], ["C", "革脉"], ["D", "浮紧脉"], ["E", "弦紧脉"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "寒邪客胃：寒主收引，胃痛暴作、拘急冷痛、得温痛减、苔薄白 → 脉弦紧（弦主痛，紧主寒）。浮紧是风寒在表，不在胃。", "ol": {"A": "浮脉：表证。", "B": "弦脉：主痛、主肝，单弦见于肝气犯胃。", "C": "革脉：亡血失精，非本证。", "D": "浮紧脉：风寒束表。", "E": "弦紧脉：正确。"}, "hl": [["寒邪客胃", "k"]]}, {"id": "hw#48", "c": "07-02", "cn": "胃痞", "t": "A1型", "q": "脘腹满闷，时轻时重，喜温喜按，纳呆，便溏，神疲乏力，少气懒言，语声低微，舌质淡红，苔薄白，脉细弱。治法宜选", "o": [["A", "疏肝解郁，和胃消痞"], ["B", "清热化湿，和胃消痞"], ["C", "理气宽胸，补泻并用"], ["D", "补气健脾，升清降浊"], ["E", "和胃降气，消痞开结"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["07-02-4"], "B": ["07-02-3"], "D": ["07-02-5"]}, "z": "07-02-5", "why": "脘腹满闷时轻时重（虚痞）+ 喜温喜按 + 纳呆便溏、少气懒言、语声低微、脉细弱 → 胃痞脾胃虚弱，补气健脾、升清降浊，补中益气汤。喜按示内无实邪，不是饮食、痰湿等实痞。", "ol": {"A": "疏肝解郁、和胃消痞：肝胃不和（越鞠丸合枳术丸），胸胁胀满、嗳气。", "B": "清热化湿、和胃消痞：湿热阻胃，苔黄腻、口苦。", "C": "理气宽胸、补泻并用：不是胃痞证型治法。", "D": "补气健脾、升清降浊：正确。", "E": "和胃降气、消痞开结：偏治实痞，不补虚。"}, "hl": [["喜温喜按", "k"], ["少气懒言", "k"], ["时轻时重", "k"], ["便溏", "k"], ["脘腹满闷", "s"], ["语声低微", "s"], ["苔薄白", "s"], ["脉细弱", "s"], ["喜温", "s"], ["喜按", "s"], ["纳呆", "s"], ["神疲", "s"], ["乏力", "s"], ["少气", "s"], ["懒言", "s"]]}, {"id": "hw#49", "c": "07-02", "cn": "胃痞", "t": "A1型", "q": "胃痞以下列何项症状为主症", "o": [["A", "胃脘疼痛"], ["B", "胃脘满闷"], ["C", "胸脘痞闷"], ["D", "胸膈不舒"], ["E", "胸脘闷痛"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "胃痞主症：自觉胃脘（心下）痞塞满闷，触之无形、按之柔软、压之无痛。关键是“满闷而不痛”、部位在胃脘。", "ol": {"A": "胃脘疼痛：胃痛主症。", "B": "胃脘满闷：正确。", "C": "胸脘痞闷：范围连胸，偏胸痹、痰湿；部位不准。", "D": "胸膈不舒：在胸，不在胃脘。", "E": "胸脘闷痛：有痛，偏胸痹或胃痛。"}, "hl": [["主症", "k"]]}, {"id": "hw#50", "c": "07-02", "cn": "胃痞", "t": "A1型", "q": "胃痞的治疗基本法则是", "o": [["A", "疏肝解郁行气，化湿和胃消痞"], ["B", "清热化湿行气，健脾和胃消痞"], ["C", "理气宽胸消痞，补泻升降并用"], ["D", "补气健脾化湿，升清降浊和胃"], ["E", "调理脾胃升降，行气除痞消满"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "胃痞基本病机是中焦气机不利、脾胃升降失职，故基本治则为调理脾胃升降、行气除痞消满；实者泻之（消食、化痰、清热、疏肝），虚者补之。", "ol": {"A": "疏肝解郁行气、化湿和胃消痞：只针对肝胃不和、湿阻，非总则。", "B": "清热化湿行气、健脾和胃消痞：偏湿热阻胃。", "C": "理气宽胸消痞、补泻升降并用：表述不准，非教材总则。", "D": "补气健脾化湿、升清降浊和胃：偏脾胃虚弱。", "E": "调理脾胃升降、行气除痞消满：正确。"}, "hl": [["基本法则", "k"]]}, {"id": "hw#51", "c": "hw", "cn": "痰饮", "t": "A1型", "q": "膈上病痰，满喘咳吐，发则寒热，背痛腰疼，目泣自出，其人振振身剧，必有", "o": [["A", "痰湿"], ["B", "风寒"], ["C", "风热"], ["D", "伏饮"], ["E", "痰瘀"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "《金匮要略·痰饮咳嗽病脉证并治》原文：「膈上病痰，满喘咳吐，发则寒热……必有伏饮」。伏饮＝寒饮久伏胸膈、平时不显，遇外寒触动则发作（发则寒热、喘满咳吐），即支饮之寒饮伏肺（小青龙汤）。记：膈上 + 遇寒发作 → 「伏」。", "ol": {"A": "痰湿：泛称，原文不用；痰湿多见困重苔腻，无「发则寒热」的伏而复发特征", "B": "风寒：只是触发伏饮的外因，原文问的是体内「必有」之邪", "C": "风热：条文全无热象（无口渴、痰黄）", "D": "伏饮：正答，原文结论，宿饮内伏、遇寒即发", "E": "痰瘀：无瘀象（刺痛、舌紫），原文亦不涉瘀"}, "hl": [["膈上病痰", "k"], ["发则寒热", "k"], ["目泣自出", "k"]]}, {"id": "hw#52", "c": "07-03", "cn": "呕吐", "t": "A1型", "q": "下列除哪项外，均为胃阴亏虚型呕吐的主症", "o": [["A", "呕吐反复或时作干呕"], ["B", "似饥而不欲食"], ["C", "嗳气吞酸"], ["D", "口干咽燥"], ["E", "舌红少津"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "胃阴不足型呕吐主症：呕吐反复或时作干呕、似饥而不欲食、口燥咽干、舌红少津、脉细数。「嗳气吞酸」是肝气犯胃呕吐的特征（肝郁化火犯胃），不属胃阴虚，故选C。", "ol": {"A": "呕吐反复或时作干呕：属胃阴虚主症，阴虚胃失濡润、气逆而无物可吐", "B": "似饥而不欲食：属胃阴虚秒杀症，虚火消谷则似饥、胃弱不纳则不欲食", "C": "嗳气吞酸：正答（不属），是肝气犯胃呕吐的表现", "D": "口干咽燥：属胃阴虚，津不上承", "E": "舌红少津：属胃阴虚，阴虚有热、津亏"}, "hl": [["胃阴亏虚", "k"]]}, {"id": "hw#53", "c": "07-03", "cn": "呕吐", "t": "A2型", "q": "患者近日出现呕吐反复，时作干呕，似饥而不欲食，口燥咽干，舌红少津，苔少，脉细数。证属", "o": [["A", "外邪犯胃证"], ["B", "食滞内停证"], ["C", "痰饮内阻证"], ["D", "肝气犯胃证"], ["E", "胃阴不足证"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "呕吐反复、时作干呕 + 似饥而不欲食 + 口燥咽干、舌红少津脉细数 → 胃阴不足证（麦门冬汤，滋养胃阴、降逆止呕）。关键对比：似饥而不欲食是阴虚有热；脾胃虚寒是不饥不食、舌淡。", "ol": {"A": "外邪犯胃：突然呕吐，兼恶寒发热、头身痛；本题反复发作、无表证", "B": "食滞内停：呕吐酸腐量多、嗳腐厌食、苔厚腻；本题干呕、少苔", "C": "痰饮内阻：呕吐清水痰涎、胃中如囊裹水、苔白腻；本题舌红少津", "D": "肝气犯胃：吞酸嗳气、情志诱发、脉弦；本题无肝郁", "E": "胃阴不足证：正答，干呕 + 似饥不欲食 + 舌红少津"}, "hl": [["似饥而不欲食", "k"], ["时作干呕", "k"], ["舌红少津", "k"]]}, {"id": "hw#54", "c": "07-03", "cn": "呕吐", "t": "A2型", "q": "患者胃脘胀闷，饮食喜热，吐酸时发，嗳气酸腐，喜唾涎沫，四肢不温，大便溏泄舌质淡，苔白，脉沉迟。治法宜用", "o": [["A", "温中散寒，宽胸下气"], ["B", "燥湿祛痰，健脾和胃"], ["C", "疏肝和胃，降逆止呕"], ["D", "温养脾胃，降逆止呕"], ["E", "消食化滞，和胃降逆"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["07-01-10"], "C": ["07-03-4"], "E": ["07-03-2"]}, "z": "07-01-10", "why": "吐酸时发 → 病是吐酸（胃痛篇附），不是呕吐；喜唾涎沫 + 饮食喜热、四肢不温、便溏、舌淡脉沉迟 → 吐酸寒证，治温中散寒、宽胸下气（香砂六君子汤）。陷阱：嗳气酸腐寒热都可见，不能据此判饮食停滞；寒证认喜唾涎沫。", "ol": {"A": "温中散寒，宽胸下气：正答，吐酸寒证的治法", "B": "燥湿祛痰，健脾和胃：针对痰湿中阻（困重苔腻），本题是虚寒不是痰湿", "C": "疏肝和胃，降逆止呕：呕吐肝气犯胃之法，本题无情志、脉不弦", "D": "温养脾胃，降逆止呕：近呕吐脾胃虚寒之法，但本题主症是吐酸而非呕吐，要宽胸下气", "E": "消食化滞，和胃降逆：呕吐饮食停滞之法，本题无伤食史、苔不厚腻"}, "hl": [["喜唾涎沫", "k"], ["四肢不温", "k"], ["吐酸时发", "k"], ["嗳气酸腐", "t"], ["饮食喜热", "t"], ["胃脘胀闷", "s"], ["脉沉迟", "s"], ["吐酸", "s"], ["便溏", "s"], ["苔白", "s"]]}, {"id": "hw#55", "c": "07-03", "cn": "呕吐", "t": "A1型", "q": "脾胃虚寒，恶心呕吐，胃痛，食欲不振者，方用", "o": [["A", "参附汤"], ["B", "香砂六君子汤"], ["C", "四逆汤"], ["D", "理中丸"], ["E", "金匮肾气丸"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["04-04-8", "05-01-4"], "B": ["05-04-8", "07-01-10"], "D": ["07-03-5"], "E": ["04-03-9", "04-04-7"]}, "z": "05-04-8", "why": "胃痛脾胃虚寒主方黄芪建中汤；其加减：虚寒兼呕（恶心呕吐、食欲不振）→ 改用香砂六君子汤，健脾益气、理气和胃止呕。本题以胃痛为主体兼呕吐纳差，故取香砂六君子；理中丸是呕吐篇脾胃虚寒的主方，题眼「胃痛」把它排除。", "ol": {"A": "参附汤：回阳益气固脱，用于喘脱、心阳暴脱、中风脱证", "B": "香砂六君子汤：正答，虚寒胃痛兼呕、纳差", "C": "四逆汤：回阳救逆，用于亡阳四肢厥逆，病重得多", "D": "理中丸：呕吐脾胃虚寒、呃逆脾胃阳虚主方，偏温中，缺理气和胃，非胃痛兼呕之加减方", "E": "金匮肾气丸：温补肾阳，用于喘证肾虚不纳、消渴阴阳两虚"}, "hl": [["脾胃虚寒", "k"], ["食欲不振", "k"], ["胃痛", "k"]]}, {"id": "hw#56", "c": "05-03", "cn": "心衰", "t": "A2型", "q": "患者胸闷气短，心悸，活动后诱发，神疲乏力，自汗，口唇发绀，胸部闷痛，肢肿时作，喘息不得卧，舌淡暗有瘀斑，脉沉细。证属", "o": [["A", "气血亏虚证"], ["B", "气滞血瘀证"], ["C", "心气亏虚证"], ["D", "气虚血瘀证"], ["E", "气虚痰湿证"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "胸闷气短、心悸、喘息不得卧 → 心衰；神疲乏力、自汗（气虚）+ 口唇发绀、舌淡暗有瘀斑（血瘀）+ 肢肿时作（水停尚轻、随劳逸起伏）→ 气虚血瘀证（保元汤合血府逐瘀汤）。「活动后诱发」心衰各证通用，不定证；阳虚水泛是面浮肢肿、尿少、畏寒肢冷。", "ol": {"A": "气血亏虚证：要有面白唇淡、头晕等血虚象，且不应有瘀斑", "B": "气滞血瘀证：不是心衰的证型，且本题以气虚（乏力自汗）为本，非气滞", "C": "心气亏虚证：只说对一半，漏了发绀、瘀斑的血瘀", "D": "气虚血瘀证：正答，自汗 + 瘀斑 + 肢肿时作", "E": "气虚痰湿证：应见痰多、苔腻、头身困重，本题无"}, "hl": [["舌淡暗有瘀斑", "k"], ["肢肿时作", "k"], ["自汗", "k"]]}, {"id": "hw#57", "c": "hw", "cn": "呃逆", "t": "A1型", "q": "以呃逆的声音辨证，下列何者为胃火上逆型呃逆", "o": [["A", "呃声沉缓"], ["B", "呃声洪亮，冲逆而出"], ["C", "呃声连声"], ["D", "呃声低长无力，气不得续"], ["E", "呃声短促而不得续"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "呃逆以声辨证：洪亮有力、冲逆而出 = 胃火上逆（竹叶石膏汤）；沉缓有力 = 胃中寒冷；呃逆连声 = 气机郁滞；低长无力、气不得续 = 脾胃阳虚；短促不连续 = 胃阴不足。记：实证声高、虚证声低；火则洪、寒则沉。", "ol": {"A": "呃声沉缓：胃中寒冷（丁香散），得热则减", "B": "呃声洪亮，冲逆而出：正答，胃火上冲", "C": "呃声连声：气机郁滞（五磨饮子），情志诱发", "D": "呃声低长无力，气不得续：脾胃阳虚（理中丸）", "E": "呃声短促而不得续：胃阴不足（益胃汤合橘皮竹茹汤）"}, "hl": [["胃火上逆", "k"]]}, {"id": "hw#58", "c": "hw", "cn": "呃逆", "t": "A1型", "q": "伏热在胃，令人胸满，胸满则气逆，气逆则", "o": [["A", "吐"], ["B", "呕"], ["C", "闷"], ["D", "痛"], ["E", "哕"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "「哕」即呃逆的古称（《内经》称哕，后世张景岳明言哕即呃逆）。伏热在胃 → 胸满 → 气逆 → 哕，说明胃气上逆动膈是呃逆的基本病机。辨：呕＝有声有物，吐＝有物无声，哕＝喉间呃呃连声、短促不能自制。", "ol": {"A": "吐：有物无声，是呕吐，不是本条结论", "B": "呕：有声有物，属呕吐", "C": "闷：只是症状，非病名", "D": "痛：与原文无关", "E": "哕：正答，即呃逆"}, "hl": [["伏热在胃", "k"], ["气逆则", "k"]]}, {"id": "hw#59", "c": "hw", "cn": "呃逆", "t": "A1型", "q": "胃阴不足型呃逆，应选用", "o": [["A", "丁香散"], ["B", "竹叶石膏汤"], ["C", "益胃汤"], ["D", "五磨饮子"], ["E", "理中丸"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["07-05-1"], "B": ["07-05-2"], "C": ["07-05-5"], "D": ["07-05-3"], "E": ["07-05-4"]}, "z": "07-05-5", "why": "呃逆胃阴不足：呃声短促不连续、口干咽燥、舌红少苔脉细数 → 养胃生津、降逆止呃，益胃汤合橘皮竹茹汤。呃逆五证方一一对应：寒丁香、火竹叶石膏、气五磨、阳虚理中、阴虚益胃。", "ol": {"A": "丁香散：胃中寒冷呃逆", "B": "竹叶石膏汤：胃火上逆呃逆", "C": "益胃汤：正答，胃阴不足呃逆（合橘皮竹茹汤）", "D": "五磨饮子：气机郁滞呃逆", "E": "理中丸：脾胃阳虚呃逆"}, "hl": [["胃阴不足", "k"]]}, {"id": "hw#60", "c": "07-04", "cn": "噎膈", "t": "A2型", "q": "患者吞咽梗涩而痛，食入即复出，甚则水饮难进，心烦口干，胃脘灼热，五心烦热，形体消瘦，皮肤干燥，小便短赤，大便干结如羊粪，舌质红，干裂少津，脉细数。\n呃声短促而不连续，口干舌燥，不思饮食，或有烦渴，或食后饱胀，大便干结，舌红苔少，脉细数。其治法", "o": [["A", "温中散寒，降逆止呕"], ["B", "清胃泻热，降逆止呕"], ["C", "顺气解郁，和胃降逆"], ["D", "养胃生津，降逆止呕"], ["E", "滋阴清热，润燥生津"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {"E": ["07-04-2"]}, "z": "07-04-2", "why": "首段：吞咽梗涩而痛、食入即复出 + 胃脘灼热、五心烦热 + 便干如羊粪、舌红干裂少津 → 噎膈津亏热结，治滋阴清热、润燥生津（沙参麦冬汤）。注意题干第二段「呃声短促而不连续……」是呃逆胃阴不足的条文（治养胃生津、降逆止呃，近D），疑为两题误并；按官方答案以首段噎膈为准。", "ol": {"A": "温中散寒，降逆止呕：寒证之法，本题满纸燥热", "B": "清胃泻热，降逆止呕：实火（呃逆胃火上逆，呃声洪亮、口臭），本题是阴亏之热", "C": "顺气解郁，和胃降逆：气郁之法（痰气交阻、气机郁滞），本题无情志", "D": "养胃生津，降逆止呕：合第二段呃逆胃阴不足，不合首段噎膈", "E": "滋阴清热，润燥生津：正答，噎膈津亏热结"}, "hl": [["大便干结如羊粪", "k"], ["吞咽梗涩而痛", "k"], ["五心烦热", "k"], ["羊粪", "k"], ["细数", "k"], ["梗涩", "k"], ["食入即复出", "s"], ["水饮难进", "s"], ["胃脘灼热", "s"], ["形体消瘦", "s"], ["皮肤干燥", "s"], ["小便短赤", "s"], ["脉细数", "s"], ["心烦", "s"], ["口干", "s"], ["舌红", "s"]]}, {"id": "hw#61", "c": "07-04", "cn": "噎膈", "t": "A1型", "q": "朝食暮吐，暮食朝吐，终致完谷尽吐而始感舒畅为主症，属", "o": [["A", "呕吐"], ["B", "嗳气"], ["C", "胃痞"], ["D", "反胃"], ["E", "噎膈"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "朝食暮吐、暮食朝吐、宿谷不化、吐尽始舒 → 反胃（脾胃虚寒、胃中无火，丁香透膈汤）。关键对比：噎膈是吞咽梗阻、食不得下或食入即吐，病在食管；反胃是食已入胃、良久反出，病在胃。", "ol": {"A": "呕吐：吐无定时，多食已即吐，无「朝食暮吐」规律", "B": "嗳气：气从胃中上逆出声，无食物吐出", "C": "胃痞：心下痞塞满闷，不吐食", "D": "反胃：正答", "E": "噎膈：吞咽梗阻、食入即吐，不是隔夜吐出"}, "hl": [["朝食暮吐", "k"], ["完谷尽吐", "k"]]}, {"id": "hw#62", "c": "07-04", "cn": "噎膈", "t": "A1型", "q": "下列哪一本著作提出“脘管窄隘”。", "o": [["A", "《临证指南医案》"], ["B", "《金匮要略》"], ["C", "《诸病源候论》"], ["D", "《景岳全书》"], ["E", "《黄帝内经》"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "叶天士《临证指南医案·噎膈反胃》提出噎膈的病理为「脘管窄隘」（食管狭窄、饮食难下）。记：叶天士 → 临证指南 → 管道窄。", "ol": {"A": "《临证指南医案》：正答，叶天士", "B": "《金匮要略》：论「胃反」朝食暮吐、宿谷不化", "C": "《诸病源候论》：分气、忧、食、劳、思五噎", "D": "《景岳全书》：强调噎膈因忧愁思虑、酒色过度，并辨噎膈与反胃", "E": "《黄帝内经》：「三阳结谓之隔」，提出隔的概念"}, "hl": []}, {"id": "hw#63", "c": "07-03", "cn": "呕吐", "t": "A2型", "q": "患者嘈杂而兼恶心吞酸，口渴喜冷，口臭心烦，脘闷痰多，多食易饥，舌质红，苔黄干，脉滑数。应选用", "o": [["A", "泻心汤"], ["B", "竹叶石膏汤"], ["C", "黄连温胆汤"], ["D", "五磨饮子"], ["E", "玉女煎"]], "a": "C", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["07-02-3", "10-02-5"], "B": ["04-05-4", "07-05-2"], "C": ["05-01-7", "05-04-2"], "D": ["04-04-5", "07-05-3"], "E": ["10-02-2", "10-04-2"]}, "z": "05-01-7", "why": "嘈杂 → 嘈杂病（胃痛篇附）；口渴喜冷、口臭心烦、多食易饥、舌红苔黄干脉滑数 = 胃热，脘闷痰多 = 夹痰 → 嘈杂胃热证，清热化痰和中，黄连温胆汤。关键在「痰多」：单纯胃火（竹叶石膏汤、玉女煎）无痰。", "ol": {"A": "泻心汤：清热燥湿，用于胃痞湿热阻胃（合连朴饮）、胃热吐血", "B": "竹叶石膏汤：呃逆胃火上逆，清胃生津，不化痰", "C": "黄连温胆汤：正答，胃热夹痰之嘈杂", "D": "五磨饮子：顺气降逆，用于呃逆气机郁滞、喘证肺气郁痹", "E": "玉女煎：清胃滋阴，用于消渴中消、齿衄胃火，不化痰"}, "hl": [["口渴喜冷", "k"], ["嘈杂", "k"], ["痰多", "k"]]}, {"id": "hw#64", "c": "07-03", "cn": "呕吐", "t": "A2型", "q": "患者吐酸时发，嗳气酸腐，胃脘胀闷，喜唾涎沫，饮食喜热，四肢不温，大便溏泄，舌质淡，苔白，脉沉迟。应选用", "o": [["A", "半夏泻心汤"], ["B", "香砂六君子汤"], ["C", "温胆汤"], ["D", "理中丸"], ["E", "六君子汤"]], "a": "B", "x": "", "k": "作业", "hw": 1, "oz": {"B": ["05-04-8", "07-01-10"], "D": ["07-03-5"], "E": ["04-03-8", "06-06-4"]}, "z": "05-04-8", "why": "吐酸时发 → 吐酸；喜唾涎沫 + 饮食喜热、四肢不温、便溏、舌淡脉沉迟 → 吐酸寒证（温中散寒、宽胸下气），方用香砂六君子汤。对比：理中丸、六君子汤都缺木香砂仁的理气温中、宽胸下气。", "ol": {"A": "半夏泻心汤：寒热错杂之痞，本题纯寒无热", "B": "香砂六君子汤：正答，吐酸寒证", "C": "温胆汤：胆郁痰扰（失眠、惊悸），本题是虚寒", "D": "理中丸：温中散寒，呕吐脾胃虚寒主方，缺理气宽胸", "E": "六君子汤：健脾化痰（哮病脾虚、痫证脾虚痰盛），缺木香砂仁温中行气"}, "hl": [["吐酸时发", "k"], ["喜唾涎沫", "k"], ["四肢不温", "k"], ["便溏", "s"]]}, {"id": "hw#65", "c": "06-05", "cn": "癫狂", "t": "A3型", "q": "患者性情急躁，头痛失眠，两目怒视，面红目赤，突发狂暴无知，逾垣上屋，骂詈号叫，不避亲疏，毁物伤人，舌质红绛，苔黄腻，脉弦滑数。\n根据上述患者的证候，此病辨证为", "o": [["A", "肝火热毒证"], ["B", "心火扰动证"], ["C", "肝火上炎证"], ["D", "痰火扰神证"], ["E", "热毒内盛证"]], "a": "D", "x": "", "k": "作业", "hw": 1, "oz": {}, "z": null, "why": "狂暴无知、逾垣上屋、骂詈号叫、毁物伤人 → 狂证；性情急躁、面红目赤、两目怒视 = 肝火，舌红绛苔黄腻、脉弦滑数 = 痰热 → 痰火扰神证（狂证初起）。痰与火两字缺一不可。", "ol": {"A": "肝火热毒证：非教材证名，漏了「痰」（苔黄腻、脉滑）", "B": "心火扰动证：非狂证证型，无法解释苔黄腻", "C": "肝火上炎证：头痛、眩晕、耳鸣常见证名，漏「痰」，且非狂证分型", "D": "痰火扰神证：正答", "E": "热毒内盛证：非狂证证型，无痰"}, "hl": [["突发狂暴无知", "k"], ["骂詈号叫", "k"], ["苔黄腻", "k"]]}, {"id": "hw#66", "c": "06-05", "cn": "癫狂", "t": "A3型", "q": "患者性情急躁，头痛失眠，两目怒视，面红目赤，突发狂暴无知，逾垣上屋，骂詈号叫，不避亲疏，毁物伤人，舌质红绛，苔黄腻，脉弦滑数。\n根据上述患者的证候，治疗时采用的治法为", "o": [["A", "镇心涤痰，清肝泻火"], ["B", "清热解毒，通络达邪"], ["C", "健脾疏肝，清热解毒"], ["D", "健脾清热，安神定志"], ["E", "健脾化痰，安神定志"]], "a": "A", "x": "", "k": "作业", "hw": 1, "oz": {"A": ["06-05-3"], "B": ["06-04-7"]}, "z": "06-05-3", "why": "同前：狂证痰火扰神（面红目赤 = 肝火，苔黄腻脉滑 = 痰）→ 治镇心涤痰、清肝泻火（生铁落饮）。镇心对狂暴，涤痰对痰，清肝对火。", "ol": {"A": "镇心涤痰，清肝泻火：正答", "B": "清热解毒，通络达邪：清热毒之法，不涤痰、不镇心", "C": "健脾疏肝，清热解毒：狂证急期实证，不用健脾", "D": "健脾清热，安神定志：同样不该健脾，且无涤痰", "E": "健脾化痰，安神定志：偏虚证，忽略火盛"}, "hl": [["突发狂暴无知", "k"], ["面红目赤", "k"], ["苔黄腻", "k"], ["骂詈", "k"], ["毁物", "k"], ["怒视", "k"], ["两目怒视", "s"], ["狂暴无知", "s"], ["逾垣上屋", "s"], ["骂詈号叫", "s"], ["不避亲疏", "s"], ["毁物伤人", "s"], ["脉弦滑数", "s"], ["头痛", "s"], ["失眠", "s"], ["面红", "s"], ["目赤", "s"]]}, {"id": "hw#67", "c": "06-05", "cn": "癫狂", "t": "A3型", "q": "患者性情急躁，头痛失眠，两目怒视，面红目赤，突发狂暴无知，逾垣上屋，骂詈号叫，不避亲疏，毁物伤人，舌质红绛，苔黄腻，脉弦滑数。\n根据上述患者的证候，治疗采用的代表方为", "o": [["A", "小柴胡汤"], ["B", "龙胆泻肝汤"], ["C", "黄连解毒汤"], ["D", "六味地黄丸"], ["E", "生铁落饮"]], "a": "E", "x": "", "k": "作业", "hw": 1, "oz": {"B": ["05-04-1", "06-06-3"], "C": ["06-04-7", "06-06-1"], "D": ["05-04-4", "08-04-6"], "E": ["06-05-3"]}, "z": "06-05-3", "why": "狂证痰火扰神，镇心涤痰、清肝泻火 → 生铁落饮（生铁落重镇降逆，胆星、贝母、橘红涤痰，二冬、玄参清热） 患者时，应戴口罩"]], "a": "D", "x": "肺痨病有时虽具火旺表现，但本质在于阴虚，故当以甘寒养阴为主，适当佐以清火。若徒持苦寒直折，过量或久用，可苦燥伤阴，寒凉败胃伤脾。故选D。", "k": "概念", "oz": {}, "z": null, "hl": []}, {"id": "04-06#21", "c": "04-06", "t": "A2型", "q": "患者，男，45岁。病起半年，呛咳气急，痰少质黏，痰中带血，颧红，口干咽燥，午后潮热，梦遗，盗汗量多，心烦失眠，舌质干红，苔薄黄，脉细数。其治法是", "o": [["A", "滋阴润肺"], ["B", "养阴润肺，益气健脾"], ["C", "滋阴补阳，培元固本"], ["D", "补益肺肾，滋阴降火"], ["E", "润燥化痰，补脾益肾"]], "a": "D", "x": "患者咳嗽、咯血、潮热、盗汗，故诊断为肺痨。呛咳气急，为阴津受损，阴虚肺燥，肺失滋润所致；肺损络伤，故痰中带血；阴虚生热，虚热内灼，故颧红，口干咽燥，午后潮热；肺肾相生，肺虚肾失滋生之源，故梦遗；舌质干红，苔薄黄，脉细数，均为阴虚火旺之象。辨证为虚火灼肺，其治法是补益肺肾，滋阴降火。故选D。", "k": "治法", "oz": {"A": ["04-06-1"], "B": ["04-06-3"], "C": ["04-06-4"], "D": ["04-06-2"]}, "z": "04-06-2", "hl": [["盗汗量多", "k"], ["呛咳", "k"], ["午后潮热", "s"], ["痰中带血", "s"], ["苔薄黄", "s"], ["脉细数", "s"], ["气急", "s"], ["痰少", "s"], ["盗汗", "s"], ["颧红", "s"], ["心烦", "s"], ["失眠", "s"], ["梦遗", "s"], ["口干", "s"], ["脉细", "s"], ["苔薄", "s"]]}, {"id": "04-06#22", "c": "04-06", "t": "A2型", "q": "患者，男，66岁。肺痨迁延2年余，咳嗽声低无力，痰白质黏，痰中偶夹有血，血色淡红，午后潮热，面颧红赤，神疲乏力，食欲不振，大便溏薄，自汗，盗汗，面色少华，舌光，边有齿印，脉细弱。其治疗应首选", "o": [["A", "百合固金汤"], ["B", "保真汤"], ["C", "月华丸"], ["D", "补天大造丸"], ["E", "秦艽鳖甲散"]], "a": "B", "x": "患者肺痨迁延不愈，咳嗽声低无力，午后潮热，面颧红赤，神疲乏力，食欲不振，属气阴耗伤。由阴伤气耗，清肃失司，肺虚络损，气阴亏损所致，治疗应选用养阴润肺、益气健脾的保真汤。故选B。", "k": "方", "oz": {"A": ["04-06-2"], "B": ["04-06-3"], "C": ["04-06-1"], "D": ["04-06-4"], "E": ["04-06-2"]}, "z": "04-06-3", "hl": [["血色淡红", "k"], ["咳嗽声低无力", "s"], ["午后潮热", "s"], ["面色少华", "s"], ["颧红", "s"], ["盗汗", "s"], ["自汗", "s"], ["神疲", "s"], ["便溏", "s"], ["咳嗽", "s"], ["痰白", "s"], ["乏力", "s"], ["脉细", "s"]]}, {"id": "04-06#23", "c": "04-06", "t": "A2型", "q": "患者，男，42岁。近1月来干咳，咳声短促，痰中带血丝，血色鲜红，口干咽燥，胸部隐痛，午后手足心热，皮肤干灼，少量盗汗，舌边尖红，苔薄少津，脉细。其治法是", "o": [["A", "滋阴润肺"], ["B", "养阴润肺，益气健脾"], ["C", "滋阴补阳，培元固本"], ["D", "补益肺肾，滋阴降火"], ["E", "润燥化痰，补脾益肾"]], "a": "A", "x": "患者咳嗽、咯血、潮热、盗汗，故诊断为肺痨。干咳，咳声短促，乃阴虚肺燥，肺失滋润所致；肺损络伤，故痰中带血丝；肺阴耗伤，津不上乘，故口干咽燥，午后手足心热；阴精耗损，不能濡养皮肤，故皮肤干灼；舌边尖红，苔薄少津，脉细，均为阴虚之象。辨证为肺阴亏损，其治法是滋阴润肺。故选A。", "k": "治法", "oz": {"A": ["04-06-1"], "B": ["04-06-3"], "C": ["04-06-4"], "D": ["04-06-2"]}, "z":  "二便自遗"], ["E", "肢体强痉"]], "a": "D", "x": "中风闭证为邪气内闭清窍所致，可见肢体强痉、口噝不开、牙关紧闭、两手握固、大便秘结等症，而二便自遗是中风脱证的表现。故选D。", "k": "症状", "oz": {}, "z": null, "hl": []}, {"id": "06-03#13", "c": "06-03", "t": "A1型", "q": "下列何种病理因素是中风阳闭、阴闭的鉴别要点", "o": [["A", "痰浊"], ["B", "火热"], ["C", "血瘀"], ["D", "气滞"], ["E", "肝风"]], "a": "B", "x": "阳闭症状兼有面赤身热，口臭气粗，躁扰不宁，舌红，苔黄腻，脉弦滑数，突出热象；阴闭可有面白唇暗，四肢不温，痰涎壅盛，舌淡苔腻，脉沉滑或缓，则是阴寒之象。故选B。", "k": "鉴别", "oz": {}, "z": null, "hl": []}, {"id": "06-03#14", "c": "06-03", "t": "A1型", "q": "下列关于中风辨证要点的叙述正确的是", "o": [["A", "首辨闭证与脱证"], ["B", "中经络者辨闭证与脱证"], ["C", "中经络者仅出现肢体不用，无口眼歪斜"], ["D", "中经络者意识清楚，中脏腑者神志昏迷"], ["E", "脱证常骤然起病"]], "a": "D", "x": "中风辨证方面首辨中经络与中脏腑，中经络者表现为半身不遂，肌肤不仁，口舌歪斜，中脏腑者伴有神志昏蒙或神志恍惚；中脏腑进一步需鉴别闭证与脱证，其中风阳痰火炽盛耗灼阴精，阴虚及阳，阴竭阳亡，阴阳离决，则出现脱证，所以脱证非骤然起病。故选D。", "k": "证型", "oz": {}, "z": null, "hl": []}, {"id": "06-03#15", "c": "06-03", "t": "A1型", "q": "下列有关中风的论述错误的是", "o": [["A", "中经络以平肝息风、化痰祛瘀通络为主"], ["B", "中脏腑闭证，治当息风清火，豁痰开窍，通腑泄热"], ["C", "对内闭外脱之证，则须醒神开窍与扶正固脱兼用"], ["D", "脱证急宜救阴回阳固脱"], ["E", "发作时口吐白沫"]], "a": "E", "x": "中经络之证，病位较浅，每因风痰瘀阻滞经脉，或肝风夹痰引发，治以平肝息风、化痰祛瘀通络为主；中脏腑之证为风阳痰火蒙蔽清窍，治当息风清火，豁痰开窍，通腑泄热；中脏腑因邪正虚实的不同，有闭、脱之分，又可出现内闭外脱、由闭转脱的演变，对内闭外脱之证，则须醒神开窍与扶正固脱兼用；脱证急宜救阴回阳固脱。发作时口吐白沫是痫病的症状。故选E。", "k": "概念", "oz": {}, "z": null, "hl": []}, {"id": "06-03#16", "c": "06-03", "t": "A1型", "q": "中风之中经络与中脏腑之区别在于", "o": [["A", "有无神志不清"], ["B", "有无后遗症"], ["C", "外风与内风"], ["D", "夹痰与夹瘀"], ["E", "有无半身不遂"]], "a": "A", "x": "中风中经络、中脏腑均有半身不遂，肌肤不仁，口舌歪斜症状；中经络病位较浅，病情较轻，多不伴有神志昏蒙或神志恍惚；中脏腑病位较深，病情较重，多伴有神志昏蒙或神志恍惚。故选A。", "k": "鉴别", "oz": {}, "z": null, "hl": []}, {"id": "06-03#17", "c": "06-03", "t": "A1型", "q": "治疗中风中经络阴虚风动的代表方剂是", "o": [["A", "羚角钩藤汤"], ["B", "天麻钩藤饮"], ["C", "镇肝息风汤"], ["D", "解语丹"], ["E", "地黄饮子"]], "a": "C", "x": "中风阴虚风动的病机是肝肾亏虚，风阳内动，上扰清窍，治疗当用镇肝息风汤滋养肝肾，潜阳息风。故选C。", "k": "方", "oz": {"A": ["06-03-5"], "B": ["06-03-2"], "C": ["06-03-3"], "D": ["06-03-8"], "E": ["06-03-10"]}, "z": "06-03-3", "hl": []}, {"id": "06-03#18", "c": "06-03", "t": "A1型", "q": "用天麻钩藤饮治疗中风中经络风阳上扰，若头痛较重，应加用", "o": [["A", "生地、沙 "k": "其他", "oz": {}, "z": null, "hl": [["口吐涎沫", "s"]]}, {"id": "06-06#8", "c": "06-06", "t": "A1型", "q": "痫证与中风的共同点是", "o": [["A", "突然仆倒，昏不知人"], ["B", "四肢抽搐，口中怪叫"], ["C", "半身不遂，口舌歪斜"], ["D", "口吐涎沫，两目上视"], ["E", "言语謇涩，行走不稳"]], "a": "A", "x": "痫证是以发作性神情恍惚，甚则突然仆倒，昏不知人，口吐涎沫，两目上视，肢体抽搐，或口中怪叫，移时苏醒，醒后一如常人为主症的疾病；中风是以半身不遂，肌肤不仁，口舌歪斜，言语不利，甚则突然昏仆、不省人事为主要表现的病证。痫证典型大发作与中风均有突然仆倒、昏不知人等症状。故选A。", "k": "鉴别", "oz": {}, "z": null, "hl": []}, {"id": "06-06#9", "c": "06-06", "t": "A1型", "q": "与痫证关系最密切的病理因素是", "o": [["A", "风"], ["B", "火"], ["C", "瘀"], ["D", "痰"], ["E", "气"]], "a": "D", "x": "痫证病理因素涉及风、火、痰、瘀等，其中尤以痰邪作祟最为重要，《医学纲目·癫痫》所云“癫痫者，痰邪逆上也”即是此意。积痰内伏，每由风火触动，痰瘀互结，上蒙清窍而发病。故选D。", "k": "病因", "oz": {}, "z": null, "hl": []}, {"id": "06-06#10", "c": "06-06", "t": "A1型", "q": "痫证七情失调主要责之于", "o": [["A", "大喜"], ["B", "愤怒"], ["C", "悲愁"], ["D", "思虑"], ["E", "惊恐"]], "a": "E", "x": "七情中主要责之于惊恐，如《证治汇补·痫证》云：“或因猝然闻惊而得，惊则神出舍空，痰涎乘间而归之。”由于突受惊恐，致气机逆乱，痰浊随气上逆，蒙蔽清窍，或五志过极化火生风，或肝郁日久化火生风，风火夹痰上犯清窍，元神失控，发为本病。小儿脏腑娇嫩，元气未充，神气怯弱，更易因惊恐而发生本病。故选E。", "k": "病机", "oz": {}, "z": null, "hl": []}, {"id": "06-06#11", "c": "06-06", "t": "A1型", "q": "痫证的基本病机为", "o": [["A", "气机逆乱，元神失控"], ["B", "脏腑失调，阴阳失衡"], ["C", "髓海见空，元神失养"], ["D", "阴阳失调，气血逆乱"], ["E", "气机阻滞，瘀血内结"]], "a": "A", "x": "痫证主要为先天或后天因素造成脏腑功能失调，脏气不平，阴阳失衡，而致气机逆乱，风、火、痰、瘀等邪闭塞清窍而发病，基本病机为气机逆乱，元神失控。故选A。", "k": "病机", "oz": {}, "z": null, "hl": []}, {"id": "06-06#12", "c": "06-06", "t": "A1型", "q": "下列属于痫证休止期的治则治法是", "o": [["A", "开窍定痫"], ["B", "清肝泻火"], ["C", "豁痰息风"], ["D", "健脾化痰"], ["E", "疏肝解郁"]], "a": "D", "x": "痫证的治疗首当分清标本虚实，轻重缓急。发作期病急，开窍醒神定痫以治其标，治宜清泻肝火，豁痰息风，开窍定痫；休止期病缓，祛邪补虚以治其本，治宜健脾化痰，滋补肝肾，养心安神等。故选D。", "k": "治法", "oz": {"D": ["06-06-4"]}, "z": "06-06-4", "hl": []}, {"id": "06-06#13", "c": "06-06", "t": "A1型", "q": "治疗痫证肝火痰热的代表方剂是", "o": [["A", "黄连解毒汤合定痫丸加减"], ["B", "逍遥散合涤痰汤加减"], ["C", "养心汤合越鞠丸加减"], ["D", "涤痰汤合苏合香丸加减"], ["E", "龙胆泻肝汤合涤痰汤加减"]], "a": "E", "x": "痫证肝火痰盛，病机为肝郁化火，痰火内盛，上扰元神，治宜清肝泻火，化痰宁心，代表方剂为龙胆泻肝汤合涤痰汤加减。故选E。", "k": "方", "oz": {"A": ["06-06-1"], "B": ["06-05-1"], "C": ["06-0
