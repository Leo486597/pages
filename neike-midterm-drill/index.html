function start(kind,c,list){list=adj(list);if(!list.length)return home();R={kind,c,list,i:0,ans:[]};quiz();scrollTo(0,0)}
function chRound(c){start("ch",c,expand(pick(D.qs.filter(q=>q.c===c),NCH)))}
function mock(){start("mock",null,expand(pick(D.qs,NMOCK)))}
function hwAll(){start("hw",null,D.qs.filter(q=>q.hw))}
function wrongs(c){return D.qs.filter(q=>(!c||q.c===c)&&S.st[q.id]&&S.st[q.id][2])}

function home(){
  R=null;const n=nextCh(),done=D.order.filter(ok).length,m=S.mock.slice(-8);
  const hw=D.qs.some(q=>q.hw), wa=wrongs().length;
  app.innerHTML=`<h1>内科期中 · A/B 型题过关</h1><p class="sub">按章节顺序：先看要点，再练 ${NCH} 题，≥80% 算过关。随时可以进模拟（${NMOCK} 题）。每轮结束给复盘。</p>
  <div class="card"><div class="row" style="justify-content:space-between"><b>${done} / ${D.order.length} 章过关</b><span class="hist">模拟：${m.length?m.map(pct).join(" → "):"还没做"}</span></div>
  <div class="bar"><i style="width:${done/D.order.length*100}%"></i></div>
  <div class="row">${n?`<button class="pri" data-go="c:${n}">下一章：${nm(n)}</button>`:`<b class="pass">全部过关</b>`}
  <button data-go="mock">模拟 ${NMOCK} 题</button>${hw?`<button data-go="hw">老师作业 100 题</button>`:""}${wa?`<button data-go="wa">错题本 ${wa}</button>`:""}</div></div>
  <p class="leg2"><b style="background:#c62828;color:#fff">重点</b> <b style="background:#fbeeb8;color:#8a5a00">次重点</b> 按老师作业题数 + 老师点到的考点数排（鼠标停在章节上看依据）</p>
  <div class="grid">${D.order.map(c=>{const l=last(c),[t,h,p,x]=D.pri[c];return `<div class="ch p${t}${ok(c)?" ok":""}${c===n?" nx":""}" data-go="c:${c}" title="作业 ${h} 题 · 老师点了 ${p} 处：${esc(x)}"><span>${nm(c)}${t<3?`<span class="pt">${t===1?"重点":"次"}</span>`:""}</span><small>${l==null?"":pct(l)}</small></div>`}).join("")}</div>
  ${D.head?`<details class="card"><summary>总论 · 老师点名的方药</summary><div class="sheet">${D.head}</div></details>`:""}
  <p class="hist" style="margin-top:20px">进度存在这个浏览器里。 <a href="#" data-go="reset" style="color:var(--mute)">清空进度</a></p>`;
}
function book(){
  R=null;const cs=[...D.order,"hw"].map(c=>[c,wrongs(c)]).filter(([,w])=>w.length),all=cs.reduce((n,[,w])=>n+w.length,0);
  app.innerHTML=`<div class="row"><button data-go="home">‹ 首页</button></div><h1>错题本</h1><p class="sub">按章节分；一道题再答对就从这里消失。</p>
  ${all?`<div class="row"><button class="pri" data-go="waall">全部再练 ${all}</button></div>`:`<p>没有错题。</p>`}
  ${cs.map(([c,w])=>{const t=(D.pri[c]||[3])[0];return `<details class="card"><summary style="color:var(--ink);font-size:16px"><b>${nm(c)}</b>${t<3?` <span class="tag" style="${t===1?"color:#c62828;border-color:#f2c1bd":"color:#8a5a00"}">${t===1?"重点":"次重点"}</span>`:""} 错 ${w.length} 题</summary>
    <div class="row" style="margin:8px 0"><button class="pri" data-go="wc:${c}">练这 ${w.length} 题</button>${D.sheet[c]?`<button data-go="c:${c}">看要点</button>`:""}</div>
    ${w.map(q=>`<div class="wl"><span class="tag">${q.t}</span>${q.k&&!q.hw?`<span class="tag">${q.k}</span>`:""}<div>${mark(q)}</div><div class="a"><span class="pass">答案 ${q.a} ${esc(opt(q,q.a))}</span></div><details><summary>讲解</summary>${guide(q,null)}</details></div>`).join("")}</details>`}).join("")}`;
  scrollTo(0,0);
}
function chapter(c){
  R=null;const h=S.ch[c]||[],w=wrongs(c).length,n=D.qs.filter(q=>q.c===c),hw=n.filter(q=>q.hw).length;
  app.innerHTML=`<div class="row"><button data-go="home">‹ 首页</button></div><h1>${nm(c)}</h1>
  <p class="sub">${["","重点","次重点","少考"][D.pri[c][0]]} · 作业 ${D.pri[c][1]} 题 · 老师点了 ${D.pri[c][2]} 处 · ${n.length} 题（老师作业 ${hw}）· 本章轮次：${h.length?h.map(pct).join(" → "):"还没练"}</p>
  <div class="row"><button class="pri" data-go="go:${c}">开始 ${NCH} 题</button>${w?`<button data-go="wc:${c}">只练错过的 ${w}</button>`:""}</div>
  ${brief(c)}
  <div class="row" style="margin-top:12px"><button class="pri" data-go="go:${c}">开始 ${NCH} 题</button></div>`;
}
function brief(c){const b=D.brief[c];if(!b)return D.sheet[c]?`<div class="card sheet">${D.sheet[c]}</div>`:"";
  const red=(p,ws)=>{let t=esc(p);for(const w of ws.flat().sort((a,b)=>b.length-a.length))if(w.length>1)t=t.split(esc(w)).join(`<mark class="k">${esc(w)}</mark>`);return t};
  return `<div class="card sheet">${b.head}</div>
  ${b.img?`<div class="card"><h2>合图 <small class="hist">蓝 = 方 · 红 = 秒杀词 · 点图看原尺寸</small></h2><div class="img"><img src="${b.img}" alt="${nm(c)} 合图" data-zoom></div></div>`:""}
  ${b.card.length?`<div class="card"><h2>病卡</h2><dl>${b.card.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`:""}
  ${b.vs.length?`<div class="card"><h2>鉴别 <small class="hist">本病 ${b.vs.filter(g=>!g.x).length} 组 · 跨病 ${b.vs.filter(g=>g.x).length} 组</small></h2>${b.vs.map(g=>`<div class="vs"><b>${g.x?"跨病 · ":""}${esc(g.t)}</b>${g.p?`<div class="p">${red(g.p,g.k.map(x=>x[1]))}</div>`:""}${g.k.map(([n,ws])=>ws.length?`<div class="kz"><b>${esc(n)}</b>：${ws.map(w=>`<mark class="k">${esc(w)}</mark>`).join("")}</div>`:"").join("")}</div>`).join("")}</div>`:""}
  ${b.table?`<details class="card"><summary>证型 · 治法 · 方 · 舌脉 表</summary><div class="sheet">${b.table}</div></details>`:""}`}
function quizB(g){
  const tot=R.list.length,q0=R.list[g[0]],done=g.every(i=>R.ans[i]),title=R.kind==="ch"?nm(R.c):R.kind==="mock"?"模拟":R.kind==="hw"?"老师作业":"错题再练";
  app.innerHTML=`<div class="row" style="justify-content:space-between"><button data-go="${R.c?"c:"+R.c:"home"}">‹ 退出</button><span class="hist">${title} · ${g[0]+1}–${g.at(-1)+1} / ${tot}</span></div>
  <div class="bar"><i style="width:${g[0]/tot*100}%"></i></div>
  <div class="card"><span class="tag${q0.hw?" hw":""}">${q0.hw?"作业 ":""}B型 · 共用选项 · ${g.length} 题</span>${done&&R.kind!=="ch"?`<span class="tag">${esc(q0.cn||nm(q0.c))}</span>`:""}
  <div class="bo">${q0.o.map(([l,t])=>`<div><b>${l}</b>${esc(t)}</div>`).join("")}</div>
  ${g.map((i,k)=>{const q=R.list[i],a=R.ans[i];return `<div class="bq"><div class="q">${k+1}. ${a?mark(q):esc(q.q)}</div>
    <div class="bl">${q.o.map(([l])=>`<button class="${a?(l===q.a?"right":l===a?"wrong":""):""}" data-pick="${i}:${l}"${a?" disabled":""}>${l}</button>`).join("")}</div>
    ${a?`<div class="res ${a===q.a?"r":"w"}">${a===q.a?"✓ 对":`✗ 选了 ${a}，答案 <b>${q.a}</b> ${esc(opt(q,q.a))}`}</div><details${a!==q.a?" open":""}><summary>讲解</summary>${guide(q,a)}</details>`:""}</div>`}).join("")}
  ${done?`${D.brief[q0.c]?`<details style="margin-top:8px"><summary>${nm(q0.c)} 要点</summary>${brief(q0.c)}</details>`:""}<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="pri" data-go="next">${g.at(-1)+1<tot?"下一题":"看复盘"} <kbd>Enter</kbd></button></div>`
  :`<p class="hist" style="margin:10px 0 0">每个答案可以选一次、多次或不选。按 <kbd>A</kbd>–<kbd>E</kbd> 答下一道没答的</p>`}</div>`;
}
function quiz(){
  if(R.list[R.i].bg)return quizB(grpAt(R.i));
  const q=R.list[R.i],a=R.ans[R.i],tot=R.list.length;
  const title=R.kind==="ch"?nm(R.c):R.kind==="mock"?"模拟":R.kind==="hw"?"老师作业":"错题再练";
  app.innerHTML=`<div class="row" style="justify-content:space-between"><button data-go="${R.c?"c:"+R.c:"home"}">‹ 退出</button><span class="hist">${title} · ${R.i+1} / ${tot}</span></div>
  <div class="bar"><i style="width:${R.i/tot*100}%"></i></div>
  <div class="card"><span class="tag${q.hw?" hw":""}">${q.hw?"作业 ":""}${q.t}</span>${a&&R.kind!=="ch"?`<span class="tag">${esc(q.cn||nm(q.c))}</span>`:""}${a&&q.k&&!q.hw?`<span class="tag">${q.k}</span>`:""}
  <div class="q">${a?mark(q):esc(q.q)}</div><div class="opts">${q.o.map(([l,t])=>`<button class="opt${a?(l===q.a?" right":l===a?" wrong":""):""}" data-pick="${l}"${a?" disabled":""}><b>${l}</b><span>${esc(t)}</span></button>`).join("")}</div>
  ${a?`<div class="res ${a===q.a?"r":"w"}">${a===q.a?"✓ 对":`✗ 选了 ${a}，答案 <b>${q.a}</b> ${esc(opt(q,q.a))}`}</div>${guide(q,a)}
  ${D.brief[q.c]?`<details style="margin-top:8px"><summary>${nm(q.c)} 要点</summary>${brief(q.c)}</details>`:""}
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="pri" data-go="next">${R.i+1<tot?"下一题":"看复盘"} <kbd>Enter</kbd></button></div>`
  :`<p class="hist" style="margin:10px 0 0">按 <kbd>A</kbd>–<kbd>E</kbd> 或 <kbd>1</kbd>–<kbd>5</kbd> 作答</p>`}</div>`;
}
const zl=i=>{const z=D.Z[i];return z?`${esc(z.d)}·${esc(z.n)}`:""};
function mark(q){const t=q.q,hl=q.hl||[];let out="",i=0;
  while(i<t.length){const h=hl.find(([w])=>t.startsWith(w,i));if(h){out+=`<mark class="${h[1]}">${esc(h[0])}</mark>`;i+=h[0].length}else{out+=esc(t[i]);i++}}
  return out+(hl.length?`<div class="leg"><mark class="k">红</mark> 题眼（定证的词） · <mark class="s">黄</mark> 症状舌脉 · <mark class="t">虚线</mark> 陷阱（几个证都有）</div>`:"")}
function guide(q,a){const z=D.Z[q.z],inq=w=>q.q.includes(w),ask=k=>q.k===k?` class="ask"`:"";
  const kill=z?z.k.filter(([w])=>inq(w)):[],trap=z?z.t.filter(([w])=>inq(w)):[];
  const why=q.why?`<p class="why">${esc(q.why)}</p>`:"";
  const eye=kill.length||trap.length?`<h4>题眼</h4><ul>${kill.map(([w,y])=>`<li><mark class="k">${esc(w)}</mark> ${esc(y)}</li>`).join("")}${trap.map(([w,y])=>`<li><mark class="t">${esc(w)}</mark> 陷阱：${esc(y)}</li>`).join("")}</ul>`:"";
  const zz=z?`<h4>这题的证</h4><div class="zz"><b>${zl(q.z)}</b>　治法 <b${ask("治法")}>${esc(z.f)}</b>　方 <b${ask("方")}>${esc(z.p)}</b>${z.s?`　舌脉 ${esc(z.s)}`:""}${z.k.length?`<br>秒杀词：${z.k.map(([w])=>inq(w)?`<mark class="k">${esc(w)}</mark>`:esc(w)).join("、")}`:""}</div>`:"";
  const ol=`<h4>逐个选项</h4><ul class="ol">${q.o.map(([l,t])=>{const o=(q.oz||{})[l]||[],oz=D.Z[o[0]],note=(q.ol||{})[l];
    const miss=l===a&&a!==q.a&&oz&&oz.k.length?`；它的秒杀词 ${oz.k.map(([w])=>esc(w)).join("、")}，题干${oz.k.some(([w])=>inq(w))?"有部分":"都没有"}`:"";
    return `<li class="${l===q.a?"ra":l===a?"wa":""}"><b>${l}</b> ${esc(t)}${l===q.a?" ✓":l===a?" ✗ 你选的":""} <span>${note?"— "+esc(note):o.length?"— "+o.map(zl).join(" / ")+miss:""}</span></li>`}).join("")}</ul>`;
  return `<div class="gd">${why}${eye}${zz}${ol}${q.x?`<h4>题库解析</h4><div class="x">${esc(q.x)}</div>`:""}</div>`}
const opt=(q,l)=>(q.o.find(o=>o[0]===l)||["",""])[1];
function answer(l,i=R.i){
  if(!R||R.ans[i])return;const q=R.list[i];R.ans[i]=l;
  const s=S.st[q.id]=S.st[q.id]||[0,0,0];if(l===q.a){s[0]++;s[2]=0}else{s[1]++;s[2]=1}save();quiz();
}
function retro(){
  if(R.done)return;R.done=1;
  const L=R.list,A=R.ans,right=L.filter((q,i)=>A[i]===q.a).length,sc=right/L.length,need=Math.max(0,Math.ceil(PASS*L.length)-right);
  if(R.kind==="ch"){(S.ch[R.c]=S.ch[R.c]||[]).push(sc)}else if(R.kind==="mock"){S.mock.push(sc)}save();
  const W=L.map((q,i)=>[q,A[i]]).filter(([q,a])=>a!==q.a);
  const grp=(f)=>{const m={};L.forEach((q,i)=>{const k=f(q);m[k]=m[k]||[0,0];m[k][1]++;if(A[i]===q.a)m[k][0]++});
    return Object.entries(m).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([k,[r,t]])=>`<span class="${r<t?"lo":""}">${esc(k)} ${r}/${t}</span>`).join("")};
  const n=nextCh(),wc=[...new Set(W.map(([q])=>q.c))].filter(c=>D.sheet[c]);
  app.innerHTML=`<div class="row"><button data-go="${R.c?"c:"+R.c:"home"}">‹ 返回</button></div>
  <div class="card"><div class="big ${sc>=PASS?"pass":"fail"}">${right} / ${L.length} · ${pct(sc)}</div>
  <p style="margin:6px 0 0">${sc>=PASS?(R.kind==="ch"?`过关。`:`达到 80%。`):`还差 ${need} 题到 80%。先看下面错题和对应要点，再练一轮。`}</p>
  <div class="stat">${grp(q=>q.hw?"作业·"+q.t:q.k||q.t)}</div>${R.kind!=="ch"?`<div class="stat">${grp(q=>q.cn||nm(q.c))}</div>`:""}
  <div class="row" style="margin-top:10px">${W.length?`<button class="pri" data-go="rw">错题再练 ${W.length}</button>`:""}
  ${R.kind==="ch"?`<button data-go="go:${R.c}">再来一轮</button>${sc>=PASS&&n?`<button${W.length?"":` class="pri"`} data-go="c:${n}">下一章：${nm(n)}</button>`:""}`:`<button data-go="mock">再来 ${NMOCK} 题</button>`}
  <button data-go="home">首页</button></div></div>
  ${W.length?`<div class="card"><h2>错题</h2>${W.map(([q,a])=>`<div class="wl"><span class="tag">${esc(q.cn||nm(q.c))}</span><span class="tag">${q.t}</span><div>${mark(q)}</div>
  <div class="a"><span class="fail">你选 ${a} ${esc(opt(q,a))}</span> · <span class="pass">答案 ${q.a} ${esc(opt(q,q.a))}</span></div><details><summary>讲解</summary>${guide(q,a)}</details></div>`).join("")}</div>`:""}
  ${wc.map(c=>`<details class="card"><summary>${nm(c)} 要点（这轮在这里错了 ${W.filter(([q])=>q.c===c).length} 题）</summary>${brief(c)}</details>`).join("")}`;
  R.wrong=W.map(([q])=>q);scrollTo(0,0);
}
function go(t){
  if(t==="home")return home();if(t==="mock")return mock();if(t==="hw")return hwAll();
  if(t==="wa")return book();if(t==="waall")return start("wrong",null,wrongs());
  if(t==="reset"){if(confirm("清空全部进度？")){S={st:{},ch:{},mock:[]};save();home()}return}
  if(t==="next"){const n=grpAt(R.i).length;if(R.i+n<R.list.length){R.i+=n;quiz();scrollTo(0,0)}else retro();return}
  if(t==="rw")return start("wrong",R.c,R.wrong);
  const [k,c]=t.split(":");if(k==="c")return chapter(c),scrollTo(0,0);if(k==="go")return chRound(c);if(k==="wc")return start("wrong",c,wrongs(c));
}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();return go(g.dataset.go)}
  const z=e.target.closest("[data-zoom]");if(z)return z.classList.toggle("full");
  const p=e.target.closest("[data-pick]");if(p){const v=p.dataset.pick;if(v.includes(":")){const [i,l]=v.split(":");answer(l,+i)}else answer(v)}});
document.addEventListener("keydown",e=>{if(!R||R.done||e.metaKey||e.ctrlKey)return;const k=e.key.toUpperCase();
  const open=grpAt(R.i).find(i=>!R.ans[i]);
  if(open!=null){const l="ABCDE".includes(k)&&k.length===1?k:"12345".includes(k)&&k.length===1?"ABCDE"["12345".indexOf(k)]:null;if(l){e.preventDefault();answer(l,open)}}
  else if(e.key==="Enter"){e.preventDefault();go("next")}});
home();
</script>
