动则、遇劳加重"], ["潮红", "肝火上炎，气血随阳上冲于面 → 整个颜面潮红；肾精不足是阴虚，只两颧发红"], ["肢麻震颤", "肝主筋，肝阳化风、风阳内动扰筋 → 肢麻震颤；其余各证没有风动"]], "t": []}, "11-05-5": {"d": "腰痛", "n": "肾阳虚", "f": "补肾壮阳，温煦经脉", "p": "右归丸加减", "s": "舌淡、苔薄白、脉沉细无力", "k": [["局部发凉", "肾阳不足、腰脊失于温煦 → 局部发凉；肾阴虚是手足心热"], ["喜温喜按", "阳虚失温，得温则舒 → 喜温，虚证 → 喜按；瘀血是实证 → 拒按"], ["面色㿠白", "阳虚不能温运气血上荣 → 面色㿠白；肾阴虚虚火上炎 → 面色潮红"]], "t": [["隐隐作痛", "腰府失养 → 隐隐作痛，肾阴虚也有 → 阳虚认局部发凉、喜温喜按"], ["遇劳更甚", "劳则耗气伤肾 → 痛甚，肾阴虚也可遇劳痛甚 → 阳虚认局部发凉、喜温喜按"], ["腰部冷痛", "阳虚失温或寒湿外侵都可冷痛，寒湿是冷痛重着 → 肾阳虚认局部发凉、喜温喜按"], ["喜按", "虚证都喜按，肾阴虚也是 → 阳虚须认喜温喜按、局部发凉"], ["卧则", "劳则阳气更虚，卧则阳气得养 → 痛减；寒湿静卧反更凝滞 → 不减，截掉减轻二字分不出"]]}, "07-04-1": {"d": "噎膈", "n": "痰气交阻", "f": "开郁化痰，润燥降气", "p": "启膈散加减", "s": "舌红、苔薄腻、脉弦滑", "k": [["情志", "气郁为本证之始，情志抑郁则气结更甚 → 梗阻随之加重；瘀血有形、津亏阳衰属虚，不随情绪增减"], ["脉弦滑", "弦主气郁，滑主痰湿 → 弦滑即痰气交阻；瘀血脉细涩，津亏脉细数，阳微脉细弱"]], "t": [["痰涎", "痰阻气逆 → 吐痰涎；瘀血内结日久也夹痰、吐痰涎，只示有痰，须配脉弦滑、情志加重"]]}, "07-03-4": {"d": "呕吐", "n": "肝气犯胃", "f": "疏肝和胃，降逆止呕", "p": "半夏厚朴汤加减（教材：半夏厚朴汤合左金丸加减）", "s": "舌边红、苔薄腻、苔微黄、脉弦", "k": [["脘胁胀痛", "胁为肝经所布，肝郁气滞、横逆犯胃 → 脘与胁同时胀痛；他证病只在胃，不连胁"], ["情志", "肝主疏泄、调畅情志，情志不遂则肝郁更甚、横逆犯胃 → 遇情志而吐；他证与情绪无关"], ["呕吐吞酸", "酸为肝之味，肝气横逆犯胃、胃气上逆 → 呕吐吞酸；饮食停滞是吐物酸腐，酸中带腐臭"]], "t": [["吞酸", "酸为肝味，吞酸多由肝气犯胃；但嗳腐吞酸是食积，同二字分不开，须看前有无嗳腐"]]}, "07-05-1": {"d": "呃逆", "n": "胃中寒冷", "f": "温中散寒，降逆止呃", "p": "丁香散加减", "s": "舌淡、苔白、脉迟缓", "k": [["迟缓", "寒为阴邪，寒蓄中焦、阳气被遏，鼓动迟滞 → 脉迟缓；胃火滑数，阳虚沉细"], ["呃声沉", "寒性凝滞，寒邪阻胃、逆气受遏 → 呃声沉缓有力；胃火冲逆则洪亮，阳虚则低长无力"], ["得热则减", "寒邪凝滞胃中，得温则散、遇寒更凝 → 得热则减、遇寒则甚；胃火反喜冷；阳虚亦喜暖，但呃声低长无力"]], "t": []}, "05-01-6": {"d": "心悸", "n": "瘀阻心脉", "f": "活血化瘀，理气通络", "p": "桃仁红花煎加减", "s": "舌紫暗、舌有瘀斑、脉涩、脉结、脉代", "k": [["痛如针刺", "心血瘀阻，脉络不通，不通则痛 → 痛如针刺；刺痛主瘀，气滞多胀痛，痰浊多闷痛"], ["唇甲青紫", "心主血脉，心脉瘀阻、血行不畅 → 唇甲青紫；青紫主瘀，心阳不振阳虚血缓 → 面色苍白"], ["瘀斑", "瘀血内阻，舌络瘀滞 → 舌紫暗、有瘀斑；瘀阻脉道、血行不畅 → 脉涩，两者同指血瘀"]], "t": []}, "04-07-7": {"d": "肺胀", "n": "肺肾气虚", "f": "补肺纳肾，降气平喘", "p": "平喘固本汤合补肺汤加减", "s": "舌淡、舌紫暗、苔白润、脉沉细无力", "k": [["难续", "肺不主气、肾不纳气，气不归元 → 呼吸浅短难续；痰热郁肺是实喘 → 喘息气粗"], ["咳声低怯", "肺肾两虚，肺气不足、宗气虚 → 咳声低怯；痰热郁肺邪壅气道属实 → 咳逆气粗"]], "t": [["张口抬肩", "肺气壅滞或虚极、呼吸极度困难所致；凡肺胀加重各证皆见 → 只示病重，认难续、咳声低怯"]]}, "04-03-1": {"d": "哮病", "n": "寒哮", "f": "宣肺散寒，化痰平喘", "p": "射干麻黄汤或小青龙汤加减", "s": "苔白滑、脉弦紧、脉浮紧", "k": [["满闷如塞", "寒主收引凝滞，寒痰闭肺、气郁不宣 → 满闷如塞；热哮是热壅气张 → 胸高胁胀"], ["浮紧", "外寒引动伏痰、邪在表 → 浮，寒主收引 → 紧；热哮痰热内盛 → 脉滑数"]], "t": [["痰稀薄色白", "寒凝津聚或气虚不布津 → 痰稀色白；肺虚、虚哮也痰清稀 → 寒哮要配满闷如塞、形寒"]]}, "06-06-4": {"d": "痫证", "n": "脾虚痰盛", "f": "健脾化痰", "p": "六君子汤", "s": "舌淡、苔白腻、脉濡滑、脉弦细滑", "k": [["胸脘痞闷", "脾气亏虚，痰湿阻滞中焦气机 → 胸脘痞闷，脘字定位脾胃；阴痫平素是胸闷咳痰"], ["蜷卧拘急", "脾虚阳气失于温养则蜷卧，肝风内动则拘急；阳痫热极动风 → 项背强直"], ["脉濡滑", "濡主湿、滑主痰，脾虚痰湿内盛 → 脉濡滑；阴痫寒盛阳虚 → 脉沉迟、沉细"]], "t": []}, "07-08-1": {"d": "痢疾", "n": "湿热痢", "f": "清肠化湿，调气和血", "p": "芍药汤加减", "s": "舌红、苔黄腻、脉滑数、脉浮数", "k": [["赤多白少", "湿热偏伤血分、灼伤肠络 → 赤多白少；寒湿偏伤气分，白多赤少"], ["肛门灼热", "湿热下注大肠，热灼肛门 → 肛门灼热；寒湿、虚寒痢无热，不灼"]], "t": [["苔腻", "湿邪内蕴 → 苔腻，只说有湿；休息痢正虚邪恋也苔腻，须看肛门灼热、赤多白少"], ["黄腻", "湿热熏蒸 → 苔黄腻；休息痢湿郁化热时也见，须看肛门灼热、赤多白少"]]}, "05-02-7": {"d": "胸痹", "n": "心肾阳虚", "f": "温补阳气，振奋心阳", "p": "参附汤合右归饮加减", "s": "舌淡、舌胖、舌边有齿痕、苔白、苔腻、脉沉细迟", "k": [["心悸而痛", "阳气虚衰、心失温养 → 心悸为先，胸阳不振、气机痹阻 → 痛随之，属虚痛；定阳虚还看怯寒、脉沉细迟"], ["晄白", "阳虚不能温运气血上荣，兼阳虚水停 → 面色晄白而虚浮；寒凝是阴寒收引 → 面色苍白"], ["沉细迟", "阳气虚衰，鼓动无力 → 沉细；阳虚生寒，血行迟缓 → 迟；寒凝是实寒 → 沉紧"]], "t": []}, "08-03-4": {"d": "积聚", "n": "瘀血内结", "f": "祛瘀软坚，健脾益气", "p": "膈下逐瘀汤加减", "s": "舌紫暗、舌有瘀点、脉细涩", "k": [["赤缕", "瘀血阻于脉络、外显于皮肤 → 血痣赤缕；气滞血阻瘀结尚浅，不见"], ["月事不下", "瘀血阻于胞宫血脉、冲任不通 → 女子经闭；气滞血阻瘀结尚浅，不致经闭"], ["硬痛不移", "积块日久、瘀血内结 → 硬痛不移；气滞血阻软而不坚，正虚瘀阻坚硬且形脱"]], "t": [["黧黑", "瘀血内结、肌肤失荣 → 面色黧黑；正虚瘀阻也黧黑，瘀血内结须认血痣赤缕"]]}, "05-04-2": {"d": "不寐", "n": "痰热扰心", "f": "清化痰热，和中安神", "p": "黄连温胆汤加减", "s": "舌红、苔黄腻、脉滑数", "k": [["苔黄腻", "腻主痰湿，黄主热，痰浊郁而化热 → 苔黄腻；肝火苔黄不腻，湿盛困脾苔腻不黄"], ["脉滑数", "滑主痰，数主热，痰热内盛 → 脉滑数；肝火是弦数，心肾不交是细数"], ["头重", "痰浊上扰，蒙蔽清阳，湿性重浊 → 头重；肝火上炎是头晕头胀，胀而不重"]], "t": []}}, "pri": {"04-01": [1, 3, 6, "病因；辨证分类·证型·方；舌脉；方 2 个（风热）"], "04-02": [1, 5, 5, "证治分类 外感/内伤；治法 1–2；证型 2；方（有玉竹的方？风寒用什么方？风燥）；注意病人症状"], "04-03": [3, 5, 1, "缓解期 2 题"], "04-04": [1, 7, 3, "病因症状；证型·方 4 题"], "04-05": [3, 2, 1, "（「费用」= 肺痈）"], "04-06": [2, 5, 3, "方 1 · 治法 1 · 证 1"], "04-07": [3, 4, 2, "胸部满；病理性质"], "05-01": [2, 5, 3, "方；治法；舌脉 → 方"], "05-02": [2, 6, 2, "诊治分类；B 型 证型-推、方 2 题"], "05-03": [3, 2, 1, "B 型 2 证"], "05-04": [2, 4, 3, "方 2；肝火 / 痰热 / 心脾两虚；睡不好：证 → 治法 → 方"], "06-01": [3, 1, 2, "方（天麻：肝阳 / 痰）；证"], "06-02": [3, 3, 2, "证（不是 xx 的症状）；晕+无力：肾虚、气血虚"], "06-03": [2, 5, 2, "方；B 型 代表方"], "06-04": [3, 2, 3, "舌脉；方（xx 证的代表方）；B 型 证型"], "06-05": [1, 8, 2, "治法；方 1（重金属 = 重镇）"], "06-06": [3, 4, 2, "抽搐 → 证型；四肢抽搐 → 病"], "07-01": [1, 6, 3, "治法；主要症状；B 型 方药"], "07-02": [1, 8, 2, "脾胃 治法；2 方"], "07-03": [1, 8, 3, "治法；方；证型（脉细数）"], "07-04": [3, 3, 2, "（yuge = 噎膈）2 个证 · 方"]}, "brief": {"04-01": {"img": "img/04-01.png", "head": "<section id=\"04-01\"><h2>感冒 <small>肺系<\/small><\/h2><p class=\"h\">老师：病因；辨证分类·证型·方；舌脉；方 2 个（风热）<\/p><p class=\"m\"><b>病机<\/b> 邪犯肺卫，卫表不和　<b>治则<\/b> 因势利导，从表而解，解表达邪<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风寒束表<\/b><br><small>风寒感冒<\/small><\/td><td>辛温解表，宣肺散寒<\/td><td class=\"f\">荆防达表汤、荆防败毒散<\/td><td>苔薄白、脉浮、脉浮紧<\/td><td class=\"k\">脉浮紧、清涕<\/td><\/tr><tr><td><b>风热犯表<\/b><br><small>风热感冒<\/small><\/td><td>辛凉解表，疏风清热<\/td><td class=\"f\">银翘散<\/td><td>舌尖红、苔薄白而干、苔薄黄、脉浮数<\/td><td class=\"k\">身热较著、黄稠涕、舌尖红<\/td><\/tr><tr><td><b>暑湿伤表<\/b><br><small>暑湿感冒<\/small><\/td><td>清暑祛湿解表<\/td><td class=\"f\">新加香薷饮<\/td><td>苔白腻、苔黄腻、脉濡数<\/td><td class=\"k\">脉濡数<\/td><\/tr><tr><td><b>气虚感冒<\/b><\/td><td>益气解表，调和营卫<\/td><td class=\"f\">参苏饮<\/td><td>舌淡、苔薄白、脉浮无力<\/td><td class=\"k\">脉浮无力<\/td><\/tr><tr><td><b>阴虚感冒<\/b><\/td><td>滋阴解表<\/td><td class=\"f\">加减葳蕤汤<\/td><td>舌红、苔少、脉细数<\/td><td class=\"k\">舌红少苔、干咳少痰<\/td><\/tr><tr><td><b>阳虚感冒<\/b><\/td><td>助阳解表<\/td><td class=\"f\">麻黄附子细辛汤<\/td><td>舌淡、舌胖、苔白、脉沉细无力<\/td><td class=\"k\">脉沉细无力、四肢不温<\/td><\/tr><\/table>", "card": [["定病", "鼻塞流涕、喷嚏、恶寒发热、全身不适"], ["病位", "卫表、肺"], ["病机", "邪犯肺卫，卫表不和"], ["治则", "因势利导，从表而解，解表达邪"], ["首辨", "辨偏实与偏虚；辨风寒与风热；辨兼夹证"], ["病因", "以风邪为先导；时行疫毒"], ["病理性质", "表实证"], ["演变", "病程中可见寒与热的转化或错杂"], ["特点", "时行感冒少数可传变入里"], ["治疗要点", "治疗感冒应因势利导，从表而解；虚体感冒：解表与扶正并施；除虚体感冒，一般均忌用补敛之品"]], "vs": [{"t": "风寒束表、气虚感冒、阳虚感冒", "p": "都恶寒重：脉浮紧、流清涕是风寒；脉浮无力、气短自汗是气虚；脉沉细无力、四肢不温、语声低微是阳虚。", "x": false, "k": [["风寒束表", ["脉浮紧", "清涕"]], ["气虚感冒", ["脉浮无力", "气短", "自汗"]], ["阳虚感冒", ["脉沉细无力", "四肢不温", "语声低微"]]]}, {"t": "风热犯表、暑湿伤表、阴虚感冒", "p": "都发热、微恶风：身热较著、流黄稠涕、舌尖红是风热；肢体困重、苔腻、脉濡数是暑湿；干咳少痰、舌红少苔、脉细数是阴虚。", "x": false, "k": [["风热犯表", ["身热较著", "黄稠涕", "舌尖红"]], ["暑湿伤表", ["脉濡数", "肢体困重", "小便短赤"]], ["阴虚感冒", ["舌红少苔", "干咳少痰", "脉细数"]]]}, {"t": "感冒、风温", "p": "风热感冒和风温初起很像：热不高、汗出热退、不传变是感冒；寒战高热、汗后热又起、脉数不静、能传变入里是风温。", "x": false, "k": []}, {"t": "感冒风热犯表、咳嗽风热犯肺、肺痈初期", "p": "都风热、脉浮数：胸痛、咳时尤甚、痰量由少渐多是肺痈初期；咳嗽频剧、喉燥咽痛为主是咳嗽（桑菊饮）；身热较著、汗出不畅为主是感冒（银翘散，与肺痈初期同方）。", "x": true, "k": [["感冒·风热犯表", ["身热较著", "汗出不畅"]], ["咳嗽·风热犯肺", ["咳嗽频剧", "咳嗽较剧", "喉燥咽痛"]], ["肺痈·初期", ["胸痛", "咳时尤甚", "痰量由少渐多", "痰量逐渐增多"]]]}, {"t": "感冒风寒束表、感冒暑湿伤表、呕吐外邪犯胃", "p": "都恶寒发热、头身痛：以呕吐、胸脘满闷为主是呕吐外邪犯胃（藿香正气散）；不吐，恶寒重、流清涕是风寒感冒；汗出不畅、心烦口渴、脉濡数是暑湿感冒（新加香薷饮）。", "x": true, "k": [["感冒·风寒束表", ["恶寒重", "清涕", "脉浮紧"]], ["感冒·暑湿伤表", ["汗出不畅", "心烦口渴", "脉濡数"]], ["呕吐·外邪犯胃", ["频频泛恶", "胸脘满闷"]]]}]}, "04-02": {"img": "img/04-02.png", "head": "<section id=\"04-02\"><h2>咳嗽 <small>肺系<\/small><\/h2><p class=\"h\">老师：证治分类 外感/内伤；治法 1–2；证型 2；方（有玉竹的方？风寒用什么方？风燥）；注意病人症状<\/p><p class=\"m\"><b>病机<\/b> 邪犯于肺，肺失宣肃，肺气上逆　<b>治则<\/b> 分清邪正虚实，祛邪利肺，祛邪止咳，扶正补虚<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风寒袭肺<\/b><\/td><td>疏风散寒，宣肺止咳<\/td><td class=\"f\">三拗汤、止嗽散<\/td><td>苔薄白、脉浮、脉浮紧<\/td><td class=\"k\">清涕、白稀痰<\/td><\/tr><tr><td><b>风热犯肺<\/b><\/td><td>疏风清热，宣肺止咳<\/td><td class=\"f\">桑菊饮<\/td><td>舌红、苔薄黄、脉浮数、脉浮滑<\/td><td class=\"k\">喉燥咽痛、黄涕<\/td><\/tr><tr><td><b>风燥伤肺<\/b><br><small>温燥<\/small><\/td><td>疏风清肺，润燥止咳<\/td><td class=\"f\">桑杏汤<\/td><td>舌尖红、苔薄白而干、苔薄黄而干、脉浮数、脉细数<\/td><td class=\"k\">咽喉干痛<\/td><\/tr><tr><td><b>凉燥<\/b><\/td><td>温而不燥，润而不凉<\/td><td class=\"f\">杏苏散<\/td><td>苔薄白而干<\/td><td class=\"k\"><\/td><\/tr><tr><td><b>痰湿蕴肺<\/b><\/td><td>燥湿化痰，理气止咳<\/td><td class=\"f\">二陈平胃散、三子养亲汤<\/td><td>苔白腻、脉濡滑<\/td><td class=\"k\">咳声重浊<\/td><\/tr><tr><td><b>痰热郁肺<\/b><br><small>痰热蕴肺<\/small><\/td><td>清热化痰，肃肺止咳<\/td><td class=\"f\">清金化痰汤<\/td><td>舌红、苔薄黄腻、脉滑数<\/td><td class=\"k\">痰声、热腥味、苔薄黄腻<\/td><\/tr><tr><td><b>肝火犯肺<\/b><\/td><td>清肺泻肝，化痰止咳<\/td><td class=\"f\">黛蛤散、加减泻白散<\/td><td>舌红、苔薄黄少津、脉弦数<\/td><td class=\"k\">情绪波动、上气咳逆、痰滞咽喉<\/td><\/tr><tr><td><b>肺阴亏虚<\/b><br><small>肺阴亏耗<\/small><\/td><td>养阴清热，润肺止咳<\/td><td class=\"f\">沙参麦冬汤<\/td><td>舌红、苔少、脉细数<\/td><td class=\"k\">午后潮热、咳声短促<\/td><\/tr><\/table>", "card": [["定病", "咳而有声、咳痰"], ["病位", "肺、肝、脾、肾"], ["病机", "邪犯于肺，肺失宣肃，肺气上逆"], ["治则", "分清邪正虚实，祛邪利肺，祛邪止咳，扶正补虚"], ["首辨", "辨外感与内伤；辨咳嗽特征；辨痰的特征"], ["治标", "止咳"], ["病理性质", "病理性质属邪实与正虚并见；外感咳嗽属于邪实"], ["演变", "外感、内伤咳嗽可互为因果，相互为病；他脏有病而及肺者，多因实致虚；肺脏自病者，多因虚致实"], ["转归", "咳嗽日久可发展为肺胀"], ["病因", "外感六淫；饮食不节；情志内伤；肺脏自病"], ["病理因素", "内伤咳嗽，病理因素主要为痰与火"], ["特点", "咳嗽分为三类：急性咳嗽短于3周，亚急性咳嗽3～8周，慢性咳嗽超过8周"], ["治疗要点", "咳嗽治疗须分清邪正虚实；外感咳嗽：多为实证，应祛邪利肺；内伤咳嗽：多属邪实正虚；除治肺外，还应从整体出发，注意治脾、治肝、治肾等；外感咳嗽忌用敛肺、收涩的镇咳药；内伤咳嗽忌用宣肺散邪法"]], "vs": [{"t": "风寒袭肺、风热犯肺、风燥伤肺", "p": "先看痰和涕：咳白稀痰、流清涕、咳嗽声重是风寒；痰黄稠、鼻流黄涕、喉燥咽痛是风热；干咳少痰、咽喉干痛、痰带血丝是风燥。", "x": false, "k": [["风寒袭肺", ["清涕", "白稀", "咳嗽声重"]], ["风热犯肺", ["咳嗽频剧", "黄涕", "喉燥咽痛"]], ["风燥伤肺", ["咽喉干痛", "干咳", "血丝"]]]}, {"t": "痰湿蕴肺、痰热郁肺、肝火犯肺", "p": "看痰：痰多白黏、咳声重浊是痰湿；痰多黄稠、喉中有痰声、苔黄腻是痰热；痰少难咯、咳时面赤、随情绪增减是肝火。", "x": false, "k": [["痰湿蕴肺", ["咳声重浊", "苔白腻", "脉濡滑"]], ["痰热郁肺", ["痰声", "热腥味", "黄腻", "脉滑数"]], ["肝火犯肺", ["情绪波动", "上气咳逆", "痰滞咽喉", "脉弦数"]]]}, {"t": "风燥伤肺、肺阴亏虚", "p": "都干咳、痰少黏、可带血丝：新病、舌尖红、咽喉干痛、身热头痛是风燥；久咳、午后潮热、颧红盗汗、舌红少苔是肺阴亏虚。", "x": false, "k": [["风燥伤肺", ["咽喉干痛", "舌尖红", "脉浮数"]], ["肺阴亏虚", ["午后潮热", "咳声短促", "颧红", "盗汗"]]]}, {"t": "咳嗽、肺痨", "p": "肺痨有痨虫接触史、会传染，咯血、消瘦明显；咳嗽以咳声、咳痰为主，多不伴咯血、消瘦。两者都可潮热盗汗，阴虚干咳带胸部隐痛选肺痨。", "x": false, "k": []}, {"t": "痰热郁肺（咳嗽、喘证、肺胀）", "p": "同是痰热壅肺：咳嗽用清金化痰汤肃肺止咳，喘证用桑白皮汤宣肺平喘，肺胀用越婢加半夏汤泄热降逆平喘。", "x": true, "k": [["咳嗽·痰热郁肺", ["痰声", "热腥味"]], ["喘证·痰热郁肺", ["气涌", "胸部胀痛"]], ["肺胀·痰热郁肺", ["目胀睛突", "胸满烦躁"]]]}, {"t": "肝火犯肺（咳嗽、血证）", "p": "同是肝火犯肺：咳嗽用黛蛤散合加减泻白散清肺泻肝止咳；血证用泻白散合黛蛤散，要凉血止血，治的是咳血。", "x": true, "k": [["咳嗽·肝火犯肺", ["咳时面赤", "痰如絮条"]], ["血证·肝火犯肺", ["痰中带血", "纯血鲜红"]]]}, {"t": "痰热郁肺（咳嗽、喘证、肺胀）", "p": "同名不同方：咳嗽喉中痰声、痰有热腥味→清金化痰汤；喘证喘咳气涌、喜冷饮→桑白皮汤；肺胀胸满烦躁、目胀睛突→越婢加半夏汤或桑白皮汤。", "x": true, "k": [["咳嗽·痰热郁肺", ["痰声", "热腥味", "咳时引痛"]], ["喘证·痰热郁肺", ["气涌", "喜冷饮", "小便赤涩"]], ["肺胀·痰热郁肺", ["目胀睛突", "胸满烦躁", "喘息气粗"]]]}, {"t": "咳嗽痰湿蕴肺、喘证痰浊阻肺、肺胀痰浊壅肺", "p": "都痰多白黏、用三子养亲汤：咳嗽咳声重浊（合二陈平胃散）；喘证喘而胸满闷塞（合二陈汤）；肺胀兼肺虚，怕风汗多（合苏子降气汤）。", "x": true, "k": [["咳嗽·痰湿蕴肺", ["咳声重浊", "稠厚成块"]], ["喘证·痰浊阻肺", ["胸满闷塞", "胸盈仰息", "口黏不渴"]], ["肺胀·痰浊壅肺", ["怕风汗多", "稍劳即著", "短气喘息"]]]}, {"t": "感冒风热犯表、咳嗽风热犯肺、肺痈初期", "p": "都风热、脉浮数：胸痛、咳时尤甚、痰量由少渐多是肺痈初期；咳嗽频剧、喉燥咽痛为主是咳嗽（桑菊饮）；身热较著、汗出不畅为主是感冒（银翘散，与肺痈初期同方）。", "x": true, "k": [["感冒·风热犯表", ["身热较著", "汗出不畅"]], ["咳嗽·风热犯肺", ["咳嗽频剧", "咳嗽较剧", "喉燥咽痛"]], ["肺痈·初期", ["胸痛", "咳时尤甚", "痰量由少渐多", "痰量逐渐增多"]]]}, {"t": "咳嗽肺阴亏虚、肺痨肺阴亏损、肺痿虚热", "p": "都阴虚干咳：痰血色鲜红、手足心热、皮肤干灼是肺痨（月华丸）；咳吐浊唾、皮毛干枯是肺痿（麦门冬汤合清燥救肺汤）；都没有、痰少质黏色白是咳嗽（沙参麦冬汤）。", "x": true, "k": [["咳嗽·肺阴亏虚", ["痰少质黏色白"]], ["肺痨·肺阴亏损", ["色鲜红", "手足心热", "皮肤干灼"]], ["肺痿·虚热", ["浊唾", "咳声不扬", "皮毛干枯", "脉虚数"]]]}]}, "04-03": {"img": "img/04-03.png", "head": "<section id=\"04-03\"><h2>哮病 <small>肺系<\/small><\/h2><p class=\"h\">老师：缓解期 2 题<\/p><p class=\"m\"><b>病机<\/b> 伏痰遇感引触，痰随气升，气因痰阻，相互搏结，壅塞气道　<b>治则<\/b> 发时治标，平时治本<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>寒哮<\/b><br><small>冷哮<\/small><\/td><td>宣肺散寒，化痰平喘<\/td><td class=\"f\">射干麻黄汤、小青龙汤<\/td><td>苔白滑、脉弦紧、脉浮紧<\/td><td class=\"k\">满闷如塞、浮紧<\/td><\/tr><tr><td><b>热哮<\/b><\/td><td>清热宣肺，化痰定喘<\/td><td class=\"f\">定喘汤<\/td><td>舌红、苔黄腻、脉滑数、脉弦滑<\/td><td class=\"k\">气粗息涌、胸高胁胀<\/td><\/tr><tr><td><b>寒包热哮<\/b><\/td><td>解表散寒，清化痰热<\/td><td class=\"f\">小青龙加石膏汤、厚朴麻黄汤<\/td><td>苔白腻罩黄、舌尖红、舌边红、脉弦紧<\/td><td class=\"k\">罩黄、黄白相兼<\/td><\/tr><tr><td><b>风痰哮<\/b><\/td><td>祛风涤痰，降气平喘<\/td><td class=\"f\">三子养亲汤<\/td><td>苔厚浊、脉滑实<\/td><td class=\"k\">拽锯、吹哨笛、曳锯<\/td><\/tr><tr><td><b>虚哮<\/b><\/td><td>补肺纳肾，降气化痰<\/td><td class=\"f\">平喘固本汤<\/td><td>舌紫暗、舌淡、舌红、脉沉细、脉细数<\/td><td class=\"k\">如鼾、持续喘哮<\/td><\/tr><tr><td><b>喘脱危证<\/b><br><small>哮喘脱证<\/small><\/td><td>补肺纳肾，扶正固脱<\/td><td class=\"f\">回阳救急汤、生脉散<\/td><td>舌青暗、苔腻、苔滑、脉浮大无根、脉细数不清<\/td><td class=\"k\">汗出如油、脉浮大无根、喘急面青<\/td><\/tr><tr><td><b>肺虚<\/b><\/td><td>补肺益气<\/td><td class=\"f\">玉屏风散<\/td><td>舌淡、苔白、脉细弱、脉虚大<\/td><td class=\"k\">脉虚大<\/td><\/tr><tr><td><b>脾虚<\/b><\/td><td>健脾益气<\/td><td class=\"f\">六君子汤<\/td><td>舌淡、苔白滑、苔腻、脉细弱<\/td><td class=\"k\">便溏、面色萎黄<\/td><\/tr><tr><td><b>肾虚<\/b><\/td><td>补肾纳气<\/td><td class=\"f\">金匮肾气丸、七味都气丸<\/td><td>舌淡、苔白、舌胖、舌红、苔少、脉沉细、脉细数<\/td><td class=\"k\">呼多吸少、腰酸腿软、脑转耳鸣<\/td><\/tr><\/table>", "card": [["定病", "喉中哮鸣有声、反复发作、平时如常人"], ["病位", "肺、脾、肾、肝"], ["病机", "伏痰遇感引触，痰随气升，气因痰阻，相互搏结，壅塞气道"], ["治则", "发时治标，平时治本"], ["首辨", "辨发作期与缓解期；辨寒热"], ["治标", "平喘、定喘"], ["夙根", "痰伏于肺"], ["诱因", "气候变化为哮病发作的主要诱因"], ["病理因素", "以痰为主"], ["病理性质", "发作时痰阻气闭，表现为痰鸣气喘，以邪实为主；缓解期常以正虚为主"], ["病因", "外邪侵袭；饮食不当；情志刺激；体虚病后；素质不强者多以肾虚为主，而病后所致者多以肺脾虚为主"], ["演变", "若长期反复发作，可从实转虚"], ["转归", "甚至发生由哮致脱危候"], ["治疗要点", "发作期：以攻邪治标，祛痰利气为主；若发生喘脱危候，当急予扶正救脱；缓解期应扶正治本"], ["特点", "哮必兼喘，但喘未必兼哮"]], "vs": [{"t": "寒哮、热哮、寒包热哮、风痰哮", "p": "先看寒热：痰白稀、满闷如塞是寒哮；痰黄稠、气粗息涌是热哮；恶寒无汗又烦躁、苔白腻罩黄是寒包热；痰涎壅盛、声如拽锯、无明显寒热是风痰哮。", "x": false, "k": [["寒哮", ["满闷如塞", "浮紧", "面色晦青", "面色青晦"]], ["热哮", ["气粗息涌", "胸高胁胀", "口苦", "黄腻"]], ["寒包热哮", ["罩黄", "黄白相兼", "烦躁", "口干欲饮"]], ["风痰哮", ["拽锯", "痰涎壅盛", "吹哨笛", "苔厚浊"]]]}, {"t": "肺虚、脾虚、肾虚", "p": "缓解期看伴随症：面色㿠白、自汗畏风、脉虚大在肺；食少便溏、面色萎黄在脾；动则为甚、呼多吸少、腰酸腿软在肾。", "x": false, "k": [["肺虚", ["脉虚大", "面色㿠白", "畏风"]], ["脾虚", ["便溏", "面色萎黄", "食少"]], ["肾虚", ["呼多吸少", "腰酸腿软", "腰膝酸冷", "脑转耳鸣"]]]}, {"t": "哮病、喘证", "p": "哮必兼喘，喘未必兼哮：发作时喉中哮鸣有声、反复发作是哮病；只有呼吸气促困难、见于多种病是喘证。", "x": false, "k": []}, {"t": "喘脱危证（哮病、心衰）", "p": "哮病用回阳救急汤合生脉散，补肺纳肾固脱；心衰用四逆加人参汤，益气回阳固脱。", "x": true, "k": [["哮病·喘脱危证", ["张口抬肩", "脉浮大无根"]], ["心衰·喘脱危证", ["喘悸不休", "额汗如油"]]]}, {"t": "哮病寒哮、喘证风寒壅肺、肺胀外寒内饮", "p": "都痰白稀、脉浮紧：喉中哮鸣、满闷如塞是寒哮（射干麻黄汤或小青龙汤）；新感喘息咳逆、苔薄白而滑是喘证（麻黄汤合华盖散）；久病胸部膨满、周身酸楚是肺胀（小青龙汤）。", "x": true, "k": [["哮病·寒哮", ["哮鸣", "满闷如塞", "面色青晦"]], ["喘证·风寒壅肺", ["喘息咳逆", "苔薄白而滑"]], ["肺胀·外寒内饮", ["胸部膨满", "周身酸楚"]]]}, {"t": "哮病热哮、哮病寒包热哮、喘证表寒肺热、喘证痰热郁肺", "p": "有哮鸣是哮病：气粗息涌为热哮（定喘汤），兼恶寒身痛、苔白腻罩黄为寒包热哮；无哮鸣是喘证：形寒身热为表寒肺热（麻杏石甘汤），喘咳气涌、喜冷饮为痰热郁肺。", "x": true, "k": [["哮病·热哮", ["气粗息涌", "胸高胁胀"]], ["哮病·寒包热哮", ["罩黄", "黄白相兼", "脉弦紧"]], ["喘证·表寒肺热", ["喘逆上气", "形寒身热", "咳而不爽"]], ["喘证·痰热郁肺", ["气涌", "喜冷饮", "小便赤涩"]]]}, {"t": "哮病喘脱危证、喘证正虚喘脱、心衰喘脱危证", "p": "都喘促肢冷欲脱，按病记方：哮病反复久发、神志昏蒙→回阳急救汤合生脉饮；喘证稍动则咳喘欲绝→参附汤送服黑锡丹；心衰喘悸不休、尿少肢肿→四逆加人参汤。", "x": true, "k": [["哮病·喘脱危证", ["哮病反复久发", "神志昏蒙", "舌质青暗"]], ["喘证·正虚喘脱", ["咳喘欲绝", "喘逆剧甚", "汗出如珠"]], ["心衰·喘脱危证", ["喘悸不休", "尿少肢肿", "大汗淋漓"]]]}]}, "04-04": {"img": "img/04-04.png", "head": "<section id=\"04-04\"><h2>喘证 <small>肺系<\/small><\/h2><p class=\"h\">老师：病因症状；证型·方 4 题<\/p><p class=\"m\"><b>病机<\/b> 肺气上逆，宣降失职，气无所主，肾失摄纳　<b>治则<\/b> 分清邪正虚实，祛邪利气，培补摄纳<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风寒壅肺<\/b><br><small>风寒袭肺<\/small><\/td><td>宣肺散寒<\/td><td class=\"f\">麻黄汤、华盖散<\/td><td>苔薄白滑、脉浮紧<\/td><td class=\"k\">苔薄白而滑、脉浮紧<\/td><\/tr><tr><td><b>表寒肺热<\/b><br><small>表寒里热<\/small><\/td><td>解表清里，化痰平喘<\/td><td class=\"f\">麻杏石甘汤<\/td><td>舌红、苔薄白、苔薄黄、脉浮数、脉浮滑<\/td><td class=\"k\">喘逆上气、形寒身热<\/td><\/tr><tr><td><b>痰热郁肺<\/b><\/td><td>清热化痰，宣肺平喘<\/td><td class=\"f\">桑白皮汤<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">气涌、喜冷饮<\/td><\/tr><tr><td><b>痰浊阻肺<\/b><\/td><td>祛痰降逆，宣肺平喘<\/td><td class=\"f\">二陈汤、三子养亲汤<\/td><td>舌淡、苔白腻、脉滑、脉濡<\/td><td class=\"k\">胸满闷塞、口黏不渴、胸盈仰息<\/td><\/tr><tr><td><b>肺气郁痹<\/b><br><small>肝气郁痹、肺气郁闭<\/small><\/td><td>开郁降气平喘<\/td><td class=\"f\">五磨饮子<\/td><td>舌红、苔薄白、苔黄、脉弦<\/td><td class=\"k\">咽中如窒、痰鸣不著<\/td><\/tr><tr><td><b>肺气虚耗<\/b><\/td><td>补肺益气<\/td><td class=\"f\">生脉散、补肺汤<\/td><td>舌淡红、舌红、苔少、脉濡弱、脉细数<\/td><td class=\"k\">喘促短气、咳声低弱、喉有鼾声<\/td><\/tr><tr><td><b>肾虚不纳<\/b><\/td><td>补肾纳气<\/td><td class=\"f\">金匮肾气丸、人参蛤蚧散<\/td><td>舌淡、苔白、苔黑润、舌红、舌少津、脉沉弱、脉细数、脉微细<\/td><td class=\"k\">呼多吸少、气不得续、形瘦神惫<\/td><\/tr><tr><td><b>正虚喘脱<\/b><\/td><td>扶阳固脱，镇摄肾气<\/td><td class=\"f\">参附汤、黑锡丹<\/td><td>脉浮大无根、脉微欲绝<\/td><td class=\"k\">浮大无根、汗出如珠、咳喘欲绝<\/td><\/tr><\/table>", "card": [["定病", "呼吸困难、短促急迫、张口抬肩、鼻翼煽动"], ["病位", "肺、肾、肝、脾、心"], ["病机", "肺气上逆，宣降失职，气无所主，肾失摄纳"], ["治则", "分清邪正虚实，祛邪利气，培补摄纳"], ["首辨", "首辨虚实；实喘辨外感内伤；虚喘辨病位"], ["治标", "平喘"], ["病因", "外邪侵袭；饮食不当；情志所伤；劳欲久病"], ["病理性质", "有虚实之分；实喘在肺；虚喘责之肺、肾"], ["演变", "实喘病久伤正，由肺及肾，或虚喘复感外邪，或夹痰浊，则病情虚实错杂，每多表现为邪气壅阻于上，肾气亏虚于下的上盛下虚证候"], ["转归", "发为喘脱"], ["治疗要点", "喘证的治疗应分清邪正虚实；实喘：治肺，祛邪利气为主；虚喘以培补摄纳为主；不能见喘治喘；虚喘尤重治肾"]], "vs": [{"t": "风寒壅肺、表寒肺热、痰热郁肺", "p": "看表寒和里热：只有恶寒无汗、口不渴、脉浮紧是风寒壅肺；形寒身痛又身热口渴、脉浮数是表寒肺热；无表寒、喘咳气涌、喜冷饮是痰热郁肺。", "x": false, "k": [["风寒壅肺", ["脉浮紧", "苔薄白而滑", "口不渴"]], ["表寒肺热", ["喘逆上气", "形寒", "身痛", "脉浮数"]], ["痰热郁肺", ["气涌", "喜冷饮", "脉滑数", "小便赤涩"]]]}, {"t": "痰浊阻肺、肺气郁痹", "p": "都喘而胸闷：痰多黏腻色白、喘咳痰鸣、苔白腻是痰浊阻肺；遇情志刺激发作、咽中如窒、喉中痰鸣不著、脉弦是肺气郁痹。", "x": false, "k": [["痰浊阻肺", ["胸满闷塞", "口黏不渴", "苔白腻", "胸盈仰息"]], ["肺气郁痹", ["咽中如窒", "痰鸣不著", "脉弦"]]]}, {"t": "肺气虚耗、肾虚不纳、正虚喘脱", "p": "虚喘分轻重：咳声低弱、喉有鼾声、自汗畏风在肺；动则喘甚、呼多吸少、气不得续在肾；喘逆剧甚不能平卧、汗出如珠、脉浮大无根是喘脱。", "x": false, "k": [["肺气虚耗", ["咳声低弱", "喉有鼾声", "自汗畏风"]], ["肾虚不纳", ["呼多吸少", "气不得续", "形瘦神惫"]], ["正虚喘脱", ["浮大无根", "汗出如珠", "不能平卧"]]]}, {"t": "痰热郁肺（咳嗽、喘证、肺胀）", "p": "同是痰热壅肺：咳嗽用清金化痰汤肃肺止咳，喘证用桑白皮汤宣肺平喘，肺胀用越婢加半夏汤泄热降逆平喘。", "x": true, "k": [["咳嗽·痰热郁肺", ["痰声", "热腥味"]], ["喘证·痰热郁肺", ["气涌", "胸部胀痛"]], ["肺胀·痰热郁肺", ["目胀睛突", "胸满烦躁"]]]}, {"t": "痰热郁肺（咳嗽、喘证、肺胀）", "p": "同名不同方：咳嗽喉中痰声、痰有热腥味→清金化痰汤；喘证喘咳气涌、喜冷饮→桑白皮汤；肺胀胸满烦躁、目胀睛突→越婢加半夏汤或桑白皮汤。", "x": true, "k": [["咳嗽·痰热郁肺", ["痰声", "热腥味", "咳时引痛"]], ["喘证·痰热郁肺", ["气涌", "喜冷饮", "小便赤涩"]], ["肺胀·痰热郁肺", ["目胀睛突", "胸满烦躁", "喘息气粗"]]]}, {"t": "咳嗽痰湿蕴肺、喘证痰浊阻肺、肺胀痰浊壅肺", "p": "都痰多白黏、用三子养亲汤：咳嗽咳声重浊（合二陈平胃散）；喘证喘而胸满闷塞（合二陈汤）；肺胀兼肺虚，怕风汗多（合苏子降气汤）。", "x": true, "k": [["咳嗽·痰湿蕴肺", ["咳声重浊", "稠厚成块"]], ["喘证·痰浊阻肺", ["胸满闷塞", "胸盈仰息", "口黏不渴"]], ["肺胀·痰浊壅肺", ["怕风汗多", "稍劳即著", "短气喘息"]]]}, {"t": "哮病寒哮、喘证风寒壅肺、肺胀外寒内饮", "p": "都痰白稀、脉浮紧：喉中哮鸣、满闷如塞是寒哮（射干麻黄汤或小青龙汤）；新感喘息咳逆、苔薄白而滑是喘证（麻黄汤合华盖散）；久病胸部膨满、周身酸楚是肺胀（小青龙汤）。", "x": true, "k": [["哮病·寒哮", ["哮鸣", "满闷如塞", "面色青晦"]], ["喘证·风寒壅肺", ["喘息咳逆", "苔薄白而滑"]], ["肺胀·外寒内饮", ["胸部膨满", "周身酸楚"]]]}, {"t": "哮病热哮、哮病寒包热哮、喘证表寒肺热、喘证痰热郁肺", "p": "有哮鸣是哮病：气粗息涌为热哮（定喘汤），兼恶寒身痛、苔白腻罩黄为寒包热哮；无哮鸣是喘证：形寒身热为表寒肺热（麻杏石甘汤），喘咳气涌、喜冷饮为痰热郁肺。", "x": true, "k": [["哮病·热哮", ["气粗息涌", "胸高胁胀"]], ["哮病·寒包热哮", ["罩黄", "黄白相兼", "脉弦紧"]], ["喘证·表寒肺热", ["喘逆上气", "形寒身热", "咳而不爽"]], ["喘证·痰热郁肺", ["气涌", "喜冷饮", "小便赤涩"]]]}, {"t": "哮病喘脱危证、喘证正虚喘脱、心衰喘脱危证", "p": "都喘促肢冷欲脱，按病记方：哮病反复久发、神志昏蒙→回阳急救汤合生脉饮；喘证稍动则咳喘欲绝→参附汤送服黑锡丹；心衰喘悸不休、尿少肢肿→四逆加人参汤。", "x": true, "k": [["哮病·喘脱危证", ["哮病反复久发", "神志昏蒙", "舌质青暗"]], ["喘证·正虚喘脱", ["咳喘欲绝", "喘逆剧甚", "汗出如珠"]], ["心衰·喘脱危证", ["喘悸不休", "尿少肢肿", "大汗淋漓"]]]}]}, "04-05": {"img": "img/04-05.png", "head": "<section id=\"04-05\"><h2>肺痈 <small>肺系<\/small><\/h2><p class=\"h\">老师：（「费用」= 肺痈）<\/p><p class=\"m\"><b>病机<\/b> 热伤肺气，蒸液成痰，热壅血瘀，血败肉腐　<b>治则<\/b> 祛邪，清热解毒，化瘀排脓，脓未成清肺消痈，脓已成排脓解毒，有脓必排<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>初期<\/b><\/td><td>疏散风热，清肺化痰，清肺散邪<\/td><td class=\"f\">银翘散<\/td><td>舌尖红、苔薄黄、苔薄白少津、脉浮滑数<\/td><td class=\"k\">痰量由少渐多、口干鼻燥<\/td><\/tr><tr><td><b>成痈期<\/b><\/td><td>清热解毒，化瘀消痈<\/td><td class=\"f\">千金苇茎汤、如金解毒散<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">有腥味、黄绿、振寒<\/td><\/tr><tr><td><b>溃脓期<\/b><\/td><td>排脓解毒<\/td><td class=\"f\">加味桔梗汤<\/td><td>舌红、苔黄腻、脉滑数、脉数实<\/td><td class=\"k\">大量脓血痰、咳吐大量脓痰、腥臭异常<\/td><\/tr><tr><td><b>恢复期<\/b><\/td><td>益气养阴清肺<\/td><td class=\"f\">沙参清肺汤、竹叶石膏汤、桔梗杏仁煎<\/td><td>舌淡红、苔薄、舌红、脉细、脉细数无力<\/td><td class=\"k\">身热渐退、痰液转为清稀<\/td><\/tr><\/table>", "card": [["定病", "咳吐腥臭浊痰、脓血相兼、咳吐大量腥臭脓痰"], ["病位", "肺"], ["病机", "热伤肺气，蒸液成痰，热壅血瘀，血败肉腐"], ["治则", "祛邪，清热解毒，化瘀排脓，脓未成清肺消痈，脓已成排脓解毒，有脓必排"], ["首辨", "辨病期；辨顺逆"], ["病因", "感受外邪；痰热素盛；内外合邪"], ["演变", "病理演变：初期、成痈期、溃脓期、恢复期四个阶段；溃后如脓毒不净，邪恋正虚，每致迁延反复，日久不愈，病势时轻时重，而转为慢性；初期：风热（寒）之邪侵袭卫表，内郁于肺，或内外合邪，肺卫同病，蓄热内蒸，热伤肺气，肺失清肃；成痈期：邪热壅肺，炼液成痰，气分热毒浸淫及血，热伤血脉，血为之凝滞，热壅血瘀，蕴酿成痈，形成痰热瘀毒蕴肺；溃脓期：痰热与瘀血壅阻肺络，肉腐血败化脓，继则肺损络伤，脓疡内溃外泄；恢复期：脓疡溃后，邪毒渐尽，病情趋向好转，但因肺体损伤，故可见邪去正虚，阴伤气耗的病理过程"], ["特点", "验痰法：脓血浊痰吐入水中，沉者是痈脓，浮者是痰；顺证：溃后声音清朗，脓血稀而减少，臭味转淡，饮食知味，胸胁少痛，身体不热，脉象缓滑；逆证：溃后音哑无力，脓血如败卤，腥味异常，气喘鼻扇，胸痛，食少，身热不退，颧红，指甲青紫，脉弦涩或弦急"], ["治疗要点", "按照有脓必排的要求，尤以排脓为首要措施；脓液能否排出是治疗成败的关节；防止发生大咯血；慎温补，宜通腑"]], "vs": [{"t": "初期、成痈期", "p": "都发热、咳嗽、胸痛：痰白黏、量由少渐多、脉浮是初期；痰转黄绿、喉间有腥味、胸痛转侧不利是成痈期。", "x": false, "k": [["初期", ["痰量由少渐多", "痰量逐渐增多", "白色黏痰", "脉浮"]], ["成痈期", ["黄绿", "有腥味", "转侧不利", "身热转甚"]]]}, {"t": "成痈期、溃脓期", "p": "看痰：痰黄绿、喉间有腥味（题干写咯痰腥臭也算）是成痈期；咳吐大量脓血痰、如米粥、腥臭异常是溃脓期。", "x": false, "k": [["成痈期", ["黄绿", "有腥味", "转侧不利"]], ["溃脓期", ["大量脓血痰", "腥臭异常", "米粥"]]]}, {"t": "溃脓期、恢复期", "p": "看现在：正咳吐大量脓血痰、腥臭异常是溃脓期；身热渐退、脓痰渐少、痰液转为清稀是恢复期，题干写「2周前大量脓血」也算恢复期。", "x": false, "k": [["溃脓期", ["大量脓血痰", "腥臭异常", "米粥"]], ["恢复期", ["身热渐退", "痰液转为清稀", "脓痰渐少"]]]}, {"t": "肺痈、痰热蕴肺", "p": "都发热、咳嗽、胸痛、痰带血：咯吐大量腥臭脓血浊痰、病重是肺痈（瘀热成痈）；黄稠脓痰夹有血色、病轻是痰热蕴肺（气分热）。", "x": false, "k": []}, {"t": "感冒风热犯表、咳嗽风热犯肺、肺痈初期", "p": "都风热、脉浮数：胸痛、咳时尤甚、痰量由少渐多是肺痈初期；咳嗽频剧、喉燥咽痛为主是咳嗽（桑菊饮）；身热较著、汗出不畅为主是感冒（银翘散，与肺痈初期同方）。", "x": true, "k": [["感冒·风热犯表", ["身热较著", "汗出不畅"]], ["咳嗽·风热犯肺", ["咳嗽频剧", "咳嗽较剧", "喉燥咽痛"]], ["肺痈·初期", ["胸痛", "咳时尤甚", "痰量由少渐多", "痰量逐渐增多"]]]}]}, "04-06": {"img": "img/04-06.png", "head": "<section id=\"04-06\"><h2>肺痨 <small>肺系<\/small><\/h2><p class=\"h\">老师：方 1 · 治法 1 · 证 1<\/p><p class=\"m\"><b>病机<\/b> 痨虫蚀肺，肺阴耗损，阴虚火旺，阴损及阳　<b>治则<\/b> 补虚培元，治痨杀虫<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>肺阴亏损<\/b><\/td><td>滋阴润肺<\/td><td class=\"f\">月华丸<\/td><td>舌红、苔薄少津、脉细、脉细数<\/td><td class=\"k\">手足心热、咳声短促<\/td><\/tr><tr><td><b>虚火灼肺<\/b><\/td><td>补益肺肾，滋阴降火<\/td><td class=\"f\">百合固金汤、秦艽鳖甲散<\/td><td>舌红绛、舌少津、苔薄黄、苔剥、脉细数<\/td><td class=\"k\">盗汗量多、呛咳、时时咯血<\/td><\/tr><tr><td><b>气阴耗伤<\/b><\/td><td>养阴润肺，益气健脾<\/td><td class=\"f\">保真汤<\/td><td>舌红、舌嫩、舌边有齿痕、苔薄、脉细弱而数<\/td><td class=\"k\">血色淡红、咳嗽无力、气短声低<\/td><\/tr><tr><td><b>阴阳两虚<\/b><\/td><td>滋阴补阳，培元固本<\/td><td class=\"f\">补天大造丸<\/td><td>舌红、苔无、舌少津、舌淡、舌胖、舌边有齿痕、脉细数、脉虚大<\/td><td class=\"k\">面浮肢肿、五更泄泻、肢冷<\/td><\/tr><\/table>", "card": [["定病", "咳嗽、咯血、潮热、盗汗、身体逐渐消瘦、有传染性、肺痨患者接触史"], ["病位", "肺、脾、肾"], ["病机", "痨虫蚀肺，肺阴耗损，阴虚火旺，阴损及阳"], ["治则", "补虚培元，治痨杀虫"], ["首辨", "辨病变部位；辨病情轻重"], ["治标", "润肺"], ["病因", "外因为感染痨虫；内因为正气不足"], ["病理性质", "主要以阴虚火旺为主，可致气阴两虚，甚则阴损及阳"], ["演变", "初起肺体受损，肺阴耗伤，肺失滋润，故见肺阴亏损之候；继则阴虚内热，而致阴虚火旺，或阴伤气耗，阴虚不能化气，导致气阴两虚，甚则阴损及阳，而见阴阳两虚之候"], ["特点", "顺证：元气未衰，胃气未伤，无大热，低热轻，无咯血，无短气不续；逆证：胃气大伤，大热或低热不退，大量咯血，反复发作，大骨枯槁，大肉陷下，骨枯发焦，喘促，短气不续，动则大汗，声音低微，唇色紫，脉浮大无根，或细而数疾等，病情较重，多难治"], ["治疗要点", "治疗原则：补虚培元和治痨杀虫；补虚：重在肺、脾、肾，根据“主乎阴虚”的病理特点，以滋阴为主，火旺者兼以降火；杀虫：主要针对病因治疗；病证结合，在辨证基础上加抗结核杀虫药；重视培土生金，补脾助肺；注意虚中夹实，标本同治；用药忌苦寒太过，以防伤阴败胃"]], "vs": [{"t": "肺阴亏损、虚火灼肺", "p": "四大症轻重不同：干咳、咳声短促、午后手足心热、少量盗汗是肺阴亏损；呛咳、时时咯血、盗汗量多、急躁易怒是虚火灼肺。", "x": false, "k": [["肺阴亏损", ["手足心热", "咳声短促", "少量盗汗"]], ["虚火灼肺", ["呛咳", "盗汗量多", "时时咯血", "急躁易怒"]]]}, {"t": "气阴耗伤、阴阳两虚", "p": "都自汗盗汗、舌边齿印：咳嗽无力、气短声低、血色淡红、便溏是气阴耗伤；肢冷形寒、面浮肢肿、五更泄泻、血色暗淡是阴阳两虚。", "x": false, "k": [["气阴耗伤", ["血色淡红", "咳嗽无力", "气短声低", "便溏"]], ["阴阳两虚", ["面浮肢肿", "五更泄泻", "肢冷", "暗淡"]]]}, {"t": "肺痨、肺痿、虚劳", "p": "痨虫传染、咳嗽咯血潮热盗汗是肺痨；咳吐浊唾涎沫是肺痿，肺痨晚期出现也归肺痿；五脏气血阴阳虚损、无传染性是虚劳。", "x": false, "k": []}, {"t": "阴阳两虚（肺痨、消渴）", "p": "肺痨用补天大造丸，滋阴补阳培元固本；消渴(下消)用金匮肾气丸，滋阴温阳补肾固涩，管小便频数。", "x": true, "k": [["肺痨·阴阳两虚", ["劳热骨蒸", "五更泻"]], ["消渴·阴阳两虚", ["浑浊如膏", "耳轮干枯"]]]}, {"t": "咳嗽肺阴亏虚、肺痨肺阴亏损、肺痿虚热", "p": "都阴虚干咳：痰血色鲜红、手足心热、皮肤干灼是肺痨（月华丸）；咳吐浊唾、皮毛干枯是肺痿（麦门冬汤合清燥救肺汤）；都没有、痰少质黏色白是咳嗽（沙参麦冬汤）。", "x": true, "k": [["咳嗽·肺阴亏虚", ["痰少质黏色白"]], ["肺痨·肺阴亏损", ["色鲜红", "手足心热", "皮肤干灼"]], ["肺痿·虚热", ["浊唾", "咳声不扬", "皮毛干枯", "脉虚数"]]]}]}, "04-07": {"img": "img/04-07.png", "head": "<section id=\"04-07\"><h2>肺胀 <small>肺系<\/small><\/h2><p class=\"h\">老师：胸部满；病理性质<\/p><p class=\"m\"><b>病机<\/b> 久病正虚，痰浊、水饮、血瘀互结于肺，气道壅塞，肺气胀满，不能敛降　<b>治则<\/b> 扶正祛邪<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>外寒内饮<\/b><\/td><td>温肺散寒，化饮降逆<\/td><td class=\"f\">小青龙汤<\/td><td>舌胖、舌暗淡、苔白滑、脉浮紧<\/td><td class=\"k\">周身酸楚、脉浮紧、咳痰白稀<\/td><\/tr><tr><td><b>痰浊壅肺<\/b><\/td><td>化痰降气，健脾益肺<\/td><td class=\"f\">三子养亲汤、苏子降气汤<\/td><td>舌暗、苔薄腻、苔浊腻、脉滑<\/td><td class=\"k\">怕风汗多、苔薄腻<\/td><\/tr><tr><td><b>痰热郁肺<\/b><\/td><td>清肺泄热，降逆平喘<\/td><td class=\"f\">越婢加半夏汤、桑白皮汤<\/td><td>舌暗红、苔黄、苔黄腻、脉滑数<\/td><td class=\"k\">目胀睛突、喘息气粗、胸满烦躁<\/td><\/tr><tr><td><b>痰蒙神窍<\/b><\/td><td>涤痰，开窍，息风<\/td><td class=\"f\">涤痰汤<\/td><td>舌暗红、舌淡紫、舌紫绛、苔白腻、苔黄腻、脉细滑数<\/td><td class=\"k\">撮空理线、谵妄、嗜睡<\/td><\/tr><tr><td><b>痰瘀阻肺<\/b><\/td><td>涤痰祛瘀，泻肺平喘<\/td><td class=\"f\">葶苈大枣泻肺汤、桂枝茯苓丸<\/td><td>舌暗、舌紫暗、舌下脉络迂曲增粗、苔腻、苔浊腻、脉弦滑<\/td><td class=\"k\">面色灰白而暗、舌下<\/td><\/tr><tr><td><b>阳虚水泛<\/b><\/td><td>温肾健脾，化饮利水<\/td><td class=\"f\">真武汤、五苓散<\/td><td>舌胖、舌暗、苔白滑、脉沉虚数、脉结、脉代<\/td><td class=\"k\">一身悉肿、面唇青紫<\/td><\/tr><tr><td><b>肺肾气虚<\/b><\/td><td>补肺纳肾，降气平喘<\/td><td class=\"f\">平喘固本汤、补肺汤<\/td><td>舌淡、舌紫暗、苔白润、脉沉细无力<\/td><td class=\"k\">难续、咳声低怯<\/td><\/tr><\/table>", "card": [["定病", "胸部膨满、憋闷如塞、慢性咳喘病史"], ["病位", "肺、脾、肾、心"], ["病机", "久病正虚，痰浊、水饮、血瘀互结于肺，气道壅塞，肺气胀满，不能敛降"], ["治则", "扶正祛邪"], ["首辨", "辨虚实标本；辨病情轻重"], ["治标", "平喘"], ["病因", "肺病迁延；六淫乘袭；年老体虚"], ["特点", "肺胀高龄者居多；其中以痰蒙神窍，肺肾气虚，阳虚水泛尤为危重，如不及时控制则预后不良"], ["病理性质", "本虚标实，肺、肾、心、脾脏亏虚为本，痰浊、水饮、血瘀互结为标；外感诱发时则偏于邪实，平时偏于本虚"], ["演变", "早期由肺及脾、肾，多属气虚、气阴两虚；晚期以肺、肾、心为主，气虚及阳，或阴阳两虚，正虚与邪实每多互为因果"], ["病理因素", "主要为痰浊、水饮与血瘀互为影响，兼见同病；一般早期以痰浊为主，渐而痰瘀并见，终至痰浊、血瘀、水饮错杂为患"], ["转归", "若痰浊壅盛，或痰热内扰，闭阻气道，蒙蔽神窍，则可发生烦躁、嗜睡、昏迷等变证；若痰热内郁，热动肝风，可见震颤、甚则抽搐、或因动血而致出血"], ["治疗要点", "肺胀的治疗应以扶正祛邪为基本原则；祛邪则咳自止，豁痰则喘自平"]], "vs": [{"t": "外寒内饮、痰浊壅肺、痰瘀阻肺", "p": "痰都白、可呈泡沫：恶寒、周身酸楚、脉浮紧是外寒内饮；怕风汗多、苔薄腻是痰浊壅肺；面色灰白而暗、舌下青筋增粗是痰瘀阻肺。", "x": false, "k": [["外寒内饮", ["周身酸楚", "脉浮紧", "咳痰白稀", "恶寒"]], ["痰浊壅肺", ["怕风汗多", "苔薄腻", "稍劳即著"]], ["痰瘀阻肺", ["面色灰白而暗", "舌下", "憋闷如塞", "脉弦滑"]]]}, {"t": "痰热郁肺、痰蒙神窍", "p": "都可舌暗红、苔黄腻、脉滑数：目胀睛突、胸满烦躁、溲黄便干是痰热郁肺；嗜睡、谵妄、撮空理线这类神志异常是痰蒙神窍。", "x": false, "k": [["痰热郁肺", ["目胀睛突", "喘息气粗", "溲黄便干"]], ["痰蒙神窍", ["撮空理线", "谵妄", "嗜睡", "表情淡漠"]]]}, {"t": "阳虚水泛、肺肾气虚", "p": "都虚、喘不能平卧：一身悉肿、尿少、面唇青紫是阳虚水泛；呼吸浅短难续、咳声低怯、倚息不能平卧是肺肾气虚。", "x": false, "k": [["阳虚水泛", ["一身悉肿", "尿少", "面唇青紫"]], ["肺肾气虚", ["难续", "咳声低怯", "倚息"]]]}, {"t": "肺胀、哮病、喘证", "p": "三病都咳喘：慢性病日久、胸部膨满、憋闷如塞是肺胀；发作时喉中哮鸣有声、反复发作是哮病；只是呼吸气促困难是喘证。", "x": false, "k": []}, {"t": "痰热郁肺（咳嗽、喘证、肺胀）", "p": "同是痰热壅肺：咳嗽用清金化痰汤肃肺止咳，喘证用桑白皮汤宣肺平喘，肺胀用越婢加半夏汤泄热降逆平喘。", "x": true, "k": [["咳嗽·痰热郁肺", ["痰声", "热腥味"]], ["喘证·痰热郁肺", ["气涌", "胸部胀痛"]], ["肺胀·痰热郁肺", ["目胀睛突", "胸满烦躁"]]]}, {"t": "阳虚水泛（肺胀、心衰）", "p": "两病都以真武汤温阳利水：肺胀合五苓散，化饮利水；心衰合葶苈大枣泻肺汤，益气活血利水。", "x": true, "k": [["肺胀·阳虚水泛", ["咯痰清稀", "苔白滑"]], ["心衰·阳虚水泛", ["颈脉显露", "口唇发绀"]]]}, {"t": "痰热郁肺（咳嗽、喘证、肺胀）", "p": "同名不同方：咳嗽喉中痰声、痰有热腥味→清金化痰汤；喘证喘咳气涌、喜冷饮→桑白皮汤；肺胀胸满烦躁、目胀睛突→越婢加半夏汤或桑白皮汤。", "x": true, "k": [["咳嗽·痰热郁肺", ["痰声", "热腥味", "咳时引痛"]], ["喘证·痰热郁肺", ["气涌", "喜冷饮", "小便赤涩"]], ["肺胀·痰热郁肺", ["目胀睛突", "胸满烦躁", "喘息气粗"]]]}, {"t": "咳嗽痰湿蕴肺、喘证痰浊阻肺、肺胀痰浊壅肺", "p": "都痰多白黏、用三子养亲汤：咳嗽咳声重浊（合二陈平胃散）；喘证喘而胸满闷塞（合二陈汤）；肺胀兼肺虚，怕风汗多（合苏子降气汤）。", "x": true, "k": [["咳嗽·痰湿蕴肺", ["咳声重浊", "稠厚成块"]], ["喘证·痰浊阻肺", ["胸满闷塞", "胸盈仰息", "口黏不渴"]], ["肺胀·痰浊壅肺", ["怕风汗多", "稍劳即著", "短气喘息"]]]}, {"t": "哮病寒哮、喘证风寒壅肺、肺胀外寒内饮", "p": "都痰白稀、脉浮紧：喉中哮鸣、满闷如塞是寒哮（射干麻黄汤或小青龙汤）；新感喘息咳逆、苔薄白而滑是喘证（麻黄汤合华盖散）；久病胸部膨满、周身酸楚是肺胀（小青龙汤）。", "x": true, "k": [["哮病·寒哮", ["哮鸣", "满闷如塞", "面色青晦"]], ["喘证·风寒壅肺", ["喘息咳逆", "苔薄白而滑"]], ["肺胀·外寒内饮", ["胸部膨满", "周身酸楚"]]]}, {"t": "肺胀阳虚水泛、心悸水饮凌心、心衰阳虚水泛", "p": "肺胀喘咳、咯痰清稀、一身悉肿→真武汤合五苓散；心悸渴不欲饮、恶心流涎→苓桂术甘汤；心衰颈脉显露、口唇发绀→真武汤合葶苈大枣泻肺汤。", "x": true, "k": [["肺胀·阳虚水泛", ["咯痰清稀", "一身悉肿"]], ["心悸·水饮凌心", ["渴不欲饮", "流涎", "胸闷痞满"]], ["心衰·阳虚水泛", ["颈脉显露", "口唇发绀", "胁下痞块"]]]}]}, "05-01": {"img": "img/05-01.png", "head": "<section id=\"05-01\"><h2>心悸 <small>心系<\/small><\/h2><p class=\"h\">老师：方；治法；舌脉 → 方<\/p><p class=\"m\"><b>病机<\/b> 气血阴阳亏虚，心失所养，邪扰心神，心神不宁　<b>治则<\/b> 分虚实论治，虚证补气养血滋阴温阳，实证祛痰化饮清火行瘀，酌配安神宁心或镇心<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>心虚胆怯<\/b><\/td><td>镇惊定志，养心安神<\/td><td class=\"f\">安神定志丸<\/td><td>苔薄白、脉细数、脉细弦<\/td><td class=\"k\">声响、坐卧不安、善惊易恐<\/td><\/tr><tr><td><b>心血不足<\/b><br><small>气血不足<\/small><\/td><td>补血养心，益气安神<\/td><td class=\"f\">归脾汤<\/td><td>舌淡红、脉细弱<\/td><td class=\"k\">面色无华、产后、细弱<\/td><\/tr><tr><td><b>阴虚火旺<\/b><\/td><td>滋阴清火，养心安神<\/td><td class=\"f\">天王补心丹、朱砂安神丸<\/td><td>舌红、舌少津、苔少、苔无、脉细数<\/td><td class=\"k\">舌红少苔、潮热<\/td><\/tr><tr><td><b>心阳不振<\/b><\/td><td>温补心阳，安神定悸<\/td><td class=\"f\">桂枝甘草龙骨牡蛎汤、参附汤<\/td><td>舌淡、苔白、脉虚弱、脉沉细无力<\/td><td class=\"k\">面色苍白<\/td><\/tr><tr><td><b>水饮凌心<\/b><\/td><td>振奋心阳，化气行水，宁心安神<\/td><td class=\"f\">苓桂术甘汤<\/td><td>舌淡、舌胖、苔白滑、脉弦滑、脉沉细滑<\/td><td class=\"k\">苔白滑、浮肿<\/td><\/tr><tr><td><b>瘀阻心脉<\/b><br><small>心血瘀阻<\/small><\/td><td>活血化瘀，理气通络<\/td><td class=\"f\">桃仁红花煎<\/td><td>舌紫暗、舌有瘀斑、脉涩、脉结、脉代<\/td><td class=\"k\">痛如针刺、唇甲青紫、瘀斑<\/td><\/tr><tr><td><b>痰火扰心<\/b><\/td><td>清热化痰，宁心安神<\/td><td class=\"f\">黄连温胆汤<\/td><td>舌红、苔黄腻、脉弦滑<\/td><td class=\"k\">苔黄腻、口干苦<\/td><\/tr><\/table>", "card": [["定病", "心中悸动、惊惕不安、惊悸、怔忡"], ["病位", "心、肝、脾、肾、肺"], ["病机", "气血阴阳亏虚，心失所养，邪扰心神，心神不宁"], ["治则", "分虚实论治，虚证补气养血滋阴温阳，实证祛痰化饮清火行瘀，酌配安神宁心或镇心"], ["首辨", "辨虚实"], ["治标", "定悸"], ["病因", "体虚劳倦；七情所伤；感受外邪；药食不当；主要病因有惊扰、水饮、虚劳及汗后受邪等"], ["病理性质", "主要有虚实两方面；虚者：为气、血、阴、阳亏损，心失滋养，而致心悸；实者：多由痰火扰心，水饮上凌或心血瘀阻，气血运行不畅，而发为心悸"], ["演变", "虚实之间可以相互夹杂或转化；心悸初起以心气虚为常见；病久阳虚者则表现为心阳不振、脾肾阳虚或水饮凌心之证；阴虚血亏者多表现为肝肾阴虚、心肾不交等证；若阴损及阳，或阳损及阴，可出现阴阳俱损之候"], ["转归", "若病情恶化，心阳暴脱，可出现厥脱等危候"], ["特点", "病情较轻者为惊悸；病情较重者为怔忡，可呈持续性"], ["治疗要点", "心悸应分虚实论治；虚证：补气、养血、滋阴、温阳；实证：祛痰、化饮、清火、行瘀；但本病以虚实错杂为多见，且虚实的主次、缓急各有不同，故治当相应兼顾；由于心悸均有心神不宁的病理特点，故应酌情配合安神宁心或镇心之法；心悸日久，当补益与通络并用"]], "vs": [{"t": "心血不足（心悸、汗证）", "p": "两病都用归脾汤：心悸取其补血养心、益气安神，汗证取其养血补心以敛汗，方同、用意不同。", "x": true, "k": [["心悸·心血不足", ["心悸气短", "头晕目眩"]], ["汗证·心血不足", ["睡则汗出", "醒则汗止"]]]}, {"t": "阴虚火旺（心悸、血证、汗证）", "p": "心悸用天王补心丹合朱砂安神丸安神定悸；血证(齿衄、紫斑)用茜根散止血；汗证用当归六黄汤滋阴降火止汗。", "x": true, "k": [["心悸·阴虚火旺", ["心悸易惊", "心烦失眠"]], ["血证·阴虚火旺", ["齿龈出血", "齿摇"]], ["汗证·阴虚火旺", ["夜寐盗汗", "两颧色红"]]]}, {"t": "肺胀阳虚水泛、心悸水饮凌心、心衰阳虚水泛", "p": "肺胀喘咳、咯痰清稀、一身悉肿→真武汤合五苓散；心悸渴不欲饮、恶心流涎→苓桂术甘汤；心衰颈脉显露、口唇发绀→真武汤合葶苈大枣泻肺汤。", "x": true, "k": [["肺胀·阳虚水泛", ["咯痰清稀", "一身悉肿"]], ["心悸·水饮凌心", ["渴不欲饮", "流涎", "胸闷痞满"]], ["心衰·阳虚水泛", ["颈脉显露", "口唇发绀", "胁下痞块"]]]}, {"t": "心悸瘀阻心脉、胸痹心血瘀阻", "p": "看主诉：心悸不安为主、心痛时作如针刺、唇甲青紫是心悸（桃仁红花煎）；胸部刺痛固定不移、入夜尤甚为主是胸痹（血府逐瘀汤）。", "x": true, "k": [["心悸·瘀阻心脉", ["心悸不安", "痛如针刺", "唇甲青紫"]], ["胸痹·心血瘀阻", ["固定不移", "入夜", "如刺如绞"]]]}, {"t": "心悸阴虚火旺、不寐心肾不交", "p": "都阴虚火旺、舌红脉细数，看主诉：心悸易惊、思虑劳心加重是心悸（天王补心丹合朱砂安神丸）；心烦不寐、入睡困难是不寐（六味地黄丸合交泰丸）。", "x": true, "k": [["心悸·阴虚火旺", ["心悸易惊", "思虑劳心"]], ["不寐·心肾不交", ["心烦不寐", "入睡困难", "咽干少津"]]]}, {"t": "心虚胆怯、心血不足、阴虚火旺", "p": "易惊两证都有，先看热：舌红少苔、潮热、腰酸耳鸣是阴虚火旺；不热而怕声响、坐卧不安是心虚胆怯；面色无华、脉细弱是心血不足。", "x": false, "k": [["心虚胆怯", ["声响", "坐卧不安", "善惊易恐"]], ["心血不足", ["面色无华", "细弱", "产后"]], ["阴虚火旺", ["潮热", "少苔", "耳鸣", "腰酸"]]]}, {"t": "阴虚火旺、痰火扰心", "p": "都有火、失眠、口干舌红：舌红少苔、潮热、腰酸是阴虚火旺（虚火）；苔黄腻、口干苦、大便秘结是痰火扰心（痰热实火）。", "x": false, "k": [["阴虚火旺", ["少苔", "潮热", "腰酸"]], ["痰火扰心", ["苔黄腻", "口干苦", "大便秘结"]]]}, {"t": "心血不足、心阳不振、水饮凌心", "p": "先看寒：不怕冷、面色无华、脉细弱是心血不足；怕冷再看水：苔白滑、小便短少、恶心、渴不欲饮是水饮凌心；有寒无水、面色苍白是心阳不振。", "x": false, "k": [["心血不足", ["面色无华", "细弱", "产后", "倦怠"]], ["心阳不振", ["面色苍白", "胸闷气短", "虚弱"]], ["水饮凌心", ["苔白滑", "小便短少", "恶心", "渴不欲饮"]]]}, {"t": "惊悸、怔忡", "p": "看诱因和持续：受惊、情绪诱发，阵发，不发时如常人是惊悸；久病体虚，无诱因也发，持续不止是怔忡。", "x": false, "k": []}]}, "05-02": {"img": "img/05-02.png", "head": "<section id=\"05-02\"><h2>胸痹 <small>心系<\/small><\/h2><p class=\"h\">老师：诊治分类；B 型 证型-推、方 2 题<\/p><p class=\"m\"><b>病机<\/b> 心脉痹阻　<b>治则<\/b> 先治其标，后治其本，标实当泻，尤重活血通脉，本虚宜补，尤重补益心气<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>心血瘀阻<\/b><\/td><td>活血化瘀，通脉止痛<\/td><td class=\"f\">血府逐瘀汤<\/td><td>舌紫暗、舌有瘀点、舌有瘀斑、苔薄、脉弦涩<\/td><td class=\"k\">如刺如绞、刺痛、入夜<\/td><\/tr><tr><td><b>气滞心胸<\/b><\/td><td>疏肝理气，活血通络<\/td><td class=\"f\">柴胡疏肝散<\/td><td>苔薄、苔薄腻、脉细弦<\/td><td class=\"k\">情志、嗳气、太息<\/td><\/tr><tr><td><b>痰浊闭阻<\/b><\/td><td>通阳泄浊，豁痰宣痹<\/td><td class=\"f\">栝蒌薤白半夏汤、涤痰汤<\/td><td>舌胖、舌边有齿痕、苔浊腻、苔白滑、脉滑<\/td><td class=\"k\">痰多、阴雨、脉滑<\/td><\/tr><tr><td><b>寒凝心脉<\/b><\/td><td>辛温散寒，宣通心阳<\/td><td class=\"f\">枳实薤白桂枝汤、当归四逆汤<\/td><td>苔薄白、脉沉紧、脉沉细<\/td><td class=\"k\">心痛如绞、脉沉紧<\/td><\/tr><tr><td><b>气阴两虚<\/b><\/td><td>益气养阴，活血通脉<\/td><td class=\"f\">生脉散、人参养荣汤<\/td><td>舌淡红、舌胖、舌边有齿痕、苔薄白、脉虚细缓、脉结、脉代<\/td><td class=\"k\">虚细<\/td><\/tr><tr><td><b>心肾阴虚<\/b><\/td><td>滋阴清火，养心和络<\/td><td class=\"f\">天王补心丹、炙甘草汤<\/td><td>舌红、舌少津、苔薄、苔剥、脉细数、脉结、脉代、脉促<\/td><td class=\"k\">腰酸、舌红少津<\/td><\/tr><tr><td><b>心肾阳虚<\/b><\/td><td>温补阳气，振奋心阳<\/td><td class=\"f\">参附汤、右归饮<\/td><td>舌淡、舌胖、舌边有齿痕、苔白、苔腻、脉沉细迟<\/td><td class=\"k\">心悸而痛、晄白、沉细迟<\/td><\/tr><\/table>", "card": [["定病", "胸部闷痛、胸痛彻背、心痛彻背、喘息不得卧、放射至左肩背"], ["病位", "心、肝、肺、脾、肾"], ["病机", "心脉痹阻"], ["治则", "先治其标，后治其本，标实当泻，尤重活血通脉，本虚宜补，尤重补益心气"], ["首辨", "辨标本虚实；辨病情轻重"], ["治标", "止痛"], ["病因", "寒邪内侵；饮食不节；情志失调；劳倦内伤；年迈体虚"], ["诱因", "常因操劳过度、抑郁恼怒、多饮暴食或气候变化而诱发"], ["病理性质", "本虚标实，虚实夹杂；本虚: 气虚、气阴两虚及阳气虚衰；标实: 寒凝、血瘀、痰浊、气滞、热蕴"], ["演变", "胸痹病机转化可因实致虚，亦可因虚致实"], ["转归", "胸痹反复发作，病情如若骤变，可见心胸猝然大痛，出现真心痛，甚则“旦发夕死，夕发旦死”"], ["特点", "轻者：多为胸阳不振，阴寒之邪上乘，阻滞气机，临床表现为胸中气塞，短气；重者：痰瘀交阻，壅塞胸中，气机痹阻，表现为不得卧，心痛彻背；缓作者：渐进而为，日积月累，始则偶感心胸不舒，继而心痹痛作，发作日頻，甚则掣及后背；急发者：素无不舒之感，或许久不发，因感寒、劳倦、七情所伤等诱因而猝然心痛；顺症：疼痛遇劳发作，休息或服药后能缓解；危候：服药后疼痛难以缓解者"], ["治疗要点", "治疗原则：先治其标，后治其本；标实：当泻；尤重活血通脉；本虚：宜补；尤其重视补益心气之不足；一旦发现脱证之先兆，必须尽早投用益气固脱之品；治疗应以通为补，通补结合"]], "vs": [{"t": "气阴两虚（胸痹、心衰、癌病）", "p": "胸痹、心衰都用生脉散益气养阴，胸痹合人参养荣汤，心衰重活血通脉；癌病用生脉地黄汤，益气养阴为扶正抗癌。", "x": true, "k": [["胸痹·气阴两虚", ["心胸隐痛", "时作时止"]], ["心衰·气阴两虚", ["动则加剧", "两颧潮红"]], ["癌病·气阴两虚", ["口咽干燥", "视物昏花"]]]}, {"t": "心肾阴虚（胸痹、郁证）", "p": "同用天王补心丹：胸痹合炙甘草汤，滋阴清火、养心和络；郁证合六味地黄丸，滋养心肾。", "x": true, "k": [["胸痹·心肾阴虚", ["心痛憋闷", "心悸盗汗"]], ["郁证·心肾阴虚", ["虚烦少寐", "男子遗精"]]]}, {"t": "心悸瘀阻心脉、胸痹心血瘀阻", "p": "看主诉：心悸不安为主、心痛时作如针刺、唇甲青紫是心悸（桃仁红花煎）；胸部刺痛固定不移、入夜尤甚为主是胸痹（血府逐瘀汤）。", "x": true, "k": [["心悸·瘀阻心脉", ["心悸不安", "痛如针刺", "唇甲青紫"]], ["胸痹·心血瘀阻", ["固定不移", "入夜", "如刺如绞"]]]}, {"t": "心血瘀阻、气滞心胸、寒凝心脉", "p": "先看痛：带「刺」、入夜甚是心血瘀阻（生气、受寒加重也不改）；随情志加重、善太息、嗳气则舒是气滞心胸；心痛如绞、遇寒发、冷汗、脉沉紧是寒凝心脉。", "x": false, "k": [["心血瘀阻", ["如刺", "刺痛", "入夜"]], ["气滞心胸", ["情志", "嗳气", "太息", "叹息"]], ["寒凝心脉", ["心痛如绞", "沉紧", "冷汗", "寒冬"]]]}, {"t": "寒凝心脉、心肾阳虚", "p": "都怕冷、胸闷气短：绞痛、遇寒发作、脉沉紧是寒凝心脉（实寒）；心悸而痛、动则更甚、面色㿠白、脉沉细迟是心肾阳虚（虚寒）。", "x": false, "k": [["寒凝心脉", ["心痛如绞", "沉紧", "冷汗", "寒冬"]], ["心肾阳虚", ["心悸而痛", "动则更甚", "晄白", "沉细迟"]]]}, {"t": "气阴两虚、心肾阴虚、心肾阳虚", "p": "三个本虚证：隐痛、舌淡红、脉虚细缓是气阴两虚；舌红少津、腰酸耳鸣是心肾阴虚；心悸而痛、面色㿠白、怯寒、脉沉细迟是心肾阳虚。", "x": false, "k": [["气阴两虚", ["隐痛", "淡红", "虚细"]], ["心肾阴虚", ["舌红少津", "腰酸", "耳鸣", "细数"]], ["心肾阳虚", ["心悸而痛", "晄白", "怯寒", "沉细迟"]]]}, {"t": "胸痹、悬饮", "p": "都胸痛：闷痛放射左肩背、历时短、休息或服药能缓解是胸痹；胸胁胀痛持续不解、转侧呼吸加重、伴咳嗽咳痰是悬饮。", "x": false, "k": []}]}, "05-03": {"img": "img/05-03.png", "head": "<section id=\"05-03\"><h2>心衰 <small>心系<\/small><\/h2><p class=\"h\">老师：B 型 2 证<\/p><p class=\"m\"><b>病机<\/b> 心之气血阴阳亏损，血脉瘀阻，痰浊水饮停聚，虚瘀痰水　<b>治则<\/b> 补虚泻实，益气养阴温阳，活血化痰利水<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>气虚血瘀<\/b><\/td><td>益气温阳，活血祛瘀<\/td><td class=\"f\">保元汤、血府逐瘀汤<\/td><td>舌淡、舌胖、舌暗淡、舌有瘀斑、脉沉细、脉涩、脉结、脉代<\/td><td class=\"k\">肢肿时作、㑿白<\/td><\/tr><tr><td><b>气阴两虚<\/b><\/td><td>益气养阴，活血通脉<\/td><td class=\"f\">生脉散<\/td><td>舌暗红、苔少、舌少津、脉细数无力、脉结、脉代<\/td><td class=\"k\">五心烦热、手足心热、入夜尤甚<\/td><\/tr><tr><td><b>阳虚水泛<\/b><\/td><td>益气温阳，活血利水<\/td><td class=\"f\">真武汤、葶苈大枣泻肺汤<\/td><td>舌淡、舌胖、舌边有齿痕、舌有瘀点、舌有瘀斑、脉沉细、脉结、脉代、脉促<\/td><td class=\"k\">面浮肢肿、畏寒、形寒<\/td><\/tr><tr><td><b>喘脱危证<\/b><\/td><td>益气回阳固脱<\/td><td class=\"f\">四逆加人参汤<\/td><td>舌淡、苔白、脉微欲绝、脉疾数无力<\/td><td class=\"k\">不休、欲绝、额汗如油<\/td><\/tr><\/table>", "card": [["定病", "喘息心悸、不能平卧、尿少肢肿、口唇发绀、颈脉显露"], ["病位", "心、肺、脾、肾、肝"], ["病机", "心之气血阴阳亏损，血脉瘀阻，痰浊水饮停聚，虚瘀痰水"], ["治则", "补虚泻实，益气养阴温阳，活血化痰利水"], ["首辨", "辨轻重缓急；辨标本虚实"], ["治标", "利水"], ["概念", "为多种慢性心系疾病反复发展，迁延不愈，日渐加重的终末期阶段"], ["病因", "久病耗伤；感受外邪；情志失调；劳倦内伤"], ["诱因", "常因外感、劳倦、情志等刺激诱发或加重"], ["病理性质", "本虚标实，虚实夹杂，以虚为主；本虚：气虚、气阴两虚及阳气亏虚；标实：瘀血、痰浊、水饮"], ["病理因素", "心衰的病机关键：虚、瘀、痰、水四者概括"], ["演变", "早期：心肺气虚。心气虚衰是基础；中期：气阴两虚、心阳亏虚；后期：阴损及阳，阳损及阴，阴阳互损，瘀血、痰浊、水饮内聚，虚实夹杂。血瘀作为中心病理环节贯穿始终；病理演变：可从心、肺渐及脾、肾，并逐步损阴伤阳，但终以心虚为主"], ["治疗要点", "治疗原则：补虚泻实；常以益气养阴温阳，活血化痰利水为基本治法；必要时需急救回阳固脱；益气活血法贯穿心衰病治疗始终；扶正养阴需重视"]], "vs": [{"t": "喘脱危证（哮病、心衰）", "p": "哮病用回阳救急汤合生脉散，补肺纳肾固脱；心衰用四逆加人参汤，益气回阳固脱。", "x": true, "k": [["哮病·喘脱危证", ["张口抬肩", "脉浮大无根"]], ["心衰·喘脱危证", ["喘悸不休", "额汗如油"]]]}, {"t": "阳虚水泛（肺胀、心衰）", "p": "两病都以真武汤温阳利水：肺胀合五苓散，化饮利水；心衰合葶苈大枣泻肺汤，益气活血利水。", "x": true, "k": [["肺胀·阳虚水泛", ["咯痰清稀", "苔白滑"]], ["心衰·阳虚水泛", ["颈脉显露", "口唇发绀"]]]}, {"t": "气阴两虚（胸痹、心衰、癌病）", "p": "胸痹、心衰都用生脉散益气养阴，胸痹合人参养荣汤，心衰重活血通脉；癌病用生脉地黄汤，益气养阴为扶正抗癌。", "x": true, "k": [["胸痹·气阴两虚", ["心胸隐痛", "时作时止"]], ["心衰·气阴两虚", ["动则加剧", "两颧潮红"]], ["癌病·气阴两虚", ["口咽干燥", "视物昏花"]]]}, {"t": "气虚血瘀（心衰、中风）", "p": "心衰用保元汤合血府逐瘀汤，益气温阳活血祛瘀；中风用补阳还五汤，益气化瘀通络治偏枯。", "x": true, "k": [["心衰·气虚血瘀", ["喘息不得卧", "口唇发绀"]], ["中风·气虚血瘀", ["偏枯不用", "肢软无力"]]]}, {"t": "哮病喘脱危证、喘证正虚喘脱、心衰喘脱危证", "p": "都喘促肢冷欲脱，按病记方：哮病反复久发、神志昏蒙→回阳急救汤合生脉饮；喘证稍动则咳喘欲绝→参附汤送服黑锡丹；心衰喘悸不休、尿少肢肿→四逆加人参汤。", "x": true, "k": [["哮病·喘脱危证", ["哮病反复久发", "神志昏蒙", "舌质青暗"]], ["喘证·正虚喘脱", ["咳喘欲绝", "喘逆剧甚", "汗出如珠"]], ["心衰·喘脱危证", ["喘悸不休", "尿少肢肿", "大汗淋漓"]]]}, {"t": "肺胀阳虚水泛、心悸水饮凌心、心衰阳虚水泛", "p": "肺胀喘咳、咯痰清稀、一身悉肿→真武汤合五苓散；心悸渴不欲饮、恶心流涎→苓桂术甘汤；心衰颈脉显露、口唇发绀→真武汤合葶苈大枣泻肺汤。", "x": true, "k": [["肺胀·阳虚水泛", ["咯痰清稀", "一身悉肿"]], ["心悸·水饮凌心", ["渴不欲饮", "流涎", "胸闷痞满"]], ["心衰·阳虚水泛", ["颈脉显露", "口唇发绀", "胁下痞块"]]]}, {"t": "气虚血瘀、气阴两虚、阳虚水泛", "p": "先看寒热：畏寒肢冷、面浮肢肿、腹胀是阳虚水泛；五心烦热、两颧潮红、少苔是气阴两虚；不寒不热、面色㑿白、肢肿时作是气虚血瘀。", "x": false, "k": [["气虚血瘀", ["㑿白", "肢肿时作"]], ["气阴两虚", ["五心烦热", "手足心热", "两颧潮红", "少苔"]], ["阳虚水泛", ["面浮肢肿", "畏寒", "形寒", "腹胀"]]]}, {"t": "阳虚水泛、喘脱危证", "p": "都阳虚、不能平卧、尿少肢肿：喘悸不休、大汗淋漓或额汗如油、脉微欲绝是喘脱危证；畏寒、面浮肢肿、腹胀便溏是阳虚水泛。", "x": false, "k": [["阳虚水泛", ["面浮肢肿", "畏寒", "腹胀", "便溏"]], ["喘脱危证", ["不休", "欲绝", "额汗如油", "大汗淋漓"]]]}, {"t": "心衰、喘证", "p": "都喘促短气：久患心病，喘时还心悸、浮肿、尿少是心衰；肺系病，外感诱发、多兼表证是喘证。", "x": false, "k": []}]}, "05-04": {"img": "img/05-04.png", "head": "<section id=\"05-04\"><h2>不寐 <small>心系<\/small><\/h2><p class=\"h\">老师：方 2；肝火 / 痰热 / 心脾两虚；睡不好：证 → 治法 → 方<\/p><p class=\"m\"><b>病机<\/b> 阳盛阴衰，阴阳失交　<b>治则<\/b> 补虚泻实，调整阴阳，佐以安神定志<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>肝火扰心<\/b><\/td><td>疏肝泻热，镇心安神<\/td><td class=\"f\">龙胆泻肝汤<\/td><td>舌红、苔黄、脉弦数<\/td><td class=\"k\">急躁易怒、目赤、脉弦数<\/td><\/tr><tr><td><b>痰热扰心<\/b><\/td><td>清化痰热，和中安神<\/td><td class=\"f\">黄连温胆汤<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">苔黄腻、脉滑数、头重<\/td><\/tr><tr><td><b>心脾两虚<\/b><\/td><td>补益心脾，养血安神<\/td><td class=\"f\">归脾汤<\/td><td>舌淡、苔薄、脉细弱<\/td><td class=\"k\">面色少华、多梦易醒、细弱<\/td><\/tr><tr><td><b>心肾不交<\/b><\/td><td>滋阴降火，交通心肾<\/td><td class=\"f\">六味地黄丸、交泰丸<\/td><td>舌红、苔少、脉细数<\/td><td class=\"k\">腰膝酸软、五心烦热、脉细数<\/td><\/tr><tr><td><b>心胆气虚<\/b><\/td><td>益气镇惊，安神定志<\/td><td class=\"f\">安神定志丸、酸枣仁汤<\/td><td>舌淡、脉细弦<\/td><td class=\"k\">终日惕惕、胆怯、触事易惊<\/td><\/tr><tr><td><b>湿盛困脾<\/b><\/td><td>燥湿健脾，醒神开窍<\/td><td class=\"f\">平胃散<\/td><td>舌淡、苔腻、脉濡<\/td><td class=\"k\">头蒙如裹、肢体沉重、脉濡<\/td><\/tr><tr><td><b>瘀血阻滞<\/b><\/td><td>活血通络<\/td><td class=\"f\">通窍活血汤<\/td><td>舌紫暗、舌有瘀斑、脉涩<\/td><td class=\"k\">外伤史、脉涩<\/td><\/tr><tr><td><b>脾气虚弱<\/b><\/td><td>健脾益气<\/td><td class=\"f\">香砂六君子汤<\/td><td>苔薄白、脉虚弱<\/td><td class=\"k\">饭后尤甚、面色萎黄<\/td><\/tr><tr><td><b>阳气虚弱<\/b><br><small>阳气虚衰<\/small><\/td><td>益气温阳<\/td><td class=\"f\">附子理中丸<\/td><td>舌淡、苔薄、脉沉细无力<\/td><td class=\"k\">畏寒肢冷、心神昏浊<\/td><\/tr><\/table>", "card": [["定病", "不能获得正常睡眠、入睡困难、寐而不酣、彻夜不寐"], ["病位", "心、肝、脾、肾"], ["病机", "阳盛阴衰，阴阳失交"], ["治则", "补虚泻实，调整阴阳，佐以安神定志"], ["首辨", "辨虚实；辨受病脏腑"], ["治标", "安神、定志"], ["概念", "经常不能获得正常睡眠为主症"], ["病因", "饮食不节；情志失常；劳逸失调；病后体虚"], ["病理性质", "不寐的病机可虚实互相转化"], ["治则", "治疗以补虚泻实，调整阴阳为原则"]], "vs": [{"t": "心脾两虚（不寐、癫狂、遗精、郁证）", "p": "不寐、遗精、郁证都用归脾汤；癫狂用养心汤合越鞠丸，多了解郁（健脾养心、解郁安神）。", "x": true, "k": [["不寐·心脾两虚", ["不易入睡", "多梦易醒"]], ["癫狂·心脾两虚", ["神思恍惚", "善悲欲哭"]], ["遗精·心脾两虚", ["早泄"]], ["郁证·心脾两虚", ["多思善虑", "心悸胆怯"]]]}, {"t": "心悸阴虚火旺、不寐心肾不交", "p": "都阴虚火旺、舌红脉细数，看主诉：心悸易惊、思虑劳心加重是心悸（天王补心丹合朱砂安神丸）；心烦不寐、入睡困难是不寐（六味地黄丸合交泰丸）。", "x": true, "k": [["心悸·阴虚火旺", ["心悸易惊", "思虑劳心"]], ["不寐·心肾不交", ["心烦不寐", "入睡困难", "咽干少津"]]]}, {"t": "心脾两虚、心肾不交、心胆气虚", "p": "先看舌：舌红少苔、腰膝酸软、五心烦热是心肾不交；舌淡再分：胆怯、触事易惊、终日惕惕是心胆气虚；面色少华、多梦易醒、脉细弱是心脾两虚。", "x": false, "k": [["心脾两虚", ["面色少华", "多梦易醒", "细弱", "四肢倦怠"]], ["心肾不交", ["腰膝酸软", "五心烦热", "少苔", "细数"]], ["心胆气虚", ["胆怯", "触事易惊", "终日惕惕", "弦细"]]]}, {"t": "肝火扰心、痰热扰心、心肾不交", "p": "都有火、失眠：急躁易怒、目赤、脉弦数是肝火扰心；苔黄腻、头重、泛恶、脉滑数是痰热扰心；腰膝酸软、五心烦热、舌红少苔是心肾不交（虚火）。", "x": false, "k": [["肝火扰心", ["急躁易怒", "目赤", "头胀", "弦数"]], ["痰热扰心", ["苔黄腻", "滑数", "头重", "泛恶"]], ["心肾不交", ["腰膝酸软", "五心烦热", "少苔", "细数"]]]}]}, "06-01": {"img": "img/06-01.png", "head": "<section id=\"06-01\"><h2>头痛 <small>脑系<\/small><\/h2><p class=\"h\">老师：方（天麻：肝阳 / 痰）；证<\/p><p class=\"m\"><b>病机<\/b> 外邪上扰清空，壅滞经络，络脉不通，肝脾肾三脏失调　<b>治则<\/b> 外感以祛风为主，兼以散寒、清热、祛湿，内伤虚证补养气血或益肾填精，内伤实证平肝、化痰、行瘀，虚实夹杂补虚泻实<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风寒头痛<\/b><\/td><td>疏散风寒止痛<\/td><td class=\"f\">川芎茶调散<\/td><td>舌淡红、苔薄白、脉浮、脉浮紧<\/td><td class=\"k\">喜裹、遇风尤剧<\/td><\/tr><tr><td><b>风热头痛<\/b><\/td><td>疏风清热和络<\/td><td class=\"f\">芎芷石膏汤<\/td><td>舌尖红、苔薄黄、脉浮数<\/td><td class=\"k\">如裂、脉浮数<\/td><\/tr><tr><td><b>风湿头痛<\/b><\/td><td>祛风胜湿通窍<\/td><td class=\"f\">羌活胜湿汤<\/td><td>舌淡、苔白腻、脉濡<\/td><td class=\"k\">如裹、肢体困重、脉濡<\/td><\/tr><tr><td><b>肝阳头痛<\/b><\/td><td>平肝潜阳息风<\/td><td class=\"f\">天麻钩藤饮<\/td><td>舌红、苔薄黄、脉弦数<\/td><td class=\"k\">而眩、脉弦数<\/td><\/tr><tr><td><b>血虚头痛<\/b><\/td><td>滋阴养血，和络止痛<\/td><td class=\"f\">加味四物汤<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">心悸怔忡、面色少华<\/td><\/tr><tr><td><b>气虚头痛<\/b><\/td><td>健脾益气升清<\/td><td class=\"f\">益气聪明汤<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">时发时止<\/td><\/tr><tr><td><b>痰浊头痛<\/b><br><small>痰湿头痛<\/small><\/td><td>健脾燥湿，化痰降逆<\/td><td class=\"f\">半夏白术天麻汤<\/td><td>舌淡、苔白腻、脉滑、脉弦滑<\/td><td class=\"k\">昏蒙<\/td><\/tr><tr><td><b>肾虚头痛<\/b><\/td><td>养阴补肾，填精生髓<\/td><td class=\"f\">大补元煎<\/td><td>舌红、苔少、脉细弱<\/td><td class=\"k\">且空、少寐健忘<\/td><\/tr><tr><td><b>瘀血头痛<\/b><\/td><td>活血化瘀，通窍止痛<\/td><td class=\"f\">通窍活血汤<\/td><td>舌紫暗、舌有瘀斑、舌有瘀点、苔薄白、脉细、脉细涩<\/td><td class=\"k\">锥刺、外伤、固定不移<\/td><\/tr><\/table>", "card": [["定病", "以头痛为主症、自觉头部疼痛"], ["病位", "脑、经络、肝、脾、肾"], ["病机", "外邪上扰清空，壅滞经络，络脉不通，肝脾肾三脏失调"], ["治则", "外感以祛风为主，兼以散寒、清热、祛湿，内伤虚证补养气血或益肾填精，内伤实证平肝、化痰、行瘀，虚实夹杂补虚泻实"], ["首辨", "辨外感与内伤；辨头痛部位；辨头痛性质"], ["治标", "止痛"], ["概念", "是以自觉头部疼痛为主的疾病"], ["病因", "感受外邪；其中以风邪为主；情志失调；饮食劳伤；先天不足或房事不节；头部外伤或久病入络"], ["病理性质", "有虚实之分；外感属表实证；肝阳、痰浊、瘀血属实证；气血亏虚、肾精不足属虚证"], ["演变", "由实转虚或见本虚标实、虚实夹杂证候；各种头痛若迁延不愈，久病入络，又可转变为瘀血头痛"], ["治则", "治疗当以祛风为主，兼以散寒、清热、祛湿"], ["治疗要点", "虚证：以补养气血或益肾填精为主；实证：平肝、化痰、行瘀为主；虚实夹杂：标本兼顾，补虚泻实"]], "vs": [{"t": "风寒头痛、风热头痛、风湿头痛", "p": "外感头痛看痛的样子：连项背、喜裹、遇风尤剧是风寒；头胀如裂、脉浮数是风热；头痛如裹、肢体困重、脉濡是风湿。", "x": false, "k": [["风寒头痛", ["喜裹", "遇风尤剧", "掣痛"]], ["风热头痛", ["如裂", "脉浮数"]], ["风湿头痛", ["如裹", "肢体困重", "脉濡"]]]}, {"t": "风湿头痛、痰浊头痛", "p": "都苔白腻、纳呆胸闷：头痛如裹、肢体困重、脉濡是风湿（外感）；头痛昏蒙沉重、脉滑是痰浊（内伤）。", "x": false, "k": [["风湿头痛", ["如裹", "肢体困重", "脉濡"]], ["痰浊头痛", ["昏蒙", "脉滑"]]]}, {"t": "血虚头痛、气虚头痛、肾虚头痛", "p": "先看舌：舌淡脉细弱是血虚或气虚（心悸怔忡、面色少华是血虚；时发时止、纳食减少是气虚）；头痛且空、少寐健忘、舌红少苔是肾虚。", "x": false, "k": [["血虚头痛", ["心悸怔忡", "面色少华"]], ["气虚头痛", ["时发时止", "纳食减少"]], ["肾虚头痛", ["且空", "少寐健忘"]]]}, {"t": "风热头痛、肝阳头痛", "p": "都头胀痛、面红、苔黄：头胀如裂、发热恶风、口渴、脉浮数是风热（外感）；头胀痛而眩、心烦易怒、胁痛、脉弦数是肝阳（内伤）。", "x": false, "k": [["风热头痛", ["如裂", "口渴", "脉浮数"]], ["肝阳头痛", ["而眩", "心烦", "胁痛", "脉弦数"]]]}, {"t": "头痛肝阳头痛、眩晕肝阳上亢、中风风阳上扰", "p": "三证都用天麻钩藤饮，看主诉：以头痛为主、头胀痛而眩是头痛；以眩晕为主、遇郁怒加重是眩晕；有半身不遂、口舌歪斜是中风。", "x": true, "k": [["头痛·肝阳头痛", ["而眩", "胁痛", "口苦面红"]], ["眩晕·肝阳上亢", ["郁怒", "肢麻震颤", "甚则仆倒"]], ["中风·风阳上扰", ["半身不遂", "口舌歪斜", "手足重滞"]]]}]}, "06-02": {"img": "img/06-02.png", "head": "<section id=\"06-02\"><h2>眩晕 <small>脑系<\/small><\/h2><p class=\"h\">老师：证（不是 xx 的症状）；晕+无力：肾虚、气血虚<\/p><p class=\"m\"><b>病机<\/b> 本虚：肝肾亏虚，气血不足，髓海不足，清窍失养，标实：风、火、痰、瘀，扰乱清窍，本虚标实，以虚证居多　<b>治则<\/b> 补虚泻实，调整阴阳<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>肝阳上亢<\/b><\/td><td>平肝潜阳，清火息风<\/td><td class=\"f\">天麻钩藤饮<\/td><td>舌红、苔黄、脉弦、脉数<\/td><td class=\"k\">郁怒、潮红、肢麻震颤<\/td><\/tr><tr><td><b>痰湿中阻<\/b><br><small>痰浊中阻<\/small><\/td><td>化痰祛湿，健脾和胃<\/td><td class=\"f\">半夏白术天麻汤<\/td><td>苔白腻、脉濡滑<\/td><td class=\"k\">多寐、痰涎、头重如<\/td><\/tr><tr><td><b>瘀血阻窍<\/b><\/td><td>祛瘀生新，活血通窍<\/td><td class=\"f\">通窍活血汤<\/td><td>舌暗、舌有瘀斑、舌下脉络迂曲增粗、脉涩、脉细涩<\/td><td class=\"k\">定处、紫暗、瘀斑<\/td><\/tr><tr><td><b>气血亏虚<\/b><\/td><td>补益气血，调养心脾<\/td><td class=\"f\">归脾汤<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">动则加剧、唇甲不华<\/td><\/tr><tr><td><b>肾精不足<\/b><\/td><td>滋养肝肾，填精益髓<\/td><td class=\"f\">左归丸<\/td><td>舌红、苔少、舌淡、舌嫩、苔白、脉细数、脉沉细无力<\/td><td class=\"k\">精神萎靡<\/td><\/tr><\/table>", "card": [["定病", "头晕目眩、视物旋转、如坐车船"], ["病位", "脑、清窍、肝、脾、肾"], ["病机", "本虚：肝肾亏虚，气血不足，髓海不足，清窍失养，标实：风、火、痰、瘀，扰乱清窍，本虚标实，以虚证居多"], ["治则", "补虚泻实，调整阴阳"], ["首辨", "辨相关脏腑；辨虚实标本；辨缓急轻重"], ["概念", "眩晕是以头晕、目眩为主症的疾病"], ["病因", "情志不遂；年老体虚；饮食不节；久病劳倦；跌仆坠损"], ["病理因素", "主要有风、火、痰、瘀、虚"], ["病理性质", "本虚标实，临床上以虚证居多"], ["治则", "眩晕的治疗原则是补虚泻实，调整阴阳"], ["治疗要点", "虚证：补益气血、滋养肝肾、填精益髓；实证：潜阳息风、清肝泻火、化痰祛瘀"], ["转归", "眩晕频作的中老年患者多有罹患中风的可能"]], "vs": [{"t": "肝阳上亢、痰湿中阻、瘀血阻窍", "p": "实证眩晕看兼症：遇郁怒加重、颜面潮红、肢麻震颤是肝阳上亢；头重如蒙、呕吐痰涎是痰湿中阻；头痛有定处、面唇紫暗是瘀血阻窍。", "x": false, "k": [["肝阳上亢", ["郁怒", "潮红", "肢麻震颤"]], ["痰湿中阻", ["头重如", "痰涎", "多寐"]], ["瘀血阻窍", ["定处", "紫暗", "瘀斑"]]]}, {"t": "气血亏虚、肾精不足", "p": "两种虚证：动则加剧、唇甲不华、发色不泽是气血亏虚；精神萎靡、两目干涩、五心烦热是肾精不足。", "x": false, "k": [["气血亏虚", ["动则加剧", "唇甲不华", "发色不泽"]], ["肾精不足", ["精神萎靡", "两目干涩", "五心烦热"]]]}, {"t": "肝阳上亢、肾精不足", "p": "都可耳鸣、多梦、舌红：头目胀痛、遇郁怒加重、颜面潮红是肝阳上亢（实）；精神萎靡、五心烦热、舌红少苔、脉细数是肾精不足（虚）。", "x": false, "k": [["肝阳上亢", ["头目胀痛", "郁怒", "潮红", "肢麻震颤"]], ["肾精不足", ["精神萎靡", "五心烦热", "少苔", "脉细数"]]]}, {"t": "痰湿中阻（眩晕、胃痞）", "p": "眩晕用半夏白术天麻汤，化痰祛湿、健脾和胃；胃痞用平胃散合二陈汤，除湿化痰、理气和中以消痞。", "x": true, "k": [["眩晕·痰湿中阻", ["头重如蒙", "视物旋转"]], ["胃痞·痰湿中阻", ["脘腹痞塞", "口淡不渴"]]]}, {"t": "气血亏虚（眩晕、颤证）", "p": "眩晕用归脾汤，补益气血、调养心脾；颤证用人参养荣汤，益气养血以濡养筋脉。", "x": true, "k": [["眩晕·气血亏虚", ["劳累即发", "唇甲不华"]], ["颤证·气血亏虚", ["头摇肢颤", "表情淡漠"]]]}, {"t": "头痛肝阳头痛、眩晕肝阳上亢、中风风阳上扰", "p": "三证都用天麻钩藤饮，看主诉：以头痛为主、头胀痛而眩是头痛；以眩晕为主、遇郁怒加重是眩晕；有半身不遂、口舌歪斜是中风。", "x": true, "k": [["头痛·肝阳头痛", ["而眩", "胁痛", "口苦面红"]], ["眩晕·肝阳上亢", ["郁怒", "肢麻震颤", "甚则仆倒"]], ["中风·风阳上扰", ["半身不遂", "口舌歪斜", "手足重滞"]]]}]}, "06-03": {"img": "img/06-03.png", "head": "<section id=\"06-03\"><h2>中风 <small>脑系<\/small><\/h2><p class=\"h\">老师：方；B 型 代表方<\/p><p class=\"m\"><b>病机<\/b> 阴阳失调，气血逆乱，上犯于脑　<b>治则<\/b> 急性期治标祛邪，中脏腑醒神开窍，闭证清热开窍或化痰开窍，脱证回阳固脱，内闭外脱醒神开窍与扶正固本兼用，恢复期扶正祛邪，标本兼顾<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>风痰入络<\/b><br><small>风痰阻络<\/small><\/td><td>息风化痰，活血通络<\/td><td class=\"f\">半夏白术天麻汤、桃仁红花煎<\/td><td>舌暗淡、苔白腻、脉弦滑<\/td><td class=\"k\">口角流涎<\/td><\/tr><tr><td><b>风阳上扰<\/b><\/td><td>清肝泻火，息风潜阳<\/td><td class=\"f\">天麻钩藤饮<\/td><td>舌红、舌红绛、苔薄黄、脉弦有力<\/td><td class=\"k\">手足重滞<\/td><\/tr><tr><td><b>阴虚风动<\/b><\/td><td>滋养肝肾，潜阳息风<\/td><td class=\"f\">镇肝息风汤<\/td><td>舌红绛、舌暗红、苔少、苔无、脉细弦、脉细弦数<\/td><td class=\"k\">多梦、双目干涩<\/td><\/tr><tr><td><b>痰热腑实<\/b><\/td><td>通腑泄热，息风化痰<\/td><td class=\"f\">桃仁承气汤<\/td><td>舌暗红、苔黄腻、脉弦滑、脉弦涩<\/td><td class=\"k\">咳黏稠痰<\/td><\/tr><tr><td><b>痰火瘀闭<\/b><br><small>阳闭<\/small><\/td><td>息风清火，豁痰开窍<\/td><td class=\"f\">羚角钩藤汤、至宝丹、安宫牛黄丸<\/td><td>苔黄腻、脉弦滑数<\/td><td class=\"k\">身热、气粗、躁扰<\/td><\/tr><tr><td><b>痰浊瘀闭<\/b><br><small>阴闭<\/small><\/td><td>化痰息风，宣郁开窍<\/td><td class=\"f\">涤痰汤、苏合香丸<\/td><td>苔白腻、脉沉滑缓<\/td><td class=\"k\">静卧不烦、面白唇暗<\/td><\/tr><tr><td><b>脱证<\/b><\/td><td>回阳救逆，益气固脱<\/td><td class=\"f\">参附汤、生脉散<\/td><td>舌痿、脉细弱、脉微欲绝<\/td><td class=\"k\">目合口张、自遗、手撒<\/td><\/tr><tr><td><b>风痰瘀阻<\/b><\/td><td>搜风化痰，行瘀通络<\/td><td class=\"f\">解语丹<\/td><td>舌紫暗、舌有瘀斑、苔滑腻、脉弦滑、脉涩<\/td><td class=\"k\">舌喑<\/td><\/tr><tr><td><b>气虚血瘀<\/b><br><small>气虚络瘀<\/small><\/td><td>益气扶正，益气养血，化瘀通络<\/td><td class=\"f\">补阳还五汤<\/td><td>舌淡紫、舌有瘀斑、苔薄白、脉细涩、脉细弱<\/td><td class=\"k\">肢软无力、气短乏力<\/td><\/tr><tr><td><b>肝肾亏虚<\/b><\/td><td>滋养肝肾<\/td><td class=\"f\">左归丸、地黄饮子<\/td><td>舌红、舌淡红、脉细、脉沉细<\/td><td class=\"k\">拘挛变形、僵硬<\/td><\/tr><\/table>", "card": [["定病", "半身不遂、口舌歪斜、猝然昏仆、不省人事、肌肤不仁"], ["病位", "脑、心、肝、脾、肾"], ["病机", "阴阳失调，气血逆乱，上犯于脑"], ["治则", "急性期治标祛邪，中脏腑醒神开窍，闭证清热开窍或化痰开窍，脱证回阳固脱，内闭外脱醒神开窍与扶正固本兼用，恢复期扶正祛邪，标本兼顾"], ["首辨", "辨中经络与中脏腑；辨闭证与脱证；辨顺势与逆势"], ["概念", "中风是以半身不遂、肌肤不仁、口舌喎斜、言语不利，甚至突然昏仆、不省人事为主症的疾病"], ["病因", "内伤积损；情志过极；饮食不节；劳欲过度；尤以暴怒引发本病者为多见"], ["病理性质", "气血不足或肝肾阴虚是致病之本；风、火、痰、瘀是发病之标；肝阳暴张，阳亢风动，痰火壅盛，气血上逆，神窍闭阻"], ["演变", "又有闭脱之分，闭转脱的演变；阴虚及阳，阴竭阳亡，阴阳离决"], ["特点", "中经络：病位较浅；中脏腑：病位较深"], ["转归", "若神志转清，病情由中脏腑向中经络转化，病势为顺，预后良好"], ["治则", "急性期：治其标，祛邪为主；中脏腑：当以醒神开窍为治则"], ["治疗要点", "闭证：清热开窍或化痰开窍；脱证：回阳固脱；内闭外脱：醒神开窍与扶正固本兼用；恢复期和后遗症期：多为虚实兼夹，当扶正祛邪，标本兼顾"]], "vs": [{"t": "风痰入络、风阳上扰、阴虚风动", "p": "中经络都神清、半身不遂：口角流涎、苔白腻是风痰入络；手足重滞、脉弦有力是风阳上扰；双目干涩、少苔、脉细弦是阴虚风动。", "x": false, "k": [["风痰入络", ["口角流涎", "白腻"]], ["风阳上扰", ["手足重滞", "有力"]], ["阴虚风动", ["双目干涩", "多梦", "脉细弦", "少苔"]]]}, {"t": "痰热腑实、痰火瘀闭、痰浊瘀闭、脱证", "p": "先看神志：神清或欠清、咳黏稠痰是痰热腑实；不省人事、大小便闭是闭（面赤身热躁扰是痰火，静卧不烦是痰浊）；目合口张、二便自遗是脱。", "x": false, "k": [["痰热腑实", ["神志欠清", "咳黏稠痰"]], ["痰火瘀闭", ["身热", "气粗", "躁扰"]], ["痰浊瘀闭", ["静卧不烦", "面白唇暗", "苔白腻"]], ["脱证", ["目合口张", "自遗", "手撒"]]]}, {"t": "风痰瘀阻、气虚血瘀、肝肾亏虚", "p": "恢复期都半身不遂：舌喑不语、伸舌偏斜、苔滑腻是风痰瘀阻；肢软无力、面色萎黄是气虚血瘀；患肢僵硬拘挛变形、肌肉萎缩是肝肾亏虚。", "x": false, "k": [["风痰瘀阻", ["舌喑", "伸舌", "苔滑腻"]], ["气虚血瘀", ["肢软无力", "面色萎黄", "气短乏力"]], ["肝肾亏虚", ["拘挛变形", "僵硬", "肌肉萎缩"]]]}, {"t": "中风、痉证、痿证", "p": "先找半身不遂、口舌歪斜：有是中风；四肢抽搐、项背强直、角弓反张是痉证；起病缓慢、肢体痿软无力或萎缩是痿证。", "x": false, "k": []}, {"t": "气虚血瘀（心衰、中风）", "p": "心衰用保元汤合血府逐瘀汤，益气温阳活血祛瘀；中风用补阳还五汤，益气化瘀通络治偏枯。", "x": true, "k": [["心衰·气虚血瘀", ["喘息不得卧", "口唇发绀"]], ["中风·气虚血瘀", ["偏枯不用", "肢软无力"]]]}, {"t": "头痛肝阳头痛、眩晕肝阳上亢、中风风阳上扰", "p": "三证都用天麻钩藤饮，看主诉：以头痛为主、头胀痛而眩是头痛；以眩晕为主、遇郁怒加重是眩晕；有半身不遂、口舌歪斜是中风。", "x": true, "k": [["头痛·肝阳头痛", ["而眩", "胁痛", "口苦面红"]], ["眩晕·肝阳上亢", ["郁怒", "肢麻震颤", "甚则仆倒"]], ["中风·风阳上扰", ["半身不遂", "口舌歪斜", "手足重滞"]]]}]}, "06-04": {"img": "img/06-04.png", "head": "<section id=\"06-04\"><h2>痴呆 <small>脑系<\/small><\/h2><p class=\"h\">老师：舌脉；方（xx 证的代表方）；B 型 证型<\/p><p class=\"m\"><b>病机<\/b> 髓减脑消，神机失用　<b>治则<\/b> 补虚泻实，平台期重在补肾，波动期重在治痰，下滑期解毒为急<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>髓海不足<\/b><\/td><td>滋补肝肾，填精补髓<\/td><td class=\"f\">七福饮<\/td><td>舌瘦、舌淡、脉沉细<\/td><td class=\"k\">齿枯发焦、步履艰难、忘失前后<\/td><\/tr><tr><td><b>脾肾亏虚<\/b><br><small>脾肾两虚<\/small><\/td><td>温补脾肾，养元安神<\/td><td class=\"f\">还少丹<\/td><td>舌淡、舌胖、舌边有齿痕、苔白、苔腻、脉沉细无力、脉两尺尤甚<\/td><td class=\"k\">夜尿频多、小便混浊、口涎外溢<\/td><\/tr><tr><td><b>气血不足<\/b><\/td><td>益气健脾，养血安神<\/td><td class=\"f\">归脾汤<\/td><td>舌淡、苔白、脉细弱<\/td><td class=\"k\">爪甲苍白、面唇无华、善忘茫然<\/td><\/tr><tr><td><b>痰浊蒙窍<\/b><\/td><td>化痰开窍，健脾醒神<\/td><td class=\"f\">洗心汤<\/td><td>苔浊腻、脉弦滑<\/td><td class=\"k\">洁秽不分、涎沫、口吐痰涎<\/td><\/tr><tr><td><b>瘀阻脑络<\/b><br><small>瘀血内阻<\/small><\/td><td>活血化瘀，通窍醒神<\/td><td class=\"f\">通窍活血汤<\/td><td>舌紫暗、舌有瘀斑、脉细弦、脉沉迟<\/td><td class=\"k\">半身不遂、头痛难愈、瘀斑<\/td><\/tr><tr><td><b>心肝火旺<\/b><\/td><td>清心平肝，安神定志<\/td><td class=\"f\">天麻钩藤饮<\/td><td>舌红、舌红绛、苔黄、苔黄腻、脉弦滑、脉弦数<\/td><td class=\"k\">耳鸣如潮、口臭、妄闻妄见<\/td><\/tr><tr><td><b>热毒内盛<\/b><\/td><td>清热解毒，通络达邪<\/td><td class=\"f\">黄连解毒汤<\/td><td>舌红绛、苔少、苔浊腻、苔腐秽厚积、脉数<\/td><td class=\"k\">迷蒙昏睡、无欲无语、腐秽厚积<\/td><\/tr><\/table>", "card": [["定病", "智能缺损、呆傻愚笨、生活能力下降"], ["病位", "脑、心、肝、脾、肾"], ["病机", "髓减脑消，神机失用"], ["治则", "补虚泻实，平台期重在补肾，波动期重在治痰，下滑期解毒为急"], ["首辨", "识病期；辨虚实"], ["治标", "安神、定志"], ["病理因素", "主要为痰、瘀、火"], ["病理性质", "属本虚标实"], ["演变", "虚实之间可相互转化"], ["病因", "禀赋不足；后天失养；年老肾虚；情志所伤；中风外伤"], ["治则", "补虚泻实；平台期：肾虚为主，重在补肾；波动期：痰浊为主，重在治痰；下滑期：热毒为主，解毒为急；补虚常用补肾填精益髓、健脾补益气血等法以治其本；泻实常用开郁逐痰、活血通窍、平肝泻火等法以治其标"]], "vs": [{"t": "髓海不足、脾肾亏虚、气血不足", "p": "平台期三虚：忘失前后、齿枯发焦、步履艰难是髓海不足；夜尿频多、小便混浊、口涎外溢是脾肾亏虚；面唇无华、爪甲苍白是气血不足。", "x": false, "k": [["髓海不足", ["忘失前后", "齿枯发焦", "步履艰难"]], ["脾肾亏虚", ["夜尿频多", "小便混浊", "口涎外溢"]], ["气血不足", ["爪甲苍白", "面唇无华", "善忘茫然"]]]}, {"t": "痰浊蒙窍、瘀阻脑络、心肝火旺", "p": "波动期三证：口吐痰涎、洁秽不分是痰浊蒙窍；伴半身不遂、头痛难愈、舌有瘀斑是瘀阻脑络；急躁易怒、耳鸣如潮、口臭口疮是心肝火旺。", "x": false, "k": [["痰浊蒙窍", ["洁秽不分", "口吐痰涎", "涎沫"]], ["瘀阻脑络", ["半身不遂", "头痛难愈", "瘀斑"]], ["心肝火旺", ["急躁易怒", "耳鸣如潮", "口臭"]]]}, {"t": "脾肾亏虚、痰浊蒙窍", "p": "都流口水、纳呆，都可见苔白腻：口涎外溢伴四肢不温、夜尿频多是脾肾亏虚；口吐痰涎或口流涎沫，伴洁秽不分、忽歌忽笑是痰浊蒙窍。", "x": false, "k": [["脾肾亏虚", ["口涎外溢", "夜尿频多", "小便混浊", "四肢不温"]], ["痰浊蒙窍", ["口吐痰涎", "涎沫", "洁秽不分", "忽歌忽笑"]]]}, {"t": "痴呆、郁证、癫狂、健忘", "p": "先问有无智能缺失、生活失能：有是痴呆；只是遇事善忘、生活正常是健忘；以抑郁为主是郁证；以沉闷或狂躁等情志失常为主是癫狂。", "x": false, "k": []}, {"t": "髓海不足（痴呆、颤证）", "p": "痴呆用七福饮，滋补肝肾、填精补髓；颤证用龟鹿二仙膏、大定风珠，填精补髓之外加育阴息风。", "x": true, "k": [["痴呆·髓海不足", ["忘失前后", "齿枯发焦"]], ["颤证·髓海不足", ["头摇肢颤", "持物不稳"]]]}, {"t": "瘀阻脑络（痴呆、痫证）", "p": "两病同用通窍活血汤：痴呆取其活血化瘀、通窍醒神，痫证取其活血化瘀、息风通络。", "x": true, "k": [["痴呆·瘀阻脑络", ["反应迟钝", "妄思离奇"]], ["痫证·瘀阻脑络", ["单侧肢体抽搐", "一侧面部抽动"]]]}]}, "06-05": {"img": "img/06-05.png", "head": "<section id=\"06-05\"><h2>癫狂 <small>脑系<\/small><\/h2><p class=\"h\">老师：治法；方 1（重金属 = 重镇）<\/p><p class=\"m\"><b>病机<\/b> 脏腑功能失调，阴阳失于平衡，蒙蔽心窍，心神被扰，神明逆乱　<b>治则<\/b> 调整阴阳，以平为期，理气解郁，泻火豁痰，化瘀通窍，补益心脾，滋阴养血<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>痰气郁结<\/b><\/td><td>疏肝解郁，化痰醒神<\/td><td class=\"f\">逍遥散、涤痰汤<\/td><td>舌红、苔白腻、脉弦滑<\/td><td class=\"k\">时时太息、多疑多虑、苔白腻<\/td><\/tr><tr><td><b>心脾两虚<\/b><\/td><td>健脾养心，解郁安神<\/td><td class=\"f\">养心汤、越鞠丸<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">魂梦颠倒、神思恍惚、善悲欲哭<\/td><\/tr><tr><td><b>痰火扰神<\/b><\/td><td>镇心涤痰，清肝泻火<\/td><td class=\"f\">生铁落饮<\/td><td>舌红绛、苔黄腻、脉弦滑数<\/td><td class=\"k\">骂詈、毁物、怒视<\/td><\/tr><tr><td><b>痰热瘀结<\/b><\/td><td>豁痰化瘀，调畅气血<\/td><td class=\"f\">癫狂梦醒汤<\/td><td>舌紫暗、舌有瘀斑、苔少、苔薄黄而干、脉细弦、脉细涩<\/td><td class=\"k\">面色晦滞、妄思离奇<\/td><\/tr><tr><td><b>火盛阴伤<\/b><br><small>火盛伤阴<\/small><\/td><td>滋阴降火，安神定志<\/td><td class=\"f\">二阴煎、琥珀养心丹<\/td><td>舌红、苔少、苔无、脉细数<\/td><td class=\"k\">时作时止、五心烦热、形瘦面红<\/td><\/tr><\/table>", "card": [["定病", "精神失常、沉默呆钝、静而少动、狂躁刚暴、动而多怒"], ["病位", "脑、肝、心、胆、脾、胃、肾"], ["病机", "脏腑功能失调，阴阳失于平衡，蒙蔽心窍，心神被扰，神明逆乱"], ["治则", "调整阴阳，以平为期，理气解郁，泻火豁痰，化瘀通窍，补益心脾，滋阴养血"], ["首辨", "辨癫与狂；辨虚实；辨轻重"], ["治标", "安神、定志"], ["病理因素", "主要是气、痰、火、瘀，而以气郁为先，继而化火火生痰，日久致瘀；产生气滞、痰结、火郁、血瘀等病理因素"], ["特点", "癫：属阴，起病多缓，发病多有痰气作祟，病位在脑，涉及肝、心、脾；狂：属阳，起病多急，发病多伴痰火之邪，病位在脑，涉及心、肝、胆、胃；火热扰窍，神明错乱而发狂；痰气郁结，蒙蔽脑窍"], ["病理性质", "癫狂发病初期均多为实证"], ["演变", "癫狂二者常相互转化"], ["治则", "癫证与狂证治疗总以调整阴阳为原则，以平为期；初期多以实邪为主，治当理气解郁，泻火豁痰，化瘀通窍；后期以正虚为主，治当补益心脾，滋阴养血，调整阴阳"], ["病因", "禀赋不足；情志所伤；饮食不节；七情内伤、饮食失节、禀赋异常"]], "vs": [{"t": "痰气郁结、心脾两虚", "p": "癫证两型：时时太息、多疑多虑、苔白腻是痰气郁结（实）；神思恍惚、魂梦颠倒、面色苍白、苔薄白是心脾两虚（虚）。", "x": false, "k": [["痰气郁结", ["时时太息", "多疑多虑", "苔白腻", "苔腻而白"]], ["心脾两虚", ["魂梦颠倒", "神思恍惚", "面色苍白"]]]}, {"t": "痰火扰神、痰热瘀结、火盛阴伤", "p": "狂证三型：骂詈、毁物伤人、两目怒视是痰火扰神；面色晦滞、妄见妄闻、妄思离奇、舌紫暗是痰热瘀结；时作时止、五心烦热、形瘦面红是火盛阴伤。", "x": false, "k": [["痰火扰神", ["骂詈", "毁物", "怒视"]], ["痰热瘀结", ["面色晦", "妄思离奇", "妄见妄闻"]], ["火盛阴伤", ["时作时止", "五心烦热", "形瘦面红"]]]}, {"t": "癫证、狂证、痫证", "p": "静还是动：沉默呆钝、静而少动是癫；狂躁刚暴、动而多怒是狂；突然仆倒、口吐涎沫、四肢抽搐、反复发作是痫证。", "x": false, "k": []}, {"t": "心脾两虚（不寐、癫狂、遗精、郁证）", "p": "不寐、遗精、郁证都用归脾汤；癫狂用养心汤合越鞠丸，多了解郁（健脾养心、解郁安神）。", "x": true, "k": [["不寐·心脾两虚", ["不易入睡", "多梦易醒"]], ["癫狂·心脾两虚", ["神思恍惚", "善悲欲哭"]], ["遗精·心脾两虚", ["早泄"]], ["郁证·心脾两虚", ["多思善虑", "心悸胆怯"]]]}, {"t": "痰气郁结（癫狂、郁证）", "p": "癫狂用逍遥散合涤痰汤，疏肝解郁、化痰醒神；郁证用半夏厚朴汤，行气开郁，治咽中如有异物。", "x": true, "k": [["癫狂·痰气郁结", ["喃喃自语", "秽洁不分"]], ["郁证·痰气郁结", ["吞之不下", "咯之不出"]]]}]}, "06-06": {"img": "img/06-06.png", "head": "<section id=\"06-06\"><h2>痫证 <small>脑系<\/small><\/h2><p class=\"h\">老师：抽搐 → 证型；四肢抽搐 → 病<\/p><p class=\"m\"><b>病机<\/b> 气机逆乱，元神失控　<b>治则<\/b> 发作期治标，休止期治本，清泻肝火，豁痰息风，开窍定痫，健脾化痰，滋补肝肾，养心安神<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>阳痫<\/b><\/td><td>开窍醒神，泻热涤痰息风<\/td><td class=\"f\">黄连解毒汤、定痫丸<\/td><td>舌红、苔白腻、苔黄腻、脉弦数、脉弦滑<\/td><td class=\"k\">牙关紧闭、项背强直<\/td><\/tr><tr><td><b>阴痫<\/b><\/td><td>开窍醒神，温化痰涎，顺气定痫<\/td><td class=\"f\">五生饮、二陈汤<\/td><td>舌淡、苔白腻、脉沉细、脉沉迟<\/td><td class=\"k\">半开半合、数秒至数分钟、手足清冷<\/td><\/tr><tr><td><b>肝火痰热<\/b><\/td><td>清肝泻火，化痰宁心<\/td><td class=\"f\">龙胆泻肝汤、涤痰汤<\/td><td>舌红、苔黄腻、脉弦滑数<\/td><td class=\"k\">目赤、咳痰不爽<\/td><\/tr><tr><td><b>脾虚痰盛<\/b><\/td><td>健脾化痰<\/td><td class=\"f\">六君子汤<\/td><td>舌淡、苔白腻、脉濡滑、脉弦细滑<\/td><td class=\"k\">胸脘痞闷、蜷卧拘急、脉濡滑<\/td><\/tr><tr><td><b>肝肾阴虚<\/b><\/td><td>滋养肝肾，填精益髓<\/td><td class=\"f\">大补元煎<\/td><td>舌红、苔薄白、苔薄黄少津、脉沉细数<\/td><td class=\"k\">干涩、腰膝酸软、耳轮焦枯<\/td><\/tr><tr><td><b>瘀阻脑络<\/b><\/td><td>活血化瘀，息风通络<\/td><td class=\"f\">通窍活血汤<\/td><td>舌暗红、舌有瘀斑、苔薄白、脉涩、脉弦<\/td><td class=\"k\">侧肢体抽搐、瘀斑、脉涩<\/td><\/tr><\/table>", "card": [["定病", "口吐涎沫、两目上视、口中怪叫、移时苏醒、醒后一如常人"], ["病位", "脑、心、肝、脾、肾"], ["病机", "气机逆乱，元神失控"], ["治则", "发作期治标，休止期治本，清泻肝火，豁痰息风，开窍定痫，健脾化痰，滋补肝肾，养心安神"], ["首辨", "辨病情轻重；辨病性虚实；辨阳痫阴痫"], ["治标", "开窍、醒神、定痫"], ["病理因素", "涉及风，火、痰，瘀等，其中尤以痰邪作祟最为重要"], ["病理性质", "虚实夹杂；休止期：多虚或虚中夹实"], ["治则", "治疗首当分清标本虚实，轻重缓急；发作期病急：开窍醒神定痫以治其标，治宜清泻肝火，豁痰息风，开窍定痫；休止期病缓：祛邪补虚以治其本，治宜健脾化痰，滋补肝肾，养心安神等"], ["病因", "禀赋异常；情志失调；饮食不节；脑窍损伤"]], "vs": [{"t": "阳痫、肝火痰热", "p": "看病例细写哪一段：发作写得细（牙关紧闭、项背强直）是阳痫；平时写得细（面红目赤、咳痰不爽），发作一笔带过是肝火痰热。", "x": false, "k": [["阳痫", ["牙关紧闭", "项背强直"]], ["肝火痰热", ["目赤", "咳痰不爽"]]]}, {"t": "阴痫、脾虚痰盛", "p": "都神疲纳差便溏、苔白腻：双眼半开半合、数秒至数分钟即醒、脉沉迟是阴痫（发作期）；胸脘痞闷、蜷卧拘急、脉濡滑是脾虚痰盛（休止期）。", "x": false, "k": [["阴痫", ["半开半合", "数秒至数分钟", "脉沉迟"]], ["脾虚痰盛", ["胸脘痞闷", "蜷卧拘急", "脉濡滑"]]]}, {"t": "肝肾阴虚、瘀阻脑络", "p": "休止期都头晕：两目干涩、耳轮焦枯、腰膝酸软、发作日益频繁是肝肾阴虚；痛有定处、单侧肢体抽搐、舌有瘀斑、脉涩是瘀阻脑络。", "x": false, "k": [["肝肾阴虚", ["干涩", "耳轮焦枯", "腰膝酸软", "脉沉细数"]], ["瘀阻脑络", ["侧肢体抽搐", "定处", "瘀斑", "脉涩"]]]}, {"t": "痫证、中风、厥证", "p": "三者都突然仆倒、昏不知人：口吐涎沫、两目上视、四肢抽搐、醒后如常人是痫证；醒后留半身不遂、口舌歪斜是中风；面色苍白、四肢厥冷是厥证。", "x": false, "k": []}, {"t": "瘀阻脑络（痴呆、痫证）", "p": "两病同用通窍活血汤：痴呆取其活血化瘀、通窍醒神，痫证取其活血化瘀、息风通络。", "x": true, "k": [["痴呆·瘀阻脑络", ["反应迟钝", "妄思离奇"]], ["痫证·瘀阻脑络", ["单侧肢体抽搐", "一侧面部抽动"]]]}, {"t": "肝肾阴虚（痫证、鼓胀）", "p": "痫证用大补元煎，滋养肝肾、填精益髓；鼓胀用一贯煎合六味地黄丸，滋肾柔肝并养阴利水。", "x": true, "k": [["痫证·肝肾阴虚", ["痫证频发", "耳轮焦枯"]], ["鼓胀·肝肾阴虚", ["腹大胀满", "青筋暴露"]]]}]}, "07-01": {"img": "img/07-01.png", "head": "<section id=\"07-01\"><h2>胃痛 <small>脾胃<\/small><\/h2><p class=\"h\">老师：治法；主要症状；B 型 方药<\/p><p class=\"m\"><b>病机<\/b> 胃气郁滞，失于和降，不通则痛　<b>治则<\/b> 理气和胃止痛，通则不痛<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>寒邪客胃<\/b><br><small>寒邪犯胃<\/small><\/td><td>温胃散寒，理气止痛<\/td><td class=\"f\">良附丸<\/td><td>苔薄白、脉弦紧<\/td><td class=\"k\">暴作、冷痛、恶寒喜暖<\/td><\/tr><tr><td><b>饮食伤胃<\/b><br><small>宿食积滞<\/small><\/td><td>消食导滞，和中止痛<\/td><td class=\"f\">保和丸<\/td><td>苔厚腻、脉滑<\/td><td class=\"k\">嗳腐吞酸、吐后痛减、腐臭<\/td><\/tr><tr><td><b>肝气犯胃<\/b><\/td><td>疏肝理气，和胃止痛<\/td><td class=\"f\">柴胡疏肝散<\/td><td>苔薄白、脉弦<\/td><td class=\"k\">痛连两胁、连及两胁、叹息<\/td><\/tr><tr><td><b>肝胃郁热<\/b><\/td><td>疏肝泻热，和胃止痛<\/td><td class=\"f\">化肝煎<\/td><td>舌红、苔黄、脉弦、脉数<\/td><td class=\"k\">身体烦热、烦热不安<\/td><\/tr><tr><td><b>湿热中阻<\/b><\/td><td>清化湿热，理气和胃<\/td><td class=\"f\">清中汤<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">苔黄腻、口渴不欲饮、脘痞腹胀<\/td><\/tr><tr><td><b>瘀血停滞<\/b><\/td><td>化瘀通络，理气和胃<\/td><td class=\"f\">失笑散、丹参饮<\/td><td>舌紫暗、舌有瘀斑、脉涩<\/td><td class=\"k\">刺痛、脉涩、痛有定处<\/td><\/tr><tr><td><b>脾胃虚寒<\/b><\/td><td>温中健脾，和胃止痛<\/td><td class=\"f\">黄芪建中汤<\/td><td>舌淡、苔白、脉虚缓无力<\/td><td class=\"k\">空腹痛甚、绵绵不休、喜温喜按<\/td><\/tr><tr><td><b>胃阴不足<\/b><\/td><td>养阴益胃，和中止痛<\/td><td class=\"f\">益胃汤<\/td><td>舌红、舌少津、苔无、脉弦细无力<\/td><td class=\"k\">隐隐灼痛、脉细数、饥不欲食<\/td><\/tr><tr><td><b>热证<\/b><br><small>吐酸热证<\/small><\/td><td>清泻肝火，和胃降逆<\/td><td class=\"f\">左金丸<\/td><td>舌红、苔黄、脉弦数<\/td><td class=\"k\">呛咳<\/td><\/tr><tr><td><b>寒证<\/b><br><small>吐酸寒证<\/small><\/td><td>温中散寒，宽胸下气<\/td><td class=\"f\">香砂六君子汤<\/td><td>舌淡、苔白、脉沉迟<\/td><td class=\"k\">喜唾涎沫<\/td><\/tr><tr><td><b>胃热<\/b><br><small>嘈杂胃热<\/small><\/td><td>清热化痰，降逆和中<\/td><td class=\"f\">黄连温胆汤<\/td><td>舌红、苔黄燥、脉滑数<\/td><td class=\"k\">口渴喜冷、口臭、苔黄干<\/td><\/tr><tr><td><b>胃虚<\/b><br><small>嘈杂胃虚<\/small><\/td><td>益气健脾，调畅气机<\/td><td class=\"f\">四君子汤<\/td><td>舌淡、脉虚<\/td><td class=\"k\">口淡无味、食后脘胀<\/td><\/tr><tr><td><b>血虚<\/b><br><small>嘈杂血虚<\/small><\/td><td>益气养血，健脾和胃<\/td><td class=\"f\">归脾汤<\/td><td>舌淡、脉细弱<\/td><td class=\"k\">面白唇淡、失眠多梦<\/td><\/tr><\/table>", "card": [["定病", "胃脘部近心窝处疼痛、胃脘疼痛、压之可痛"], ["病位", "胃、肝、脾"], ["病机", "胃气郁滞，失于和降，不通则痛"], ["治则", "理气和胃止痛，通则不痛"], ["首辨", "辨虚实；辨寒热；辨气血"], ["治标", "止痛"], ["病理因素", "以气滞为主，并见食积、寒凝、热郁、湿阻、血瘀等"], ["病理性质", "分为虚实两类"], ["病因", "外邪侵袭、饮食不节、情志失调、体虚久病及药物损害；久病体虚；尤以寒邪犯胃为多"], ["演变", "主要是虚实、寒热、气血之间的演变和转化"], ["特点", "初病在气，久病入络；以中青年居多"], ["转归", "便血、呕血；致反胃顽症"], ["治疗要点", "治肝可以安胃；注意忌刚用柔；久痛防恶性病变"], ["概念", "随即咽下称为吞酸，若随即吐出者称为吐酸；嘈杂是以胃中空虚，似饥非饥，似辣非辣"]], "vs": [{"t": "寒邪客胃、脾胃虚寒", "p": "先看痛势：暴作、拘急冷痛、脉弦紧是寒邪客胃（实寒）；胃痛隐隐、绵绵不休、空腹痛甚、喜温喜按是脾胃虚寒（虚寒）。", "x": false, "k": [["寒邪客胃", ["暴作", "冷痛", "恶寒喜暖", "脉弦紧"]], ["脾胃虚寒", ["胃痛隐隐", "绵绵不休", "空腹", "喜温喜按"]]]}, {"t": "饮食伤胃、肝气犯胃", "p": "都胀满作痛、得矢气稍舒：嗳腐吞酸、其味腐臭、吐后痛减是饮食伤胃；痛连两胁、遇烦恼加重、喜长叹息是肝气犯胃。", "x": false, "k": [["饮食伤胃", ["嗳腐吞酸", "腐臭", "吐后痛减"]], ["肝气犯胃", ["两胁", "叹息", "遇烦恼"]]]}, {"t": "肝气犯胃、肝胃郁热、湿热中阻、胃阴不足", "p": "先分胀与灼：胀痛、苔薄白是肝气犯胃；灼痛兼易怒口苦是肝胃郁热；灼痛兼渴不欲饮、苔黄腻是湿热中阻；隐隐灼痛、饥不欲食、舌红少津是胃阴不足。", "x": false, "k": [["肝气犯胃", ["胀痛", "两胁", "叹息", "苔薄白"]], ["肝胃郁热", ["易怒", "身体烦热", "口苦"]], ["湿热中阻", ["口渴不欲饮", "小便黄", "苔黄腻"]], ["胃阴不足", ["隐隐灼痛", "似饥而不欲食", "饥不欲食", "少津"]]]}, {"t": "胃痛、真心痛、胁痛", "p": "先看痛的部位：胃脘近心窝处痛是胃痛；胸膺部剧痛、痛引肩背、汗出肢冷是真心痛；胁肋部痛、厌食油腻是胁痛。", "x": false, "k": []}, {"t": "肝气犯胃（胃痛、呕吐）", "p": "胃痛用柴胡疏肝散，疏肝理气止痛；呕吐用半夏厚朴汤、左金丸，疏肝和胃降逆止呕。", "x": true, "k": [["胃痛·肝气犯胃", ["攻撑窜动", "矢气则痛舒"]], ["呕吐·肝气犯胃", ["呕吐吞酸", "嗳气频频"]]]}, {"t": "湿热中阻（胃痛、泄泻）", "p": "胃痛用清中汤，清化湿热、理气和胃止痛；泄泻用葛根芩连汤，清热利湿以止泻。", "x": true, "k": [["胃痛·湿热中阻", ["胃脘灼痛", "吐酸嘈杂"]], ["泄泻·湿热中阻", ["泻下急迫", "肛门灼热"]]]}, {"t": "脾胃虚寒（胃痛、呕吐、噎膈、血证）", "p": "胃痛黄芪建中汤，建中止痛；呕吐理中丸，温中止呕；噎膈丁香透膈汤，温中降逆；血证黄土汤，温中止血。", "x": true, "k": [["胃痛·脾胃虚寒", ["喜温喜按", "绵绵不休"]], ["呕吐·脾胃虚寒", ["饮食稍有不慎", "时发时止"]], ["噎膈·脾胃虚寒", ["朝食暮吐", "宿谷不化"]], ["血证·脾胃虚寒", ["便血紫黯", "黑如柏油"]]]}, {"t": "胃阴不足（胃痛、胃痞、呕吐、呃逆）", "p": "胃痛、胃痞用益胃汤养阴益胃；呕吐用麦门冬汤，滋养胃阴降逆止呕；呃逆用益胃汤合橘皮竹茹汤，降逆止呃。", "x": true, "k": [["胃痛·胃阴不足", ["隐隐灼痛", "光剥无苔"]], ["胃痞·胃阴不足", ["脘腹痞闷", "恶心嗳气"]], ["呕吐·胃阴不足", ["呕吐反复发作", "时作干呕"]], ["呃逆·胃阴不足", ["呃声短促", "食后饱胀"]]]}, {"t": "胃痛肝气犯胃、胃痞肝胃不和、呕吐肝气犯胃", "p": "主症定病：胃脘胀痛、痛连两胁是胃痛（柴胡疏肝散）；脘腹痞满不痛是胃痞（越鞠丸合枳术丸）；呕吐吞酸是呕吐（半夏厚朴汤合左金丸）。", "x": true, "k": [["胃痛·肝气犯胃", ["胃脘胀痛", "痛连两胁", "矢气则痛舒"]], ["胃痞·肝胃不和", ["脘腹痞闷", "吐苦水", "胸胁胀满"]], ["呕吐·肝气犯胃", ["呕吐吞酸", "干呕", "脘胁胀痛"]]]}, {"t": "脾胃虚寒（胃痛、呕吐、反胃）、噎膈气虚阳微", "p": "都脾胃阳虚：空腹痛甚是胃痛（黄芪建中汤）；饮食稍有不慎即吐是呕吐（理中汤）；朝食暮吐是反胃（丁香透膈汤）；吞咽受阻、面浮足肿是噎膈（补气运脾汤）。", "x": true, "k": [["胃痛·脾胃虚寒", ["空腹痛甚", "绵绵不休", "喜温喜按"]], ["呕吐·脾胃虚寒", ["饮食稍有不慎", "食入难化", "食多则吐"]], ["噎膈·气虚阳微", ["吞咽受阻", "泛吐涎沫", "面浮足肿", "形寒气短"]], ["噎膈·脾胃虚寒", ["朝食暮吐", "宿谷不化", "吐后则舒"]]]}]}, "07-02": {"img": "img/07-02.png", "head": "<section id=\"07-02\"><h2>胃痞 <small>脾胃<\/small><\/h2><p class=\"h\">老师：脾胃 治法；2 方<\/p><p class=\"m\"><b>病机<\/b> 中焦气机不利，脾胃升降失职　<b>治则<\/b> 调理脾胃升降，行气除痞消满，实者泻之，虚者补之，虚实夹杂者补泻并用，用药不可过于峻猛<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>饮食内停<\/b><\/td><td>消食和胃，行气消痞<\/td><td class=\"f\">保和丸<\/td><td>苔厚腻、脉滑<\/td><td class=\"k\">进食尤甚、败卵、嗳腐吞酸<\/td><\/tr><tr><td><b>痰湿中阻<\/b><\/td><td>除湿化痰，理气和中<\/td><td class=\"f\">平胃散、二陈汤<\/td><td>苔白厚腻、脉沉滑<\/td><td class=\"k\">身重困倦、苔白厚腻<\/td><\/tr><tr><td><b>湿热阻胃<\/b><\/td><td>清热化湿，和胃消痞<\/td><td class=\"f\">泻心汤、连朴饮<\/td><td>舌红、苔黄腻、脉滑数<\/td><td class=\"k\">灼热嘈杂、苔黄腻<\/td><\/tr><tr><td><b>肝胃不和<\/b><\/td><td>疏肝解郁，和胃消痞<\/td><td class=\"f\">越鞠丸、枳术丸<\/td><td>舌淡红、苔薄白、脉弦<\/td><td class=\"k\">太息、易怒、胸胁胀满<\/td><\/tr><tr><td><b>脾胃虚弱<\/b><\/td><td>补气健脾，升清降浊<\/td><td class=\"f\">补中益气汤<\/td><td>舌淡、苔薄白、脉细弱<\/td><td class=\"k\">喜温喜按、纳呆便溏、少气懒言<\/td><\/tr><tr><td><b>胃阴不足<\/b><\/td><td>养阴益胃，调中消痞<\/td><td class=\"f\">益胃汤<\/td><td>舌红、苔少、脉细数<\/td><td class=\"k\">饥不欲食、口燥咽干、舌红少苔<\/td><\/tr><\/table>", "card": [["定病", "心下痞塞、触之无形、按之柔软、压之无痛、外无胀形"], ["病位", "胃、肝、脾"], ["病机", "中焦气机不利，脾胃升降失职"], ["治则", "调理脾胃升降，行气除痞消满，实者泻之，虚者补之，虚实夹杂者补泻并用，用药不可过于峻猛"], ["首辨", "辨虚实；辨寒热"], ["治标", "消痞"], ["病因", "饮食不节；情志失调；体虚久病；药毒误治"], ["病理性质", "有虚实之分；初期多为实证"], ["演变", "实痞日久，可致虚痞；每见虚实互兼、寒热夹杂"], ["转归", "转为胃痛、虚劳"], ["治疗要点", "补虚：重在健脾益气，或养阴益胃；重视脾升胃降；注重温清并用，补泻同施"]], "vs": [{"t": "饮食内停、肝胃不和", "p": "都是实痞：进食尤甚、嗳腐吞酸、矢气臭如败卵是饮食内停；胸胁胀满、心烦易怒、善太息、吐苦水是肝胃不和。", "x": false, "k": [["饮食内停", ["进食尤甚", "嗳腐吞酸", "败卵"]], ["肝胃不和", ["胸胁胀满", "易怒", "太息", "苦水"]]]}, {"t": "痰湿中阻、湿热阻胃", "p": "都是湿阻实痞，先分寒热：身重困倦、头昏、舌淡苔白厚腻属痰湿中阻；灼热嘈杂、大便黏滞、舌红苔黄腻、脉滑数属湿热阻胃。", "x": false, "k": [["痰湿中阻", ["身重困倦", "头昏", "白厚腻", "舌淡苔腻"]], ["湿热阻胃", ["灼热嘈杂", "黏滞", "脉滑数"]]]}, {"t": "脾胃虚弱、胃阴不足", "p": "都是虚痞：喜温喜按、纳呆便溏、舌淡脉细弱是脾胃虚弱；饥不欲食、口燥咽干、大便秘结、舌红苔少脉细数是胃阴不足。", "x": false, "k": [["脾胃虚弱", ["喜温喜按", "纳呆便溏", "脉细弱"]], ["胃阴不足", ["饥不欲食", "口燥咽干", "苔少", "脉细数"]]]}, {"t": "胃痞、胃痛、鼓胀", "p": "都有脘腹胀满不适：只觉痞塞、按之柔软、压之无痛、外无胀形是胃痞；以痛为主、压之可痛是胃痛；腹部胀大如鼓、青筋暴露是鼓胀。", "x": false, "k": []}, {"t": "痰湿中阻（眩晕、胃痞）", "p": "眩晕用半夏白术天麻汤，化痰祛湿、健脾和胃；胃痞用平胃散合二陈汤，除湿化痰、理气和中以消痞。", "x": true, "k": [["眩晕·痰湿中阻", ["头重如蒙", "视物旋转"]], ["胃痞·痰湿中阻", ["脘腹痞塞", "口淡不渴"]]]}, {"t": "胃阴不足（胃痛、胃痞、呕吐、呃逆）", "p": "胃痛、胃痞用益胃汤养阴益胃；呕吐用麦门冬汤，滋养胃阴降逆止呕；呃逆用益胃汤合橘皮竹茹汤，降逆止呃。", "x": true, "k": [["胃痛·胃阴不足", ["隐隐灼痛", "光剥无苔"]], ["胃痞·胃阴不足", ["脘腹痞闷", "恶心嗳气"]], ["呕吐·胃阴不足", ["呕吐反复发作", "时作干呕"]], ["呃逆·胃阴不足", ["呃声短促", "食后饱胀"]]]}, {"t": "脾胃虚弱（胃痞、泄泻、痿证）", "p": "泄泻用参苓白术散，健脾化湿止泻；胃痞用补中益气汤，升清降浊消痞；痿证二方并用，补中益气、健脾升清。", "x": true, "k": [["胃痞·脾胃虚弱", ["脘腹满闷", "语声低微"]], ["泄泻·脾胃虚弱", ["大便时溏时泻", "稍进油腻"]], ["痿证·脾胃虚弱", ["肌肉萎缩", "起病缓慢"]]]}, {"t": "胃痛肝气犯胃、胃痞肝胃不和、呕吐肝气犯胃", "p": "主症定病：胃脘胀痛、痛连两胁是胃痛（柴胡疏肝散）；脘腹痞满不痛是胃痞（越鞠丸合枳术丸）；呕吐吞酸是呕吐（半夏厚朴汤合左金丸）。", "x": true, "k": [["胃痛·肝气犯胃", ["胃脘胀痛", "痛连两胁", "矢气则痛舒"]], ["胃痞·肝胃不和", ["脘腹痞闷", "吐苦水", "胸胁胀满"]], ["呕吐·肝气犯胃", ["呕吐吞酸", "干呕", "脘胁胀痛"]]]}, {"t": "胃痞胃阴不足、呕吐胃阴不足、噎膈津亏热结", "p": "都阴虚、舌红脉细数：吞咽梗涩而痛、大便如羊粪是噎膈（沙参麦冬汤）；呕吐反复、时作干呕是呕吐（麦门冬汤）；只脘腹痞闷不吐是胃痞（益胃汤）。", "x": true, "k": [["胃痞·胃阴不足", ["脘腹痞闷", "嗳气"]], ["呕吐·胃阴不足", ["呕吐反复发作", "干呕", "似饥而不欲食"]], ["噎膈·津亏热结", ["吞咽梗涩而痛", "羊粪", "舌质光红"]]]}]}, "07-03": {"img": "img/07-03.png", "head": "<section id=\"07-03\"><h2>呕吐 <small>脾胃<\/small><\/h2><p class=\"h\">老师：治法；方；证型（脉细数）<\/p><p class=\"m\"><b>病机<\/b> 胃失和降，胃气上逆　<b>治则<\/b> 和胃降逆，实者祛邪，虚者扶正，虚实夹杂者标本兼顾<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>外邪犯胃<\/b><\/td><td>疏邪解表，化浊和中，降逆止呕<\/td><td class=\"f\">藿香正气散<\/td><td>苔白腻、脉濡<\/td><td class=\"k\">头身疼痛<\/td><\/tr><tr><td><b>饮食停滞<\/b><br><small>宿食留胃、饮食积滞<\/small><\/td><td>消食化滞，和胃降逆<\/td><td class=\"f\">保和丸<\/td><td>苔厚腻、脉滑实<\/td><td class=\"k\">酸腐、厌食、臭秽<\/td><\/tr><tr><td><b>痰饮内阻<\/b><\/td><td>温化痰饮，和胃降逆<\/td><td class=\"f\">小半夏汤、苓桂术甘汤<\/td><td>苔白滑、苔腻、脉沉弦滑<\/td><td class=\"k\">清水痰涎、如囊裹水<\/td><\/tr><tr><td><b>肝气犯胃<\/b><\/td><td>疏肝和胃，降逆止呕<\/td><td class=\"f\">半夏厚朴汤、左金丸<\/td><td>舌边红、苔薄腻、苔微黄、脉弦<\/td><td class=\"k\">脘胁胀痛、情志、呕吐吞酸<\/td><\/tr><tr><td><b>脾胃虚寒<\/b><\/td><td>温中健脾，和胃降逆<\/td><td class=\"f\">理中丸<\/td><td>舌淡、脉濡弱<\/td><td class=\"k\">食入难化、四肢不温<\/td><\/tr><tr><td><b>胃阴不足<\/b><br><small>胃阴亏虚<\/small><\/td><td>滋养胃阴，降逆止呕<\/td><td class=\"f\">麦门冬汤<\/td><td>舌红、舌少津、苔少、脉细数<\/td><td class=\"k\">似饥而不欲食、少津<\/td><\/tr><\/table>", "card": [["定病", "胃内容物由口中吐出、吐无定时、进食顺畅"], ["病位", "胃、肝、脾"], ["病机", "胃失和降，胃气上逆"], ["治则", "和胃降逆，实者祛邪，虚者扶正，虚实夹杂者标本兼顾"], ["首辨", "辨虚实；辨呕吐特点"], ["治标", "止呕"], ["概念", "呕吐是以胃内容物由口中吐出为主症的疾病"], ["病因", "外邪犯胃；饮食不节；情志失调；脾胃虚弱"], ["病理性质", "有虚实之分"], ["演变", "虚实可以相互转化与兼杂"], ["治则", "呕吐以和胃降逆止呕为基本治法；治宜袪邪为主，分采用解表、消食、化痰、理气之法；健脾益气、温中散寒、养阴和胃等法"], ["治疗要点", "不论何种治法，皆应配合和胃降逆药物；呕吐药忌用苦寒、滑腻或性味重浊等容易伤胃、碍胃之品"]], "vs": [{"t": "饮食停滞、痰饮内阻、肝气犯胃", "p": "先看吐出物：酸腐量多、气味难闻是饮食停滞；清水痰涎、胃部如囊裹水是痰饮内阻；吞酸且脘胁胀痛、遇情志加重是肝气犯胃。", "x": false, "k": [["饮食停滞", ["酸腐", "臭秽", "厌食", "脉滑实"]], ["痰饮内阻", ["清水痰涎", "如囊裹水", "心悸", "脉沉弦滑"]], ["肝气犯胃", ["呕吐吞酸", "脘胁胀痛", "情志", "舌边红"]]]}, {"t": "痰饮内阻、脾胃虚寒", "p": "都与中阳不足有关、都胸脘痞闷：吐清水痰涎、胃部如囊裹水是痰饮内阻；饮食稍有不慎即吐、食入难化、四肢不温是脾胃虚寒。", "x": false, "k": [["痰饮内阻", ["清水痰涎", "如囊裹水", "脉沉弦滑"]], ["脾胃虚寒", ["食入难化", "四肢不温", "面色㿠白", "食多则吐"]]]}, {"t": "肝气犯胃、胃阴不足", "p": "都可干呕：呕吐吞酸、脘胁胀痛、遇情志加重、舌边红是肝气犯胃；反复发作、似饥而不欲食、舌红少津、脉细数是胃阴不足。", "x": false, "k": [["肝气犯胃", ["呕吐吞酸", "脘胁胀痛", "情志", "舌边红"]], ["胃阴不足", ["似饥而不欲食", "少津", "苔少", "脉细数"]]]}, {"t": "呕吐、反胃、噎膈", "p": "先看能否咽下、何时吐：进食顺畅、吐无定时是呕吐；咽得下但朝食暮吐、宿食不化是反胃；吞咽受阻、食入即吐、进行性加重是噎膈。", "x": false, "k": []}, {"t": "肝气犯胃（胃痛、呕吐）", "p": "胃痛用柴胡疏肝散，疏肝理气止痛；呕吐用半夏厚朴汤、左金丸，疏肝和胃降逆止呕。", "x": true, "k": [["胃痛·肝气犯胃", ["攻撑窜动", "矢气则痛舒"]], ["呕吐·肝气犯胃", ["呕吐吞酸", "嗳气频频"]]]}, {"t": "脾胃虚寒（胃痛、呕吐、噎膈、血证）", "p": "胃痛黄芪建中汤，建中止痛；呕吐理中丸，温中止呕；噎膈丁香透膈汤，温中降逆；血证黄土汤，温中止血。", "x": true, "k": [["胃痛·脾胃虚寒", ["喜温喜按", "绵绵不休"]], ["呕吐·脾胃虚寒", ["饮食稍有不慎", "时发时止"]], ["噎膈·脾胃虚寒", ["朝食暮吐", "宿谷不化"]], ["血证·脾胃虚寒", ["便血紫黯", "黑如柏油"]]]}, {"t": "胃阴不足（胃痛、胃痞、呕吐、呃逆）", "p": "胃痛、胃痞用益胃汤养阴益胃；呕吐用麦门冬汤，滋养胃阴降逆止呕；呃逆用益胃汤合橘皮竹茹汤，降逆止呃。", "x": true, "k": [["胃痛·胃阴不足", ["隐隐灼痛", "光剥无苔"]], ["胃痞·胃阴不足", ["脘腹痞闷", "恶心嗳气"]], ["呕吐·胃阴不足", ["呕吐反复发作", "时作干呕"]], ["呃逆·胃阴不足", ["呃声短促", "食后饱胀"]]]}, {"t": "感冒风寒束表、感冒暑湿伤表、呕吐外邪犯胃", "p": "都恶寒发热、头身痛：以呕吐、胸脘满闷为主是呕吐外邪犯胃（藿香正气散）；不吐，恶寒重、流清涕是风寒感冒；汗出不畅、心烦口渴、脉濡数是暑湿感冒（新加香薷饮）。", "x": true, "k": [["感冒·风寒束表", ["恶寒重", "清涕", "脉浮紧"]], ["感冒·暑湿伤表", ["汗出不畅", "心烦口渴", "脉濡数"]], ["呕吐·外邪犯胃", ["频频泛恶", "胸脘满闷"]]]}, {"t": "胃痛肝气犯胃、胃痞肝胃不和、呕吐肝气犯胃", "p": "主症定病：胃脘胀痛、痛连两胁是胃痛（柴胡疏肝散）；脘腹痞满不痛是胃痞（越鞠丸合枳术丸）；呕吐吞酸是呕吐（半夏厚朴汤合左金丸）。", "x": true, "k": [["胃痛·肝气犯胃", ["胃脘胀痛", "痛连两胁", "矢气则痛舒"]], ["胃痞·肝胃不和", ["脘腹痞闷", "吐苦水", "胸胁胀满"]], ["呕吐·肝气犯胃", ["呕吐吞酸", "干呕", "脘胁胀痛"]]]}, {"t": "脾胃虚寒（胃痛、呕吐、反胃）、噎膈气虚阳微", "p": "都脾胃阳虚：空腹痛甚是胃痛（黄芪建中汤）；饮食稍有不慎即吐是呕吐（理中汤）；朝食暮吐是反胃（丁香透膈汤）；吞咽受阻、面浮足肿是噎膈（补气运脾汤）。", "x": true, "k": [["胃痛·脾胃虚寒", ["空腹痛甚", "绵绵不休", "喜温喜按"]], ["呕吐·脾胃虚寒", ["饮食稍有不慎", "食入难化", "食多则吐"]], ["噎膈·气虚阳微", ["吞咽受阻", "泛吐涎沫", "面浮足肿", "形寒气短"]], ["噎膈·脾胃虚寒", ["朝食暮吐", "宿谷不化", "吐后则舒"]]]}, {"t": "胃痞胃阴不足、呕吐胃阴不足、噎膈津亏热结", "p": "都阴虚、舌红脉细数：吞咽梗涩而痛、大便如羊粪是噎膈（沙参麦冬汤）；呕吐反复、时作干呕是呕吐（麦门冬汤）；只脘腹痞闷不吐是胃痞（益胃汤）。", "x": true, "k": [["胃痞·胃阴不足", ["脘腹痞闷", "嗳气"]], ["呕吐·胃阴不足", ["呕吐反复发作", "干呕", "似饥而不欲食"]], ["噎膈·津亏热结", ["吞咽梗涩而痛", "羊粪", "舌质光红"]]]}]}, "07-04": {"img": "img/07-04.png", "head": "<section id=\"07-04\"><h2>噎膈 <small>脾胃<\/small><\/h2><p class=\"h\">老师：（yuge = 噎膈）2 个证 · 方<\/p><p class=\"m\"><b>病机<\/b> 气、痰、瘀交结，阻隔食管、贲门　<b>治则<\/b> 初期治标：理气、化痰、消瘀，后期治本：滋阴润燥，或补气温阳，虚实兼杂标本同治，顾护津液及胃气<\/p>", "table": "<table><tr><th>证型<\/th><th>治法<\/th><th>方<\/th><th>舌 · 脉<\/th><th>秒杀词<\/th><\/tr><tr><td><b>痰气交阻<\/b><\/td><td>开郁化痰，润燥降气<\/td><td class=\"f\">启膈散<\/td><td>舌红、苔薄腻、脉弦滑<\/td><td class=\"k\">情志、脉弦滑<\/td><\/tr><tr><td><b>津亏热结<\/b><\/td><td>滋阴清热，润燥生津<\/td><td class=\"f\">沙参麦冬汤<\/td><td>舌红、苔无、舌有裂纹、舌少津、脉细数<\/td><td class=\"k\">羊粪、细数、梗涩<\/td><\/tr><tr><td><b>瘀血内结<\/b><\/td><td>破结行瘀，滋阴养血<\/td><td class=\"f\">通幽汤<\/td><td>舌紫暗、脉细涩<\/td><td class=\"k\">赤豆汁、肌肤甲错、紫暗<\/td><\/tr><tr><td><b>气虚阳微<\/b><\/td><td>温补脾肾<\/td><td class=\"f\">补气运脾汤<\/td><td>舌淡、苔白、脉细弱<\/td><td class=\"k\">面浮足肿、形寒气短、脉细弱<\/td><\/tr><tr><td><b>脾胃虚寒<\/b><\/td><td>温中健脾，和胃降逆<\/td><td class=\"f\">丁香透膈汤<\/td><td>舌淡、苔白腻、脉细缓无力<\/td><td class=\"k\">朝食暮吐、宿谷不化、吐后则舒<\/td><\/tr><\/table>", "card": [["定病", "吞咽食物哽噎不顺、饮食难下、食而复出、进行性吞咽困难"], ["病位", "食道、胃、肝、脾、肾"], ["病机", "气、痰、瘀交结，阻隔食管、贲门"], ["治则", "初期治标：理气、化痰、消瘀，后期治本：滋阴润燥，或补气温阳，虚实兼杂标本同治，顾护津液及胃气"], ["首辨", "辨病性的虚实；辨病理的属性"], ["概念", "噎膈是以吞咽食物哽噎不顺，饮食难下，或食而复出为主症的疾病"], ["病因", "饮食不节；七情所伤；七情内伤、酒食不节、久病年老；饮食不当，饥饱无常，或嗜食生冷，损及脾阳，或忧愁思虑，有伤脾胃"], ["病理性质", "主要有虚实两方面，常为本虚标实之证"], ["演变", "痰气交阻于食管、贲门为主，病情较轻，多属实证；阴津日益枯槁，胃腑失其濡养，或阴损及阳，脾肾阳气衰败"], ["治则", "以标实为主，重在治标，宜理气、化痰、消瘀；以正虚为主，重在治本，宜滋阴润燥，或补气温阳；病机复杂，虚实每多兼杂，则当标本同治；温中健脾，降逆和胃"], ["治疗要点", "时刻以顾护津液及胃气为中心"], ["特点", "气、痰、瘀交结，阻隔于食道、贲门，耗伤津气，胃失通降"]], "vs": [{"t": "痰气交阻、津亏热结、瘀血内结", "p": "痰气交阻也口干便秘，但随情志加重、脉弦滑；津亏热结便如羊粪、五心烦热、脉细数；瘀血内结吐物如赤豆汁、肌肤甲错、舌紫暗。", "x": false, "k": [["痰气交阻", ["情志", "情绪", "苔薄腻", "脉弦滑"]], ["津亏热结", ["梗涩", "五心烦热", "羊粪", "细数"]], ["瘀血内结", ["赤豆汁", "肌肤甲错", "固定不移", "紫暗"]]]}, {"t": "气虚阳微、脾胃虚寒（反胃）", "p": "先问能否咽下：吞咽受阻、饮食不下、面浮足肿、形寒气短是噎膈气虚阳微；咽得下却朝食暮吐、宿谷不化、吐后则舒是反胃。", "x": false, "k": [["气虚阳微", ["吞咽受阻", "面浮足肿", "形寒气短", "脉细弱"]], ["脾胃虚寒", ["朝食暮吐", "宿谷不化", "吐后则舒", "脉细缓"]]]}, {"t": "噎膈、反胃、梅核气", "p": "先问能不能咽下：吞咽困难、食不能下是噎膈；咽得下却朝食暮吐、吐尽方舒是反胃；只觉咽中有异物、吃饭顺利是梅核气。", "x": false, "k": []}, {"t": "脾胃虚寒（胃痛、呕吐、噎膈、血证）", "p": "胃痛黄芪建中汤，建中止痛；呕吐理中丸，温中止呕；噎膈丁香透膈汤，温中降逆；血证黄土汤，温中止血。", "x": true, "k": [["胃痛·脾胃虚寒", ["喜温喜按", "绵绵不休"]], ["呕吐·脾胃虚寒", ["饮食稍有不慎", "时发时止"]], ["噎膈·脾胃虚寒", ["朝食暮吐", "宿谷不化"]], ["血证·脾胃虚寒", ["便血紫黯", "黑如柏油"]]]}, {"t": "瘀血内结（噎膈、积聚）", "p": "噎膈用通幽汤，破结行瘀并滋阴养血，顾护津液；积聚用膈下逐瘀汤，祛瘀软坚兼健脾益气。", "x": true, "k": [["噎膈·瘀血内结", ["饮食梗阻难下", "赤豆汁"]], ["积聚·瘀血内结", ["腹部积块", "血痣赤缕"]]]}, {"t": "脾胃虚寒（胃痛、呕吐、反胃）、噎膈气虚阳微", "p": "都脾胃阳虚：空腹痛甚是胃痛（黄芪建中汤）；饮食稍有不慎即吐是呕吐（理中汤）；朝食暮吐是反胃（丁香透膈汤）；吞咽受阻、面浮足肿是噎膈（补气运脾汤）。", "x": true, "k": [["胃痛·脾胃虚寒", ["空腹痛甚", "绵绵不休", "喜温喜按"]], ["呕吐·脾胃虚寒", ["饮食稍有不慎", "食入难化", "食多则吐"]], ["噎膈·气虚阳微", ["吞咽受阻", "泛吐涎沫", "面浮足肿", "形寒气短"]], ["噎膈·脾胃虚寒", ["朝食暮吐", "宿谷不化", "吐后则舒"]]]}, {"t": "胃痞胃阴不足、呕吐胃阴不足、噎膈津亏热结", "p": "都阴虚、舌红脉细数：吞咽梗涩而痛、大便如羊粪是噎膈（沙参麦冬汤）；呕吐反复、时作干呕是呕吐（麦门冬汤）；只脘腹痞闷不吐是胃痞（益胃汤）。", "x": true, "k": [["胃痞·胃阴不足", ["脘腹痞闷", "嗳气"]], ["呕吐·胃阴不足", ["呕吐反复发作", "干呕", "似饥而不欲食"]], ["噎膈·津亏热结", ["吞咽梗涩而痛", "羊粪", "舌质光红"]]]}]}}}, K="neike-drill-v1", PASS=.8, NCH=10, NMOCK=20;
let S; try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){S={}}
S.st=S.st||{};S.ch=S.ch||{};S.mock=S.mock||[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s), app=$("#app"), esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=c=>D.names[c]||"作业其它", pct=x=>Math.round(x*100)+"%";
const last=c=>{const h=S.ch[c];return h&&h.length?h[h.length-1]:null}, ok=c=>last(c)>=PASS;
const nextCh=()=>D.order.find(c=>!ok(c));
function pick(pool,n){
  const sc=q=>{const s=S.st[q.id];let v=!s?1:s[2]?0:2+s[0];if(q.hw)v-=1;return v+Math.random()*.9};
  return pool.map(q=>[sc(q),q]).sort((a,b)=>a[0]-b[0]).slice(0,n).map(x=>x[1]);
}
// B型: questions under one shared A–E list (bg) stay together, the list printed once
const BG={};D.qs.forEach(q=>{if(q.bg)(BG[q.bg]=BG[q.bg]||[]).push(q)});
const expand=l=>{const seen=new Set(),out=[];for(const q of l)for(const x of q.bg?BG[q.bg]:[q])if(!seen.has(x.id)){seen.add(x.id);out.push(x)}return out};
const adj=l=>{const ids=new Set(l.map(q=>q.id));return expand(l).filter(q=>ids.has(q.id))};
const grpAt=i=>{const q=R.list[i];if(!q.bg)return [i];let j=i;const g=[];while(j<R.list.length&&R.list[j].bg===q.bg)g.push(j++);return g};
