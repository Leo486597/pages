<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60 万入场向导</title>
<style>
:root{
  color-scheme:light;
  --bg:#F5F6F2; --panel:#FFFFFF; --ink:#1B2421; --ink2:#5E6A66; --ink3:#8C9793; --line:#E0E4DF; --line2:#CDD3CE;
  --grid:#EEF0EA; --accent:#1B2421; --good:#0ca30c; --warn:#b26a00; --bad:#c22f2f;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC",Georgia,serif;
  --sans:-apple-system,"PingFang SC","Helvetica Neue","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --bg:#171917; --panel:#1F2220; --ink:#F1F3EE; --ink2:#B9C1BC; --ink3:#7F8984; --line:#2E332F; --line2:#3D443F; --grid:#232725; --accent:#F1F3EE;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#171917; --panel:#1F2220; --ink:#F1F3EE; --ink2:#B9C1BC; --ink3:#7F8984; --line:#2E332F; --line2:#3D443F; --grid:#232725; --accent:#F1F3EE; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans)}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0}
h1{font-size:32px;line-height:1.2}
h2{font-size:22px;margin-bottom:4px}
h3{font-size:15px;margin:14px 0 6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 100px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.sub{color:var(--ink2);max-width:720px;margin-top:8px}
/* summary strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.strip .k{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.strip .l{font-size:11px;color:var(--ink3)}
.strip .v{font-family:var(--mono);font-size:17px;font-weight:600}
/* stepper */
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin:8px 0 22px;position:relative}
.rail::before{content:"";position:absolute;left:7%;right:7%;top:15px;height:2px;background:var(--line2)}
.rail button{position:relative;background:transparent;border:0;font:inherit;color:var(--ink3);cursor:pointer;padding:0 4px;text-align:center}
.rail button .n{width:30px;height:30px;border-radius:50%;background:var(--panel);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink3);position:relative;z-index:1}
.rail button.done .n{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.rail button.cur .n{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent)}
.rail button.cur{color:var(--ink);font-weight:600}
.rail button:disabled{cursor:not-allowed;opacity:.5}
.rail button .t{font-size:12px;line-height:1.3}
.rail button:focus-visible .n{outline:2px solid var(--s1);outline-offset:2px}
@media (max-width:760px){.rail button .t{display:none}}
/* card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:16px}
.lead{font-family:var(--serif);font-size:17px;line-height:1.7;color:var(--ink);border-left:3px solid var(--accent);padding-left:14px;margin:8px 0 18px}
.lead b{font-family:var(--mono);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.field{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:0}
.field.wide{grid-template-columns:1fr}
.field label{color:var(--ink2);font-size:13px}
.field label small{display:block;color:var(--ink3);font-size:11px}
.field input[type=number],.field input[type=month],.field input[type=text],.field select{width:100%;font:inherit;font-family:var(--mono);font-size:13px;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink)}
.field .unit{display:flex;align-items:center;gap:4px}
.field .unit span{color:var(--ink3);font-size:11px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink2);padding:6px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--bg)}
button.primary{border:0;background:var(--accent);color:var(--bg);padding:10px 18px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.nav .hint{margin:0}
.hint{font-size:12px;color:var(--ink3);margin-top:6px}
.warn{font-size:12px;color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--ink2);font-size:12px;white-space:nowrap}
td.num{font-family:var(--mono)}
td.l{text-align:left}
tr.hl td{background:color-mix(in srgb,var(--s1) 8%,transparent)}
tr.done td{color:var(--ink3);text-decoration:line-through}
tr.done td:first-child{text-decoration:none}
.tw{overflow-x:auto}
/* layer bars */
.layers{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:10px 0 6px}
.layers div{display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;min-width:2px}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
/* option cards */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.opt{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--bg);text-align:left;font:inherit;color:var(--ink);position:relative}
.opt.on{border-color:var(--accent);background:var(--panel)}
.opt .t{font-family:var(--serif);font-size:16px;font-weight:700}
.opt .v{font-family:var(--mono);font-size:13px;margin-top:6px;line-height:1.7}
.opt .v b{font-weight:600}
.opt .tag{position:absolute;top:-10px;right:10px;background:var(--accent);color:var(--bg);font-size:11px;padding:1px 8px;border-radius:10px}
.opt .d{font-size:12px;color:var(--ink2);margin-top:6px}
svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{font-family:var(--mono);font-size:11px;fill:var(--ink3)}
.axis line{stroke:var(--line)}
/* progress */
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar div{height:100%;background:var(--accent)}
/* trigger */
.trig{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:820px){.trig{grid-template-columns:1fr}}
.action{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg)}
.action .big{font-family:var(--serif);font-size:20px;font-weight:700;margin:4px 0}
.action .big b{font-family:var(--mono)}
input[type=range]{width:100%;accent-color:var(--ink)}
.rules li{margin:6px 0}
/* contract */
.clause{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.clause input{margin-top:5px;width:16px;height:16px;accent-color:var(--ink)}
.clause span{flex:1}
.sig{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-top:14px}
@media (max-width:640px){.sig{grid-template-columns:1fr}}
.sig label{font-size:12px;color:var(--ink2);display:block}
.sig input[type=text]{width:100%;font:inherit;font-family:var(--serif);font-size:18px;padding:6px 8px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.stamp{display:inline-block;border:2px solid var(--bad);color:var(--bad);border-radius:6px;padding:4px 10px;font-family:var(--serif);font-weight:700;transform:rotate(-4deg);margin-top:8px}
/* checklist */
.chk td:nth-child(2){white-space:nowrap}
.chk td input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink)}
.chk td input[type=number]{width:96px;font-family:var(--mono);font-size:12px;padding:3px 6px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink)}
.foot{color:var(--ink3);font-size:12px;margin-top:22px;line-height:1.7}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:10;display:none;min-width:160px}
.tip .t{font-family:var(--mono);color:var(--ink3);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .r b{font-family:var(--mono);font-weight:600}
@media print{ .rail,.nav,button,.strip{display:none !important} .card{border:0;padding:0} body{background:#fff} }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Case study · Clementi · 入场向导</div>
  <h1>60 万怎么进场：七步走完</h1>
  <div class="sub">上一步的输入决定下一步的数字。每一步做完再往下；进度自动存在这台电脑的浏览器里，关掉再开还在。数学来自同一个引擎（<span class="num">sim/engine.js</span>）。</div>

  <div class="strip" id="strip"></div>
  <div class="rail" id="rail"></div>
  <div id="stage"></div>
  <div class="foot">这不是投资建议，是把 <span class="num">entry-plan.md</span> 变成可以照着点的表。工具名（VWRA / AGGU / ES3 / CLR / SGLN）是「这一类里最便宜、最常见的」代表，可换同类。</div>
</div>
<div class="tip" id="tip"></div>

<script>/* ============================================================
   Clavon case-study — wealth simulator engine (pure JS, no deps)
   Runs in the browser (inlined into simulator.html) and in node
   (node sim/run.js) so numbers in analysis.md come from the same code.
   All money in SGD, nominal. Monthly steps.
   ============================================================ */
(function (root) {
  'use strict';

  /* ---------- 1. Asset library ----------
     mu  = expected nominal annual return (arithmetic, SGD terms, after typical fund TER)
     vol = annual volatility (std dev of annual return)
     These are planning assumptions, editable in the UI. Sources / reasoning in analysis.md §5.
  */
  const ASSETS = [
    { id: 'gEq',  name: '全球股票 ETF',        ticker: 'VWRA / IWDA（爱尔兰注册 UCITS）', mu: 0.070, vol: 0.15, mdd: -0.55, liq: '高（T+2）', group: 'equity',
      intro: '一只基金买下全球 3,000+ 家公司，美股约占六成。长期回报来自全球企业盈利增长 + 股息再投资。是绝大多数被动投资者的核心仓位。',
      risks: '2008 年最大回撤约 -55%，2020 年 3 月一个月 -30%；以美元计价、新元结算有汇率波动；持有期 <10 年可能亏损。',
      how: 'IBKR / Saxo / moomoo 等券商在伦交所（LSE）买入 VWRA（累积型，股息自动再投）。选爱尔兰注册是为了把美股股息预扣税从 30% 降到 15%，且免美国遗产税风险。' },
    { id: 'usEq', name: '美股 S&P 500 ETF',    ticker: 'CSPX / VUAA（爱尔兰 UCITS）', mu: 0.075, vol: 0.16, mdd: -0.57, liq: '高（T+2）', group: 'equity',
      intro: '美国 500 家大公司。过去 100 年名义年化约 10%（美元），但当前估值偏高，多数机构对未来 10 年的预期只有 5–7%。',
      risks: '单一国家集中；科技股权重 30%+；估值均值回归；美元兑新元长期趋弱（1985 年 1 美元=2.2 新元 → 2026 年约 1.28）。',
      how: '同上，LSE 买入 CSPX（累积型）。不要买美国注册的 SPY / VOO：股息税 30% + 遗产税 40%（超过 6 万美元部分）。' },
    { id: 'sgEq', name: '新加坡股票 STI ETF',  ticker: 'ES3 / G3B（SGX）', mu: 0.055, vol: 0.15, mdd: -0.60, liq: '高（T+2）', group: 'equity',
      intro: '海指 30 只蓝筹，银行占一半（DBS/OCBC/UOB）。股息率约 4%，回报主要靠分红，价格本身 20 年几乎横盘。',
      risks: '2008 年 -60%；行业极度集中于银行 + 地产；跟本地房价、本地经济同涨同跌——与自住房是同一个风险源。',
      how: 'SGX 直接买 ES3；新元计价，无汇率风险，股息免税。适合作为「本地」仓位而非核心。' },
    { id: 'emEq', name: '亚洲 / 新兴市场股票',  ticker: 'EIMI / 2800.HK / 3067.HK', mu: 0.070, vol: 0.20, mdd: -0.65, liq: '高', group: 'equity',
      intro: '中国、印度、台湾、韩国等。估值低于美股，波动更大，回报周期性强。',
      risks: '政策与地缘风险；2007–08 年 -65%；十年可能跑输美股（2010–2020 年就是如此）。',
      how: 'LSE 买 EIMI（爱尔兰 UCITS）；港股通道买 2800（盈富）/ 3067（恒生科技）。' },
    { id: 'reit', name: '新加坡 REITs',        ticker: 'CLR（Lion-Phillip S-REIT ETF）/ 个股', mu: 0.055, vol: 0.16, mdd: -0.70, liq: '高', group: 'equity',
      intro: '上市的商场、写字楼、物流仓库、数据中心。股息率 5–6%，是「不用 ABSD 就持有新加坡商业地产」的方式。',
      risks: '对利率极敏感（2022 年加息周期跌 -25%）；2008 年 -70%；本质是带杠杆的地产，不能当债券用。',
      how: 'SGX 买 CLR 或 CapitaLand / Mapletree / Keppel 系 REIT；股息免税，可放 SRS。' },
    { id: 'gBond', name: '全球投资级债券',      ticker: 'AGGU（对冲美元）/ 新元债基', mu: 0.035, vol: 0.05, mdd: -0.15, liq: '高', group: 'bond',
      intro: '全球政府 + 投资级公司债。作用是压低组合波动，在股灾时提供再平衡的弹药。',
      risks: '2022 年加息一年 -15%（史上最差）；利率上行期会亏；未对冲版本有汇率波动。',
      how: 'LSE 买 AGGU（美元对冲，累积）；或 Endowus / 银行买新元计价债基（费率注意 <0.5%）。' },
    { id: 'sgGov', name: '新加坡国债 / SSB / T-bill', ticker: 'MAS 拍卖 / SSB 每月发行', mu: 0.020, vol: 0.01, mdd: -0.02, liq: '高（SSB 一个月内可赎回）', group: 'bond',
      intro: 'AAA 主权信用。2026 年 8 月：6 个月 T-bill 1.56%，SSB 十年平均 2.06%。适合放 1–3 年内要用的钱和应急金。',
      risks: '几乎无信用风险；主要风险是跑不赢通胀（新加坡核心 CPI 长期约 2%）；到期再投资时利率可能更低。',
      how: '任何本地银行网银 → SGS 申购；SSB 每人上限 20 万；可用 CPF OA/SRS 买 T-bill。' },
    { id: 'cash', name: '现金 / 定存 / 货币基金', ticker: '银行 FD / Fullerton SGD Cash Fund', mu: 0.015, vol: 0.003, mdd: 0, liq: '最高', group: 'cash',
      intro: '流动性储备。2026 年新加坡定存利率已回落到 1.5% 附近。',
      risks: '长期确定性地被通胀侵蚀；持有过多现金是「隐性亏损」。',
      how: '3–6 个月生活费 + 已知的大额支出（装修、学费）放这里，其余不要。' },
    { id: 'cpf',  name: 'CPF 特别账户 / 退休账户填补', ticker: 'RSTU / 现金填补 SA/RA', mu: 0.040, vol: 0.0, mdd: 0, liq: '极低（55 岁前锁定）', group: 'cash',
      intro: '政府保证 4% 无风险（2026 年下限延至年底），首 6 万有额外 1%。每人每年前 8,000 新元填补可抵税。',
      risks: '完全不流动：55 岁前拿不出，且 SA 在 55 岁关闭并入 RA；政策可改；上限受全额退休存款（FRS）约束。',
      how: 'CPF 网站 → Top up；夫妻各 8,000/年抵税上限；超出部分不抵税但仍拿 4%。' },
    { id: 'gold', name: '黄金',                ticker: 'GLD / SGLN（伦交所）/ UOB 金账户', mu: 0.040, vol: 0.15, mdd: -0.45, liq: '高', group: 'alt',
      intro: '不生息的储值资产。与股票低相关，在滞胀 / 地缘危机 / 美元贬值时表现好，是组合的「保险」。',
      risks: '1980–1999 年二十年 -45%；没有现金流，长期回报约等于通胀 + 一点；短期波动跟股票差不多。',
      how: 'LSE 买 SGLN（实物黄金 ETC，无 GST）；或 UOB 黄金储蓄账户；实物金条在新加坡免 GST（投资级）。' },
    { id: 'btc',  name: '加密货币（BTC）',      ticker: 'BTC 现货 / IBIT', mu: 0.10, vol: 0.70, mdd: -0.80, liq: '高（24/7）', group: 'alt',
      intro: '高波动投机性资产。历史回报极高但方差极大，2022 年 -77%。只适合用「归零也无所谓」的仓位。',
      risks: '-80% 级别回撤反复出现；监管、交易所倒闭（FTX）、私钥丢失；与股票在危机时高度相关。',
      how: '持牌交易所（新加坡 MAS 牌照：Coinhako / Independent Reserve）或美股 IBIT。仓位建议 ≤5%。' },
  ];

  /* correlation matrix among assets (+ 2 property shocks appended at runtime) */
  const CORR_IDS = ASSETS.map(a => a.id).concat(['propCondo', 'propHdb']);
  const CORR = {
    gEq:   { usEq: 0.95, sgEq: 0.70, emEq: 0.80, reit: 0.60, gBond: 0.15, sgGov: 0.0, cash: 0.0, cpf: 0.0, gold: 0.05, btc: 0.35, propCondo: 0.20, propHdb: 0.10 },
    usEq:  { sgEq: 0.65, emEq: 0.70, reit: 0.55, gBond: 0.15, sgGov: 0.0, cash: 0.0, cpf: 0.0, gold: 0.05, btc: 0.35, propCondo: 0.15, propHdb: 0.10 },
    sgEq:  { emEq: 0.70, reit: 0.75, gBond: 0.10, sgGov: 0.0, cash: 0.0, cpf: 0.0, gold: 0.05, btc: 0.25, propCondo: 0.35, propHdb: 0.25 },
    emEq:  { reit: 0.55, gBond: 0.10, sgGov: 0.0, cash: 0.0, cpf: 0.0, gold: 0.10, btc: 0.30, propCondo: 0.25, propHdb: 0.15 },
    reit:  { gBond: 0.25, sgGov: 0.05, cash: 0.0, cpf: 0.0, gold: 0.05, btc: 0.20, propCondo: 0.40, propHdb: 0.25 },
    gBond: { sgGov: 0.60, cash: 0.20, cpf: 0.0, gold: 0.20, btc: 0.0, propCondo: 0.0, propHdb: 0.0 },
    sgGov: { cash: 0.50, cpf: 0.0, gold: 0.05, btc: 0.0, propCondo: 0.0, propHdb: 0.0 },
    cash:  { cpf: 0.0, gold: 0.0, btc: 0.0, propCondo: 0.0, propHdb: 0.0 },
    cpf:   { gold: 0.0, btc: 0.0, propCondo: 0.0, propHdb: 0.0 },
    gold:  { btc: 0.10, propCondo: 0.0, propHdb: 0.0 },
    btc:   { propCondo: 0.05, propHdb: 0.0 },
    propCondo: { propHdb: 0.75 },

  function corrMatrix(ids) {
    const n = ids.length, m = [];
    for (let i = 0; i < n; i++) { m.push(new Array(n).fill(0)); m[i][i] = 1; }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = ids[i], b = ids[j];
      const v = (CORR[a] && CORR[a][b] !== undefined) ? CORR[a][b] : (CORR[b] && CORR[b][a] !== undefined ? CORR[b][a] : 0);

  function cholesky(m) {
    const n = m.length, L = [];

    for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
      let s = m[i][j];
      for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];

  /* ---------- 2. RNG (seeded, reproducible) ---------- */
  function mulberry32(a) {

    return [r * Math.cos(t), r * Math.sin(t)];
  }

  /* ---------- 3. Singapore stamp duty / tax schedules (verified Aug 2026, see analysis.md) ---------- */
  function bsd(price) { // Buyer's Stamp Duty, residential, from 15 Feb 2023
    const bands = [[180000, 0.01], [180000, 0.02], [640000, 0.03], [500000, 0.04], [1500000, 0.05], [Infinity, 0.06]];
    let left = price, tax = 0;
    for (const [w, r] of bands) { const x = Math.min(left, w); tax += x * r; left -= x; if (left <= 0) break; }
    return tax;
  }
  function absd(price, profile) { // profile: 'sc1' 0%, 'pr1' 5%, 'sc2' 20%, 'pr2' 30%
    const r = { sc1: 0, pr1: 0.05, sc2: 0.20, pr2: 0.30, f: 0.60 }[profile] || 0;
    return price * r;
  }
  function ssd(price, yearsHeld) { // 4-year schedule from 4 Jul 2025
    if (yearsHeld >= 4) return 0;
    return price * [0.16, 0.12, 0.08, 0.04][Math.floor(yearsHeld)];
  }
  function propertyTaxOO(av) { // owner-occupied residential, from 1 Jan 2024
    const bands = [[8000, 0], [22000, 0.04], [10000, 0.06], [15000, 0.10], [15000, 0.14], [15000, 0.20], [15000, 0.26], [Infinity, 0.32]];
    let left = av, tax = 0;
    for (const [w, r] of bands) { const x = Math.min(left, w); tax += x * r; left -= x; if (left <= 0) break; }

  }
  function pmt(principal, annualRate, years) {
    const n = years * 12, r = annualRate / 12;
    if (principal <= 0) return 0;
    if (r === 0) return principal / n;
    return principal * r / (1 - Math.pow(1 + r, -n));
  }

  /* ---------- 4. Plan model ----------
   plan = {
     id, name, color,
     housing: { type:'condo'|'hdb'|'none', price, ltv, rate, tenure, mu, vol, rent, rentGrowth, maint, av,
                swapEvery (0=never), agentSellPct, legalBuy, renoBuy, absdProfile, exitAtEnd },
     portfolio: { extraInitial, weights:{assetId:0..1}, dca (monthly extra), dcaGrowth, ter, rebalance }
   }

  function housingUpfront(h) {

  }
  function swapCost(h, price) { // sell + rebuy same-value home
    return price * (h.agentSellPct || 0.0218) + bsd(price) + (h.legalBuy || 0) + (h.legalBuy || 0) + (h.renoBuy || 0);
  }
  function exitCost(h, price) { return price * (h.agentSellPct || 0.0218) + (h.legalBuy || 0); }

  function assetParams(g) {
    return ASSETS.map(a => {
      const o = (g.assets && g.assets[a.id]) || {};
      return { id: a.id, mu: o.mu !== undefined ? o.mu : a.mu, vol: o.vol !== undefined ? o.vol : a.vol };
    });
  }

  /* run all plans on common random numbers; return per-plan yearly stats */
  function simulate(plans, g) {
    const years = g.years, months = years * 12, det = g.mode === 'det';
    const nPaths = det ? 1 : (g.paths || 1000);
    const ap = assetParams(g), nA = ap.length, nDim = nA + 2;
    const L = cholesky(corrMatrix(CORR_IDS));
    const rnd = mulberry32(g.seed || 42);
    const shock = g.shock || {};

      const h = p.housing, up = housingUpfront(h);

      const loan0 = h.type === 'none' ? 0 : h.price * h.ltv;

        }

            s.price *= f;
          }

          }

  const P = plan(); const eq = P.layers.equity || 0; const N = Math.max(1, P.N);
  card.append(el('h2', {}, '第 4 步 · 触发器演练'), el('div', { class: 'lead', html: '分批的全部价值在于<b>下跌时敢买</b>。所以规则只有三条、只加速、永不减速——现在把它演练一遍，真跌的时候就不用临场判断。回撤以 VWRA 从「你开始买那天起的最高收盘价」算。' }));
  const g = el('div', { class: 'trig' });
  const left = el('div');
  left.append(el('h3', {}, '规则'));
  left.append(el('ul', { class: 'rules', html: `<li>回撤 ≥ <b>10%</b> → 当月股票层买 <b>双份</b></li><li>回撤 ≥ <b>20%</b> → 当月把股票层<b>剩余额度的一半</b>投进去，余下按剩余月数等分</li><li>回撤 ≥ <b>30%</b> → 股票层剩余额度<b>全部</b>投入，入场结束</li><li>涨了 → 什么都不做，按原计划；不因为「涨太多」暂停</li>` }));
  left.append(el('h3', {}, '演练'));
  const mIn = el('input', { type: 'range', min: 1, max: N, step: 1, value: Math.min(S.trigMonth, N) });
  const dIn = el('input', { type: 'range', min: 0, max: 50, step: 1, value: S.trigDD });
  const mL = el('div', { class: 'num' }), dL = el('div', { class: 'num' });
  const upd = () => { S.trigMonth = +mIn.value; S.trigDD = +dIn.value; save(); mL.textContent = `现在是入场第 ${S.trigMonth} 个月（${monthLabel(S.trigMonth - 1)}）`; dL.textContent = `VWRA 回撤 ${S.trigDD}%`; renderAction(); };
  mIn.addEventListener('input', upd); dIn.addEventListener('input', upd);
  left.append(mL, mIn, dL, dIn);
  const right = el('div', { class: 'action' });
  function renderAction() {
    const m = S.trigMonth, dd = S.trigDD / 100;
    const base = eq / N, invested = base * (m - 1), remaining = eq - invested;
    let action, thisMonth, after;
    if (dd >= 0.30) { action = '触发 30% 规则：剩余额度全部投入'; thisMonth = remaining; after = '入场结束；之后只跑每月定投。'; }
    else if (dd >= 0.20) { action = '触发 20% 规则：剩余额度的一半'; thisMonth = remaining / 2; const left2 = remaining - thisMonth, mLeft = N - m; after = mLeft > 0 ? `余下 ${money(left2)} 按剩余 ${mLeft} 个月等分，每月 ${money(left2 / mLeft)}` : '这是最后一个月，全部投入。'; if (mLeft <= 0) thisMonth = remaining; }
    else if (dd >= 0.10) { action = '触发 10% 规则：当月双份'; thisMonth = Math.min(remaining, base * 2); const left2 = remaining - thisMonth, mLeft = N - m; after = mLeft > 0 ? `余下 ${money(left2)} 按剩余 ${mLeft} 个月等分，每月 ${money(left2 / mLeft)}` : '入场结束。'; }
    else { action = '未触发：按原计划'; thisMonth = Math.min(remaining, base); after = `下个月继续 ${money(base)}。`; }
    right.innerHTML = '';
    right.append(el('div', { class: 'hint', style: 'margin:0' }, `已投 ${money(invested)} · 剩余 ${money(remaining)}`), el('div', { class: 'big', html: action }), el('div', { class: 'big', html: `本月买入 <b>${money(thisMonth)}</b>` }), el('div', { class: 'hint' }, after));
    if (S.crash === false && dd >= 0.3) right.append(el('div', { class: 'warn' }, '这就是 2020 年 3 月、2008 年 10 月的样子。写下来：那时你要做的只有这一件事。'));
  }
  g.append(left, right); card.append(g); upd();
  card.append(nav(true, true, '下一步：入场之后 →', '演练不改变日历；它只是提前把「那一天」过一遍。'));
  return card;
}

/* ---------- step 5 ---------- */
function step5() {
  const card = el('div', { class: 'card' });
  const P = plan(); const A = P.A || 1;
  card.append(el('h2', {}, '第 5 步 · 入场之后'), el('div', { class: 'lead', html: `入场只是开头。真正的引擎是之后每月 <b>${money(S.dca)}</b> 的自动定投和每年一次的再平衡——20 年下来这部分比 60 万本身还多。下面是把它们变成日程。` }));
  card.append(el('h3', {}, `每月定投 ${money(S.dca)} 怎么拆（按目标比例）`));
  const T = el('table'); T.append(el('thead', {}, el('tr', {}, ...['资产', '工具', '比例', '每月', '怎么自动化'].map(h => el('th', {}, h)))));
  const tb = el('tbody');
  const auto = { gEq: 'IBKR Recurring Investment', usEq: 'IBKR Recurring Investment', sgEq: '本地券商 RSP / 每月手动一笔', emEq: 'IBKR Recurring Investment', reit: '本地券商 RSP / 每月手动', gBond: 'IBKR Recurring Investment', sgGov: 'SSB 每月申购 / T-bill 滚动', cash: '工资自动转账', cpf: '每年 12 月一次', gold: 'IBKR Recurring / UOB 金账户定投', btc: '持牌所定投' };
  for (const r of P.rows) tb.append(el('tr', {}, el('td', {}, r.name), el('td', { class: 'l num' }, r.ticker), el('td', { class: 'num' }, pct(r.w)), el('td', { class: 'num' }, moneyF(S.dca * r.w)), el('td', { class: 'l', style: 'font-size:12px;color:var(--ink2)' }, auto[r.id] || '')));
  T.append(tb); card.append(el('div', { class: 'tw' }, T));
  card.append(el('h3', {}, '年历'));
  const Y = el('table'); Y.append(el('thead', {}, el('tr', {}, ...['时间', '做什么', '规则'].map(h => el('th', {}, h)))));
  const yb = el('tbody');
  const rows = [
    ['每月同一天', `定投 ${money(S.dca)}`, '不看行情；加薪则按比例加'],
    ['每年 12 月', (S.srs ? `SRS 各 S$15,300 × ${S.people}` : '') + (S.srs && S.rstu ? ' + ' : '') + (S.rstu ? `RSTU 各 S$8,000 × ${S.people}` : '') || '—', '省税 ~S$5–7k/年（边际税率 15% 时）；SRS 内买 ES3 / CLR / 债基'],
    ['每年 1 月第一个交易日', '再平衡', '偏离目标 >5 个百分点的层调回去；先用新钱，不够才卖'],
    ['每 3 年', '复查目标比例', '收入 / 孩子 / MOP 后是否换房 → 改比例，不改工具'],
    ['每季度', '看一眼账户，≤30 分钟', '不装行情推送'],
  ];
  for (const r of rows) yb.append(el('tr', {}, el('td', {}, r[0]), el('td', { class: 'l' }, r[1]), el('td', { class: 'l', style: 'font-size:12px;color:var(--ink2)' }, r[2])));
  Y.append(yb); card.append(el('div', { class: 'tw' }, Y));
  // rebalance calculator
  card.append(el('h3', {}, '再平衡计算器（每年 1 月用）'));
  card.append(el('div', { class: 'hint', style: 'margin:0 0 8px' }, '填各层现在的市值，得到该买 / 该卖多少回到目标。带 ±5 个百分点的容忍带：在带内就不动。'));
  const rb = el('div', { class: 'grid2' }); const inputs = {}; const out = el('div');
  const L = el('div');
  for (const k of ['safe', 'gold', 'equity']) { if (!P.layers[k]) continue; const inp = el('input', { type: 'number', step: 1000, value: Math.round(P.layers[k]) }); inputs[k] = inp; inp.addEventListener('input', calc); L.append(el('div', { class: 'field' }, el('label', {}, `${LAYER_META[k].name}现值`, el('small', {}, `目标 ${pct(P.layers[k] / A)}`)), el('div', { class: 'unit' }, inp, el('span', {}, 'S$')))); }
  function calc() {
    const vals = {}; let tot = 0; for (const k in inputs) { vals[k] = parseFloat(inputs[k].value) || 0; tot += vals[k]; }
    out.innerHTML = '';
    if (tot <= 0) return;
    const T2 = el('table'); T2.append(el('thead', {}, el('tr', {}, ...['层', '现在', '目标', '偏离', '动作'].map(h => el('th', {}, h)))));
    const b = el('tbody');
    for (const k in vals) { const cur = vals[k] / tot, tgt = P.layers[k] / A, dev = cur - tgt; const act = Math.abs(dev) <= 0.05 ? '在带内，不动' : (dev > 0 ? `卖出 ${money(dev * tot)}` : `买入 ${money(-dev * tot)}`); b.append(el('tr', { class: Math.abs(dev) > 0.05 ? 'hl' : '' }, el('td', {}, LAYER_META[k].name), el('td', { class: 'num' }, pct(cur, 1)), el('td', { class: 'num' }, pct(tgt, 1)), el('td', { class: 'num' }, (dev >= 0 ? '+' : '−') + pct(Math.abs(dev), 1)), el('td', { class: 'l' }, act))); }

/* ---------- step 6 ---------- */
function step6() {
  const card = el('div', { class: 'card' });
  card.append(el('h2', {}, '第 6 步 · 纪律契约'), el('div', { class: 'lead', html: 'B 方案唯一会输的方式是<b>人</b>：追涨杀跌、择时、中途换策略。把规则写在纸上、两个人签字，是最便宜的风控。六条全勾、签名，才进入下一步。' }));
  const CL = [
    '这笔钱 5 年内不卖（组屋 MOP 也是 5 年——同一个锁定期）。唯一的卖出是每年 1 月的再平衡。',
    '跌 30% 是计划内事件，不是意外。发生时只做一件事：查第 4 步的触发器。',
    '不因为「新加坡房价又涨了」中途拆组合去买二套私宅（20% ABSD）。',
    '不买投连险 / 储蓄险 / 结构性产品当投资；单只个股不超过组合 5%。',
    '不换策略。换工具可以（更便宜的同类 ETF）；改比例每 3 年一次、在 1 月做。',
    '每季度看一次账户，每次不超过 30 分钟；不装行情推送。',
  ];
  CL.forEach((t, i) => { const cb = el('input', { type: 'checkbox' }); cb.checked = !!S.clauses[i]; cb.addEventListener('change', () => { S.clauses[i] = cb.checked; if (!S.clauses.every(Boolean)) S.signedAt = ''; save(); renderRail(); btn.disabled = !canSign(); nx.replaceWith(nx = nav(true, stepDone(6), '下一步：开始打卡 →', '')); }); card.append(el('div', { class: 'clause' }, cb, el('span', {}, `${i + 1}. ${t}`))); });
  const sig = el('div', { class: 'sig' });
  const n1 = el('input', { type: 'text', value: S.name1, placeholder: '签名 1' }), n2 = el('input', { type: 'text', value: S.name2, placeholder: '签名 2' });
  n1.addEventListener('input', () => { S.name1 = n1.value; save(); btn.disabled = !canSign(); }); n2.addEventListener('input', () => { S.name2 = n2.value; save(); });
  const canSign = () => S.clauses.every(Boolean) && S.name1.trim();
  const btn = el('button', { class: 'primary', onclick: () => { S.signedAt = new Date().toISOString().slice(0, 10); save(); render(); } }, S.signedAt ? '重新签署' : '签署');

  sig.append(el('div', {}, el('label', {}, '签名'), n1), el('div', {}, el('label', {}, '签名'), n2), btn);
  card.append(sig);
  if (S.signedAt) card.append(el('div', { class: 'stamp' }, `已签署 ${S.signedAt}`));
  card.append(el('div', { class: 'hint' }, '签署只存在这台电脑里。想要一份纸的：⌘/Ctrl + P 打印这一页。'));
  let nx = nav(true, stepDone(6), '下一步：开始打卡 →', S.signedAt ? '' : '六条全勾 + 至少一个签名后解锁');
  card.append(nx);
  return card;
}

/* ---------- step 7 ---------- */
function step7() {
  const card = el('div', { class: 'card' });
  const { P, months } = calendar();
  const doneN = months.filter(m => S.done[m.label]).length;
  const investedPlanned = months.filter(m => S.done[m.label]).reduce((s, m) => s + m.sum, 0);
  const investedActual = months.reduce((s, m) => s + (S.done[m.label] ? (S.actual[m.label] !== undefined && S.actual[m.label] !== '' ? +S.actual[m.label] : m.sum) : 0), 0);
  card.append(el('h2', {}, '第 7 步 · 执行打卡'), el('div', { class: 'lead', html: `${months.length} 个月，已完成 <b>${doneN}</b> 个；按计划应已投入 <b>${money(investedPlanned)}</b>，实际填写 <b>${money(investedActual)}</b>。做完一个月就勾掉；触发器加速的月份把实际金额填进去。` }));
  card.append(el('div', { class: 'bar' }, el('div', { style: `width:${doneN / months.length * 100}%` })));
  const T = el('table', { class: 'chk' }); T.append(el('thead', {}, el('tr', {}, ...['✓', '月', '计划买入', '实际（可选）', '备注'].map(h => el('th', {}, h)))));
  const tb = el('tbody');
  const today = new Date().toISOString().slice(0, 7);
  for (const mo of months) {
    const cb = el('input', { type: 'checkbox' }); cb.checked = !!S.done[mo.label];
    const tr = el('tr', { class: (S.done[mo.label] ? 'done ' : '') + (mo.label === today ? 'hl' : '') });
    cb.addEventListener('change', () => { S.done[mo.label] = cb.checked; save(); render(); });
    const act = el('input', { type: 'number', step: 100, value: S.actual[mo.label] !== undefined ? S.actual[mo.label] : '' , placeholder: Math.round(mo.sum) });
    act.addEventListener('change', () => { S.actual[mo.label] = act.value; save(); renderStrip(); });
    tr.append(el('td', {}, cb), el('td', { class: 'num' }, `${mo.label} M${mo.i + 1}`), el('td', { class: 'l', style: 'font-size:12px' }, mo.items.map(x => `${x.ticker} ${moneyF(x.amt)}`).join(' · '), el('div', { class: 'num', style: 'font-weight:600' }, moneyF(mo.sum))), el('td', {}, act), el('td', { class: 'l', style: 'font-size:12px;color:var(--ink2)' }, mo.notes.join('；')));
    tb.append(tr);
  }
  T.append(tb); card.append(el('div', { class: 'tw' }, T));
  const ctl = el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-top:12px' });
  ctl.append(el('button', { class: 'ghost', onclick: () => { if (confirm('清空打卡记录？（不影响前面步骤的设置）')) { S.done = {}; S.actual = {}; save(); render(); } } }, '清空打卡'));
  ctl.append(el('button', { class: 'ghost', onclick: () => { if (confirm('全部重置，回到第 1 步？')) { S = clone(DEF); save(); render(); } } }, '全部重置'));
  ctl.append(el('button', { class: 'ghost', onclick: () => { const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'entry-plan-state.json'; a.click(); } }, '导出进度 JSON'));
  card.append(ctl);
  card.append(el('div', { class: 'hint' }, `入场结束（${months.length ? months[months.length - 1].label : '—'}）之后，回到第 5 步的年历：每月 ${money(S.dca)}、每年 1 月再平衡、每年 12 月 SRS / RSTU。`));
  card.append(nav(true, false, '完成', ''));
  return card;
}
