不同年龄和性别均可发病，但青壮年男性多见"],["D","有家族病史，或颅脑外伤、久郁、久思、易怒病史"],["E","近期有暴受惊恐或突遭变故等诱因"]],"a":"ABDE","x":"癫狂不同年龄和性别均可发病，但青壮年女性多见，故正确选项为A、B、D、E。","p":"p1"},{"n":56,"t":"多选","q":"下列属于癫狂病因的是","pre":"","o":[["A","情志所伤"],["B","饮食失节"],["C","禀赋异常"],["D","阴阳失调"],["E","水土失宜"]],"a":"ABC","x":"癫狂的发生与七情内伤、饮食失节、禀赋异常相关，这些因素损及脏腑功能，导致阴阳失衡，“重阳者狂，重阴者癫”。火热扰窍，神明错乱而发狂；痰气郁结，蒙蔽脑窍，或心肝脾虚，神明失养而发癫。故选A、B、C。","p":"p2"},{"n":57,"t":"多选","q":"癫狂需要与下列哪些疾病相鉴别","pre":"","o":[["A","痫证"],["B","痴呆"],["C","郁病"],["D","谵语"],["E","郑声"]],"a":"ABCDE","x":"癫狂需要与痫证、痴呆、郁病、谵语、郑声等鉴别。故选A、B、C、D、E。","p":"p1"},{"n":58,"t":"多选","q":"癫狂的辨证要点包括","pre":"","o":[["A","辨癫与狂"],["B","辨寒与热"],["C","辨虚与实"],["D","辨轻与重"],["E","辨气与血"]],"a":"ACD","x":"癫狂的辨证要点是辨癫与狂、辨虚实、辨轻重。故选A、C、D。","p":"p1"},{"n":59,"t":"多选","q":"癫狂的预防调护包括","pre":"","o":[["A","注重精神调摄"],["B","严密观察看护"],["C","饮食营养均衡"],["D","保持心情愉悦"],["E","加强妇幼保健"]],"a":"ABCDE","x":"癫狂的预防调护包括注重精神调摄、严密观察看护、饮食营养均衡、保持心情愉悦、加强妇幼保健。故选A、B、C、D、E。","p":"p6"},{"n":60,"t":"多选","q":"下列与禀赋异常关系密切的病证有","pre":"","o":[["A","痴呆"],["B","癫狂"],["C","虚劳"],["D","痫病"],["E","郁病"]],"a":"ABCD","x":"郁证的病因总属七情内伤，脏腑功能失调，气机郁滞为主要病机，无禀赋异常无关。故选A、B、C、D。","p":"p2"},{"n":61,"t":"多选","q":"癫狂的病理因素有","pre":"","o":[["A","气滞"],["B","痰结"],["C","火郁"],["D","血瘀"],["E","湿浊"]],"a":"ABCD","x":"癫狂病理因素主要是气、痰、火、瘀，而以气郁为先，继而化火或生痰，日久致瘀，终致心窍蒙蔽或神明被扰，引发神志异常之癫狂，故选A、B、C、D。","p":"p2"}]},"06-06":{"name":"痫证","lecture":"6-6 痫证.pdf","points":[{"id":"p1","name":"概念·诊断·鉴别","teach":"<p><b>痫证<\/b>（癫痫）：发作性神情恍惚，甚则突然仆倒、昏不知人、口吐涎沫、两目上视、肢体抽搐或口中怪叫，移时苏醒，<mark>醒后一如常人<\/mark>（各类痫证的共同点），醒后对发作全然不知。也可只是短暂呆木、凝视、呼之不应（如小儿进食中断、碗筷落地，数秒即复）。<\/p><p><b>诊断<\/b>：慢性、反复、短暂发作；发作前可有眩晕胸闷等先兆，发作后疲乏；多有家族史、产伤史、脑外伤史；多在儿童、青春期、青年期起病。<\/p><table><thead><tr><th>鉴别<\/th><th>共同点<\/th><th>对方独有<\/th><\/tr><\/thead><tbody><tr><td>中风<\/td><td><mark>突然仆倒，昏不知人<\/mark><\/td><td>少反复发作，无吐涎、上视、抽搐、怪叫；醒后半身不遂、口舌歪斜<\/td><\/tr><tr><td>厥证<\/td><td>同上<\/td><td>面色苍白，四肢厥冷，无吐涎抽搐<\/td><\/tr><\/tbody><\/table><p>痫证主要与中风、厥证鉴别。<\/p>","src":"讲义 6-6 概述、诊断、鉴别诊断; 题库 #6 #7 #8 #26 #36 #39 #50 #51 #54 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：禀赋异常、情志失调、饮食不节、脑窍损伤（<b>感受外邪<\/b>不在其中）。<\/p><p><b>情志<\/b>主责<mark>惊恐<\/mark>：惊则气乱，痰随气逆，蒙蔽清窍；小儿神气怯弱，更易因惊发病。（对比：癫证＝忧郁。）<\/p><p><b>基本病机<\/b>：<mark>气机逆乱，元神失控<\/mark>。<\/p><p><b>病位<\/b>在脑，与心、肝、脾、肾相关。<\/p><p><b>病理因素<\/b>：风、火、痰、瘀，<mark>尤以痰<\/mark>最重要（“癫痫者，痰邪逆上也”）。<\/p><p><b>病性<\/b>：虚实夹杂；早期多实，日久痰瘀胶固成顽痰，反复发作成痼疾。<\/p>","src":"讲义 6-6 病因、病机; 题库 #9 #10 #11 #48 #49 #56 解析"},{"id":"p3","name":"辨证要点与治则","teach":"<p><b>辨证要点<\/b>：辨病情轻重、辨病性虚实、辨阳痫阴痫（阳痫多实，阴痫多虚）。实证再辨风、痰、火、瘀：<\/p><table><thead><tr><th>因素<\/th><th>发作特点<\/th><\/tr><\/thead><tbody><tr><td>风<\/td><td><mark>来势急骤<\/mark>，神昏猝倒，口噤牙紧，颈项强直，四肢抽搐<\/td><\/tr><tr><td>火<\/td><td>猝倒啼叫，<mark>面赤身热，口流血沫<\/mark>，便秘口臭，苔黄<\/td><\/tr><tr><td>痰<\/td><td>口吐涎沫，<mark>气粗痰鸣<\/mark>，呆木无知，发作后情志错乱、幻听、梦游<\/td><\/tr><\/tbody><\/table><p><b>治则<\/b>：发作期治标——<b>清泻肝火、豁痰息风、开窍定痫<\/b>；休止期治本——<b>健脾化痰、滋补肝肾、养心安神<\/b>。<\/p><p>顽痰难化 → <mark>辛热开破法<\/mark>（川乌、半夏、南星、白附子）。重症：偏阳衰辅<b>参附注射液<\/b>，偏阴虚辅<b>参麦注射液<\/b>。<\/p>","src":"讲义 6-6 辨证要点、治则治法、临证备要; 题库 #12 #15 #19 #20 #25 #46 #47 #55 #57 解析（风/火/痰辨别与注射液见于题库解析）"},{"id":"p4","name":"阳痫 vs 阴痫","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>阳痫<\/td><td>面色潮红、紫红转青紫，牙关紧闭，项背强直，抽搐吐涎；<mark>平素急躁，心烦失眠，口苦咽干，便秘<\/mark>；舌红苔黄腻或白腻，脉弦滑/弦数<\/td><td>急以开窍醒神，继以泄热涤痰息风<\/td><td>黄连解毒汤合定痫丸<\/td><\/tr><tr><td>阴痫<\/td><td><mark>面色晦暗，双眼半开半合，手足清冷<\/mark>，口不啼叫或声微，醒后疲乏；平素神疲、恶心纳差、胸闷；舌淡苔白腻，脉沉迟或沉细<\/td><td>急以开窍醒神，继以温化痰涎，顺气定痫<\/td><td>五生饮合二陈汤<\/td><\/tr><\/tbody><\/table><p>证机：阳痫＝<b>肝风夹痰，蒙蔽清窍，气血逆乱<\/b>；阴痫＝<b>寒痰湿浊，上蒙清窍，元神失控<\/b>。<\/p><p>发作时针人中、十宣、合谷；抽搐甚 → 予<b>紫雪丹<\/b>。<\/p>","src":"讲义 6-6 证治分类 发作期(1)(2); 题库 #23 #24 #27 #34 #35 #37 #40 #41 #42 解析（紫雪丹见于题库解析）"},{"id":"p5","name":"肝火痰热 vs 脾虚痰盛","teach":"<table><thead><tr><th>证（休止期）<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝火痰热<\/td><td>平时<mark>急躁易怒，面红目赤，口苦咽干，便秘溲黄<\/mark>，心烦失眠；发作时昏仆抽搐吐涎；舌红苔黄腻，脉弦滑数<\/td><td>清肝泻火，化痰宁心<\/td><td>龙胆泻肝汤合涤痰汤<\/td><\/tr><tr><td>脾虚痰盛<\/td><td>平素<mark>神疲乏力，胸脘痞闷，纳差便溏<\/mark>；发作时面色晦滞，四肢不温，蜷卧拘急，呕吐涎沫；舌淡苔白腻，脉濡滑<\/td><td>健脾化痰<\/td><td>六君子汤<\/td><\/tr><\/tbody><\/table><p>和发作期分开：题干细写发作全过程（面色由红转紫、牙关紧闭、项背强直）→ 阳痫；重在平时肝火、发作一笔带过 → 肝火痰热。双眼半开半合、对发作全然不知 → 阴痫；胸脘痞闷、便溏、脉濡滑 → 脾虚痰盛。<\/p>","src":"讲义 6-6 证治分类 休止期(1)(2); 题库 #13 #16 #18 #29 #33 #38 解析（对比 #24 #27）"},{"id":"p6","name":"肝肾阴虚 vs 瘀阻脑络","teach":"<table><thead><tr><th>证（休止期）<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝肾阴虚<\/td><td>痫证<mark>日久频发<\/mark>，神思恍惚，头晕目眩，<mark>两目干涩，耳轮焦枯不泽，腰膝酸软<\/mark>，健忘失眠，大便干燥；舌红，脉沉细数<\/td><td>滋养肝肾，填精益髓<\/td><td>大补元煎<\/td><\/tr><tr><td>瘀阻脑络<\/td><td><mark>头痛痛有定处，单侧肢体抽搐或一侧面部抽动<\/mark>，颜面口唇青紫；舌暗有瘀斑，脉涩或弦；多继发于中风、颅脑外伤、产伤、颅内感染<\/td><td>活血化瘀，息风通络<\/td><td>通窍活血汤<\/td><\/tr><\/tbody><\/table><p>治法陷阱：肝肾阴虚是“填精益髓”，不是“潜阳息风”或“滋阴降火”；瘀阻脑络是“息风通络”，不是“通窍止痛”。<\/p><p>证机：肝肾阴虚＝髓海不足，脑失所养；瘀阻脑络＝瘀血阻窍，脑络闭塞，脑神失养。<\/p>","src":"讲义 6-6 证治分类 休止期(3)(4); 题库 #14 #17 #21 #22 #28 #30 #31 #32 #43 #44 #45 解析"},{"id":"p7","name":"医家与出处","teach":"<ul><li><b>《五十二病方》<\/b>：“痫”首见，<mark>最早记载痫的名、症、治<\/mark><\/li><li><b>《黄帝内经》<\/b>：称“颠疾”，属“胎病”，<mark>先天因素<\/mark>致病<\/li><li>孙思邈《千金》：五脏痫、六畜痫<\/li><li>陈无择：惊恐、痰涎、外感、饮食致脏气不平<\/li><li>张子和《儒门事亲》：肝热致痫<\/li><li><b>朱丹溪<\/b>《丹溪心法》：“痰涎壅塞”，<mark>“大率行痰为主”<\/mark><\/li><li>龚信《古今医鉴》：黄连温胆汤<\/li><li><b>王肯堂<\/b>《证治准绳》：区别癫、狂、痫<\/li><li><b>李用粹<\/b>《证治汇补》：<mark>阳痫、阴痫<\/mark>分证<\/li><li><b>程钟龄<\/b>《医学心悟》：创<mark>定痫丸<\/mark><\/li><li>王清任：元气虚＋脑髓瘀血，创龙马自来丹、黄芪赤风汤<\/li><\/ul>","src":"讲义 6-6 历史沿革（王肯堂见讲义 6-5）; 题库 #1 #2 #3 #4 #5 #52 #53 解析"}],"q":[{"n":1,"t":"A1型","q":"最早记载痫证名、症、治的著作是","pre":"","o":[["A","《诸病源候论》"],["B","《丹溪心法》"],["C","《古今医鉴》"],["D","《备急千金要方》"],["E","《五十二病方》"]],"a":"E","x":"“痫”首见于马王堆汉墓帛书《五十二病方》，该书列有“婴儿病痫方”专条，指出“痫者，身热而数惊，颈脊强而腹大”，并用雷丸药浴治疗。《五十二病方》是医学史上有关痫证名、症、治的最早记载。故选E。","p":"p7"},{"n":2,"t":"A1型","q":"最早指出痫证的发病与先天因素有关的著作是","pre":"","o":[["A","《丹溪心法》"],["B","《医学心悟》"],["C","《黄帝内经》"],["D","《金匮要略》"],["E","《医宗金鉴》"]],"a":"C","x":"《黄帝内经》称本病为“颠疾”，属“胎病”。《素问·奇病论》曰：“人生而有病颠疾者，病名曰何？安所得之？岐伯曰：病名为胎病，此得之在母腹中时，其母有所大惊，气上而不下，精气并居，故令子发为颠疾也。”认为发病与先天因素有关。故选C。","p":"p7"},{"n":3,"t":"A1型","q":"提出痫证的发生为“痰涎壅塞”，主张“大率行痰为主”的著作是","pre":"","o":[["A","《黄帝内经》"],["B","《诸病源候论》"],["C","《金匮要略》"],["D","《古今医鉴》"],["E","《丹溪心法》"]],"a":"E","x":"元·朱丹溪《丹溪心法·痫》指出，“无非痰涎壅塞，迷闷孔窍”引发本病，主张“大率行痰为主”，对后世影响较大。故选E。","p":"p7"},{"n":4,"t":"A1型","q":"提出阳痫、阴痫的分证方法及相应治则治法的著作是","pre":"","o":[["A","《诸病源候论》"],["B","《证治准绳》"],["C","《古今医鉴》"],["D","《证治汇补》"],["E","《类经》"]],"a":"D","x":"李用粹在《证治汇补·痫病》提出阳痫、阴痫的分证方法及治则治法。故选D。","p":"p7"},{"n":5,"t":"A1型","q":"创制定痫丸的医家是","pre":"","o":[["A","王清任"],["B","陈无择"],["C","李杲"],["D","程钟龄"],["E","朱丹溪"]],"a":"D","x":"清·程钟龄《医学心悟·癫狂痫》创制定痫丸，至今仍为痫证治疗的常用方剂。故选D。","p":"p7"},{"n":6,"t":"A1型","q":"下列属于痫证共同特点的是","pre":"","o":[["A","昏不知人"],["B","呕吐涎沫"],["C","肢体抽搐"],["D","口中怪叫"],["E","醒后如常"]],"a":"E","x":"痫证，又称“癫痫”，是以发作性神情恍惚，甚则突然仆倒，昏不知人，口吐涎沫，两目上视，肢体抽搐，或口中怪叫，移时苏醒，醒后一如常人为主症的疾病。痫证分类十分复杂，但醒后一如常人，无后遗症。故选E。","p":"p1"},{"n":7,"t":"A1型","q":"突然仆倒，昏不知人，口吐涎沫，常见于","pre":"","o":[["A","癫证"],["B","中风"],["C","狂证"],["D","痫证"],["E","郁证"]],"a":"D","x":"痫证，又称“癫痫”，是以发作性神情恍惚，甚则突然仆倒，昏不知人，口吐涎沫，两目上视，肢体抽搐，或口中怪叫，移时苏醒，醒后一如常人为主症的疾病。故选D。","p":"p1"},{"n":8,"t":"A1型","q":"痫证与中风的共同点是","pre":"","o":[["A","突然仆倒，昏不知人"],["B","四肢抽搐，口中怪叫"],["C","半身不遂，口舌歪斜"],["D","口吐涎沫，两目上视"],["E","言语謇涩，行走不稳"]],"a":"A","x":"痫证是以发作性神情恍惚，甚则突然仆倒，昏不知人，口吐涎沫，两目上视，肢体抽搐，或口中怪叫，移时苏醒，醒后一如常人为主症的疾病；中风是以半身不遂，肌肤不仁，口舌歪斜，言语不利，甚则突然昏仆、不省人事为主要表现的病证。痫证典型大发作与中风均有突然仆倒、昏不知人等症状。故选A。","p":"p1"},{"n":9,"t":"A1型","q":"与痫证关系最密切的病理因素是","pre":"","o":[["A","风"],["B","火"],["C","瘀"],["D","痰"],["E","气"]],"a":"D","x":"痫证病理因素涉及风、火、痰、瘀等，其中尤以痰邪作祟最为重要，《医学纲目·癫痫》所云“癫痫者，痰邪逆上也”即是此意。积痰内伏，每由风火触动，痰瘀互结，上蒙清窍而发病。故选D。","p":"p2"},{"n":10,"t":"A1型","q":"痫证七情失调主要责之于","pre":"","o":[["A","大喜"],["B","愤怒"],["C","悲愁"],["D","思虑"],["E","惊恐"]],"a":"E","x":"七情中主要责之于惊恐，如《证治汇补·痫证》云：“或因猝然闻惊而得，惊则神出舍空，痰涎乘间而归之。”由于突受惊恐，致气机逆乱，痰浊随气上逆，蒙蔽清窍，或五志过极化火生风，或肝郁日久化火生风，风火夹痰上犯清窍，元神失控，发为本病。小儿脏腑娇嫩，元气未充，神气怯弱，更易因惊恐而发生本病。故选E。","p":"p2"},{"n":11,"t":"A1型","q":"痫证的基本病机为","pre":"","o":[["A","气机逆乱，元神失控"],["B","脏腑失调，阴阳失衡"],["C","髓海见空，元神失养"],["D","阴阳失调，气血逆乱"],["E","气机阻滞，瘀血内结"]],"a":"A","x":"痫证主要为先天或后天因素造成脏腑功能失调，脏气不平，阴阳失衡，而致气机逆乱，风、火、痰、瘀等邪闭塞清窍而发病，基本病机为气机逆乱，元神失控。故选A。","p":"p2"},{"n":12,"t":"A1型","q":"下列属于痫证休止期的治则治法是","pre":"","o":[["A","开窍定痫"],["B","清肝泻火"],["C","豁痰息风"],["D","健脾化痰"],["E","疏肝解郁"]],"a":"D","x":"痫证的治疗首当分清标本虚实，轻重缓急。发作期病急，开窍醒神定痫以治其标，治宜清泻肝火，豁痰息风，开窍定痫；休止期病缓，祛邪补虚以治其本，治宜健脾化痰，滋补肝肾，养心安神等。故选D。","p":"p3"},{"n":13,"t":"A1型","q":"治疗痫证肝火痰热的代表方剂是","pre":"","o":[["A","黄连解毒汤合定痫丸加减"],["B","逍遥散合涤痰汤加减"],["C","养心汤合越鞠丸加减"],["D","涤痰汤合苏合香丸加减"],["E","龙胆泻肝汤合涤痰汤加减"]],"a":"E","x":"痫证肝火痰盛，病机为肝郁化火，痰火内盛，上扰元神，治宜清肝泻火，化痰宁心，代表方剂为龙胆泻肝汤合涤痰汤加减。故选E。","p":"p5"},{"n":14,"t":"A1型","q":"治疗痫证肝肾阴虚的代表方剂是","pre":"","o":[["A","地黄饮子"],["B","大补元煎"],["C","天麻钩藤饮"],["D","镇肝息风汤"],["E","六味地黄丸"]],"a":"B","x":"痫证肝肾阴虚，病机为痫证日久，肝肾阴虚，髓海不足，脑失所养，治宜滋养肝肾，填精益髓，代表方剂为大补元煎。故选B。","p":"p6"},{"n":15,"t":"A1型","q":"针对痫证顽痰难化这一特点而确定的治法为","pre":"","o":[["A","涤痰醒神"],["B","搜风化痰"],["C","豁痰化瘀"],["D","辛热开破"],["E","平肝潜阳"]],"a":"D","x":"痫证之痰，具有深遏潜伏、胶固难化、随风气而聚散之特征，辛热开破法是针对痫证顽痰难化这一特点而确定的治法，采用大辛大热的川乌、半夏、南星、白附子等具有振奋阳气、推动气化作用的药物，以开气机之闭塞，破痰邪之积聚，捣沉痼之胶结，从而促进顽痰消散，痫证缓解。故选D。","p":"p3"},{"n":16,"t":"A1型","q":"治疗痫证脾虚痰盛的代表方剂是","pre":"","o":[["A","六君子汤"],["B","左归丸"],["C","地黄饮子"],["D","六味地黄丸"],["E","镇肝息风汤"]],"a":"A","x":"痫证脾虚痰盛，病机为脾虚不运，痰湿内盛，治当健脾化痰，代表方剂是六君子汤。故选A。","p":"p5"},{"n":17,"t":"A1型","q":"痫证瘀阻脑络的治法为","pre":"","o":[["A","理气化痰，活血化瘀"],["B","行气解郁，化瘀通络"],["C","活血化瘀，息风通络"],["D","活血化瘀，开窍醒神"],["E","理气化痰，醒脑通窍"]],"a":"C","x":"痫证瘀阻脑络，病机为瘀血阻窍，脑络闭塞，脑神失养，治法为活血化瘀，息风通络，代表方剂为通窍活血汤。故选C。","p":"p6"},{"n":18,"t":"A1型","q":"治疗痫证脾虚痰盛的代表方剂是","pre":"","o":[["A","大补元煎"],["B","六君子汤"],["C","归脾汤"],["D","天王补心丹"],["E","甘麦大枣汤"]],"a":"B","x":"痫证脾虚痰盛，证机概要为脾虚不运，痰湿内盛，治宜健脾化痰，代表方剂为六君子汤。故选B。","p":"p5"},{"n":19,"t":"A1型","q":"痫证，若来势急骤，神昏猝倒，不省人事，口噝牙紧，颈项强直，四肢抽搐者，其最主要的病理因素是","pre":"","o":[["A","气"],["B","痰"],["C","火"],["D","瘀"],["E","风"]],"a":"E","x":"阳痫发作多实，阴痫发作多虚。实者当辨风、痰、火、瘀之别，如来势急骤，神昏猝倒，不省人事，口噝牙紧，颈项强直，四肢抽搐者，属风。故选E。","p":"p3"},{"n":20,"t":"A1型","q":"痫证，如猝倒啼叫，面赤身热，口流血沫，平素或发作后有大便秘结，口臭，苔黄者，其最主要的病理因素是","pre":"","o":[["A","气"],["B","痰"],["C","火"],["D","瘀"],["E","风"]],"a":"C","x":"阳痫发作多实，阴痫发作多虚。实者当辨风、痰、火、瘀之别，如猝倒啼叫，面赤身热，口流血沫 B","x":"痫证重症，偏阴虚者，见面红身热，躁动不安，息粗痰鸣，呕吐频频等表现，可辅以参麦注射液静脉滴注。故选B。","p":"p3"},{"n":48,"t":"B型","q":"与痫证发生密切相关的情志因素是","pre":"","o":[["A","忧郁"],["B","大喜"],["C","恼怒"],["D","惊恐"],["E","恐惧"]],"a":"D","x":"痫证七情中主要责之于惊恐，由于突受惊恐，致气机逆乱，痰浊随气上逆，蒙蔽清窍，元神失控，发为痫证。故选D。","p":"p2"},{"n":49,"t":"B型","q":"与癫证发生密切相关的情志因素是","pre":"","o":[["A","忧郁"],["B","大喜"],["C","恼怒"],["D","惊恐"],["E","恐惧"]],"a":"A","x":"癫证起病多缓，发病多有痰气作祟，以神情抑郁、表情淡漠、沉默呆钝、语无伦次或喃喃自语、静而少动或静而多喜为常见症状。与癫证发生密切相关的情志因素是忧郁，青壮年女性多见。故选A。","p":"p2"},{"n":50,"t":"B型","q":"痫证与中风可见的共同临床表现是","pre":"","o":[["A","突然仆倒，昏不知人"],["B","四肢抽搐，口中怪叫"],["C","半身不遂，口舌歪斜"],["D","口吐涎沫，两目上视"],["E","言语謇涩，行走不稳"]],"a":"A","x":"痫证是以发作性神情恍惚，甚则突然仆倒，昏不知人，口吐涎沫，两目上视，肢体抽搐，或口中怪叫，移时苏醒，醒后一如常人为主症的疾病；中风是以半身不遂，肌肤不仁，口舌歪斜，言语不利，甚则突然昏仆、不省人事为主要表现的病证。故选A。","p":"p1"},{"n":51,"t":"B型","q":"痫证与厥证可见的共同临床表现是","pre":"","o":[["A","突然仆倒，昏不知人"],["B","四肢抽搐，口中怪叫"],["C","半身不遂，口舌歪斜"],["D","口吐涎沫，两目上视"],["E","言语謇涩，行走不稳"]],"a":"A","x":"痫证是以发作性神情恍惚，甚则突然仆倒，昏不知人，口吐涎沫，两目上视，肢体抽搐，或口中怪叫，移时苏醒，醒后一如常人为主症的疾病；厥证是以突然昏倒、不省人事、四肢厥冷为主要临床表现的一种病证。故选A。","p":"p1"},{"n":52,"t":"B型","q":"将癫、狂、痫三者加以区别的著作是","pre":"","o":[["A","《丹溪心法》"],["B","《证治准绳》"],["C","《证治汇补》"],["D","《金匮要略》"],["E","《儒门事亲》"]],"a":"B","x":"王肯堂《证治准绳·癫狂痫总论》将癫、狂、痫三者加以区别。故选B。","p":"p7"},{"n":53,"t":"B型","q":"将痫证分为阳痫、阴痫的著作是","pre":"","o":[["A","《丹溪心法》"],["B","《证治准绳》"],["C","《证治汇补》"],["D","《金匮要略》"],["E","《儒门事亲》"]],"a":"C","x":"李用粹在《证治汇补·痫病》提出阳痫、阴痫的分证方法及治则治法。故选C。","p":"p7"},{"n":54,"t":"多选","q":"痫证应主要与下列哪些疾病相鉴别","pre":"","o":[["A","郁证"],["B","中风"],["C","厥证"],["D","眩晕"],["E","痴呆"]],"a":"BC","x":"痫证应与中风、厥证相鉴别。故选B、C。","p":"p1"},{"n":55,"t":"多选","q":"痫证的辨证要点包括","pre":"","o":[["A","辨阳痫阴痫"],["B","辨病情轻重"],["C","辨病性虚实"],["D","辨六经"],["E","辨卫气营血"]],"a":"ABC","x":"痫证首先应辨病情轻重，注意其病发持续时间之长短及发作间隔时间之久暂；其次辨病性虚实，痫证发病初期多属实证，反复发作日久则多虚实夹杂；再者辨阳痫阴痫，痫证发作时有阳痫、阴痫之分，阳痫发作多实，阴痫发作多虚。故选A、B、C。","p":"p3"},{"n":56,"t":"多选","q":"下列属于痫证常见病因的是","pre":"","o":[["A","禀赋异常"],["B","情志失调"],["C","感受外邪"],["D","饮食不节"],["E","脑窍损伤"]],"a":"ABDE","x":"痫证的发生，大多由于情志失调，禀赋异常，饮食不节，脑部外伤或患他病之后脑窍损伤，造成脏腑失调，痰浊阻滞，气机逆乱，风阳内动所致，尤以痰邪作祟最为重要。故选ABDE。","p":"p2"},{"n":57,"t":"多选","q":"下列属于痫证发病期病急情况下常用治法的是","pre":"","o":[["A","活血化瘀"],["B","清泻肝火"],["C","豁痰息风"],["D","开窍定痫"],["E","健脾化痰"]],"a":"BCD","x":"痫证的治疗首当分清标本虚实，轻重缓急。发作期病急，开窍醒神定痫以治其标，治宜清泻肝火，豁痰息风，开窍定痫；休止期病缓，祛邪补虚以治其本，治宜健脾化痰，滋补肝肾，养心安神等。故选B、C、D。","p":"p3"}]},"07-01":{"name":"胃痛","lecture":"7-1 胃痛.pdf","points":[{"id":"p1","name":"概念与病因病机","teach":"<p><b>胃痛<\/b>：以胃脘部近心窝处疼痛为主症。<\/p><ul><li>病因：外邪侵袭、饮食不节、情志失调、体虚久病、药物损害。外邪中<mark>寒邪最多<\/mark>（寒性收引，胃痛暴作）。<\/li><li>基本病机：<b>胃气郁滞，失于和降，不通则痛<\/b>；虚者脾胃虚弱，不荣则痛。关键在<b>气滞<\/b>。<\/li><li>病位在胃，与<b>肝、脾<\/b>密切相关。<\/li><li>病理因素：以气滞为主，并见食积、寒凝、热郁、湿阻、血瘀（没有“燥火”）。<\/li><li>性质分虚实；日久可变生呕血便血、结胸、反胃。<\/li><\/ul>","src":"讲义 7-1 病因、病机; 题库 #4 #5 #6 #9 #10 #56 #58 #60 解析"},{"id":"p2","name":"诊断与鉴别","teach":"<p>诊断：胃脘部疼痛为主症（胀、刺、灼、隐痛等），常伴纳差、恶心、嘈杂泛酸、嗳气；多反复发作，有诱因。病例以“胃脘痛/不适”为主症 → 胃痛（即使吐咖啡色物、解柏油便）。<\/p><table><thead><tr><th>鉴别<\/th><th>胃痛<\/th><th>对方<\/th><\/tr><\/thead><tbody><tr><td>真心痛<\/td><td>上腹胃脘痛，中青年，病缓，伴纳差泛酸<\/td><td>胸膺闷痛、绞痛引肩背，老年，病危，伴心悸汗出肢冷<\/td><\/tr><tr><td>胁痛<\/td><td>病位在胃，胃脘痛为主<\/td><td>病位在肝胆，<mark>胁肋部疼痛<\/mark>为主<\/td><\/tr><\/tbody><\/table><p>胃痛与胁痛鉴别最有价值的是疼痛<b>部位<\/b>。<\/p>","src":"讲义 7-1 诊断、鉴别诊断; 题库 #7 #39 #43 #59 解析"},{"id":"p3","name":"辨证要点与治则","teach":"<ul><li>辨虚实：虚——病久、喜按、饥时痛、纳后减；实——病短、拒按、饥时轻、纳后增。<\/li><li>辨寒热：寒——遇寒甚、得温减、吐清水；热——灼痛、喜凉、吐酸水。<\/li><li>辨在气在血：初病在气（胀痛走窜，随情志），久病在血（刺痛固定，入夜甚）。<\/li><\/ul><p>治疗大法：<mark>理气和胃止痛<\/mark>，“通则不痛”。“通”要广义理解：寒凝散寒止痛、食积消食和胃、气滞疏肝解郁、胃热清泻肝胃、血瘀通络化瘀、虚寒温胃健中、阴虚滋阴养胃、拘急缓急止痛，都属通法。<\/p>","src":"讲义 7-1 辨证要点、治则治法; 题库 #8 #57 解析"},{"id":"p4","name":"寒邪客胃vs脾胃虚寒","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>寒邪客胃<\/td><td><mark>胃痛暴作，拘急冷痛<\/mark>，恶寒喜暖，得温痛减，口不渴喜热饮，有感寒食冷史，脉弦紧<\/td><td>温胃散寒，理气止痛<\/td><td>良附丸<\/td><\/tr><tr><td>脾胃虚寒<\/td><td><mark>隐痛绵绵，空腹痛甚，得食则缓<\/mark>，喜温喜按，吐清水，便溏，脉虚缓无力<\/td><td>温中健脾，和胃止痛<\/td><td>黄芪建中汤<\/td><\/tr><\/tbody><\/table><p>两证都喜温：急暴拘急属实寒，久病隐痛、饥甚食缓属虚寒（B型“胃痛隐隐”→脾胃虚寒）。老胃病因食生冷而骤然加剧，题库仍取良附丸。脾胃虚寒见吐清水多、胃有振水音 → 配<b>苓桂术甘汤<\/b>。<\/p>","src":"讲义 7-1 证治分类 1、7; 题库 #11 #16 #17 #18 #24 #29 #33 #35 #38 #48 #51 #55 解析"},{"id":"p5","name":"饮食伤胃","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>饮食伤胃<\/td><td>暴饮暴食史；<mark>胀满拒按，嗳腐吞酸<\/mark>，吐不消化食物、其味腐臭，<b>吐后痛减<\/b>，得矢气及便后稍舒，苔厚腻，脉滑。B型“胃脘胀痛”即本证特征。<\/td><td>消食导滞，和中止痛<\/td><td>保和丸<\/td><\/tr><\/tbody><\/table><p>证机：饮食积滞，壅阻胃气。<\/p><ul><li>脘腹胀甚 → 加枳实、木香（砂仁）、槟榔<\/li><li>胀痛而<mark>便秘<\/mark> → 合<b>小承气汤<\/b><\/li><li>痛急拒按、苔黄燥便秘（食积化热成燥）→ 合大承气汤<\/li><li>食积化热 → 加黄连、栀子<\/li><\/ul><p>“得温痛减、遇寒加重”属寒邪客胃，不是本证。<\/p>","src":"讲义 7-1 证治分类 2; 题库 #15 #21 #22 #25 #36 #49 #54 解析"},{"id":"p6","name":"肝气犯胃vs瘀血停滞","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝气犯胃<\/td><td><mark>胀痛<\/mark>，攻撑连胁，情绪诱发，嗳气矢气则舒，善叹息，苔薄白，脉弦<\/td><td>疏肝理气，和胃止痛<\/td><td>柴胡疏肝散<\/td><\/tr><tr><td>瘀血停滞<\/td><td><mark>刺痛，痛有定处<\/mark>，按之痛甚，食后加剧，入夜尤甚，或黑便呕血，舌紫暗，脉涩<\/td><td>化瘀通络，理气和胃<\/td><td>失笑散合丹参饮<\/td><\/tr><\/tbody><\/table><p>初病在气，久病在血。肝气犯胃证机：肝气郁滞，横逆犯胃，胃气阻滞；泛酸加乌贼骨、煅瓦楞子、左金丸。瘀血停滞证机：瘀停胃络，脉络壅滞；见呕血黑便先止血，去檀香、砂仁，加大黄、茜草、三七粉。<\/p>","src":"讲义 7-1 辨证要点 3、证治分类 3、6; 题库 #23 #26 #27 #31 #32 #44 #45 #46 #50 解析"},{"id":"p7","name":"灼痛三证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝胃郁热<\/td><td>灼痛 + <mark>烦躁易怒，胁胀，口干口苦<\/mark>，泛酸嘈杂，苔黄，脉弦数<\/td><td>疏肝泄热，和胃止痛<\/td><td>化肝煎<\/td><\/tr><tr><td>湿热中阻<\/td><td>灼痛 + <mark>苔黄腻<\/mark>，脘痞腹胀，纳呆恶心，渴不欲饮，脉滑数<\/td><td>清化热湿，理气和胃<\/td><td>清中汤<\/td><\/tr><tr><td>胃阴不足<\/td><td><mark>隐隐灼痛<\/mark>，嘈杂似饥或饥不欲食，口干咽燥，便干，舌红少津或光剥，脉细<\/td><td>养阴益胃，和中止痛<\/td><td>益胃汤<\/td><\/tr><\/tbody><\/table><p>肝胃郁热证机：肝郁化火，郁热伤胃；加强制酸止痛加<b>煅瓦楞子、海螵蛸<\/b>。胃阴不足证机：胃阴不足，<b>润降失司<\/b>；有口干，故“口不渴”不属本证。<\/p>","src":"讲义 7-1 证治分类 4、5、8; 题库 #12 #13 #14 #28 #30 #37 #40 #41 #42 #47 解析"},{"id":"p8","name":"附 吐酸·嘈杂","teach":"<p>吐酸病机：肝胃失和，分寒热；除治胃外，总以治<b>肝<\/b>为本。嘈杂：胃中空虚，似饥非饥，莫可名状。<\/p><table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>吐酸热证<\/td><td>吐酸，口干苦，心烦易怒，舌红苔黄，脉弦数<\/td><td>清泻肝火，和胃降逆<\/td><td>左金丸<\/td><\/tr><tr><td>吐酸寒证<\/td><td>吐酸 + <mark>喜唾涎沫，饮食喜热，四肢不温，便溏<\/mark>，脉沉迟<\/td><td>温中散寒，宽胸下气<\/td><td>香砂六君子汤<\/td><\/tr><tr><td>嘈杂胃热<\/td><td><mark>口渴喜冷，口臭，痰多，多食易饥<\/mark>，苔黄干，脉滑数<\/td><td>清热化痰，降逆和中<\/td><td>黄连温胆汤<\/td><\/tr><tr><td>嘈杂胃虚<\/td><td>时作时止，口淡，食后脘胀，舌淡脉虚<\/td><td>益气健脾，调畅气机<\/td><td>四君子汤<\/td><\/tr><tr><td>嘈杂血虚<\/td><td>面白唇淡，头晕心悸<\/td><td>益气养血，健脾和胃<\/td><td>归脾汤<\/td><\/tr><\/tbody><\/table>","src":"讲义 7-1 附 吐酸、附 嘈杂; 题库 #19 #20 #34 #52 #53 解析"},{"id":"p9","name":"医家与出处","teach":"<ul><li>《内经》：“木郁之发，民病胃脘当心而痛”——首提胃痛与肝、脾有关。<\/li><li>李东垣《<b>兰室秘藏<\/b>》：<mark>首立“胃脘痛”一门<\/mark>，与心痛区分，胃痛成为独立病证。<\/li><li>虞抟《<b>医学正传<\/b>》：“古方九种心痛……皆在胃脘，而实不在于心也”。<\/li><li>高世栻《医学真传》：广义理解“通”法。<\/li><li><b>叶天士<\/b>：“初病在经，久痛入络”；“通字须究气血阴阳”。<\/li><\/ul>","src":"讲义 7-1 历代沿革; 题库 #1 #2 #3 解析（讲义作“初病在气，久病入络”，按题库解析“初病在经，久痛入络”）"}],"q":[{"n":1,"t":"A1型","q":"首立“胃脘痛”一门，将胃脘痛的证候、病因病机和治法明确区分于心痛，使胃痛成为独立病证的著作是","pre":"","o":[["A","《脾胃论》"],["B","《内外伤辨惑论》"],["C","《兰室秘藏》"],["D","《活法机要》"],["E","《医学发明》"]],"a":"C","x":"金·李东垣《兰室秘藏》首立“胃脘痛”一门，将胃脘痛的证候、病因病机和治法明确区分于心痛，使胃痛成为独立的病证。故选C。","p":"p9"},{"n":2,"t":"A1型","q":"载有“古方九种心痛……详其所由，皆在胃脘，而实不在于心也”的著作是","pre":"","o":[["A","《医学入门》"],["B","《医学真传》"],["C","《医学正传》"],["D","《医学心悟》"],["E","《医宗必读》"]],"a":"C","x":"明·虞抟《医学正传·胃脘痛》指出：“古方九种心痛……详其所有，皆在胃脘，而实不在于心也。”关于胃痛的治疗，其指出：“气在上者涌之，清气在下者提之，寒者温之，热者寒之，虚者培之，实者泻之，结者散之，留者行之。”故选C。","p":"p9"},{"n":3,"t":"A1型","q":"提出胃痛“初病在经，久痛入络”病机特点的医家是","pre":"","o":[["A","张仲景"],["B","朱丹溪"],["C","叶天士"],["D","罗天益"],["E","陈修园"]],"a":"C","x":"叶天士倡导“初病在经，久痛入络”的病机特点，治疗方面强调“通字须究气血阴阳，便是看诊要旨”，提出辛香理气、辛柔和血、泻肝安胃、甘温补胃、滋阴养胃等治法。故选C。","p":"p9"},{"n":4,"t":"A1型","q":"胃痛的主要病变脏腑在胃，与其关系最密切的脏腑是","pre":"","o":[["A","肝、肾"],["B","脾、肾"],["C","胆、肾"],["D","肝、脾"],["E","心、肺"]],"a":"D","x":"胃痛病变部位在胃，与肝、脾密切相关。故选D。","p":"p1"},{"n":5,"t":"A1型","q":"胃痛的发病可与外邪致病相关，其中最为常见的是","pre":"","o":[["A","风邪"],["B","寒邪"],["C","暑邪"],["D","湿邪"],["E","热邪"]],"a":"B","x":"外感寒、热、湿诸邪内客于胃，皆可致胃脘气机阻滞，不通则痛。其中尤以寒邪犯胃为多，因寒性收引，易使气机郁滞，致胃气不和而胃痛暴作。故选B。","p":"p1"},{"n":6,"t":"A1型","q":"胃痛发病的关键病机是","pre":"","o":[["A","气虚"],["B","气滞"],["C","气陷"],["D","气怯"],["E","气逆"]],"a":"B","x":"胃痛的基本病机是胃气郁滞，失于和降，不通则痛。故选B。","p":"p1"},{"n":7,"t":"A1型","q":"下列症状对胃痛与胁痛的鉴别诊断最具有价值的是","pre":"","o":[["A","疼痛的持续时间"],["B","疼痛的性质"],["C","疼痛的部位"],["D","疼痛的兼症"],["E","疼痛的诱因"]],"a":"C","x":"胁痛病位在肝胆，与脾胃有关，临床表现以胁肋部疼痛为主；胃痛病位在胃，与肝脾有关，以胃脘疼痛为主。故选C。","p":"p2"},{"n":8,"t":"A1型","q":"胃痛的治疗大法是","pre":"","o":[["A","温胃理气止痛"],["B","理气和胃止痛"],["C","通络理气止痛"],["D","健脾和胃止痛"],["E","疏肝理气止痛"]],"a":"B","x":"胃痛的治疗以理气和胃止痛为大法，疏通气机，“通则不痛”。故选B。","p":"p3"},{"n":9,"t":"A1型","q":"下列不属于胃痛常见病理因素的是","pre":"","o":[["A","食积"],["B","寒凝"],["C","气滞"],["D","血瘀"],["E","燥火"]],"a":"E","x":"胃痛的病理因素以气滞为主，并见食积、寒凝、热郁、湿阻、血瘀。故选E。","p":"p1"},{"n":10,"t":"A1型","q":"胃痛的基本病机是","pre":"","o":[["A","胃气郁滞，失于和降，不通则痛"],["B","中焦气机不利，脾胃升降失职"],["C","胃失和降，胃气上逆"],["D","胃失和降，胃气上逆动膈"],["E","气、痰、瘀交结，阻隔于食道、贲门"]],"a":"A","x":"胃痛的基本病机为胃气郁滞，失于和降，不通则痛。故选A。","p":"p1"},{"n":11,"t":"A1型","q":"下列属于胃痛寒邪客胃证特点的是","pre":"","o":[["A","拘急冷痛，恶寒喜暖，得温痛减"],["B","胃脘胀痛，或攻撑窜动，牵引背胁"],["C","胃脘隐痛，喜温喜按"],["D","胃脘刺痛，痛有定处"],["E","胃脘隐隐灼痛"]],"a":"A","x":"冷痛拒按而喜温为胃痛寒邪客胃证的特点。故选A。","p":"p4"},{"n":12,"t":"A1型","q":"下列属于胃痛肝胃郁热疼痛特点的是","pre":"","o":[["A","隐痛"],["B","暴痛"],["C","胀痛"],["D","灼痛"],["E","刺痛"]],"a":"D","x":"胃痛肝胃郁热主要临床表现为胃脘灼痛，烦躁易怒，烦热不安，胁胀不舒，泛酸嘈杂，口干口苦，舌质红，苔黄，脉弦或数。故选D。","p":"p7"},{"n":13,"t":"A1型","q":"胃痛胃阴不足证的证机概要为","pre":"","o":[["A","脾胃虚寒"],["B","润降失司"],["C","胃气壅滞"],["D","胃热炽盛"],["E","胃失温养"]],"a":"B","x":"胃痛胃阴不足的证机概要为胃阴不足，润降失司。故选B。","p":"p7"},{"n":14,"t":"A1型","q":"下列不属于胃痛胃阴不足常见临床表现的是","pre":"","o":[["A","胃痛隐隐"],["B","口燥咽干"],["C","口不渴"],["D","舌红少津"],["E","饥不欲食"]],"a":"C","x":"胃痛胃阴不足主要临床表现为胃脘隐隐灼痛，有时嘈杂似饥，口干咽燥，大便干结，舌质红少津，或光剥无苔，脉弦细无力。故选C。","p":"p7"},{"n":15,"t":"A1型","q":"下列不属于胃痛饮食伤胃常见临床表现的是","pre":"","o":[["A","胃痛胀满拒按"],["B","嗳腐吞酸"],["C","呕吐不消化食物"],["D","得温痛减"],["E","舌苔厚腻，脉滑"]],"a":"D","x":"胃痛得温痛减，遇寒加重，为寒邪客胃证的常见临床表现。","p":"p5"},{"n":16,"t":"A1型","q":"胃痛寒邪犯胃最常见的脉象是","pre":"","o":[["A","浮脉"],["B","弦紧脉"],["C","革脉"],["D","浮紧脉"],["E","沉脉"]],"a":"B","x":"胃痛寒邪犯胃最常见临床表现为胃痛暴作，拘急冷痛，恶寒喜暖，得温痛减，遇寒加重，口不渴，喜热饮，有感寒或食冷病史，舌苔薄白，脉弦紧。故选B。","p":"p4"},{"n":17,"t":"A1型","q":"胃痛脾胃虚寒，若兼有泛吐清水较多，或胃中有振水音，治疗应配用","pre":"","o":[["A","清胃散"],["B","苓桂术甘汤"],["C","丹参饮"],["D","生姜泻心汤"],["E","香砂六君子汤"]],"a":"B","x":"胃痛脾胃虚寒，若见泛吐清水较多，或胃中有振水音，加干姜、半夏、陈皮、茯苓，或配用苓桂术甘汤通阳化饮。故选B。","p":"p4"},{"n":18,"t":"A1型","q":"下列属于胃痛寒邪客胃疼痛特点的是","pre":"","o":[["A","胃脘刺痛"],["B","胃痛隐隐"],["C","拘急冷痛"],["D","胃脘胀痛"],["E","胃脘灼痛"]],"a":"C","x":"胃痛寒邪客胃主要临床表现为胃痛暴作，拘急冷痛，恶寒喜暖，得温痛减，遇寒加重，口不渴，喜热饮，有感寒或食冷病史，舌苔薄白，脉弦紧。故选C。","p":"p4"},{"n":19,"t":"A1型","q":"吐酸一证，五脏之中除治胃以外，总以治何脏为根本","pre":"","o":[["A","胃"],["B","肝"],["C","脾"],["D","肺"],["E","肾"]],"a":"B","x":"吐酸的证机概要为肝胃失和，有寒热之分。吐酸属热者，多由肝郁化热，邪热犯胃，胃气上逆所致；因寒者，多因脾胃虚弱，肝气犯胃而成。故选B。","p":"p8"},{"n":20,"t":"A1型","q":"吐酸时作，嗳气酸腐，胸脘胀闷，喜唾涎沫，饮食喜热，四肢不温，大便溏泄，舌淡苔白，脉沉迟。治疗应首选","pre":"","o":[["A","良附丸"],["B","丹参饮"],["C","半夏泻心汤"],["D","香砂六君子汤"],["E","黄芪建中汤"]],"a":"D","x":"辨证为吐酸寒证，治当温中散寒，宽胸下气，代表方剂为香砂六君子汤。故选D。","p":"p8"},{"n":21,"t":"A2型","q":"患者，女，43岁。胃脘疼痛，胀满拒按，嗳腐吞酸，其味腐臭，吐后痛减，不思饮食，大便不爽，得矢气后稍舒，有暴饮暴食病史，舌苔厚腻，脉滑。治疗方选","pre":"","o":[["A","良附丸"],["B","保和丸"],["C","柴胡疏肝散"],["D","黄芪建中汤"],["E","失笑散合丹参饮加减"]],"a":"B","x":"根据患者临床表现，诊断为胃痛饮食伤胃，治当消食导滞，和胃止痛，代表方剂为保和丸。故选B。","p":"p5"},{"n":22,"t":"A2型","q":"患者，男，18岁。前日食过饱后即胃脘胀痛，嗳腐吞酸，大便不畅，苔厚腻，前医曾用保和丸不效，现胃脘痛而便闭。治疗应保和丸合用","pre":"","o":[["A","小承气汤"],["B","大承气汤"],["C","枳实导滞丸"],["D","小陷胸汤"],["E","理中汤"]],"a":"A","x":"胃痛饮食伤胃主要临床表现为胃脘疼痛，胀满拒按，嗳腐吞酸，或呕吐不消化食物，其味腐臭，吐后痛减，不思饮食，大便不爽，得矢气及便后稍舒，有暴饮暴食病史，舌苔厚腻，脉滑。代表方剂为保和丸。胃脘胀痛而便秘者，合小承气汤。故选A。","p":"p5"},{"n":23,"t":"A2型","q":"患者，女，40岁。近4天来胃脘胀痛，连及两胁，嗳气频频，舌苔薄白，脉弦。其证候类型是","pre":"","o":[["A","肝气犯胃"],["B","寒邪客胃"],["C","瘀血停滞"],["D","饮食伤胃"],["E","湿热中阻"]],"a":"A","x":"胃痛肝气犯胃主要临床表现为胃脘胀痛，或攻撑窜动，牵引背胁，情绪波动诱发或导致疼痛加重，嗳气、矢气则痛舒，胸闷叹息，大便不畅，舌苔薄白，脉弦。证机概要为肝气郁滞，横逆犯胃，胃气阻滞。故选A。","p":"p6"},{"n":24,"t":"A2型","q":"患者，男，50岁。胃脘疼痛反复发作20年，近两天因饮食生冷后胃脘疼痛加剧，疼痛隐隐，进食后缓解，喜抚慰和温熨。治疗应首选","pre":"","o":[["A","保和丸"],["B","良附丸"],["C","化肝煎"],["D","附桂理中丸"],["E","香砂六君子汤"]],"a":"B","x":"胃痛寒邪客胃主要临床表现为胃痛暴作，拘急冷痛，恶寒喜暖，得温痛减，遇寒加重，口不渴，喜热饮，有感寒或食冷病史，舌苔薄白 "],["C","胃脘刺痛"],["D","胃脘胀痛"],["E","胃脘灼痛"]],"a":"A","x":"胃痛脾胃虚寒的特征为胃痛隐隐。故选A。","p":"p4"},{"n":56,"t":"多选","q":"胃痛常见病因有","pre":"","o":[["A","外邪侵袭"],["B","饮食不节"],["C","情志失调"],["D","久病体虚"],["E","胃气上逆"]],"a":"ABCD","x":"胃痛的发生，主要由外邪侵袭、饮食不节、情志失调、体虚久病及药物损害等，致使脾胃虚弱，不荣则痛，或胃气郁滞，失于和降，不通则痛。故选A、B、C、D。","p":"p1"},{"n":57,"t":"多选","q":"应用“通则不痛”的原则治疗胃痛，可运用的治法是","pre":"","o":[["A","疏肝"],["B","活血"],["C","消导"],["D","温胃"],["E","泄热"]],"a":"ABCDE","x":"运用“通”法，不能局限于狭义的“通”之一法，应根据不同证候类型，采取相应治法。如实证者，应区别寒凝、食积、气滞、胃热、血瘀，分别给予散寒止痛、消食和胃、疏肝解郁、清泻肝胃、通络化瘀治法；虚证者当辨虚寒与阴虚，分别治予温胃健中或滋阴养胃等法。对于胃脘拘急而痛者，可用缓急止痛法。故选A、B、C、D、E。","p":"p3"},{"n":58,"t":"多选","q":"胃痛的基本病机包括","pre":"","o":[["A","胃气郁滞"],["B","虚实夹杂"],["C","不通则通"],["D","胃失和降"],["E","痰湿阻滞"]],"a":"ACD","x":"胃痛的发生，主要由外邪侵袭、饮食不节、情志失调、体虚久病及药物损害等，致使脾胃虚弱，不荣则痛，或胃气郁滞，失于和降，不通则痛。故选A、C、D。","p":"p1"},{"n":59,"t":"多选","q":"胃痛应与哪些病证相鉴别","pre":"","o":[["A","咳嗽"],["B","真心痛"],["C","胁痛"],["D","腹胀"],["E","眩晕"]],"a":"BC","x":"胃痛与真心痛、胁痛的鉴别诊断。故选B、C。","p":"p2"},{"n":60,"t":"多选","q":"胃痛的主要病变脏腑在胃，与其关系最密切的脏腑是","pre":"","o":[["A","肝"],["B","心"],["C","肾"],["D","脾"],["E","肺"]],"a":"AD","x":"胃痛病变部位在胃，与肝、脾密切相关。故选A、D。","p":"p1"}]},"07-02":{"name":"胃痞","lecture":"7-2 胃痞.pdf","points":[{"id":"p1","name":"概念与病因病机","teach":"<p><b>胃痞<\/b>（痞满）：以自觉心下痞塞、胀满不舒为主症；特点<mark>触之无形，按之柔软，压之无痛<\/mark>。<\/p><ul><li>病因：饮食不节、情志失调、体虚久病、药毒误治（没有跌仆损伤）。<\/li><li>基本病机：<b>中焦气机阻滞，脾胃升降失常<\/b>。<\/li><li>根本病位在<b>胃<\/b>，与肝、脾密切相关。<\/li><li>性质分虚实：初多实，实痞日久可致虚痞；常虚实互兼、寒热夹杂。<\/li><\/ul>","src":"讲义 7-2 概述、病因、病机; 题库 #3 #4 #5 #6 解析"},{"id":"p2","name":"诊断与鉴别","teach":"<p>诊断：脘腹满闷不舒为主症，按之柔软，压之无痛；时轻时重，反复发作。病例“痞闷而胀，进食尤甚，<b>无明显腹痛<\/b>”→ 胃痞，不是胃痛。<\/p><table><thead><tr><th>鉴别<\/th><th>胃痞<\/th><th>对方<\/th><\/tr><\/thead><tbody><tr><td>胃痛<\/td><td>满闷不适，压之无痛，起病较缓<\/td><td>以<mark>疼痛<\/mark>为主，压之可痛，病势多急<\/td><\/tr><tr><td>鼓胀<\/td><td>自觉满闷，<mark>外无胀形<\/mark><\/td><td>腹部胀大如鼓，皮色苍黄，脉络（青筋）暴露<\/td><\/tr><tr><td>积聚<\/td><td>无腹部包块<\/td><td><mark>腹内结块<\/mark>，或伴腹痛腹胀<\/td><\/tr><\/tbody><\/table>","src":"讲义 7-2 诊断、鉴别诊断; 题库 #21 #23 #42 #56 解析"},{"id":"p3","name":"辨证要点与治则","teach":"<ul><li>辨证：辨虚实、寒热，<mark>首辨虚实<\/mark>。<\/li><li>实痞：体壮，<b>按之加重<\/b>，食后为甚，苔厚腻，脉实有力。虚痞：体虚，反复发作，喜揉喜按，少苔，脉虚无力。<\/li><li>寒痞：遇寒则甚，口淡不渴；热痞：烦热，口渴，舌红苔黄。<\/li><\/ul><p>基本原则：<b>调理脾胃升降，行气除痞消满<\/b>。实者泻之，虚者补之，夹杂者补泻并用；补虚重在健脾益气或养阴益胃；祛邪分消食导滞、除湿化痰、理气解郁、清热祛湿。无论补泻，<mark>用药不可过于峻猛，以免重伤脾胃<\/mark>。<\/p>","src":"讲义 7-2 辨证要点、治则治法; 题库 #7 #8 #9 #19 #57 #58 解析"},{"id":"p4","name":"饮食内停","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>饮食内停<\/td><td><mark>进食尤甚<\/mark>，脘腹满闷而胀，嗳腐吞酸，厌食呕吐，矢气频作、味臭如败卵，苔厚腻，脉滑。<\/td><td>消食和胃，行气消痞<\/td><td>保和丸<\/td><\/tr><\/tbody><\/table><p>证机：饮食内停，胃腑失和，气机壅塞。<\/p><ul><li>食积较重、食欲减退 → 加鸡内金、谷芽、麦芽<\/li><li>胀满明显 → 加枳实、厚朴、大腹皮<\/li><li>食积化热、<mark>大便秘结<\/mark> → 加大黄、枳实，或<b>枳实导滞丸<\/b><\/li><li>脾虚<mark>便溏<\/mark> → 加白术、扁豆，或<b>枳实消痞丸<\/b><\/li><\/ul>","src":"讲义 7-2 证治分类 实痞(1); 题库 #10 #18 #22 #32 #33 #35 #52 解析"},{"id":"p5","name":"痰湿中阻vs湿热阻胃","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰湿中阻<\/td><td><mark>苔白厚腻<\/mark>，身重困倦，头昏，口淡不渴，嗳气呕恶，脉沉滑<\/td><td>除湿化痰，理气和中<\/td><td>平胃散合二陈汤<\/td><\/tr><tr><td>湿热阻胃<\/td><td><mark>灼热嘈杂，口苦，苔黄腻<\/mark>，口干不欲饮，便干或黏滞，脉滑数<\/td><td>清热化湿，和胃消痞<\/td><td>泻心汤合连朴饮<\/td><\/tr><\/tbody><\/table><ul><li>痰湿：胸膈满闷甚 → 加紫苏梗、桔梗、藿香；痰阻气逆、心下痞硬、嗳气不止 → <b>旋覆代赭汤<\/b>；郁久化热、口苦苔黄 → 改<b>黄连温胆汤<\/b>。<\/li><li>湿热：灼热嘈杂明显 → 加蒲公英、连翘、瓦楞子；恶心呕吐明显 → 加竹茹、白蔻仁、生姜；心下痞、呕而肠鸣下利 → <b>半夏泻心汤<\/b>。<\/li><\/ul>","src":"讲义 7-2 证治分类 实痞(2)(3); 题库 #12 #15 #16 #17 #27 #34 #36 #38 #40 #46 #47 #50 #51 #54 #55 解析（痰湿中阻治法讲义作“燥湿健脾，化痰理气”，按题库 #16 “除湿化痰，理气和中”）"},{"id":"p6","name":"肝胃不和","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝胃不和<\/td><td><mark>情志诱发<\/mark>，脘腹痞闷，胸胁胀满，心烦易怒，善太息，呕恶嗳气或吐苦水，大便不爽，苔薄白，脉弦。<\/td><td>疏肝解郁，和胃消痞<\/td><td>越鞠丸合枳术丸<\/td><\/tr><\/tbody><\/table><p>证机：肝气郁结，乘脾犯胃，气机逆乱。<\/p><ul><li>胀满较甚 → 加柴胡、大腹皮、青皮，或<b>五磨饮子<\/b><\/li><li>心烦不寐 → 加合欢皮、郁金、酸枣仁<\/li><li>郁而化火、嘈杂反酸 → 合左金丸<\/li><\/ul>","src":"讲义 7-2 证治分类 实痞(4); 题库 #11 #25 #28 #31 #43 #44 #45 #53 解析"},{"id":"p7","name":"虚痞两证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>脾胃虚弱<\/td><td>时轻时重，<mark>喜温喜按，纳呆便溏<\/mark>，神疲，少气懒言，舌淡，脉细弱<\/td><td>补气健脾，升清降浊<\/td><td>补中益气汤<\/td><\/tr><tr><td>胃阴不足<\/td><td><mark>嘈杂，饥不欲食，口燥咽干<\/mark>，便秘，舌红少苔，脉细数<\/td><td>养阴益胃，调中消痞<\/td><td>益胃汤<\/td><\/tr><\/tbody><\/table><ul><li>脾胃虚弱：胀闷较重 → 加枳壳、木香、厚朴；阳虚明显、痞满夜甚、遇寒加重 → 加附子、干姜或合<b>理中丸<\/b>。<\/li><li>胃阴不足：便秘 → 加火麻仁、玄参。<\/li><\/ul>","src":"讲义 7-2 证治分类 虚痞(1)(2); 题库 #13 #14 #24 #26 #29 #30 #37 #39 #41 #48 #49 解析"},{"id":"p8","name":"出处与调护","teach":"<ul><li>痞满病名首见《<b>黄帝内经<\/b>》（《素问·至真要大论》“心痛痞满”）。<\/li><li>张仲景：“满而不痛者，此为痞”，创半夏泻心汤等诸泻心汤。<\/li><li>张景岳《<b>景岳全书<\/b>》：<mark>分实痞、虚痞<\/mark>——有邪有滞为实痞，无物无滞为虚痞。<\/li><li>调护：饮食有节，避免肥甘、辛辣、生冷；慎用大热大寒有毒之药；素体虚弱者<b>不宜<\/b>常用峻补滋腻之品（易伤脾胃）。<\/li><\/ul>","src":"讲义 7-2 历史沿革、预防调护; 题库 #1 #2 #20 解析"}],"q":[{"n":1,"t":"A1型","q":"胃痞，又称痞满，痞满的病名首见于","pre":"","o":[["A","《黄帝内经》"],["B","《伤寒论》"],["C","《诸病源候论》"],["D","《景岳全书》"],["E","《脾胃论》"]],"a":"A","x":"痞满的病名首见于《素问·至真要大论》，其云：“太阳之复，厥气上行，水凝雨冰，羽虫乃死。心胃生寒，胸膈不利，心痛痞满。”故选A。","p":"p8"},{"n":2,"t":"A1型","q":"将胃痞分为实痞和虚痞的著作是","pre":"","o":[["A","《景岳全书》"],["B","《黄帝内经》"],["C","《医学正传》"],["D","《伤寒论》"],["E","《类证治裁》"]],"a":"A","x":"明·张景岳《景岳全书·痞满》指出：“凡有邪有滞而痞者，实痞也；无物无滞而痞者，虚痞也。”将胃痞分为实痞和虚痞。故选A。","p":"p8"},{"n":3,"t":"A1型","q":"下列不属于胃痞常见病因的是","pre":"","o":[["A","饮食不节"],["B","情志失调"],["C","体虚失病"],["D","跌仆损伤"],["E","药毒所伤"]],"a":"D","x":"饮食不节、情志失调、体虚久病、药毒所伤等可引起中焦气机阻滞，脾胃升降失常，而发生胃痞。故选D。","p":"p1"},{"n":4,"t":"A1型","q":"下列关于胃痞主症特点的描述，正确的是","pre":"","o":[["A","自觉心下痞塞，胀满不舒"],["B","压之疼痛"],["C","触之有形"],["D","胀大如鼓"],["E","青筋暴露"]],"a":"A","x":"胃痞是以自觉心下痞塞胀满不舒为主症的疾病，又称痞满。一般以自觉脘腹痞塞胀满，触之无形，按之柔软，压之无痛为特点。故选A。","p":"p1"},{"n":5,"t":"A1型","q":"胃痞的根本病位在","pre":"","o":[["A","肝、脾"],["B","脾、胃"],["C","胃"],["D","肝、脾、肾"],["E","肝、胆"]],"a":"C","x":"饮食不节、情志失调、体虚久病或药毒误治等病因均可影响到胃，可涉及脾、肝，即其根本病位在胃。故选C。","p":"p1"},{"n":6,"t":"A1型","q":"胃痞的基本病机是","pre":"","o":[["A","中焦气机阻滞，脾胃升降失常"],["B","外邪内陷，阻塞气机"],["C","肝气郁滞，横逆犯脾"],["D","湿盛脾虚，气机阻滞"],["E","食滞肠胃，痞塞不通"]],"a":"A","x":"饮食不节、情志失调、体虚久病或药毒误治等病因均可影响到胃，并涉及脾、肝，使中焦气机不利，脾胃升降失职，而发痞满。故选A。","p":"p1"},{"n":7,"t":"A1型","q":"胃痞辨证，应首辨","pre":"","o":[["A","气血"],["B","阴阳"],["C","表里"],["D","寒热"],["E","虚实"]],"a":"E","x":"胃痞辨证，需辨寒热虚实，首辨虚实。故选E。","p":"p3"},{"n":8,"t":"A1型","q":"胃痞治疗的基本原则是","pre":"","o":[["A","疏肝解郁行气，化湿和胃消痞"],["B","调理脾胃升降，行气除痞消满"],["C","理气宽胸止呕，补泻升降并用"],["D","补气健脾化湿，升清降浊和胃"],["E","清热化湿行气，健脾和胃消痞"]],"a":"B","x":"胃痞的治疗要以调理脾胃升降、行气除痞消满为基本原则。故选B。","p":"p3"},{"n":9,"t":"A1型","q":"下列属于实痞常见临床表现的是","pre":"","o":[["A","平素体虚"],["B","脘腹痞满，反复发作"],["C","喜揉喜按"],["D","脘腹痞满，按之加重"],["E","食少纳呆，脉虚无力"]],"a":"D","x":"实痞多见于体壮者，自觉脘腹痞满，按之加重，食后为甚，舌苔厚腻，脉实有力。故选D。","p":"p3"},{"n":10,"t":"A1型","q":"治疗胃痞饮食内停，应选用的方剂是","pre":"","o":[["A","三仁汤"],["B","胃苓汤"],["C","保和丸"],["D","清胃散"],["E","连朴饮"]],"a":"C","x":"胃痞饮食内停，治宜消食和胃，行气消痞，方用保和丸加减。故选C。","p":"p4"},{"n":11,"t":"A1型","q":"肝气郁结，乘脾犯胃，气机逆乱，导致痞满不舒者，应选用的方剂是","pre":"","o":[["A","二陈汤"],["B","保和丸"],["C","半夏泻心汤"],["D","越鞠丸合枳术丸加减"],["E","逍遥丸"]],"a":"D","x":"肝气郁结，乘脾犯胃，气机逆乱，此为胃痞肝胃不和证，治宜疏肝解郁，和胃消痞，方用越鞠丸合枳术丸。故选D。","p":"p6"},{"n":12,"t":"A1型","q":"脘腹胀闷不舒，灼热嘈杂，恶心呕吐，口干不欲饮，口苦，纳少，大便干结或黏滞不畅，舌质红，苔黄腻，脉滑数，应选用的方剂是","pre":"","o":[["A","二陈汤合平胃散"],["B","木香顺气丸"],["C","泻心汤合连朴饮"],["D","越鞠丸和枳术丸"],["E","枳实消痞丸"]],"a":"C","x":"此为胃痞湿热阻胃，治宜清热化湿，和胃消痞，方用泻心汤合连朴饮加减。故选C。","p":"p5"},{"n":13,"t":"A1型","q":"治疗胃痞脾胃虚弱，应选用的方剂是","pre":"","o":[["A","参苓白术散"],["B","益胃汤"],["C","补中益气汤"],["D","理中汤"],["E","四君子汤"]],"a":"C","x":"胃痞脾胃虚弱，治宜补气健脾，升清降浊，方用补中益气汤。故选C。","p":"p7"},{"n":14,"t":"A1型","q":"治疗胃痞胃阴不足，应选用的方剂是","pre":"","o":[["A","益胃汤"],["B","沙参麦冬汤"],["C","桑白皮汤"],["D","参苓白术散"],["E","枳实消痞丸"]],"a":"A","x":"胃痞胃阴不足，治宜养阴益胃，调中消痞，方用益胃汤。故选A。","p":"p7"},{"n":15,"t":"A1型","q":"治疗胃痞痰湿郁久化热，出现口苦、苔黄者，应选用的方剂是","pre":"","o":[["A","黄连温胆汤"],["B","左金丸"],["C","三仁汤"],["D","龙胆泻肝汤"],["E","清胃散"]],"a":"A","x":"治疗胃痞痰湿中阻，可用平胃散合二陈汤加减，若痰湿郁久化热而口苦、舌苔黄者，改用黄连温胆汤。故选A。","p":"p5"},{"n":16,"t":"A1型","q":"治疗胃痞痰湿中阻，应选用的方剂是","pre":"","o":[["A","旋覆代赭汤"],["B","平胃散合二陈汤"],["C","半夏泻心汤"],["D","生姜泻心汤"],["E","益胃汤"]],"a":"B","x":"胃痞痰湿中阻，治宜除湿化痰，理气和中，可用平胃散合二陈汤加减。故选B。","p":"p5"},{"n":17,"t":"A1型","q":"痰阻气逆，心下痞硬，嗳气不止者，应选用的方剂是","pre":"","o":[["A","益胃汤"],["B","柴胡疏肝散"],["C","旋覆代赭汤"],["D","化肝煎"],["E","理中汤"]],"a":"C","x":"胃痞痰湿中阻，若痰阻气逆，心下痞硬，嗳气不止者，加旋覆花、代赭石，或用旋覆代赭汤加减。故选C。","p":"p5"},{"n":18,"t":"A1型","q":"实痞饮食内停，食积化热，大便秘结者，应选用的方剂是","pre":"","o":[["A","黄连温胆汤"],["B","枳实消痞丸"],["C","枳实导滞丸"],["D","龙胆泻肝汤"],["E","保和丸"]],"a":"C","x":"实痞饮食内停，若食积化热，大便秘结者，加大黄、槟榔，或用枳实导滞丸消食导滞。故选C。","p":"p4"},{"n":19,"t":"A1型","q":"胃痞治疗中应注意，无论补泻，用药不可过于峻猛，以免重伤","pre":"","o":[["A","肝、脾"],["B","脾、胃"],["C","心、肺"],["D","肺、胃"],["E","心、肾"]],"a":"B","x":"胃痞以调理脾胃升降、行气除痞消满为基本治则，但治疗中应注意，无论补泻，用药不可过于峻猛，以免重伤脾胃。故选B。","p":"p3"},{"n":20,"t":"A1型","q":"下列关于胃痞预防调护的说法错误的是","pre":"","o":[["A","饮食忌暴饮暴食、辛辣生冷、醇酒厚味"],["B","保持心态平和，调畅情志"],["C","生活起居有常，适当锻炼，增强体质"],["D","素体虚弱者，可日常使用峻补滋腻之品，提高免疫力"],["E","在脾经、胃经、肝经的相关穴位上，进行针刺、艾灸等治疗"]],"a":"D","x":"素体虚弱者，日常使用峻补滋腻之品，易损伤脾胃。故选D。","p":"p8"},{"n":21,"t":"A2型","q":"患者，女，40岁。近来感胃脘痞塞，满闷不舒，按之柔软，压之不痛，望无胀形，时轻时重，反复发作。其最可能的诊断是","pre":"","o":[["A","胃痛"],["B","鼓胀"],["C","胸痹"],["D","胃痞"],["E","结胸"]],"a":"D","x":"胃痞以自觉心下痞塞胀满不舒为主症，触之无形，按之柔软，压之无痛。胃痛可见心下胃脘部疼痛不舒；鼓胀可见腹部胀大如鼓，青筋暴露；胸痹可见胸部疼痛，甚则痛彻胸背，不能平卧；积聚可见腹内结块，或伴有腹痛或腹胀。故选D。","p":"p2"},{"n":22,"t":"A2型","q":"患者，男，56岁。脘腹满闷而胀，进食尤甚，嗳腐吞酸，厌食呕吐，大便秘结，矢气频作，味臭如败卵，舌苔厚腻，脉滑。应选用的方剂是","pre":"","o":[["A","生姜泻心汤"],["B","保和丸"],["C","平胃散合二陈汤加减"],["D","越鞠丸"],["E","补中益气汤"]],"a":"B","x":"患者辨证为胃痞饮食内停，治宜消食和胃，行气消痞，方用保和丸加减。故选B。","p":"p4"},{"n":23,"t":"A2型","q":"患者，男，23岁。昨日暴饮暴食后出现脘腹痞闷而胀，进食尤甚，无明显腹痛，嗳腐吞酸，矢气频作，味臭如败卵，舌苔厚腻，脉滑。其最可能的诊断是","pre":"","o":[["A","胃痛，脾胃虚寒"],["B","胃痛，湿热中阻"],["C","胃痞，饮食内停"],["D","胃痞，肝胃不和"],["E","胃痞，肝气犯胃"]],"a":"C","x":"患者脘腹痞闷而胀，进食尤甚，无明显腹痛，故辨为胃痞；暴饮暴食后出现上述症状，伴嗳腐吞酸，矢气频作，味臭如败卵，舌苔厚腻，脉滑，属饮食内停证。故选C。","p":"p2"},{"n":24,"t":"A2型","q":"患者，女，76岁。平素久病体虚，近日突觉脘腹满闷，时轻时重，喜温喜按，纳呆便溏，神疲乏力，少气懒言，语声低微，舌质淡，苔薄白，脉细弱。治疗应选用的方剂是","pre":"","o":[["A","参苓白术散"],["B","补中益气汤"],["C","理中丸"],["D","六君子汤"],["E","香砂六君子汤"]],"a":"B","x":"患者平素久病体虚，突觉脘腹满闷，时轻时重，喜温喜按，纳呆便溏，神疲乏力，少气懒言，语声低微，舌质淡，苔薄白，脉细弱，辨证为胃痞脾胃虚弱，方用补中益气汤。故选B 痞胃阴不足证治疗应选用的方剂是","pre":"","o":[["A","枳实消痞丸"],["B","补中益气汤"],["C","益胃汤"],["D","越鞠丸合枳术丸"],["E","二陈平胃散"]],"a":"C","x":"胃痞胃阴不足，应选用益胃汤。故选C。","p":"p7"},{"n":50,"t":"B型","q":"脘腹痞塞不舒，胸膈满闷，身重困倦，头昏纳呆，嗳气呕恶，口淡不渴，舌苔白厚腻，脉沉滑。其证候类型是","pre":"","o":[["A","饮食内停"],["B","痰湿中阻"],["C","湿热阻胃"],["D","肝胃不和"],["E","胃阴不足"]],"a":"B","x":"患者身重困倦，头昏纳呆，嗳气呕恶，口淡不渴，舌苔白厚腻，脉沉滑，均为痰湿中阻所致。故选B。","p":"p5"},{"n":51,"t":"B型","q":"脘腹胀闷不舒，灼热嘈杂，恶心呕吐，口干不欲饮，口苦，纳少，大便不畅，舌质红，苔黄腻，脉滑数。其证候类型是","pre":"","o":[["A","饮食内停"],["B","痰湿中阻"],["C","湿热阻胃"],["D","肝胃不和"],["E","胃阴不足"]],"a":"C","x":"患者口干不欲饮，口苦，纳少，大便不畅，舌质红，苔黄腻，脉滑数，均为湿热阻胃所致。故选C。","p":"p5"},{"n":52,"t":"B型","q":"胃痞饮食内停，其治法为","pre":"","o":[["A","燥湿健脾，化痰理气"],["B","补气健脾，升清降浊"],["C","消食和胃，行气消痞"],["D","清热化湿，和胃消痞"],["E","疏肝解郁，和胃消痞"]],"a":"C","x":"胃痞饮食内停，治宜消食和胃，行气消痞。故选C。","p":"p4"},{"n":53,"t":"B型","q":"胃痞肝胃不和，其治法为","pre":"","o":[["A","燥湿健脾，化痰理气"],["B","补气健脾，升清降浊"],["C","消食和胃，行气消痞"],["D","清热化湿，和胃消痞"],["E","疏肝解郁，和胃消痞"]],"a":"E","x":"胃痞肝胃不和，治宜疏肝解郁，和胃消痞。故选E。","p":"p6"},{"n":54,"t":"B型","q":"胃痞湿热阻胃，若胃中灼热、嘈杂明显者，可在原方基础上加用","pre":"","o":[["A","紫苏梗、桔梗、藿香"],["B","蒲公英、连翘、瓦楞子"],["C","党参、白术、砂仁"],["D","竹茹、白蔻仁、生姜"],["E","蚕砂、皂角子、泽泻"]],"a":"B","x":"胃痞湿热阻胃，若胃中灼热、嘈杂明显者，可在原方基础上加用蒲公英、连翘、瓦楞子清热和胃。故选B。","p":"p5"},{"n":55,"t":"B型","q":"胃痞湿热阻胃，若恶心呕吐明显者，可在原方基础上加用","pre":"","o":[["A","紫苏梗、桔梗、藿香"],["B","蒲公英、连翘、瓦楞子"],["C","党参、白术、砂仁"],["D","竹茹、白蔻仁、生姜"],["E","蚕砂、皂角子、泽泻"]],"a":"D","x":"胃痞湿热阻胃，若恶心呕吐明显者，可在原方基础上加用竹茹、白蔻仁、生姜降逆止呕。故选D。","p":"p5"},{"n":56,"t":"多选","q":"关于胃痞与鼓胀的鉴别，下列不属于胃痞特征的是","pre":"","o":[["A","腹壁青筋暴露"],["B","自觉脘腹胀满"],["C","目睛黄染"],["D","胁下癥积坚硬"],["E","腹部按之绷急"]],"a":"ACDE","x":"胃痞与鼓胀均可自觉脘腹胀满。胃痞为中焦气机不利，脾胃升降失司所致，以自觉满闷不舒、外无胀形为特征；鼓胀基本病理变化为肝、脾、肾受损，气滞、血瘀、水停腹中，以腹部胀大如鼓、皮色苍黄、脉络暴露为主症。故选A、C、D、E。","p":"p2"},{"n":57,"t":"多选","q":"下列关于胃痞治则治法的叙述正确的是","pre":"","o":[["A","以调理脾胃升降、行气除痞消满为基本原则"],["B","根据其虚实分治"],["C","虚实夹杂者补泻并用"],["D","治疗中应注意，无论补泻，用药不可过于峻猛，以免重伤脾胃"],["E","补虚重在健脾益气，或养阴益胃"]],"a":"ABCDE","x":"胃痞的治疗要以调理脾胃升降、行气除痞消满为基本原则。根据其虚实分治，实者泻之，虚者补之，虚实夹杂者补泻并用。补虚重在健脾益气，或养阴益胃。祛邪则视具体证候，分别施以消食导滞、除湿化痰、理气解郁、清热祛湿等法。治疗中应注意，无论补泻，用药不可过于峻猛，以免重伤脾胃。故选A、B、C、D、E。","p":"p3"},{"n":58,"t":"多选","q":"下列属于胃痞辨证要点的是","pre":"","o":[["A","虚实"],["B","寒热"],["C","缓急"],["D","久暂"],["E","在气在血"]],"a":"AB","x":"胃痞在辨证时应注意辨别虚实、寒热。故选A、B。","p":"p3"}]},"07-03":{"name":"呕吐","lecture":"7-3 呕吐.pdf","points":[{"id":"p1","name":"概念与病因病机","teach":"<p><b>呕吐<\/b>：胃内容物由口中吐出为主症。<mark>有物有声为呕<\/mark>，有物无声为吐，有声无物为干呕。<\/p><ul><li>病因：外邪犯胃、饮食不节、情志失调、脾胃虚弱（没有房劳）。外邪以<b>寒邪<\/b>最多（最易损耗中阳）。<\/li><li>基本病机：<b>胃失和降，胃气上逆<\/b>。<\/li><li>病位在胃，与<b>肝、脾<\/b>密切相关。<\/li><li>性质分虚实，可相互转化、兼杂。<\/li><\/ul>","src":"讲义 7-3 概述、病因、病机; 题库 #1 #5 #6 #7 #8 #68 解析"},{"id":"p2","name":"诊断与鉴别","teach":"<table><thead><tr><th>鉴别<\/th><th>呕吐<\/th><th>对方<\/th><\/tr><\/thead><tbody><tr><td>反胃<\/td><td>吐无定时，吐食物或痰涎清水<\/td><td><mark>朝食暮吐，暮食朝吐<\/mark>，宿食不化<\/td><\/tr><tr><td>噎膈<\/td><td>进食顺畅，吐无定时，病缓，预后较好<\/td><td>吞咽受阻，<mark>食入即吐<\/mark>，进行性加剧，预后差<\/td><\/tr><tr><td>呃逆<\/td><td>胃内容物从口而出<\/td><td>气冲喉间，呃呃连声，声短而频<\/td><\/tr><\/tbody><\/table><p>病例“突然呕吐，频频泛恶”→ 诊呕吐。“食入即吐”“进行性加剧”是噎膈的特点，不属呕吐。<\/p>","src":"讲义 7-3 鉴别诊断; 题库 #44 #75 解析"},{"id":"p3","name":"辨证要点与治则","teach":"<ul><li>以虚实为纲。实：外邪、饮食所伤，<b>病程短、来势急、吐出物多<\/b>。虚：病程长、来势缓、吐出物少、倦怠乏力（“时发时止”属虚）。<\/li><li>看呕吐物：<mark>酸腐量多、气味难闻 → 宿食留胃<\/mark>；清水痰涎 → 痰饮；泛酸善怒 → 肝气；吐苦水 → 胆热；干呕嘈杂 → 胃阴不足；纳多即吐 → 脾胃虚寒。<\/li><\/ul><p>基本治法：<b>和胃降逆<\/b>。偏实者祛邪：解表、消食、化痰、理气；偏虚者扶正：健脾益气、温中散寒、养阴和胃。<\/p>","src":"讲义 7-3 辨证要点、治则治法; 题库 #9 #10 #13 #72 #73 #74 解析"},{"id":"p4","name":"外邪犯胃","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>外邪犯胃<\/td><td><mark>突然呕吐，伴恶寒发热、头身疼痛<\/mark>（发病急、有表证），胸脘满闷，苔白腻，脉濡。<\/td><td>疏邪解表，化浊和中<\/td><td>藿香正气散<\/td><\/tr><\/tbody><\/table><p>证机：外邪犯胃，中焦气滞，浊气上逆。<\/p><ul><li>表邪偏重 → 加荆芥、防风<\/li><li>宿食积滞，脘胀嗳腐 → 加神曲、鸡内金、莱菔子<\/li><li>气机阻滞，脘闷腹胀 → 加木香、枳壳<\/li><li>感受暑湿，身热心烦 → <mark>去生姜<\/mark>，加黄连、香薷、荷叶<\/li><li>秽浊犯胃，苔白腻 → 加玉枢丹<\/li><\/ul>","src":"讲义 7-3 证治分类 1; 题库 #18 #21 #22 #23 #39 #45 #46 #55 #57 #58 #59 #60 #61 解析"},{"id":"p5","name":"饮食停滞","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>饮食停滞<\/td><td><mark>呕吐酸腐量多<\/mark>或吐未消化食物，吐后反快，嗳气厌食，脘腹胀满，大便秽臭或秘或溏，苔厚腻，脉滑实。<\/td><td>消食化滞，和胃降逆<\/td><td>保和丸<\/td><\/tr><\/tbody><\/table><ul><li>伤肉食 → 重用山楂<\/li><li>伤米食 → 加谷芽<\/li><li>伤豆制品 → 加生萝卜汁<\/li><li>鱼蟹积 → 加苏叶、生姜<\/li><li>酒积 → 重用神曲，加蔻仁、枳椇子、葛花<\/li><li>食滞在肠，腹胀拒按或便秘 → 合<b>小承气汤<\/b><\/li><li>积热上冲，<mark>食已即吐<\/mark>，口臭苔黄 → 加黄芩、黄连<\/li><\/ul>","src":"讲义 7-3 证治分类 2; 题库 #24 #25 #38 #56 #62 #63 #66 #67 #69 解析"},{"id":"p6","name":"痰饮内阻","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰饮内阻<\/td><td><mark>呕吐清水痰涎，胃部如囊裹水<\/mark>，脘痞，纳差，头眩，心悸，或消瘦，苔白滑或腻，脉沉弦滑。<\/td><td>温化痰饮，和胃降逆<\/td><td>小半夏汤合苓桂术甘汤（前方和胃降逆，后方温阳化饮）<\/td><\/tr><\/tbody><\/table><p>证机：中阳不振，痰饮内停，胃气上逆。<\/p><ul><li>脘闷不食 → 加白蔻仁、砂仁<\/li><li>湿阻中焦、苔厚 → 加苍术、厚朴、枳实<\/li><li>痰郁化热：<mark>口苦，心烦，苔黄腻<\/mark>（或误投温补后加重）→ 改<b>黄连温胆汤<\/b>，清热化痰，和胃止呕<\/li><\/ul><p>“酸腐量多、大便秽臭”是饮食停滞，不是本证。<\/p>","src":"讲义 7-3 证治分类 3; 题库 #17 #26 #27 #33 #36 #47 #48 #49 #53 #64 #71 解析"},{"id":"p7","name":"肝气犯胃","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝气犯胃<\/td><td><mark>呕吐吞酸，嗳气频频，脘胁胀痛，每遇情志失调发作或加重<\/mark>，舌边红，苔薄腻或微黄，脉弦。<\/td><td>疏肝和胃，降逆止呕<\/td><td>半夏厚朴汤合左金丸<\/td><\/tr><\/tbody><\/table><p>证机：肝气不舒，横逆犯胃，胃失和降。<\/p><ul><li>呕吐日久、诸药无效、<mark>胸胁刺痛、舌有瘀斑<\/mark> → 加桃仁、红花等活血化瘀<\/li><li>肝郁化热、心烦口渴 → 加竹茹、黄芩、芦根<\/li><li>呕吐苦水或黄绿水（胆热犯胃）→ 黄连温胆汤合左金丸<\/li><\/ul>","src":"讲义 7-3 证治分类 4; 题库 #14 #15 #28 #29 #30 #37 #41 #54 解析（讲义代表方只写半夏厚朴汤，常用药含吴茱萸、黄连；按题库“半夏厚朴汤合左金丸”）"},{"id":"p8","name":"脾胃虚寒vs胃阴不足","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>脾胃虚寒<\/td><td>饮食稍有不慎即吐，<mark>时发时止，食入难化<\/mark>，面白倦怠，四肢不温，便溏，舌淡脉濡弱<\/td><td>温中健脾，和胃降逆<\/td><td>理中汤<\/td><\/tr><tr><td>胃阴不足<\/td><td>反复呕吐或<mark>时作干呕<\/mark>，似饥不欲食，嘈杂，口干咽燥，舌红少津苔少，脉细数<\/td><td>滋养胃阴，降逆止呕<\/td><td>麦门冬汤<\/td><\/tr><\/tbody><\/table><ul><li>虚寒证机：脾胃虚寒，失于温煦，运化失职；嗳气频、中脘痞硬 → 加代赭石、旋覆花、枳壳。“朝食暮吐”是反胃，不属本证。<\/li><li>胃阴证机：胃阴不足，失于濡润，和降失司；阴虚重、便燥、舌红无苔 → 加生地黄、天花粉、火麻仁、白蜜。“嗳气吞酸”不属本证。<\/li><\/ul>","src":"讲义 7-3 证治分类 5、6; 题库 #11 #12 #16 #31 #32 #34 #35 #40 #42 #43 #50 #51 #52 #65 #70 解析（讲义作理中丸，题库作理中汤）"},{"id":"p9","name":"医家与调护","teach":"<ul><li>《素问·至真要大论》：“诸呕吐酸，暴注下迫，皆属于<b>热<\/b>”；“诸逆冲上，皆属于<b>火<\/b>”。<\/li><li><b>张仲景<\/b>《金匮要略》：最早认识呕吐是排出胃中有害物质的<mark>保护性反应<\/mark>；“食已即吐者，<b>大黄甘草汤<\/b>主之”。<\/li><li>孙思邈《备急千金要方》：<b>生姜<\/b>为“呕家圣药”。<\/li><li>张景岳：呕吐最当详辨虚实。<\/li><li>调护：饮食清淡，少量多餐；药汁<b>不可<\/b>加蒜汁等刺激物。<\/li><\/ul>","src":"讲义 7-3 历代沿革、预防调护; 题库 #2 #3 #4 #19 #20 解析"}],"q":[{"n":1,"t":"A1型","q":"前人谓“呕”是指","pre":"","o":[["A","无物有声"],["B","有物有声"],["C","无物无声"],["D","有物无声"],["E","嗳气声缓"]],"a":"B","x":"有物有声谓之“呕”，有物无声谓之“吐”，无物有声谓之“干呕”。故选B。","p":"p1"},{"n":2,"t":"A1型","q":"《素问·至真要大论》云：“诸呕吐酸，暴注下迫，皆属于＿＿＿＿。”“诸逆冲上，皆属于＿＿＿＿。”","pre":"","o":[["A","湿；热"],["B","湿；火"],["C","热；湿"],["D","热；火"],["E","火；热"]],"a":"D","x":"《素问·至真要大论》云：“诸呕吐酸，暴注下迫，皆属于热。”“诸逆冲上，皆属于火。”故选D。","p":"p9"},{"n":3,"t":"A1型","q":"最早认识到呕吐是人体排出胃中有害物质保护性反应的是","pre":"","o":[["A","孙思邈"],["B","朱震亨"],["C","张仲景"],["D","张景岳"],["E","刘完素"]],"a":"C","x":"东汉·张仲景在《金匮要略》中认识到呕吐是人体排出胃中有害物质的保护性反应。故选C。","p":"p9"},{"n":4,"t":"A1型","q":"孙思邈《备急千金要方》中所指呕家圣药是","pre":"","o":[["A","半夏"],["B","生姜"],["C","吴茱萸"],["D","藿香"],["E","竹茹"]],"a":"B","x":"孙思邈《备急千金要方·呕吐呃逆》谓：“凡呕者多食生姜，此是呕家圣药。”故选B。","p":"p9"},{"n":5,"t":"A1型","q":"下列不属于引起呕吐主要原因的是","pre":"","o":[["A","外邪侵袭"],["B","房劳过度"],["C","饮食不节"],["D","情志失调"],["E","病后体虚"]],"a":"B","x":"呕吐多由外感时邪、饮食不节、情志失调或素体脾胃虚弱，引起胃失和降，胃气上逆所致。故选B。","p":"p1"},{"n":6,"t":"A1型","q":"呕吐的基本病机是","pre":"","o":[["A","肝气犯胃，胃气上逆"],["B","胃失和降，胃气上逆"],["C","外邪犯胃，胃失和降"],["D","脾胃受损，胃失润降"],["E","食滞伤胃，胃失和降"]],"a":"B","x":"呕吐的基本病机为胃失和降，胃气上逆。胃居中焦，主受纳和腐熟水谷，其气下行，以和降为顺。邪气犯胃，或胃虚失和，气逆于上，则出现呕吐。故选B。","p":"p1"},{"n":7,"t":"A1型","q":"外邪犯胃引起呕吐，以何种邪气最为多见","pre":"","o":[["A","暑"],["B","火"],["C","湿"],["D","风"],["E","寒"]],"a":"E","x":"因寒邪最易损耗中阳，使邪气凝聚胸膈，动扰胃腑，故呕吐以寒邪致病最多。故选E。","p":"p1"},{"n":8,"t":"A1型","q":"呕吐病位在胃，与哪些脏腑密切相关","pre":"","o":[["A","脾、肺"],["B","肝、脾"],["C","脾、肾"],["D","肝、肾"],["E","肝、胆"]],"a":"B","x":"呕吐病位在胃，与肝、脾二脏关系密切。胃为仓廪之官，主受纳水谷，以和降为顺，若邪气侵扰，胃气不降则上逆为吐，故其病位在胃。脾主运化，以升为健，与胃互为表里，若脾阳素虚，或饮食所伤，则脾失健运，饮食难化，或水谷不归正化，聚湿为痰为饮，停蓄于胃，胃失和降而为吐。肝主疏泄，有调节脾胃升降的功能，若情志所伤，肝气郁结，或气郁化火，横逆犯胃，胃气上逆亦可致吐。故选B。","p":"p1"},{"n":9,"t":"A1型","q":"呕吐的基本治法是","pre":"","o":[["A","健脾化湿"],["B","温养脾胃"],["C","补中益气"],["D","养阴和胃"],["E","和胃降逆"]],"a":"E","x":"呕吐以和胃降逆为基本治法，但应根据虚实之不同分别给予治疗。故选E。","p":"p3"},{"n":10,"t":"A1型","q":"下列不属于呕吐实证特点的是","pre":"","o":[["A","发病较急"],["B","病程较短"],["C","多由外邪及饮食所伤而致"],["D","有邪实之象"],["E","时发时止"]],"a":"E","x":"实证呕吐多由外邪、饮食所伤而致，病程短，来势急，呕吐剧烈，或呕吐不止，吐出物较多。故选E。","p":"p3"},{"n":11,"t":"A1型","q":"下列除哪项外，均为呕吐胃阴不足证的常见临床表现","pre":"","o":[["A","呕吐反复发作或时作干呕"],["B","似饥而不欲食"],["C","嗳气吞酸"],["D","口干咽燥"],["E","舌红少津"]],"a":"C","x":"呕吐胃阴不足临床表现为呕吐反复发作，或时作干呕，恶心，似饥而不欲食，胃脘嘈杂，口干咽燥，舌红少津，苔少，脉细数。故选C。","p":"p8"},{"n":12,"t":"A1型","q":"治疗呕吐脾胃虚寒，首选的方剂是","pre":"","o":[["A","香砂四君子汤"],["B","参苓白术散"],["C","七味白术散"],["D","理中汤"],["E","黄芪建中汤"]],"a":"D","x":"理中汤温中健脾，和胃降逆，主治脾胃虚寒证。故选D。","p":"p8"},{"n":13,"t":"A1型","q":"宿食留胃的呕吐特点是","pre":"","o":[["A","呕吐酸腐量多，气味难闻"],["B","呕吐清水痰涎"],["C","呕吐反酸"],["D","呕吐苦水"],["E","干呕嘈杂"]],"a":"A","x":"呕吐酸腐量多，气味难闻者，为宿食留胃。故选A。","p":"p3"},{"n":14,"t":"A1型","q":"呕吐吞酸，嗳气频作，胸胁满痛，脉弦，其证候类型是","pre":"","o":[["A","胃阴亏虚"],["B","外邪犯胃"],["C","肝郁化火"],["D","肝气犯胃"],["E","以上均非"]],"a":"D","x":"呕吐肝气犯胃可见呕吐吞酸，或干呕泛恶，脘胁胀痛，烦闷不舒，嗳气频频，每遇情志失调而发作或加重，舌边红，苔薄腻或微黄，脉弦。故选D。","p":"p7"},{"n":15,"t":"A1型","q":"治疗肝气犯胃所致呕吐，应首选","pre":"","o":[["A","柴胡疏肝散"],["B","半夏厚朴汤合左金丸加减"],["C","小柴胡汤"],["D","五磨饮子"],["E","藿香正气散"]],"a":"B","x":"肝气犯胃所致呕吐，其证机概要为肝气不舒，横逆犯胃，胃失和降，治当疏肝和胃，降逆止呕，方选半夏厚朴汤合左金丸加减。故选B。","p":"p7"},{"n":16,"t":"A1型","q":"下列哪项不是呕吐脾胃虚寒证的常见临床症状","pre":"","o":[["A","朝食暮吐"],["B","面色㿠白"],["C","饮食稍多即吐"],["D","四肢不温"],["E","呕吐时作时止"]],"a":"A","x":"呕吐脾胃虚寒临床表现为饮食稍有不慎，即易呕吐，时发时止，食入难化，胸脘痞闷，不思饮食，面色㿠白，倦怠乏力，四肢不温，口干不欲饮，大便溏薄，舌质淡，脉濡弱。朝食暮吐为反胃的临床表现。故选A。","p":"p8"},{"n":17,"t":"A1型","q":"下列不属于呕吐痰饮内阻的常见临床表现的是","pre":"","o":[["A","呕吐清水痰涎"],["B","脘闷不食"],["C","头眩心悸"],["D","呕吐酸腐量多，大便秽臭"],["E","胃部如囊裹水"]],"a":"D","x":"呕吐痰饮内阻临床表现为呕吐清水痰涎，或胃部如囊裹水，脘痞满闷，纳谷不佳，头眩，心悸，或逐渐消瘦，舌苔白滑或腻，脉沉弦滑。呕吐酸腐量多，大便秽臭，不属于呕吐痰饮内阻证的常见临床表现。故选D。","p":"p6"},{"n":18,"t":"A1型","q":"呕吐实证，因外邪犯胃，中焦气滞，浊气上逆所致者，其治法是","pre":"","o":[["A","温中健脾，和胃降逆"],["B","疏肝和胃，降逆止呕"],["C","疏邪解表，化浊和中"],["D","和胃降逆，消食滞"],["E","温化痰饮，和胃降逆"]],"a":"C","x":"外邪犯胃，中焦气滞，浊气上逆而引起的呕吐，治疗应以疏邪解表、化浊和中为法。故选C。","p":"p4"},{"n":19,"t":"A1型","q":"《金匮要略·呕吐哕下利病脉证治》言：“食已即吐者，＿＿＿＿主之。”","pre":"","o":[["A","苓桂术甘汤"],["B","大黄甘草汤"],["C","小半夏汤"],["D","黄芪建中汤"],["E","半夏泻心汤"]],"a":"B","x":"《金匮要略·呕吐哕下利病脉证治》篇提到“食已即吐者，大黄甘草汤主之”。故选B。","p":"p9"},{"n":20,"t":"A1型","q":"下列关于呕吐的预防和调护，错误的是","pre":"","o":[["A","服药应少量频服为佳"],["B","起居有节，生活有常"],["C","避免进食腥秽之物"],["D","胃中积热者应忌食辛辣、香燥之品"],["E","服药前，药汁中可加入少量蒜汁"]],"a":"E","x":"蒜汁属于刺激性食物，食入后会导致呕吐加重。故选E。","p":"p9"},{"n":21,"t":"A2型","q":"患者，女，30岁。昨日不慎受凉，今日突然呕吐，胸脘满闷，发热恶寒，头身疼痛，舌苔白腻，脉濡缓。其最可能的诊断是","pre":"","o":[["A","呕吐，外邪犯胃"],["B","呕吐，痰饮内阻"],["C","呕吐，脾胃虚寒"],["D","感冒，风寒束表"],["E","痞满，痰湿中阻"]],"a":"A","x":"呕吐外邪犯胃的特点为突然呕吐，频频泛恶，胸脘满闷，伴有恶寒发热，头身疼痛，舌苔白腻，脉濡。故选A。","p":"p4"},{"n":22,"t":"A2型","q":"患者，女，28岁。昨日下班冒雨感寒，后突发呕吐，伴有恶寒头痛，胸脘满闷，舌苔白腻，脉濡。其治疗应首选","pre":"","o":[["A","左金丸"],["B","白虎汤"],["C","藿香正气散"],["D","柴胡疏肝散"],["E","暖肝煎"]],"a":"C","x":"患者呕吐由外邪侵袭导致，发病急，伴有表证，属外邪犯胃，治当采用疏邪解表、化浊和中法，方选藿香正气散。故选C。","p":"p4"},{"n":23,"t":"A2型","q":"患者，女，33岁。在外野营，遇寒后突然呕吐，频频泛恶，胸脘痞闷，心中懊，伴有恶寒发热，头身疼痛，舌苔白腻，脉濡。其治宜","pre":"","o":[["A","消食化滞，和胃降逆"],["B","疏邪解表，化浊和中"],["C","疏肝和胃，降逆止呕"],["D","温中健脾，和胃降逆"],["E","滋养胃阴，和胃降逆"]],"a":"B","x":"患者呕吐由外邪侵袭导致，发病急，伴有表证，属外邪犯胃，治当采用疏邪解表、化浊和中法。故选B。","p":"p4"},{"n":24,"t":"A2型","q":"患者，女，37岁。呕吐酸腐，脘腹胀满，吐后反快，嗳气厌食，大便臭秽，舌苔厚腻，脉滑实。其治宜","pre":"","o":[["A","温胃散寒，行气止痛"],["B","消食化滞，和胃降逆"],["C","疏肝解郁，理气止痛"],["D","化瘀通络，和胃止痛"],["E","疏肝泄热，和胃止痛"]],"a":"B","x":"根据患者症状可诊断为呕吐饮食停滞，治宜消食化滞，和胃降逆。故选B。","p":"p5"},{"n":25,"t":"A2型","q":"患者，女，17岁。昨晚进食火锅后出现呕吐酸腐，脘腹胀满，嗳气厌食，大便溏，舌苔厚腻，脉滑实。治疗应首选","pre":"","o":[["A","藿香正气散"],["B","理中丸"],["C","竹茹汤"],["D","保和丸"],["E","平胃散"]],"a":"D","x":"根据患者病史及临床表现，可诊断为呕吐饮食停滞。患者积食内停，中焦塞滞，胃气上逆，治宜消食化滞，和胃降逆，代表方剂为保和丸。故选D。","p":"p5"},{"n":26,"t":"A2型","q":"患者，女，55岁。近来时常呕吐清水痰涎，脘闷不食，头晕心悸，舌苔白腻，脉滑，其证候类型是","pre":"","o :"呕吐饮食停滞，因食鱼、蟹而吐者，应","pre":"","o":[["A","保和丸重用山楂"],["B","保和丸加谷芽"],["C","保和丸重用莱菔子，加麦芽"],["D","保和丸加蔻仁、葛花，重用神曲"],["E","保和丸加苏叶、生姜"]],"a":"E","x":"苏叶、生姜可解鱼蟹毒。故选E。","p":"p5"},{"n":67,"t":"B型","q":"呕吐饮食停滞，因肉食而吐者，应","pre":"","o":[["A","保和丸重用山楂"],["B","保和丸加谷芽"],["C","保和丸重用莱菔子，加麦芽"],["D","保和丸加蔻仁、葛花，重用神曲"],["E","保和丸加苏叶、生姜"]],"a":"A","x":"山楂可助肉食消化，因此重用。故选A。","p":"p5"},{"n":68,"t":"多选","q":"引起呕吐的常见原因有","pre":"","o":[["A","外邪犯胃"],["B","饮食不节"],["C","情志失调"],["D","脾胃虚弱"],["E","跌仆筋伤"]],"a":"ABCD","x":"呕吐多由饮食不节、外感时邪、情志失调或素体脾胃虚弱，引起胃失和降，胃气上逆所致。故选A、B、C、D。","p":"p1"},{"n":69,"t":"多选","q":"呕吐饮食停滞的常见临床表现有","pre":"","o":[["A","嗳气厌食"],["B","呕吐酸腐"],["C","脘腹胀满"],["D","大便秽臭而溏"],["E","苔厚腻"]],"a":"ABCDE","x":"呕吐饮食停滞的常见临床表现为呕吐酸腐量多，或吐出未消化的食物，嗳气厌食，脘腹胀满，大便秽臭，或秘结或溏泻，舌苔厚腻，脉滑实。故选A、B、C、D、E。","p":"p5"},{"n":70,"t":"多选","q":"下列各项哪些是呕吐脾胃虚寒的常见临床表现","pre":"","o":[["A","食入难化"],["B","脘部痞闷"],["C","大便不畅"],["D","食欲不振"],["E","苔白滑"]],"a":"ABD","x":"呕吐脾胃虚寒的常见临床表现为饮食稍有不慎，即易呕吐，时发时止，食入难化，胸脘痞闷，不思饮食，面色㿠白，倦怠乏力，四肢不温，口干不欲饮，大便溏薄，舌质淡，脉濡弱。故选A、B、D。","p":"p8"},{"n":71,"t":"多选","q":"下列各项哪些是呕吐痰饮内阻的常见临床表现","pre":"","o":[["A","脘痞满闷"],["B","呕吐清水痰涎"],["C","脉沉弦滑"],["D","突然呕吐"],["E","食入难化"]],"a":"ABC","x":"呕吐痰饮内阻临床表现为呕吐清水痰涎，或胃部如囊裹水，脘痞满闷，纳谷不佳，头眩，心悸，或逐渐消瘦，舌苔白滑或腻，脉沉弦滑。故选A、B、C。","p":"p6"},{"n":72,"t":"多选","q":"下列各项不属于虚证呕吐特点的是","pre":"","o":[["A","起病较急，病程较短"],["B","发病因素不甚明显"],["C","呕吐量较多"],["D","吐出物多酸臭"],["E","脉实而有力"]],"a":"ACDE","x":"虚证呕吐多为脾胃运化功能减退，病程较长，来势徐缓，吐出物较少，或伴有倦怠乏力等症，A、C、D、E均为实证呕吐特点。故选A、C、D、E。","p":"p3"},{"n":73,"t":"多选","q":"呕吐以和胃降逆为基本治法，但应根据虚实之不同分别给予治疗，偏于实者，治疗时采用","pre":"","o":[["A","解表"],["B","消食"],["C","健脾"],["D","化痰"],["E","理气"]],"a":"ABDE","x":"呕吐偏于实者，治宜祛邪为主，分别采用解表、消食、化痰、理气之法，邪去则呕吐自止。故选A、B、D、E。","p":"p3"},{"n":74,"t":"多选","q":"呕吐以和胃降逆为基本治法，但应根据虚实之不同分别给予治疗，偏于虚者，治疗时采用","pre":"","o":[["A","祛邪解表"],["B","温中散寒"],["C","健脾益气"],["D","养阴和胃"],["E","理气化痰"]],"a":"BCD","x":"呕吐偏于虚者，治宜扶正为主，分别采用健脾益气、温中散寒、养阴和胃等法，正复则呕吐自愈。故选B、C、D。","p":"p3"},{"n":75,"t":"多选","q":"在呕吐与噎膈的鉴别诊断过程中，以下哪项不属于呕吐的特点","pre":"","o":[["A","食入即吐"],["B","进食顺畅"],["C","吞咽受阻"],["D","吐无定时"],["E","预后较好"]],"a":"AC","x":"噎膈是指饮食吞咽受阻，阻塞不顺，甚或汤水不进，食入即吐的病证，病情呈进行性加剧，预后较差。而呕吐多吐无定时，进食顺畅，病情较缓，预后较好。故选A、C。","p":"p2"}]},"07-04":{"name":"噎膈","lecture":"7-4 噎膈.pdf","points":[{"id":"p1","name":"概念与病因病机","teach":"<p><b>噎膈<\/b>：吞咽食物哽噎不顺，饮食难下，或食而复出为主症。噎＝吞咽时哽噎不顺；膈＝饮食格拒不下；噎常是膈的前驱。<\/p><ul><li>病因：七情内伤、酒食不节、久病年老。<\/li><li>基本病机：<mark>气、痰、瘀交结，阻隔于食道、贲门<\/mark>，津气耗伤，胃失通降。<\/li><li>病位在食道，属胃所主，与<b>肝、脾、肾<\/b>密切相关。<\/li><li>本虚标实：初期痰气交阻，多实；继则瘀血内结；晚期阴津枯槁，或阴损及阳、脾肾阳衰。<\/li><\/ul>","src":"讲义 7-4 概述、病因、病机; 题库 #6 #14 #57 解析"},{"id":"p2","name":"诊断与鉴别","teach":"<table><thead><tr><th>鉴别<\/th><th>噎膈<\/th><th>对方<\/th><\/tr><\/thead><tbody><tr><td>反胃<\/td><td>吞咽困难，食不能下，旋食旋吐<\/td><td><mark>无吞咽障碍<\/mark>，食可下，宿谷不化，朝食暮吐，暮食朝吐<\/td><\/tr><tr><td>梅核气<\/td><td>有形之邪阻于食道、贲门<\/td><td>咽中异物感，<mark>饮食咽下顺利<\/mark>，无形气郁痰阻<\/td><\/tr><tr><td>呕吐<\/td><td>食入即吐，进行性加剧<\/td><td>吐无定时，进食顺畅<\/td><\/tr><\/tbody><\/table><p>噎膈伴呕吐时当与反胃、呕吐鉴别。病例“吞咽梗涩而痛，食入即复出”→ 噎膈；“饮食入胃，宿谷不化，良久反出”→ 反胃。<\/p>","src":"讲义 7-4 鉴别诊断; 题库 #41 #47 #48 #58 解析"},{"id":"p3","name":"辨证要点与治则","teach":"<ul><li>辨证首辨<b>虚实<\/b>：初期以实为主（气郁、痰湿、血瘀、瘀结成毒），久病本虚标实。<\/li><li>治则：初期治标——理气、化痰、消瘀；后期治本——滋阴润燥，或补气温阳；虚实兼杂则标本同治。<\/li><li>全程<mark>以顾护津液及胃气为中心<\/mark>。<\/li><\/ul>","src":"讲义 7-4 辨证要点、治则治法、临证备要; 题库 #7 #12 解析"},{"id":"p4","name":"痰气交阻vs瘀血内结","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰气交阻<\/td><td>吞咽梗阻，胸膈痞满，<mark>情志抑郁时加重<\/mark>，嗳气呃逆，呕吐痰涎，舌红苔薄腻，脉弦滑<\/td><td>开郁化痰，润燥降气<\/td><td>启膈散<\/td><\/tr><tr><td>瘀血内结<\/td><td>饮食难下，<mark>呕出物如赤豆汁<\/mark>，胸膈痛固定，面色晦暗，肌肤甲错，舌紫暗，脉细涩<\/td><td>破结行瘀，滋阴养血<\/td><td>通幽汤<\/td><\/tr><\/tbody><\/table><ul><li>启膈散加减：嗳气呕吐、心下痞硬 → 加旋覆花、代赭石；痰涎甚多 → 加半夏、陈皮；气郁化火、心烦口渴 → 加山豆根、栀子、金果榄；便秘 → 加大黄、莱菔子。<\/li><li>胸膈刺痛牵两胁、舌紫、脉弦涩（气滞血瘀）→ 题库也取通幽汤。<\/li><\/ul>","src":"讲义 7-4 证治分类 1、3; 题库 #15 #22 #23 #25 #27 #28 #29 #31 #32 #33 #36 #37 #49 #50 #53 #56 解析（#31 解析治法文字与答案不符，按答案“破结行瘀，滋阴养血”）"},{"id":"p5","name":"津亏热结","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>津亏热结<\/td><td><mark>吞咽梗涩而痛<\/mark>，食入复出，甚则水饮难进，心烦口干，胃脘灼热，五心烦热，消瘦，<b>大便干结如羊粪<\/b>，舌光红干裂少津，脉细数。<\/td><td>滋阴清热，润燥生津<\/td><td>沙参麦冬汤<\/td><\/tr><\/tbody><\/table><p>证机：热毒伤阴，胃阴亏耗，胃失和降。<\/p><ul><li>胃火偏盛 → 加栀子、黄连<\/li><li>大便坚如羊粪 → 加火麻仁、全瓜蒌<\/li><li><mark>烦渴咽燥，食入即吐，吐物酸热，脉大有力<\/mark> → 改<b>竹叶石膏汤加大黄<\/b>，泄热存阴<\/li><li>食道干涩、口燥咽干 → 五汁安中饮<\/li><\/ul>","src":"讲义 7-4 证治分类 2; 题库 #9 #16 #17 #21 #26 #35 #40 #42 #43 #44 #51 #55 解析"},{"id":"p6","name":"气虚阳微","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>气虚阳微<\/td><td>吞咽受阻，饮食不下，<mark>泛吐涎沫，面浮足肿<\/mark>，面色㿠白，形寒气短，精神疲惫，腹胀便溏，舌淡苔白，脉细弱。<\/td><td>温补脾肾<\/td><td>补气运脾汤<\/td><\/tr><\/tbody><\/table><p>证机：脾肾阳虚，温煦失职，气不化津。<\/p><ul><li><mark>中阳不足，痰凝瘀阻<\/mark>（舌淡紫，脉细涩）→ <b>理中汤加姜汁、竹沥<\/b><\/li><li>胃虚气逆，呕吐不止 → 加旋覆花、代赭石<\/li><li>肾阳虚明显 → 加附子、肉桂、鹿角胶、肉苁蓉，或右归丸<\/li><\/ul><p>病例只见气虚（倦怠、少气懒言、便溏、脉细弱）时，题库答案仍取补气运脾汤。<\/p>","src":"讲义 7-4 证治分类 4; 题库 #13 #18 #24 #30 #34 #38 #39 #52 #54 解析（#38 解析写补中益气汤，与答案 D 补气运脾汤不符，按答案；#52 题库选项为“温补脾肾，破瘀散结”，讲义治法为“温补脾肾”）"},{"id":"p7","name":"附 反胃","teach":"<p><b>反胃<\/b>：饮食入胃，宿食不化，经过良久由胃反出；特征<mark>朝食暮吐，暮食朝吐<\/mark>，吐后则舒。《金匮要略》称“<b>胃反<\/b>”。<\/p><ul><li>病因：饮食不当、饥饱无常，嗜食生冷损及脾阳，忧愁思虑伤脾胃 → 中焦阳气不振，不能腐熟。<\/li><li>治则：<b>温中健脾，降逆和胃<\/b>。<\/li><li>脾胃虚寒（神疲，面色青白，手足不温，便溏，脉细缓无力）→ <b>丁香透膈汤<\/b>。<\/li><li>日久不愈、腰膝酸冷 → 兼<mark>温补肾阳<\/mark>；反复呕吐、津气并虚 → 加益气养阴。<\/li><\/ul>","src":"讲义 7-4 附 反胃; 题库 #8 #10 #11 #19 #45 #46 #59 解析"},{"id":"p8","name":"医家与调护","teach":"<ul><li>《素问·阴阳别论》：“三<b>阳<\/b>结，谓之隔”。<\/li><li>严用和《<b>济生方<\/b>》：“调顺阴阳，化痰下气”。<\/li><li><b>朱丹溪<\/b>：“润养津血，降火散结”，以润为通。<\/li><li>张景岳：噎膈与反胃是两个病；温脾滋肾。<\/li><li><b>叶天士<\/b>：<mark>“脘管窄隘”<\/mark>为主要病机。<\/li><li><b>张锡纯<\/b>：<mark>“贲门积有瘀血者十之七八”<\/mark>，重活血化瘀。<\/li><li>调护：饮食<b>营养丰富<\/b>（不是单一），固体难进改流质，时刻顾护胃气；忌烫、辛辣、霉变、烈酒。<\/li><\/ul>","src":"讲义 7-4 历史沿革、预防调护; 题库 #1 #2 #3 #4 #5 #20 解析"}],"q":[{"n":1,"t":"A1型","q":"《素问·阴阳别论》云：“三＿＿＿＿结，谓之隔。”","pre":"","o":[["A","阴"],["B","阳"],["C","气"],["D","血"],["E","痰"]],"a":"B","x":"《素问·阴阳别论》云：“三阳结，谓之隔。”故选B。","p":"p8"},{"n":2,"t":"A1型","q":"提出噎膈“治疗之法，调顺阴阳，化痰下气，阴阳平匀，气顺痰下，膈噎之疾，无由作矣”的著作是","pre":"","o":[["A","《丹溪心法》"],["B","《济生方》"],["C","《景岳全书》"],["D","《医学心悟》"],["E","《临证指南医案》"]],"a":"B","x":"《济生方·呕吐翻胃噎膈门》云：“其为病也，令人胸膈痞闷，呕逆噎塞，妨碍饮食，胸痛彻背，或胁下支满，或心忡喜忘，咽气不舒。治疗之法，调顺阴阳，化痰下气，阴阳平匀，气顺痰下，膈噎之疾，无由作矣。”故选B。","p":"p8"},{"n":3,"t":"A1型","q":"对于噎膈的治疗，提出“润养津血，降火散结”治法，侧重以润为通的医家是","pre":"","o":[["A","叶天士"],["B","徐灵胎"],["C","张景岳"],["D","王清任"],["E","朱丹溪"]],"a":"E","x":"元·朱丹溪《脉因证治·噎膈》云：“血液俱耗，胃脘亦槁，在上近咽之下……名之曰噎。其槁在下，与胃为近……名之曰膈。”提出了“润养津血，降火散结”治法，侧重以润通为治。故选E。","p":"p8"},{"n":4,"t":"A1型","q":"首先指出噎膈病的基本病机为“脘管窄隘”的医家是","pre":"","o":[["A","朱丹溪"],["B","徐灵胎"],["C","张景岳"],["D","张锡纯"],["E","叶天士"]],"a":"E","x":"清·叶天士《临证指南医案·噎膈反胃》指出“脘管窄隘”为本病的主要病机。故选E。","p":"p8"},{"n":5,"t":"A1型","q":"首先指出噎膈病与“贲门积有瘀血”有关的医家是","pre":"","o":[["A","朱丹溪"],["B","徐灵胎"],["C","张景岳"],["D","张锡纯"],["E","叶天士"]],"a":"D","x":"张锡纯《医学衷中参西录》认为，噎膈“不论何因，其贲门积有瘀血者十之七八”，强调活血化瘀在治疗中的重要性，并指出“瘀血之根蒂未净，是以有再发之”。故选D。","p":"p8"},{"n":6,"t":"A1型","q":"噎膈基本病机为","pre":"","o":[["A","痰瘀化热，脾肾阳气衰败"],["B","脾肾亏虚，津液枯槁"],["C","气、痰、瘀交结，阻隔于食道、贲门，津气耗伤，胃失通降"],["D","气虚阳微"],["E","津亏热结"]],"a":"C","x":"噎膈的基本病机为气、痰、瘀交结，阻隔于食道、贲门所致，可引起食道、贲门拘急、狭窄。故选C。","p":"p1"},{"n":7,"t":"A1型","q":"噎膈辨证首辨","pre":"","o":[["A","表里"],["B","寒热"],["C","虚实"],["D","阴阳"],["E","气血"]],"a":"C","x":"噎膈的治疗应分清标本虚实，主次兼顾。故选C。","p":"p3"},{"n":8,"t":"A1型","q":"食后脘腹胀满，朝食暮吐，暮食朝吐，宿谷不化，吐后则舒，神疲乏力，面色青白，手足不温，大便溏少，舌淡，苔白腻，脉细缓无力。治疗应首选","pre":"","o":[["A","丁香柿蒂汤"],["B","丁香透膈汤"],["C","丁香柿蒂散"],["D","小半夏汤"],["E","小半夏加茯苓汤"]],"a":"B","x":"食后脘腹胀满，朝食暮吐，暮食朝吐，宿谷不化，吐后则舒，诊断为反胃。神疲乏力，面色青白，手足不温，大便溏少，舌淡，苔白腻，脉细缓无力，辨为脾胃虚寒证，方选丁香透膈汤。故选B。","p":"p7"},{"n":9,"t":"A1型","q":"噎膈见吞咽梗涩而痛，食入而复出，甚则水饮难进，心烦口干，胃脘灼热，五心烦热，形体消瘦，皮肤干燥，小便短赤，大便干结如羊粪，舌质光红，干裂少津，脉细数。治疗应首选","pre":"","o":[["A","补气运脾汤"],["B","通幽汤"],["C","补中益气汤"],["D","沙参麦冬汤"],["E","木香顺气散"]],"a":"D","x":"噎膈津亏热结，应滋阴清热，润燥生津，方选沙参麦冬汤。故选D。","p":"p5"},{"n":10,"t":"A1型","q":"反胃的治疗原则是","pre":"","o":[["A","温补肾阳，降逆和胃"],["B","温中健脾，降逆和胃"],["C","健脾益气，降逆和胃"],["D","消食导滞，降逆和胃"],["E","温补脾肾，降气和胃"]],"a":"B","x":"反胃多因脾胃损伤，中焦阳气不振所致，故治当温中健脾，降逆和胃。故选B。","p":"p7"},{"n":11,"t":"A1型","q":"食后脘腹胀满，朝食暮吐，暮食朝吐，吐出宿谷不化，吐后即觉舒适，神疲乏力，面色少华，舌淡苔白滑，脉细缓无力。治疗应首选","pre":"","o":[["A","附子理中汤"],["B","大半夏汤"],["C","苓桂术甘汤"],["D","小半夏汤"],["E","丁香透膈汤"]],"a":"E","x":"食后脘腹胀满，朝食暮吐，暮食朝吐，宿谷不化，吐后则舒，诊断为反胃。神疲乏力，面色清白，手足不温，大便溏少，舌淡，苔白腻，脉细缓无力，辨为脾胃虚寒证，方选丁香透膈汤。故选E。","p":"p7"},{"n":12,"t":"A1型","q":"在噎膈发生、进展及转归过程中，治疗应以何为中心","pre":"","o":[["A","开郁与化痰"],["B","行气与活血"],["C","补气与养血"],["D","顾护津液及胃气"],["E","温补脾与肾"]],"a":"D","x":"噎膈治疗常需标本同治，虚实两顾，治疗过程中要时刻以顾护津液及胃气为中心。故选D。","p":"p3"},{"n":13,"t":"A1型","q":"噎膈气虚阳微治疗应首选","pre":"","o":[["A","参附汤"],["B","实脾散"],["C","通幽汤"],["D","启膈散"],["E","补气运脾汤"]],"a":"E","x":"治疗噎膈气虚阳微的代表方剂为补气运脾汤。故选E。","p":"p6"},{"n":14,"t":"A1型","q":"噎膈的产生除与食道、胃相关外，还与哪些脏腑密切相关","pre":"","o":[["A","肺、肝、肾"],["B","肝、脾、肾"],["C","肺、脾、肾"],["D","肝、脾、肺"],["E","心、肝、肾"]],"a":"B","x":"情志失调，恼怒伤肝，肝失条达，或忧思过度，脾伤气结，可导致气滞、痰阻、血瘀，进一步可导致噎膈。噎膈晚期，阴损及阳，可致脾肾阳气衰败。故选B。","p":"p1"},{"n":15,"t":"A1型","q":"启膈散治噎膈，其体现的治法是","pre":"","o":[["A","疏肝解郁，理气化痰"],["B","破结行瘀，滋阴养血"],["C","滋阴清热，润燥生津"],["D","开郁化痰，润燥降气"],["E","健脾益肺，理气活血"]],"a":"D","x":"启膈散主治噎膈痰气交阻，其治法是开郁化痰，润燥降气。故选D。","p":"p4"},{"n":16,"t":"A1型","q":"噎膈热盛阴伤者，症见烦渴咽燥，噎食难下，或食入即吐，吐物酸热，苔黄燥，舌质红而少津，脉大有力。治疗应首选","pre":"","o":[["A","启膈散加味"],["B","通幽汤加味"],["C","补气运脾汤加味"],["D","竹叶石膏汤加大黄"],["E","沙参麦冬汤加味"]],"a":"D","x":"噎膈烦渴咽燥，噎食难下，或食入即吐，吐物酸热者，可用竹叶石膏汤加大黄泄热存阴。故选D。","p":"p5"},{"n":17,"t":"A1型","q":"吞咽梗涩而痛，食入即复出，甚则水饮难进，心烦口干，胃脘灼热，五心烦热，形体消瘦，皮肤干燥，小便短赤，大便干结如羊粪，舌质光红，干燥少津，脉细数。其最可能的诊断是","pre":"","o":[["A","呕吐，脾胃虚弱"],["B","噎膈，痰气交阻"],["C","噎膈，气虚阳微"],["D","呕吐，胃阴不足"],["E","噎膈，津亏热结"]],"a":"E","x":"噎膈津亏热结表现为吞咽梗涩而痛，食入而复出，甚则水饮难进，心烦口干，胃脘灼热，五心烦热，形体消瘦，皮肤干燥，小便短赤，大便干结如羊粪，舌质光红，干裂少津，脉细数。故选E。","p":"p5"},{"n":18,"t":"A1型","q":"吞咽受阻，饮食不下，泛吐涎沫，面浮足肿，面色㿠白，形寒气短，精神疲惫，腹胀便溏，舌质淡，苔白，脉细弱。其最可能的诊断是","pre":"","o":[["A","呕吐，脾胃虚弱"],["B","反胃，中虚有寒"],["C","水肿，脾阳虚衰"],["D","呕吐，胃阴不足"],["E","噎膈，气虚阳微"]],"a":"E","x":"噎膈气虚阳微主要临床表现为吞咽受阻，饮食不下，泛吐涎沫，面浮足肿，面色㿠白，形寒气短，精神疲惫，腹胀便溏，舌质淡，苔白，脉细弱。故选E。","p":"p6"},{"n":19,"t":"A1型","q":"关于现代反胃，《金匮要略》称为","pre":"","o":[["A","翻胃"],["B","反胃"],["C","胃翻"], const chT=codes=>codes.reduce((a,c)=>a+(st.t[c]||0),0);
const save=()=>{try{localStorage.setItem("nk2",JSON.stringify(st))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const $=s=>document.querySelector(s),app=$("#app");
const rec=id=>st.r[id];                                   // [answeredAt, ok 1/0, correct streak]
const dueAt=r=>r[1]?r[0]+GAP[Math.min(r[2],3)]*DAY:r[0];
const isDue=id=>{const r=rec(id);return !!r&&dueAt(r)<=Date.now()};
const isWrong=id=>{const r=rec(id);return !!r&&!r[1]};
const pname=q=>(CH[q.c].points.find(p=>p.id===q.p)||{}).name||"";
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function stats(qs){let n=0,ok=0;for(const q of qs){const r=rec(q.id);if(r){n++;ok+=r[1]}}return{n,ok,acc:n?ok/n:0,total:qs.length}}
const lvl=s=>!s.n?"":s.acc<.6?"weak":s.acc<.8||s.n<3?"mid":"good";
const partQs=p=>[...new Set(p.ch)].flatMap(c=>CH[c].q);
const pct=s=>s.n?Math.round(s.acc*100)+"%":"—";
/* Estimated understanding: each 考点 weighted by its share of the questions; its score = (right+1)/(answered+2),
   so a 考点 you have not tried counts as 50% and the estimate firms up as you answer more. Uses your latest answer per question. */
function est(qs){const by={};for(const q of qs)(by[q.c+"|"+q.p]??=[]).push(q);let e=0;
  for(const g of Object.values(by)){const s=stats(g);e+=g.length/qs.length*(s.ok+1)/(s.n+2)}return qs.length?e:0}
const estP=qs=>Math.round(est(qs)*100)+"%";

/* What to practise next, from your own answers:
   1 due reviews (wrong ones first)  2 unseen questions in weak points (<80%)
   3 two unseen per untouched point (find out where you stand)  4 the rest, in learning order */
function recommend(qs,n=10){
  const now=Date.now(),seen=new Set(),out=[],add=q=>{if(!seen.has(q.id)&&out.length<n){seen.add(q.id);out.push(q)}};
  qs.filter(q=>isDue(q.id)).sort((a,b)=>rec(a.id)[1]-rec(b.id)[1]||dueAt(rec(a.id))-dueAt(rec(b.id))).forEach(add);
  const by={};for(const q of qs)(by[q.c+"|"+q.p]??=[]).push(q);
  const groups=Object.values(by),unseen=g=>g.filter(q=>!rec(q.id));
  groups.filter(g=>{const s=stats(g);return s.n>=2&&s.acc<.8}).forEach(g=>shuffle(unseen(g)).forEach(add));
  groups.filter(g=>!stats(g).n).forEach(g=>unseen(g).slice(0,2).forEach(add));
  groups.forEach(g=>unseen(g).forEach(add));
  return [...out.slice(0,1),...shuffle(out.slice(1))];   // interleave after the first
}

    return `<button class="opt ${c}" data-l="${l}" aria-pressed="${sel.includes(l)}" ${done?"disabled":""}><b>${l}</b><span>${esc(t)}</span></button>`}).join("")}</div>
  ${done?`<div class="fb"><span class="v ${done===q.a?"ok":"no"}">${done===q.a?"对":"错 · 答案 "+q.a}</span>${esc(q.x)}</div>`:""}
  <div class="dock"><div class="in">${done?`<button class="btn red" id="next">${s.i+1<N?"下一题":"看结果"}</button>`:multi?`<button class="btn" id="sub" ${s.sel?"":"disabled"}>提交</button>`:`<div class="mute" style="text-align:center;padding:12px 0">点一个选项作答</div>`}</div></div>`;
  window.scrollTo(0,0);
  $("#x").onclick=()=>{location.hash=s.back};
  const answer=pick=>{pick=[...pick].sort().join("");s.ans[q.id]=pick;const ok=pick===q.a,r=rec(q.id);
    st.r[q.id]=[Date.now(),ok?1:0,ok?(r&&r[1]?r[2]+1:1):0];save();s.sel="";session()};
  if(!done)app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const l=b.dataset.l;
    if(multi){s.sel=s.sel.includes(l)?s.sel.replace(l,""):s.sel+l;session()}else answer(l)});
  $("#sub")&&($("#sub").onclick=()=>s.sel&&answer(s.sel));
  $("#next")&&($("#next").onclick=()=>{s.i++;session()});
}
function summary(){
  cur=null;
  const s=sess,qs=s.list.map(id=>Q[id]),ok=qs.filter(q=>s.ans[q.id]===q.a).length,bad=qs.filter(q=>s.ans[q.id]&&s.ans[q.id]!==q.a),by={};
  for(const q of qs){const k=CH[q.c].name+" · "+pname(q);(by[k]??=[0,0]);by[k][1]++;if(s.ans[q.id]===q.a)by[k][0]++}
  app.innerHTML=`<div class="k">${esc(s.title)}</div><h1>${ok} / ${qs.length}</h1>
  <h2>按考点</h2>${Object.entries(by).map(([k,[a,n]])=>`<div class="row" style="cursor:default"><i class="dot ${a/n<.6?"weak":a/n<.8?"mid":"good"}"></i><span>${esc(k)}</span><span class="r">${a}/${n}</span></div>`).join("")}
  <div style="margin-top:20px">${bad.length?`<button class="btn red" id="again">再练这轮错的 ${bad.length}</button>`:""}<button class="btn ghost" id="back">返回</button></div>`;
  $("#again")&&($("#again").onclick=()=>start(s.title.replace(/ · 再练$/,"")+" · 再练",bad,s.back));
  $("#back").onclick=()=>{const b=s.back;sess=null;location.hash=b};
}
function render(){
  const h=location.hash.slice(1)||"/",m=h.split("/");
  if(m[1]==="p"&&D.parts[+m[2]])part(+m[2]);
  else if(m[1]==="c"&&CH[m[2]])chapter(m[2]);
  else if(m[1]==="w")wrongBook();
  else if(m[1]==="s")session();
  else home();
}
addEventListener("hashchange",render);render();
</script>
</body>
