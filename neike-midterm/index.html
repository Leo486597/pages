味，或夹有血丝，胸胁胀满，咳时引痛，常伴有面赤，或有身热，口干欲饮，舌红，苔薄黄腻，脉滑数。故选A、B、D、E。","p":"p6"},{"n":64,"t":"多选","q":"治疗咳嗽常需佐以化痰药物，以下哪些药物适宜用于痰热郁肺所致咳嗽","pre":"","o":[["A","浙贝母"],["B","全瓜蒌"],["C","白附子"],["D","鱼腥草"],["E","鲜竹沥"]],"a":"ABDE","x":"浙贝母、全瓜蒌、鱼腥草、鲜竹沥均为清热化痰之品，适用于痰热咳嗽；白附子辛温有毒，常用于治疗中风、惊痫，一般不用于痰热郁肺所致咳嗽。故选A、B、D、E。","p":"p6"}]},"04-03":{"name":"哮病","lecture":"4-3 哮喘.pdf","points":[{"id":"p1","name":"概念与沿革","teach":"<p><b>概念<\/b>：以喉中哮鸣有声、呼吸困难、甚则喘息不能平卧为主症的<b>反复发作性<\/b>疾病。<\/p><table><thead><tr><th>医家/书<\/th><th>贡献<\/th><\/tr><\/thead><tbody><tr><td>《金匮要略》<\/td><td>咳而上气，喉中水鸡声，射干麻黄汤主之<\/td><\/tr><tr><td>巢元方《诸病源候论》<\/td><td>称<mark>「呷嗽」<\/mark>：痰气相击，呼呷有声<\/td><\/tr><tr><td>朱丹溪<\/td><td><mark>首创「哮喘」病名<\/mark>，专主于痰；未发扶正、已发攻邪<\/td><\/tr><tr><td>虞抟《医学正传》<\/td><td>哮以声响言，喘以气息言，<b>明确区分哮与喘<\/b><\/td><\/tr><tr><td>《证治汇补》<\/td><td>壅塞之气 + 非时之感 + 胶固之痰，三者相合发为哮<\/td><\/tr><\/tbody><\/table>","src":"讲义 4-3 概述、历史沿革; 题库 #1 #2 #3 #5 解析（《证治汇补》一句仅见题库）"},{"id":"p2","name":"病因病机","teach":"<ul><li><b>夙根<\/b>：<mark>伏痰<\/mark>（肺不布津、脾不运化、肾不蒸化，津凝成痰，伏于肺）。<\/li><li><b>主要诱因<\/b>：<mark>气候变化<\/mark>；另有饮食、情志、劳累。<\/li><li><b>发作的病理关键<\/b>：<mark>「伏痰」遇感引触<\/mark>，痰随气升，气因痰阻，壅塞气道。<\/li><li><b>病位<\/b>：主要在肺，与肝、脾、肾密切相关。<\/li><li>久发从实转虚，伤及<b>肺、脾、肾<\/b>；严重可由哮致脱。<\/li><\/ul>","src":"讲义 4-3 病因、病机; 题库 #4 #6 #7 #8 #9 #66 解析"},{"id":"p3","name":"诊断与鉴别","teach":"<p><b>诊断<\/b>：发作时喉中哮鸣、呼吸困难、甚则不能平卧；<b>反复发作<\/b>，因气候突变、饮食、情志、劳累诱发；发作前多有<mark>鼻痒、喷嚏、咳嗽、胸闷<\/mark>先兆；平时如常人。可出现喘脱，<b>会危及生命<\/b>。<\/p><table><thead><tr><th><\/th><th>哮病<\/th><th>喘证<\/th><\/tr><\/thead><tbody><tr><td>特征<\/td><td><mark>喉中哮鸣有声<\/mark><\/td><td>呼吸气促困难<\/td><\/tr><tr><td>性质<\/td><td>独立的反复发作性疾病<\/td><td>多种疾病的一个症状<\/td><\/tr><\/tbody><\/table><p>哮必兼喘，喘未必兼哮。张口抬肩、鼻翼扇动、口唇发绀是喘证的描述。支饮：慢性咳喘，发作与间歇界限不清。<\/p>","src":"讲义 4-3 诊断、鉴别诊断; 题库 #10 #11 #47 #64 #65 解析"},{"id":"p4","name":"辨证要点与治则","teach":"<p><b>辨证<\/b>：辨发作期与缓解期（发作期声高气粗、脉有力；缓解期声低气怯、脉沉细）；辨寒热。<\/p><p><b>治则<\/b>：<mark>发时治标，平时治本<\/mark>。<\/p><ul><li>发作期：攻邪治标，祛痰利气；正虚邪实者兼顾。<\/li><li>喘脱危候：急予扶正救脱。<\/li><li>缓解期：扶正治本，<mark>补肺、健脾、益肾<\/mark>（肺脾肾同调，不含心、肝）。<\/li><\/ul><p><b>虫类祛风药<\/b>（僵蚕、蝉衣、地龙、露蜂房）宜重视使用，可搜剔伏邪、抗过敏——说「禁用虫类药」是错的。<\/p>","src":"讲义 4-3 辨证要点、治则治法、临证要点; 题库 #12 #19 #20 #63 解析"},{"id":"p5","name":"寒哮 vs 热哮","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>寒哮<\/td><td>胸膈满闷如塞，咳不甚，<mark>痰稀薄色白<\/mark>、咳吐不爽，面色晦滞带青，形寒畏冷，口不渴或喜热饮，苔白滑，脉弦紧或浮紧<\/td><td>宣肺散寒，化痰平喘<\/td><td>射干麻黄汤或小青龙汤<\/td><\/tr><tr><td>热哮<\/td><td>气粗息涌，胸高胁胀，<mark>痰黄黏稠<\/mark>，烦闷不安，汗出，面赤口苦，渴喜饮，不恶寒，舌红苔黄腻，脉滑数或弦滑<\/td><td>清热宣肺，化痰定喘<\/td><td>定喘汤<\/td><\/tr><\/tbody><\/table><p><b>加减<\/b>：寒哮表寒重 → 小青龙汤；咳逆上气汗多 → 加<b>白芍<\/b>。热哮便秘 → 加<b>大黄、芒硝<\/b>；肺热痰稠黄 → 加<b>海蛤壳、知母<\/b>；久病伤阴、痰少舌红少苔 → 养阴清热、化痰平喘。<\/p>","src":"讲义 4-3 发作期（1）（2）及用药加减; 题库 #13 #14 #16 #22 #25-#27 #29 #33 #34 #37 #38 #41 #42 #44 #48 #49 #53 #57 #58 #61 解析"},{"id":"p6","name":"风痰·寒包热·虚哮","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>风痰哮<\/td><td>喉中痰涎壅盛，<mark>声如拽锯<\/mark>，但坐不得卧，痰黏腻难出，无明显寒热，倏忽来去，发前鼻眼耳痒，苔厚浊，脉滑实<\/td><td>祛风涤痰，降气平喘<\/td><td>三子养亲汤<\/td><\/tr><tr><td>寒包热哮<\/td><td>哮鸣+<mark>恶寒无汗身痛（表寒）<\/mark>+烦躁口干、痰黄（里热），苔白腻罩黄<\/td><td>解表散寒，清化痰热<\/td><td>小青龙加石膏汤或厚朴麻黄汤<\/td><\/tr><tr><td>虚哮<\/td><td>哮鸣如鼾、声低，动则喘甚，<b>肺肾两虚<\/b>，唇甲青紫<\/td><td>补肺纳肾，降气化痰<\/td><td>平喘固本汤<\/td><\/tr><\/tbody><\/table><p>风痰哮痰壅喘急不能平卧 → 加<b>葶苈子<\/b>、猪牙皂。<\/p>","src":"讲义 4-3 发作期（3）（4）（5）; 题库 #15 #17 #45 #54 #55 #62 解析"},{"id":"p7","name":"喘脱危证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>喘脱危证<\/td><td>哮病久发，喘息鼻煽，张口抬肩，烦躁神昏，面青，<mark>四肢厥冷，汗出如油<\/mark>，脉浮大无根或细数不清<\/td><td>补肺纳肾，扶正固脱<\/td><td>回阳救急汤合生脉饮<\/td><\/tr><\/tbody><\/table><p>证机：肺肾两亏，气阴耗伤，心肾阳衰。喘急面青、汗出肢冷 → 另吞黑锡丹。治法记全句「补肺纳肾，扶正固脱」，不是「益气回阳救逆」。<\/p>","src":"讲义 4-3 发作期（6）; 题库 #36 #59 解析"},{"id":"p8","name":"缓解期肺·脾·肾虚","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肺虚<\/td><td>气短声低，面色㿠白，<mark>自汗畏风<\/mark>，喷嚏、鼻塞流清涕，脉细弱或虚大<\/td><td>补肺益气<\/td><td>玉屏风散<\/td><\/tr><tr><td>脾虚<\/td><td>倦怠，<mark>食少便溏<\/mark>，面色萎黄，痰多而黏，胸脘满闷，脉细弱<\/td><td>健脾益气<\/td><td>六君子汤<\/td><\/tr><tr><td>肾虚<\/td><td>息促气短，<mark>动则为甚，呼多吸少<\/mark>，腰酸腿软，脑转耳鸣，畏寒肢冷，脉沉细<\/td><td>补肾纳气<\/td><td>金匮肾气丸或七味都气丸<\/td><\/tr><\/tbody><\/table><p><b>加减<\/b>：肺虚恶风明显 → 加桂枝汤；痰多 → 前胡、杏仁；气阴两虚（痰少口干舌红）→ 生脉散。脾虚形寒肢冷 → 附子、干姜；痰壅气滞 → 三子养亲汤；少气懒言、便溏脱肛（气陷）→ 改补中益气汤。<\/p>","src":"讲义 4-3 缓解期（1）（2）（3）; 题库 #18 #21 #23 #24 #28 #30-#32 #35 #39 #40 #43 #46 #50-#52 #56 #60 解析"}],"q":[{"n":1,"t":"A1型","q":"首创“哮喘”病名的医家是","pre":"","o":[["A","李中梓"],["B","张景岳"],["C","刘完素"],["D","朱丹溪"],["E","李东垣"]],"a":"D","x":"元·朱丹溪首创“哮喘”病名，提出“专主于痰”，并认为“未发宜扶正气为主，已发用攻邪为主”的治疗原则。故选D。","p":"p1"},{"n":2,"t":"A1型","q":"将哮病称为“呷嗽”，认为“痰气相击，随嗽动息，呼呷有声”的著作是","pre":"","o":[["A","《景岳全书》"],["B","《诸病源候论》"],["C","《医学正传》"],["D","《医学心悟》"],["E","《医学入门》"]],"a":"B","x":"隋·巢元方《诸病源候论》称本病为“呷嗽”，认为“痰气相击，随嗽动息，呼呷有声”，治疗“应加消痰破饮之药”。故选B。","p":"p1"},{"n":3,"t":"A1型","q":"记载“夫喘促喉中如水鸡声者，谓之哮；气促而连属不能以息者，谓之喘”，进一步对哮与喘作明确区别的著作是","pre":"","o":[["A","《景岳全书》"],["B","《诸病源候论》"],["C","《医学正传》"],["D","《医学心悟》"],["E","《医学入门》"]],"a":"C","x":"明·虞抟《医学正传》谓：“大抵哮以声响名，喘以气息言。夫喘促喉中如水鸡声者，谓之哮；气促而连属不能以息者，谓之喘。”进一步对哮与喘做了明确的区别。故选C。","p":"p1"},{"n":4,"t":"A1型","q":"哮病发作的主要诱因是","pre":"","o":[["A","气候变化"],["B","过食生冷"],["C","禀赋不足"],["D","忧思过度"],["E","久病体虚"]],"a":"A","x":"气候变化为哮病发作的主要诱因。故选A。","p":"p2"},{"n":5,"t":"A1型","q":"“哮即痰喘之久而常发者，因内有壅塞之气，外有非时之感，膈有胶固之痰，三者相合，闭拒气道，搏击有声，发为哮病。”此言出自","pre":"","o":[["A","《临证指南医案》"],["B","《类证治裁》"],["C","《证治汇补》"],["D","《医学正传》"],["E","《医学入门》"]],"a":"C","x":"《证治汇补·哮病》云：“哮即痰喘之久而常发者，因内有壅塞之气，外有非时之感，膈有胶固之痰，三者相合，闭拒气道，搏击有声，发为哮病。”故选C。","p":"p1"},{"n":6,"t":"A1型","q":"哮病发作的基本病理变化是","pre":"","o":[["A","宿痰内伏于肺"],["B","“伏痰”遇感引触"],["C","痰气搏结，气道被阻"],["D","邪袭于肺，肺气不利"],["E","肺脏虚弱，气失所主"]],"a":"B","x":"哮病发作时的基本病理变化为“伏痰”遇感引触，痰随气升，气因痰阻，相互搏结，壅塞气道，肺管狭窄，通畅不利，肺气宣降失常。“伏痰”遇感引触为哮病发作的病理关键。故选B。","p":"p2"},{"n":7,"t":"A1型","q":"哮病的夙根是","pre":"","o":[["A","寒邪"],["B","热邪"],["C","伏痰"],["D","气滞"],["E","火热"]],"a":"C","x":"哮病的发生是由于脏腑功能失调，肺不能布散津液，脾不能运化精微，肾不能蒸化水液，以致津液凝聚成痰，痰伏于肺，成为哮病发病的潜在“夙根”。故选C。","p":"p2"},{"n":8,"t":"A1型","q":"哮病的病位主要在","pre":"","o":[["A","肾"],["B","脾"],["C","肺"],["D","肝"],["E","心"]],"a":"C","x":"哮病的病位主要在肺，同时与肝、脾、肾密切相关。故选C。","p":"p2"},{"n":9,"t":"A1型","q":"哮病久发易伤内脏，最易伤及","pre":"","o":[["A","肺、脾、肾"],["B","肺、肾、心"],["C","脾、肾、心"],["D","肺、脾、肝"],["E","肺、心、肝"]],"a":"A","x":"哮病若长期发作，寒痰伤及脾肾之阳，痰热耗灼肺肾之阴，可从实转虚，表现肺、脾、肾等脏气虚弱之候。故选A。","p":"p2"},{"n":10,"t":"A1型","q":"哮病发作的常见先兆症状有","pre":"","o":[["A","鼻痒、喷嚏、咳嗽、胸闷"],["B","气短、心烦、咳嗽、痰多"],["C","恶寒、发热、鼻塞、流涕"],["D","鼻痒、咽干、心烦、气促"],["E","咯血、盗汗、胸痛、疲乏"]],"a":"A","x":"发作前多有鼻痒、喷嚏、咳嗽、胸闷等症状。故选A。","p":"p3"},{"n":11,"t":"A1型","q":"哮病与喘证的鉴别要点","pre":"","o":[["A","咳嗽胸闷"],["B","呼吸不利"],["C","时作时止"],["D","喉中哮鸣有声"],["E","以上皆非"]],"a":"D","x":"哮病以发作时喉中哮鸣有声为主要临床特征，喘证以呼吸气促困难为主要临床特征。故选D。","p":"p3"},{"n":12,"t":"A1型","q":"哮病的治疗原则是","pre":"","o":[["A","祛邪化痰，理气解郁"],["B","扶正固本，理气化痰"],["C","发时治标，平时治本"],["D","补肾温阳，健脾化湿"],["E","化痰平喘，理气解郁"]],"a":"C","x":"哮病以“发时治标，平时治本”为基本治疗原则。故选C。","p":"p4"},{"n":13,"t":"A1型","q":"寒哮咳痰的特点是","pre":"","o":[["A","臭脓痰"],["B","痰稀薄色白，咳吐不爽"],["C","痰黄稠胶黏"],["D","痰如白沫量多"],["E","痰少难咳"]],"a":"B","x":"寒哮临床表现为咳不甚，痰稀薄色白，咳吐不爽。故选B。","p":"p5"},{"n":14,"t":"A1型","q":"热哮的治疗应首选","pre":"","o":[["A","射干麻黄汤"],["B","平喘固本汤"],["C","三子养亲汤"],["D","小青龙汤"],["E","定喘汤"]],"a":"E","x":"热哮治疗的代表方剂为定喘汤。故选E。","p":"p5"},{"n":15,"t":"A1型","q":"哮病发作期风痰哮，表现为痰壅喘急，不能平卧者，最好加用","pre":"","o":[["A","桔梗"],["B","川贝母"],["C","白芥子"],["D","葶苈子"],["E","鱼腥草"]],"a":"D","x":"哮病风痰哮若痰壅喘急，不能平卧，加葶苈子、猪牙皂泻肺涤痰。故选D。","p":"p6"},{"n":16,"t":"A1型","q":"下列不属于寒哮常见临床表现的是","pre":"","o":[["A","形寒畏冷"],["B","烦闷不安"],["C","口不渴或喜热饮"],["D","脉弦紧或浮紧"],["E","面色晦滞带青"]],"a":"B","x":"烦闷不安属于“热哮”的常见临床表现。故选B。","p":"p5"},{"n":17,"t":"A1型","q":"下列不属于热哮常见临床表现的是","pre":"","o":[["A","气粗息涌"],["B","舌红苔黄腻"],["C","喉中痰涎壅盛，声如拽锯"],["D","面赤口苦"],["E","喉中哮鸣如吼"]],"a":"C","x":"喉中痰涎壅盛，声如拽锯，属于风痰哮常见临床表现。故选C。","p":"p6"},{"n":18,"t":"A1型","q":"哮病缓解期属脾虚者，若兼中虚哮喘，痰壅气滞，治疗应加用","pre":"","o":[["A","左归饮"],["B","三子养亲汤"],["C","六味地黄丸"],["D","麦门冬汤"],["E","大补阴丸"]],"a":"B","x":"哮病缓解期属脾虚者，若兼中虚哮喘，痰壅气滞者，加三子养亲汤。故选B。","p":"p8"},{"n":19,"t":"A1型","q":"下列关于哮病，说法错误的是","pre":"","o":[["A","有一定的诱发因素"],["B","反复发作性"],["C","与体质因素有关"],["D","临证当禁用虫类药，防止引起过敏"],["E","喘未必兼哮，而哮必兼喘"]],"a":"D","x":"风邪致病者，为痰伏于肺，外感风邪触发，具有起病多快、病情多变等风邪“善行而数变”的特性，治当祛风解痉。虫类祛风药擅长走窜入络，搜剔逐邪，可祛肺经伏邪，增强平喘降逆之功，且大多具有抗过敏、调节免疫功能作用，对缓解支气管痉挛，改善缺氧现象有显著疗效。故选D。","p":"p4"},{"n":20,"t":"A1型","q":"哮喘缓解期，宜注意调理的是","pre":"","o":[["A","肺"],["B","肾"],["C","肺、肾"],["D","脾、肾"],["E","肺、脾、肾"]],"a":"E","x":"缓解期应扶正治本，阳气虚者应予温补，阴虚者则予滋养，分别采取补肺、健脾、益肾等法。故选E。","p":"p4"},{"n":21,"t":"A2型","q":"患者，男，60岁。哮喘病史，近期倦怠无力，咯痰多而黏，食少便溏，舌苔厚浊，脉象滑实。治疗应首选","pre":"","o":[["A","小青龙汤"],["B","射干麻黄汤"],["C","六君子汤"],["D","定喘汤"],["E","以上皆非"]],"a":"C","x":"根据患者病史、临床表现，诊断为哮病缓解期脾虚证，治当健脾益气，可选用六君子汤加减。故选C。","p":"p8"},{"n":22,"t":"A2型","q":"患者，男，55岁。突发呼吸急促，喉中哮鸣有声，胸膈满闷如塞，痰白质稀薄，面色晦青，形寒肢冷，苔白滑，脉弦紧者。治疗应首选","pre":"","o":[["A","定喘汤"],["B","温胆汤"],["C","控涎丹"],["D","射干麻黄汤"],["E","葶苈大枣泻肺汤"]],"a":"D","x":"根据患者临床表现，辨为寒哮，治疗当宣肺散寒，化痰平喘，方选射干麻黄汤。故选D。","p":"p5"},{"n":23,"t":"A2型","q":"患者久患哮病，反复发作，现经治疗后仍息促气短，动则为甚，呼多吸少，咳痰质黏起沫，脑转耳鸣，腰酸腿软，畏寒肢冷，面色苍白，舌淡苔白质胖，脉沉细。其治法是","pre":"","o":[["A","补肺益气"],["B","滋阴补肾"],["C","补肾纳气"],["D","清热宣肺，化痰平喘"],["E","宣肺散寒，化痰平喘"]],"a":"C","x":"哮病反复发作，仍息促气短，动则为甚，呼多吸少，咳痰质黏起沫，脑转耳鸣，腰酸腿软，畏寒肢冷，面色苍白，舌淡苔白质胖，脉沉细，证属肾元亏损，肾失摄纳，肺气上逆，治当补肾纳气。故选C。","p":"p8"},{"n":24,"t":"A2型","q":"患者，男，56岁。哮病十载，发作半月，经治略平，但仍感倦怠无力，食少便溏，面色萎黄无华，痰多而黏，咯吐不爽，胸脘满闷，恶心纳呆，舌质淡，苔白滑，脉细弱。其证候类型是","pre":"","o":[["A","肺虚"],["B","脾虚"],["C","肺肾两虚"],["D","肾虚"],["E","寒哮"]],"a":"B","x":"根据患者病史、临床表现，诊断为哮病缓解期脾虚证。故选B。","p":"p8"},{"n":25,"t":"A2型","q":"患者气粗息涌，喉中哮鸣，胸闷胁胀，咳痰色黄白质黏稠，不易咯出，口干口苦，舌质红，苔薄黄腻，脉弦滑。其治疗应首选","pre":"","o":[["A","定喘汤"],["B","温胆汤"],["C","控涎丹"],["D","射干麻黄汤"],["E","葶苈大枣泻肺汤"]],"a":"A","x":"根据患者临床表现，诊断为热哮，治当清热宣肺，化痰定喘，可选用定喘汤。故选A。","p":"p5"},{"n":26,"t":"A2型","q":"患者喉中哮鸣有声，气粗息涌，胸高胁胀，烦闷不安，喘咳气逆，咯痰不爽，痰黄黏，口渴喜引，舌质红，苔黄腻，脉滑数。其治法是","pre":"","o":[["A","补肺纳肾，降气化痰"],["B","祛风涤痰，降气平喘"],["C","解表散寒，清化痰热"],["D","清热宣肺，化痰定喘"],["E","宣肺散寒，化痰平喘"]],"a":"D","x":"根据患者表现，诊断为哮病热哮，治当清热宣肺，化痰定喘。故选D。","p":"p5"},{"n":27,"t":"A2型","q":"患者喉中哮鸣，伴有呼吸气促困难，胸膈满闷如塞，有喘憋感，咳痰稀薄色白，形寒怕冷，面色青黑，舌苔白滑，脉浮紧。其治法是","pre" ":51,"t":"A3型","q":"其治法是","pre":"患者，男，67岁。7日前因天气骤然变冷而哮病发作，经治疗后症状缓解。现患者症见神疲乏力，息促气短，动则为甚，呼多吸少，咳痰质黏起沫，口干，腰膝酸冷，面色苍白，舌淡苔白质胖，脉细。","o":[["A","补肾纳气"],["B","健脾益气"],["C","补肺益气"],["D","滋阴补肺，化痰定喘"],["E","宣肺散寒，化痰平喘"]],"a":"A","x":"哮病缓解期肾虚证治法为补肾纳气。故选A。","p":"p8"},{"n":52,"t":"A3型","q":"其治疗应首选","pre":"患者，男，67岁。7日前因天气骤然变冷而哮病发作，经治疗后症状缓解。现患者症见神疲乏力，息促气短，动则为甚，呼多吸少，咳痰质黏起沫，口干，腰膝酸冷，面色苍白，舌淡苔白质胖，脉细。","o":[["A","左归丸"],["B","射干麻黄汤或青龙汤加减"],["C","金匮肾气丸、七味都气丸加减"],["D","六君子汤"],["E","玉屏风散"]],"a":"C","x":"哮病缓解期肾虚证治疗应首选金匮肾气丸。故选C。","p":"p8"},{"n":53,"t":"B型","q":"治疗热哮应首选","pre":"","o":[["A","射干麻黄汤"],["B","定喘汤"],["C","金匮肾气丸、七味都气丸加减"],["D","三子养亲汤"],["E","平喘固本汤"]],"a":"B","x":"热哮治当清热宣肺，化痰定喘，方用定喘汤。故选B。","p":"p5"},{"n":54,"t":"B型","q":"治疗虚哮应首选","pre":"","o":[["A","射干麻黄汤"],["B","定喘汤"],["C","金匮肾气丸、七味都气丸加减"],["D","三子养亲汤"],["E","平喘固本汤"]],"a":"E","x":"虚哮治当补肺纳肾，降气化痰，方用平喘固本汤。故选E。","p":"p6"},{"n":55,"t":"B型","q":"治疗风痰哮应首选","pre":"","o":[["A","射干麻黄汤"],["B","定喘汤"],["C","金匮肾气丸、七味都气丸加减"],["D","三子养亲汤"],["E","平喘固本汤"]],"a":"D","x":"风痰哮治当祛风涤痰，降气平喘，方选三子养亲汤。故选D。","p":"p6"},{"n":56,"t":"B型","q":"治疗哮病缓解期属肾虚者应首选","pre":"","o":[["A","射干麻黄汤"],["B","定喘汤"],["C","金匮肾气丸、七味都气丸加减"],["D","三子养亲汤"],["E","平喘固本汤"]],"a":"C","x":"哮病缓解期属肾虚者，治当补肾纳气，方选金匮肾气丸、七味都气丸加减。故选C。","p":"p8"},{"n":57,"t":"B型","q":"哮病寒哮的治法是","pre":"","o":[["A","宣肺散寒"],["B","清热宣肺"],["C","温清并施"],["D","祛风涤痰"],["E","扶正固脱"]],"a":"A","x":"寒哮的治法为宣肺散寒，化痰平喘。故选A。","p":"p5"},{"n":58,"t":"B型","q":"哮病热哮的治法是","pre":"","o":[["A","宣肺散寒"],["B","清热宣肺"],["C","温清并施"],["D","祛风涤痰"],["E","扶正固脱"]],"a":"B","x":"热哮的治法为清热宣肺，化痰定喘。故选B。","p":"p5"},{"n":59,"t":"B型","q":"哮病喘脱危证的治法是","pre":"","o":[["A","补肺益气"],["B","清热宣肺"],["C","温清并施"],["D","祛风涤痰"],["E","扶正固脱"]],"a":"E","x":"哮病喘脱危证的治法为补肺纳肾，扶正固脱。故选E。","p":"p7"},{"n":60,"t":"B型","q":"哮病缓解期肺虚证的治法是","pre":"","o":[["A","补肺益气"],["B","清热宣肺"],["C","温清并施"],["D","祛风涤痰"],["E","扶正固脱"]],"a":"A","x":"哮病缓解期肺虚证的治法是补肺益气。故选A。","p":"p8"},{"n":61,"t":"B型","q":"喉中哮鸣有声，胸膈满闷如塞，呼吸急促，喘咳气逆，咯痰不爽，痰稀薄色白，恶寒，无汗身痛，舌苔白滑，脉弦紧。其证候类型是","pre":"","o":[["A","寒哮"],["B","热哮"],["C","风痰哮"],["D","风寒犯肺"],["E","喘脱危证"]],"a":"A","x":"寒哮常表现为呼吸急促，喉中哮鸣有声，胸膈满闷如塞，咳不甚，痰稀薄色白，咳吐不爽，面色晦滞带青，口不渴或渴喜热饮，天冷或受寒易发，形寒畏冷，初起多兼恶寒、发热、头痛等表证，舌苔白滑，脉弦紧或浮紧。故选A。","p":"p5"},{"n":62,"t":"B型","q":"喉中痰涎壅盛，声如拽锯，喘急胸满，但坐不得卧，胸膈满闷，纳呆，舌苔白滑，脉滑数。其证候类型是","pre":"","o":[["A","寒哮"],["B","热哮"],["C","风痰哮"],["D","风寒犯肺"],["E","喘脱危证"]],"a":"C","x":"风痰哮常表现为喉中痰涎壅盛，声如拽锯，或鸣声如吹哨笛，喘急胸满，但坐不得卧，咳痰黏腻难出，或为白色泡沫痰液，无明显寒热倾向，面色青黯，起病多急，常倏忽来去，发前自觉鼻、咽、眼、耳发痒，喷嚏，鼻塞，流涕，胸部憋塞，随之迅即发作，舌苔厚浊，脉滑实。故选C。","p":"p6"},{"n":63,"t":"多选","q":"哮病缓解期常用的治法包括","pre":"","o":[["A","补肺"],["B","健脾"],["C","养心"],["D","益肾"],["E","养肝"]],"a":"ABD","x":"哮病缓解期主要见肺虚、脾虚、肾虚，治疗上应扶正治本，阳气虚者应予温补，阴虚者则予滋养，分别采取补肺、健脾、益肾等法。故选A、B、D。","p":"p4"},{"n":64,"t":"多选","q":"下列关于哮病的各项叙述，正确的是","pre":"","o":[["A","哮病是一种发作性的痰鸣气喘疾患"],["B","哮病发作时喉中有哮鸣声，呼吸气促困难，甚则不能平卧"],["C","哮病呈反复发作性，常为突然发作，可见鼻痒、喷嚏、咳嗽、胸闷等先兆"],["D","常因气候突变、饮食不当、情志失调、劳累等诱发"],["E","以喘促短气，呼吸困难，甚至张口抬肩，鼻翼扇动，不能平卧，口唇发绀为特征"]],"a":"ABCD","x":"A、B、C、D均为哮病的临床特征，E为喘证的临床表现。故选A、B、C、D。","p":"p3"},{"n":65,"t":"多选","q":"下列属于哮病发病特征的是","pre":"","o":[["A","呼吸气促困难"],["B","喉中哮鸣有声"],["C","喘息不能平卧"],["D","反复发作"],["E","病情不会危及生命"]],"a":"ABCD","x":"哮病是以喉中哮鸣有声、呼吸困难甚则喘息不能平卧为主症的反复发作性疾病，故A、B、C、D正确。本病可出现喘脱危证，危及生命，E选项错误。","p":"p3"},{"n":66,"t":"多选","q":"哮病主要涉及的病位是","pre":"","o":[["A","肺"],["B","脾"],["C","肾"],["D","肝"],["E","心"]],"a":"ABCD","x":"哮病的病位主要在肺，同时与肝、脾、肾密切相关。故选A、B、C、D。","p":"p2"}]},"04-04":{"name":"喘证","lecture":"4-4 喘证.pdf","points":[{"id":"p1","name":"概念与沿革","teach":"<p><b>概念<\/b>：以呼吸困难、短促急迫，甚至张口抬肩、鼻翼煽动、不能平卧为主症。严重者喘促不解、面青唇紫、汗出如珠、脉浮大无根 → 喘脱。<\/p><p><b>范畴<\/b>：肺炎、慢阻肺、肺心病、心源性哮喘可参照（<mark>肺癌不在其列<\/mark>）。<\/p><table><thead><tr><th>医家/书<\/th><th>贡献<\/th><\/tr><\/thead><tbody><tr><td>张景岳《景岳全书》<\/td><td><mark>最早分虚实<\/mark>：实喘有邪，虚喘无邪、元气虚<\/td><\/tr><tr><td>叶天士《临证指南医案》<\/td><td><mark>在肺为实，在肾为虚<\/mark><\/td><\/tr><tr><td>林珮琴《类证治裁》<\/td><td>外感治肺，内伤治肾<\/td><\/tr><tr><td>刘完素<\/td><td>喘因于火热<\/td><\/tr><\/tbody><\/table>","src":"讲义 4-4 概述、历史沿革; 题库 #1 #2 #3 解析"},{"id":"p2","name":"病因病机","teach":"<ul><li><b>病因<\/b>：外邪侵袭、饮食不当、情志所伤、劳欲久病（<mark>瘀血内停不是<\/mark>常见病因）。<\/li><li><b>基本病机<\/b>：肺气上逆，宣降失职，或气无所主，肾失摄纳。<\/li><li><b>病位<\/b>：主要在肺、肾，与肝脾有关，甚则及心。<\/li><li><b>病理性质<\/b>：<mark>实喘在肺<\/mark>（外邪、痰浊、肝郁气逆壅肺）；<b>虚喘责之肺、肾<\/b>，以气虚为主。<\/li><li>虚实错杂 → 上盛下虚；严重者心阳衰惫 → 喘脱。<\/li><\/ul>","src":"讲义 4-4 病因、病机; 题库 #4 #7 解析"},{"id":"p3","name":"诊断与鉴别","teach":"<p><b>诊断<\/b>：呼吸困难、张口抬肩、不能平卧、口唇发绀；多有<b>慢性咳嗽、哮病、肺痨、心悸<\/b>病史（<mark>消渴不相关<\/mark>），遇外感、情志、劳累诱发。<\/p><table><thead><tr><th><\/th><th>喘证<\/th><th>哮病<\/th><\/tr><\/thead><tbody><tr><td>着眼<\/td><td>气息：呼吸气促困难<\/td><td>声响：<mark>喉中哮鸣有声<\/mark><\/td><\/tr><tr><td>性质<\/td><td>多种疾病的一个症状<\/td><td>反复发作的独立疾病<\/td><\/tr><\/tbody><\/table><p>鉴别看：是否喉中哮鸣、是否反复发作、是否突发突止、是否幼年起病。<b>是否发热<\/b>对鉴别没有直接意义。哮必兼喘，喘未必兼哮。<\/p><p>气短：呼吸浅促、似喘而无声，不张口抬肩。<\/p>","src":"讲义 4-4 诊断、鉴别诊断; 题库 #5 #6 解析"},{"id":"p4","name":"虚实辨证与治则","teach":"<table><thead><tr><th><\/th><th>实喘<\/th><th>虚喘<\/th><\/tr><\/thead><tbody><tr><td>呼吸<\/td><td>深长有余，<mark>呼出为快<\/mark><\/td><td>短促难续，<mark>深吸为快<\/mark><\/td><\/tr><tr><td>声音<\/td><td>气粗声高<\/td><td>气怯声低<\/td><\/tr><tr><td>痰咳<\/td><td>痰鸣咳嗽<\/td><td>少有痰鸣咳嗽<\/td><\/tr><tr><td>脉/病势<\/td><td>数有力，急骤<\/td><td>微弱或浮大中空，徐缓，遇劳即甚<\/td><\/tr><tr><td>治则<\/td><td>治肺，<b>祛邪利气<\/b>：温宣、清肃、化痰、降气<\/td><td><b>培补摄纳<\/b>：补肺、健脾、益肾，<mark>尤重治肾<\/mark><\/td><\/tr><\/tbody><\/table><p>实喘五证：风寒壅肺、表寒肺热、痰热郁肺、痰浊阻肺、肺气郁痹。「补摄」不属实喘治法；说「实喘难治、虚喘易疗」是错的。<\/p>","src":"讲义 4-4 辨证要点、治则治法; 题库 #8 #9 #10 #11 #12 #37 #38 #44 解析（#8 解析末句写「故选E」，答案为B，以答案为准）"},{"id":"p5","name":"风寒壅肺 vs 表寒肺热","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>风寒壅肺<\/td><td>喘息咳逆，胸部胀闷，<mark>痰多稀薄带泡沫、色白<\/mark>，恶寒发热无汗，口不渴，苔薄白而滑，脉浮紧<\/td><td>宣肺散寒<\/td><td>麻黄汤合华盖散<\/td><\/tr><tr><td>表寒肺热<\/td><td>喘逆上气，息粗鼻扇，<mark>痰稠黏或黄 + 形寒身痛无汗 + 身热口渴<\/mark>，苔薄白或黄、舌边红，脉浮数或滑<\/td><td>解表清里，化痰平喘<\/td><td>麻杏石甘汤<\/td><\/tr><\/tbody><\/table><p>关键：有表寒，再看里面有没有热（痰黄、口渴、舌红）。有 → 表寒肺热。<\/p>","src":"讲义 4-4 实喘（1）（2）; 题库 #13 #14 #21 #27 #30 #35 #36 #41 解析"},{"id":"p6","name":"痰热 vs 痰浊","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰热郁肺<\/td><td>喘咳气涌，胸部胀痛，<mark>痰多黏稠色黄<\/mark>或血痰，胸中烦热，身热有汗，渴喜冷饮，面赤，便秘，苔黄腻，脉滑数<\/td><td>清热化痰，宣肺平喘<\/td><td>桑白皮汤<\/td><\/tr><tr><td>痰浊阻肺<\/td><td>喘而胸满闷塞，甚则胸盈仰息，<mark>痰多黏腻色白<\/mark>，呕恶纳呆，口黏不渴，苔白腻，脉滑或濡<\/td><td>祛痰降逆，宣肺平喘<\/td><td>二陈汤合三子养亲汤<\/td><\/tr><\/tbody><\/table><p>注意和咳嗽「痰湿蕴肺」区分：以喘为主（胸满闷塞）→ 喘证痰浊阻肺。<\/p>","src":"讲义 4-4 实喘（3）（4）; 题库 #18 #20 #22 #23 #42 #47 解析"},{"id":"p7","name":"肺气郁痹证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肺气郁痹<\/td><td><mark>每遇情志刺激诱发<\/mark>，突然呼吸短促，息粗气憋，胸闷胸痛，咽中如窒，<mark>喉中痰鸣不著<\/mark>，平素忧思抑郁，失眠心悸，脉弦<\/td><td>开郁降气平喘<\/td><td>五磨饮子<\/td><\/tr><\/tbody><\/table><p>「喉中痰鸣有声」「喘咳气涌、胸部胀痛」都不是本证。<\/p><p>注：讲义标题写「肝气郁痹」，题库按十四五称「肺气郁痹」，以题库为准。<\/p>","src":"讲义 4-4 实喘（5）; 题库 #17 #43 #46 解析（证名以题库为准）"},{"id":"p8","name":"肺气虚耗 vs 肾虚不纳","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肺气虚耗<\/td><td>喘促短气，气怯声低，喉有鼾声，痰吐稀薄，<mark>自汗畏风<\/mark>；或兼阴虚：咳呛痰少质黏、颧红、舌红苔剥、脉细数<\/td><td>补肺益气<\/td><td>生脉散合补肺汤<\/td><\/tr><tr><td>肾虚不纳<\/td><td>喘促日久，<mark>动则喘甚，呼多吸少，气不得续<\/mark>，形瘦神惫，跗肿，汗出肢冷，面青唇紫，脉微细或沉弱<\/td><td>补肾纳气<\/td><td>金匮肾气丸合人参蛤蚧散<\/td><\/tr><\/tbody><\/table><p>肾虚证机：肺病及肾，肺肾俱虚，肾不纳气。喘平后常服<b>紫河车、胡桃肉<\/b>。兼痰浊壅肺（上盛下虚）→ <mark>苏子降气汤<\/mark>。金匮肾气丸首选：喘证肾虚，题库 #48 还算上哮病虚哮。<\/p>","src":"讲义 4-4 虚喘（1）（2）、临证要点; 题库 #24 #25 #28 #29 #31-#34 #39 #48 解析"},{"id":"p9","name":"正虚喘脱证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>正虚喘脱<\/td><td>喘逆剧甚，张口抬肩，鼻翼扇动，不能平卧，心悸烦躁，四肢厥冷，面青唇紫，<mark>汗出如珠，脉浮大无根<\/mark>或脉微欲绝<\/td><td>扶阳固脱，镇摄肾气<\/td><td>参附汤送服黑锡丹<\/td><\/tr><\/tbody><\/table><p>证机：<b>肺气欲竭，心肾阳衰<\/b>，气失所主。肢体浮肿按之凹陷不是本证表现。神昧不清 → 加<b>丹参、远志、菖蒲<\/b>。<\/p>","src":"讲义 4-4 虚喘（3）; 题库 #15 #16 #19 #26 #40 #45 解析"}],"q":[{"n":1,"t":"A1型","q":"最早提出喘证虚实分类法的医著是","pre":"","o":[["A","《黄帝内经》"],["B","《医宗必读》"],["C","《景岳全书》"],["D","《证治准绳》"],["E","《医宗金鉴》"]],"a":"C","x":"明·张景岳把喘证分为虚实两类，《景岳全书·喘促》云：“实喘者有邪，邪气实也；虚喘者无邪，元气虚也。”指出了喘证的辨证纲领。故选C。","p":"p1"},{"n":2,"t":"A1型","q":"提出喘证“在肺为实，在肾为虚”的医家是","pre":"","o":[["A","林珮琴"],["B","刘河间"],["C","朱丹溪"],["D","张景岳"],["E","叶天士"]],"a":"E","x":"清·叶天士《临证指南医案·喘》云：“在肺为实，在肾为虚。”把喘证分为虚实两类。故选E。","p":"p1"},{"n":3,"t":"A1型","q":"下列疾病中，一般不参照中医喘证辨证论治的是","pre":"","o":[["A","肺癌"],["B","肺炎"],["C","慢性阻塞性肺疾病"],["D","肺源性心脏病"],["E","心源性哮喘"]],"a":"A","x":"西医学中的肺炎、慢性阻塞性肺疾病、肺源性心脏病、心源性哮喘等属于喘证范畴，可参照喘证辨证论治。故选A。","p":"p1"},{"n":4,"t":"A1型","q":"下列不属于喘证常见病因的是","pre":"","o":[["A","外邪侵袭"],["B","饮食不当"],["C","瘀血内停"],["D","情志所伤"],["E","劳欲久病"]],"a":"C","x":"喘证常由多种疾患引起，病因复杂，有外感、内伤两大类。外感为六淫外邪侵袭肺系，内伤为痰浊内蕴、情志失调、久病劳欲等。故选C。","p":"p2"},{"n":5,"t":"A1型","q":"下列各项，对于鉴别哮病与喘证无直接意义的是","pre":"","o":[["A","是否幼年起病"],["B","是否反复发作"],["C","是否喉中哮鸣"],["D","气喘是否突发突止"],["E","是否伴有发热"]],"a":"E","x":"喘证和哮病都有呼吸急促、困难的表现。喘指气息而言，为呼吸气促困难，甚则张口抬肩，摇身撷肚，是多种肺系疾病的一个症状；哮指声响而言，必见喉中哮鸣有声，亦伴呼吸困难，是一种反复发作的独立性疾病。喘未必兼哮，而哮必兼喘。故选E。","p":"p3"},{"n":6,"t":"A1型","q":"喘证患者多有急慢性病史，下列除哪项外，均与喘证的发生密切相关","pre":"","o":[["A","慢性咳嗽"],["B","哮病"],["C","肺痨"],["D","心悸"],["E","消渴"]],"a":"E","x":"喘证多有慢性咳嗽、哮病、肺痨、心悸等病史，每遇外感、情志刺激及劳累而诱发。故选E。","p":"p3"},{"n":7,"t":"A1型","q":"实喘的病位在","pre":"","o":[["A","心"],["B","肺"],["C","肝"],["D","脾"],["E","肾"]],"a":"B","x":"喘证的病理性质有虚实之分。实喘在肺，为外邪、痰浊、肝郁气逆，邪壅肺气，宣降不利所致；虚喘责之肺、肾两脏，因阳气不足，阴精亏耗，而致肺肾出纳失常，且尤以气虚为主。故选B。","p":"p2"},{"n":8,"t":"A1型","q":"下列各项，不属实喘常见临床表现的是","pre":"","o":[["A","呼吸深长"],["B","吸入为快"],["C","气粗声高"],["D","痰鸣咳嗽"],["E","脉数有力"]],"a":"B","x":"实喘呼吸深长有余，呼出为快，气粗声高，伴有痰鸣咳嗽，脉数有力。因于外感者，发病骤急，病程短，多有表证；因于内伤者，病程多久，反复发作，外无表证。故选E。","p":"p4"},{"n":9,"t":"A1型","q":"虚喘的治疗除治肺外尤当重视","pre":"","o":[["A","治胃"],["B","治脾"],["C","治心"],["D","治肝"],["E","治肾"]],"a":"E","x":"虚喘责之肺、肾两脏，因阳气不足，阴精亏耗，而致肺肾出纳失常，且尤以气虚为主。故选E。","p":"p4"},{"n":10,"t":"A1型","q":"下列关于虚喘的各项叙述，错误的是","pre":"","o":[["A","呼吸短促难续"],["B","气怯声低，深吸为快"],["C","多有痰鸣咳嗽"],["D","脉象微弱或浮大中空"],["E","病势徐缓，时轻时重，遇劳则甚"]],"a":"C","x":"虚喘呼吸短促难续，深吸为快，气怯声低，少有痰鸣咳嗽，脉象微弱或浮大中空，病势徐缓，时轻时重，遇劳即甚。故选C。","p":"p4"},{"n":11,"t":"A1型","q":"下列不属于实喘常用治法的是","pre":"","o":[["A","温宣"],["B","清泄"],["C","化痰"],["D","降气"],["E","补摄"]],"a":"E","x":"实喘治肺，以祛邪利气为主，区别寒、热、痰、气的不同，分别采用温化宣肺、清化肃肺、化痰理气的方法。E选项为虚喘的治则。故选E。","p":"p4"},{"n":12,"t":"A1型","q":"下列关于喘证治疗的叙述，错误的是","pre":"","o":[["A","实喘以祛邪利气为主"],["B","虚喘以培补摄纳为主"],["C","实喘可采用温化宣肺、清化肃肺、祛痰降逆的方法"],["D","虚喘或补肺，或健脾，或益肾"],["E","实喘难治，虚喘易疗"]],"a":"E","x":"实喘治肺，以祛邪利气为主，区别寒、热、痰、气的不同，分别采用温化宣肺、清化肃肺、化痰理气的方法。虚喘以培补摄纳为主，或补肺，或健脾，或补肾，阳虚则温补之，阴虚则滋养之。对于虚实夹杂、下虚上实、寒热互见者，当按具体情况分清标本，权衡主次，灵活辨证。故选E。","p":"p4"},{"n":13,"t":"A1型","q":"治疗实喘风寒壅肺证，首选的方剂是","pre":"","o":[["A","麻杏石甘汤"],["B","荆防达表汤"],["C","麻黄汤合华盖散加减"],["D","桑白皮汤"],["E","麻黄连翘赤小豆汤"]],"a":"C","x":"喘证风寒壅肺当选用麻黄汤合华盖散加减。故选C。","p":"p5"},{"n":14,"t":"A1型","q":"治疗实喘表寒肺热证，首选的方剂是","pre":"","o":[["A","麻杏石甘汤"],["B","桑白皮汤"],["C","麻黄汤合华盖散"],["D","射干麻黄汤"],["E","麻黄连翘赤小豆汤"]],"a":"A","x":"表寒肺热所致喘证当选用麻杏石甘汤。故选A。","p":"p5"},{"n":15,"t":"A1型","q":"下列不属于喘证正虚喘脱常见临床表现的是","pre":"","o":[["A","喘逆剧甚，不能平卧"],["B","心慌动悸，烦躁不安"],["C","面青唇紫，汗出如珠"],["D","肢体浮肿，按之凹陷"],["E","脉浮大无根"]],"a":"D","x":"喘证正虚喘脱表现为喘逆剧甚，张口抬肩，鼻翼扇动，不能平卧，稍动则咳喘欲绝，或有痰鸣，心悸烦躁，四肢厥冷，面青唇紫，汗出如珠，脉浮大无根，或脉微欲绝。故选D。","p":"p9"},{"n":16,"t":"A1型","q":"喘证正虚喘脱的证机概要为","pre":"","o":[["A","心气欲竭，脾肾阳衰"],["B","心气欲竭，肺肾气虚"],["C","肾气欲竭，心肺气虚"],["D","肺气欲竭，心肾阳衰"],["E","肺气欲竭，肝肾阴亏"]],"a":"D","x":"正虚喘脱的证机概要为肺气欲竭，心肾阳衰，气失所主。故选D。","p":"p9"},{"n":17,"t":"A1型","q":"喘证中以五磨饮子为治疗代表方的证候类型为","pre":"","o":[["A","风寒犯肺"],["B","表寒肺热"],["C","痰热郁肺"],["D","痰浊阻肺"],["E","肺气郁痹"]],"a":"E","x":"喘证肺气郁痹治当开郁降气平喘，治疗方选五磨饮子。故选E。","p":"p7"},{"n":18,"t":"A1型","q":"喘证中以清热化痰、宣肺平喘为治法的证候类型是","pre":"","o":[["A","风寒袭肺"],["B","表寒里热"],["C","痰热郁肺"],["D","痰浊阻肺"],["E","肺气郁闭"]],"a":"C","x":"痰热郁肺喘证的治法为清热化痰，宣肺平喘。故选C。","p":"p6"},{"n":19,"t":"A1型","q":"喘证正虚喘脱，宜急服","pre":"","o":[["A","回阳急救汤"],["B","苏子降气汤"],["C","参附汤送服黑锡丹"],["D","控涎丹"],["E","紫金丹"]],"a":"C","x":"喘证正虚喘脱治当扶阳固脱，镇摄肾气，方用参附汤送服黑锡丹。故选C。","p":"p9"},{"n":20,"t":"A1型","q":"喘而胸满闷塞，咳嗽，痰多黏腻色白，咯吐不利，舌淡，苔白腻，脉滑。其证候类型为","pre":"","o":[["A","肺气郁闭"],["B","痰浊阻肺"],["C","痰热郁肺"],["D","表寒里热"],["E","风寒袭肺"]],"a":"B","x":"喘证痰浊阻肺表现为喘咳痰鸣，胸中满闷，甚则胸盈仰息，痰多黏腻色白，咳吐不利，呕恶纳呆，口黏不渴，舌质淡，苔白腻，脉滑或濡。故选B。","p":"p6"},{"n":21,"t":"A2型","q":"陈某，男，28岁。两天 "x":"治疗喘证表寒肺热应以解表清里、化痰平喘为主。故选D。","p":"p5"},{"n":37,"t":"B型","q":"实喘的特点是","pre":"","o":[["A","呼吸深长有余，呼出为快，气粗声高"],["B","呼吸短促难续，深吸为快，气促声高"],["C","呼吸短促难续，吸少呼多，气怯声低"],["D","呼吸深长有余，呼出为快，气怯声低"],["E","呼吸短促难续，吸多呼少，气怯声低"]],"a":"A","x":"实喘呼吸深长有余，呼出为快，气粗声高，伴有痰鸣咳嗽，脉数有力。因于外感者，发病骤急，病程短，多有表证；因于内伤者，病程多久，反复发作，外无表证。故选A。","p":"p4"},{"n":38,"t":"B型","q":"虚喘的特点是","pre":"","o":[["A","呼吸深长有余，呼出为快，气粗声高"],["B","呼吸短促难续，深吸为快，气促声高"],["C","呼吸短促难续，吸少呼多，气怯声低"],["D","呼吸深长有余，呼出为快，气怯声低"],["E","呼吸短促难续，吸多呼少，气怯声低"]],"a":"C","x":"虚喘呼吸短促难续，深吸为快，气怯声低，少有痰鸣咳嗽，脉象微弱或浮大中空，病势徐缓，时轻时重，遇劳即甚。故选C。","p":"p4"},{"n":39,"t":"B型","q":"虚喘肾虚不纳，喘息渐平，善后调理可常服","pre":"","o":[["A","百合、合欢皮、酸枣仁"],["B","紫河车、胡桃肉"],["C","麦冬、龟甲胶"],["D","丹参、远志、菖蒲"],["E","柴胡、郁金、青皮"]],"a":"B","x":"虚喘肾虚不纳，可用紫河车、胡桃肉温肾纳气。故选B。","p":"p8"},{"n":40,"t":"B型","q":"虚喘正虚喘脱，神昧不清，应加用","pre":"","o":[["A","百合、合欢皮、酸枣仁"],["B","紫河车、胡桃肉"],["C","麦冬、龟甲胶"],["D","丹参、远志、菖蒲"],["E","柴胡、郁金、青皮"]],"a":"D","x":"虚喘正虚喘脱，神昧不清者，加丹参、远志、菖蒲安神祛痰开窍。故选D。","p":"p9"},{"n":41,"t":"B型","q":"喘息咳逆，呼吸急促，胸部胀闷，痰多稀薄而带泡沫，色白质黏，伴头痛，恶寒，发热，口不渴，无汗，苔薄白而滑，脉浮紧。其证候类型是","pre":"","o":[["A","风寒壅肺"],["B","表寒肺热"],["C","痰热郁肺"],["D","痰浊阻肺"],["E","肺气郁痹"]],"a":"A","x":"根据临床表现，辨为喘证风寒壅肺。故选A。","p":"p5"},{"n":42,"t":"B型","q":"喘而胸满闷塞，甚则胸盈仰息，咳嗽，痰多黏腻色白，咯吐不利，兼有呕恶食少，口黏不渴，舌苔白腻，脉象滑。其证候类型是","pre":"","o":[["A","风寒壅肺"],["B","表寒肺热"],["C","痰热郁肺"],["D","痰浊阻肺"],["E","肺气郁痹"]],"a":"D","x":"根据临床表现，辨为喘证痰浊阻肺。故选D。","p":"p6"},{"n":43,"t":"B型","q":"每遇情志刺激而诱发，发时突然呼吸短促，息粗气憋，胸闷胸痛，咽中如窒，但喉中痰鸣不著，平素常多忧思抑郁，失眠，心悸，苔薄，脉弦。其证候类型是","pre":"","o":[["A","风寒壅肺"],["B","表寒肺热"],["C","痰热郁肺"],["D","痰浊阻肺"],["E","肺气郁痹"]],"a":"E","x":"根据临床表现，辨为喘证肺气郁痹。故选E。","p":"p7"},{"n":44,"t":"多选","q":"实喘的证候类型包括","pre":"","o":[["A","风寒壅肺"],["B","表寒肺热"],["C","痰热郁肺"],["D","痰浊阻肺"],["E","肺气郁痹"]],"a":"ABCDE","x":"实喘包括风寒壅肺、表寒肺热、痰热郁肺、痰浊阻肺和肺气郁痹。故选A、B、C、D、E。","p":"p4"},{"n":45,"t":"多选","q":"正虚喘脱的常见临床表现有","pre":"","o":[["A","凡喘促持续不解"],["B","烦躁不安"],["C","面青唇紫"],["D","肢冷，汗出如珠"],["E","脉浮大无根"]],"a":"ABCDE","x":"正虚喘脱表现为喘逆剧甚，张口抬肩，鼻翼扇动，不能平卧，稍动则咳喘欲绝，或有痰鸣，心悸烦躁，四肢厥冷，面青唇紫，汗出如珠，脉浮大无根，或脉微欲绝。故选A、B、C、D、E。","p":"p9"},{"n":46,"t":"多选","q":"下列不属于喘证肺气郁痹特点的是","pre":"","o":[["A","每遇情志因素而诱发"],["B","胸闷胸痛，咽中如窒"],["C","喉中痰鸣有声"],["D","喘咳气涌，胸部胀痛"],["E","平素常多忧思抑郁"]],"a":"CD","x":"喘证肺气郁痹表现为每遇情志刺激而诱发，突然呼吸短促，息粗气憋，胸胁闷痛，咽中如窒，喉中痰鸣不著，平素多忧思抑郁，或失眠心悸，或心烦易怒，面红目赤，舌质红，苔薄白或黄，脉弦。C、D项属于喘证痰浊阻肺。故选C、D。","p":"p7"},{"n":47,"t":"多选","q":"下列属于喘证痰热郁肺常见临床表现的是","pre":"","o":[["A","喘咳气涌，胸部胀痛"],["B","痰多黏稠色黄"],["C","胸中烦热，身热，有汗"],["D","喘而胸满闷窒"],["E","兼有呕恶，纳呆，口黏不渴"]],"a":"ABC","x":"喘证痰热郁肺表现为喘咳气涌，胸部胀痛，痰多质黏色黄，或为血痰，伴胸中烦闷，身热有汗，口渴而喜冷饮，面赤咽干，小便赤涩，大便或秘，舌质红，苔黄腻，脉滑数。D和E选项属于痰浊阻肺喘证。故选A、B、C。","p":"p6"},{"n":48,"t":"多选","q":"将金匮肾气丸作为治疗首选方的是","pre":"","o":[["A","哮病，寒哮"],["B","哮病，虚哮"],["C","喘证，肺虚"],["D","喘证，肾虚"],["E","喘证，水凌心肺"]],"a":"BD","x":"考查金匮肾气丸主治的病证。故选B、D。","p":"p8"}]},"04-05":{"name":"肺痈","lecture":"4-5 肺痈.pdf","points":[{"id":"p1","name":"概念与主症","teach":"<p>肺痈：以<b>咳嗽、胸痛、发热、咳吐腥臭浊痰，甚则脓血相兼<\/b>为主症，属<b>内痈<\/b>。<\/p><p>特征性主症＝<mark>咳吐大量腥臭脓痰或脓血痰<\/mark>（溃脓期出现）。题干见“咳吐腥臭浊痰及脓血”→直接诊肺痈，不是肺痿、肺痨。<\/p>","src":"讲义 4-5 概述; 题库 #5 #28 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：感受外邪（主要是<mark>风热<\/mark>；风寒未及时表散，郁而化热也可）＋痰热素盛（嗜酒、辛辣厚味）；内外合邪更易发病，劳累正虚为重要内因。<\/p><p><b>病机<\/b>：热伤肺气，蒸液成痰，<b>热壅血瘀，血败肉腐<\/b>，成痈化脓。<\/p><p><b>病位<\/b>：在肺。<\/p><p><b>病理演变四期<\/b>：初期 → 成痈期 → 溃脓期 → 恢复期。<\/p>","src":"讲义 4-5 病因、病机; 题库 #6 #7 解析"},{"id":"p3","name":"诊断与鉴别","teach":"<p><b>诊断<\/b>：发病急，突然寒战高热、咳嗽胸痛、咳黏浊痰，约旬日后咳吐大量腥臭脓痰，身热随降。<\/p><p><b>传统三验<\/b>：<mark>验痰法<\/mark>（脓血浊痰吐入水中，沉者是痈脓，浮者是痰）、<mark>验口味<\/mark>（嚼生黄豆不觉腥）、<mark>验爪甲<\/mark>（爪甲紫而带弯，指端鼓杵样）。没有“验舌”。<\/p><p><b>鉴别<\/b>：风温经正确治疗多在气分而解；若一周身热不退或退而复升，应考虑肺痈。痰热蕴肺证属血热、病轻；肺痈属血瘀成痈，咯大量腥臭脓血浊痰。<\/p>","src":"讲义 4-5 诊断、鉴别诊断; 题库 #48 解析"},{"id":"p4","name":"治则与分期","teach":"<p><b>治疗原则<\/b>：祛邪。主要治法＝<mark>清热解毒，化瘀排脓<\/mark>。<\/p><p>脓未成 → 清肺消痈；脓已成 → 排脓解毒。<b>有脓必排<\/b>，排脓为首要措施。<\/p><ul><li>初期：疏散风热，清肺化痰<\/li><li>成痈期：清热解毒，化瘀消痈<\/li><li>溃脓期：排脓解毒<\/li><li>恢复期：益气养阴清肺<\/li><\/ul>","src":"讲义 4-5 治则治法; 题库 #8 #40–#43 解析"},{"id":"p5","name":"初期","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>初期<\/td><td>恶寒发热，咳嗽，咳白色黏痰<mark>痰量由少渐多<\/mark>，胸痛咳时尤甚，呼吸不利，口干鼻燥，苔薄黄，脉浮数而滑<\/td><td>疏散风热，清肺化痰<\/td><td>银翘散<\/td><\/tr><\/tbody><\/table><p>证机：风热外袭，<b>卫表不和<\/b>，邪热壅肺，肺失清肃。治法也说“清肺散邪”。<\/p><p>与风热咳嗽、风热感冒的区别：胸痛＋痰量渐多。初起喘甚者可用麻杏甘石汤。<\/p>","src":"讲义 4-5 证治·初期（讲义作“疏风散热”，题库作“疏散风热”，按题库）; 题库 #9 #15 #37 #47 解析"},{"id":"p6","name":"成痈期","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>成痈期<\/td><td>身热转甚，汗出热不解，胸满作痛转侧不利，咳吐黄稠或<mark>黄绿色痰，喉间有腥味<\/mark>（尚未吐脓），烦躁，苔黄腻，脉滑数有力<\/td><td>清热解毒，化瘀消痈<\/td><td>千金苇茎汤合如金解毒散<\/td><\/tr><\/tbody><\/table><p>病机关键：<b>热壅血瘀<\/b>，蕴酿成痈。咳吐脓血如米粥属溃脓期，不属本期。<\/p><p>加减：胸痛甚加枳壳、丹参、延胡索、郁金；便秘加大黄、枳实；热毒盛加银花、连翘、鱼腥草。太子参、黄芪是恢复期药，本期不用。<\/p>","src":"讲义 4-5 证治·成痈期; 题库 #11 #18 #24 #33 #39 解析"},{"id":"p7","name":"溃脓期","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>溃脓期<\/td><td><mark>咳吐大量脓血痰，或如米粥，腥臭异常<\/mark>，有时咯血，胸中烦满而痛，甚则气喘不能卧，身热面赤烦渴<\/td><td>排脓解毒<\/td><td>加味桔梗汤<\/td><\/tr><\/tbody><\/table><p>证机：热壅血瘀，血败肉腐，痈肿内溃，脓液外泄。顺势而治，<b>以排脓为主，解毒为辅<\/b>。<\/p><p>加减：气虚无力托脓加<b>生黄芪<\/b>（托里透脓）；脓出不畅加皂角；咯血加白茅根、藕节、侧柏叶；形证俱实可用桔梗白散峻驱其脓。<\/p>","src":"讲义 4-5 证治·溃脓期; 题库 #12 #13 #16 解析"},{"id":"p8","name":"溃脓期顺逆","teach":"<p><b>溃脓期是顺逆的转折点<\/b>。看热势、痰血（脓）、饮食、胸痛。<\/p><table><thead><tr><th>项目<\/th><th>顺证<\/th><th>逆证<\/th><\/tr><\/thead><tbody><tr><td>声音<\/td><td>清朗<\/td><td>音哑无力<\/td><\/tr><tr><td>脓血<\/td><td>稀而渐少<\/td><td><mark>如败卤<\/mark><\/td><\/tr><tr><td>气味<\/td><td>臭味转淡<\/td><td>腥味异常<\/td><\/tr><tr><td>身热<\/td><td>身体不热<\/td><td><mark>身热不退<\/mark><\/td><\/tr><tr><td>饮食/胸痛<\/td><td>饮食知味，胸胁少痛<\/td><td>食少，胸痛<\/td><\/tr><tr><td>脉<\/td><td>缓滑<\/td><td>弦涩或弦急<\/td><\/tr><\/tbody><\/table><p>逆证另见气喘鼻扇、颧红、指甲青紫，为肺叶腐败之恶候。<\/p>","src":"讲义 4-5 辨证要点·辨顺逆; 题库 #14 #32 #45 #46 解析"},{"id":"p9","name":"恢复期","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>恢复期<\/td><td>身热渐退，咳嗽减轻，<mark>脓痰渐少、臭味转淡、痰转清稀<\/mark>，气短自汗，或低热盗汗、口燥咽干，脉细或细数无力<\/td><td>益气养阴清肺<\/td><td>沙参清肺汤合竹叶石膏汤<\/td><\/tr><\/tbody><\/table><p>证机：邪毒渐去，肺体损伤，阴伤气耗。<\/p><p>病情时轻时重、迁延不愈（邪恋正虚）→ <b>桔梗杏仁煎<\/b>，益气养阴，排脓解毒。<\/p><p>注：讲义主方写“沙参清肺汤或桔梗杏仁煎”，题库（十四五）为沙参清肺汤合竹叶石膏汤，考试按题库。<\/p>","src":"讲义 4-5 证治·恢复期; 题库 #17 #19 #31 #44 解析（主方以题库为准）"},{"id":"p10","name":"医家与调护","teach":"<ul><li>病名首见：东汉·张仲景《金匮要略》；未成脓用葶苈大枣泻肺汤，已成脓用桔梗汤<\/li><li>苇茎汤：唐·<b>孙思邈<\/b>《千金要方》创，清热排脓、活血消痈<\/li><li>“清肺热，救肺气”：清·<b>喻嘉言<\/b>《医门法律》<\/li><li>巢元方：正虚感寒，郁热血败<\/li><\/ul><p><b>调护<\/b>：寒温适度，谨避风寒；忌辛辣烟酒、肥甘，宜清淡，多吃橘子、梨、枇杷；安静卧床但<mark>保持适当活动<\/mark>以利排痰（“绝对卧床”是错的）。<\/p>","src":"讲义 4-5 历史沿革、预防调护; 题库 #1–#4 #20 解析"}],"q":[{"n":1,"t":"A1型","q":"肺痈之病名最早见于","pre":"","o":[["A","《黄帝内经》"],["B","《金匮要略》"],["C","《备急千金要方》"],["D","《杂病源流犀烛》"],["E","《医门法律》"]],"a":"B","x":"肺痈之病名首见于《金匮要略·肺痿肺痈咳嗽上气病脉证治》。故选B。","p":"p10"},{"n":2,"t":"A1型","q":"具有清热排脓、活血消痈之功的苇茎汤由下列哪位医家创制","pre":"","o":[["A","喻嘉言"],["B","朱丹溪"],["C","巢元方"],["D","孙思邈"],["E","李东垣"]],"a":"D","x":"唐·孙思邈创制苇茎汤，其有清热排脓、活血消痈之功，适于肺痈成痈期的治疗。故选D。","p":"p10"},{"n":3,"t":"A1型","q":"千金苇茎汤常用于治疗","pre":"","o":[["A","肺痈"],["B","肺痿"],["C","肺胀"],["D","肺热病"],["E","肺痨"]],"a":"A","x":"《备急千金要方·肺脏方》载苇茎汤，其有清热排脓、活血消痈之功，适于肺痈成痈期的治疗。故选A。","p":"p10"},{"n":4,"t":"A1型","q":"主张治疗肺痈以“清肺热，救肺气”为要的医家是","pre":"","o":[["A","喻嘉言"],["B","张仲景"],["C","林珮琴"],["D","张景岳"],["E","李东垣"]],"a":"A","x":"清·喻嘉言《医门法律·肺痈肺痿门》认为，“肺痈由五脏蕴崇之火，与胃中停蓄之热，上乘乎肺，肺受火热熏灼”而致，认识到他脏及肺的发病机制，治疗上主张以“清肺热，救肺气”为要。故选A。","p":"p10"},{"n":5,"t":"A1型","q":"下列为肺痈特征性临床表现的是","pre":"","o":[["A","咳嗽"],["B","胸痛"],["C","发热口干"],["D","咳吐腥臭脓痰"],["E","脉滑数"]],"a":"D","x":"肺痈溃脓期，痰热与瘀血壅阻肺络，肉腐血败化脓，继则肺损络伤，脓疡内溃外泄，咳出大量腥臭脓痰或脓血痰，此为肺痈的特殊主症。故选D。","p":"p1"},{"n":6,"t":"A1型","q":"引起肺痈的外邪，主要是","pre":"","o":[["A","风热"],["B","燥热"],["C","寒湿"],["D","暑湿"],["E","风湿"]],"a":"A","x":"肺痈发病的主要原因为感受外邪，内犯于肺。风热上受，自口鼻或皮毛侵犯于肺，或因风寒袭肺，未得及时表散，内蕴不解，郁而化热。故选A。","p":"p2"},{"n":7,"t":"A1型","q":"肺痈病位主要在","pre":"","o":[["A","肝"],["B","心"],["C","脾"],["D","肺"],["E","肾"]],"a":"D","x":"肺痈主要因感受外邪，内犯于肺，或因痰热素盛，蒸灼肺脏，以致热壅血瘀，蕴酿成痈，血败肉腐化脓，肺络损伤而致，故病位在肺，与心、肝、脾、肾关系不大。故选D。","p":"p2"},{"n":8,"t":"A1型","q":"肺痈的主要治法是","pre":"","o":[["A","清热解毒，活血通络"],["B","清热解毒，化瘀排脓"],["C","清热解毒，肃肺化痰"],["D","清热解毒，凉血止血"],["E","清热解毒，宣肺平喘"]],"a":"B","x":"肺痈治疗以祛邪为原则，清热解毒、化瘀排脓为主要治法。脓未成应着重清肺消痈，脓已成需排脓解毒。故选B。","p":"p4"},{"n":9,"t":"A1型","q":"肺痈初期，风热侵犯肺卫，其治法是","pre":"","o":[["A","养阴益气"],["B","排脓解毒"],["C","化瘀消痈"],["D","清肺散邪"],["E","以上皆非"]],"a":"D","x":"肺痈初期（表证期）的病机是风热外袭，卫表不和，邪热壅肺，肺失清肃，治疗应以清肺散邪为法。故选D。","p":"p5"},{"n":10,"t":"A1型","q":"肺痈成痈期的治法是","pre":"","o":[["A","清热解毒，化瘀消痈"],["B","化瘀排脓"],["C","清肺消痈，软坚散结"],["D","排脓解毒"],["E","以上皆非"]],"a":"A","x":"肺痈成痈期，其病机为热毒蕴肺，蒸液成痰，热壅血瘀，酝酿成脓，治疗应以清热解毒、化瘀消痈为法。故选A。","p":"p6"},{"n":11,"t":"A1型","q":"肺痈成痈期的病机是","pre":"","o":[["A","热壅血瘀"],["B","热盛痰阻"],["C","肉腐血败"],["D","热毒留恋"],["E","以上皆非"]],"a":"A","x":"肺痈成痈期为邪热塞肺，蒸液成痰，气分热毒浸淫及血，热伤血脉，血为之凝滞，热壅血瘀。故选A。","p":"p6"},{"n":12,"t":"A1型","q":"肺痈溃脓期，治疗方法应该选用","pre":"","o":[["A","清肺、化痰、排脓"],["B","清热、解表、排脓"],["C","清热、解毒、排脓"],["D","排脓、解毒"],["E","以上皆非"]],"a":"D","x":"肺痈溃脓期，其病机为热壅血瘀，血败肉腐，痈肿内溃，脓液外泄，治疗应因势利导，以排脓为主，解毒为辅。故选D。","p":"p7"},{"n":13,"t":"A1型","q":"肺痈溃脓期治疗主方是","pre":"","o":[["A","苇茎汤"],["B","如金解毒散"],["C","加味桔梗汤"],["D","桔梗白散"],["E","桔梗杏仁煎"]],"a":"C","x":"肺痈溃脓期，其病机是热壅血瘀，血败肉腐，痈肿内溃，脓液外泄，治疗应顺应病势，以排脓解毒为法，方用加味桔梗汤加减。故选C。","p":"p7"},{"n":14,"t":"A1型","q":"肺痈预后顺证与逆证的转折点是","pre":"","o":[["A","初期"],["B","成痈期"],["C","溃脓期"],["D","恢复期"],["E","以上皆非"]],"a":"C","x":"溃脓期是肺痈病情顺与逆的转折点。顺证：脓血稀而渐少，腥臭味转淡，身体不热，脉象缓滑。逆证：脓血如败卤，腥臭异常，胸痛，身热不退，脉短涩或弦急，为肺叶腐败之恶候。故选C。","p":"p8"},{"n":15,"t":"A1型","q":"肺痈初期的证机概要为","pre":"","o":[["A","阴伤气耗"],["B","正虚邪恋"],["C","卫表不和"],["D","痰热瘀阻"],["E","邪热壅肺"]],"a":"C","x":"肺痈初期，风热外袭，卫表不和，邪热壅肺，肺失清肃。故选C。","p":"p5"},{"n":16,"t":"A1型","q":"肺痈溃脓期，于方中加入生黄芪的所起的作用是","pre":"","o":[["A","预防转为逆证"],["B","托里透脓"],["C","扶正祛邪"],["D","扶正生肌"],["E","益气补肺"]],"a":"B","x":"肺痈溃脓期血败肉腐，宜排脓解毒，气虚无力托脓者，加生黄芪托里透脓。故选B。","p":"p7"},{"n":17,"t":"A1型","q":"肺痈恢复期，其治法是","pre":"","o":[["A","滋补脾肾清肺"],["B","益气养阴清肺"],["C","补益气血养肺"],["D","补肺益气养阴"],["E","益气清肺化浊"]],"a":"B","x":"肺痈恢复期，邪毒渐去，肺体损伤，阴伤气耗，治宜益气养阴清肺。故选B。","p":"p9"},{"n":18,"t":"A1型","q":"下列不属于肺痈成痈期主要临床表现的是","pre":"","o":[["A","身热转甚"],["B","咳吐黄稠痰，或黄绿色痰"],["C","烦躁不安"],["D","咳吐脓血痰，或如米粥"],["E","胸痛"]],"a":"D","x":"咳吐脓血痰，或如米粥，为肺痈溃脓期主要临床表现。故选D。","p":"p6"},{"n":19,"t":"A1型","q":"肺痈恢复期，病情时轻时重，迁延不愈者，其首选方剂是","pre":"","o":[["A","银翘散"],["B","桔梗杏仁煎"],["C","桔梗白散"],["D","补中益气汤"],["E","加味桔梗汤"]],"a":"B","x":"肺痈恢复期，病情时轻时重，迁延不愈者，为邪恋正虚，用桔梗杏仁煎加减，益气养阴，排脓解毒。故选B。","p":"p9"},{"n":20,"t":"A1型","q":"下列关于肺痈患者的调护，说法错误的是","pre":"","o":[["A","多吃水果，如橘子、梨、枇杷等"],["B","可用薏米煨粥食之"],["C","注意寒温适度，谨避风寒"],["D","绝对卧床休息"],["E","宜食清淡之品，多食蔬菜"]],"a":"D","x":"肺痈患者应保持适当的活动，有利于痰的排出，促进康复。故选D。","p":"p10"},{"n":21,"t":"A2型","q":"患者，男，43岁。始恶寒发热，咳嗽，咳白色黏痰，痰量逐渐增多，胸痛，咳则尤甚，呼吸不利，口干鼻燥，苔薄黄，脉浮数。其最有可能的诊断是","pre":"","o":[["A","咳嗽，风热犯肺"],["B","咳嗽，风燥伤肺"],["C","肺痈，初期"],["D","感冒，风热犯表"],["E","肺痈，成痈期"]],"a":"C","x":"肺痈初期表现为恶寒发热，咳嗽，胸痛，咳时尤甚，咳吐白色黏痰，痰量由少渐多，呼吸不利，口干鼻燥，舌尖红，苔薄黄或薄白少津，脉浮数而滑。故选C。","p":"p5"},{"n":22,"t":"A2型","q":"肺痈患者，壮热面赤，咳嗽气急，咯痰腥臭，痰色黄绿，口渴。其治法是","pre":"","o":[["A","清肺化痰活血"],["B","排脓解毒"],["C","养阴清肺解毒"],["D","清肺化瘀消痈"],["E","清热解毒化痰"]],"a":"D","x":"邪热从表入里，热毒内盛，正邪交争，故壮热面赤；热毒壅肺，肺气上逆，则咳嗽气急；痰浊瘀热郁蒸成痈，则咯痰腥臭，痰色黄绿；热入血分，耗津伤液，则口渴。故辨证为肺痈成痈期，治宜清肺化瘀消痈。故选D。","p":"p6"},{"n":23,"t":"A2型","q":"患者，男，30岁。咳吐大量脓血痰，或如米粥，腥臭异常，有时咯血，胸中烦满而痛。其分期是","pre":"","o":[["A","成痈期"],["B","初期"],["C","溃脓期"],["D","恢复期"],["E","以上皆非"]],"a":"C","x":"肺痈溃脓期，热壅血瘀，血败肉腐，痈肿内溃，脓液外泄，可见咳吐大量脓血痰，味腥臭，甚则咯血。故选C。","p":"p7"},{"n":24,"t":"A2型","q":"患者，男，35岁。既往有肺脓肿病史，现时咳唾浊痰，痰色黄绿而味腥。其治疗应首选","pre":"","o":[["A","清金化痰汤"],["B","千金苇茎汤"],["C","加减泻白散"],["D","定喘汤"],["E","加味桔梗汤"]],"a":"B","x":"患者咳唾浊痰，故诊断为肺痈。痰浊瘀热郁蒸成痈，则痰黄绿而味腥，故诊断为成痈期。治以清肺解毒，化瘀消痈，代表方剂为千金苇茎汤合如金解毒散加减，根据最佳选项原则，选择千金苇茎汤化痰泄热，通瘀散结消痈。故选B。","p":"p6"},{"n":25,"t":"A2型","q":"患者，男，38岁。1周前因外出淋雨，出现高热寒颤，汗出烦躁。现胸满作痛，转侧不利，咳吐浊痰，呈黄绿色，自觉喉间有腥味，口干咽燥，舌苔黄腻，脉滑数。其最可能的诊断是","pre":"","o":[["A","肺痈，初期"],["B","感冒，风热犯表"],["C","肺痈，成痈期"],["D","肺痈，溃脓期"],["E","咳嗽，痰热蕴肺"]],"a":"C","x":"患者胸痛，咳吐黄绿色腥臭痰，舌脉提示热象重，为肺痈成痈期表现。故选C。","p":"p6"},{"n":26,"t":"A2型","q":"患者，女，40岁。恶寒发热，咳嗽，胸痛，咳时尤甚，咯吐白色黏痰，痰量由少渐多，呼吸不利，口干鼻燥，舌质淡红，苔薄黄，浮数而滑。其治疗应首选","pre":"","o":[["A","银翘散"],["B","千金苇茎汤"],["C","加味桔梗汤"],["D","清燥救肺汤"],["E","如金解毒散"]],"a":"A","x":"肺痈初期风热外袭，卫表不和，邪热壅肺，肺失清肃，可见上述症状。治宜疏散风热，清肺化痰，代表方剂为银翘散。故选A。","p":"p5"},{"n":27,"t":"A2型","q":"患者，男，42岁。2周前咳吐大量脓血相兼腥臭痰，现身热渐退，咳嗽减轻，咯吐脓痰渐少，臭味亦淡，痰液转为清稀，气短自汗，心烦，口燥咽干，面色少华，形体消瘦，精神萎靡，舌质红，苔薄，脉细数无力。其最可能的诊断是","pre":"","o":[["A","感冒，阴虚感冒"],["B","咳嗽，肺阴亏虚"],["C","肺痈，溃脓期"],["D","咳嗽，痰热蕴肺"],["E","肺痈，恢复期"]],"a":"E","x":"肺痈恢复期，邪毒渐去，肺体损伤，阴伤气耗，可见身热渐退，咳嗽减轻，咯吐脓血渐少，痰液转为清稀，气短自汗，脉细数等。故选E。","p":"p9"},{"n":28,"t":"A2型","q":"患者咳嗽，胸痛，发热，咯吐腥臭浊痰及脓血。其最可能的诊断为","pre":"","o":[["A","肺痿"],["B","咳嗽"],["C","肺痨"],["D","肺痈"],["E","肺癌"]],"a":"D","x":"肺痈是以咳嗽、胸痛、发热、咳吐腥臭浊痰甚则脓血相兼为主症的疾病，属内痈范围。故选D。","p":"p1"},{"n":29,"t":"A2型","q":"患者，男，36岁。壮热面赤，咳嗽气急，咯痰腥臭，痰色黄绿，口渴，舌红，苔黄腻，脉滑数有力。其治法是","pre":"","o":[["A","疏散风热，清肺化痰"],["B","排脓解毒"],["C","益气养阴，清肺解毒"],["D","清热解毒，化瘀消痈"],["E","清热解毒，宣肺化痰"]],"a":"D","x":"肺痈成痈期，热毒蕴肺，蒸液成痰，热壅血瘀，蕴酿成痈。治当清热解毒，化瘀消痈。故选D。","p":"p6"},{"n":30,"t":"A2型","q":"患者咯吐大量脓血痰，腥臭异常，身热，面赤，烦渴喜饮，胸中烦满而痛，气喘不能卧，舌红，苔黄腻，脉滑数。其治疗应首选","pre":"","o":[["A","银翘散"],["B","千金苇茎汤"],["C","清燥救肺汤"],["D","如金解毒散"],["E","加味桔梗汤"]],"a":"E","x":"肺痈溃脓期，热壅血瘀，血败肉腐，痈肿内溃，脓液外泄。治宜排脓解毒，代表方剂为加味桔梗汤。故选E。","p":"p7"},{"n":31,"t":"A2型","q":"肺痈患者身热渐退，咳嗽减轻，咯吐脓血少，痰液转为清稀，精神稍倦，气短乏力，自汗，面色不华，舌红苔薄，脉细。其治疗应首选","pre":"","o":[["A","沙参清肺汤合竹叶石膏汤加减"],["B","百合固金汤"],["C","清燥救肺汤"],["D","沙参麦冬汤合清肺化痰汤加减"],["E","加味桔梗汤"]],"a":"A","x":"肺痈恢复期，邪毒渐去，肺体损伤，阴伤气耗，治宜益气养阴清肺，代表方剂为沙参清肺汤合竹叶石膏汤加减。前方益气养阴，清肺化痰，后方清热生津，益气和胃。故选A。","p":"p9"},{"n":32,"t":"A2型","q":"肺痈患者，现咯吐大量脓血痰，腥臭异常，有时咯血，身热，面赤，烦渴喜饮，胸中烦满而痛，甚则气喘不能卧，经治疗后，下列哪一项提示预后不良","pre":"","o":[["A","声音清朗"],["B","脓血稀而渐少"],["C","臭味转淡"],["D","胸胁少痛"],["E","脓血如败卤"]],"a":"E","x":"溃脓期是病情顺和逆的转折点。顺证见溃后声音清朗，脓血稀而渐少，臭味转淡，饮食知味，胸胁少痛，身体不热，脉象缓滑。逆证见溃后音哑无力，脓血如败卤，腥味异常，气喘鼻扇，胸痛，食少，身热不退，颧红，指甲青紫，脉弦涩或弦急。咳脓血如败卤为肺叶腐败之恶候。故选E。","p":"p8"},{"n":33,"t":"A2型","q":"患者身热转甚，汗出身热不解，胸满作痛，转侧不利，咳吐黄稠痰，自觉喉间有腥味，咳嗽气急，口干咽燥，烦躁不安，舌质红，苔黄腻，脉滑数有力。以下用药不合适的是","pre":"","o":[["A","苇茎、冬瓜子"],["B","桔梗、黄芩"],["C","黄连、黄柏、山栀"],["D","太子参、黄芪"],["E","鱼腥草、金荞麦"]],"a":"D","x":"该例患者热象加重，辨证属肺痈成痈期，治拟清热解毒，化瘀消痈。党参、黄芪益气生肌，可在肺痈恢复期应用。故选D。","p":"p6"},{"n":34,"t":"A2型","q":"患者咯吐大量脓血痰，腥臭异常，身热，面赤，烦渴喜饮，胸中烦满而痛。以下哪项提示预后不良","pre":"","o":[["A","身热不退"],["B","声音清朗"],["C","痰液臭味转淡"],["D","饮食知味"],["E","身不发热"]],"a":"A","x":"溃脓期是病情顺和逆的转折点。逆证见溃后音哑无力，脓血如败卤，腥味异常，气喘鼻扇，胸痛，食少，身热不退，颧红，指甲青紫，脉弦涩或弦急。身热不退为肺叶腐败之恶候。故选A。","p":"p8"},{"n":35,"t":"A2型","q":"患者，男，35岁。身热转甚，汗出身热不解，胸满作痛，转侧不利，咳吐黄绿色痰，咳嗽气急，口干咽燥，舌质红，苔黄腻，脉滑数有力。其诊断及治疗应首选","pre":"","o":[["A","肺痈初期，桑菊饮"],["B","肺痈初期，银翘散"],["C","肺痈成痈期，千金苇茎汤合如金解毒散加减"],["D","肺痈成痈期，清金化痰汤合黄连解毒汤加减"],["E","肺痈恢复期，沙参清肺汤合竹叶石膏汤加减"]],"a":"C","x":"根据临床表现应诊为肺痈成痈期，治宜千金苇茎汤合如金解毒散加减。故选C。","p":"p6"},{"n":36,"t":"A3型","q":"该患者最可能的诊断是","pre":"患者杨某，男，30岁，农民。患者发热恶寒，咳嗽，咳白黏痰，痰量由少渐多，胸痛，咳时尤甚，呼吸不利，苔薄黄，脉浮滑数。","o":[["A","肺痈，初期"],["B","肺痈，恢复期"],["C","咳嗽，风热犯肺"],["D","咳嗽，痰热郁肺"],["E","肺痈，成痈期"]],"a":"A","x":"肺痈初期，风热外袭，卫表不和，见恶寒发热，邪热壅肺，肺失清肃，见咳嗽咳痰，痰量渐多，肺络受损，见胸痛，呼吸不利。故选A。","p":"p5"},{"n":37,"t":"A3型","q":"该患者最合适的治法为","pre":"患者杨某，男，30岁，农民。患者发热恶寒，咳嗽，咳白黏痰，痰量由少渐多，胸痛，咳时尤甚，呼吸不利，苔薄黄，脉浮滑数。","o":[["A","清热解毒，化瘀消痈"],["B","疏散风热，清肺化痰"],["C","排脓解毒"],["D","益气养阴清肺"],["E","益气扶正，宣肺解表"]],"a":"B","x":"肺痈初期风热外袭，卫表不和，邪热壅肺，肺失清肃。治法为疏散风热，清肺化痰。故选B。","p":"p5"},{"n":38,"t":"A3型","q":"其治法为","pre":"患者范某，男，30岁。振寒，继而壮热，咳嗽气急，咳吐黄绿色浊痰，腥臭味，胸痛不得转侧，口干咽燥，苔黄腻，脉滑数。","o":[["A","清热解毒，化瘀消痈"],["B","疏散风热，清肺化痰"],["C","排脓解毒"],["D","益气养阴清肺"],["E","益气养阴，排脓解毒"]],"a":"A","x":"邪热从表入里，热毒内盛，正邪交争，故壮热面赤；热毒壅肺，肺气上逆，则咳嗽气急；痰浊瘀热郁蒸成痈，则咯痰腥臭，痰色黄绿；热入血分，耗津伤液，则口渴。故辨证为肺痈成痈期，治宜清热解毒，化瘀消痈。故选A。","p":"p6"},{"n":39,"t":"A3型","q":"若其胸痛明显，可考虑加入的药物是","pre":"患者范某，男，30岁。振寒，继而壮热，咳嗽气急，咳吐黄绿色浊痰，腥臭味，胸痛不得转侧，口干咽燥，苔黄腻，脉滑数。","o":[["A","金银花、连翘、鱼腥草"],["B","桑白皮、瓜蒌、射干"],["C","瓜蒌、桑白皮、葶苈子"],["D","大黄、枳实"],["E","丹参、延胡索、郁金"]],"a":"E","x":"肺痈成痈期，胸痛甚者，加枳壳、丹参、延胡索、郁金。故选E。","p":"p6"},{"n":40,"t":"B型","q":"肺痈初期，当用何治法","pre":"","o":[["A","益气养阴，排脓解毒"],["B","清热解毒，化瘀消痈"],["C","益气养阴清肺"],["D","疏散风热，清肺化痰"],["E","排脓解毒"]],"a":"D","x":"肺痈的病理演变分为初期、成痈期、溃脓期、恢复期四个阶段。肺痈初期风热外袭，卫表不和，邪热壅肺，肺失清肃，治宜疏散风热，清肺化痰。故选D。","p":"p5"},{"n":41,"t":"B型","q":"肺痈成痈期，当用何治法","pre":"","o":[["A","益气养阴，排脓解毒"],["B","清热解毒，化瘀消痈"],["C","益气养阴清肺"],["D","疏散风热，清肺化痰"],["E","排脓解毒"]],"a":"B","x":"肺痈的病理演变分为初期、成痈期、溃脓期、恢复期四个阶段。肺痈成痈期，热毒蕴肺，蒸液成痰，热壅血瘀，蕴酿成痈。治宜清热解毒，化瘀消痈。“排脓”是溃脓期的治法，成痈期尚未溃脓。故选B。","p":"p6"},{"n":42,"t":"B型","q":"肺痈溃脓期，当用何治法","pre":"","o":[["A","益气养阴，排脓解毒"],["B","清热解毒，化瘀消痈"],["C","益气养阴清肺"],["D","疏散风热，清肺化痰"],["E","排脓解毒"]],"a":"E","x":"肺痈的病理演变分为初期、成痈期、溃脓期、恢复期四个阶段。肺痈溃脓期，热壅血瘀，血败肉腐，痈肿内溃，脓液外泄。治宜排脓解毒，代表方剂为加味桔梗汤。故选E。","p":"p7"},{"n":43,"t":"B型","q":"肺痈恢复期，当用何治法","pre":"","o":[["A","益气养阴，排脓解毒"],["B","清热解毒，化瘀消痈"],["C","益气养阴清肺"],["D","疏散风热，清肺化痰"],["E","排脓解毒"]],"a":"C","x":"肺痈恢复期，邪毒渐去，肺体损伤，阴伤气耗。治宜益气养阴清肺。故选C。","p":"p9"},{"n":44,"t":"多选","q":"治疗肺痈恢复期，代表方剂为","pre":"","o":[["A","加味桔梗汤"],["B","沙参清肺汤"],["C","桔梗白散"],["D","竹叶石膏汤"],["E","银翘散"]],"a":"BD","x":"肺痈恢复期，邪毒渐去，肺体损伤，阴伤气耗。治宜益气养阴清肺，代表方剂为沙参清肺汤合竹叶石膏汤加减。前方益气养阴，清肺化痰，后方清热生津，益气和胃。故选B、D。","p":"p9"},{"n":45,"t":"多选","q":"肺痈溃脓期，判断病情顺逆的转化，应观察哪些方面","pre":"","o":[["A","热势的盛衰"],["B","痰血的消长"],["C","饮食的增减"],["D","胸痛的轻重"],["E","呼吸的深浅"]],"a":"ABCD","x":"溃脓期是病情顺和逆的转折点。顺证见溃后声音清朗，脓血稀而渐少，臭味转淡，饮食知味，胸胁少痛，身体不热，脉象缓滑。逆证见溃后音哑无力，脓血如败卤，腥味异常，气喘鼻扇，胸痛，食少，身热不退，颧红，指甲青紫，脉弦涩或弦急。故选A、B、C、D。","p":"p8"},{"n":46,"t":"多选","q":"肺痈溃脓期逆证的常见临床表现包括","pre":"","o":[["A","溃脓后身热不退"],["B","溃脓如败卤"],["C","溃脓腥臭异常"],["D","溃脓状如米粥"],["E","脓血稀而渐少"]],"a":"ABC","x":"溃脓期是病情顺和逆的转折点，逆证见溃后音哑无力，脓血如败卤，腥味异常，气喘鼻扇，胸痛，食少，身热不退，颧红，指甲青紫，脉弦涩或弦急。此为肺叶腐败之恶候。故选A、B、C。","p":"p8"},{"n":47,"t":"多选","q":"下列各病证中，可以使用麻杏甘石汤治疗的是","pre":"","o":[["A","感冒属于表寒里热者"],["B","肺痈初起，喘较甚者"],["C","喘证属于风热犯肺者"],["D","饮证属于饮停胸胁，症见咳唾引痛，咳逆气喘者"],["E","心悸属于痰热蕴结，兼风热表证者"]],"a":"ABC","x":"感冒属于表寒里热者，麻杏石甘汤中麻黄有解表之功，石膏、杏仁清热平喘，符合病机。肺痛初起，喘较甚者，其机理为风热犯表，邪热壅肺。喘证属于风热犯肺者，其机理为风热犯肺、肺热壅盛、肺失肃降。故选A、B、C。","p":"p5"},{"n":48,"t":"多选","q":"肺痈传统诊断方法包括","pre":"","o":[["A","验痰法"],["B","验舌质"],["C","验爪甲"],["D","验口味"],["E","验舌苔"]],"a":"ACD","x":"肺痈传统诊断方法包括验痰法、验爪甲、验口味三种方法。故选A、C、D。","p":"p3"}]},"04-06":{"name":"肺痨","lecture":"4-6 肺痨.pdf","points":[{"id":"p1","name":"概念与主症","teach":"<p>肺痨：由<b>痨虫<\/b>感染肺脏所致，以<mark>咳嗽、咯血、潮热、盗汗<\/mark>（四大主症）及身体逐渐消瘦为主症的<b>传染性<\/b>疾病，相当于肺结核。<\/p><p>古代别名两类：按传染性——尸注（疰）、虫疰、传尸、鬼疰；按主症——痨瘵、骨蒸、劳嗽、肺痿疾、伏连、急痨。<\/p><p><b>“呷嗽”是哮病别名<\/b>，不是肺痨。<\/p>","src":"讲义 4-6 概述; 题库 #1 #5 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：外因＝感染痨虫（<mark>直接致病因素<\/mark>）；内因＝正气不足（禀赋不足、情志、劳倦伤脾、病后失养）。<\/p><p><b>基本病机<\/b>：痨虫蚀肺，肺阴耗损，阴虚火旺，阴损及阳。<\/p><p><b>病理性质<\/b>：以阴虚为主；可致气阴两虚，甚则阴阳两虚。<\/p><p><b>病位<\/b>：主要在肺，久则传<b>脾、肾<\/b>（肺脾土金相生，肺肾金水相生），也可涉及心肝。<\/p>","src":"讲义 4-6 病因、病机; 题库 #9 #10 #46 解析"},{"id":"p3","name":"诊断与鉴别","teach":"<p><b>诊断<\/b>：咳嗽、咯血、潮热、盗汗、明显消瘦；常有肺痨患者长期接触史。确诊最可靠：<b>痰结核菌培养<\/b>（金标准）。<\/p><table><thead><tr><th>鉴别<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>虚劳<\/td><td>都是慢性虚损；虚劳五脏气血阴阳俱可虚，一般无传染性；肺痨病位在肺、以阴虚为主、<mark>有传染性<\/mark>（关键鉴别点）<\/td><\/tr><tr><td>肺痿<\/td><td>同在肺，都可久咳；肺痿以<mark>咳吐浊唾涎沫<\/mark>为主症、肺叶痿弱不用；肺痨晚期出现干咳、咳吐涎沫即属肺痿<\/td><\/tr><tr><td>肺痈<\/td><td>发热胸痛、咳吐腥臭浊痰，成痈期用千金苇茎汤合如金解毒散<\/td><\/tr><\/tbody><\/table>","src":"讲义 4-6 诊断、鉴别诊断（讲义列痰涂片等检查，确诊“痰培养”按题库 #8）; 题库 #6 #7 #8 #44 解析"},{"id":"p4","name":"辨证要点与治则","teach":"<p><b>治则<\/b>：<mark>补虚培元，治痨杀虫<\/mark>。补虚重在肺、脾、肾，“主乎阴虚”故以滋阴为主，火旺兼降火；兼气虚、阳虚则同时兼顾。<\/p><p><b>四证<\/b>：肺阴亏损、虚火灼肺、气阴耗伤、阴阳两虚（没有“肝火犯肺”）。<\/p><p><b>辨病位<\/b>：初在肺；阴虚火旺多肺肾两虚；气阴耗伤多肺脾同病；阴阳两虚则肺脾肾俱损。<\/p><p><b>逆证<\/b>：大热或低热不退，大量咯血反复，大骨枯槁、大肉陷下、骨枯发焦，喘促短气不续、动则大汗，声低唇紫，脉浮大无根或细而数疾。<\/p>","src":"讲义 4-6 辨证要点、治则治法; 题库 #11 #45 #47 #48 解析"},{"id":"p5","name":"肺阴亏损证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肺阴亏损<\/td><td><mark>干咳，咳声短促<\/mark>，少痰，痰中带血如丝如点、色鲜红，午后手足心热，皮肤干灼，<b>少量<\/b>盗汗，口干咽燥，胸闷隐痛，舌红苔薄少津，脉细或兼数<\/td><td>滋阴润肺<\/td><td>月华丸<\/td><\/tr><\/tbody><\/table><p>证机：肺阴耗伤，津不上承，肺失滋润，肺损络伤。病在肺一脏，火不旺（对比虚火灼肺的呛咳气急、盗汗量多）。<\/p><p>干咳少痰、潮热盗汗但<b>无痰中带血<\/b> → 多诊咳嗽·肺阴亏虚。<\/p><p>加减：痰中带血加白及、白茅根、藕节、仙鹤草；低热加银柴胡、功劳叶、地骨皮。<\/p>","src":"讲义 4-6 证治·肺阴亏损; 题库 #12 #13 #30 #41 #42 解析（#27 解析误写“气阴耗伤之征”，答案月华丸＝肺阴亏损）"},{"id":"p6","name":"虚火灼肺证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>虚火灼肺<\/td><td><mark>呛咳气急<\/mark>，痰少质黏或黄稠量多，时时咯血、色鲜红，午后潮热、骨蒸，<mark>盗汗量多<\/mark>，五心烦热、颧红、心烦失眠、急躁易怒、胸胁掣痛，男子遗精、女子月经不调，舌红绛而干，苔薄黄或剥，脉细数<\/td><td>补益肺肾，滋阴降火<\/td><td>百合固金汤合秦艽鳖甲散<\/td><\/tr><\/tbody><\/table><p>证机：肺肾阴伤，水亏火旺，虚火灼津，阴精耗损（比肺阴亏损多了“肾”和“火”）。<\/p><p>加减：咳血不止加紫珠草、牡丹皮、大黄炭或十灰散；痰黄稠量多加桑白皮、海蛤壳、鱼腥草；盗汗多加煅龙牡、浮小麦；胸胁掣痛加川楝子、延胡索、郁金。<\/p>","src":"讲义 4-6 证治·虚火灼肺（讲义 OCR“不移肺肾”，按题库“补益肺肾”）; 题库 #14 #16 #19 #29 #36 解析"},{"id":"p7","name":"气阴耗伤 vs 阴阳两虚","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>气阴耗伤<\/td><td>咳嗽无力，气短声低，痰中偶夹血、色<b>淡红<\/b>，午后潮热热势不高，自汗盗汗并见，<mark>神疲食少、便溏、面色㿠白<\/mark>，舌嫩红边有齿印，脉细弱而数<\/td><td>养阴润肺，益气健脾<\/td><td>保真汤<\/td><\/tr><tr><td>阴阳两虚<\/td><td>咳逆喘息少气，痰中夹血<b>暗淡<\/b>，声嘶，<mark>面浮肢肿、形寒肢冷、五更泻、阳痿遗精、经少经闭<\/mark>，唇紫，大肉尽脱，舌光淡隐紫或淡胖，脉微细而数或虚大无力<\/td><td>滋阴补阳，培元固本<\/td><td>补天大造丸<\/td><\/tr><\/tbody><\/table><p>气阴耗伤＝肺脾同病；阴阳两虚＝肺脾肾俱损。五更泻合四神丸（补骨脂、肉豆蔻）。虚证暂不用黄连、大黄等苦寒。<\/p>","src":"讲义 4-6 证治·气阴耗伤、阴阳两虚; 题库 #15 #17 #22 #25 #28 #33 解析"},{"id":"p8","name":"医家与调护","teach":"<ul><li>陈无择《三因极一病证方论》：首次出现“劳瘵”病名<\/li><li>葛可久《十药神书》：<b>现存第一部治痨专著<\/b>，治痨十方<\/li><li>朱丹溪：“劳瘵主乎阴虚”，确立<b>滋阴降火<\/b>大法<\/li><li>虞抟《医学正传》：杀虫与补虚两大原则<\/li><\/ul><p><b>调护<\/b>：防重于治，接触患者戴口罩；忌辛辣；体虚可服补药；禁烟酒、慎房事、适当锻炼。<\/p><p><mark>忌大量苦寒<\/mark>：火旺本质是阴虚，宜甘寒养阴、适当清火；苦寒过用伤阴败胃。<\/p>","src":"讲义 4-6 历史沿革、临证备要、预防调护; 题库 #2 #3 #4 #20 解析"}],"q":[{"n":1,"t":"A1型","q":"下列不属于肺痨别名的是","pre":"","o":[["A","尸疰"],["B","鬼疰"],["C","劳嗽"],["D","呷嗽"],["E","传尸"]],"a":"D","x":"呷嗽为哮病的别名，见于隋·巢元方《诸病源候论》。故选D。","p":"p1"},{"n":2,"t":"A1型","q":"首次提出“劳瘵”病名的著作是","pre":"","o":[["A","《十药神书》"],["B","《医学入门》"],["C","《三因极一病证方论》"],["D","《医学正传》"],["E","《痰火点雪》"]],"a":"C","x":"陈无择《三因极一病证方论》首次出现了“劳瘵”的病名。故选C。","p":"p8"},{"n":3,"t":"A1型","q":"我国现存的第一部治痨专著是","pre":"","o":[["A","《理虚元鉴》"],["B","《外台秘要》"],["C","《十药神书》"],["D","《医学入门》"],["E","《医学正传》"]],"a":"C","x":"葛可久《十药神书》是现存第一部治疗肺痨的中医专著，收载了治痨十方。故选C。","p":"p8"},{"n":4,"t":"A1型","q":"提出“劳瘵主乎阴虚”，确立滋阴降火治疗大法的医家是","pre":"","o":[["A","朱丹溪"],["B","葛可久"],["C","李梴"],["D","许叔微"],["E","王焘"]],"a":"A","x":"朱丹溪强调“劳瘵主乎阴虚”，确立了滋阴降火的治疗大法。故选A。","p":"p8"},{"n":5,"t":"A1型","q":"肺痨的四大主症是","pre":"","o":[["A","咳嗽、胸痛、发热、汗出"],["B","干咳、消瘦、低热、自汗"],["C","咳嗽、消瘦、气促、盗汗"],["D","干咳、气促、潮热、胸痛"],["E","咳嗽、咯血、潮热、盗汗"]],"a":"E","x":"肺痨是以咳嗽、咯血、潮热、盗汗及身体逐渐消瘦等为主症的传染性疾病，咳嗽、咯血、潮热、盗汗是其四大主症。故选E。","p":"p1"},{"n":6,"t":"A1型","q":"虚劳和肺痨的关键鉴别要点是","pre":"","o":[["A","有无咳血"],["B","有无低热"],["C","有无肺虚见证"],["D","有无干咳"],["E","有无传染性"]],"a":"E","x":"虚劳与肺痨都是慢性虚损性疾病。虚劳是由于脏腑亏损，导致多种慢性虚损性疾病的总称，病理性质为五脏虚损，可出现五脏气、血、阴、阳亏虚表现，一般无传染性。肺痨是一个独立性疾病，由于体质虚弱，痨虫侵肺所致，病位主要在肺，病理性质以阴虚为主，主要以咳嗽、咯血、潮热、盗汗及身体逐渐消瘦等为其特征，具有传染性。两者最主要的鉴别点是有无传染性。故选E。","p":"p3"},{"n":7,"t":"A1型","q":"下列不属于肺痨和肺痿鉴别要点的是","pre":"","o":[["A","咳吐浊唾涎沫"],["B","咳血"],["C","肺叶痿弱不用"],["D","久咳"],["E","有无传染性"]],"a":"D","x":"肺痨、肺痿病位均在肺，均可见久咳、喘息。故选D。","p":"p3"},{"n":8,"t":"A1型","q":"诊断肺痨最可靠的依据是","pre":"","o":[["A","咳嗽、咯血、潮热、盗汗、身体明显消瘦"],["B","有与肺痨患者的长期接触史"],["C","痰培养"],["D","血沉、结核菌素试验"],["E","胸部X线或者CT检查"]],"a":"C","x":"肺结核是由于结核分枝杆菌感染引起的肺部疾病。痰结核分枝杆菌检查是确诊肺结核病的主要方法，也是制订化疗方案和考核治疗效果的主要依据，结核分枝杆菌培养为痰结核分枝杆菌检查提供准确、可靠的结果，灵敏度高于涂片法，是结核病诊断的“金标准”。故选C。","p":"p3"},{"n":9,"t":"A1型","q":"肺痨日久可以进一步影响除肺之外其他脏腑，其中关系最密切的是","pre":"","o":[["A","心、肾"],["B","脾、肝"],["C","脾、肾"],["D","肝、肾"],["E","心、脾"]],"a":"C","x":"肺痨病位主要在肺，久则可传脾肾，也可涉及心肝。脾肺土金相生，肺肾金水相生，肺为脾之子，肺病子盗母气，肾为肺之子，肺病母不生子，致脾肾两虚。故选C。","p":"p2"},{"n":10,"t":"A1型","q":"肺痨的直接致病因素是","pre":"","o":[["A","后天失调"],["B","感染痨虫"],["C","情志不遂"],["D","劳倦伤脾"],["E","外感六淫"]],"a":"B","x":"肺痨的病因有感染痨虫和正气不足，而痨虫（又称“瘵虫”）是肺痨的直接致病因素。故选B。","p":"p2"},{"n":11,"t":"A1型","q":"对于肺痨的治疗原则，表述最准确的是","pre":"","o":[["A","补虚泻实，调整阴阳"],["B","补虚培元，治痨杀虫"],["C","扶正祛邪，攻补兼施"],["D","急则治标，缓则治本"],["E","以上皆非"]],"a":"B","x":"肺痨治疗当以补虚培元和治痨杀虫为原则。故选B。","p":"p4"},{"n":12,"t":"A1型","q":"干咳少痰，咳声短促，痰中带血丝，胸部隐隐闷痛，午后手足心热，时有盗汗，形体消瘦，口干咽燥，舌边尖红苔薄，脉细数。其证候类型为","pre":"","o":[["A","肺阴亏损"],["B","虚火灼肺"],["C","气阴耗伤"],["D","阴阳两虚"],["E","痰热壅肺"]],"a":"A","x":"肺痨肺阴亏损证表现为干咳，咳声短促，少痰或痰中有时带血，如丝如点，色鲜红，兼午后手足心热，皮肤干灼，或少量盗汗，口干咽燥，胸闷隐痛，舌质红，苔薄少津，脉细或兼数。故选A。","p":"p5"},{"n":13,"t":"A1型","q":"下列不属于肺痨肺阴亏损证常见临床表现的是","pre":"","o":[["A","午后手足心热"],["B","痰中有时带血，如丝如点"],["C","面色㿠白"],["D","咳声短促"],["E","口干咽燥"]],"a":"C","x":"肺痨肺阴亏损证表现为干咳，咳声短促，少痰或痰中有时带血，如丝如点，色鲜红，兼午后手足心热，皮肤干灼，或少量盗汗，口干咽燥，胸闷隐痛，舌质红，苔薄少津，脉细或兼数。故选C。","p":"p5"},{"n":14,"t":"A1型","q":"肺痨虚火灼肺证的主要治法是","pre":"","o":[["A","补益肺肾，滋阴降火"],["B","养阴润肺，益气健脾"],["C","清热解毒，肃肺化痰"],["D","滋阴补阳，培元固本"],["E","滋阴润肺"]],"a":"A","x":"肺痨虚火灼肺证的证机概要为肺肾阴伤，水亏火旺，虚火灼津，灼伤肺络，阴精耗损，主要治法是补益肺肾，滋阴降火。故选A。","p":"p6"},{"n":15,"t":"A1型","q":"肺痨气阴耗伤证的主要治法是","pre":"","o":[["A","补益肺肾，滋阴降火"],["B","养阴润肺，益气健脾"],["C","清热解毒，肃肺化痰"],["D","滋阴补阳，培元固本"],["E","滋阴润肺"]],"a":"B","x":"肺痨气阴耗伤证的证机概要为阴伤气耗，清肃失司，肺虚络损，气阴亏损，主要治法是养阴润肺，益气健脾。故选B。","p":"p7"},{"n":16,"t":"A1型","q":"肺痨虚火灼肺证，若咳血不止者，宜加用","pre":"","o":[["A","桑白皮、海蛤壳、鱼腥草"],["B","紫珠草、牡丹皮、大黄炭"],["C","川楝子、延胡索、郁金"],["D","地骨皮、黄柏、知母"],["E","白及、百部"]],"a":"B","x":"肺痨虚火灼肺证，若咳血不止者，宜加紫珠草、牡丹皮、大黄炭或十灰散凉血止血。故选B。","p":"p6"},{"n":17,"t":"A1型","q":"补天大造丸适用于肺痨何种证候类型","pre":"","o":[["A","阴阳两虚"],["B","气阴耗伤"],["C","虚火灼肺"],["D","肺阴亏损"],["E","以上皆非"]],"a":"A","x":"肺痨阴阳两虚证治法为滋阴补阳，培元固本，代表方剂为补天大造丸。故选A。","p":"p7"},{"n":18,"t":"A1型","q":"秦艽鳖甲散适用于肺痨何种证候类型","pre":"","o":[["A","阴阳两虚"],["B","气阴耗伤"],["C","虚火灼肺"],["D","肺阴亏损"],["E","以上皆非"]],"a":"C","x":"肺痨虚火灼肺证治法为补益肺肾，滋阴降火，代表方剂为百合固金汤合秦艽鳖甲散加减。故选C。","p":"p6"},{"n":19,"t":"A1型","q":"肺痨虚火灼肺证，若咳痰量多黄稠者，宜加用","pre":"","o":[["A","桑白皮、海蛤壳、鱼腥草"],["B","紫珠草、牡丹皮、大黄炭"],["C","川楝子、延胡索、郁金"],["D","地骨皮、黄柏、知母"],["E","白及、百部"]],"a":"A","x":"肺痨虚火灼肺证，若咳痰量多黄稠者，宜加用桑白皮、海蛤壳、鱼腥草清化痰热。故选A。","p":"p6"},{"n":20,"t":"A1型","q":"下列关于肺痨的预防调护叙述错误的是","pre":"","o":[["A","加强体育锻炼"],["B","忌食辛辣刺激、动火燥液之物"],["C","体虚者，可适当服用补药"],["D","肺火标象明显者，可予大量苦寒剂"],["E","接触患者时，应戴口罩"]],"a":"D","x":"肺痨病有时虽具火旺表现，但本质在于阴虚，故当以甘寒养阴为主，适当佐以清火。若徒持苦寒直折，过量或久用，可苦燥伤阴，寒凉败胃伤脾。故选D。","p":"p8"},{"n":21,"t":"A2型","q":"患者，男，45岁。病起半年，呛咳气急，痰少质黏，痰中带血，颧红，口干咽燥，午后潮热，梦遗，盗汗量多，心烦失眠，舌质干红，苔薄黄，脉细数。其治法是","pre":"","o":[["A","滋阴润肺"],["B","养阴润肺，益气健脾"],["C","滋阴补阳，培元固本"],["D","补益肺肾，滋阴降火"],["E","润燥化痰，补脾益肾"]],"a":"D","x":"患者咳嗽、咯血、潮热、盗汗，故诊断为肺痨。呛咳气急，为阴津受损，阴虚肺燥，肺失滋润所致；肺损络伤，故痰中带血；阴虚生热，虚热内灼，故颧红，口干咽燥，午后潮热；肺肾相生，肺虚肾失滋生之源，故梦遗；舌质干红，苔薄黄，脉细数，均为阴虚火旺之象。辨证为虚火灼肺，其治法是补益肺肾，滋阴降火。故选D。","p":"p6"},{"n":22,"t":"A2型","q":"患者，男，66岁。肺痨迁延2年余，咳嗽声低无力，痰白质黏，痰中偶夹有血，血色淡红，午后潮热，面颧红赤，神疲乏力，食欲不振，大便溏薄，自汗，盗汗，面色少华，舌光，边有齿印，脉细弱。其治疗应首选","pre":"","o":[["A","百合固金汤"],["B","保真汤"],["C","月华丸"],["D","补天大造丸"],["E","秦艽鳖甲散"]],"a":"B","x":"患者肺痨迁延不愈，咳嗽声低无力，午后潮热，面颧红赤，神疲乏力，食欲不振，属气阴耗伤。由阴伤气耗，清肃失司，肺虚络损，气阴亏损所致，治疗应选用养阴润肺、益气健脾的保真汤。故选B。","p":"p7"},{"n":23,"t":"A2型","q":"患者，男，42岁。近1月来干咳，咳声短促，痰中带血丝，血色鲜红，口干咽燥，胸部隐痛，午后手足心热，皮肤干灼，少量盗汗，舌边尖红，苔薄少津，脉细。其治法是","pre":"","o":[["A","滋阴润肺"],["B","养阴润肺，益气健脾"],["C","滋阴补阳，培元固本"],["D","补益肺肾，滋阴降火"],["E","润燥化痰，补脾益肾"]],"a":"A","x":"患者咳嗽、咯血、潮热、盗汗，故诊断为肺痨。干咳，咳声短促，乃阴虚肺燥，肺失滋润所致；肺损络伤，故痰中带血丝；肺阴耗伤，津不上乘，故口干咽燥，午后手足心热；阴精耗损，不能濡养皮肤，故皮肤干灼；舌边尖红，苔薄少津，脉细，均为阴虚之象。辨证为肺阴亏损，其治法是滋阴润肺。故选A。","p":"p5"},{"n":24,"t":"A2型","q":"患者，女，48岁。近半年来咳嗽无力，气短声低，咯痰清稀色白，偶夹血丝，午后潮热，伴有畏风怕冷，自汗盗汗并见，纳少神疲，便溏，面色㿠白，颧红，舌质光淡，边有齿印，苔薄，脉细弱。其治法是","pre":"","o":[["A","滋阴润肺"],["B","养阴润肺，益气健脾"],["C","滋阴补阳，培元固本"],["D","健脾生血"],["E","补益肺肾，滋阴降火"]],"a":"B","x":"患者咳嗽、咯血、潮热、盗汗，故诊断为肺痨。阴伤气耗，肺失滋润，故见咳嗽无力，气短声低，咯痰清稀色白；肺损络伤，故痰中带血丝；气阴耗损，故有畏风怕冷，自汗盗汗并见；气虚脾胃运化失司，故纳少神疲，便溏；舌质光淡，边有齿印，苔薄，脉细弱，均为气阴耗伤之象。辨证为气阴耗伤，其治法是养阴润肺，益气健脾。故选B。","p":"p7"},{"n":25,"t":"A2型","q":"赵某，男，56岁。有肺结核病史2年。现症：咳嗽日久，咳逆喘息，咳痰色白有沫，夹血丝，潮热，自汗盗汗，声嘶，面浮肢肿，肢冷形寒，五更泄泻，大肉尽脱，遗精阳痿，苔黄而剥，舌质光淡隐紫，少津，脉微细而数。其证候类型为","pre":"","o":[["A","肺阴亏损"],["B","虚火灼肺"],["C","气阴耗伤"],["D","阴阳两虚"],["E","以上皆非"]],"a":"D","x":"患者有肺痨病史。咳嗽日久，咳逆喘息，咳痰色白有沫，夹血丝，潮热，自汗盗汗，声嘶，面浮肢肿，肢冷形寒，五更泄泻，大肉尽脱，遗精阳痿，为咳嗽日久，阴伤及阳，肺脾肾俱虚，辨证为阴阳两虚。故选D。","p":"p7"},{"n":26,"t":"A2型","q":"患者，女，45岁。病起半年，晚间时有呛咳气急，痰少质黏，痰中带血丝，血色鲜红，口干咽燥，心烦失眠，盗汗量多，大便干结，舌质红绛而干，苔薄黄，脉细数。若患者咳血不止可加","pre":"","o":[["A","紫珠草、牡丹皮"],["B","生地黄、麦冬"],["C","连翘、牛蒡子"],["D","桑白皮、玄参"],["E","贝母、大青叶"]],"a":"A","x":"若患者咳血不止，可加清热止血之品，紫珠草可以止血，清热解毒，牡丹皮可以清热凉血，止血化瘀。故选A。","p":"p6"},{"n":27,"t":"A2型","q":"患者，女，56岁。干咳，或咯少量黏痰，有时痰中带血，胸部隐痛，午后手足心热，皮肤干灼，或有盗汗，舌质红，苔薄白，脉细数。其治疗应首选","pre":"","o":[["A","百合固金汤"],["B","保真汤"],["C","月华丸"],["D","补天大造丸"],["E","秦艽鳖甲散"]],"a":"C","x":"患者干咳，痰中带血，手足心热，盗汗，故诊断为肺痨。咯少量黏痰，有时痰中带血，胸部隐痛，午后手足心热，皮肤干灼，或有盗汗，为气阴耗伤之征，治疗首选月华丸。故选C。","p":"p5"},{"n":28,"t":"A2型","q":"患者，男，71岁。肺痨迁延5年余，现咳嗽，痰白质稀，声低气怯，午后潮红，颧红，神疲纳少，大便溏薄，自汗，盗汗，偶有痰中带血，面色少华，舌光，边有齿印，脉细弱。其治疗暂不考虑使用的中药是","pre":"","o":[["A","人参、麦冬"],["B","黄芪、麦冬"],["C","黄连、大黄"],["D","生地黄、五味子"],["E","当归、枸杞"]],"a":"C","x":"患者有肺痨病史，声低气怯，午后潮红，神疲纳少，大便溏薄，自汗，盗汗，为阴损及阳，肺脾肾俱虚， 暗红血丝，活动后喘息，潮热，自汗，盗汗，面浮肢肿，唇紫，肢冷，消瘦，阳痿，舌质隐紫少津，脉微细。其治法是","pre":"","o":[["A","滋阴润肺"],["B","养阴润肺，益气健脾"],["C","滋阴降火"],["D","益气健脾，化痰止咳"],["E","滋阴补阳，培元固本"]],"a":"E","x":"患者咳嗽、咯血、潮热、盗汗，故诊断为肺痨。阴伤及阳，精气虚竭，肺、脾、肾俱损，故咳嗽，咯痰色白，夹有暗红血丝，活动后喘息，潮热，自汗，盗汗，面浮肢肿，唇紫，肢冷，消瘦，阳痿；舌质隐紫少津，脉微细，为精气虚竭之象。故诊断为阴阳两虚，治宜滋阴补阳，培元固本。故选E。","p":"p7"},{"n":41,"t":"B型","q":"干咳，咳声短促，少痰，痰中有时带血，如丝如点，色鲜红，兼午后手足心热，皮肤干灼，少量盗汗，口干咽燥，胸闷隐痛，伴有身体日渐消瘦，舌质红，苔薄少津，脉细或兼数。最有可能的诊断是","pre":"","o":[["A","咳嗽，肺阴亏虚"],["B","肺痨，虚火灼肺"],["C","咳嗽，风燥伤肺"],["D","咳血，阴虚肺热"],["E","肺痨，肺阴亏损"]],"a":"E","x":"患者咳嗽、咯血、潮热、盗汗，故诊断为肺痨。干咳，咳声短促，为阴虚肺燥，肺失滋润所致；肺损络伤，故痰中带血丝；肺阴耗伤，津不上乘，故口干咽燥；阴虚内热，故午后手足心热，盗汗；舌边尖红苔薄，脉细数，均为阴虚之象。故辨证为肺阴亏损。故选E。","p":"p5"},{"n":42,"t":"B型","q":"干咳，咳声短促，痰少质黏色白，或声音逐渐嘶哑，口干咽燥，午后潮热，颧红盗汗，神疲乏力，舌红少苔，脉细数。最有可能的诊断是","pre":"","o":[["A","咳嗽，肺阴亏虚"],["B","肺痨，虚火灼肺"],["C","咳嗽，风燥伤肺"],["D","咳血，阴虚肺热"],["E","肺痨，肺阴亏损"]],"a":"A","x":"患者干咳，咳声短促，痰少质黏色白，故诊断为咳嗽。肺阴亏虚，虚热内灼，肺失润降，津液不能上乘，故口干咽燥，午后潮热，颧红盗汗，神疲乏力。辨证为肺阴亏虚。故选A。","p":"p5"},{"n":43,"t":"B型","q":"咳呛气急，痰少质黏，时时咯血，血色鲜红，午后骨蒸潮热，盗汗量多，五心烦热，颧红，口渴，心烦失眠，急躁易怒，胸胁掣痛，舌质红绛而干，苔薄黄，脉细数。最有可能的诊断及治疗首选方是","pre":"","o":[["A","肺痿，麦门冬汤合清燥救肺汤加减"],["B","肺痈，千金苇茎汤合如金解毒散加减"],["C","肺痨，百合固金汤合秦艽鳖甲散加减"],["D","肺痨，保真汤"],["E","虚劳，沙参麦冬汤"]],"a":"C","x":"患者咳嗽、咯血、潮热、盗汗，故诊断为肺痨。呛咳气急，为阴津受损，阴虚肺燥，肺失滋润所致；肺损络伤，故痰中带血；肺肾相生，阴虚生热，虚热内灼，故颧红，午后骨蒸潮热，盗汗量多；舌质红绛而干，苔薄黄，脉细数，均为阴虚火旺之象。故辨证为虚火灼肺，治以百合固金汤合秦艽鳖甲散加减。故选C。","p":"p6"},{"n":44,"t":"B型","q":"身热转甚，汗出身热不解，胸满作痛，转侧不利，咳吐黄稠痰，喉间有腥味，咳嗽气急，口干咽燥，烦躁不安，舌质红，苔黄腻，脉滑数有力。最有可能的诊断及治疗首选方是","pre":"","o":[["A","肺痿，麦门冬汤合清燥救肺汤加减"],["B","肺痈，千金苇茎汤合如金解毒散加减"],["C","肺痨，百合固金汤合秦艽鳖甲散加减"],["D","肺痨，保真汤"],["E","虚劳，沙参麦冬汤"]],"a":"B","x":"患者咳嗽、胸痛、发热、咳吐腥臭浊痰，故诊断为肺痈。热毒蕴肺，蒸液成痰，热壅血血瘀，酝酿成痈，故见身热转甚，汗出身热不解，胸满作痛，转侧不利，咳吐黄稠痰，喉间有腥味，咳嗽气急，口干咽燥，烦躁不安，辨为肺痈成痈期。治宜千金苇茎汤合如金解毒散加减。故选B。","p":"p3"},{"n":45,"t":"多选","q":"肺痨常见的证候类型包括","pre":"","o":[["A","肺阴亏损"],["B","虚火灼肺"],["C","肝火犯肺"],["D","气阴耗伤"],["E","阴阳两虚"]],"a":"ABDE","x":"肺痨的常见证候类型包括肺阴亏损、虚火灼肺、气阴耗伤、阴阳两虚。故选A、B、D、E。","p":"p4"},{"n":46,"t":"多选","q":"肺痨的基本病机是","pre":"","o":[["A","痨虫蚀肺"],["B","肺阴耗损"],["C","阴虚火旺"],["D","阴损及阳"],["E","瘀血内停"]],"a":"ABCD","x":"肺痨的基本病机是痨虫蚀肺，肺阴耗损，阴虚火旺，阴损及阳。故选A、B、C、D。","p":"p2"},{"n":47,"t":"多选","q":"肺痨的治疗原则是","pre":"","o":[["A","和解透邪"],["B","治痨杀虫"],["C","补虚培元"],["D","清热解毒"],["E","滋阴降火"]],"a":"BC","x":"肺痨的治疗原则是治痨杀虫，补虚培元。故选B、C。","p":"p4"},{"n":48,"t":"多选","q":"下列属于肺痨逆证常见临床表现的是","pre":"","o":[["A","脉浮大无根"],["B","持续低热不退"],["C","大肉陷下，骨枯发焦"],["D","短气不续，动则大汗"],["E","脉细而数疾"]],"a":"ABCDE","x":"肺痨逆证的表现有大热或低热不退，大量咯血，反复发作，大骨枯槁，大肉陷下，骨枯发焦，喘，短气不续，动则大汗，声音低微，唇色紫，脉浮大无根，或细而数疾等，病情较重，多为难治。故选A、B、C、D、E。","p":"p4"}]},"04-07":{"name":"肺胀","lecture":"4-7 肺胀.pdf","points":[{"id":"p1","name":"概念与主症","teach":"<p>肺胀：多种慢性肺系疾病反复发作、迁延不愈，以<b>喘息气促，咳嗽咳痰，胸部膨满，憋闷如塞<\/b>，或唇甲紫绀、心悸、肢体浮肿为主症，严重可出现喘脱、昏迷。相当于慢阻肺、肺心病。<\/p><p>主症四字：<mark>咳、喘、痰、胀<\/mark>。“胸痛如刺”不是肺胀主症。<\/p><p>题干认法：老年＋长期吸烟或慢性咳喘病史＋胸部膨满、喘不能平卧 → 肺胀（不诊喘证、哮病）。<\/p>","src":"讲义 4-7 概述、诊断; 题库 #6 #37 #42 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：肺病迁延（久咳、久喘、久哮、肺痨）、六淫乘袭、年老体虚。<b>七情不是<\/b>常见病因。<\/p><p><b>基本病机<\/b>：久病正虚，痰浊、水饮、血瘀互结于肺，气道壅塞，肺气胀满，不能敛降。<\/p><p><b>病位<\/b>：在肺，继及脾肾，后期及心（肺、脾、肾、心，<mark>不含肝<\/mark>）。<\/p><p><b>病理性质<\/b>：本虚标实。<b>病理因素<\/b>：<mark>痰浊、水饮、血瘀<\/mark>（没有燥邪）；早期痰浊为主，渐而痰瘀并见，终至痰、瘀、饮错杂。<\/p>","src":"讲义 4-7 病因、病机; 题库 #7 #9 #54 #57 解析"},{"id":"p3","name":"诊断与鉴别","teach":"<p><b>诊断<\/b>：慢性肺系病史，多见于老年，时轻时重；<mark>常因外感诱发<\/mark>；日久面色晦暗、唇甲紫绀，重者神昏、动风、出血、喘脱。<\/p><table><thead><tr><th>鉴别<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>哮病<\/td><td>反复发作性，<mark>喉中哮鸣有声<\/mark>（痰鸣气喘）；久不愈可发展为肺胀<\/td><\/tr><tr><td>喘证<\/td><td>多种急慢性疾病的一个症状，以呼吸气促困难为主；肺胀可隶属喘证范畴<\/td><\/tr><tr><td>支饮<\/td><td>肺胀外感诱发加剧时可表现为支饮：“咳逆倚息，短气不得卧，其形如肿”<\/td><\/tr><\/tbody><\/table>","src":"讲义 4-7 诊断、鉴别诊断; 题库 #2 #5 #8 解析"},{"id":"p4","name":"辨证要点与治则","teach":"<p><b>辨证要点<\/b>：①辨虚实标本（感邪发作偏标实，平时偏本虚）；②辨病情轻重。没有“辨寒热、辨表里”。<\/p><p><b>危证<\/b>：心慌动悸、面唇紫绀、肢体浮肿、神昏谵语、痉厥、出血、<mark>喘脱<\/mark>，需急救。<\/p><p><b>治则<\/b>：<b>扶正祛邪<\/b>。邪实：祛邪宣肺、降气化痰、温阳利水、调气活血，甚或开窍、息风、止血；正虚：补养心肺、益肾健脾；正气欲脱则扶正固脱、救阴回阳。<\/p>","src":"讲义 4-7 辨证要点、治则治法; 题库 #17 #55 #57 解析"},{"id":"p5","name":"外寒内饮证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>外寒内饮<\/td><td>咳逆喘满不得卧，气短气急，咳痰<b>白稀泡沫<\/b>，胸部膨满，<mark>恶寒、周身酸楚，脉浮紧<\/mark>（有表证），口干不欲饮，苔白滑<\/td><td>温肺散寒，化饮降逆<\/td><td>小青龙汤<\/td><\/tr><\/tbody><\/table><p>证机：外感风寒，内停水饮。<\/p><p>加减：喉中如有水鸡声、表寒不著 → 射干麻黄汤；饮郁化热、烦躁而喘、脉浮 → 小青龙加石膏汤。<\/p>","src":"讲义 4-7 证治·外寒内饮; 题库 #14 #21 #22 #40 解析"},{"id":"p6","name":"痰浊壅肺 vs 痰瘀阻肺","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰浊壅肺<\/td><td>咳嗽痰多色白黏腻或泡沫，短气喘息稍劳即著，<mark>怕风汗多，脘痞纳少，倦怠乏力<\/mark>，苔薄腻，脉滑<\/td><td>化痰降气，健脾益肺<\/td><td>三子养亲汤合苏子降气汤<\/td><\/tr><tr><td>痰瘀阻肺<\/td><td>痰多色白泡沫，喉间痰鸣，喘息不能平卧，胸部膨满憋闷如塞，<mark>面色灰白而暗，唇甲紫绀，舌紫、舌下青筋增粗<\/mark>，脉弦滑<\/td><td>涤痰祛瘀，泻肺平喘<\/td><td>葶苈大枣泻肺汤合桂枝茯苓丸<\/td><\/tr><\/tbody><\/table><p>证机：痰浊壅肺＝痰浊内蕴，肺失宣降，肺虚脾弱；痰瘀阻肺＝<b>肺气壅滞，痰瘀互结<\/b>。单选只给一方时，痰浊壅肺选苏子降气汤。<\/p>","src":"讲义 4-7 证治·痰浊壅肺、痰瘀阻肺; 题库 #15 #18 #24 #30 #48 #51 解析"},{"id":"p7","name":"痰热郁肺证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰热郁肺<\/td><td>咳逆喘息<b>气粗<\/b>，痰黄或白、黏稠难咯，<mark>胸满烦躁，目胀睛突<\/mark>，或发热汗出、微恶寒，口渴，溲黄便干，舌暗红，苔黄或黄腻，脉滑数<\/td><td>清肺泄热，降逆平喘<\/td><td>越婢加半夏汤或桑白皮汤<\/td><\/tr><\/tbody><\/table><p>证机：痰浊内蕴，郁而化热，痰热壅肺，清肃失司。<\/p><p>加减：痰鸣喘息不能平卧加<b>射干、葶苈子<\/b>；痰热伤津口干加<b>天花粉、知母、麦冬<\/b>；便秘腹满加大黄、玄明粉；兼瘀加桃仁、赤芍、丹参、地龙。<\/p>","src":"讲义 4-7 证治·痰热郁肺; 题库 #11 #20 #26 #47 #50 解析"},{"id":"p8","name":"痰蒙神窍证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰蒙神窍<\/td><td>咳逆喘促日重，咳痰不爽，<mark>神志异常<\/mark>：表情淡漠、嗜睡、意识朦胧、谵妄、烦躁入夜尤甚、昏迷、撮空理线，或肢体瞤动、抽搐；苔白腻或黄腻，脉细滑数<\/td><td>涤痰，开窍，息风<\/td><td>涤痰汤<\/td><\/tr><\/tbody><\/table><p>证机：痰蒙神窍，引动肝风。另可服至宝丹或安宫牛黄丸清心开窍。<\/p><p>加减：抽搐加钩藤、全蝎、羚羊角粉；出血配水牛角、生地黄、丹皮、紫珠草。“头昏而重”不是本证表现。<\/p>","src":"讲义 4-7 证治·痰蒙神窍; 题库 #10 #12 #13 #28 #49 解析"},{"id":"p9","name":"阳虚水泛 vs 肺肾气虚","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>阳虚水泛<\/td><td><mark>面浮肢肿甚或一身悉肿<\/mark>，脘痞腹胀，尿少，心悸，喘咳不能平卧，痰清稀，怕冷，面唇青紫，舌胖质暗苔白滑，脉沉虚数或结代<\/td><td>温肾健脾，化饮利水<\/td><td>真武汤合五苓散<\/td><\/tr><tr><td>肺肾气虚<\/td><td><mark>呼吸浅短难续<\/mark>，咳声低怯，胸满短气，甚则张口抬肩、倚息不能平卧，痰如白沫，心慌，形寒汗出，面色晦暗，舌淡或暗紫，脉沉细无力<\/td><td>补肺纳肾，降气平喘<\/td><td>平喘固本汤合补肺汤<\/td><\/tr><\/tbody><\/table><p>证机：阳虚水泛＝心肾阳虚，水饮内停；肺肾气虚＝肺肾两虚，气失摄纳。<\/p><p><b>喘脱危象<\/b>（面色苍白、冷汗淋漓、四肢厥冷、血压下降、脉微欲绝）→ 急用<b>参附汤送服蛤蚧粉<\/b>或黑锡丹；稳定期常服皱肺丸。<\/p>","src":"讲义 4-7 证治·阳虚水泛、肺肾气虚; 题库 #16 #19 #32 #34 #35 #43 #53 解析"},{"id":"p10","name":"医家与调护","teach":"<ul><li>病名首见《<b>黄帝内经<\/b>》：《灵枢·胀论》“肺胀者，虚满而喘咳”<\/li><li>张仲景《金匮要略》：“咳而上气，此为肺胀，其人喘，目如脱状”；载越婢加半夏汤、小青龙加石膏汤<\/li><li><b>朱丹溪<\/b>《丹溪心法》：痰夹瘀血碍气，四物汤加桃仁、诃子——开活血化瘀治肺胀之先河<\/li><li>巢元方：肺虚为微寒所伤；李用粹《证治汇补》：分虚实辨治<\/li><\/ul><p><b>调护<\/b>：重在防治原发病；加强锻炼；适寒温、预防感冒；避免烟尘；外感诱发立即治疗。<\/p>","src":"讲义 4-7 历史沿革、预防调护; 题库 #1 #3 #4 #56 解析"}],"q":[{"n":1,"t":"A1型","q":"肺胀病名首见于","pre":"","o":[["A","《金匮要略》"],["B","《诸病源候论》"],["C","《丹溪心法》"],["D","《证治汇补》"],["E","《黄帝内经》"]],"a":"E","x":"肺胀病名首见于《黄帝内经》，《灵枢·胀论》曰：“肺胀者，虚满而喘咳。”《灵枢·经脉》曰：“肺手太阴之脉……是动则病肺胀满，膨膨而喘咳。”故选E。","p":"p10"},{"n":2,"t":"A1型","q":"根据《金匮要略·痰饮咳嗽病脉证并治》“咳逆倚息，短气不得卧，其形如肿”的描述，以下哪种疾病亦属于肺胀范畴","pre":"","o":[["A","支饮"],["B","悬饮"],["C","喘证"],["D","水肿"],["E","咳嗽"]],"a":"A","x":"肺胀因外感诱发，病情加剧时，可表现为痰饮病中的“支饮”，即《金匮要略·痰饮咳嗽病脉证并治》所述之支饮，症见“咳逆倚息，短气不得卧，其形如肿”。故选A。","p":"p3"},{"n":3,"t":"A1型","q":"《金匮要略》“咳而上气……其人喘，目如脱状”所述疾病是","pre":"","o":[["A","肺痿"],["B","肺胀"],["C","肺痈"],["D","哮病"],["E","喘证"]],"a":"B","x":"《金匮要略·肺痿肺痈咳嗽上气病脉证治》谓：肺胀“咳而上气，此为肺胀，其人喘，目如脱状”。故选B。","p":"p10"},{"n":4,"t":"A1型","q":"提出肺胀与痰瘀互结、阻碍肺气有关，可用四物汤加桃仁等药物治疗，开活血化瘀治疗肺胀之先河的医家是","pre":"","o":[["A","巢元方"],["B","朱丹溪"],["C","张仲景"],["D","张璐"],["E","李用粹"]],"a":"B","x":"《丹溪心法·咳嗽》谓：“肺胀而咳，或左或右，不得眠，此痰夹瘀血，碍气而病，宜养血以流动乎气，降火疏肝以清痰，四物汤加桃仁、诃子、青皮、竹沥、姜汁之类。”提出肺胀与痰瘀互结、阻碍肺气有关，可用四物汤加桃仁等药物治疗，开活血化瘀治疗肺胀之先河。故选B。","p":"p10"},{"n":5,"t":"A1型","q":"下列关于肺胀描述不正确的是","pre":"","o":[["A","发病年龄多为老年"],["B","有长期慢性咳喘病史"],["C","病程缠绵，时轻时重，日久可见面色晦暗，唇甲发绀等症"],["D","病重可并发神昏、动风或出血等症"],["E","不易因外感而诱发"]],"a":"E","x":"肺胀每因复感外邪诱使病情发作或加剧。故选E。","p":"p3"},{"n":6,"t":"A1型","q":"下列不属于肺胀辨病主症的是","pre":"","o":[["A","喘息气促"],["B","咳嗽咯痰"],["C","胸部膨满"],["D","胸痛如刺"],["E","心悸浮肿"]],"a":"D","x":"肺胀是以喘息气促，咳嗽咳痰，胸部膨满，憋闷如塞，或唇甲发绀，心悸，肢体浮肿，严重者可出现喘脱、昏迷等为主症的疾病。故选D。","p":"p1"},{"n":7,"t":"A1型","q":"下列不属于肺胀常见病因的是","pre":"","o":[["A","久咳久喘"],["B","六淫乘袭"],["C","肺痨失治"],["D","七情不遂"],["E","年老体虚"]],"a":"D","x":"肺痨的病因主要包括肺病迁延、六淫乘袭、年老体虚。故选D。","p":"p2"},{"n":8,"t":"A1型","q":"肺胀和哮病的鉴别要点是","pre":"","o":[["A","痰鸣气喘"],["B","持续咳嗽或气喘"],["C","多有外感诱发加重"],["D","咳痰"],["E","不能平卧"]],"a":"A","x":"哮病是一种发作性的痰鸣气喘疾患，以喉中哮鸣有声为特征；肺胀是多种慢性肺系疾病日久积渐而成，以喘促、咳嗽、咳痰、胸部膨满、憋闷如塞等为临床特征，可有心悸、唇甲发绀、脘腹胀满、肢体浮肿等症状。二者皆可见持续咳嗽或气喘及不能平卧，都可由外感诱发加重。故选A。","p":"p3"},{"n":9,"t":"A1型","q":"下列不属于肺胀常见病理因素的是","pre":"","o":[["A","痰浊"],["B","水饮"],["C","血瘀"],["D","燥邪"],["E","以上皆是"]],"a":"D","x":"肺胀肺、肾、心、脾脏气亏虚为本，痰浊、水饮、血瘀互结为标。故选D。","p":"p2"},{"n":10,"t":"A1型","q":"肺胀患者，意识朦胧，谵妄，烦躁不安，撮空理线，表情淡漠，嗜睡昏迷，或抽搐，咳逆喘促，舌质暗红，苔黄腻，脉滑数。其证候类型为","pre":"","o":[["A","痰瘀阻肺"],["B","痰浊壅肺"],["C","阳虚水泛"],["D","痰蒙神窍"],["E","痰热阻肺"]],"a":"D","x":"肺胀痰蒙神窍证临床表现为咳逆喘促日重，咳痰不爽，表情淡漠，嗜睡，甚或意识朦胧，谵妄，烦躁不安，入夜尤甚，昏迷，撮空理线，或肢体动，抽搐，舌质暗红或淡紫，或紫绛，苔白腻或黄腻，脉细滑数。故选D。","p":"p8"},{"n":11,"t":"A1型","q":"治疗肺胀痰热郁肺证的代表方剂为","pre":"","o":[["A","清金化痰汤"],["B","越婢加半夏汤"],["C","小青龙加石膏汤"],["D","千金苇茎汤"],["E","定喘汤"]],"a":"B","x":"肺胀痰热郁肺证应首选越婢加半夏汤或桑白皮汤。故选B。","p":"p7"},{"n":12,"t":"A1型","q":"下列不属于肺胀痰蒙神窍证常见临床表现的是","pre":"","o":[["A","表情淡漠"],["B","谵妄，烦躁不安"],["C","肢体抽搐"],["D","咯痰不爽"],["E","头昏而重"]],"a":"E","x":"肺胀痰蒙神窍证临床表现为咳逆喘促日重，咳痰不爽，表情淡漠，嗜睡，甚或意识朦胧，谵妄，烦躁不安，入夜尤甚，昏迷，撮空理线，或肢体动，抽搐。故选E。","p":"p8"},{"n":13,"t":"A1型","q":"治疗肺胀痰蒙神窍证的代表方剂为","pre":"","o":[["A","苏合香丸"],["B","礞石滚痰丸"],["C","涤痰汤"],["D","清金化痰汤"],["E","顺气导痰汤"]],"a":"C","x":"治疗肺胀痰蒙神窍证应首选涤痰汤加减。故选C。","p":"p8"},{"n":14,"t":"A1型","q":"小青龙汤常用于肺胀哪种证候类型的治疗","pre":"","o":[["A","外寒内饮"],["B","痰浊壅肺"],["C","痰蒙神窍"],["D","痰瘀阻肺"],["E","阳虚水泛"]],"a":"A","x":"小青龙汤是治疗肺胀外寒内饮证的代表方，临床表现为咳逆喘满不得卧，气短气急，咳痰白稀，呈泡沫状，胸部膨满，恶寒，周身酸楚，或有口干不欲饮，面色青暗。故选A。","p":"p5"},{"n":15,"t":"A1型","q":"肺胀痰瘀阻肺证的证机概要为","pre":"","o":[["A","痰蒙神窍，引动肝风"],["B","心肾阳虚，水饮内停"],["C","肺气壅滞，痰瘀互结"],["D","肺肾两虚，气失摄纳"],["E","外感风寒，内停水饮"]],"a":"C","x":"肺胀痰瘀阻肺证的证机概要为肺气壅滞，痰瘀互结。故选C。","p": 汗出，面色晦暗，舌暗紫，苔白润，脉沉细，证属肺肾气虚证，治当补肺纳肾，降气平喘，首选平喘固本汤合补肺汤加减。故选C。","p":"p9"},{"n":54,"t":"多选","q":"肺胀的病理因素主要为","pre":"","o":[["A","六淫外邪"],["B","情志不畅"],["C","痰浊水饮"],["D","血瘀阻滞"],["E","食滞"]],"a":"CD","x":"肺胀病理因素主要为痰浊、水饮与血瘀，三者互为影响，兼见同病。故选C、D。","p":"p2"},{"n":55,"t":"多选","q":"肺胀的辨证要点主要是","pre":"","o":[["A","辨病情轻重"],["B","辨寒热"],["C","辨表里"],["D","辨虚实"],["E","辨脏腑"]],"a":"AD","x":"肺胀的辨证要点包括辨虚实标本与辨病情轻重。故选A、D、。","p":"p4"},{"n":56,"t":"多选","q":"有关肺胀的预防调护，正确的是","pre":"","o":[["A","重视原发病的治疗"],["B","加强体育锻炼"],["C","既病之后，要预防感冒"],["D","避免接触烟尘"],["E","出现感冒，马上就诊"]],"a":"ABCDE","x":"预防本病，重在先期防治原发病，避免迁延不愈，发展为本病。加强体育锻炼，平时常服扶正固本方药，有助提高抗病能力，防止病情发展。同时宜适寒温，预防感冒，避免接触烟尘，以免诱发加重本病。如因外感诱发，应立即治疗。故选A、B、C、D、E。","p":"p10"},{"n":57,"t":"多选","q":"有关肺胀的描述，正确的是","pre":"","o":[["A","本质是标实本虚，要分清标本主次，虚实轻重"],["B","早期痰浊为主，渐而痰瘀并重"],["C","病位主要在肺、脾、肝、肾"],["D","扶正祛邪为其治疗原则"],["E","正气欲脱时则应扶正固脱，救阴回阳"]],"a":"ABDE","x":"肺胀本质是标实本虚，要分清标本主次，虚实轻重；早期痰浊为主，渐而痰瘀并重；扶正祛邪为其治疗原则；正气欲脱时则应扶正固脱，救阴回阳。病位在肺、脾、肾、心。故选A、B、D、E。","p":"p2"}]},"04-08":{"name":"肺痿","lecture":"4-8 肺痿.pdf","points":[{"id":"p1","name":"概念与鉴别","teach":"<p>肺痿：以<mark>咳吐浊唾涎沫<\/mark>为主症的疾病，肺叶痿弱不用。浊唾＝稠痰、黏痰；涎沫＝稀痰、白痰。见于间质性肺病、肺纤维化、慢阻肺、支扩等。<\/p><p>题干认法：慢性肺系病史（慢阻肺、肺结核、支扩）＋现以咳吐浊唾涎沫为主 → 诊肺痿，不诊肺痨、咳血、虚劳。<\/p><p><b>与肺痈<\/b>：病位同在肺，病因、病程、表现不同；肺痈久延失治可转成肺痿（转归相关，不是“转归不同”）。<b>与肺痨<\/b>：肺痨晚期见干咳、咳吐涎沫即属肺痿。<\/p>","src":"讲义 4-8 概述、诊断; 讲义 4-6 鉴别（肺痨与肺痿）; 题库 #5 #9 #19 #20 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>（两类）：①<mark>久病损肺<\/mark>（最常见）：痰热久嗽、肺痨、肺痈、消渴、热病伤津；或内伤久咳、冷哮、久喘伤阳；②<b>误治津伤<\/b>：滥用汗、吐、下，重亡津液。<\/p><p>久嗽、肺痈、肺痨、哮喘、肺胀、喘证等慢性肺病均可转为肺痿；感冒不会。<\/p><p><b>基本病机<\/b>：肺脏虚损，津气大伤，失于濡养，肺叶枯萎——贯穿始终的是<b>肺津不足<\/b>。<\/p><p><b>病理性质<\/b>：肺燥津伤、肺气虚冷两类。病位在肺，与脾、胃、肾相关。<\/p>","src":"讲义 4-8 病因、病机; 题库 #6 #7 #8 #42 #43 解析"},{"id":"p3","name":"辨证与治则","teach":"<p><b>辨证要点<\/b>：辨<mark>虚热、虚寒<\/mark>（只有这两型）。<\/p><p><b>治则<\/b>：<b>补肺生津<\/b>。<\/p><ul><li>虚热：生津清热，以润其枯<\/li><li>虚寒：温肺益气，而摄涎沫<\/li><\/ul><p>时刻保护津液，重视调理脾肾（培土生金，温肾纳气）。用药忌燥热、苦寒或祛痰峻剂。<\/p>","src":"讲义 4-8 辨证要点、治法方药、临证要点; 题库 #10 #44 解析"},{"id":"p4","name":"虚热证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>虚热<\/td><td>咳吐<b>浊唾<\/b>（稠黏），或咳痰带血，咳声不扬甚则音嘎，气急喘促，<mark>口渴咽燥，舌红而干<\/mark>，潮热盗汗，形体消瘦，皮毛干枯，脉虚数<\/td><td>滋阴清热，生津润肺<\/td><td>麦门冬汤合清燥救肺汤<\/td><\/tr><\/tbody><\/table><p>证机：肺阴亏耗，虚火内炽，灼津为痰。<\/p><p>与虚寒的分界：口渴、舌红 vs 不渴、舌淡。与肺痨区分：肺痨虚火灼肺用百合固金汤合秦艽鳖甲散、肺阴亏损用月华丸，都以咳嗽咯血潮热盗汗为主；肺痿以咳吐浊唾涎沫为主。<\/p>","src":"讲义 4-8 证治·虚热; 题库 #11 #12 #17 #25 #26 #31 解析"},{"id":"p5","name":"虚寒证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>虚寒<\/td><td>咳吐<b>涎沫<\/b>，质清稀量多，<mark>不渴<\/mark>，短气不足以息，头眩，神疲乏力，食少，<mark>形寒，小便数或遗尿<\/mark>，舌质淡，脉虚弱<\/td><td>温肺益气，生津润肺<\/td><td>甘草干姜汤或生姜甘草汤<\/td><\/tr><\/tbody><\/table><p>证机：肺气虚寒，气不化津，津反为涎。<\/p><p>甘草干姜汤＝甘草＋干姜（不是四逆汤、附子干姜汤、苓桂术甘汤）；生姜甘草汤＝生姜、甘草、人参、大枣。<\/p><p>易混：平喘固本汤合补肺汤治的是<b>肺胀<\/b>肺肾气虚（呼吸浅短难续），不治肺痿。<\/p>","src":"讲义 4-8 证治·虚寒; 题库 #13 #14 #22 #24 #39 解析"},{"id":"p6","name":"出处与调护","teach":"<ul><li>病名首见：张仲景《<b>金匮要略<\/b>·肺痿肺痈咳嗽上气病脉证治》<\/li><li>《金匮》病机：“热在上焦”“重亡津液”“肺中冷”；载麦门冬汤、甘草干姜汤（“肺虚为微寒所伤”是巢元方讲肺胀）<\/li><li><b>孙思邈<\/b>：“肺痿虽有寒热之分，从无实热之例”<\/li><li><b>沈金鳌<\/b>《杂病源流犀烛》：切忌升散辛燥温热，以养肺、养气、养血、清金、降火为主<\/li><\/ul><p><b>调护<\/b>：积极治疗咳喘；避免急躁；戒烟；饮食甘淡，忌寒凉油腻；慎起居；<mark>注意耐寒锻炼<\/mark>（“减少运动”是错的）。<\/p>","src":"讲义 4-8 预防调护; 讲义无历史沿革，出处取自题库 #1–#4 #45 解析; 题库 #15"}],"q":[{"n":1,"t":"A1型","q":"肺痿病名首见于","pre":"","o":[["A","《金匮要略》"],["B","《诸病源候论》"],["C","《丹溪心法》"],["D","《肘后备急方》"],["E","《黄帝内经》"]],"a":"A","x":"肺痿的病名最早见于东汉·张仲景《金匮要略·肺痿肺痈咳嗽上气病脉证治》，其云：“寸口脉数，其人咳，口中反有浊唾涎沫者何？师曰：为肺痿病。”故选A。","p":"p6"},{"n":2,"t":"A1型","q":"认为肺痿的病机包括“热在上焦”“重亡津液”“肺中冷”，记载麦门冬汤、甘草干姜汤治疗肺痿的著作是","pre":"","o":[["A","《黄帝内经》"],["B","《伤寒论》"],["C","《金匮要略》"],["D","《千金要方》"],["E","《诸病源候论》"]],"a":"C","x":"《金匮要略》对肺痿的脉因证治均有较为全面的介绍，主要病机有“热在上焦”和“重亡津液”“肺中冷”，所载麦门冬汤、甘草干姜汤沿用至今。故选C。","p":"p6"},{"n":3,"t":"A1型","q":"提出“肺痿虽有寒热之分，从无实热之例”之说的医家是","pre":"","o":[["A","孙思邈"],["B","王焘"],["C","王肯堂"],["D","张璐"],["E","沈金鳌"]],"a":"A","x":"自唐代开始，中医认识到久嗽、肺痈、肺痨、喘哮等慢性肺系疾病可转化为肺痿，病性以虚为主。孙思邈《千金要方·卷十七肺脏方·肺痿》云：“肺痿虽有寒热之分，从无实热之例。”故选A。","p":"p6"},{"n":4,"t":"A1型","q":"提出治疗肺痿“切忌升散辛燥温热。大约此症总以养肺、养气、养血、清金、降火为主”，进一步指出了肺痿的用药宜忌的医家及专著是","pre":"","o":[["A","王肯堂《证治准绳》"],["B","陈实功《外科正宗》"],["C","张璐《张氏医通》"],["D","沈金鳌《杂病源流犀烛》"],["E","喻嘉言《医门法律》"]],"a":"D","x":"沈金鳌《杂病源流犀烛·肺病源流》云：“其症之发，必寒热往来，自汗，气急，烦闷多唾，或带红线脓血，宜急治之，切忌升散辛燥温热。大约此症总以养肺、养气、养血、清金、降火为主。”进一步指出了肺痿的用药宜忌。故选D。","p":"p6"},{"n":5,"t":"A1型","q":"肺痿主要临床表现为","pre":"","o":[["A","咳嗽咳痰"],["B","咳吐浊唾涎沫"],["C","咳嗽喘息"],["D","动则气喘"],["E","咳嗽伴体重下降"]],"a":"B","x":"肺痿是以咳吐浊唾涎沫为主症的疾病。故选B。","p":"p1"},{"n":6,"t":"A1型","q":"下列疾病除哪项外，迁延日久可转化为肺痿","pre":"","o":[["A","肺痈"],["B","肺痨"],["C","久嗽"],["D","哮喘"],["E","感冒"]],"a":"E","x":"自唐代开始，中医认识到久嗽、肺痈、肺痨、哮喘等慢性肺系疾病可转化为肺痿，病性以虚为主。故选E。","p":"p2"},{"n":7,"t":"A1型","q":"肺痿最常见的病因是","pre":"","o":[["A","久病损肺"],["B","饮食不节"],["C","外感六淫"],["D","情志失调"],["E","药食失宜"]],"a":"A","x":"肺痿的病因可分久病损肺和误治津伤两个方面，以前者为主，引起津气亏损，肺失濡养。故选A。","p":"p2"},{"n":8,"t":"A1型","q":"贯穿肺痿发展始终的基本病机是","pre":"","o":[["A","上焦虚热"],["B","肺中虚冷"],["C","邪壅阻肺"],["D","肺津不足"],["E","气虚亏虚"]],"a":"D","x":"肺痿的基本病机为肺脏虚损，津气大伤，失于濡养，以致肺叶枯萎。故选D。","p":"p2"},{"n":9,"t":"A1型","q":"下列关于肺痿与肺痈的鉴别，叙述错误的是","pre":"","o":[["A","病因不同"],["B","病程不同"],["C","转归不同"],["D","病变部位相同"],["E","临床表现不同"]],"a":"C","x":"若肺痈久延不愈，误治失治，痰热塞结上焦，熏灼肺阴，可转成肺痿，因此肺痈可发展至肺痿。故选C。","p":"p1"},{"n":10,"t":"A1型","q":"肺痿的治疗原则是","pre":"","o":[["A","益气养阴"],["B","补肺生津"],["C","清热生津"],["D","温肺益气"],["E","调理脾肾"]],"a":"B","x":"肺痿以补肺生津为原则。故选B。","p":"p3"},{"n":11,"t":"A1型","q":"虚热肺痿的证机概要为","pre":"","o":[["A","肺气虚寒，气不化津，津反为涎"],["B","肺阴亏耗，虚火内炽，灼津为痰"],["C","痰浊内蕴，肺失宣降，肺虚脾弱"],["D","痰热壅肺，清肃失司，肺气上逆"],["E","以上皆非"]],"a":"B","x":"虚热肺痿的证机概要为肺阴亏耗，虚火内炽，灼津为痰。故选B。","p":"p4"},{"n":12,"t":"A1型","q":"治疗虚热肺痿的代表方剂是","pre":"","o":[["A","沙参麦冬汤合黛蛤散加减"],["B","百合固金汤合秦艽鳖甲散加减"],["C","麦门冬汤合清燥救肺汤加减"],["D","月华丸合越鞠丸加减"],["E","玉女煎合泻白散加减"]],"a":"C","x":"治疗虚热肺痿应首选麦门冬汤合清燥救肺汤加减。故选C。","p":"p4"},{"n":13,"t":"A1型","q":"虚寒肺痿的治法是","pre":"","o":[["A","温肺益气，生津润肺"],["B","滋阴清热，生津润肺"],["C","补益肺肾，滋阴降火"],["D","养阴润肺，益气健脾"],["E","滋阴补阳，培元固本"]],"a":"A","x":"虚寒肺痿的治法是温肺益气，生津润肺。故选A。","p":"p5"},{"n":14,"t":"A1型 C","x":"治疗虚寒肺痿应首选甘草干姜汤或生姜甘草汤加减。故选C。","p":"p5"},{"n":39,"t":"B型","q":"治疗肺肾气虚之肺胀应首选","pre":"","o":[["A","麦门冬汤"],["B","沙参麦冬汤"],["C","甘草干姜汤"],["D","百合固金汤"],["E","平喘固本汤合补肺汤加减"]],"a":"E","x":"治疗肺肾气虚之肺胀应首选平喘固本汤合补肺汤加减。故选E。","p":"p5"},{"n":40,"t":"B型","q":"患者有慢性咳喘病史，刻下咳吐浊唾，咳声不扬，气急喘促，口渴咽燥，伴潮热盗汗，形体消瘦，皮毛干枯，舌红而干，脉虚数。其治法是","pre":"","o":[["A","滋阴清热，生津润肺"],["B","益气养阴，宣肺化痰"],["C","健脾益肺，降气止咳"],["D","温肺益气，生津润肺"],["E","清热化痰，降气平喘"]],"a":"A","x":"咳吐浊唾，辨病肺痿。咳声不扬，气急喘促，口渴咽燥，伴潮热盗汗，形体消瘦，皮毛干枯，舌红而干，脉虚数，证属虚热。治当滋阴清热，生津润肺。故选A。","p":"p4"},{"n":41,"t":"B型","q":"患者有慢性咳喘病史，刻下咳吐涎沫，不渴，短气不足以息，头眩，神疲乏力，食少，形寒，小便数，舌质淡，脉虚弱。其治法是","pre":"","o":[["A","滋阴清热，生津润肺"],["B","益气养阴，宣肺化痰"],["C","健脾益肺，降气止咳"],["D","温肺益气，生津润肺"],["E","清热化痰，降气平喘"]],"a":"D","x":"慢性哮喘病史，刻下咳吐涎沫，不渴，短气不足以息，头眩，神疲乏力，食少，形寒，小便数，舌质淡，脉虚弱，证属虚寒肺痿。治当温肺益气，生津润肺。故选D。","p":"p5"},{"n":42,"t":"多选","q":"下列病证迁延日久可转化成肺痿的是","pre":"","o":[["A","肺胀"],["B","肺痈"],["C","肺痨"],["D","喘证"],["E","哮病"]],"a":"ABCDE","x":"自唐代开始，中医认识到久嗽、肺痈、肺痨、哮喘等慢性肺系疾病可转化为肺痿，病性以虚为主。故选A、B、C、D、E。","p":"p2"},{"n":43,"t":"多选","q":"肺痿的主要病因包括","pre":"","o":[["A","久病损肺"],["B","误治津伤"],["C","外感六淫"],["D","情志失调"],["E","药食失宜"]],"a":"AB","x":"肺痿的病因主要有久病损肺、误治津伤。故选A、B。","p":"p2"},{"n":44,"t":"多选","q":"肺痿的主要证候类型包括","pre":"","o":[["A","虚寒"],["B","虚热"],["C","气虚"],["D","阴虚"],["E","阳虚"]],"a":"AB","x":"肺痿证分虚寒、虚热。故选A、B。","p":"p3"},{"n":45,"t":"多选","q":"《金匮要略·肺痿肺痈咳嗽上气病脉证治》所载肺痿的主要病机有","pre":"","o":[["A","热在上焦"],["B","微寒所伤"],["C","重亡津液"],["D","肺中冷"],["E","营卫稽留经脉"]],"a":"ACD","x":"东汉·张仲景《金匮要略·肺痿肺痈咳嗽上气病脉证治》对肺痿的脉因证治均有较为全面的介绍，主要病机有“热在上焦”和“重亡津液”“肺中冷”。隋·巢元方《诸病源候论·咳逆短气候》记载肺胀的病机为“肺虚为微寒所伤”。《灵枢·痈疽》记载“肺痈”，“营卫稽留于经脉之中”。故选A、C、D。","p":"p6"}]},"05-01":{"name":"心悸","lecture":"5-1 心悸.pdf","points":[{"id":"p1","name":"概念与主症","teach":"<p>心悸 = 自觉<b>心中悸动、惊惕不安，甚则不能自主<\/b>。多呈发作性，常伴胸闷、气短、失眠、健忘、眩晕、耳鸣。<\/p><p>病例题：主诉是心慌、心中跳动不安 → 定<b>心悸<\/b>；即使兼心痛如刺（瘀阻心脉），主症仍是悸就定心悸。<\/p><p>常见脉：数、促、结、代、涩、缓、沉、迟。<\/p>","src":"讲义 5-1 概述、诊断; 题库 #5 #44 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：体虚劳倦、七情所伤、感受外邪、药食不当。<\/p><p><b>病位<\/b>在心，与肝、脾、肾、肺密切相关。<\/p><p><b>病机<\/b>：气血阴阳亏虚，心失所养；或痰、饮、火、瘀阻滞心脉，扰乱心神。<\/p><ul><li>虚：气、血、阴、阳亏损<\/li><li>实：痰火扰心、水饮上凌、心血瘀阻<\/li><\/ul><p>初起多心气虚；久则阳虚（心阳不振、水饮凌心）或阴虚（肝肾阴虚、心肾不交）；恶化可心阳暴脱 → 厥脱。<\/p>","src":"讲义 5-1 病因、病机; 题库 #6 #59 解析"},{"id":"p3","name":"惊悸 vs 怔忡","teach":"<table><thead><tr><th><\/th><th>惊悸<\/th><th>怔忡<\/th><\/tr><\/thead><tbody><tr><td>诱因<\/td><td>情绪因素：骤遇惊恐、忧思恼怒、过度紧张<\/td><td>久病体虚、心脏受损，无明显诱因亦发<\/td><\/tr><tr><td>发作<\/td><td><mark>阵发<\/mark>，来速，可自行缓解，不发如常人<\/td><td><mark>持续<\/mark>，心中惕惕不能自控，活动后加重<\/td><\/tr><tr><td>虚实<\/td><td>实证居多，病轻<\/td><td>多属虚证或虚中夹实，病重<\/td><\/tr><\/tbody><\/table><p>惊悸日久可成怔忡。另：奔豚发自<b>少腹<\/b>（冲气上逆），心悸发自心。<\/p>","src":"讲义 5-1 鉴别诊断; 题库 #4 #12 解析"},{"id":"p4","name":"辨证要点与治则","teach":"<p>首辨<b>虚实<\/b>：虚 = 脏腑气血阴阳亏虚；实 = 水饮、瘀血、痰火。多虚实夹杂，分清主次；再分心与他脏病变。<\/p><ul><li>虚证：补气、养血、滋阴、温阳<\/li><li>实证：行气祛瘀、清心泻火、化痰逐饮<\/li><\/ul><p>心悸都有心神不宁 → 各证均酌配<b>安神宁心或镇心<\/b>。<\/p>","src":"讲义 5-1 辨证要点、治则治法; 题库 #62 解析"},{"id":"p5","name":"心虚胆怯 vs 心血不足","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>心虚胆怯<\/td><td><mark>善惊易恐、恶闻声响<\/mark>，坐卧不安，多梦易惊醒，食少，苔薄白，脉细数或细弦<\/td><td>镇惊定志，养心安神<\/td><td>安神定志丸<\/td><\/tr><tr><td>心血不足<\/td><td><mark>面色无华、头晕目眩<\/mark>，气短乏力，失眠健忘，纳呆，舌淡红，脉细弱<\/td><td>补血养心，益气安神<\/td><td>归脾汤<\/td><\/tr><\/tbody><\/table><p>易错：气短乏力、头晕目眩属心血不足，不属心虚胆怯；五心烦热属阴虚火旺。产后、小产后、食少便溏 → 心血不足。<\/p><p>归脾汤加减：阳虚汗出肢冷加炮附子、黄芪、煅龙骨、煅牡蛎；失眠多梦加合欢皮、夜交藤、柏子仁、莲子心；热病后期损及心阴合<b>生脉散<\/b>；五心烦热、脉结代（气阴两虚）用炙甘草汤。<\/p>","src":"讲义 5-1 证治 1、2; 题库 #7 #8 #9 #17 #18 #21-23 #28-30 #47-49 #54 #56 #57 解析。#47 题库称「气血不足」，治法方剂同心血不足；#18 题库加黄芪，讲义未列，从题库"},{"id":"p6","name":"阴虚火旺证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>阴虚火旺<\/td><td><mark>五心烦热、盗汗、舌红少苔、脉细数<\/mark>，心悸易惊，心烦失眠，耳鸣腰酸，急躁易怒，思虑劳心加重<\/td><td>滋阴清火，养心安神<\/td><td>天王补心丹合朱砂安神丸<\/td><\/tr><\/tbody><\/table><p>证机：肝肾阴虚，水不济火，心火内动，扰动心神。<\/p><ul><li>兼遗精腰酸、梦交（肾阴亏虚，虚火妄动）→ 加<b>知柏地黄丸<\/b><\/li><li>火热不明显 → 单用天王补心丹<\/li><li>兼瘀热 → 加赤芍、牡丹皮、桃仁、红花<\/li><li>方中<b>桔梗<\/b>引药上行，以通心气<\/li><\/ul>","src":"讲义 5-1 证治 3; 题库 #10 #11 #19 #24-27 #41-43 解析"},{"id":"p7","name":"心阳不振 vs 水饮凌心","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>心阳不振<\/td><td>心悸，胸闷气短<mark>动则尤甚<\/mark>，面色苍白，形寒肢冷，舌淡苔白，脉沉细无力<\/td><td>温补心阳，安神定悸<\/td><td>桂枝甘草龙骨牡蛎汤合参附汤<\/td><\/tr><tr><td>水饮凌心<\/td><td>心悸<mark>眩晕<\/mark>，胸闷痞满，渴不欲饮，小便短少或下肢浮肿，恶心流涎，舌淡胖苔白滑，脉弦滑<\/td><td>振奋心阳，化气行水，宁心安神<\/td><td>苓桂术甘汤<\/td><\/tr><\/tbody><\/table><p>两证都形寒肢冷。见<b>饮<\/b>的征象（眩晕、尿少浮肿、恶心流涎、苔白滑）→ 水饮凌心。<\/p><p>水饮凌心若因心衰致浮肿、尿少、夜间咳喘、不能平卧 → 重用温阳利水，用<b>真武汤<\/b>。<\/p>","src":"讲义 5-1 证治 4、5; 题库 #13 #15 #16 #20 #31-37 #60 解析"},{"id":"p8","name":"瘀阻心脉 vs 痰火扰心","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>瘀阻心脉<\/td><td>心悸不安，胸闷，<mark>心痛时作，痛如针刺<\/mark>，唇甲青紫，舌紫暗或有瘀斑，脉涩或结代<\/td><td>活血化瘀，理气通络<\/td><td>桃仁红花煎<\/td><\/tr><tr><td>痰火扰心<\/td><td>心悸时作时止，受惊易作，胸闷烦躁，口干苦，便秘尿赤，<mark>苔黄腻，脉弦滑<\/mark><\/td><td>清热化痰，宁心安神<\/td><td>黄连温胆汤<\/td><\/tr><\/tbody><\/table><p>瘀阻证机：心脉瘀阻，心失所养。<\/p><p>加减：桃仁红花煎兼血虚加枸杞子、熟地黄、何首乌；胸痛甚加乳香、没药、五灵脂、蒲黄。黄连温胆汤便秘加<b>生大黄<\/b>；脾虚加党参、白术、谷麦芽、砂仁。<\/p>","src":"讲义 5-1 证治 6、7; 题库 #14 #38-40 #45 #46 #50-53 #55 解析"},{"id":"p9","name":"出处与医家","teach":"<ul><li>《黄帝内经》无心悸病名；《素问·痹论》：心痹者，脉不通，烦则心下鼓<\/li><li>张仲景《伤寒论》《金匮要略》：<b>病名首见<\/b>，称心动悸、心中悸、惊悸；病因惊扰、水饮、虚劳、汗后受邪；主方炙甘草汤<\/li><li>朱丹溪《丹溪心法》：责之<b>虚与痰<\/b><\/li><li>虞抟《医学正传》：惊悸怔忡区别；张景岳：怔忡由阴虚劳损；王清任：血府逐瘀汤；唐容川：虚、痰、瘀、火<\/li><\/ul><p>预防调护：情绪稳定，环境安静；轻者适当锻炼，久病阳虚者以休息为主。<\/p>","src":"讲义 5-1 历史沿革、预防调护; 题库 #1 #2 #3 #58 解析"}],"q":[{"n":1,"t":"A1型","q":"心悸的病名最早见于","pre":"","o":[["A","《黄帝内经》"],["B","《伤寒杂病论》"],["C","《诸病源候论》"],["D","《难经》"],["E","《景岳全书》"]],"a":"B","x":"心悸的病名，首见于东汉·张仲景《金匮要略·惊悸吐衄下血胸满瘀血病脉证治》和《伤寒论·辨太阳病脉证并治》，称之为“心动悸”“心中悸”及“惊悸”等。故选B。","p":"p9"},{"n":2,"t":"A1型","q":"“心痹者，脉不通，烦则心下鼓”载于","pre":"","o":[["A","《黄帝内经》"],["B","《伤寒论》"],["C","《金匮要略》"],["D","《丹溪心法》"],["E","《医学正传》"]],"a":"A","x":"《素问·痹论》云：“脉痹不已，复感于邪，内舍于心”，“心痹者，脉不通，烦则心下鼓”。故选A。","p":"p9"},{"n":3,"t":"A1型","q":"朱丹溪在《丹溪心法》中认为心悸的发病应责之于","pre":"","o":[["A","痰、火"],["B","痰、瘀"],["C","虚、痰"],["D","火、瘀"],["E","惊、虚"]],"a":"C","x":"元·朱丹溪认为心悸的发病应责之虚与痰，如《丹溪心法·惊悸怔忡》云：“惊悸者血虚，惊悸有时，以朱砂安神丸。”“怔忡者血虚，怔忡无时，血少者多，有思虑便动，属虚；时作时止者，痰因火动。”故选C。","p":"p9"},{"n":4,"t":"A1型","q":"惊悸之为病最易为下列哪种因素诱发","pre":"","o":[["A","劳倦过度"],["B","情绪波动"],["C","感受外邪"],["D","饮食不节"],["E","误食药物"]],"a":"B","x":"心悸的发生多因体虚劳倦、七情所伤、感受外邪及药食不当等，惊悸发病，多与情绪因素有关，可由骤遇惊恐、忧思恼怒、悲哀过极或过度紧张而诱发。故选B。","p":"p3"},{"n":5,"t":"A1型","q":"下列属于心悸辨病主症的是","pre":"","o":[["A","心中悸动、惊惕不安"],["B","胸闷、气短"],["C","眩晕、耳鸣"],["D","失眠、健忘"],["E","颤抖乏力"]],"a":"A","x":"心悸是以心中悸动、惊惕不安甚则不能自主为主症的疾病。故选A。","p":"p1"},{"n":6,"t":"A1型","q":"心悸的病位主要在","pre":"","o":[["A","三焦"],["B","心"],["C","肝"],["D","脾"],["E","肾"]],"a":"B","x":"心悸的病位在心，与肝、脾、肾、肺等密切相关。故选B。","p":"p2"},{"n":7,"t":"A1型","q":"下列不属于心悸心虚胆怯证常见临床表现的是","pre":"","o":[["A","心悸不宁，坐卧不安"],["B","善恐易惊，恶闻声响"],["C","气短乏力，头晕目眩"],["D","苔薄白，脉细弦"],["E","失眠多梦"]],"a":"C","x":"心虚胆怯证临床表现为心悸不宁，善惊易恐，坐卧不安，不寐多梦而易惊醒，恶闻声响，食少纳呆，苔薄白，脉细数或细弦。气短乏力、头晕目眩乃心血不足的表现。故选C。","p":"p5"},{"n":8,"t":"A1型","q":"心悸心血不足的治法是","pre":"","o":[["A","镇惊定悸，养心安神"],["B","补血养心，益气安神"],["C","滋阴清火，养心安神"],["D","温补心阳，安神定悸"],["E","振奋心阳，宁心安神"]],"a":"B","x":"心悸心血不足证治宜补血养心，益气安神，代表方剂为归脾汤。故选B。","p":"p5"},{"n":9,"t":"A1型","q":"心悸心虚胆怯证的治法是","pre":"","o":[["A","镇惊定志，养心安神"],["B","补血养心，益气安神"],["C","滋阴清火，养心安神"],["D","温补心阳，安神定悸"],["E","振奋心阳，宁心安神"]],"a":"A","x":"心悸心虚胆怯证治宜镇惊定志，养心安神。故选A。","p":"p5"},{"n":10,"t":"A1型","q":"心悸阴虚火旺证的治法是","pre":"","o":[["A","镇惊定志，养心安神"],["B","滋阴养血，益气安神"],["C","滋阴清火，养心安神"],["D","温补心阳，安神定悸"],["E","振奋心阳，宁心安神"]],"a":"C","x":"心悸阴虚火旺证治宜滋阴清火，养心安神。故选C。","p":"p6"},{"n":11,"t":"A1型","q":"治疗心悸阴虚火旺证应首选","pre":"","o":[["A","一贯煎合芍药甘草汤加减"],["B","归脾汤合五苓散加减"],["C","天王补心丹合朱砂安神丸加减"],["D","知柏地黄丸合芍药甘草汤加减"],["E","黄连温胆汤合安神定志丸加减"]],"a":"C","x":"心悸阴虚火旺证治宜滋阴清火，养心安神，用天王补心丹合朱砂安神丸加减。故选C。","p":"p6"},{"n":12,"t":"A1型","q":"下列关于惊悸与怔忡鉴别要点的叙述错误的是","pre":"","o":[["A","惊悸发病多与情绪因素有关"],["B","惊悸多呈持续性，心中惕惕，不能自控"],["C","惊悸不发时如常人"],["D","惊悸实证居多，怔忡多属虚证"],["E","惊悸日久不愈，亦可形成怔忡"]],"a":"B","x":"怔忡多由久病体虚，心脏受损所致，无明显诱因亦可发生，常呈持续性，心中惕惕，不能自控，活动后加重，多属虚证。故选B。","p":"p3"},{"n":13,"t":"A1型","q":"心悸心阳不振证的治法为","pre":"","o":[["A","镇惊定志，养心安神"],["B","补血养心，益气安神"],["C","辛温散寒，宣通心阳"],["D","温补心阳，安神定悸"],["E","清热化痰，宁心安神"]],"a":"D","x":"心悸心阳不振证治宜温补心阳，安神定悸，代表方剂为桂枝甘草龙骨牡蛎汤合参附汤加减。故选D。","p":"p7"},{"n":14,"t":"A1型","q":"心悸瘀阻心脉证的特点是","pre":"","o":[["A","心悸不安，心痛时作，痛如针刺"],["B","心悸时作，胸闷烦躁，失眠多梦"],["C","心悸眩晕，胸闷痞满，恶心欲吐"],["D","心悸易惊，心烦失眠，五心烦热"],["E","心悸气短，头晕目眩，失眠健忘"]],"a":"A","x":"心悸瘀阻心脉证临床表现为心悸不安，胸闷不舒，心痛时作，痛如针刺，唇甲青紫，舌质紫暗或有瘀斑，脉涩或结或代。故选A。","p":"p8"},{"n":15,"t":"A1型","q":"心悸水饮凌心证的治法为","pre":"","o":[["A","振奋心阳，化气行水，宁心安神"],["B","利水消肿，温肾助阳，宁心安神"],["C","益气温阳，化瘀利水，安神定悸"],["D","活血化瘀，理气通络，宁心安神"],["E","健脾益气，温补心阳，安神定悸"]],"a":"A","x":"心悸水饮凌心证的治法为振奋心阳，化气行水，宁心安神，代表方剂为苓桂术甘汤。故选A。","p":"p7"},{"n":16,"t":"A1型","q":"治疗心悸水饮凌心证应首选","pre":"","o":[["A","真武汤"],["B","五苓散"],["C","苓桂术甘汤"],["D","桂枝甘草龙骨牡蛎汤"],["E","葶苈大枣泻肺汤"]],"a":"C","x":"心悸水饮凌心证的治法为振奋心阳，化气行水，宁心安神，代表方剂为苓桂术甘汤。故选C。","p":"p7"},{"n":17,"t":"A1型","q":"下列不属于心悸心虚胆怯证常见临床表现的是","pre":"","o":[["A","善恐易惊"],["B","多梦易醒"],["C","恶闻声响"],["D","五心烦热"],["E","脉细数"]],"a":"D","x":"心悸心虚胆怯证常见心悸不宁，善惊易恐，坐卧不安，不寐多梦而易惊醒，恶闻声响，食少纳呆，苔薄白，脉细数或细弦。故选D。","p":"p5"},{"n":18,"t":"A1型","q":"心悸心血不足证，若阳虚而汗出肢冷，可加用","pre":"","o":[["A","沙参、玉竹、石斛"],["B","陈皮、谷芽、麦芽"],["C","合欢皮、夜交藤、五味子"],["D","炮附子、黄芪、煅龙骨"],["E","柴胡、郁金、绿萼梅"]],"a":"D","x":"心悸心血不足证，若阳虚而汗出肢冷，加炮附子、黄芪、煅龙骨、煅牡蛎。故选D。","p":"p5"},{"n":19,"t":"A1型","q":"心悸阴虚火旺证常用药中，能够“引药上行，以通心气”的是","pre":"","o":[["A","生地黄"],["B","丹参"],["C","桔梗"],["D","炙甘草"],["E","黄连"]],"a":"C","x":"桔梗引药上行，以通心气。故选C。","p":"p6"},{"n":20,"t":"A1型","q":"心悸水饮凌心证，若心衰而致浮肿、尿少、夜间咳喘或坐起呼吸者，可选用","pre":"","o":[["A","泽泻汤"],["B","真武汤"],["C","桂枝汤"],["D","芍药汤"],["E","五苓散"]],"a":"B","x":"心悸水饮凌心证，因心衰病而致浮肿、尿少、夜间咳喘或坐起呼吸者，重用温阳利水之品，用真武汤加减。故选B。","p":"p7"},{"n":21,"t":"A2型","q":"患者，女，28岁。平素胆小，半月前受惊后出现心悸，坐卧不安，失眠多梦，恶声响，食少纳呆，苔薄白，脉细数。其证候类型是","pre":"","o":[["A","心血不足"],["B","心脾两虚"],["C","瘀阻心脉"],["D","心虚胆怯"],["E","阴虚火旺"]],"a":"D","x":"心虚胆怯临床表现为心悸不宁，善惊易恐，坐卧不安，不寐多梦而易惊醒，恶闻声响，食少纳呆，苔薄白，脉细数或细弦。故选D。","p":"p5"},{"n":22,"t":"A2型","q":"患者，女，23岁。平素体健，有受惊史，现症见心悸，善惊易恐，不敢独居，稍有声响即心悸不安，梦多易醒，神
