<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbfbf9">
<title>内科期中 · 总论→噎膈</title>
<style>
/* Swiss, mobile-first: one column, big tap targets, one signal red. Everything inline, no network. */
:root{--bg:#fbfbf9;--fg:#111;--mute:#6b6b66;--line:#dcdcd6;--red:#e3120b;--ok:#1d7a3a;--warn:#b86e00;--soft:#f0f0ec;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --cn:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
.model{display:grid;gap:0;margin:12px 0}
.model div{border:1.5px solid var(--fg);padding:10px 12px;margin-top:-1.5px}
.model div b{font:800 15px/1.3 var(--cn)}.model div span{display:block;font-size:14px;color:var(--mute)}
.model .arr{border:0;padding:2px 0 2px 16px;margin:0;color:var(--red);font-weight:700;font-size:13px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;margin:10px 0}
.vs div{background:var(--soft);padding:10px}
.tag{display:inline-block;font-size:12px;padding:1px 6px;border:1px solid var(--mute);color:var(--mute);margin-left:4px}
details.intro{border:2px solid var(--fg);padding:0 14px;margin:16px 0}
details.intro>summary{cursor:pointer;font:800 16px/1.3 var(--cn);padding:12px 0;list-style:none}
details.intro>summary::-webkit-details-marker{display:none}
details.intro>summary::after{content:" ＋";color:var(--red)}details.intro[open]>summary::after{content:" －"}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--fg:#f2f2ee;--mute:#9a9a93;--line:#34342f;--red:#ff4136;--ok:#45c06a;--warn:#f0a020;--soft:#1d1d1b;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 var(--cn)}
main{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px)}
button{font:inherit;color:inherit}
.k{font:800 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.k b{color:var(--red)}
h1{font:900 30px/1.15 var(--cn);margin:8px 0 6px}
h2{font:800 18px/1.3 var(--cn);margin:28px 0 8px;padding-top:10px;border-top:2px solid var(--fg)}
.big{font:900 64px/.9 var(--cn);color:var(--red)}
.mute{color:var(--mute);font-size:14px}
.back{all:unset;cursor:pointer;font:700 14px/1 var(--sans);color:var(--mute);padding:10px 0;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);border-block:2px solid var(--fg);margin:16px 0}
.stats div{padding:10px 0;border-bottom:1px solid var(--line)}.stats div:nth-last-child(-n+2){border-bottom:0}.stats b{display:block;font:800 24px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.btn{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;text-align:center;font:700 16px/1 var(--cn);padding:15px 16px;background:var(--fg);color:var(--bg);margin:8px 0}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:none;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.btn[disabled]{opacity:.35;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns .btn{margin:0}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;padding:14px 0;border-bottom:1px solid var(--line)}
.row .n{font:900 26px/1 var(--cn);color:var(--red)}
.row .t{font-weight:700}.row .s{font-size:13px;color:var(--mute);line-height:1.4}
.row .r{font:700 13px/1.2 var(--sans);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);margin-top:6px}.bar i{display:block;height:100%;background:var(--fg)}
.frame{background:var(--soft);padding:12px 14px;margin:12px 0;border-left:3px solid var(--red)}
.teach{font-size:16px}.teach p{margin:8px 0}.teach mark{background:none;color:var(--red);font-weight:700}
.teach ul,.teach ol{padding-left:20px;margin:8px 0}
.tbl{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;min-width:100%;font-size:14px}
th{font:700 12px/1.3 var(--sans);text-align:left;border-bottom:2px solid var(--fg);padding:6px 8px 6px 0;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px 8px 8px 0;vertical-align:top}
td:first-child{min-width:4.5em;font-weight:700}
details.pt{border-bottom:1px solid var(--line)}
details.pt summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:14px 0}
details.pt summary::-webkit-details-marker{display:none}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.weak{background:var(--red)}.dot.mid{background:var(--warn)}.dot.good{background:var(--ok)}
.pt .body{padding:0 0 16px 24px}
.src{font-size:12px;color:var(--mute);margin-top:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 0}
.legend span{display:flex;gap:6px;align-items:center}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-bottom:10px;border-bottom:2px solid var(--fg)}
.top .x{all:unset;cursor:pointer;font:700 22px/1 var(--sans);padding:6px 10px 6px 0}
.top .ttl{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .c{font:800 15px/1 var(--sans);font-variant-numeric:tabular-nums}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:100%;background:var(--red)}
.meta{font:700 12px/1.4 var(--sans);color:var(--mute);margin:14px 0 6px}
.meta i{font-style:normal;color:var(--red)}
.case{background:var(--soft);padding:10px 12px;font-size:15px;margin:6px 0 10px}
.stem{font-weight:600;font-size:18px;margin:4px 0 12px}
.opts{display:grid;gap:8px}
.opt{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:8px;padding:13px 14px;min-height:48px;border:1.5px solid var(--line);align-items:center}
.opt b{font-family:var(--sans)}
.opt[aria-pressed="true"]{border-color:var(--fg);background:var(--soft)}
.opt.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.opt.wrong{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;padding:12px 14px;background:var(--soft);font-size:15px}
.fb .v{font:800 15px/1 var(--sans);margin-right:8px}.v.ok{color:var(--ok)}.v.no{color:var(--red)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px)}
.dock .in{max-width:680px;margin:0 auto}.dock .btn{margin:0}
.tools{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px}
.link{all:unset;cursor:pointer;font-size:14px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.opt:focus-visible,.row:focus-visible,.link:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>

<script>
const D={"parts":[{"k":"0","name":"总论","ch":["01-00","02-00","03-00"],"frame":"<p>内科每个病都走同一条链：<b>病因 → 病机（病位＋病性）→ 证 → 治法 → 方<\/b>。病机讲病位、病性、病势、虚实变化，<mark>不含病因<\/mark>；审察病机是辨证论治的关键环节，谨守病机是必须遵守的原则。走一遍感冒：风邪为主因 → 邪犯肺卫、卫表不和（病位肺卫，病性表实）→ 风寒束表 → 辛温解表 → 荆防达表汤。同病可异治（感冒分风寒、风热），异病可同治（水肿、腰痛、癃闭同见肾阳虚）——后面七个部分就是把「异病同治」摊开来看。<\/p><p><b>03-00 的主题，后面每部都在用<\/b><\/p><table><thead><tr><th>03-00 主题<\/th><th>原话<\/th><th>后面在哪用<\/th><\/tr><\/thead><tbody><tr><td>六淫·外风<\/td><td>风寒→荆防达表汤；风热→桑菊饮<\/td><td>七：感冒、咳嗽、头痛<\/td><\/tr><tr><td>内生五邪·内风<\/td><td>肝阳化风→天麻钩藤饮<\/td><td>四：中风、眩晕、头痛<\/td><\/tr><tr><td>痰（津液病）<\/td><td>痰可致神志病（癫狂痴痫）<\/td><td>二、四：哮、痫、癫狂、痴呆<\/td><\/tr><tr><td>各系病机·肺/脾胃<\/td><td>肺失宣发肃降；中焦运化、受纳、升降失常<\/td><td>一：咳喘哮；五：胃痛、胃痞、呕吐<\/td><\/tr><tr><td>各系病机·心/脑<\/td><td>心：血脉、神明；脑：髓海不足<\/td><td>三：心悸、胸痹、心衰；四：痴呆<\/td><\/tr><tr><td>气病·气逆<\/td><td>苏子降气汤/旋覆代赭汤/五磨饮子<\/td><td>一：喘证、胃痞、呕吐<\/td><\/tr><tr><td>卫气营血·卫分<\/td><td>辛凉解表：银翘散、桑菊饮<\/td><td>七：感冒风热、咳嗽风热、肺痈初期<\/td><\/tr><tr><td>六经·阳明腑证<\/td><td>泻热通腑：承气汤类<\/td><td>中风痰热腑实（桃仁承气汤）、胃痛食积化热<\/td><\/tr><tr><td>治则·明辨标本缓急<\/td><td>急则治标，缓则治本<\/td><td>二：哮、痫发作治标、平时治本；三：胸痹先标后本<\/td><\/tr><\/tbody><\/table><p><b>顺序<\/b>：01-00 导言 → 02-00 思路与原则 → 03-00 概要（读时对着上表找后面的病）。<\/p>"},{"k":"一","name":"气机逆乱与升降失常","ch":["04-02","04-04","04-03","07-03","07-01","07-02","06-06","04-01","05-03"],"frame":"<p>肺气、胃气都该往下走，走不下去或反冲上来就是病。肺失宣肃、肺气上逆 → 咳嗽；再加肾失摄纳 → 喘证；伏痰遇感、痰随气升 → 哮病；感冒是邪犯肺卫、卫表不和，肺的宣发先被堵。胃失和降、胃气上逆 → 呕吐；胃气郁滞、不通则痛 → 胃痛；中焦升降失常 → 胃痞。痫证是气机逆乱到了元神（元神失控）；心衰阳虚水泛是水饮上泛、凌心射肺，重则喘脱。所以治法总带一个「降/顺/通」：实证祛邪利气、和胃降逆，虚喘重在纳肾。<\/p><p><b>同一个证/方，不同的病<\/b><\/p><table><thead><tr><th>证/方<\/th><th>出现在哪些病<\/th><th>各自的辨点或主方<\/th><\/tr><\/thead><tbody><tr><td>饮食停滞<\/td><td>胃痛、胃痞、呕吐<\/td><td>都用保和丸：胃痛胀满拒按、嗳腐吞酸；胃痞进食尤甚；呕吐酸腐量多<\/td><\/tr><tr><td>肝气犯胃<\/td><td>胃痛、胃痞、呕吐<\/td><td>胃痛柴胡疏肝散；胃痞（肝胃不和）越鞠丸合枳术丸；呕吐半夏厚朴汤合左金丸<\/td><\/tr><tr><td>胃阴不足<\/td><td>胃痛、胃痞、呕吐<\/td><td>胃痛、胃痞都用益胃汤；呕吐（时作干呕）用麦门冬汤<\/td><\/tr><tr><td>痰热壅肺<\/td><td>咳嗽、喘证、哮病<\/td><td>咳嗽清金化痰汤；喘证桑白皮汤；热哮定喘汤<\/td><\/tr><tr><td>寒饮＋风寒<\/td><td>咳嗽、哮病<\/td><td>都可用小青龙汤：咳嗽素有寒饮伏肺兼表寒；寒哮射干麻黄汤或小青龙汤<\/td><\/tr><tr><td>肾不纳气<\/td><td>哮病、喘证<\/td><td>哮缓解期肾虚金匮肾气丸或七味都气丸；喘证肾虚不纳金匮肾气丸合人参蛤蚧散<\/td><\/tr><tr><td>喘脱<\/td><td>哮病、喘证、心衰<\/td><td>哮回阳救急汤合生脉饮；喘参附汤送服黑锡丹；心衰四逆加人参汤<\/td><\/tr><\/tbody><\/table><p><b>最容易混的 3 对<\/b><\/p><table><thead><tr><th>对<\/th><th>一个辨点<\/th><\/tr><\/thead><tbody><tr><td>哮病 vs 喘证<\/td><td>哮有<mark>喉中哮鸣有声<\/mark>；哮必兼喘，喘未必兼哮<\/td><\/tr><tr><td>胃痞 vs 胃痛<\/td><td>胃痞<mark>按之柔软，压之无痛<\/mark><\/td><\/tr><tr><td>心衰 vs 喘证<\/td><td>心衰在喘促之外兼<mark>心悸、浮肿、尿少<\/mark><\/td><\/tr><\/tbody><\/table><p><b>顺序<\/b>：感冒 → 咳嗽 → 哮病 → 喘证 → 心衰 → 胃痛 → 胃痞 → 呕吐 → 痫证。<\/p>"},{"k":"二","name":"痰浊伏邪与引触爆发","ch":["04-03","06-06","06-05","06-02","04-07"],"frame":"<p>痰平时伏着不动，一遇「扳机」就随气上冲，堵在哪里就在哪里发病。哮病：伏痰是夙根，气候变化引触，痰随气升、气因痰阻；痫证：惊则气乱，痰随气逆、蒙蔽清窍，病理因素尤以痰最重要；癫狂：痰气郁结蒙蔽脑窍成癫，痰火上扰成狂；眩晕：「无痰则不作眩」，痰浊上蒙清窍；肺胀：痰浊、水饮、血瘀互结于肺，常因外感诱发，重则痰蒙神窍。所以治法分两段：<b>发时治标（祛痰、开窍、息风），平时治本（健脾、补肾，断生痰之源）<\/b>。<\/p><p><b>同一个证/方，不同的病<\/b><\/p><table><thead><tr><th>证/方<\/th><th>出现在哪些病<\/th><th>各自的辨点或主方<\/th><\/tr><\/thead><tbody><tr><td>痰蒙/痰阻 → 涤痰汤<\/td><td>肺胀、痫证、癫证<\/td><td>肺胀痰蒙神窍涤痰汤；痫证肝火痰热龙胆泻肝汤合涤痰汤；癫证痰气郁结逍遥散合涤痰汤<\/td><\/tr><tr><td>脾虚生痰 → 六君子汤<\/td><td>哮病、痫证<\/td><td>哮缓解期脾虚（食少便溏）；痫证休止期脾虚痰盛（纳差便溏、脉濡滑）<\/td><\/tr><tr><td>外寒内饮<\/td><td>哮病、肺胀<\/td><td>寒哮射干麻黄汤或小青龙汤；肺胀外寒内饮小青龙汤（水鸡声、表寒不著→射干麻黄汤）<\/td><\/tr><tr><td>痰壅 → 三子养亲汤<\/td><td>哮病、肺胀<\/td><td>风痰哮三子养亲汤；肺胀痰浊壅肺三子养亲汤合苏子降气汤<\/td><\/tr><tr><td>肺肾两虚 → 平喘固本汤<\/td><td>哮病、肺胀<\/td><td>虚哮平喘固本汤；肺胀肺肾气虚平喘固本汤合补肺汤<\/td><\/tr><\/tbody><\/table><p><b>最容易混的 3 对<\/b><\/p><table><thead><tr><th>对<\/th><th>一个辨点<\/th><\/tr><\/thead><tbody><tr><td>哮病 vs 肺胀<\/td><td>哮发作外平时如常人；肺胀多老人，<mark>胸部膨满<\/mark>、面色晦暗（哮久可成肺胀）<\/td><\/tr><tr><td>痫证 vs 癫狂<\/td><td>痫是发作性仆倒抽搐，<mark>醒后一如常人<\/mark><\/td><\/tr><tr><td>癫 vs 狂<\/td><td>癫<mark>静而少动<\/mark>（痰气）；狂动而多怒（痰火）<\/td><\/tr><\/tbody><\/table><p><b>顺序<\/b>：哮病 → 肺胀 → 眩晕 → 痫证 → 癫狂。<\/p>"},{"k":"三","name":"本虚标实与虚实夹杂","ch":["05-03","05-02","05-01","04-07","06-02","06-04","06-03","07-04","04-08","04-06","04-04"],"frame":"<p>这一组病都是「底子亏、上面堵」：本虚是气、阴、阳、精、血不足，标实是痰、瘀、水、火、风。胸痹本虚为气虚、气阴两虚、阳气虚衰，标实为血瘀寒凝痰浊气滞；心衰虚瘀痰水四字，血瘀贯穿始终；肺胀久病正虚，痰浊水饮血瘀互结；眩晕、痴呆、中风都是本虚（肝肾、气血、髓海）加风火痰瘀；噎膈初期痰气交阻多实，晚期阴津枯槁；喘证虚实错杂成上盛下虚；肺痨、肺痿以虚为主。病程常是<b>先实后虚、由气及阴及阳<\/b>。治则都是补虚泻实，先看缓急：急时治标（胸痹先治标后治本，心衰首辨轻重缓急）。<\/p><p><b>同一个证/方，不同的病<\/b><\/p><table><thead><tr><th>证/方<\/th><th>出现在哪些病<\/th><th>各自的辨点或主方<\/th><\/tr><\/thead><tbody><tr><td>气阴两虚 → 生脉散<\/td><td>胸痹、心衰、喘证<\/td><td>胸痹生脉散合人参养荣汤；心衰生脉散；喘证肺气虚耗生脉散合补肺汤<\/td><\/tr><tr><td>血瘀 → 血府逐瘀汤<\/td><td>胸痹、心衰<\/td><td>胸痹心血瘀阻（如刺如绞、痛有定处）；心衰气虚血瘀保元汤合血府逐瘀汤<\/td><\/tr><tr><td>瘀阻脑 → 通窍活血汤<\/td><td>眩晕、痴呆<\/td><td>眩晕瘀血阻窍（头痛有定处）；痴呆瘀阻脑络（伴半身不遂）<\/td><\/tr><tr><td>气血不足 → 归脾汤<\/td><td>心悸、眩晕、痴呆<\/td><td>心悸心血不足；眩晕气血亏虚（劳累即发）；痴呆气血不足（面唇无华）<\/td><\/tr><tr><td>阳虚水泛 → 真武汤<\/td><td>心衰、肺胀、心悸<\/td><td>心衰真武汤合葶苈大枣泻肺汤；肺胀真武汤合五苓散；心悸水饮凌心因心衰致肿→真武汤<\/td><\/tr><tr><td>阴虚 → 天王补心丹<\/td><td>心悸、胸痹<\/td><td>心悸阴虚火旺天王补心丹合朱砂安神丸；胸痹心肾阴虚天王补心丹合炙甘草汤<\/td><\/tr><\/tbody><\/table><p><b>最容易混的 3 对<\/b><\/p><table><thead><tr><th>对<\/th><th>一个辨点<\/th><\/tr><\/thead><tbody><tr><td>心悸 vs 胸痹<\/td><td>主诉是<mark>心中跳动不安<\/mark>就定心悸，兼心痛如刺也一样<\/td><\/tr><tr><td>心衰 气虚血瘀 vs 阳虚水泛<\/td><td>阳虚水泛有<mark>畏寒肢冷＋面浮肢肿尿少<\/mark><\/td><\/tr><tr><td>肺痿 vs 肺痨<\/td><td>肺痿以<mark>咳吐浊唾涎沫<\/mark>为主；肺痨咳嗽咯血潮热盗汗、有传染性<\/td><\/tr><\/tbody><\/table><p><b>顺序<\/b>：喘证 → 肺胀 → 肺痨 → 肺痿 → 心悸 → 胸痹 → 心衰 → 眩晕 → 中风 → 痴呆 → 噎膈。<\/p>"},{"k":"四","name":"实邪阻窍与神机失用","ch":["06-03","06-04","06-05","06-06","06-01","06-02","05-04"],"frame":"<p>脑和心神是「司令部」，风、火、痰、瘀从下往上扰乱或蒙住它，神机就失用。中风：气血逆乱，上犯于脑；眩晕：风火痰瘀扰乱清窍；头痛：外邪上扰清空，或痰浊上蒙；痫证：气机逆乱，元神失控；痴呆：髓减脑消，神机失用（标实是痰瘀火）；癫狂：气滞痰结火郁血瘀蒙蔽心窍；不寐：阳盛阴衰、阴阳失交，实证是肝火、痰热扰心。记住四个邪各有一张「招牌方」，换个病照样用：肝阳天麻钩藤饮、痰浊半夏白术天麻汤、瘀血通窍活血汤、肝火龙胆泻肝汤。<\/p><p><b>同一个证/方，不同的病<\/b><\/p><table><thead><tr><th>证/方<\/th><th>出现在哪些病<\/th><th>各自的辨点或主方<\/th><\/tr><\/thead><tbody><tr><td>肝阳/风阳 → 天麻钩藤饮<\/td><td>中风、眩晕、头痛、痴呆<\/td><td>中风风阳上扰（急躁易怒）；眩晕肝阳上亢（遇烦劳郁怒加重）；头痛肝阳（两侧胀痛而眩）；痴呆心肝火旺<\/td><\/tr><tr><td>瘀阻脑络 → 通窍活血汤<\/td><td>头痛、眩晕、痴呆、痫证<\/td><td>共同点痛有定处或舌紫瘀斑；痫证见单侧肢体抽搐，痴呆伴半身不遂<\/td><\/tr><tr><td>痰浊上蒙 → 半夏白术天麻汤<\/td><td>头痛、眩晕、中风<\/td><td>头痛昏蒙沉重；眩晕头重如蒙；中风风痰入络合桃仁红花煎<\/td><\/tr><tr><td>痰蒙 → 涤痰汤<\/td><td>中风、痫证、癫证<\/td><td>中风阴闭另用苏合香丸；痫证肝火痰热合龙胆泻肝汤；癫证痰气郁结合逍遥散<\/td><\/tr><tr><td>肝火 → 龙胆泻肝汤<\/td><td>不寐、痫证<\/td><td>不寐肝火扰心；痫证休止期肝火痰热（合涤痰汤）<\/td><\/tr><tr><td>肾精亏 → 大补元煎<\/td><td>头痛、痫证<\/td><td>头痛肾虚（头痛且空）；痫证肝肾阴虚（日久频发、两目干涩）<\/td><\/tr><\/tbody><\/table><p><b>最容易混的 3 对<\/b><\/p><table><thead><tr><th>对<\/th><th>一个辨点<\/th><\/tr><\/thead><tbody><tr><td>中风 vs 痫证<\/td><td>痫证<mark>醒后一如常人<\/mark>；中风醒后半身不遂、口舌歪斜<\/td><\/tr><tr><td>眩晕 vs 中风<\/td><td>中风有<mark>半身不遂、口舌歪斜<\/mark>；眩晕可为中风先兆<\/td><\/tr><tr><td>痴呆 vs 癫狂<\/td><td>痴呆<mark>早期即善忘、智能缺失<\/mark>；癫狂早期以情志失常为主<\/td><\/tr><\/tbody><\/table><p><b>顺序<\/b>：头痛 → 眩晕 → 中风 → 痫证 → 癫狂 → 痴呆 → 不寐。<\/p>"},{"k":"五","name":"中焦与食道阻滞","ch":["07-01","07-02","07-04","07-03","05-02"],"frame":"<p>胃以通降为顺，从食道到胃脘这条管子一堵就出病：不通则痛 → 胃痛；中焦气机阻滞、升降失常 → 胃痞；胃失和降、胃气上逆 → 呕吐；气、痰、瘀交结阻隔于食道贲门 → 噎膈。堵的东西大同小异：先是气滞，再有食积、痰湿、湿热，久病入血成瘀，最后伤到胃阴或脾阳。胸痹放在这里，因为心脉痹阻也是「堵」，而且常和胃脘痛混。治法核心是广义的「通」：理气、消食、化痰、化瘀都是通；虚了要养胃阴、温脾阳，噎膈全程顾护津液和胃气。<\/p><p><b>同一个证/方，不同的病<\/b><\/p><table><thead><tr><th>证/方<\/th><th>出现在哪些病<\/th><th>各自的辨点或主方<\/th><\/tr><\/thead><tbody><tr><td>肝气犯胃 → 柴胡疏肝散<\/td><td>胃痛、胸痹、胃痞、呕吐<\/td><td>胃痛胀痛连胁；胸痹气滞心胸（痛无定处）；胃痞肝胃不和越鞠丸合枳术丸；呕吐半夏厚朴汤合左金丸<\/td><\/tr><tr><td>饮食停滞 → 保和丸<\/td><td>胃痛、胃痞、呕吐<\/td><td>胃痛胀满拒按、嗳腐吞酸；胃痞进食尤甚；呕吐酸腐量多<\/td><\/tr><tr><td>血瘀<\/td><td>胃痛、噎膈、胸痹<\/td><td>胃痛失笑散合丹参饮（刺痛定处）；噎膈通幽汤（呕出物如赤豆汁）；胸痹血府逐瘀汤（如刺如绞）<\/td><\/tr><tr><td>痰热 → 黄连温胆汤<\/td><td>胃痞、呕吐、胸痹<\/td><td>胃痞痰湿郁久化热；呕吐痰饮化热（口苦苔黄腻）；胸痹痰浊化热<\/td><\/tr><tr><td>胃阴不足<\/td><td>胃痛、胃痞、呕吐、噎膈<\/td><td>胃痛、胃痞益胃汤；呕吐麦门冬汤；噎膈津亏热结沙参麦冬汤<\/td><\/tr><tr><td>中焦虚寒<\/td><td>胃痛、呕吐、胃痞、噎膈<\/td><td>胃痛黄芪建中汤；呕吐理中汤；胃痞脾胃虚弱补中益气汤；噎膈气虚阳微补气运脾汤<\/td><\/tr><\/tbody><\/table><p><b>最容易混的 3 对<\/b><\/p><table><thead><tr><th>对<\/th><th>一个辨点<\/th><\/tr><\/thead><tbody><tr><td>胃痞 vs 胃痛<\/td><td>胃痞<mark>按之柔软，压之无痛<\/mark><\/td><\/tr><tr><td>噎膈 vs 反胃<\/td><td>反胃<mark>无吞咽障碍<\/mark>，朝食暮吐；噎膈吞咽受阻、进行性加剧<\/td><\/tr><tr><td>胸痹 vs 胃脘痛<\/td><td>胸痹痛<mark>放射左肩背，休息或服药缓解<\/mark>；胃脘痛伴泛酸、嘈杂、嗳气<\/td><\/tr><\/tbody><\/table><p><b>顺序<\/b>：胃痛 → 胃痞 → 呕吐 → 噎膈 → 胸痹。<\/p>"},{"k":"六","name":"津气耗伤与不荣","ch":["04-08","04-06","07-04","04-05","05-04","04-02","05-01"],"frame":"<p>这一组是「不荣」：津液、阴血、正气被耗掉，脏腑失去濡养。肺痿贯穿始终的是肺津不足，肺叶枯萎；肺痨痨虫蚀肺、肺阴耗损，以阴虚为主，可到气阴两虚、阴阳两虚；咳嗽内伤到肺阴亏虚；肺痈恢复期阴伤气耗；噎膈晚期阴津枯槁；心悸是气血阴阳亏虚、心失所养；不寐虚证是心脾两虚、心肾不交。治法就是补回去：滋阴、生津、益气养阴、养血安神；用药忌燥热和大量苦寒（肺痨火旺本质是阴虚，肺痿忌燥热苦寒，噎膈全程顾护津液）。<\/p><p><b>同一个证/方，不同的病<\/b><\/p><table><thead><tr><th>证/方<\/th><th>出现在哪些病<\/th><th>各自的辨点或主方<\/th><\/tr><\/thead><tbody><tr><td>肺阴亏（干咳、咳声短促）<\/td><td>肺痨、咳嗽<\/td><td>肺痨肺阴亏损月华丸（痰中带血）；咳嗽肺阴亏虚沙参麦冬汤<\/td><\/tr><tr><td>沙参麦冬汤<\/td><td>咳嗽、噎膈<\/td><td>咳嗽肺阴亏虚（潮热盗汗）；噎膈津亏热结（吞咽梗涩而痛、便如羊粪）<\/td><\/tr><tr><td>清燥救肺汤<\/td><td>肺痿、咳嗽<\/td><td>肺痿虚热麦门冬汤合清燥救肺汤；咳嗽温燥重证（气逆而喘）<\/td><\/tr><tr><td>气阴两伤<\/td><td>肺痈、肺痨<\/td><td>肺痈恢复期沙参清肺汤合竹叶石膏汤；肺痨气阴耗伤保真汤<\/td><\/tr><tr><td>阴虚火旺 → 天王补心丹<\/td><td>心悸、不寐<\/td><td>心悸阴虚火旺合朱砂安神丸；不寐心阴不足为主用天王补心丹<\/td><\/tr><tr><td>心脾两虚 → 归脾汤<\/td><td>心悸、不寐<\/td><td>心悸心血不足（面色无华、头晕目眩）；不寐心脾两虚（神疲食少、便溏）<\/td><\/tr><\/tbody><\/table><p><b>最容易混的 3 对<\/b><\/p><table><thead><tr><th>对<\/th><th>一个辨点<\/th><\/tr><\/thead><tbody><tr><td>肺痿 vs 肺痨<\/td><td>肺痿以<mark>咳吐浊唾涎沫<\/mark>为主；肺痨晚期见咳吐涎沫即属肺痿<\/td><\/tr><tr><td>肺痨肺阴亏损 vs 咳嗽肺阴亏虚<\/td><td>有无<mark>痰中带血<\/mark>：无则多诊咳嗽<\/td><\/tr><tr><td>肺痿 虚热 vs 虚寒<\/td><td>虚热<mark>口渴、舌红<\/mark>；虚寒不渴、舌淡<\/td><\/tr><\/tbody><\/table><p><b>顺序<\/b>：咳嗽 → 肺痈 → 肺痨 → 肺痿 → 心悸 → 不寐 → 噎膈。<\/p>"},{"k":"七","name":"外邪侵袭与表里宣阻","ch":["04-01","04-02","06-01","04-05","07-03"],"frame":"<p>外邪以风为先导，从口鼻、皮毛进来，先碰到的是肺卫和体表，去哪里就在哪里「宣不开」。犯卫表 → 感冒（邪犯肺卫，卫表不和）；犯肺 → 外感咳嗽（肺失宣肃）；上扰清空 → 外感头痛（以风为主）；犯胃 → 外邪犯胃的呕吐（突然呕吐伴恶寒发热）；风热壅肺不散，热壅血瘀 → 肺痈。所以第一步永远是同一组：辨风寒、风热、夹湿/暑/燥；治法都先祛邪解表，把邪往外送，外感咳嗽<mark>忌敛肺收涩<\/mark>以防留邪。<\/p><p><b>同一个证/方，不同的病<\/b><\/p><table><thead><tr><th>证/方<\/th><th>出现在哪些病<\/th><th>各自的辨点或主方<\/th><\/tr><\/thead><tbody><tr><td>风寒<\/td><td>感冒、咳嗽、头痛<\/td><td>感冒荆防达表汤/荆防败毒散；咳嗽三拗汤合止嗽散；头痛川芎茶调散<\/td><\/tr><tr><td>风热<\/td><td>感冒、咳嗽、头痛、肺痈<\/td><td>感冒银翘散；咳嗽桑菊饮（不是银翘散）；头痛芎芷石膏汤；肺痈初期银翘散<\/td><\/tr><tr><td>湿/暑湿<\/td><td>感冒、头痛、呕吐<\/td><td>感冒暑湿伤表新加香薷饮；头痛风湿羌活胜湿汤；呕吐外邪犯胃藿香正气散<\/td><\/tr><\/tbody><\/table><p><b>最容易混的 3 对<\/b><\/p><table><thead><tr><th>对<\/th><th>一个辨点<\/th><\/tr><\/thead><tbody><tr><td>肺痈初期 vs 风热咳嗽/感冒<\/td><td>肺痈初期多<mark>胸痛＋痰量渐多<\/mark><\/td><\/tr><tr><td>头痛 风寒 vs 风湿<\/td><td>风寒<mark>喜裹<\/mark>（怕风想包头）；风湿头痛如裹、肢体困重<\/td><\/tr><tr><td>感冒 风寒 vs 风热<\/td><td>看涕和咽：<mark>清涕咽痒<\/mark>为寒，黄涕咽痛为热<\/td><\/tr><\/tbody><\/table><p><b>顺序<\/b>：感冒 → 咳嗽 → 头痛 → 呕吐 → 肺痈。<\/p>"}],"ch":{"01-00":{"name":"导言","lecture":"1 总论.pdf","points":[{"id":"p1","name":"定义·古称·分类","teach":"<p><b>定义<\/b>：运用中医理论和临证思维，阐述内科疾病病因病机、辨证论治及预防调护规律的临床学科。理论体系含<b>病因学、病机学、分类学、治疗学<\/b>（选“以上皆是”）。<\/p><p><b>古称<\/b>：<mark>疾医、杂医、大方脉<\/mark>。疡医是外科，不是内科。<\/p><ul><li>《周礼·天官》宫廷医生四种：<b>疾医、食医、疡医、兽医<\/b>；疾医＝最早的内科医师。没有“疫医”。<\/li><li>宋金元明设<b>大方脉科<\/b>＝治<b>成人<\/b>内科病。<\/li><\/ul><p><b>分类<\/b>：以病因为纲分<b>外感、内伤<\/b>两大类。内伤病因：情志刺激、饮食劳倦、起居失常、脏腑功能失调（全选）。<\/p>","src":"讲义 1 总论 第一章第一节; 题库 #1 #2 #7 #18 #40 解析"},{"id":"p2","name":"学术发展四时期","teach":"<table><thead><tr><th>时期<\/th><th>年代<\/th><\/tr><\/thead><tbody><tr><td>奠基时期<\/td><td>战国至秦汉<\/td><\/tr><tr><td>继承发展时期<\/td><td>两晋至唐宋及金元<\/td><\/tr><tr><td>系统完善时期<\/td><td>明清<\/td><\/tr><tr><td>传承创新时期<\/td><td>中华人民共和国成立以后<\/td><\/tr><\/tbody><\/table><p>“初步发展时期”是干扰项，四时期里没有它。殷周只是萌芽。<\/p>","src":"讲义 1 总论 第二节 学术发展源流; 题库 #26-29 解析。讲义写奠基=春秋战国至秦汉、继承发展=隋唐至宋金元，题库写战国至秦汉、两晋至唐宋及金元，按题库(十四五)"},{"id":"p3","name":"内经·伤寒·金匮","teach":"<p><b>《黄帝内经》<\/b>：现存<b>最早的医学总集<\/b>，总结秦汉以前成就；记 200 多种内科病证，专篇有热论、咳论、痿论、疟论、痹论（<mark>没有痰论<\/mark>）；提出病机十九条，强调<b>“谨守病机，各司其属”<\/b>。<\/p><p><b>《伤寒论》<\/b>：<mark>以六经论伤寒<\/mark>，讲各经证治、六经传变、合病并病、变证坏证。<\/p><p><b>《金匮要略》<\/b>：<mark>以脏腑论杂病<\/mark>，以病证为专题专篇：肺痈、肺痿、痰饮、黄疸、下利、水肿等。<\/p><p>记法：“以脏腑论杂病”“以病证为专篇”属金匮，不属伤寒。<\/p>","src":"题库 #3 #22 #23 #41 #42 解析"},{"id":"p4","name":"病源·外台·三因","teach":"<ul><li><b>《诸病源候论》<\/b>：现存最早的<b>病因病理及证候学<\/b>专著。<\/li><li><b>王焘《外台秘要》<\/b>：最早记消渴“<mark>每发即小便至甜<\/mark>”；黄疸疗效观察“每夜小便中浸白帛片，取色退为验”。<\/li><li><b>张锐《鸡峰普济方》<\/b>：水肿分多型，按起始部位辨性质。<\/li><li><b>董汲《脚气治法总要》<\/b>：脚气病专书，订 64 方。<\/li><li><b>陈无择《三因极一病证方论》<\/b>：创<b>外因、内因、不内外因<\/b>三因学说。<\/li><\/ul>","src":"题库 #4 #5 #6 #30 #31 #32 解析"},{"id":"p5","name":"金元四大家","teach":"<p>四大家：<b>刘完素、张子和、李东垣、朱丹溪<\/b>。<mark>张元素不在内<\/mark>。<\/p><ul><li><b>刘完素<\/b>：研究五运六气，撰《素问玄机原病式》。<\/li><li><b>朱丹溪<\/b>：创越鞠丸、二妙丸、保和丸、虎潜丸、大补阴丸（五个全是）。<\/li><li><b>虞抟《医学正传》<\/b>：发展了朱丹溪学说。<\/li><\/ul><p>刘完素、张子和喜用寒凉攻伐，后来张景岳为纠其偏而主温补（见名医名著点）。<\/p>","src":"题库 #8 #33 #43 #44 #11 解析"},{"id":"p6","name":"名医名著配对","teach":"<table><thead><tr><th>医家<\/th><th>著作 / 要点<\/th><\/tr><\/thead><tbody><tr><td>葛可久<\/td><td>《十药神书》，<b>肺痨<\/b>专著<\/td><\/tr><tr><td>薛己<\/td><td>《内科摘要》，最早用“<mark>内科<\/mark>”命名<\/td><\/tr><tr><td>张景岳<\/td><td>“阳非有余，阴常不足”，力主<b>温补<\/b><\/td><\/tr><tr><td>喻嘉言<\/td><td>《医门法律》《寓意草》；秋燥论、大气论，创清燥救肺汤；“<b>先议病，后用药<\/b>”<\/td><\/tr><tr><td>林珮琴<\/td><td>《类证治裁》，先识证、辨证<\/td><\/tr><tr><td>程钟龄<\/td><td>《医学心悟》，八纲、八法<\/td><\/tr><tr><td>龚廷贤<\/td><td>《寿世保元》<\/td><\/tr><tr><td>王清任<\/td><td>《医林改错》，血府逐瘀汤、补阳还五汤<\/td><\/tr><\/tbody><\/table><p>《证治汇补》：杂病分<b>八门<\/b>（提纲、内因、外体、上窍、胸膈、腹胁、腰膝、下窍）。《医学实在易》：按<b>表里、寒热、虚实<\/b>分类（无阴阳、无营卫）。<\/p>","src":"题库 #9 #10 #11 #13 #14 #15 #16 #21 #34 #47 #49 解析"},{"id":"p7","name":"温病五大家","teach":"<table><thead><tr><th>医家<\/th><th>代表作<\/th><\/tr><\/thead><tbody><tr><td>吴又可<\/td><td>《温疫论》，<mark>最早的传染病学专著<\/mark><\/td><\/tr><tr><td>叶天士<\/td><td>《温热论》<\/td><\/tr><tr><td>吴鞠通<\/td><td>《温病条辨》<\/td><\/tr><tr><td>薛生白<\/td><td>《湿热病篇》<\/td><\/tr><tr><td>王孟英<\/td><td>《温热经纬》<\/td><\/tr><\/tbody><\/table><p>吴又可：温疫不因“六气”，发病主因是<b>感染戾气＋机体机能状况不良<\/b>。<\/p><p>温热类温病：风温、春温、秋燥、暑温、冬温、温毒、温疫。<mark>伏暑属湿热类<\/mark>。<\/p>","src":"题库 #12 #19 #35-39 #45 #46 解析"},{"id":"p8","name":"近现代与新思路","teach":"<p><b>张锡纯《医学衷中参西录》<\/b>：以中医为主体，取西医之长补中医之短；创<b>镇肝息风汤、升陷汤、玉液汤、膏淋汤<\/b>。<mark>天麻钩藤饮不是他的<\/mark>。<\/p><ul><li><b>王琦<\/b>：辨<b>体质<\/b>、辨证、辨病相结合。<\/li><li><b>仝小林<\/b>：“宏观辨证”调状态＋“微观打靶”解决理化指标＝<mark>态靶辨治<\/mark>。<\/li><\/ul>","src":"题库 #17 #24 #25 #48 解析"},{"id":"p9","name":"病证命名","teach":"<p>命名依据：病因、病机（病性、病理因素、病位）、主症、体征（选“以上皆是”）。<\/p><table><thead><tr><th>依据<\/th><th>例<\/th><\/tr><\/thead><tbody><tr><td>病因<\/td><td><mark>中风、中暑、虫证<\/mark><\/td><\/tr><tr><td>病机<\/td><td>郁证、痹证、厥证<\/td><\/tr><tr><td>病理产物<\/td><td>痰饮<\/td><\/tr><tr><td>病位<\/td><td>胸痹、肝着、肾着、肺痿<\/td><\/tr><tr><td>主症<\/td><td>咳嗽、喘证、呕吐、泄泻、眩晕<\/td><\/tr><tr><td>主要体征<\/td><td>黄疸、积聚、水肿、鼓胀<\/td><\/tr><\/tbody><\/table><p>易错：中风是“病因”命名；厥证、郁证是“病机”命名。<\/p>","src":"讲义 1 总论 中医内科病证的命名; 题库 #20 #50 解析"}],"q":[{"n":1,"t":"A1型","q":"下列属于中医内科学理论体系探讨内容的是","pre":"","o":[["A","病因学"],["B","病机学"],["C","分类学"],["D","治疗学"],["E","以上皆是"]],"a":"E","x":"中医内科学完整的理论体系包括病因学、病机学、分类学、治疗学等内容。故选E。","p":"p1"},{"n":2,"t":"A1型","q":"下列不属于《周礼·天官》中记载的宫廷医生分类的是","pre":"","o":[["A","疾医"],["B","食医"],["C","疫医"],["D","疡医"],["E","兽医"]],"a":"C","x":"《周礼·天官》记载了当时的宫廷医生已分有疾医、食医、疡医、兽医四种，其中疾医相当于最早的内科医师。故选C。","p":"p1"},{"n":3,"t":"A1型","q":"我国现存最早的，全面总结了秦汉以前医学成就的医学总集是","pre":"","o":[["A","《神农本草经》"],["B","《黄帝内经》"],["C","《伤寒杂病论》"],["D","《医宗金鉴》"],["E","《医学大成》"]],"a":"B","x":"《黄帝内经》全面总结了秦汉及以前的医学成就，是我国现存最早的一部医学总集。故选B。","p":"p3"},{"n":4,"t":"A1型","q":"最早记载消渴病“每发即小便至甜”证候特征的著作是","pre":"","o":[["A","《备急千金要方》"],["B","《诸病源候论》"],["C","《外台秘要》"],["D","《素问玄机原病式》"],["E","《三因极一病证方论》"]],"a":"C","x":"《外台秘要·消中消渴肾消》中记载“每发即小便至甜”的证候特征。故选C。","p":"p4"},{"n":5,"t":"A1型","q":"提出通过“每夜小便中浸白帛片，取色退为验”观察黄疸病的治疗效果的医家是","pre":"","o":[["A","张仲景"],["B","孙思邈"],["C","刘完素"],["D","朱丹溪"],["E","王焘"]],"a":"E","x":"王焘《外台秘要·消中消渴肾消》中对黄疸病及治疗效果的观察提出“每夜小便中浸白帛片，取色退为验”。故选E。","p":"p4"},{"n":6,"t":"A1型","q":"我国现存最早的病因病理及证候学专著是","pre":"","o":[["A","《黄帝内经》"],["B","《难经》"],["C","《医学源流论》"],["D","《证治准绳》"],["E","《诸病源候论》"]],"a":"E","x":"《诸病源候论》是我国现存最早的病因病理学及证候学专著。故选E。","p":"p4"},{"n":7,"t":"A1型","q":"宋、金、元、明代官方所设“大方脉科”，其主要职能是诊治","pre":"","o":[["A","小儿内科疾病"],["B","小儿外感疾病"],["C","成人外科疾病"],["D","成人内科疾病"],["E","女子妇科疾病"]],"a":"D","x":"从宋代起，金、元、明代均设有大方脉科，这是治疗成人各种内科疾病的专科。故选D。","p":"p1"},{"n":8,"t":"A1型","q":"撰写《素问玄机原病式》的医家是","pre":"","o":[["A","刘完素"],["B","张子和"],["C","李东垣"],["D","朱丹溪"],["E","陈无择"]],"a":"A","x":"刘完素对五运六气学说有深入研究，撰《素问玄机原病式》。故选A。","p":"p5"},{"n":9,"t":"A1型","q":"葛可久《十药神书》是论述何种疾病的专著","pre":"","o":[["A","哮喘"],["B","肺痨"],["C","胸痹"],["D","水肿"],["E","消渴"]],"a":"B","x":"葛可久著《十药神书》，是一部治疗肺痨病的专著。故选B。","p":"p6"},{"n":10,"t":"A1型","q":"我国最早用“内科”命名的医书《内科摘要》的作者是","pre":"","o":[["A","李杲"],["B","薛己"],["C","王纶"],["D","虞抟"],["E","喻昌"]],"a":"B","x":"薛己的《内科摘要》是我国最早用“内科”命名的医书。故选B。","p":"p6"},{"n":11,"t":"A1型","q":"为纠正金元刘完素、张子和喜用寒凉攻伐之偏，倡导人之生气以阳为主，指出人体“阳非有余，阴常不足”，力主温补之法的医家是","pre":"","o":[["A","喻嘉言"],["B","叶天士"],["C","罗天益"],["D","张景岳"],["E","郑钦安"]],"a":"D","x":"张景岳《景岳全书》为纠正金元刘完素、张子和喜用寒凉攻伐之偏，倡导人之生气以阳为主，指出人体“阳非有余，阴常不足”，力主温补之法。故选D。","p":"p6"},{"n":12,"t":"A1型","q":"我国最早的传染病学专著是","pre":"","o":[["A","《温热论》"],["B","《温病条辨》"],["C","《湿热病篇》"],["D","《温热经纬》"],["E","《温疫论》"]],"a":"E","x":"吴又可的《温疫论》是我国最早的传染病学专著。故选E。","p":"p7"},{"n":13,"t":"A1型","q":"提出秋燥论、大气论，并创清燥救肺汤的医家是","pre":"","o":[["A","喻嘉言"],["B","林珮琴"],["C","尤在泾"],["D","汪绮石"],["E","胡柔慎"]],"a":"A","x":"喻嘉言著有《医门法律》《寓意草》，提出秋燥论、大气论，创清燥救肺汤。故选A。","p":"p6"},{"n":14,"t":"A1型","q":"提出“先议病，后用药”治病范式的医家是","pre":"","o":[["A","胡慎柔"],["B","尤在泾"],["C","喻嘉言"],["D","林珮琴"],["E","熊笏"]],"a":"C","x":"喻嘉言著有《医门法律》《寓意草》，提出秋燥论、大气论，创清燥救肺汤，提出“先议病，后用药”治病范式，为规范中医内科学临床治病过程提供了新思路。故选C。","p":"p6"},{"n":15,"t":"A1型","q":"《类证治裁》强调要先识证和辨证，对临床极具指导作用，其作者是","pre":"","o":[["A","陈修园"],["B","张锡纯"],["C","黄元御"],["D","林珮琴"],["E","程钟龄"]],"a":"D","x":"林珮琴《类证治裁》强调，治病要先识证和辨证，对临床极具指导作用。故选D。","p":"p6"},{"n":16,"t":"A1型","q":"程钟龄总结前人经验，提出著名的八纲、八法，因证立方，影响广泛，其代表著作是","pre":"","o":[["A","《先醒斋医学广笔记》"],["B","《证治准绳》"],["C","《医学源流论》"],["D","《医宗必读》"],["E","《医学心悟》"]],"a":"E","x":"程钟龄《医学心悟》创新性地总结前人经验，提出著名的八纲、八法，因证立方，条分缕析，多为临床心得之语，影响广泛。故选E。","p":"p6"},{"n":17,"t":"A1型","q":"张锡纯主张以中医为主体，取西医之长，补中医之短，创建镇肝息风汤、升陷汤、玉液汤、膏淋汤等方剂，其代表著作是","pre":"","o":[["A","《医学衷中参西录》"],["B","《血证论》"],["C","《古今医案按》"],["D","《读医随笔》"],["E","《辨证录》"]],"a":"A","x":"张锡纯《医学衷中参西录》主张以中医为主体，取西医之长，补中医之短，创建镇肝息风汤、升陷汤、玉液汤、膏淋汤等方剂。故选A。","p":"p8"},{"n":18,"t":"A1型","q":"以病因为纲，可将疾病分为外感与内伤两大类，下列属于内伤疾病病因的是","pre":"","o":[["A","情志刺激"],["B","饮食劳倦"],["C","起居失常"],["D","脏腑功能失调"],["E","以上皆是"]],"a":"E","x":"内伤疾病是由情志刺激、饮食劳倦、起居失常以及脏腑功能失调所引发。故选E。","p":"p1"},{"n":19,"t":"A1型","q":"下列不属于温热类温病的是","pre":"","o":[["A","春温"],["B","秋燥"],["C","温毒"],["D","伏暑"],["E","风温"]],"a":"D","x":"温热类温病包括了风温、春温、秋燥、暑温、冬温、温毒、温疫等。伏暑属湿热病。故选D。","p":"p7"},{"n":20,"t":"A1型","q":"下列属于中医内科疾病命名依据的是","pre":"","o":[["A","病因"],["B","病机"],["C","主症"],["D","体征"],["E","以上皆是"]],"a":"E","x":"中医内科病证的命名原则主要是以病因、病机（包括病性、病理因素、病位等）、主症、体征为依据。故选E。","p":"p9"},{"n":21,"t":"A1型","q":"将内科杂病分为提纲门、内因门、外体门、上窍门、胸膈门、腹胁门、腰膝门、下窍门这八门的著作是","pre":"","o":[["A","《症因脉治》"],["B","《医学入门》"],["C","《证治汇补》"],["D","《医学实在易》"],["E","《医门法律》"]],"a":"C","x":"《证治汇补》将内科杂病分为八门，即提纲门、内因门、外体门、上窍门、胸膈门、腹胁门、腰膝门、下窍门。故选C。","p":"p6"},{"n":22,"t":"A1型","q":"《黄帝内经》记述了二百多种内科病证，从病因、病理、病性转化及预后等方面做了简要的论述，下列病证没有在该书设有专篇加以讨论的是","pre":"","o":[["A","热论"],["B","咳论"],["C","痰论"],["D","痿论"],["E","疟论"]],"a":"C","x":"《黄帝内经》记叙了二百多种内科病证，从病因、病理、病性转化及预后等方面做了简要的论述，有些病证还专篇加以讨论，如“热论”“咳论”“痿论”“疟论”“痹论”等，为后世中医内科疾病的分类、命名与诊治奠定了理论基础。故选C。","p":"p3"},{"n":23,"t":"A1型","q":"首次提出中医辨治病证应当“谨守病机，各司其属”的著作是","pre":"","o":[["A","《黄帝内经》"],["B","《难经》"],["C","《金匮要略》"],["D","《伤寒论》"],["E","《诸病源候论》"]],"a":"A","x":"《黄帝内经》从正邪两方面探讨疾病发生发展的本质，详细介绍了六淫、七情、饮食、劳伤等病因以及脏腑、气血、经络的病理变化规律，提出“病机十九条”，强调“谨守病机，各司其属”，为后世医家创新病机理论奠定了基础。故选A。","p":"p3"},{"n":24,"t":"A1型","q":"下列属于王琦院士提出的辨证方法是","pre":"","o":[["A","微观辨证"],["B","辨证微观化"],["C","辨体质、辨证、辨病相结合的辨证思路"],["D","态靶辨治"],["E","证素辨证"]],"a":"C","x":"王琦院士提出辨体质、辨证、辨病相结合的辨证思路等。故选C。","p":"p8"},{"n":25,"t":"A1型","q":"提出通过“宏观辨证”以调理疾病状态、“微观打靶”以解决理化指标，二者有机结合，称为“态靶辨治”思路的医家是","pre":"","o":[["A","岳美中"],["B","蒲辅周"],["C","仝小林"],["D","邹云翔"],["E","王琦"]],"a":"C","x":"仝小林院士提出通过“宏观辨证”以调理疾病状态、“微观打靶”以解决理化指标，二者有机结合，称为“态靶辨治”思路。故选C。","p":"p8"},{"n":26,"t":"B型","q":"自战国至秦汉为中医学理论体系的","pre":"","o":[["A","奠基时期"],["B","初步发展时期"],["C","继承发展时期"],["D","系统完善时期"],["E","传承创新时期"]],"a":"A","x":"自战国至秦汉这一时期为中医学理论体系的奠基时期。故选A。","p":"p2"},{"n":27,"t":"B型","q":"两晋至唐宋为中医学理论体系的","pre":"","o":[["A","奠基时期"],["B","初步发展时期"],["C","继承发展时期"],["D","系统完善时期"],["E","传承创新时期"]],"a":"C","x":"自两晋至唐宋及金元时期，由于中医学理论与临床的发展，医学教育也达到比较完善的程度，是中医学理论体系的继承发展时期。故选C。","p":"p2"},{"n":28,"t":"B型","q":"明清时期为中医学理论体系的","pre":"","o":[["A","奠基时期"],["B","初步发展时期"],["C","继承发展时期"],["D","系统完善时期"],["E","传承创新时期"]],"a":"D","x":"明清时期为中医学理论体系的系统完善时期。故选D。","p":"p2"},{"n":29,"t":"B型","q":"中华人民共和国成立以来为中医学理论体系的","pre":"","o":[["A","奠基时期"],["B","初步发展时期"],["C","继承发展时期"],["D","系统完善时期"],["E","传承创新时期"]],"a":"E","x":"中华人民共和国成立以后，中医内科学得到快速发展。随着高等中医院校和各级中医医院的建立，内科学同其他各学科一样，医疗、教学、科研工作有了很大进步，培养了大批中医人才，有力地推动了中医内科学的发展。中医内科学理论体系进入传承创新时期。故选E。","p":"p2"},{"n":30,"t":"B型","q":"《鸡峰普济方》的作者是","pre":"","o":[["A","虞抟"],["B","董汲"],["C","张锐"],["D","陈无择"],["E","龚廷贤"]],"a":"C","x":"张锐著《鸡峰普济方》，把水肿分为多种类型，根据起始部位的特征区别不同性质的水肿，施以不同治法。故选C。","p":"p4"},{"n":31,"t":"B型","q":"《脚气治法总要》的作者是","pre":"","o":[["A","虞抟"],["B","董汲"],["C","张锐"],["D","陈无择"],["E","龚廷贤"]],"a":"B","x":"董汲著《脚气治法总要》，对脚气病的病因、发病情况、治疗方法均有详细论述，并订出64方，是一部现存较全面的脚气病专书。故选B。","p":"p4"},{"n":32,"t":"B型","q":"《三因极一病证方论》的作者是","pre":"","o":[["A","虞抟"],["B","董汲"],["C","张锐"],["D","陈无择"],["E","龚廷贤"]],"a":"D","x":"陈无择的《三因极一病证方论》在传承前人经验的基础上，创立外因、内因、不内外因的三因学说，此说概括性强，适于临证应用，为后世医家所尊崇。故选D。","p":"p4"},{"n":33,"t":"B型","q":"《医学正传》的作者是","pre":"","o":[["A","虞抟"],["B","董汲"],["C","张锐"],["D","陈无择"],["E","龚廷贤"]],"a":"A","x":"虞抟的《医学正传》发展了朱丹溪的学说。故选A。","p":"p5"},{"n":34,"t":"B型","q":"《寿世保元》的作者是","pre":"","o":[["A","虞抟"],["B","董汲"],["C","张锐"],["D","陈无择"],["E","龚廷贤"]],"a":"E","x":"龚廷贤所著《寿世保元》，先基础，后临床，先论述，后列方，并附医案，取材丰富，立论精详，选方切用，适于内科临床参考。故选E。","p":"p6"},{"n":35,"t":"B型","q":"吴又可的代表作是","pre":"","o":[["A","《温疫论》"],["B","《温热论》"],["C","《温病条辨》"],["D","《湿热病篇》"],["E","《温热经纬》"]],"a":"A","x":"吴又可著《温疫论》。故选A。","p":"p7"},{"n":36,"t":"B型","q":"叶天士的代表作是","pre":"","o":[["A","《温疫论》"],["B","《温热论》"],["C","《温病条辨》"],["D","《湿热病篇》"],["E","《温热经纬》"]],"a":"B","x":"叶天士著《温热论》。故选B。","p":"p7"},{"n":37,"t":"B型","q":"吴鞠通的代表作是","pre":"","o":[["A","《温疫论》"],["B","《温热论》"],["C","《温病条辨》"],["D","《湿热病篇》"],["E","《温热经纬》"]],"a":"C","x":"吴鞠通著《温病条辨》。故选C。","p":"p7"},{"n":38,"t":"B型","q":"薛生白的代表作是","pre":"","o":[["A","《温疫论》"],["B","《温热论》"],["C","《温病条辨》"],["D","《湿热病篇》"],["E","《温热经纬》"]],"a":"D","x":"薛生白著《湿热病篇》。故选D。","p":"p7"},{"n":39,"t":"B型","q":"王孟英的代表作是","pre":"","o":[["A","《温疫论》"],["B","《温热论》"],["C","《温病条辨》"],["D","《湿热病篇》"],["E","《温热经纬》"]],"a":"E","x":"王孟英著《温热经纬》。故选E。","p":"p7"},{"n":40,"t":"多选","q":"中医内科的古称有","pre":"","o":[["A","疡医"],["B","疾医"],["C","杂医"],["D","大方脉"],["E","铃医"]],"a":"BCD","x":"中医内科古称“疾医”“杂医”“大方脉”。故选B、C、D。","p":"p1"},{"n":41,"t":"多选","q":"下列属于《伤寒论》所涉及内容的是","pre":"","o":[["A","以六经论伤寒"],["B","以脏腑论杂病"],["C","以病证为专题专篇"],["D","合病、并病"],["E","六经病证传变关系"]],"a":"ADE","x":"《伤寒论》以六经论伤寒，分别讨论各经病证的特点和相应的治法方药，还阐述了各经病证的传变关系以及合病、并病或失治、误治引起的变证、坏证的辨证与治疗方法。故选A、D、E。","p":"p3"},{"n":42,"t":"多选","q":"下列病证张仲景在《金匮要略》中列有专题、专篇论述的是","pre":"","o":[["A","肺痈"],["B","肺痿"],["C","痰饮"],["D","黄疸"],["E","水肿"]],"a":"ABCDE","x":"《金匮要略》以脏腑论杂病，以病证为专题、专篇加以论述，如肺痈、肺痿、痰饮、黄疸、下利、水肿等病证的病因病机、辨证方法与治疗方药。故选A、B、C、D、E。","p":"p3"},{"n":43,"t":"多选","q":"“金元四大家”包括","pre":"","o":[["A","刘完素"],["B","张子和"],["C","李东垣"],["D","朱丹溪"],["E","张元素"]],"a":"ABCD","x":"刘完素、张子和、李东垣、朱丹溪四者形成了对后世影响极大的四大学派，被后世称为“金元四大家”。故选A、B、C、D。","p":"p5"},{"n":44,"t":"多选","q":"下列属于朱丹溪所创方剂是","pre":"","o":[["A","越鞠丸"],["B","二妙丸"],["C","保和丸"],["D","虎潜丸"],["E","大补阴丸"]],"a":"ABCDE","x":"朱丹溪创越鞠丸、二妙丸、保和丸、虎潜丸、大补阴丸等方剂，沿用至今。故选A、B、C、D、E。","p":"p5"},{"n":45,"t":"多选","q":"温病学发展过程中具有代表性的医家是","pre":"","o":[["A","吴又可"],["B","叶天士"],["C","吴鞠通"],["D","薛生白"],["E","王孟英"]],"a":"ABCDE","x":"温病学说的形成对中医内科学的发展具有较大的推动作用，代表性医家有五，即吴又可、叶天士、吴鞠通、薛生白、王孟英。故选A、B、C、D、E。","p":"p7"},{"n":46,"t":"多选","q":"吴又可认为，引发温疫的主要因素是","pre":"","o":[["A","感染“戾气”"],["B","“六气”所致"],["C","机体机能状况不良"],["D","情志不畅"],["E","饮食不节"]],"a":"AC","x":"吴又可认为温疫有别于其他热性病，它不因感受“六气”所致，而以感染“戾气”和机体机能状况不良为发病主因。故选A、C。","p":"p7"},{"n":47,"t":"多选","q":"下列方剂为王清任所创制的有","pre":"","o":[["A","失笑散"],["B","桃红四物汤"],["C","桃仁红花煎"],["D","血府逐瘀汤"],["E","补阳还五汤"]],"a":"DE","x":"王清任著《医林改错》，对瘀血病机的论述有独到见解，所创立的血府逐瘀汤等活血化瘀诸方，以及为气虚血瘀证所制补阳还五汤等，直到今日仍有很高的实用价值。故选D、E。","p":"p6"},{"n":48,"t":"多选","q":"下列属于张锡纯《医学衷中参西录》创制方剂的是","pre":"","o":[["A","镇肝息风汤"],["B","升陷汤"],["C","玉液汤"],["D","膏淋汤"],["E","天麻钩藤饮"]],"a":"ABCD","x":"张锡纯《医学衷中参西录》主张以中医为主体，取西医之长，补中医之短，创制镇肝息风汤、升陷汤、玉液汤、膏淋汤等方剂。故选A、B、C、D。","p":"p8"},{"n":49,"t":"多选","q":"下列属于《医学实在易》分类讨论疾病条目的是","pre":"","o":[["A","阴证、阳证"],["B","表证、里证"],["C","寒证、热证"],["D","实证、虚证"],["E","营分证、卫分证"]],"a":"BCD","x":"《医学实在易》以表证、里证、寒证、热证、实证、虚证分类讨论疾病的证治。故选BCD。","p":"p6"},{"n":50,"t":"多选","q":"以下属于以病因命名的疾病是","pre":"","o":[["A","中风"],["B","中暑"],["C","厥证"],["D","虫证"],["E","郁证"]],"a":"ABD","x":"以病因命名的，如中风、中暑、虫证等；以核心病机命名的，如郁证、痹证、厥证等。故选A、B、D。","p":"p9"}]},"02-00":{"name":"辨证论治思路与原则","lecture":"1 总论.pdf","points":[{"id":"p1","name":"病机与审察病机","teach":"<p><b>病机定义<\/b>（《中医药学名词》）：研究疾病发生、发展、变化的机理，包括<b>病性、病位、病势、脏腑气血虚实变化及其预后<\/b>。<mark>不含病因<\/mark>。<\/p><ul><li><b>审察病机<\/b>＝辨证论治的<mark>关键环节<\/mark>，也是前提。<\/li><li><b>谨守病机<\/b>＝辨证论治必须遵守的<b>原则<\/b>。<\/li><\/ul><p>病、证、症：咳嗽是病名，风热犯肺是证型，咳声嘶哑、苔薄黄、脉浮数是症状；同病可异治（感冒分风寒、风热），异病可同治（水肿、腰痛、癃闭同见肾阳虚）。<\/p>","src":"讲义 1 总论 第二章 病证症病机的关系、辨证与辨病; 题库 #1 #2 解析"},{"id":"p2","name":"各系病机特点","teach":"<table><thead><tr><th>病系<\/th><th>主要病机特点<\/th><\/tr><\/thead><tbody><tr><td>肺系<\/td><td>肺气失于<mark>宣发肃降<\/mark><\/td><\/tr><tr><td>脾（胃）系<\/td><td>中焦<mark>运化、受纳、升降<\/mark>失常<\/td><\/tr><tr><td>心系<\/td><td><mark>血脉<\/mark>血行障碍，<mark>神明<\/mark>失司<\/td><\/tr><tr><td>脑系<\/td><td><mark>髓海<\/mark>不足，元神失养<\/td><\/tr><tr><td>肝系<\/td><td>疏泄不畅、肝阳升发太过、<mark>肝风内动<\/mark><\/td><\/tr><\/tbody><\/table><p>认关键词：宣降→肺，中焦→脾胃，神明→心，髓海→脑，动风→肝。<\/p>","src":"题库 #8-12 解析"},{"id":"p3","name":"治则总览·标本","teach":"<p><b>辨证原则<\/b>：全面分析病情、掌握病证病机特点。<\/p><p><b>治疗原则（8 条）<\/b>：调节整体平衡、审证求机论治、明辨标本缓急、把握动态变化、顺应异法方宜、据证因势利导、先期治未病、重视调摄护理。<\/p><ul><li>“<b>间者并行，甚者独行<\/b>”（《素问·标本病传论》）＝急则治标、缓则治本、标本同治 → <mark>明辨标本缓急<\/mark>。<\/li><li>《素问·至真要大论》：“谨察阴阳所在而调之，以<mark>平<\/mark>为期。”<\/li><\/ul>","src":"题库 #5 #6 #13 解析"},{"id":"p4","name":"三因制宜","teach":"<p>根据季节、气候、地区、体质、年龄选治法＝<b>顺应异法方宜<\/b>（五项全选）。<\/p><ul><li><b>因时<\/b>：季节、时辰、就诊节气。春夏阳气升发、腠理疏松，外感风寒也<mark>不可过用辛温发散<\/mark>，防开泄太过、耗气伤阴。<\/li><li><b>因人<\/b>：年龄、体质、性别、生活习惯。<mark>就诊节气不属因人<\/mark>，属因时。<\/li><li><b>因地<\/b>：地区。<\/li><\/ul><p>妇女有月经、怀孕、产后：慎用或忌用<b>峻下、破血、滑利<\/b>（补益、养血不忌）。<\/p>","src":"题库 #3 #4 #15 #17 解析（#15 题库原文“峨下”，应为峻下）"},{"id":"p5","name":"调摄护理","teach":"<p>内容：<b>饮食、生活、精神、服药<\/b>护理（以上皆是）。<\/p><table><thead><tr><th>证<\/th><th>护理要点<\/th><\/tr><\/thead><tbody><tr><td>风寒表证（解表发汗时）<\/td><td>避风寒、酌加衣被、药后热汤热粥、促发汗；<mark>不给生冷<\/mark><\/td><\/tr><tr><td>里实热证<\/td><td>清凉冷饮、室内通风、衣着宜薄、大便通畅；降温用<mark>温浴<\/mark>，不是冰浴<\/td><\/tr><\/tbody><\/table>","src":"题库 #7 #14 #16 解析"}],"q":[{"n":1,"t":"A1型","q":"辨证论治的关键环节是","pre":"","o":[["A","司外揣内"],["B","司内揣外"],["C","三因制宜"],["D","谨守病机"],["E","审察病机"]],"a":"E","x":"审察病机是辨证论治的关键环节。“审察病机”是辨证论治的前提，“谨守病机”则是辨证论治必须遵守的原则。故选E。","p":"p1"},{"n":2,"t":"A1型","q":"《中医药学名词》对病机的定义的内容，不包括","pre":"","o":[["A","病性"],["B","病位"],["C","病因"],["D","病势"],["E","脏腑气血虚实变化及其预后"]],"a":"C","x":"《中医药学名词》对病机的定义是：“病机是研究疾病发生、发展、变化的机理，包括病性、病位、病势、脏腑气血虚实变化及其预后等。故选C。","p":"p1"},{"n":3,"t":"A1型","q":"春夏季节，阳气升发，人体腠理疏松开泄，若外感风寒，一般不宜过用辛温发散之品，体现的治疗原则是","pre":"","o":[["A","实则泻之"],["B","虚则补之"],["C","因人制宜"],["D","因时制宜"],["E","因地制宜"]],"a":"D","x":"治疗应结合不同季节、不同时辰的特点，考虑用药的原则，称为“因时制宜”。如春夏季节，气候由温渐热，阳气升发，人体腠理疏松开泄，此时即使外感风寒，治疗时一般也不可过用辛温发散之品，以防止开泄太过，耗气伤阴。故选D。","p":"p4"},{"n":4,"t":"A1型","q":"下列不属于治疗用药“因人制宜”原则的是","pre":"","o":[["A","患者年龄"],["B","患者体质"],["C","患者性别"],["D","患者生活习惯"],["E","患者就诊节气"]],"a":"E","x":"根据患者年龄、体质、性别、生活习惯等不同特点，来考虑治疗用药的原则，称为“因人制宜”；考虑患者就诊节气，属“因时制宜”。故选E。","p":"p4"},{"n":5,"t":"A1型","q":"“间者并行，甚者独行”体现的辨证论治原则是","pre":"","o":[["A","明辨标本缓急"],["B","顺应异法方宜"],["C","据证因势利导"],["D","先期治未病"],["E","重视调摄护理"]],"a":"A","x":"“间者并行，甚者独行”出自《素问·标本病传论》，是指采取“急则治其标，缓则治其本”和“标本同治”的方法进行治疗，也即明辨标本缓急的治疗原则。故选A。","p":"p3"},{"n":6,"t":"A1型","q":"《素问·至真要大论》曰：“谨察阴阳所在而调之，以＿＿＿＿为期。”","pre":"","o":[["A","平"],["B","和"],["C","衡"],["D","均"],["E","常"]],"a":"A","x":"《素问·至真要大论》曰：“谨察阴阳所在而调之，以平为期。”故选A。","p":"p3"},{"n":7,"t":"A1型","q":"下列属于调摄护理内容的是","pre":"","o":[["A","饮食护理"],["B","生活护理"],["C","精神护理"],["D","服药护理"],["E","以上皆是"]],"a":"E","x":"调摄护理的内容十分丰富，如饮食护理、生活护理、精神护理、服药护理等。故选E。","p":"p5"},{"n":8,"t":"B型","q":"肺系病证的主要病机特点是","pre":"","o":[["A","气失于宣发肃降"],["B","中焦运化、受纳、升降功能失常"],["C","血脉血行障碍，神明失司"],["D","髓海不足，元神失养"],["E","气机疏泄不畅、动风"]],"a":"A","x":"肺系病证的病机特点是肺气失于宣发肃降。故选A。","p":"p2"},{"n":9,"t":"B型","q":"脾（胃）系病证的主要病机特点是","pre":"","o":[["A","气失于宣发肃降"],["B","中焦运化、受纳、升降功能失常"],["C","血脉血行障碍，神明失司"],["D","髓海不足，元神失养"],["E","气机疏泄不畅、动风"]],"a":"B","x":"脾（胃）系病证的主要病机特点是中焦运化、受纳、升降功能失常。故选B。","p":"p2"},{"n":10,"t":"B型","q":"心系病证主要病机特点是","pre":"","o":[["A","气失于宣发肃降"],["B","中焦运化、受纳、升降功能失常"],["C","血脉血行障碍，神明失司"],["D","髓海不足，元神失养"],["E","气机疏泄不畅、动风"]],"a":"C","x":"心系病证主要病机特点是血脉血行障碍，神明失司。故选C。","p":"p2"},{"n":11,"t":"B型","q":"脑系病证主要病机特点是","pre":"","o":[["A","气失于宣发肃降"],["B","中焦运化、受纳、升降功能失常"],["C","血脉血行障碍，神明失司"],["D","髓海不足，元神失养"],["E","气机疏泄不畅、动风"]],"a":"D","x":"脑系病证主要病机特点是髓海不足，元神失养等。故选D。","p":"p2"},{"n":12,"t":"B型","q":"肝系病证主要病机特点是","pre":"","o":[["A","气失于宣发肃降"],["B","中焦运化、受纳、升降功能失常"],["C","血脉血行障碍，神明失司"],["D","髓海不足，元神失养"],["E","气机疏泄不畅、动风"]],"a":"E","x":"肝系病证主要病机物点是肝气疏泄不畅、肝阳升发太过、肝风内动等。故选E。","p":"p2"},{"n":13,"t":"多选","q":"中医内科疾病治疗原则包括","pre":"","o":[["A","调节整体平衡"],["B","审证求机论治"],["C","明辨标本缓急"],["D","顺应异法方宜"],["E","先期治未病"]],"a":"ABCDE","x":"中医内科疾病辨证原则包括：全面分析病情、掌握病证病机特点；治疗原则包括：调节整体平衡、审证求机论治、明辨标本缓急、把握动态变化、顺应异法方宜、据证因势利导、先期治未病、重视调摄护理。故选A、B、C、D、E。","p":"p3"},{"n":14,"t":"多选","q":"下列属于里实热证患者调摄护理方法的是","pre":"","o":[["A","给予清凉冷饮"],["B","保持室内通风"],["C","保持大便通畅"],["D","轻薄衣着"],["E","冰浴降温"]],"a":"ABCD","x":"里实热证，在调护上则要注意多给清凉冷饮，保持室内通风，衣着宜薄，且使大便通畅，或以温浴降温。故选A、B、C、D。","p":"p5"},{"n":15,"t":"多选","q":"妇女患者，因有月经、怀孕、产后等特殊情况，治疗用药必须加以考虑，应慎用或忌用的是","pre":"","o":[["A","补益"],["B","峨下"],["C","养血"],["D","破血"],["E","滑利"]],"a":"BDE","x":"妇女患者，因有月经、怀孕、产后等特殊情况，治疗用药必须加以考虑，慎用或忌用峨下、破血、滑利等药物。故选B、D、E。","p":"p4"},{"n":16,"t":"多选","q":"对风寒表证，在应用解表发汗时，护理上应","pre":"","o":[["A","避风寒"],["B","饮食生冷寒凉"],["C","酌加衣被"],["D","药后予热汤、热粥"],["E","促发汗"]],"a":"ACDE","x":"对风寒表证，在应用解表发汗时，护理上应避免患者再受风寒外袭，还要酌加衣被，给予热汤、热粥，促其发汗。故选A、C、D、E。","p":"p5"},{"n":17,"t":"多选","q":"治疗疾病的选方用药应考虑下列哪些方面","pre":"","o":[["A","季节"],["B","气候"],["C","地区"],["D","患者体质"],["E","患者年龄"]],"a":"ABCDE","x":"在治疗疾病时，必须根据季节、气候、地区、患者的体质、年龄等不同特点而选用适宜治疗方法，此即顺应异法方宜的治疗原则。故选A、B、C、D、E。","p":"p4"}]},"03-00":{"name":"辨证论治概要","lecture":"1 总论.pdf","points":[{"id":"p1","name":"风：外风与内风","teach":"<p><b>风为百病之长<\/b>；善行数变、来去无常、游走不定，首犯肺卫、易袭<b>上部<\/b>和卫表，实证多。<b>内风<\/b>主要是<b>肝<\/b>经病变（诸风掉眩，皆属于肝）。外风宜<b>疏风解表<\/b>，内风宜<b>平肝息风<\/b>；外风引动内风则祛风、息风并用。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>风寒<\/td><td>风寒束表，肺卫不宣；恶寒无汗，<mark>涕清痰稀<\/mark>，脉浮紧<\/td><td>疏风散寒<\/td><td>荆防达表汤<\/td><\/tr><tr><td>风热<\/td><td>风热袭表，肺失清肃<\/td><td>疏风清热<\/td><td>桑菊饮<\/td><\/tr><tr><td>风入经络<\/td><td>风邪入络，络脉痹阻<\/td><td>祛风通络<\/td><td>防风汤/牵正散/玉真散<\/td><\/tr><tr><td>肝阳化风<\/td><td>眩晕麻木震颤，甚则昏仆<\/td><td>平肝息风潜阳<\/td><td>天麻钩藤饮、镇肝熄风汤<\/td><\/tr><tr><td>热极生风<\/td><td>邪热亢盛，伤及营血，内陷心肝；<mark>壮热<\/mark>抽搐、角弓反张<\/td><td>清热凉肝息风<\/td><td>羚角钩藤汤<\/td><\/tr><tr><td>阴虚风动<\/td><td>阴血不足，筋脉失养，虚风内动<\/td><td>滋阴养血，柔肝息风<\/td><td>大定风珠、补肝汤<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第三章第一节 风; 题库 #1-7 #86 #87 #112-114 #148-150 #190 #191 解析"},{"id":"p2","name":"寒：外寒与内寒","teach":"<p>外寒多从<b>口鼻、体表<\/b>而受，客犯肺胃、凝滞经脉、腠理闭塞；内寒由<b>阳气亏虚<\/b>而生。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>寒邪侵表<\/td><td>表寒无汗<\/td><td>辛温发汗，散寒解表<\/td><td>麻黄汤<\/td><\/tr><tr><td>中寒<\/td><td>寒邪直中；恶寒战栗，四肢冰冷挛痛，面青咬牙，昏迷僵直，<mark>脉沉伏<\/mark>（无头痛项强等表证）<\/td><td>温里祛寒，助阳破阴<\/td><td>四逆汤<\/td><\/tr><tr><td>阴寒内盛<\/td><td>阴寒内盛，阳气虚衰；形寒肢冷，下利清谷<\/td><td>助阳祛寒<\/td><td>四逆汤<\/td><\/tr><tr><td>脾肾阳虚<\/td><td>脾肾阳虚，阴寒凝结；腰膝酸冷，<mark>五更泄泻<\/mark><\/td><td>温补脾肾<\/td><td>附子理中汤<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第一节 寒; 题库 #8-10 #88 #89 #115-117 #151-153 #192 解析"},{"id":"p3","name":"暑与火","teach":"<p><b>暑<\/b>：夏季主气（后夏至日者为病暑）；阳气亢盛、腠理大开、津气耗伤，暑气通心可高热昏迷。<b>火<\/b>：阳邪，<b>发病暴急<\/b>、变化迅速、易耗阴津。内伤之火由情志抑郁、劳欲过度、脏腑积热、阴阳失调引起（<b>不含<\/b>感受外邪）。外火按卫气营血分用辛凉解表、和解清热、辛寒清气、气营两清、清营凉血。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>中暑<\/td><td>暑热蒙心，气阴两伤<\/td><td>清暑生津<\/td><td>人参白虎汤<\/td><\/tr><tr><td>暑热<\/td><td>入夏常发热，<mark>汗少<\/mark>，午后热甚，脉细数<\/td><td>清暑益气，养阴生津<\/td><td>王氏清暑益气汤<\/td><\/tr><tr><td>暑湿<\/td><td>暑邪夹湿；<mark>身热不扬<\/mark>，胸闷恶心<\/td><td>清暑化湿<\/td><td>藿香正气散<\/td><\/tr><tr><td>火热炽盛<\/td><td>外火<\/td><td>泻火解毒<\/td><td>黄连解毒汤<\/td><\/tr><tr><td>实火<\/td><td>心肝火旺，胃热火盛<\/td><td>清热泻火<\/td><td>泻心汤、龙胆泻肝汤<\/td><\/tr><tr><td>虚火<\/td><td>阴虚<\/td><td>滋阴降火<\/td><td>百合固金汤、知柏地黄丸<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第一节 暑、火; 题库 #11-13 #23-25 #90 #118-120 #193 #198 #199 解析"},{"id":"p4","name":"湿：外湿与内湿","teach":"<p>湿为重浊阴邪，黏滞，<b>起病缓慢<\/b>、缠绵难复。内湿因恣啖生冷、过饮酒醪、肥甘失节伤脾而生（久处卑湿、阴雨缠绵属外湿）。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>湿困卫表<\/td><td>湿邪困表，卫气被郁；身热不甚，<mark>头痛如裹<\/mark>，脉浮濡<\/td><td>芳香化湿<\/td><td>藿朴夏苓汤<\/td><\/tr><tr><td>湿滞经络<\/td><td>湿邪袭络，留着关节；关节重着漫肿<\/td><td>祛湿通络<\/td><td>薏苡仁汤<\/td><\/tr><tr><td>湿毒浸淫<\/td><td>湿毒郁表，浸淫肌肤；疮疹流黄水<\/td><td>化湿解毒<\/td><td>二妙丸加味<\/td><\/tr><tr><td>寒湿中阻<\/td><td><\/td><td>温中化湿<\/td><td>胃苓汤、实脾饮<\/td><\/tr><tr><td>湿热内蕴<\/td><td>湿热内蕴，脾失健运；<mark>苔黄腻<\/mark><\/td><td>清热化湿<\/td><td>甘露消毒丹<\/td><\/tr><tr><td>脾虚湿困<\/td><td>脾虚不运，湿邪内停；面黄神疲便溏<\/td><td>健脾化湿<\/td><td>香砂六君子汤<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第一节 湿; 题库 #14-17 #91 #92 #94 #121-123 #154-156 #194 #195 解析"},{"id":"p5","name":"燥：外燥与内燥","teach":"<p>治燥原则：<b>生津润燥<\/b>；外燥轻宣润燥，内燥滋阴润燥。燥涉<b>肺、胃、肝、肾<\/b>。内燥由热盛伤津、汗吐下后、失血过多、久病精血内夺而生。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>温燥<\/td><td>燥邪袭肺，肺津受伤；<mark>痰中带血<\/mark>，口渴<\/td><td>清宣凉润<\/td><td>桑杏汤、清燥救肺汤<\/td><\/tr><tr><td>凉燥<\/td><td>秋冬；恶寒无汗，干咳，<mark>痰质清稀<\/mark>，脉浮弦<\/td><td>宣肺达表，化痰润燥<\/td><td>杏苏散<\/td><\/tr><tr><td>肺胃津伤<\/td><td><\/td><td>滋养肺胃，生津润燥<\/td><td>沙参麦冬汤<\/td><\/tr><tr><td>肝肾阴亏<\/td><td><\/td><td>滋补肝肾，养阴润燥<\/td><td>六味地黄丸<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第一节 燥; 题库 #18-22 #93 #124-126 #196 #197 解析"},{"id":"p6","name":"肺系","teach":"<p><b>脏腑辨证是辨证论治的核心<\/b>。肺主宣发肃降，通调水道。主症：咳嗽、喘、痰、咳血、失音。外感证候：风寒、风热、燥邪犯肺。易混：<b>痰少而黄<\/b>→风热犯肺；<b>干咳无痰<\/b>、脉浮数或浮紧→燥邪犯肺。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肺气亏虚<\/td><td>肺气虚弱，卫外不固<\/td><td>补肺益气<\/td><td>补肺汤、玉屏风散<\/td><\/tr><tr><td>风寒犯肺<\/td><td><\/td><td>宣肺散寒<\/td><td>华盖散/杏苏散<\/td><\/tr><tr><td>风热犯肺<\/td><td>痰少色黄<\/td><td>疏风清热，宣肺止咳<\/td><td>桑菊饮<\/td><\/tr><tr><td>肺热炽盛<\/td><td>火热炽盛，壅塞于肺<\/td><td>清泄肺热，止咳平喘<\/td><td>麻杏石甘汤<\/td><\/tr><tr><td>寒痰阻肺<\/td><td><\/td><td>温肺化饮，止咳化痰<\/td><td>二陈汤合三子养亲汤<\/td><\/tr><tr><td>痰瘀阻肺<\/td><td>喘息不能平卧，唇甲发绀<\/td><td>涤痰祛瘀，泻肺平喘<\/td><td>千金苇茎汤合桃仁红花煎<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第二节 一、肺; 题库 #26-33 #157-159 #200-202 解析"},{"id":"p7","name":"心系","teach":"<p>心主神明，为五脏六腑之大主。主症：惊悸怔忡、真心痛、昏迷虚脱、水肿、失眠健忘（<b>眩晕属肝<\/b>）。<b>面色㿠白<\/b>→心阳虚非心气虚。危重证：心阳暴脱、真心痛、热陷心包、内闭外脱。心源水肿<b>下肢为甚<\/b>，面唇发绀。安神：虚证酸枣仁、柏子仁、茯神；实证龙骨、牡蛎、磁石。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>心阳虚<\/td><td>心阳虚衰，虚寒内生<\/td><td>温通心阳<\/td><td>保元汤<\/td><\/tr><tr><td>心阴虚<\/td><td>心烦潮热盗汗，舌红少苔<\/td><td>滋养心阴<\/td><td>天王补心丹<\/td><\/tr><tr><td>心脉痹阻<\/td><td>瘀/痰/寒/气分治；寒凝<mark>猝然心痛如绞<\/mark><\/td><td>活血通脉；通阳泄浊；祛寒活血；疏调气机<\/td><td>血府逐瘀汤 等<\/td><\/tr><tr><td>痰蒙心神<\/td><td>痰浊蒙蔽心神<\/td><td>豁痰开窍<\/td><td>菖蒲郁金汤<\/td><\/tr><tr><td>痰火扰神<\/td><td>火热痰浊蕴结，扰乱心神<\/td><td>清心豁痰，开窍醒神<\/td><td>礞石滚痰丸<\/td><\/tr><tr><td>热陷心包<\/td><td>高热神昏谵语，舌绛<\/td><td>清心开窍<\/td><td>安宫牛黄丸<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第二节 二、心; 题库 #34-39 #160-162 #203-206 解析"},{"id":"p8","name":"脾系","teach":"<p>脾为后天之本，主运化、升清、统血，<b>喜燥恶湿<\/b>，与<b>湿<\/b>最密切。主症：泄泻、腹痛、便秘。便秘病机：燥热内结、气滞、气虚、血虚、阳虚寒凝皆可。腹痛虚证：<b>绵绵作痛，喜按<\/b>。湿热蕴脾：脘闷纳呆，恶心，口黏，便溏不爽。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>脾气虚<\/td><td><\/td><td>益气健脾<\/td><td>六君子汤、参苓白术散<\/td><\/tr><tr><td>脾虚气陷<\/td><td><mark>内脏下垂<\/mark>、脘腹重坠<\/td><td>益气升提<\/td><td>补中益气汤<\/td><\/tr><tr><td>脾阳虚<\/td><td>畏寒怕冷<\/td><td>温补脾阳<\/td><td>理中汤<\/td><\/tr><tr><td>脾不统血<\/td><td>慢性出血+气虚<\/td><td>补气摄血<\/td><td>归脾汤<\/td><\/tr><tr><td>寒湿困脾<\/td><td>纳呆腹胀便溏，兼寒湿<\/td><td>运脾化湿<\/td><td>胃苓汤<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第二节 三、脾; 题库 #40-43 #163-165 #207-212 解析"},{"id":"p9","name":"胃与大小肠","teach":"<p>胃失和降、胃气上逆：恶心、呕吐、呃逆、嗳气（噎膈不在此列）。胃阴虚兼气滞用理气不伤阴之品：绿梅花、佛手花、玫瑰花。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>寒滞胃肠<\/td><td>冷痛暴急，<mark>遇寒加剧<\/mark><\/td><td>温胃散寒，理气止痛<\/td><td>良附丸<\/td><\/tr><tr><td>食滞胃肠<\/td><td>呕吐酸腐，苔厚腻<\/td><td>消食导滞<\/td><td>保和丸<\/td><\/tr><tr><td>胃肠气滞<\/td><td>胀痛走窜，得嗳气矢气减<\/td><td>理气止痛<\/td><td>柴胡疏肝散/加味枳术丸<\/td><\/tr><tr><td>寒饮停胃<\/td><td>胃中振水声，呕清水<\/td><td>温阳化饮<\/td><td>苓桂术甘汤合小半夏加茯苓汤<\/td><\/tr><tr><td>瘀血滞胃<\/td><td>血行瘀滞，胃络受阻；刺痛便黑<\/td><td>活血化瘀，和胃止痛<\/td><td>失笑散合丹参饮<\/td><\/tr><tr><td>胃阴不足<\/td><td>嘈杂，<mark>隐隐灼痛<\/mark>，饥不欲食<\/td><td>滋阴益胃<\/td><td>益胃汤<\/td><\/tr><tr><td>肠热腑实<\/td><td>高热腹满拒按，便秘<\/td><td>通腑泄热<\/td><td>承气汤类<\/td><\/tr><tr><td>瘀热阻滞/寒邪内阻/虫积<\/td><td><\/td><td>清热化瘀通腑/温肠散寒/安蛔止痛<\/td><td>大黄牡丹皮汤/香砂平胃散/乌梅丸<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第二节 七、胃 八、大肠小肠; 题库 #54-56 #96 #97 #101 #127-130 #169-171 #222 #223 解析"},{"id":"p10","name":"肝胆系","teach":"<p>肝主疏泄：调畅气机、疏土助运、调节情志。主症：头痛、眩晕、痉抽搐、麻木、昏厥、黄疸、胁痛、癥瘕、鼓胀。眩晕<b>虚<\/b>证：病程长、两目干涩；头痛<b>实<\/b>证：筋脉跳动、抽掣胀痛。胁痛实证：气滞、血瘀、肝火、饮停。胆主决断，贮藏传送胆汁。易混：<b>肌肉瞤动<\/b>→肝血虚；<b>便秘尿黄<\/b>→肝火炽盛非肝阳上亢。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝阴虚<\/td><td><\/td><td>柔肝滋肾，育阴潜阳<\/td><td>一贯煎<\/td><\/tr><tr><td>肝火炽盛<\/td><td>头痛如劈，面红目赤，<mark>便秘尿黄<\/mark><\/td><td>清肝泻火<\/td><td>龙胆泻肝汤、当归龙荟丸<\/td><\/tr><tr><td>寒滞肝脉<\/td><td>少腹冷痛，阴部坠痛，颠顶冷痛<\/td><td>暖肝散寒<\/td><td>暖肝煎<\/td><\/tr><tr><td>肝风内动<\/td><td>阳亢/热极/阴虚/血虚 四类<\/td><td>平肝·凉肝·滋阴息风<\/td><td>天麻钩藤饮/羚角钩藤汤/大定风珠<\/td><\/tr><tr><td>胆虚证<\/td><td>胆怯易惊，痰多<\/td><td>靖胆化痰<\/td><td>安神定志丸合黄连温胆汤<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第二节 四、肝 六、胆（讲义胆虚证写“清胆化痰”，题库 #95 作“靖胆化痰”，从题库）; 题库 #44-47 #53 #95 #131-134 #213-218 解析"},{"id":"p11","name":"肾·膀胱·脑","teach":"<p>肾主骨生髓，先天之本。主症：腰膝酸痛、耳鸣耳聋眩晕、阳痿遗精月经失常、淋浊尿血、小便异常、水肿（<b>汗出<\/b>不属）。女子肾虚不固：崩漏、经少、延期、经闭、不孕。平补肾元：女贞子、墨旱莲、杜仲、续断。易混：<b>五更泄泻<\/b>→肾阳虚；<b>月经淋沥<\/b>→肾气不固。膀胱＝州都之官；脑＝髓海。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肾阳虚<\/td><td><\/td><td>温补肾阳<\/td><td>金匮肾气丸、右归丸<\/td><\/tr><tr><td>肾虚水泛<\/td><td>腰酸+水肿<\/td><td>温阳化水<\/td><td>真武汤<\/td><\/tr><tr><td>肾阴虚<\/td><td>肾阴亏损，虚热内扰<\/td><td>滋补肾阴/滋阴降火<\/td><td>六味/知柏地黄丸<\/td><\/tr><tr><td>肾精不足<\/td><td><\/td><td><mark>滋阴填精，益气壮阳<\/mark><\/td><td>龟鹿二仙胶<\/td><\/tr><tr><td>肾气不固<\/td><td><\/td><td>补肾固摄<\/td><td>金锁固精丸<\/td><\/tr><tr><td>脑髓空虚<\/td><td>肝肾两亏；眩晕健忘齿枯发焦<\/td><td>补益肝肾，填精益髓<\/td><td>七福饮<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第二节 五、肾 九、膀胱 十、脑; 题库 #48-52 #57 #58 #98 #100 #166-168 #219-221 解析"},{"id":"p12","name":"脏腑兼病","teach":"<p>鉴别：心肺气虚＝咳喘+<b>心悸胸闷<\/b>；脾肺气虚＝咳喘+<b>食少便溏<\/b>。肝火犯肺：胸胁灼痛，急躁易怒，咳嗽阵作，痰黄甚则咳血。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>心肾不交<\/td><td>肾阴亏虚，心火亢盛<\/td><td>交通心肾<\/td><td>黄连阿胶汤或交泰丸<\/td><\/tr><tr><td>心肾阳虚<\/td><td>心悸浮肿，唇甲青紫<\/td><td>温化水气<\/td><td>真武汤<\/td><\/tr><tr><td>心脾气血虚<\/td><td>心悸失眠+<mark>便溏<\/mark>纳差<\/td><td>补益心脾<\/td><td>归脾汤<\/td><\/tr><tr><td>肺肾气虚<\/td><td>呼多吸少，动则尤甚<\/td><td>补肺益肾，止咳平喘<\/td><td>人参蛤蚧散<\/td><\/tr><tr><td>肝火犯肺<\/td><td><\/td><td>清肝泻肺<\/td><td>黛蛤散合泻白散<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第二节 十一、脏腑兼病; 题库 #59 #60 #99 #102 #103 #135-137 #224 解析"},{"id":"p13","name":"气病","teach":"<p>精、气、血、津、液是脏腑活动的物质基础；气血津液皆由精化生。气五用：推动、温煦、防御、气化（相互转化）、固摄（防精血津液滑脱）。头晕目眩可见气虚、气陷、血虚、气逆（不见气滞）。气陷＝气虚+<b>脏器下垂<\/b>；滑精滑胎属气不固。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>气虚<\/td><td><\/td><td>益气补中<\/td><td>四君子汤<\/td><\/tr><tr><td>气陷<\/td><td>脏器下垂<\/td><td>益气升提<\/td><td>补中益气汤<\/td><\/tr><tr><td>气脱<\/td><td>呼吸微弱，大汗，<mark>脉微欲绝<\/mark><\/td><td>益气固脱，回阳救逆<\/td><td>参附龙牡汤<\/td><\/tr><tr><td>气逆<\/td><td>咳喘、呕吐、呃逆、呕血<\/td><td>降气化痰/降逆和胃/镇逆平肝；题库 #178 作“开郁顺气”<\/td><td>苏子降气汤/旋覆代赭汤/五磨饮子<\/td><\/tr><tr><td>气闭<\/td><td>突发晕厥，二便闭<\/td><td>开窍顺气解郁<\/td><td>通关散<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第三节 一、气; 气逆治法题库 #61 与讲义同为降气化痰等，#178 答“开郁顺气”，两种都按题库记; 题库 #61-66 #104 #141-143 #176-179 #184 #185 #225-228 解析"},{"id":"p14","name":"血与津液","teach":"<p>血的生成运行与<b>心、肝、脾<\/b>最密切；津液与<b>肺、脾、肾<\/b>。津：清稀流动大，濡养肌肉、充润皮肤；液：黏稠流动小，滑利关节、补益脑髓、濡耳目口鼻。痰可致神志病（癫狂痴痫），痰结皮下见圆滑包块。饮停胃肠：振水音；胸胁：<b>肋间饱满<\/b>；心包：胸闷心悸。痰饮共见：头目眩晕等。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>血虚<\/td><td><\/td><td>补气养血（题库）<\/td><td>四物汤、归脾汤<\/td><\/tr><tr><td>血脱/气随血脱<\/td><td>大失血，大汗晕厥<\/td><td>益气固脱，补血<\/td><td>急用<mark>独参汤<\/mark><\/td><\/tr><tr><td>血热<\/td><td>身热夜甚，<mark>斑疹显露<\/mark>，舌绛<\/td><td>凉血清热<\/td><td>犀角地黄汤<\/td><\/tr><tr><td>血寒<\/td><td>经期后延，<mark>少腹冷痛<\/mark><\/td><td>温经散寒<\/td><td>当归四逆汤、温经汤<\/td><\/tr><tr><td>水停<\/td><td>阳虚气化失常<\/td><td>温阳利水<\/td><td>真武汤<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第三节 二、血 三、津液; 血虚治法讲义作“补血养血”，题库 #70 作“补气养血”，从题库; 题库 #67-74 #105 #106 #138-140 #172-175 #180-183 #229 解析"},{"id":"p15","name":"六经辨证","teach":"<p>六经辨证由<b>张仲景<\/b>创立。太阳伤寒vs中风：<b>无汗vs有汗<\/b>（中风＝营卫失和）。蓄水：小便不利，水入即吐；蓄血：如狂，少腹急结，<b>小便自利<\/b>。阳明经、腑共有发热、汗出、苔黄；腑证脉沉实（非洪大）。太阴口不渴、腹满而吐。合病：葛根汤＝太阳阳明；黄芩汤＝太阳少阳；桂枝加葛根汤＝中风兼经腧不利；小青龙汤＝伤寒兼水饮。<\/p><table><thead><tr><th>证<\/th><th>辨点 / 病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>太阳伤寒<\/td><td>无汗，脉浮紧<\/td><td>发汗解表，宣肺平喘<\/td><td>麻黄汤<\/td><\/tr><tr><td>阳明经证<\/td><td>大热大渴大汗，<mark>脉洪大<\/mark><\/td><td>辛寒清热<\/td><td>白虎汤<\/td><\/tr><tr><td>阳明腑证<\/td><td>腹满痛，便秘，潮热谵语，<mark>脉沉实<\/mark><\/td><td>泻热通腑<\/td><td>承气汤类<\/td><\/tr><tr><td>少阳病<\/td><td>胆气内郁，枢机不利；往来寒热，胸胁苦满，口苦咽干目眩<\/td><td>和解少阳<\/td><td>小柴胡汤<\/td><\/tr><tr><td>少阴寒化<\/td><td>畏寒蜷卧，肢冷，脉微细<\/td><td>回阳救逆<\/td><td>四逆汤<\/td><\/tr><tr><td>少阴热化<\/td><td>心烦不得眠，舌红脉细数<\/td><td>育阴清热<\/td><td>黄连阿胶汤<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第四节 一、六经病证; 题库 #75-82 #107-111 #144-147 #186-189 #230-233 解析"},{"id":"p16","name":"卫气营血·三焦","teach":"<p>卫气营血辨证由<b>叶天士<\/b>创立。营分<b>斑疹隐隐<\/b>，血分<b>斑疹显露、紫黑密布<\/b>。三焦：中焦病机为<b>阳明燥热、太阴湿热<\/b>。<\/p><table><thead><tr><th>分<\/th><th>病机<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>卫分<\/td><td>温邪外袭，表卫郁阻<\/td><td>辛凉解表<\/td><td>银翘散、桑菊饮<\/td><\/tr><tr><td>气分<\/td><td><\/td><td>清气泄热<\/td><td>白虎汤、麻杏石甘汤<\/td><\/tr><tr><td>营分<\/td><td>斑疹隐隐<\/td><td>清营泄热<\/td><td>清营汤<\/td><\/tr><tr><td>血分<\/td><td>斑疹显露<\/td><td>凉血散血<\/td><td>犀角地黄汤<\/td><\/tr><tr><td>中焦<\/td><td>阳明燥热/太阴湿热<\/td><td>通腑泄热/清热化湿<\/td><td>承气汤/三仁汤<\/td><\/tr><\/tbody><\/table>","src":"讲义 1 总论 第四节 二、卫气营血、三焦病证; 题库 #83-85 #234 解析"}],"q":[{"n":1,"t":"A1型","q":"为百病之长的六淫是","pre":"","o":[["A","风"],["B","寒"],["C","暑"],["D","湿"],["E","燥"]],"a":"A","x":"《素问·风论》云：“风者，百病之长也。”故选A。","p":"p1"},{"n":2,"t":"A1型","q":"内风主要是指哪经病变的一类证候表现","pre":"","o":[["A","肺"],["B","脾"],["C","心"],["D","肝"],["E","肾"]],"a":"D","x":"内风主要是指肝经病变的一类证候表现，《素问·至真要大论》云：“诸风掉眩，皆属于肝。”故选D。","p":"p1"},{"n":3,"t":"A1型","q":"风有外风、内风之分，外风治宜","pre":"","o":[["A","疏风清热"],["B","疏风解表"],["C","平肝息风"],["D","疏风散寒"],["E","祛风通络"]],"a":"B","x":"外风宜疏风解表，内风宜平肝息风。针对夹寒、夹热、夹湿、夹痰等不同，应采取不同治法。在外风引动内风时，祛风与息风两法并用。故选B。","p":"p1"},{"n":4,"t":"A1型","q":"风寒证的病机要点为","pre":"","o":[["A","风寒束表，肺卫不宣"],["B","风热袭表，肺失清肃"],["C","风邪入络，络脉痹阻"],["D","肝阳上旋，阳亢化风"],["E","阴血不足，筋脉失养，虚风内动"]],"a":"A","x":"风寒证主要见恶寒，发热，无汗，头痛身痛，鼻流清涕，咳嗽，痰稀，舌苔白润，脉浮紧，病机总属风寒束表，肺卫不宣，治疗宜疏风散寒，方以荆防达表汤加减。故选A。","p":"p1"},{"n":5,"t":"A1型","q":"下列不属于内风证肝阳化风常见临床表现的是","pre":"","o":[["A","头晕目眩"],["B","肢体麻木"],["C","震颤"],["D","口眼歪斜"],["E","风火牙痛"]],"a":"E","x":"内风证肝阳化风的主要表现为头晕目眩，肢体麻木，肌肉瞤动，震颤，或头痛如掣，言语不利，步履不实，面赤，甚至突然昏仆，不省人事，舌红苔薄，脉弦。故选E。","p":"p1"},{"n":6,"t":"A1型","q":"外风证风入经络的治法是","pre":"","o":[["A","疏风散寒"],["B","疏风清热"],["C","祛风通络"],["D","平肝息风潜阳"],["E","清热凉肝息风"]],"a":"C","x":"外风证风入经络的治法是祛风通络。故选C。","p":"p1"},{"n":7,"t":"A1型","q":"内风证阴虚风动的病机要点是","pre":"","o":[["A","风热袭表，肺失清肃"],["B","风邪入络，络脉痹阻"],["C","邪热亢盛，伤及营血，内陷心肝，扇动内风"],["D","阴血不足，筋脉失养，虚风内动"],["E","风寒束表，肺卫不宣"]],"a":"D","x":"内风证阴虚风动的病机要点是阴血不足，筋脉失养，虚风内动。故选D。","p":"p1"},{"n":8,"t":"A1型","q":"内寒证阴寒内盛的病机要点是","pre":"","o":[["A","寒邪伤表，肺卫不宣"],["B","寒邪直中，伤及阳气"],["C","阴寒内盛，阳气虚衰"],["D","脾肾阳虚，阴寒凝结"],["E","风寒束表，肺卫不宣"]],"a":"C","x":"内寒证阴寒内盛的病机要点为阴寒内盛，阳气虚衰。故选C。","p":"p2"},{"n":9,"t":"A1型","q":"下列不属于外寒证“中寒”常见临床表现的是","pre":"","o":[["A","恶寒战栗"],["B","头痛项强"],["C","肢体麻木"],["D","昏迷僵直"],["E","皮肤隐紫"]],"a":"B","x":"中寒表现为恶寒战栗，肢体麻木，四肢冰冷挛痛，面青，咬牙，反应迟钝，昏迷僵直，呼吸缓慢，口鼻气冷，皮肤隐紫，舌苔白滑，脉象沉伏。故选B。","p":"p2"},{"n":10,"t":"A1型","q":"内寒证脾肾阳虚的治法是","pre":"","o":[["A","散寒解表"],["B","温里祛寒"],["C","助阳祛寒"],["D","助阳破阴"],["E","温补脾肾"]],"a":"E","x":"内寒证脾肾阳虚的治法是温补脾肾。故选E。","p":"p2"},{"n":11,"t":"A1型","q":"暑邪致病有明显的季节性，其为何季节主气","pre":"","o":[["A","春季"],["B","夏季"],["C","秋季"],["D","冬季"],["E","长夏"]],"a":"B","x":"暑邪为夏季主气，如《素问·热论》云：“后夏至日者为病暑。”故选B。","p":"p3"},{"n":12,"t":"A1型","q":"中暑的病机要点是","pre":"","o":[["A","暑热蒙心，气阴两伤"],["B","暑热亢盛，耗气伤津"],["C","暑邪夹湿，郁于肌表"],["D","暑湿困表，卫气被郁"],["E","暑热内犯，心神被扰"]],"a":"A","x":"中暑的病机要点是暑热蒙心，气阴两伤。故选A。","p":"p3"},{"n":13,"t":"A1型","q":"下列不属于暑热证常见临床表现的是","pre":"","o":[["A","肌肤灼热"],["B","出汗较少"],["C","汗多肤冷"],["D","口渴引饮"],["E","倦怠无力"]],"a":"C","x":"暑热证表现为入夏时常发热，肌肤灼热，汗少，或午后热甚，口渴引饮，食少，倦怠无力，舌苔薄白或薄黄，舌质微红，脉细数。故选C。","p":"p3"},{"n":14,"t":"A1型","q":"下列不属于湿邪致病特点的是","pre":"","o":[["A","隐匿难察"],["B","重浊"],["C","黏滞"],["D","起病迅速"],["E","缠绵难复"]],"a":"D","x":"湿为重浊之阴邪，其性黏滞，起病缓慢，隐匿难察，缠绵难复。故选D。","p":"p4"},{"n":15,"t":"A1型","q":"外湿证湿毒浸淫的病机要点是","pre":"","o":[["A","湿邪困表，卫气被郁"],["B","湿邪袭络，留着关节"],["C","湿毒郁表，浸淫肌肤"],["D","湿热蕴中，脾胃气滞"],["E","脾虚不运，湿邪内停"]],"a":"C","x":"外湿证湿毒浸淫的病机要点是湿毒郁表，浸淫肌肤。故选C。","p":"p4"},{"n":16,"t":"A1型","q":"外湿证湿困卫表的治法是","pre":"","o":[["A","芳香化湿"],["B","祛湿通络"],["C","化湿解毒"],["D","温中化湿"],["E","清热化湿"]],"a":"A","x":"外湿证湿困卫表的治法是芳香化湿。故选A。","p":"p4"},{"n":17,"t":"A1型","q":"下列不属于外湿证湿毒浸淫常见临床表现的是","pre":"","o":[["A","脚生湿气"],["B","局部瘘痒"],["C","腰脊酸软"],["D","尿浊"],["E","女子带下腥臭"]],"a":"C","x":"外湿证湿毒浸淫表现为皮肤疥癣、疮疖、疱疹，脚生湿气，局部瘘痒，流黄水，或见尿浊，女子带下腥臭，舌苔黄腻，脉滑数。故选C。","p":"p4"},{"n":18,"t":"A1型","q":"治燥的基本原则是","pre":"","o":[["A","生津润燥"],["B","轻宣润燥"],["C","滋阴润燥"],["D","清润肺胃"],["E","滋养肝肾"]],"a":"A","x":"治燥当以生津润燥为原则。外燥当轻宣润燥，内燥当滋阴润燥。燥伤上、中焦者宜清润肺胃，燥伤下焦肝肾者当滋养肝肾。故选A。","p":"p5"},{"n":19,"t":"A1型","q":"下列不属于外燥证凉燥常见临床表现的是","pre":"","o":[["A","头痛"],["B","鼻塞"],["C","咽干唇燥"],["D","干咳少痰"],["E","痰中带血"]],"a" 质暗或暗紫，苔腻或浊腻，脉结滑。故选A、B、C、D、E。","p":"p6"},{"n":203,"t":"多选","q":"下列属于心系病证水肿辨证要点的是","pre":"","o":[["A","下肢为甚"],["B","面唇发绀"],["C","胸闷心慌，短气不足以息"],["D","腹胀如鼓，皮色苍黄"],["E","前胸部常见赤丝血缕"]],"a":"ABC","x":"由于心阳不振，而致脾失转输，肾失蒸化，气不化水，水液内停而为饮，或泛溢于肢体形成水肿，其肿以下肢为甚，并可延及腹部，甚至全身皆肿，面唇发绀，颈脉动，胸闷心慌，短气不足以息。故选A、B、C。","p":"p7"},{"n":204,"t":"多选","q":"下列属于心系病证寒凝心脉辨证要点的是","pre":"","o":[["A","猝然心痛如绞"],["B","遇寒痛剧，得温痛减"],["C","体胖痰多，身重困倦"],["D","舌淡苔白，脉沉迟或沉"],["E","舌苔白腻或白滑，脉滑"]],"a":"ABD","x":"寒凝心脉表现为猝然心痛如绞，畏寒肢冷，冷汗自出，心悸气短，以遇寒痛剧为主，得温痛减，舌淡白，脉沉迟或沉。故选A、B、D。","p":"p7"},{"n":205,"t":"多选","q":"下列属于心系病证心脉痹阻治法的是","pre":"","o":[["A","活血化瘀，通脉止痛"],["B","通阳泄浊，豁痰开结"],["C","祛寒活血，宣痹通阳"],["D","疏调气机，和血舒脉"],["E","清心豁痰，开窍醒神"]],"a":"ABCD","x":"心脉痹阻属瘀血者治当活血化瘀，通脉止痛；属痰浊者治当通阳泄浊，豁痰开结；属寒凝者治当祛寒活血，宣痹通阳；属气滞者治当疏调气机，和血舒脉。故选A、B、C、D。","p":"p7"},{"n":206,"t":"多选","q":"下列属于心系病证常用安神药物的是","pre":"","o":[["A","酸枣仁"],["B","柏子仁"],["C","茯神"],["D","龙骨"],["E","磁石"]],"a":"ABCDE","x":"心系病证可加入宁心安神之品，虚证可佐养心安神之品，如酸枣仁、柏子仁、茯神等，或参入酸枣仁汤意；实证均可加入重镇安神之品，如龙骨、牡蛎、磁石等。故选A、B、C、D、E。","p":"p7"},{"n":207,"t":"多选","q":"下列属于脾生理功能的是","pre":"","o":[["A","主统血"],["B","主血"],["C","主升清"],["D","主降浊"],["E","主运化"]],"a":"ACE","x":"脾主运化，主升清，主统血。故选A、C、E。","p":"p8"},{"n":208,"t":"多选","q":"下列属于脾系病证寒湿困脾辨证要点的是","pre":"","o":[["A","纳呆"],["B","腹胀"],["C","便溏"],["D","兼寒湿证"],["E","畏寒怕冷"]],"a":"ABCD","x":"畏寒怕冷常见于脾阳虚证。故选A、B、C、D。","p":"p8"},{"n":209,"t":"多选","q":"下列属于脾系病证脾不统血常见临床表现的是","pre":"","o":[["A","神疲乏力，气短懒言"],["B","各种慢性出血"],["C","面色萎黄"],["D","舌淡，脉细无力"],["E","食少，便溏"]],"a":"ABCDE","x":"脾不统血可见各种慢性出血，如便血、尿血、吐血、鼻衄、紫斑，妇女月经过多、崩漏，食少，便溏，神疲乏力，气短懒言，面色萎黄，舌淡，脉细无力。故选A、B、C、D、E。","p":"p8"},{"n":210,"t":"多选","q":"下列属于脾系病证辨病主症的是","pre":"","o":[["A","泄泻"],["B","腹痛"],["C","水肿"],["D","便秘"],["E","胁痛"]],"a":"ABD","x":"脾系病证辨病主症包括泄泻、腹痛、便秘。故选A、B、D。","p":"p8"},{"n":211,"t":"多选","q":"下列属于脾系病证湿热蕴脾常见临床表现的是","pre":"","o":[["A","恶心纳呆"],["B","口中黏腻，渴不多饮"],["C","身热不扬"],["D","舌质红，苔黄腻"],["E","脉濡数或滑数"]],"a":"ABCDE","x":"湿热蕴脾可见脘腹胀闷，纳呆，恶心欲呕，口中黏腻，渴不多饮，便溏不爽，小便短黄，肢体困重，或身热不扬，汗出热不解，或见面目发黄，色鲜明，或皮肤发痒，舌质红，苔黄腻，脉濡数或滑数。故选A、B、C、D、E。","p":"p8"},{"n":212,"t":"多选","q":"下列属于腹痛虚证特点的是","pre":"","o":[["A","绞痛矢气"],["B","痛时拒按"],["C","腹痛绵绵"],["D","痛时喜按"],["E","来势急剧"]],"a":"CD","x":"虚证腹痛以脏气虚寒，气血不能温养所致，腹部绵绵作痛，痛时喜按。故选C、D。","p":"p8"},{"n":213,"t":"多选","q":"下列属于“肝主疏泄”作用的是","pre":"","o":[["A","调畅气机"],["B","疏土助运"],["C","调节血量"],["D","调节情志"],["E","储存血液"]],"a":"ABD","x":"肝主疏泄，包括调畅气机、疏土助运、调节情志等方面。故选A、B、D。","p":"p10"},{"n":214,"t":"多选","q":"下列属于头痛实证常见临床表现的是","pre":"","o":[["A","头部筋脉跳动"],["B","抽掣胀痛"],["C","面颧红赤"],["D","头痛隐隐，缠绵不已"],["E","伴有头眩"]],"a":"ABCE","x":"实证头痛，多为情志所伤，肝阳亢盛，风阳痰火上扰头目，清阳失展所致，可见头部筋脉跳动，抽掣胀痛，面颧红赤，或伴头眩等症。故选A、B、C、E。","p":"p10"},{"n":215,"t":"多选","q":"下列属于胁痛实证的病理因素是","pre":"","o":[["A","气滞"],["B","血瘀"],["C","阴亏"],["D","肝火"],["E","饮停"]],"a":"ABDE","x":"胁痛实证有气滞、血瘀、肝火、饮停等不同，虚证多为肝阴不足。故选A、B、D、E。","p":"p10"},{"n":216,"t":"多选","q":"下列属于肝系病证肝风内动病机要点的是","pre":"","o":[["A","肝阳上亢，肝风内动"],["B","邪热炽盛，热极动风"],["C","肝阴亏虚，虚风内动"],["D","肝血亏虚，虚风内动"],["E","阳亢于上，阴亏于下"]],"a":"ABCD","x":"肝风内动的病机要点包括：肝阳上亢，肝风内动；邪热炽盛，热极动风；肝阴亏虚，虚风内动；肝血亏虚，虚风内动。故选A、B、C、D。","p":"p10"},{"n":217,"t":"多选","q":"下列属于肝系病证阴虚动风常见临床表现的是","pre":"","o":[["A","肢体抽搐"],["B","手足震颤"],["C","眩晕耳鸣"],["D","五心烦热"],["E","潮热颧红"]],"a":"ABCDE","x":"肝阴亏虚，虚风内动证的临床表现有手足震颤、蠕动，或肢体抽搐，眩晕耳鸣，口燥咽干，形体消瘦，五心烦热，潮热颧红，舌红少津，脉弦细数。故选A、B、C、D、E。","p":"p10"},{"n":218,"t":"多选","q":"下列属于肝系病证寒滞肝脉常见临床表现的是","pre":"","o":[["A","少腹冷痛"],["B","阴部坠胀作痛"],["C","颠顶冷痛"],["D","恶寒肢冷"],["E","舌淡，苔白润"]],"a":"ABCDE","x":"寒滞肝脉可见少腹冷痛，阴部坠胀作痛，或阴器收缩引痛，或颠顶冷痛，得温则减，遇寒痛增，恶寒肢冷，舌淡，苔白润，脉沉紧或弦紧。故选A、B、C、D、E。","p":"p10"},{"n":219,"t":"多选","q":"下列属于女子肾虚不能固藏精气引起的病证是","pre":"","o":[["A","崩漏"],["B","月经过少"],["C","月经延期"],["D","闭经"],["E","不孕"]],"a":"ABCDE","x":"女子肾虚不能固藏精气，则冲任不固，引起崩漏，或化源衰少，导致经少、延期、经闭、不孕。故选A、B、C、D、E。","p":"p11"},{"n":220,"t":"多选","q":"下列属于肾系病证肾虚水泛常见临床表现的是","pre":"","o":[["A","腰膝酸软"],["B","五更泄泻"],["C","身体浮肿"],["D","畏冷肢凉"],["E","小便短少"]],"a":"ACDE","x":"五更泄泻常见于肾阳虚。故选A、C、D、E。","p":"p11"},{"n":221,"t":"多选","q":"肾系病证肾阴阳偏衰不显，以肾虚为主时，平补肾元的常用药物是","pre":"","o":[["A","女贞子"],["B","墨旱莲"],["C","肉苁蓉"],["D","杜仲"],["E","续断"]],"a":"ABDE","x":"肾系病证肾阴阳偏衰不显，以肾虚为主时，平补肾元，用女贞子、墨旱莲、杜仲、续断等。故选A、B、D、E。","p":"p11"},{"n":222,"t":"多选","q":"胃腑病证寒饮停胃常见临床表现为","pre":"","o":[["A","脘腹痞胀"],["B","胃中振水声"],["C","呕吐清水痰涎"],["D","眩晕"],["E","脉沉弦"]],"a":"ABCDE","x":"寒饮停胃表现为脘腹痞胀，胃中有振水声，呕吐清水痰涎，口淡不渴，眩晕，苔白滑，脉沉弦。故选A、B、C、D、E。","p":"p9"},{"n":223,"t":"多选","q":"常用于治疗胃腑病证阴虚兼有气滞，理气而不伤阴的药物是","pre":"","o":[["A","红花"],["B","绿梅花"],["C","佛手花"],["D","菊花"],["E","玫瑰花"]],"a":"BCE","x":"胃阴虚兼有气滞者，当投理气而不伤阴之品，如绿梅花、佛手花、玫瑰花等。故选B、C、E。","p":"p9"},{"n":224,"t":"多选","q":"下列属于肝火犯肺常见临床表现的是","pre":"","o":[["A","胸胁灼痛"],["B","面红目赤"],["C","口干口苦"],["D","阴部潮湿"],["E","带下黄稠"]],"a":"ABC","x":"肝火犯肺可见胸胁灼痛，急躁易怒，头胀头晕，面红目赤，口苦口干，咳嗽阵作，痰黄黏稠，甚则咳血，舌红苔薄黄，脉弦数。故选A、B、C。","p":"p12"},{"n":225,"t":"多选","q":"人体脏腑功能活动的物质基础是","pre":"","o":[["A","精"],["B","气"],["C","血"],["D","津"],["E","液"]],"a":"ABCDE","x":"人体脏腑功能活动的物质基础包括精、气、血、津、液。故选A、B、C、D、E。","p":"p13"},{"n":226,"t":"多选","q":"构成五脏活动的主要物质基础是","pre":"","o":[["A","精"],["B","气"],["C","血"],["D","津"],["E","液"]],"a":"BCDE","x":"由于气、血、津、液皆由精所化生，所以，气、血、津、液是构成五脏活动的主要物质基础。故选B、C、D、E。","p":"p13"},{"n":227,"t":"多选","q":"下列属于气的功用的是","pre":"","o":[["A","推动作用"],["B","温煦作用"],["C","气化作用"],["D","固摄作用"],["E","防御作用"]],"a":"ABCDE","x":"机体内各种不同的气，其功用概括起来有五，即推动作用、温煦作用、防御作用、气化作用、固摄作用。故选A、B、C、D、E。","p":"p13"},{"n":228,"t":"多选","q":"头晕目眩可见于","pre":"","o":[["A","气虚"],["B","气陷"],["C","血虚"],["D","气逆"],["E","气滞"]],"a":"ABCD","x":"气虚，推动乏力，营血不得上荣，则可见头晕目眩；气陷，清阳不升，清窍失养，可见头晕目眩；血液亏虚，头目失于濡养，亦可见头晕目眩；肝气上逆，气血上涌，壅滞、阻闭清窍，可见头晕目眩。气滞多见于胸胁脘腹或损伤部位胀闷或胀痛、窜痛。故选A、B、C、D。","p":"p13"},{"n":229,"t":"多选","q":"痰证与饮证均可见","pre":"","o":[["A","呕恶纳呆"],["B","头目眩晕"],["C","脉滑"],["D","形体肥胖"],["E","肋间饱满"]],"a":"BC","x":"纳呆、形体肥胖见于痰证；肋间饱满见于饮证。故选B、C。","p":"p14"},{"n":230,"t":"多选","q":"下列属于太阳病蓄水证常见临床表现的是","pre":"","o":[["A","少腹急结"],["B","小便不利"],["C","发狂"],["D","小便自利"],["E","水入即吐"]],"a":"BE","x":"蓄水证膀胱气化不利则见小便不利；水蓄下焦，下窍不利，水邪上逆，遂使胃气亦随之上逆，则见水入即吐。故选B、E。","p":"p15"},{"n":231,"t":"多选","q":"下列属于阳明经证与阳明腑证共有表现的是","pre":"","o":[["A","发热"],["B","汗出"],["C","腹痛"],["D","苔黄"],["E","谵语"]],"a":"ABD","x":"阳明经与阳明腑证均为里实热证，故均可见发热、汗出、苔黄。阳明腑证因邪热与燥屎内结，腑气不通，故可见腹痛；阳明实热上扰心神，则见神昏谵语。故选A、B、D。","p":"p15"},{"n":232,"t":"多选","q":"下列属于少阴病寒化证常见临床表现的是","pre":"","o":[["A","畏寒蜷卧"],["B","四肢逆冷"],["C","精神萎靡"],["D","心烦喜呕"],["E","脉微细"]],"a":"ABCE","x":"少阴病寒化证可见畏寒蜷卧，四肢逆冷，精神萎靡，似睡非睡，脉微细，或下利清谷，小便清长。故选A、B、C、E。","p":"p15"},{"n":233,"t":"多选","q":"下列属于小柴胡汤证常见临床表现的是","pre":"","o":[["A","口苦，咽干"],["B","目眩"],["C","午后潮热"],["D","心烦喜呕"],["E","嘿嘿不欲饮食"]],"a":"ABDE","x":"小柴胡汤证即少阳证，症状为口苦，咽干，目眩，脉弦，往来寒热，胸胁苦满，嘿嘿不欲饮食，心烦喜呕。故选A、B、D、E。","p":"p15"},{"n":234,"t":"多选","q":"下列属于三焦辨证中，中焦病证病机要点的是","pre":"","o":[["A","邪袭肺卫"],["B","邪陷心包"],["C","阳明燥热"],["D","太阴湿热"],["E","肾精亏耗"]],"a":"CD","x":"中焦病证的病机要点包括阳明燥热、太阴湿热。故选C、D。","p":"p16"}]},"04-01":{"name":"感冒","lecture":"4-1 感冒.pdf","points":[{"id":"p1","name":"概念·别名·沿革","teach":"<p><b>主症<\/b>：鼻塞、流涕、喷嚏、头痛、恶寒、发热、全身不适。以卫表及鼻咽症状为主；<mark>呼吸困难不是<\/mark>感冒常见表现。<\/p><p><b>别名<\/b>：轻者感受当令之气 → 冒风、伤风、冒寒（还有小伤寒）；重者感受非时之邪 → 重伤风。<b>中风、首风不是<\/b>别名。<\/p><table><thead><tr><th>医家/书<\/th><th>贡献<\/th><\/tr><\/thead><tbody><tr><td>杨士瀛《仁斋直指方》<\/td><td><mark>感冒之名最早<\/mark><\/td><\/tr><tr><td>朱丹溪《丹溪心法》<\/td><td>病位在肺；辛温、辛凉两大治法<\/td><\/tr><tr><td>林珮琴《类证治裁》<\/td><td>明确提出「时行感冒」<\/td><\/tr><tr><td>巢元方《诸病源候论》<\/td><td>称「时行病」<\/td><\/tr><tr><td>张仲景《伤寒论》<\/td><td>麻黄汤治表实、桂枝汤治表虚<\/td><\/tr><\/tbody><\/table>","src":"讲义 4-1 概述、历史沿革; 题库 #1 #2 #3 #4 #10 #56 解析"},{"id":"p2","name":"病因病机","teach":"<ul><li><b>病因<\/b>：六淫（风寒暑湿燥火）均可致病，<mark>风邪为主因、为先导<\/mark>（风为六淫之首）；另有时行疫毒。<\/li><li><b>季节<\/b>：四季皆可，<b>冬春<\/b>多见。<\/li><li><b>途径<\/b>：从口鼻、皮毛而入，肺卫首当其冲。<\/li><li><b>病位<\/b>：<mark>肺卫<\/mark>（不是肺胃、肺脾）。<\/li><li><b>基本病机<\/b>：<mark>邪犯肺卫，卫表不和<\/mark>。<\/li><li>病理性质：表实证，有寒热之异，可寒热转化或错杂。<\/li><\/ul>","src":"讲义 4-1 病因病机; 题库 #5 #6 #8 #9 #55 解析"},{"id":"p3","name":"诊断与鉴别","teach":"<p><b>时行感冒 vs 普通感冒<\/b>：关键在<mark>有无流行性<\/mark>；时行病情重，少数可传变入里。普通感冒一般不传变，病程3~7日。出现<b>喘促<\/b>等提示传变，属逆证。<\/p><table><thead><tr><th><\/th><th>感冒<\/th><th>风温<\/th><\/tr><\/thead><tbody><tr><td>热势<\/td><td>不高或不发热<\/td><td>急骤，寒战高热<\/td><\/tr><tr><td>汗后<\/td><td>汗出热退，脉静身凉<\/td><td><mark>热降脉数不静，身热复起<\/mark><\/td><\/tr><tr><td>传变<\/td><td>不传变<\/td><td>可神昏、惊厥、谵妄<\/td><\/tr><tr><td>病程/预后<\/td><td>短、好<\/td><td>较长<\/td><\/tr><\/tbody><\/table><p>两者都可发热，所以「是否发热」不是鉴别点。<b>鼻渊<\/b>：浊涕腥臭、眉额胀痛，一般无寒热，病程长。<\/p>","src":"讲义 4-1 诊断与鉴别诊断; 题库 #7 #17 #18 #34 #37 #57 解析"},{"id":"p4","name":"辨证要点与治则","teach":"<p><b>辨证<\/b>：辨偏实偏虚、辨风寒风热、辨兼夹。<\/p><p><b>总治则<\/b>：<mark>解表达邪<\/mark>（「其在皮者，汗而发之」）。风寒辛温，风热辛凉，暑湿清暑祛湿解表，虚体解表与扶正并施。初起恶风微热头胀鼻塞，用辛平轻剂：桑叶、薄荷、防风、荆芥（不用大黄）。<\/p><table><thead><tr><th>兼夹<\/th><th>多发时节<\/th><\/tr><\/thead><tbody><tr><td>夹湿<\/td><td><mark>长夏<\/mark>：身热不扬、头重如裹、脘痞、苔腻<\/td><\/tr><tr><td>夹暑<\/td><td>夏季<\/td><\/tr><tr><td>夹燥<\/td><td>秋季<\/td><\/tr><tr><td>夹食<\/td><td>饱食后<\/td><\/tr><\/tbody><\/table><p>注：讲义写「梅雨季节夹湿」，题库按十四五写「长夏」，考题按题库。<\/p>","src":"讲义 4-1 辨证要点、治则治法; 题库 #11 #22 #46-#49 #58 解析（夹湿时节以题库为准）"},{"id":"p5","name":"风寒 vs 风热","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>风寒束表<\/td><td><mark>恶寒重发热轻<\/mark>，无汗，头痛身痛，鼻塞声重、流清涕，痰白稀，苔薄白，脉浮紧<\/td><td>辛温解表，宣肺散寒<\/td><td>荆防达表汤 / 荆防败毒散<\/td><\/tr><tr><td>风热犯表<\/td><td><mark>身热较著，微恶风<\/mark>，汗泄不畅，咽干咽痛，流黄稠涕，痰黏或黄，口干欲饮，舌尖红，苔薄白干或薄黄，脉浮数<\/td><td>辛凉解表，疏风清热<\/td><td>银翘散<\/td><\/tr><\/tbody><\/table><p>看涕和咽：清涕咽痒 → 寒；黄涕咽痛 → 热。<\/p>","src":"讲义 4-1 证治分类 1-2; 题库 #12 #23 #26 #27 #29 #33 #35 #36 #40 #42 #50 #53 解析"},{"id":"p6","name":"暑湿伤表证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>暑湿伤表<\/td><td>夏季，<mark>身热不扬<\/mark>，汗出不畅，肢体困重，头重如裹，胸闷脘痞，纳呆，心烦口渴，便溏，小便短赤，苔白腻或黄腻，脉濡数<\/td><td>清暑祛湿解表<\/td><td>新加香薷饮<\/td><\/tr><\/tbody><\/table><p>新加香薷饮：香薷、厚朴、扁豆花、金银花、连翘。易混的黄连香薷饮、藿香正气散都不是代表方。<\/p><p>「发热轻、恶寒重」不是暑湿表现（那是风寒）。<\/p>","src":"讲义 4-1 证治分类 3; 题库 #15 #25 #30 #41 #54 解析"},{"id":"p7","name":"气虚 vs 阳虚感冒","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>气虚感冒<\/td><td>恶寒较甚，气短乏力，<b>自汗<\/b>，咳痰无力，平素神疲易感冒，舌淡苔薄白，<mark>脉浮无力<\/mark><\/td><td>益气解表，调和营卫<\/td><td>参苏饮<\/td><\/tr><tr><td>阳虚感冒<\/td><td>恶寒重发热轻，无汗，面色㿠白，语声低微，<b>四肢不温<\/b>，舌淡胖，<mark>脉沉细无力<\/mark><\/td><td>助阳解表<\/td><td>麻黄附子细辛汤<\/td><\/tr><\/tbody><\/table><p>两者都恶寒重；气虚脉还「浮」，阳虚脉「沉」且肢冷。玉屏风散、再造散、补肺汤不是本节代表方。<\/p>","src":"讲义 4-1 虚体感冒（1）（3）; 题库 #14 #16 #20 #24 #28 #31 #38 #39 #44 #45 #51 解析"},{"id":"p8","name":"阴虚感冒证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>阴虚感冒<\/td><td>身热，微恶风寒，无汗或微汗或<b>盗汗<\/b>，<mark>干咳少痰<\/mark>，头昏心烦，口干甚则口渴，<mark>舌红少苔，脉细数<\/mark><\/td><td>滋阴解表<\/td><td>加减葳蕤汤<\/td><\/tr><\/tbody><\/table><p>证机：阴亏津少，外受风热。葳蕤即玉竹，滋阴以资汗源。沙参麦冬汤、左归丸是干扰项。<\/p>","src":"讲义 4-1 虚体感冒（2）; 题库 #13 #21 #32 #43 #52 解析"},{"id":"p9","name":"预防调护","teach":"<ul><li>解表药<b>煎煮时间宜短<\/b>。<\/li><li>风寒表实证：药<b>趁温热服<\/b>，服后<b>进热粥<\/b>助药力，或<mark>覆被促汗<\/mark>。<\/li><li>汗后<b>及时更换<\/b>干燥衣物，避风。<\/li><li>饮食清淡，忌肥甘辛辣、酒；时行感冒重症、老人、婴幼儿要加强观察。<\/li><\/ul>","src":"讲义 4-1 预防调护; 题库 #19 解析"}],"q":[{"n":1,"t":"A1型","q":"下列不属于感冒别名的是","pre":"","o":[["A","伤风"],["B","中风"],["C","冒寒"],["D","冒风"],["E","重伤风"]],"a":"B","x":"本病病情较轻者多为感受当令之气，称为冒风、伤风、冒寒；病情较重者多为感受非时之邪，称为重伤风。故选B。","p":"p1"},{"n":2,"t":"A1型","q":"感冒之名最早见于","pre":"","o":[["A","《黄帝内经》"],["B","《诸病源候论》"],["C","《丹溪心法》"],["D","《仁斋直指方论》"],["E","《类证治裁》"]],"a":"D","x":"感冒之名，最早见于北宋·杨士瀛《仁斋直指方论·诸风》，书中有“治感冒风邪，发热头疼，咳嗽声重，涕唾稠黏”文句，后代医家始沿用此名。故选D。","p":"p1"},{"n":3,"t":"A1型","q":"明确提出“时行感冒”病名的著作是","pre":"","o":[["A","《类证治裁》"],["B","《仁斋直指方论》"],["C","《医学源流论》"],["D","《景岳全书》"],["E","《丹溪心法》"]],"a":"A","x":"清·林珮琴《类证治裁·伤风》中有“时行感冒，寒热往来，伤风无汗，参苏饮、人参败毒散、神术散”文句，明确提出“时行感冒”的病名及其治疗。故选A。","p":"p1"},{"n":4,"t":"A1型","q":"明确提出感冒的病位在肺，治疗分辛温解表和辛凉解表两大治疗原则的医家是","pre":"","o":[["A","杨士瀛"],["B","朱丹溪"],["C","林珮琴"],["D","张仲景"],["E","张介宾"]],"a":"B","x":"元·朱丹溪《丹溪心法》谓：“伤风属肺者多，宜辛温或辛凉之剂散之。”明确提出感冒治疗分辛温解表和辛凉解表两大原则。故选B。","p":"p1"},{"n":5,"t":"A1型","q":"感冒发病的季节多见于","pre":"","o":[["A","春夏"],["B","秋冬"],["C","冬春"],["D","长夏"],["E","春秋"]],"a":"C","x":"感冒四季皆可发病，以冬春季节多见。故选C。","p":"p2"},{"n":6,"t":"A1型","q":"引起感冒的主要病邪是","pre":"","o":[["A","燥邪"],["B","湿邪"],["C","暑邪"],["D","寒邪"],["E","风邪"]],"a":"E","x":"六淫病邪均能侵袭人体而致病，但风邪为主因，因风为六淫之首，流动于四时之中，故常以风邪为感冒的先导。故选E。","p":"p2"},{"n":7,"t":"A1型","q":"时行感冒与普通感冒关键区别点在于","pre":"","o":[["A","恶寒的轻与重"],["B","发热的轻与重"],["C","咽喉肿痛与否"],["D","有无流行性"],["E","脉数与否"]],"a":"D","x":"两者均可出现恶寒发热、咽喉疼痛和脉数，但时行感冒多呈流行性，病情一般比普通感冒重。故选D。","p":"p3"},{"n":8,"t":"A1型","q":"感冒的病位在","pre":"","o":[["A","肺胃"],["B","肺卫"],["C","三焦"],["D","肺脾"],["E","皮毛"]],"a":"B","x":"外邪从口鼻、皮毛入侵，肺卫首当其冲，感冒的病位在肺卫。故选B。","p":"p2"},{"n":9,"t":"A1型","q":"感冒的基本病机为","pre":"","o":[["A","肺气上逆"],["B","寒温失调"],["C","邪犯肺卫，卫表不和"],["D","肺失宣降"],["E","肺气亏虚"]],"a":"C","x":"感冒的基本病机为邪犯肺卫，卫表不和。故选C。","p":"p2"},{"n":10,"t":"A1型","q":"下列不属于感冒常见临床表现的是","pre":"","o":[["A","恶寒发热"],["B","咽痒咽痛"],["C","鼻塞流涕"],["D","周身酸痛"],["E","呼吸困难"]],"a":"E","x":"感冒以卫表及鼻咽症状为主，可见恶风或恶寒、发热、鼻塞、流涕、喷嚏、咽痛、咽痒、周身酸楚不适等。呼吸困难不是感冒的常见临床表现。故选E。","p":"p1"},{"n":11,"t":"A1型","q":"感冒的治疗原则为","pre":"","o":[["A","辛温解表"],["B","辛凉解表"],["C","祛湿解表"],["D","益气解表"],["E","解表达邪"]],"a":"E","x":"感冒治疗遵《素问·阴阳应象大论》“其在皮者，汗而发之”之义，以解表达邪为治疗原则。故选E。","p":"p4"},{"n":12,"t":"A1型","q":"感冒风热犯表，其治法是","pre":"","o":[["A","清暑祛湿解表"],["B","辛温解表，宣肺散寒"],["C","辛凉解表，疏风清热"],["D","益气解表，调和营卫"],["E","滋阴解表"]],"a":"C","x":"感冒风热犯表，治法为辛凉解表，疏风清热。故选C。","p":"p5"},{"n":13,"t":"A1型","q":"阴虚感冒者，宜选用的方剂是","pre":"","o":[["A","加减葳蕤汤"],["B","沙参麦冬汤"],["C","参苏饮"],["D","新加香薷饮"],["E","左归丸"]],"a":"A","x":"阴虚感冒的代表方剂为加减葳蕤汤。故选A。","p":"p8"},{"n":14,"t":"A1型","q":"阳虚感冒者，治疗方选","pre":"","o":[["A","荆防败毒散"],["B","麻黄附子细辛汤"],["C","加减葳蕤汤"],["D","参苏饮"],["E","桂枝汤"]],"a":"B","x":"阳虚感冒的代表方剂为麻黄附子细辛汤。故选B。","p":"p7"},{"n":15,"t":"A1型","q":"新加香薷饮常适用于以下哪种感冒","pre":"","o":[["A","风热感冒"],["B","风寒感冒"],["C","暑湿感冒"],["D","气虚感冒"],["E","阴虚感冒"]],"a":"C","x":"暑湿感冒的代表方剂为新加香薷饮。故选C。","p":"p6"},{"n":16,"t":"A1型","q":"下列属于阳虚感冒典型脉象的是","pre":"","o":[["A","脉浮数"],["B","脉浮紧"],["C","脉细数"],["D","脉浮无力"],["E","脉沉细无力"]],"a":"E","x":"阳虚感冒的脉象多为沉细无力。故选E。","p":"p7"},{"n":17,"t":"A1型","q":"感冒与风温病早期的鉴别要点不包括","pre":"","o":[["A","是否容易传变"],["B","发热的热势高低"],["C","是否汗后热复"],["D","是否合并发热"],["E","是否合并神志改变"]],"a":"D","x":"风温病早期发热急骤，寒战发热甚至高热，汗出后热虽降，但脉数不静，身热旋即复起，而感冒发热一般不高或不发热，两者皆可有发热症状。故选D。","p":"p3"},{"n":18,"t":"A1型","q":"在感冒的辨治过程中，属于逆证的是","pre":"","o":[["A","流涕"],["B","咽痛"],["C","喘促"],["D","恶寒"],["E","鼻塞"]],"a":"C","x":"流涕、咽痛、恶寒、鼻塞均为感冒常见症状。故选C。","p":"p3"},{"n":19,"t":"A1型","q":"下列关于风寒感冒预防调护，叙述正确的是","pre":"","o":[["A","药物煎煮时间宜长"],["B","感冒之风寒表实需等药凉再服"],["C","服药后不宜进食热粥"],["D","覆被以促汗解表"],["E","汗后不要马上更换衣物"]],"a":"D","x":"使用中药解表药治疗感冒，煎煮时间宜短。感冒之风寒表实证，药物宜趁温热服，服药后进热粥以助药力，或覆被以促汗解表。汗后及时更换干燥洁净衣物，并应避风以免再次受邪。故选D。","p":"p9"},{"n":20,"t":"A2型","q":"患者，女，55岁。平素神疲体弱，经常感冒。近日自汗恶风，劳累尤甚，面色少华，鼻塞，咳嗽，气短，舌苔薄白，脉浮无力。其诊断是","pre":"","o":[["A","感冒，风寒束表"],["B","虚劳，脾气虚"],["C","自汗，肺卫不固"],["D","痞满，脾胃虚弱"],["E","气虚感冒"]],"a":"E","x":"气虚感冒临床表现为恶寒较甚，或并发热，鼻塞，流涕，气短，乏力，自汗，咳嗽，痰白，咳痰无力，平素神疲体弱，或易感冒，舌淡，苔薄白，脉浮无力。故选E。","p":"p7"},{"n":21,"t":"A2型","q":"患者，35岁。确诊为感冒，症见身热，微恶风寒，无汗，干咳少痰，头昏，心烦，口干，舌红少苔，脉细数。其证候类型为","pre":"","o":[["A","风寒束表"],["B","风热犯表"],["C","气虚感冒"],["D","阳虚感冒"],["E","阴虚感冒"]],"a":"E","x":"阴虚感冒临床表现为身热，微恶风寒，无汗或微汗或盗汗，干咳少痰，头昏，心烦，口干，甚则口渴，舌红少苔，脉细数。故选E。","p":"p8"},{"n":22,"t":"A2型","q":"患者在长夏病发感冒，症见身热不扬，头重如裹，肢体酸痛，胸闷脘痞，舌苔腻，考虑为感冒兼夹以下哪种病邪","pre":"","o":[["A","湿"],["B","暑"],["C","食"],["D","燥"],["E","风"]],"a":"A","x":"感冒夹湿多发生在长夏，表现为身热不扬，头重如裹，肢体酸痛，胸闷脘痞，舌苔腻等。故选A。","p":"p4"},{"n":23,"t":"A2型","q":"患者，男，46岁。起病3日，身热较著，微恶风，汗泄不畅，咳嗽，痰黄，咽痛，鼻塞，流黄稠涕，舌尖红，舌苔薄白干，脉浮数。其证候类型为","pre":"","o":[["A","风寒束表"],["B","风热犯表"],["C","风燥伤肺"],["D","暑湿伤表"],["E","风寒夹热"]],"a":"B","x":"风热犯表感冒临床表现为身热较著，微恶风，汗泄不畅，咽干甚则咽痛，鼻塞，流黄稠涕，头胀痛，咳嗽，痰黏或黄，口干欲饮，舌尖红，舌苔薄白干或薄黄，脉浮数。故选B。","p":"p5"},{"n":24,"t":"A2型","q":"患者恶寒重，发热轻，头痛，无汗，语声低微，四肢不温，舌质淡胖，苔白，脉沉细无力。治疗宜","pre":"","o":[["A","辛温解表"],["B","辛凉解表"],["C","滋阴解表"],["D","助阳解表"],["E","益气解表"]],"a":"D","x":"阳虚感冒临床表现为恶寒重，发热轻，头痛身痛，无汗，面色㿠白，语声低微，四肢不温，舌质淡胖，苔白，脉沉细无力。治宜助阳解表。故选D。","p":"p7"},{"n":25,"t":"A2型","q":"老年男性患者，来诊时发热，恶风，身热不扬，汗出不畅，肢体困重，头重如裹，纳呆，鼻塞，大便溏，小便短赤，舌苔白腻，脉濡数。治宜首选","pre":"","o":[["A","辛温解表"],["B","辛凉解表"],["C","祛湿解表"],["D","清暑祛湿解表"],["E","滋阴解表"]],"a":"D","x":"暑湿伤表感冒临床表现为发热，微恶风，身热不扬，汗出不畅，肢体困重或酸痛，头重如裹，胸闷脘痞，纳呆，鼻塞，流浊涕，心烦口渴，大便或溏，小便短赤，舌苔白腻或黄腻，脉濡数或滑。治宜清暑祛湿解表。故选D。","p":"p6"},{"n":26,"t":"A2型","q": ","阴虚感冒"]],"a":"E","x":"阴虚感冒临床表现为身热，微恶风寒，无汗或微汗或盗汗，干咳少痰，头昏，心烦，口干，甚则口渴，舌红少苔，脉细数。故选E。","p":"p8"},{"n":53,"t":"多选","q":"风热感冒常见的临床表现有","pre":"","o":[["A","恶寒重"],["B","汗泄不畅"],["C","咽干咽痛"],["D","鼻流清涕"],["E","痰黏或黄"]],"a":"BCE","x":"风热感冒临床表现为身热较著，微恶风，汗泄不畅，咽干甚则咽痛，鼻塞，流黄稠涕，头胀痛，咳嗽，痰黏或黄，口干欲饮。故选B、C、E。","p":"p5"},{"n":54,"t":"多选","q":"暑湿感冒的常见临床表现","pre":"","o":[["A","发热轻，恶寒重"],["B","身热不扬"],["C","汗出不畅"],["D","头重如裹"],["E","大便溏薄"]],"a":"BCDE","x":"暑湿感冒临床表现为发热，微恶风，身热不扬，汗出不畅，肢体困重或酸痛，头重如裹，胸闷脘痞，纳呆，鼻塞，流浊涕，心烦口渴，大便或溏，小便短赤。故选B、C、D、E。","p":"p6"},{"n":55,"t":"多选","q":"导致感冒的常见病邪有","pre":"","o":[["A","风"],["B","寒"],["C","火"],["D","湿"],["E","燥"]],"a":"ABCDE","x":"外感六淫邪气，均可引发感冒。故选A、B、C、D、E。","p":"p2"},{"n":56,"t":"多选","q":"感冒又称为","pre":"","o":[["A","伤风"],["B","冒风"],["C","冒寒"],["D","小伤寒"],["E","首风"]],"a":"ABCD","x":"感冒又有伤风、冒风、冒寒、小伤寒、重伤风之别名。故选A、B、C、D。","p":"p1"},{"n":57,"t":"多选","q":"下列属于感冒与风温鉴别要点的是","pre":"","o":[["A","热势高低"],["B","有无传变"],["C","病程长短"],["D","预后好坏"],["E","是否合并发热"]],"a":"ABCD","x":"风温发热急骤，寒战发热甚至高热，汗出后热虽降，但脉数不静，身热旋即复起，咳嗽胸痛，头痛较剧，甚至出现神志昏迷、惊厥、谵妄等传变入里的证候。而感冒发热一般不高或不发热，病势轻，不传变，服解表药后，多能汗出热退，脉静身凉，病程短，预后良好。故选A、B、C、D。","p":"p3"},{"n":58,"t":"多选","q":"感冒初起，表现为恶风、微热、头胀、鼻塞者，可予辛平轻剂以疏风解表，以下哪些药物可选","pre":"","o":[["A","桑叶"],["B","大黄"],["C","薄荷"],["D","防风"],["E","荆芥"]],"a":"ACDE","x":"感冒初起，表现为恶风、微热、头胀、鼻塞者，可予辛平轻剂以疏风解表，药用桑叶、薄荷、防风、荆芥穗等微辛轻清透邪之品。故选A、C、D、E。","p":"p4"}]},"04-02":{"name":"咳嗽","lecture":"4-2 咳嗽.pdf","points":[{"id":"p1","name":"概念·沿革·鉴别","teach":"<p><b>概念<\/b>：以发出咳声或伴咳痰为主症。有声无痰为咳，有痰无声为嗽。<\/p><table><thead><tr><th>医家/书<\/th><th>贡献<\/th><\/tr><\/thead><tbody><tr><td>《素问·咳论》<\/td><td><mark>五脏六腑皆令人咳，非独肺也<\/mark><\/td><\/tr><tr><td>张景岳《景岳全书》<\/td><td>分外感、内伤两大类<\/td><\/tr><tr><td>王纶《明医杂著》<\/td><td><mark>治法须分新久虚实<\/mark><\/td><\/tr><tr><td>喻嘉言《医门法律》<\/td><td>创清燥救肺汤<\/td><\/tr><\/tbody><\/table><p><b>鉴别<\/b>：肺痨 → 咳嗽+咯血、潮热、盗汗、消瘦，感染痨虫；肺胀 → 咳、痰、喘、胸部膨满、面色晦暗，多见老人，病程长。只有咳嗽咳痰、无这些特征 → 诊断咳嗽。<\/p>","src":"讲义 4-2 概述、历史沿革、鉴别诊断; 题库 #1 #2 #34 解析"},{"id":"p2","name":"病因病机","teach":"<ul><li><b>病因<\/b>：外感淫邪、饮食不节、情志内伤、肺脏自病（<mark>不含体虚病后、跌仆损伤<\/mark>）。<\/li><li>外感以<b>风<\/b>为先导，夹寒、热、燥，以风寒居多。<\/li><li><b>基本病机<\/b>：<mark>邪犯于肺，肺失宣肃，肺气上逆<\/mark>。病位在肺，涉及肝脾肾。<\/li><li>外感属邪实；内伤邪实正虚并见，病理因素主要为<mark>痰与火<\/mark>。<\/li><\/ul>","src":"讲义 4-2 病因、病机; 题库 #3 #4 #5 #6 #61 解析"},{"id":"p3","name":"辨证要点与治则","teach":"<p><b>首辨<\/b>：<mark>外感与内伤<\/mark>（景岳「止唯二证」）。外感新病、病势急、有表证、属邪实；内伤久病、反复、虚实夹杂。<\/p><table><thead><tr><th><\/th><th>外感<\/th><th>内伤<\/th><\/tr><\/thead><tbody><tr><td>证型<\/td><td>风寒袭肺、风热犯肺、风燥伤肺<\/td><td>痰湿蕴肺、痰热郁肺、肝火犯肺、肺阴亏虚<\/td><\/tr><tr><td>治则<\/td><td><b>祛邪利肺<\/b><\/td><td>邪实祛邪止咳，正虚扶正补虚<\/td><\/tr><tr><td>禁忌<\/td><td><mark>忌敛肺收涩<\/mark>（五味子、罂粟壳慎用，防敛邪留寇）<\/td><td>忌宣肺散邪<\/td><\/tr><\/tbody><\/table><p>注意：风燥伤肺属<b>外感<\/b>，不是内伤。<\/p>","src":"讲义 4-2 辨证要点、治则治法、临证要点; 题库 #7 #8 #9 #10 #62 解析"},{"id":"p4","name":"风寒 vs 风热犯肺","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>风寒袭肺<\/td><td>咳嗽声重，气急，咽痒，<mark>痰白清稀<\/mark>，鼻塞流清涕，恶寒无汗，苔薄白，脉浮紧<\/td><td>疏风散寒，宣肺止咳<\/td><td>三拗汤合止嗽散<\/td><\/tr><tr><td>风热犯肺<\/td><td>咳嗽频剧，气粗或咳声嘶哑，喉燥咽痛，<mark>咳痰不爽、痰黏稠或黄<\/mark>，流黄涕，口渴，苔薄黄，脉浮数<\/td><td>疏风清热，宣肺止咳<\/td><td>桑菊饮<\/td><\/tr><\/tbody><\/table><p>风寒加减：素有<b>寒饮伏肺<\/b>又兼风寒表证（痰清稀、苔白滑）→ 疏风散寒、温化寒饮，改用<mark>小青龙汤<\/mark>。风热咳嗽用桑菊饮，不是银翘散。<\/p>","src":"讲义 4-2 外感咳嗽（1）（2）; 题库 #11 #20 #21 #22 #27 #29 #30 #36-#39 #54 #55 解析"},{"id":"p5","name":"风燥伤肺（温/凉燥）","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>风燥伤肺（温燥）<\/td><td><mark>干咳无痰或痰少而黏、不易咯出<\/mark>，或痰中带血丝，咽喉干痛，口鼻干燥，身热头痛，舌尖红，苔薄白或薄黄而干，脉浮数或小数<\/td><td>疏风清肺，润燥止咳<\/td><td>桑杏汤<\/td><\/tr><tr><td>凉燥<\/td><td>干咳少痰，咽干鼻燥，兼<mark>恶寒无汗<\/mark>，苔薄白而干<\/td><td>温而不燥，润而不凉<\/td><td>杏苏散<\/td><\/tr><\/tbody><\/table><p>温燥重证（气逆而喘、心烦口渴）→ 清燥救肺汤。多见于秋季。<\/p>","src":"讲义 4-2 外感咳嗽（3）; 题库 #13 #18 #19 #25 #28 #32 #40 #41 #52 #58 解析"},{"id":"p6","name":"痰湿 vs 痰热","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰湿蕴肺<\/td><td>反复发作，<mark>咳声重浊<\/mark>，痰出咳缓，痰多色白黏腻或稠厚成块，<b>晨起或食后<\/b>咳甚，胸闷脘痞，便溏，苔白腻，脉濡滑<\/td><td>燥湿化痰，理气止咳<\/td><td>二陈平胃散合三子养亲汤<\/td><\/tr><tr><td>痰热郁肺<\/td><td>咳嗽<mark>气粗，喉中有痰声<\/mark>，痰多黄稠或黏厚，咳吐不爽，或热腥味、血丝，胸胁胀满咳时引痛，面赤口干，苔薄黄腻，脉滑数<\/td><td>清热化痰，肃肺止咳<\/td><td>清金化痰汤<\/td><\/tr><\/tbody><\/table><p>痰热证机：痰热壅肺，肺失肃降。清热化痰药可选浙贝母、瓜蒌、鱼腥草、鲜竹沥（白附子不用）。<\/p>","src":"讲义 4-2 内伤咳嗽（1）（2）; 题库 #12 #14 #23 #31 #33 #47-#50 #53 #56 #57 #59 #63 #64 解析"},{"id":"p7","name":"肝火犯肺证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝火犯肺<\/td><td>上气咳逆阵作，<b>咳时面红目赤<\/b>，咳引胸胁痛，咽干口苦，痰滞咽喉难咯、量少质黏，<mark>随情绪波动增减<\/mark>，舌红苔薄黄少津，脉弦数<\/td><td>清肺泻肝，化痰止咳<\/td><td>黛蛤散合加减泻白散<\/td><\/tr><\/tbody><\/table><p>证机：<b>肝郁化火，上逆侮肺<\/b>。和痰热郁肺比：痰热是痰多黄稠、脉滑数；肝火是痰少难咯、脉弦数、跟情绪走。<\/p>","src":"讲义 4-2 内伤咳嗽（3）; 题库 #15 #35 #42 #43 #44 #60 解析"},{"id":"p8","name":"肺阴亏虚证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肺阴亏虚<\/td><td>干咳，<mark>咳声短促<\/mark>，痰少质黏色白或带血丝，声音渐哑，口干咽燥，<mark>午后潮热，颧红盗汗<\/mark>，消瘦神疲，舌红少苔，脉细数<\/td><td>养阴清热，润肺止咳<\/td><td>沙参麦冬汤<\/td><\/tr><\/tbody><\/table><p>和风燥伤肺<b>共同点<\/b>：痰少质黏或痰中带血丝。区别：风燥是新病、有表证、脉浮；肺阴亏虚是久病、潮热盗汗、脉细数。<\/p><p>注：讲义治法写「滋阴清肺」，题库按十四五写「养阴清热，润肺止咳」，以题库为准。<\/p>","src":"讲义 4-2 内伤咳嗽（4）; 题库 #16 #17 #24 #26 #45 #46 #51 解析（治法措辞以题库为准）"}],"q":[{"n":1,"t":"A1型","q":"提出“五脏六腑皆令人咳，非独肺也”的著作是","pre":"","o":[["A","《丹溪心法》"],["B","《黄帝内经》"],["C","《医学心悟》"],["D","《景岳全书》"],["E","《伤寒论》"]],"a":"B","x":"《素问·咳论》对咳嗽病因的认识里面提到了“五脏六腑皆令人咳，非独肺也”。故选B。","p":"p1"},{"n":2,"t":"A1型","q":"提出咳嗽的治法须分新久虚实的医家是","pre":"","o":[["A","张仲景"],["B","张子和"],["C","叶天士"],["D","张介宾"],["E","王纶"]],"a":"E","x":"明·王纶《明医杂著·咳嗽》提出咳嗽的治法须分新久虚实。故选E。","p":"p1"},{"n":3,"t":"A1型","q":"外感咳嗽常以何种病邪为先导","pre":"","o":[["A","风"],["B","寒"],["C","暑"],["D","湿"],["E","燥"]],"a":"A","x":"风为六淫之首，易夹其他外邪侵袭人体，因此外感咳嗽常以风为先导，表现为风寒、风热、风燥等相合为病，但以风寒袭肺者居多。故选A。","p":"p2"},{"n":4,"t":"A1型","q":"下列不属于咳嗽常见病因的是","pre":"","o":[["A","外感淫邪"],["B","饮食不节"],["C","情志内伤"],["D","肺脏自病"],["E","体虚病后"]],"a":"E","x":"咳嗽按病因分外感咳嗽和内伤咳嗽两大类。外感咳嗽为六淫外邪侵袭肺系；内伤咳嗽为脏腑功能失调，内邪干肺。病因主要有外感淫邪、饮食不节、情志内伤、肺脏自病。故选E。","p":"p2"},{"n":5,"t":"A1型","q":"咳嗽的基本病机是","pre":"","o":[["A","外感邪气，卫表不和"],["B","邪犯于肺，肺失宣肃，肺气上逆"],["C","脾气虚弱，痰浊蕴肺，肺气上逆"],["D","肝火上炎，肺失肃降，肺气上逆"],["E","肺脏自病，肺气上逆"]],"a":"B","x":"咳嗽的基本病机为邪犯于肺，肺失宣肃，肺气上逆作咳。故选B。","p":"p2"},{"n":6,"t":"A1型","q":"内伤咳嗽的病理因素有痰、湿、饮、火、虚等，其中主要是","pre":"","o":[["A","痰与湿"],["B","痰与火"],["C","痰与瘀"],["D","痰与饮"],["E","湿与虚"]],"a":"B","x":"内伤咳嗽，属邪实与正虚并见，病理因素主要为“痰”与“火”。故选B。","p":"p2"},{"n":7,"t":"A1型","q":"咳嗽辨证，首先应辨","pre":"","o":[["A","寒热"],["B","虚实"],["C","外感、内伤"],["D","上下"],["E","阴阳"]],"a":"C","x":"张景岳《景岳全书·咳嗽》指出：“以余观之，则咳嗽之要，止唯二证，何为二证？一曰外感，一曰内伤，而尽之矣。”执简驭繁地将咳嗽分为外感和内伤两大类，为后世医家所尊崇。咳嗽的辨证首先应辨外感与内伤。故选C。","p":"p3"},{"n":8,"t":"A1型","q":"外感咳嗽的治疗原则是","pre":"","o":[["A","疏风散寒"],["B","解表发汗"],["C","调和营卫"],["D","祛邪利肺"],["E","辛温解表"]],"a":"D","x":"外感咳嗽，多为实证，按病邪性质多以风寒、风热、风燥为主，治应祛邪利肺为主，邪去则正安。故选D。","p":"p3"},{"n":9,"t":"A1型","q":"外感咳嗽，应慎用","pre":"","o":[["A","麻黄、杏仁"],["B","桑叶、菊花"],["C","桔梗、前胡"],["D","五味子、罂粟壳"],["E","金沸草、陈皮"]],"a":"D","x":"外感咳嗽一般忌敛邪留寇，五味子收敛固涩，罂粟壳敛肺止咳，均为外感咳嗽治疗中慎用之品。故选D。","p":"p3"},{"n":10,"t":"A1型","q":"下列不属于内伤咳嗽证候类型的是","pre":"","o":[["A","痰湿蕴肺"],["B","痰热郁肺"],["C","肝火犯肺"],["D","风燥伤肺"],["E","肺阴亏虚"]],"a":"D","x":"内伤咳嗽分为痰湿蕴肺、痰热郁肺、肝火犯肺、肺阴亏虚，风燥伤肺属外感范畴。故选D。","p":"p3"},{"n":11,"t":"A1型","q":"治疗咳嗽风寒袭肺的代表方剂为","pre":"","o":[["A","麻黄汤"],["B","二陈平胃散合三子养亲汤加减"],["C","三拗汤合止嗽散加减"],["D","小青龙汤"],["E","桑菊饮"]],"a":"C","x":"咳嗽风寒袭肺，治宜疏风散寒，宣肺止咳，代表方剂为三拗汤合止嗽散加减。故选C。","p":"p4"},{"n":12,"t":"A1型","q":"咳嗽痰湿蕴肺的常见临床表现为","pre":"","o":[["A","咳声重浊，痰黄量少"],["B","咳声气促，痰多质黏"],["C","咳声重浊，痰多色白"],["D","咳嗽频剧，痰少而黏"],["E","咳嗽气粗，痰黄稠厚"]],"a":"C","x":"咳嗽痰湿蕴肺可见咳嗽反复发作，咳声重浊，因痰而嗽，痰出则咳缓，痰多色白，黏腻或稠厚成块，每于晨起或食后咳甚痰多等。故选C。","p":"p6"},{"n":13,"t":"A1型","q":"治疗温燥咳嗽的代表方剂是","pre":"","o":[["A","杏苏散"],["B","桑杏汤"],["C","止嗽散"],["D","清金化痰汤"],["E","桑菊饮"]],"a":"B","x":"治疗温燥咳嗽宜疏风清肺，润燥止咳，代表方剂为桑杏汤。故选B。","p":"p5"},{"n":14,"t":"A1型","q":"二陈平胃散合三子养亲汤加减是治疗何种咳嗽的代表方","pre":"","o":[["A","痰湿蕴肺"],["B","痰热郁肺"],["C","肝火犯肺"],["D","风燥伤肺"],["E","肺阴亏虚"]],"a":"A","x":"治疗咳嗽痰湿蕴肺的代表方剂为二陈平胃散合三子养亲汤。故选A。"
