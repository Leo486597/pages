腰酸"]],"a":"D","x":"心血瘀阻证见心悸不安，胸闷不舒，心痛时作，痛如针刺，唇甲青紫，舌质紫暗或有瘀斑，脉涩或结或代。故选D。","p":"p8"},{"n":56,"t":"B型","q":"热病后期损及心阴而心悸者，其治疗方宜","pre":"","o":[["A","归脾汤加炮附子、煅龙骨、煅牡蛎"],["B","归脾汤加合欢皮、夜交藤、莲子心"],["C","归脾汤合生脉散加减"],["D","归脾汤加肉桂、黄连、白术"],["E","归脾汤加陈皮、神曲、山楂"]],"a":"C","x":"热病后期损及心阴者，可加生脉散养阴。故选C。","p":"p5"},{"n":57,"t":"B型","q":"心悸心血不足证，若兼有失眠、多梦者，其治疗方宜","pre":"","o":[["A","归脾汤加炮附子、煅龙骨、煅牡蛎"],["B","归脾汤加合欢皮、夜交藤、莲子心"],["C","归脾汤合生脉散加减"],["D","归脾汤加肉桂、黄连、白术"],["E","归脾汤加陈皮、神曲、山楂"]],"a":"B","x":"失眠多梦，加合欢皮、夜交藤、五味子、柏子仁、莲子心等安神。故选B。","p":"p5"},{"n":58,"t":"多选","q":"张仲景《伤寒杂病论》中认为心悸的病因包括","pre":"","o":[["A","水饮"],["B","火邪"],["C","虚劳"],["D","惊扰"],["E","汗后受邪"]],"a":"ACDE","x":"东汉·张仲景的《金匮要略·惊悸吐衄下血胸满瘀血病脉证治》和《伤寒论·辨太阳病脉证并治》，称心悸为“心动悸”“心下悸”“心中悸”及“惊悸”等，并认为其主要病因有惊扰、水饮、虚劳及汗后受邪等。故选A、C、D、E。","p":"p9"},{"n":59,"t":"多选","q":"心悸的发生与下列哪些病理因素有关","pre":"","o":[["A","虚"],["B","瘀"],["C","火"],["D","痰"],["E","饮"]],"a":"ABCDE","x":"心悸的发生多因体虚劳倦、七情所伤、感受外邪及药食不当等，以致气血阴阳亏损，心神失养，心主不安，或痰、饮、火、瘀阻滞心脉，扰乱心神。故选A、B、C、D、E。","p":"p2"},{"n":60,"t":"多选","q":"心悸水饮凌心证的常见临床表现包括","pre":"","o":[["A","形寒肢冷"],["B","心悸眩晕"],["C","胸闷痞满"],["D","小便短少"],["E","恶心欲吐"]],"a":"BCDE","x":"心悸水饮凌心证的常见临床表现为心悸眩晕，胸闷痞满，渴不欲饮，小便短少，或下肢浮肿，形寒肢冷，伴恶心，欲吐，流涎，舌淡胖，苔白滑，脉弦滑或沉细而滑。A为心阳不振证的常见临床表现。故选B、C、D、E。","p":"p7"},{"n":61,"t":"多选","q":"下列属于心悸阴虚火旺证常见临床表现的是","pre":"","o":[["A","心悸易惊"],["B","心烦失眠"],["C","口干，盗汗"],["D","耳鸣腰酸"],["E","舌红少津，脉细数"]],"a":"ABCDE","x":"心悸阴虚火旺证的主要症状为心悸易惊，心烦失眠，五心烦热，口干，盗汗，思虑劳心则症状加重，伴耳鸣腰酸，头晕目眩，急躁易怒，舌红少津，苔少或无，脉细数。故选A、B、C、D、E。","p":"p6"},{"n":62,"t":"多选","q":"下列属于心悸实证常用治法的是","pre":"","o":[["A","行气祛瘀"],["B","清心泻火"],["C","化痰逐饮"],["D","消食化滞"],["E","疏邪解表"]],"a":"ABC","x":"在心悸的治疗上，虚证者，或补气血之不足，或调阴阳之盛衰，以求气血调和，阴平阳秘，心神得养；实证者，或行气祛瘀，或清心泻火，或化痰逐饮，使邪去正安，心神得宁。故选A、B、C。","p":"p4"}]},"05-02":{"name":"胸痹","lecture":"5-2 胸痹.pdf","points":[{"id":"p1","name":"主症、真心痛与鉴别","teach":"<p>胸痹 = <b>胸部闷痛，甚则胸痛彻背，喘息不得卧<\/b>。轻者胸闷如窒；重者胸痛；严重者心痛彻背，背痛彻心。痛在膻中或心前区，可放射至<b>左肩背<\/b>、咽喉、胃脘、左上臂内侧；持续几秒到几十分钟，休息或服药可缓解。<\/p><p><b>真心痛<\/b>：胸痹进一步发展的重证，剧烈而持久的胸骨后痛，<b>难以缓解<\/b>，伴心悸、喘促、肢冷、汗出、面色苍白，可危及生命。<\/p><table><thead><tr><th>病<\/th><th>痛<\/th><th>特点<\/th><\/tr><\/thead><tbody><tr><td>胸痹<\/td><td>胸部闷痛，放射左肩背<\/td><td>历时短，休息或服药缓解，伴心悸气短<\/td><\/tr><tr><td>悬饮<\/td><td><mark>胸胁胀痛，持续不解<\/mark><\/td><td>转侧、呼吸时加重，肋间饱满，咳嗽咯痰<\/td><\/tr><tr><td>胃脘痛<\/td><td>胃脘胀痛，局部压痛<\/td><td>持续较长，伴泛酸、嘈杂、嗳气<\/td><\/tr><\/tbody><\/table>","src":"讲义 5-2 概述、诊断、鉴别诊断; 题库 #4 #9 #41 #54 #55 #64 #67 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：寒邪内侵、饮食不节、情志失调、劳倦内伤、年迈体虚（药物中毒不是）。<b>诱因<\/b>：劳累、寒冷、饱食、情绪波动。<\/p><p><b>基本病机：心脉痹阻<\/b>。病位在心，涉及肝、肺、脾、肾。<\/p><p>总属<b>本虚标实<\/b>：<\/p><ul><li>本虚：气虚、气阴两虚、阳气虚衰<\/li><li>标实：血瘀、寒凝、痰浊、气滞，可相兼为病<\/li><li>火邪不属胸痹常见病理因素（题库）<\/li><\/ul><p>真心痛：其位在心，<b>其本在肾<\/b>，本虚标实。<\/p>","src":"讲义 5-2 病因、病机; 题库 #5 #6 #8 #65 #66 解析。讲义标实另列热蕴，#6 从题库"},{"id":"p3","name":"辨证要点与治则","teach":"<p><b>首辨病情轻重<\/b>，再辨标本虚实。<\/p><ul><li>轻：痛瞬息即逝；重：持续时间长、反复发作；数小时甚至数日不休为重症<\/li><li>遇劳发作，休息或服药能缓解 → 顺证；<b>服药后难以缓解 → 危候<\/b><\/li><li>心胸隐痛而闷、劳累而发、气短乏力 → 气虚（虚证）<\/li><\/ul><p><b>治则<\/b>：先治标，后治本。标实当泻（理气、活血、温阳、豁痰），<b>尤重活血通脉<\/b>；本虚宜补，<b>尤重补益心气<\/b>。见脱证先兆早用益气固脱。<\/p>","src":"讲义 5-2 辨证要点、治则治法; 题库 #7 #10 #11 #12 #13 解析。讲义先列辨标本虚实，#7 解析为首辨病情轻重，从题库"},{"id":"p4","name":"心血瘀阻 vs 气滞心胸","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>心血瘀阻<\/td><td>心胸痛<mark>如刺如绞，痛有定处<\/mark>，入夜为甚，甚则痛彻肩背，舌紫暗有瘀斑，脉弦涩<\/td><td>活血化瘀，通脉止痛<\/td><td>血府逐瘀汤<\/td><\/tr><tr><td>气滞心胸<\/td><td>心胸满闷，隐痛阵发，<mark>痛无定处<\/mark>，时欲太息，情志不遂诱发，嗳气则舒，苔薄腻，脉细弦<\/td><td>疏肝理气，活血通络<\/td><td>柴胡疏肝散<\/td><\/tr><\/tbody><\/table><ul><li>气滞兼血瘀（舌紫暗、脉弦涩）→ 柴胡疏肝散合<b>失笑散<\/b><\/li><li>气郁化火（心烦易怒、口干便秘、舌红苔黄、脉弦数）→ <b>丹栀逍遥散<\/b>（加味逍遥散）<\/li><li>血瘀兼气虚（气短乏力自汗）→ <b>人参养营汤合桃红四物汤<\/b>，重用人参、黄芪<\/li><\/ul>","src":"讲义 5-2 证治 1、2; 题库 #15 #16 #21 #22 #29 #31-33 #35 #42 #43 #51 #57 解析"},{"id":"p5","name":"痰浊闭阻证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰浊闭阻<\/td><td><mark>胸闷重而心痛微<\/mark>，形体肥胖，痰多气短，遇阴雨天加重，倦怠纳呆便溏，舌胖有齿痕，苔浊腻或白滑，脉滑<\/td><td>通阳泄浊，豁痰宣痹<\/td><td>栝蒌薤白半夏汤合涤痰汤<\/td><\/tr><\/tbody><\/table><p>线索：肥胖 + 阴雨天加重 + 苔腻脉滑。<\/p><p>痰浊郁而化热（口干口苦）→ 黄连温胆汤；痰热加海浮石、栀子、天竺黄、竹沥。<\/p>","src":"讲义 5-2 证治 3; 题库 #26 #30 #58 解析"},{"id":"p6","name":"寒凝心脉 vs 心肾阳虚","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>寒凝心脉<\/td><td>猝然心痛如绞，心痛彻背，<mark>遇寒或气候骤冷诱发<\/mark>，形寒，手足不温，冷汗，脉沉紧<\/td><td>辛温散寒，宣通心阳<\/td><td>枳实薤白桂枝汤合当归四逆汤<\/td><\/tr><tr><td>心肾阳虚<\/td><td>心悸而痛，胸闷气短，<mark>动则更甚<\/mark>，自汗，面色㿠白，神倦怯寒，舌淡胖，脉沉细迟<\/td><td>温补阳气，振奋心阳<\/td><td>参附汤合右归饮<\/td><\/tr><\/tbody><\/table><ul><li>阴寒极盛：痛无休止，身寒肢冷，气短喘息，脉沉紧或沉微 → <b>乌头赤石脂丸<\/b><\/li><li>痛剧、四肢不温、冷汗自出 → 即刻舌下含<b>苏合香丸或麝香保心丸<\/b><\/li><li>阳虚欲脱厥逆（冷汗淋漓、四肢厥冷、脉疾数无力）→ <b>四逆加人参汤<\/b>或参附注射液<\/li><\/ul>","src":"讲义 5-2 证治 4、7; 题库 #17 #19 #23 #25 #27 #28 #36 #39 #40 #47-50 #59-61 解析"},{"id":"p7","name":"气阴两虚 vs 心肾阴虚","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>气阴两虚<\/td><td>心胸<mark>隐痛，时作时休<\/mark>，心悸气短，动则尤甚，易汗，舌淡红胖有齿痕，脉虚细缓或结代<\/td><td>益气养阴，活血通脉<\/td><td>生脉散合人参养荣汤<\/td><\/tr><tr><td>心肾阴虚<\/td><td>心痛憋闷，心悸盗汗，虚烦不寐，<mark>腰膝酸软、头晕耳鸣<\/mark>，口干便秘，舌红少津，脉细数<\/td><td>滋阴清火，养心和络<\/td><td>天王补心丹合炙甘草汤<\/td><\/tr><\/tbody><\/table><ul><li>心肾阴虚较甚（遗精盗汗、腰膝酸软、头晕目眩）→ <b>左归饮<\/b><\/li><li>虚烦不寐、舌尖红少津 → 酸枣仁汤<\/li><li>气阴两虚兼气滞血瘀加川芎、郁金；兼痰浊加茯苓、白术、白蔻仁<\/li><\/ul>","src":"讲义 5-2 证治 5、6; 题库 #14 #18 #24 #34 #37 #38 #44-46 #52 #53 #56 #68 解析"},{"id":"p8","name":"出处与预防调护","teach":"<ul><li>《灵枢·厥病》<b>真心痛<\/b>：手足青至节，心痛甚，旦发夕死，夕发旦死<\/li><li>张仲景《金匮要略》<b>正式提出胸痹病名<\/b>并设专篇；病机归纳为<b>阳微阴弦<\/b>（胸阳不振，阴寒凝结）<\/li><li>王清任《医林改错》：血府逐瘀汤治胸痹心痛<\/li><\/ul><p>预防调护：<b>避免情绪波动<\/b>；寒温适宜；饮食清淡低盐，食勿过饱，保持大便通畅，戒烟酒；劳逸结合；发作期立即卧床休息。<\/p>","src":"讲义 5-2 历史沿革、预防调护; 题库 #1 #2 #3 #20 #62 #63 解析"}],"q":[{"n":1,"t":"A1型","q":"正式提出“胸痹”病名，并设专篇讨论的医著是","pre":"","o":[["A","《黄帝内经》"],["B","《五十二病方》"],["C","《金匮要略》"],["D","《世医得效方》"],["E","《证治准绳》"]],"a":"C","x":"东汉·张仲景《金匮要略》正式提出“胸痹”病名，并作专篇论述。故选C。","p":"p8"},{"n":2,"t":"A1型","q":"把心痛严重并迅速造成死亡者称为“真心痛”的著作是","pre":"","o":[["A","《黄帝内经》"],["B","《五十二病方》"],["C","《金匮要略》"],["D","《太平惠民和剂局方》"],["E","《证治准绳》"]],"a":"A","x":"《灵枢·厥病》曰：“真心痛，手足青至节，心痛甚，旦发夕死，夕发旦死。”故选A。","p":"p8"},{"n":3,"t":"A1型","q":"“真心痛，手足青至节，心痛甚，旦发夕死，夕发旦死。”出自","pre":"","o":[["A","《黄帝内经》"],["B","《金匮要略》"],["C","《太平圣惠方》"],["D","《玉机微义》"],["E","《医林改错》"]],"a":"A","x":"《灵枢·厥病》曰：“真心痛，手足青至节，心痛甚，旦发夕死，夕发旦死。”故选A。","p":"p8"},{"n":4,"t":"A1型","q":"胸痹发作时，最常见疼痛放射至","pre":"","o":[["A","右胸"],["B","左肩背"],["C","左胁下"],["D","右胁下"],["E","背正中"]],"a":"B","x":"胸痹以胸部闷痛为主症，患者多见膻中或心前区憋闷疼痛，甚则痛彻左肩背、咽喉、胃脘部、左上臂内侧等部位。故选B。","p":"p1"},{"n":5,"t":"A1型","q":"胸痹的基本病机为","pre":"","o":[["A","气滞血瘀"],["B","寒凝气滞"],["C","痰瘀交阻"],["D","阳气虚衰"],["E","心脉痹阻"]],"a":"E","x":"胸痹的基本病机为心脉痹阻。故选E。","p":"p2"},{"n":6,"t":"A1型","q":"下列不属于胸痹常见病理因素的是","pre":"","o":[["A","气滞"],["B","痰浊"],["C","血瘀"],["D","寒凝"],["E","火邪"]],"a":"E","x":"胸痹总属本虚标实，本虚有气虚、气阴两虚及阳气虚衰，标实有血瘀、寒凝、痰浊、气滞，且可相兼为病。故选E。","p":"p2"},{"n":7,"t":"A1型","q":"胸痹的辨证，应首辨","pre":"","o":[["A","脉象变化"],["B","外感内伤"],["C","标本虚实"],["D","病情轻重"],["E","寒热虚实"]],"a":"D","x":"胸痹的辨证，首先辨病情轻重，其次辨标本虚实。故选D。","p":"p3"},{"n":8,"t":"A1型","q":"真心痛的发病基础是本虚，其位在心，其本在","pre":"","o":[["A","肾"],["B","心"],["C","脾"],["D","肺"],["E","肝"]],"a":"A","x":"真心痛的发病基础是本虚，其位在心，其本在肾，总的病机为本虚标实。故选A。","p":"p2"},{"n":9,"t":"A1型","q":"下面不属于真心痛常见临床表现的是","pre":"","o":[["A","心胸猝然剧痛"],["B","持续时间较长"],["C","含硝酸甘油后立即缓解"],["D","四肢厥冷"],["E","冷汗淋漓"]],"a":"C","x":"真心痛是胸痹进一步发展的严重病证，其特点为剧烈而持久的胸骨后疼痛，难以缓解，伴心悸、喘促、肢冷、汗出、面色苍白等症状，甚至可危及生命。故选C。","p":"p1"},{"n":10,"t":"A1型","q":"胸痹总属本虚标实，本虚当补，根据气血阴阳之不足，补法中尤需重视","pre":"","o":[["A","温阳健脾"],["B","补益心气"],["C","益肾纳气"],["D","养阴柔肝"],["E","补肺润燥"]],"a":"B","x":"胸痹之本虚宜补，权衡心之阴阳气血之不足，有无兼见肺、肝、脾、肾等脏之亏虚，补气温阳，滋阴益肾，纠正脏腑阴阳气血之偏衰，其中尤其重视补益心气之不足。故选B。","p":"p3"},{"n":11,"t":"A1型","q":"胸痹疼痛，服药后难以缓解者，常为","pre":"","o":[["A","轻症"],["B","顺症"],["C","缓症"],["D","危症"],["E","以上皆非"]],"a":"D","x":"疼痛遇劳发作，休息或服药后可缓解者，多为顺证；服药后难以缓解者，常为危候。故选D。","p":"p3"},{"n":12,"t":"A1型","q":"下列属于虚证胸痛常见临床表现的是","pre":"","o":[["A","心胸隐痛而闷"],["B","闷重而痛轻"],["C","胸痛如绞，遇寒加剧"],["D","胸部窒闷而痛"],["E","刺痛固定不移"]],"a":"A","x":"心胸隐痛而闷，多因劳累而发，伴气短，乏力，神疲懒言，舌暗淡或胖大，边有齿痕者，多属气虚。故选A。","p":"p3"},{"n":13,"t":"A1型","q":"下列属于胸痹实证常用治法的是","pre":"","o":[["A","益气固脱"],["B","活血化瘀"],["C","补气温阳"],["D","滋阴益肾"],["E","补益心气"]],"a":"B","x":"胸痹发作期以标实为主，缓解期以本虚为主。标实当泻，针对气滞、血瘀、寒凝、痰浊分别使用理气、活血、温阳、豁痰之法，尤重活血通脉。故选B。","p":"p3"},{"n":14,"t":"A1型","q":"胸痹气阴两虚的常见临床表现为","pre":"","o":[["A","心胸隐痛"],["B","心痛憋闷"],["C","心痛彻背"],["D","胸闷重而心痛微"],["E","心痛如绞"]],"a":"A","x":"胸痹气阴两虚多表现为心胸隐痛，时作时休。故选A。","p":"p7"},{"n":15,"t":"A1型","q":"治疗胸痹气滞心胸证，首选的方剂是","pre":"","o":[["A","柴胡疏肝散"],["B","天王补心丹"],["C","逍遥散"],["D","枳实薤白桂枝汤"],["E","生脉散"]],"a":"A","x":"柴胡疏肝散有疏肝理气、活血通络之效。故选A。","p":"p4"},{"n":16,"t":"A1型","q":"关于胸痹心血瘀阻证的常见临床表现，正确的是","pre":"","o":[["A","胸闷重而心痛轻"],["B","患者往往肥胖体沉"],["C","痰多气短"],["D","遇阴雨天易发或加重"],["E","痛有定处，如刺如绞"]],"a":"E","x":"胸痹心血瘀阻证多表现为痛有定处，如刺如绞，入夜为甚，甚则心痛彻背，背痛彻心，或痛引肩背。故选E。","p":"p4"},{"n":17,"t":"A1型","q":"阴寒极盛之胸痹重症，心痛彻背，背痛彻心者，治疗应首选","pre":"","o":[["A","瓜蒌薤白白酒汤"],["B","瓜蒌薤白半夏汤"],["C","薏苡附子散"],["D","乌头汤"],["E","乌头赤石脂丸"]],"a":"E","x":"心痛彻背，背痛彻心，痛无休止，身寒肢冷，气短喘息，脉沉紧或沉微者，属阴寒极盛之胸痹重症，用乌头赤石脂丸加荜茇、高良姜、细辛等。故选E。","p":"p6"},{"n":18,"t":"A1型","q":"治疗胸痹心肾阴虚证应首选","pre":"","o":[["A","参附汤合黑锡丹加减"],["B","柴胡疏肝散合补中益气汤加减"],["C","天王补心丹合炙甘草汤加减"],["D","生脉散合保元汤加减"],["E","当归四逆汤合生脉散加减"]],"a":"C","x":"治疗胸痹心肾阴虚证的代表方剂为天王补心丹合炙甘草汤加减。故选C。","p":"p7"},{"n":19,"t":"A1型","q":"下列哪项为胸痹寒凝心脉证的主要特征","pre":"","o":[["A","胸部刺痛，固定不移"],["B","胸痛彻背，感寒痛甚"],["C","胸痛灼热，烦闷不适"],["D","胸中闷痛，心悸不宁"],["E","胸痛咳喘，烦闷发热"]],"a":"B","x":"胸痛如绞，遇寒则发，心痛彻背，喘不得卧，或得冷加剧，伴畏寒肢冷，苔薄白，脉沉紧或沉细者，多属寒凝。故选B。","p":"p6"},{"n":20,"t":"A1型","q":"下列关于胸痹预防调护的叙述，正确的是","pre":"","o":[["A","发作期患者可以适当活动"],["B","缓解期患者应禁止一切活动"],["C","不必注意饮食调节"],["D","缓解期可饮酒"],["E","避免情绪波动"]],"a":"E","x":"发作期患者应立即卧床休息，缓解期要注意适当休息，劳逸结合；胸痹患者应注意饮食调节，宜清淡低盐，食勿过饱，多吃水果及富含纤维素食物，保持大便通畅；戒烟戒酒；注意调摄精神，避免情绪波动。故选E。","p":"p8"},{"n":21,"t":"A2型","q":"刘某，女，46岁。平素性格忧郁，有“高血压病”病史。某日与邻居发生口角后即自觉心痛阵发，心胸胀闷，嗳气频作，苔薄，脉弦细。治宜选用","pre":"","o":[["A","柴胡疏肝散"],["B","丹栀逍遥散"],["C","当归四逆汤"],["D","瓜蒌薤白半夏汤"],["E","甘麦大枣汤"]],"a":"A","x":"患者因情绪激动诱发，伴有心胸胀闷、嗳气频作、脉弦细等临床表现，属胸痹气滞心胸证。故选A。","p":"p4"},{"n":22,"t":"A2型","q":"患者，男，55岁。心胸疼痛剧烈，如刺如绞， {"n":63,"t":"B型","q":"把胸痹的病因病机高度总结，归纳为“阳微阴弦”的著作是","pre":"","o":[["A","《黄帝内经》"],["B","《神农本草经》"],["C","《医林改错》"],["D","《金匮要略》"],["E","《太平圣惠方》"]],"a":"D","x":"东汉·张仲景《金匮要略》正式提出“胸痹”病名，并把胸痹的病因病机归纳为“阳微阴弦”，即胸阳不振，阴寒凝结，为本虚标实之证。故选D。","p":"p8"},{"n":64,"t":"多选","q":"胸痹疼痛的放射部位可见于","pre":"","o":[["A","肩部"],["B","咽喉"],["C","胃脘部"],["D","左上臂内侧"],["E","背部"]],"a":"ABCDE","x":"胸部憋闷疼痛，甚则痛彻左肩背、咽喉、胃脘部、左上臂内侧等部位。故选A、B、C、D、E。","p":"p1"},{"n":65,"t":"多选","q":"胸痹心痛的主要病因包括","pre":"","o":[["A","年老体虚"],["B","情志失调"],["C","寒邪内侵"],["D","药物中毒"],["E","饮食不节"]],"a":"ABCE","x":"药物中毒不是胸痹的主要病因。故选A、B、C、E。","p":"p2"},{"n":66,"t":"多选","q":"胸痹发作的常见诱因有","pre":"","o":[["A","劳累"],["B","饱餐"],["C","寒冷"],["D","情绪激动"],["E","年老体虚"]],"a":"ABCD","x":"过度劳累、寒冷、饱食、情绪波动等可诱发胸痹，","p":"p2"},{"n":67,"t":"多选","q":"真心痛的临床表现包括","pre":"","o":[["A","心胸猝然剧痛"],["B","持续时间较长"],["C","脉微细或结代"],["D","四肢厥冷"],["E","冷汗淋漓"]],"a":"ABCDE","x":"真心痛，是胸痹进一步发展的严重病证，其特点为剧烈而持久的胸骨后疼痛，伴心悸、喘促、肢冷、汗出、面色苍白等症状。故选A、B、C、D、E。","p":"p1"},{"n":68,"t":"多选","q":"患者胸闷隐痛，时作时止，心悸气短，动则尤甚，伴神疲懒言，易汗，手足心热，舌淡红，有齿痕，苔少，脉结代。治疗应首选","pre":"","o":[["A","生脉散"],["B","天王补心丹"],["C","血府逐瘀汤"],["D","人参养营汤"],["E","瓜蒌薤白半夏汤"]],"a":"AD","x":"根据临床表现，应属胸痹气阴两虚证，治宜生脉散合人参养营汤。故选A、D。","p":"p7"}]},"05-03":{"name":"心衰","lecture":"5-3 心衰.pdf","points":[{"id":"p1","name":"概念与鉴别","teach":"<p>心衰 = 以<b>乏力、心悸、喘息、肢体水肿<\/b>为主症；多种慢性心系病反复发展的终末阶段。轻者仅气短、不耐劳累；重者喘息心悸不能平卧、尿少肢肿、口唇发绀，甚至喘悸不休、汗出肢冷、表情淡漠或烦躁（厥脱危象）。<\/p><table><thead><tr><th>病<\/th><th>与心衰同<\/th><th>分开点<\/th><\/tr><\/thead><tbody><tr><td>喘证<\/td><td>喘促短气<\/td><td>肺系病，外感诱发；心衰兼<mark>心悸、浮肿、尿少<\/mark><\/td><\/tr><tr><td>鼓胀<\/td><td>水肿尿少<\/td><td>病在肝脾，腹大肢细，腹壁脉络显露<\/td><\/tr><tr><td>水肿<\/td><td>水肿尿少<\/td><td>肺脾肾气化失调，从眼睑或下肢肿起，轻者无喘悸<\/td><\/tr><\/tbody><\/table>","src":"讲义 5-3 概述、诊断、鉴别诊断; 题库 #53 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：久病耗伤、感受外邪、情志失调、劳倦内伤（劳倦是加重的关键诱因）。跌仆损伤不是。<\/p><p><b>病位<\/b>在心，涉及肺、脾、肾、肝（不涉及胃）。<\/p><p>本虚标实、虚实夹杂，<b>以虚为主<\/b>：<\/p><ul><li>本虚：气虚、气阴两虚、阳虚<\/li><li>标实：瘀血、痰浊、水饮<\/li><li>病机关键四字：<b>虚、瘀、痰、水<\/b>；血瘀贯穿始终<\/li><\/ul><p>早期心肺气虚 → 中期气阴两虚、心阳亏虚 → 后期阴阳互损。痹证日久内舍于心致心衰，风寒湿留伏者酌加威灵仙、豨莶草、桑寄生。<\/p>","src":"讲义 5-3 病因、病机; 题库 #4 #5 #6 #11 #55 解析（#11 加药讲义未列，从题库）"},{"id":"p3","name":"辨证要点与治则","teach":"<p>临证<b>首辨轻重缓急<\/b>（不是首辨标本虚实）：轻者气短乏力；重者喘息不能平卧、尿少肢肿、发绀，甚至厥脱。<\/p><p>再辨标本虚实：本 = 心之阳气虚衰；标 = 痰、瘀、水。<\/p><p><b>治则：补虚泻实<\/b>，基本治法益气养阴温阳 + 活血化痰利水。急性加重期加强治标，必要时回阳固脱；稳定期益气、养阴或温阳为主。益气活血法贯穿始终。<\/p>","src":"讲义 5-3 辨证要点、治则治法、临证备要; 题库 #7 解析"},{"id":"p4","name":"气虚血瘀证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>气虚血瘀<\/td><td>胸闷气短，喘息心悸，<mark>活动后诱发或加剧<\/mark>，神疲乏力，自汗，面色㿠白，口唇发绀，肢肿时作，舌淡暗有瘀斑，脉沉细或涩、结、代<\/td><td>益气温阳，活血化瘀（祛瘀）<\/td><td>保元汤合血府逐瘀汤<\/td><\/tr><\/tbody><\/table><p>与阳虚水泛分开：气虚血瘀<b>无明显畏寒肢冷<\/b>，肢肿只是时作；畏寒肢冷 + 面浮肢肿尿少 → 阳虚水泛。<\/p><ul><li>瘀血阻络加三七、地龙<\/li><li>胸痛较剧加檀香、降香、郁金、蒲黄<\/li><li>心悸频作、发无定时加生龙骨、生牡蛎<\/li><li>兼痰热合小陷胸汤、黄连温胆汤<\/li><\/ul>","src":"讲义 5-3 证治 1; 题库 #8 #18 #23 #25 #27-29 #40-44 #48-50 #52 解析。讲义加减「胸痛较著者，发无定时，加生龙骨、生牡蛎」有误排，从题库 #48 #49"},{"id":"p5","name":"气阴两虚证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>气阴两虚<\/td><td>胸闷气短心悸，动则加剧，神疲乏力，<mark>口干、五心烦热、两颧潮红<\/mark>，自汗盗汗并见，腰酸耳鸣，舌暗红少苔，脉细数无力或结代<\/td><td>益气养阴，活血通脉<\/td><td>生脉散<\/td><\/tr><\/tbody><\/table><p>证机：气阴虚损，血行瘀滞。<\/p><ul><li>肺热壅盛、咳吐黄痰（多外感诱发）→ 加<b>清金化痰汤或越婢加半夏汤<\/b><\/li><li>偏阴虚加二至丸、黄精、石斛、玉竹<\/li><\/ul>","src":"讲义 5-3 证治 2; 题库 #12 #16 #20 #30 #34-36 #45 #46 解析"},{"id":"p6","name":"阳虚水泛证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>阳虚水泛<\/td><td>心悸，喘息不得卧，<mark>面浮肢肿、尿少、畏寒肢冷<\/mark>，腹胀便溏，口唇发绀，胸部刺痛，颈脉显露，舌淡胖有齿痕或瘀斑，脉沉细<\/td><td>益气温阳，活血利水<\/td><td>真武汤合葶苈大枣泻肺汤<\/td><\/tr><\/tbody><\/table><p>证机：阳气衰弱，水饮上泛，凌心射肺。<\/p><ul><li>饮邪暴盛、泛溢肌肤加椒目、防己、香加皮、大腹皮<\/li><li>畏寒肢冷、腰膝酸软明显加仙茅、淫羊藿、鹿角霜<\/li><li>胁下痞块坚硬（积块已成）加<b>鳖甲煎丸<\/b><\/li><\/ul>","src":"讲义 5-3 证治 3; 题库 #9 #13 #17 #19 #22 #24 #31-33 #37-39 #47 #51 解析"},{"id":"p7","name":"喘脱危证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>喘脱危证<\/td><td>喘悸不休，不能平卧，<mark>大汗淋漓或额汗如油、四肢厥冷<\/mark>，面色晦暗，表情淡漠或烦躁，尿少肢肿，脉微细欲绝或疾数无力<\/td><td>益气回阳固脱<\/td><td>四逆加人参汤<\/td><\/tr><\/tbody><\/table><ul><li>大汗不止加山茱萸、五味子<\/li><li><b>肢冷如冰<\/b>（阳虚暴脱）→ 急用<b>参附注射液<\/b><\/li><li>腹胀便溏、气短懒言、疲乏无力不是喘脱主症<\/li><\/ul>","src":"讲义 5-3 证治 4; 题库 #10 #14 #21 #26 #54 解析"},{"id":"p8","name":"出处与预防调护","teach":"<ul><li>王叔和《<b>脉经<\/b>》最早提出「心衰」一词<\/li><li>张仲景《<b>金匮要略<\/b>》提出心水：其身重而少气，不得卧，烦而躁，其人阴肿<\/li><li>《诸病源候论》：心衰以<b>心气亏虚<\/b>为本<\/li><li>《黄帝内经》：心胀、心痹；朱丹溪：逐水消饮；王清任、唐容川：瘀血化水<\/li><\/ul><p>预防调护：避免情绪过激；保暖防感冒；劳逸适度，<b>适度运动<\/b>（散步、太极拳、五禽戏），不做高强度运动；饮食清淡少盐，戒烟限酒。<\/p>","src":"讲义 5-3 历史沿革、预防调护; 题库 #1 #2 #3 #15 解析"}],"q":[{"n":1,"t":"A1型","q":"中医学中“心衰”一词最早出自","pre":"","o":[["A","《黄帝内经》"],["B","《金匮要略》"],["C","《脉经》"],["D","《诸病源候论》"],["E","《圣济总录》"]],"a":"C","x":"晋·王叔和《脉经·脾胃部第三》曰：“心衰则伏，肝微则沉，故令脉伏而沉。”这是中医学中“心衰”一词的最早出处，并提示了其脉象特征。故选C。","p":"p8"},{"n":2,"t":"A1型","q":"《诸病源候论·心病候》认为心衰为本虚标实之证，其中以何者为本","pre":"","o":[["A","心气亏虚"],["B","心阳亏虚"],["C","瘀血内阻"],["D","痰浊内蕴"],["E","心肺气虚"]],"a":"A","x":"《诸病源候论·心病候》曰：“心气不足则胸腹大，胁下与腰相引痛，惊悸，恍惚……是为心气之虚也。”强调心衰以心气虚为本。故选A。","p":"p8"},{"n":3,"t":"A1型","q":"“心水者，其身重而少气，不得卧，烦而躁，其人阴肿”出自","pre":"","o":[["A","《黄帝内经》"],["B","《金匮要略》"],["C","《脉经》"],["D","《诸病源候论》"],["E","《丹溪心法》"]],"a":"B","x":"《金匮要略·水气病脉证并治》云：“心水者，其身重而少气，不得卧，烦而躁，其人阴肿。”故选B。","p":"p8"},{"n":4,"t":"A1型","q":"下列不属于心衰常见病因的是","pre":"","o":[["A","久病耗伤"],["B","情志失调"],["C","跌仆损伤"],["D","劳倦内伤"],["E","感受外邪"]],"a":"C","x":"久病耗伤、情志失调、劳倦内伤、感受外邪均属于中医心衰病因。故选C。","p":"p2"},{"n":5,"t":"A1型","q":"心衰为本虚标实、虚实夹杂之证，其病机可以概括为","pre":"","o":[["A","虚、毒、瘀、湿"],["B","虚、痰、瘀、毒"],["C","虚、痰、瘀、水"],["D","水、毒、瘀、痰"],["E","虚、毒、瘀、饮"]],"a":"C","x":"心衰的病机关键可用虚、瘀、痰、水四者概括，虚实之间可相互转化。故选C。","p":"p2"},{"n":6,"t":"A1型","q":"下列不属于与心衰密切相关的脏腑是","pre":"","o":[["A","肺"],["B","脾"],["C","胃"],["D","肾"],["E","肝"]],"a":"C","x":"心衰病位在心，涉及肺、肝、脾、肾等脏。故选C。","p":"p2"},{"n":7,"t":"A1型","q":"下列关于心衰的叙述，不正确的是","pre":"","o":[["A","临证时需首辨病情的标本虚实"],["B","病程中会出现“瘀久成积”和“瘀血化水”的标实重症"],["C","早期以心肺气虚为主"],["D","治疗原则为补虚泻实"],["E","心气虚衰是基础"]],"a":"A","x":"心衰病临证时需首辨病情的轻重缓急。故选A。","p":"p3"},{"n":8,"t":"A1型","q":"心衰气虚血瘀的治法是","pre":"","o":[["A","益气温阳，活血祛瘀"],["B","益气养阴，活血化瘀"],["C","益气解表，活血利水"],["D","理气健脾，利水消肿"],["E","利水渗湿，温阳化气"]],"a":"A","x":"心衰气虚血瘀的治法是益气温阳，活血化瘀，代表方是保元汤合血府逐瘀汤加减。故选A。","p":"p4"},{"n":9,"t":"A1型","q":"治疗心衰阳虚水泛应首选","pre":"","o":[["A","保元汤合血府逐瘀汤加减"],["B","生脉散合血府逐瘀汤加减"],["C","清金化痰汤或越婢加半夏汤加减"],["D","真武汤合葶苈大枣泻肺汤加减"],["E","参附龙牡汤"]],"a":"D","x":"心衰阳虚水泛首选真武汤合葶苈大枣泻肺汤加减治疗。故选D。","p":"p6"},{"n":10,"t":"A1型","q":"下列不属于心衰气阴两虚证常见临床表现的是","pre":"","o":[["A","心悸，气短"],["B","神疲乏力，头晕"],["C","大汗淋漓，或额汗如油"],["D","口干，五心烦热，两颧潮红"],["E","胸痛，入夜尤甚"]],"a":"C","x":"大汗淋漓，或额汗如油，是心衰病喘脱危证的临床表现。故选C。","p":"p7"},{"n":11,"t":"A1型","q":"痹证发展为心痹，进而发生心衰，多有风寒湿邪留伏，常酌加","pre":"","o":[["A","威灵仙、豨莶草、桑寄生"],["B","桂枝、檀香、降香"],["C","水蛭、雷公藤、防己"],["D","葶苈子、乌梢蛇、知母"],["E","以上皆是"]],"a":"A","x":"痹证发展为心痹，进而发生心衰，多有风寒湿邪留伏，常酌加威灵仙、豨莶草、桑寄生等祛风除湿。故选A。","p":"p2"},{"n":12,"t":"A1型","q":"心衰气阴两虚的证机概要为","pre":"","o":[["A","气阴虚损，血行瘀滞"],["B","心气不足，血行瘀滞"],["C","阳气衰弱，水饮上泛"],["D","心肾阳衰，痰瘀交阻"],["E","以上皆非"]],"a":"A","x":"心衰气阴两虚的证机概要为气阴虚损，血行瘀滞。故选A。","p":"p5"},{"n":13,"t":"A1型","q":"心衰阳虚水泛的治法是","pre":"","o":[["A","益气养阴，活血通脉"],["B","益气温阳，活血利水"],["C","益气温阳，活血祛瘀"],["D","益气回阳固脱"],["E","以上皆非"]],"a":"B","x":"心衰阳虚水泛的治法是益气温阳，活血利水。故选B。","p":"p6"},{"n":14,"t":"A1型","q":"下列属于心衰喘脱危证常见临床表现的是","pre":"","o":[["A","喘悸不休，不能平卧"],["B","烦躁不安，大汗淋漓"],["C","四肢厥冷，尿少肢肿"],["D","舌淡苔白，脉微细欲绝"],["E","以上皆是"]],"a":"E","x":"心衰喘脱危证常见喘悸不休，不能平卧，面色晦暗，表情淡漠，或烦躁不安，大汗淋漓，或额汗如油，四肢厥冷，尿少肢肿，舌淡苔白，脉微细欲绝或疾数无力。故选E。","p":"p7"},{"n":15,"t":"A1型","q":"下列有关心衰病的预防调护不正确的是","pre":"","o":[["A","冬春季节交替，气候骤变时注意增减衣服"],["B","平素饮食清淡，不过食咸味及膏粱之品，戒烟限酒"],["C","调摄精神，避免情绪过激，保持心情平和"],["D","高强度运动，增强身体素质"],["E","勤监护（呼吸、尿量）、慢调理、长维持"]],"a":"D","x":"劳逸适度，避免过度劳累造成心气骤然耗散；可适度运动，如选择散步、太极拳、五禽戏等方式，以提高身体素质。故选D。","p":"p8"},{"n":16,"t":"A2型","q":"张某，男，65岁。胸闷、气短、喘息、心悸5年，近来，症状加剧，动则为甚，神疲乏力，口干，五心烦热，两颧潮红，腰膝酸软，头晕耳鸣，尿少肢肿，自汗与盗汗并见，舌暗红少苔，脉细数无力。其治疗宜选用","pre":"","o":[["A","生脉散"],["B","保元汤合血府逐瘀汤加减"],["C","真武汤"],["D","葶苈大枣泻肺汤"],["E","参附龙骨牡蛎汤"]],"a":"A","x":"根据临床表现，应 ,"p":"p6"},{"n":48,"t":"B型","q":"心衰气虚血瘀，若心悸频作，发无定时，可加用","pre":"","o":[["A","防己、香加皮"],["B","仙茅、淫羊藿"],["C","连翘、重楼"],["D","陈皮、半夏"],["E","生龙骨、生牡蛎"]],"a":"E","x":"心衰气虚血瘀，若心悸频作，发无定时，可加生龙骨、生牡蛎等镇惊安神。故选E。","p":"p4"},{"n":49,"t":"B型","q":"心衰气虚血瘀，胸痛较剧者，可酌加","pre":"","o":[["A","三七、地龙"],["B","胆南星、薤白"],["C","生龙骨、生牡蛎"],["D","郁金、檀香"],["E","竹茹、姜黄"]],"a":"D","x":"心衰气虚血瘀，胸痛较著者，加檀香、降香、郁金、蒲黄等行气活血止痛。故选D。","p":"p4"},{"n":50,"t":"B型","q":"心衰气虚血瘀阻络明显者，可酌加","pre":"","o":[["A","三七、地龙"],["B","胆南星、薤白"],["C","生龙骨、生牡蛎"],["D","郁金、檀香"],["E","竹茹、姜黄"]],"a":"A","x":"心衰血瘀阻络者，加三七、地龙等活血通络。故选A。","p":"p4"},{"n":51,"t":"B型","q":"患者心悸，喘息不得卧，面浮肢肿，尿少，神疲乏力，畏寒肢冷，腹胀，便溏，口唇发绀，舌淡胖，有齿痕，有瘀点，脉结代。其证候类型是","pre":"","o":[["A","气虚血瘀"],["B","气阴两虚"],["C","阳虚水泛"],["D","喘脱危证"],["E","痰浊痹阻"]],"a":"C","x":"心衰阳虚水泛证见心悸，喘息不得卧，面浮肢肿，尿少，神疲乏力，畏寒肢冷，腹胀，便溏，口唇发绀，胸部刺痛，或胁下痞块坚硬，颈脉显露，舌淡胖，有齿痕，或有瘀点、瘀斑，脉沉细或结、代、促。故选C。","p":"p6"},{"n":52,"t":"B型","q":"患者胸闷气短，心悸，活动后诱发，神疲乏力，自汗，面色㑿白，口唇发绀，舌淡暗有瘀斑，脉细涩。其证候类型是","pre":"","o":[["A","气虚血瘀"],["B","气阴两虚"],["C","阳虚水泛"],["D","喘脱危证"],["E","痰浊痹阻"]],"a":"A","x":"心衰气虚血瘀证见胸闷气短，喘息，心悸，活动后诱发或加剧，神疲乏力，倦怠懒言，自汗，口唇发绀，或胸部闷痛，或肢肿时作，喘息不得卧，舌淡胖或淡暗，有瘀斑，脉沉细或涩、结、代。故选A。","p":"p4"},{"n":53,"t":"多选","q":"心衰的主症包括","pre":"","o":[["A","喘促"],["B","少尿"],["C","心悸"],["D","水肿"],["E","乏力"]],"a":"ACDE","x":"心衰是以乏力、心悸、喘息、肢体水肿为主症的疾病。故选A、C、D、E。","p":"p1"},{"n":54,"t":"多选","q":"心衰患者出现喘促，应慎防喘脱危象，下列不属于喘脱危象主症的是","pre":"","o":[["A","额汗如油"],["B","喘悸不休"],["C","腹胀便溏"],["D","气短懒言"],["E","疲乏无力"]],"a":"CDE","x":"心衰喘脱危象表现为喘悸不休，不能平卧，面色晦暗，表情淡漠，或烦躁不安，大汗淋漓，或额汗如油，四肢厥冷，尿少肢肿，舌淡苔白，脉微细欲绝或疾数无力。故选C、D、E。","p":"p7"},{"n":55,"t":"多选","q":"心衰多为本虚标实、虚实夹杂之证。本虚有气虚、气阴两虚及阳虚；标实主要为","pre":"","o":[["A","瘀血"],["B","痰浊"],["C","水饮"],["D","寒凝"],["E","湿热"]],"a":"ABC","x":"心衰临床表现多为本虚标实，虚实夹杂之证。本虚有气虚、气阴两虚及阳虚；标实主要为瘀血、痰浊、水饮。故选A、B、C。","p":"p2"}]},"05-04":{"name":"不寐","lecture":"5-4 不寐.pdf","points":[{"id":"p1","name":"概念与主症","teach":"<p>不寐 = <b>经常不能获得正常睡眠<\/b>，即睡眠时间、深度不足。轻者入睡困难、寐而不酣、时寐时醒、醒后不能再寐；重者彻夜不寐。诊断要求连续3周以上。<\/p><p>常伴头痛、头昏、心悸、健忘、神疲乏力、心神不宁、多梦（恶心呕吐不是）。<\/p><p>鉴别：<b>一过性失眠<\/b>有一时诱因、病程短，不属病态；<b>生理性少寐<\/b>多见老年人，少寐早醒而无明显痛苦。<\/p>","src":"讲义 5-4 概述、诊断、鉴别诊断; 题库 #34 #35 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：饮食不节、情志失常、劳逸失调、病后体虚（年迈）。感受外邪、跌仆损伤不是常见病因。<\/p><p><b>基本病机：阳盛阴衰，阴阳失交<\/b>。病位主要在<b>心<\/b>，与肝、脾、肾密切相关。<\/p><ul><li>实：肝郁化火、痰热内扰<\/li><li>虚：心脾两虚、心胆气虚、心肾不交<\/li><li>久病虚实夹杂，或兼瘀血<\/li><\/ul>","src":"讲义 5-4 病因、病机; 题库 #6 #7 #8 #33 解析"},{"id":"p3","name":"辨证要点与治则","teach":"<p><b>首辨虚实<\/b>，再辨受病脏腑：<\/p><ul><li>急躁易怒 → 肝火内扰<\/li><li>不思饮食、腹胀便溏、面色少华 → 脾虚不运<\/li><li>腰酸、心烦心悸、头晕健忘 → 肾阴虚，心肾不交<\/li><li>嗳腐吞酸 → 胃气不和<\/li><\/ul><p><b>治则：补虚泻实，调整阴阳<\/b>；在此基础上佐以安神定志（养血、镇惊、清心安神）。<\/p>","src":"讲义 5-4 辨证要点、治则治法; 题库 #9 解析"},{"id":"p4","name":"肝火 vs 痰热扰心","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝火扰心<\/td><td>不寐多梦甚则彻夜不眠，<mark>急躁易怒<\/mark>，头晕头胀，目赤耳鸣，口干而苦，不思饮食，便秘溲赤，舌红苔黄，脉弦数<\/td><td>疏肝泻热，镇心安神<\/td><td>龙胆泻肝汤<\/td><\/tr><tr><td>痰热扰心<\/td><td>心烦不寐，胸闷脘痞，<mark>泛恶嗳气、苔黄腻<\/mark>，头重目眩，口苦，脉滑数<\/td><td>清化痰热，和中安神<\/td><td>黄连温胆汤<\/td><\/tr><\/tbody><\/table><ul><li>肝火证机：肝郁化火，上扰心神；神疲食少不属肝火<\/li><li>痰热盛、彻夜不眠、大便秘结 → 加大黄或<b>礞石滚痰丸<\/b><\/li><li>饮食停滞、嗳腐吞酸 → <b>保和丸<\/b><\/li><\/ul>","src":"讲义 5-4 证治 1、2; 题库 #11-15 #22 #25 #29 #30 解析"},{"id":"p5","name":"心脾两虚 vs 心胆气虚","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>心脾两虚<\/td><td>不易入睡，多梦易醒，心悸健忘，<mark>神疲食少、腹胀便溏、面色少华<\/mark>，舌淡苔薄，脉细无力<\/td><td>补益心脾，养血安神<\/td><td>归脾汤<\/td><\/tr><tr><td>心胆气虚<\/td><td>虚烦不寐，<mark>胆怯心悸、触事易惊、终日惕惕<\/mark>，气短自汗，倦怠，舌淡，脉弦细<\/td><td>益气镇惊，安神定志<\/td><td>安神定志丸合酸枣仁汤<\/td><\/tr><\/tbody><\/table><ul><li>心脾两虚：心血不足甚加熟地黄、白芍、阿胶；脘闷纳呆苔腻加苍术、半夏、陈皮、茯苓、厚朴；舌红少苔不属本证<\/li><li>心胆气虚证机：心胆虚怯，心神失养，神魂不安；木不疏土（胸闷善太息、纳呆腹胀）加柴胡、陈皮、山药、白术<\/li><\/ul>","src":"讲义 5-4 证治 3、5; 题库 #16 #18 #20 #21 #23 #26-28 #31 #32 解析"},{"id":"p6","name":"心肾不交证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>心肾不交<\/td><td>心烦不寐，入睡困难，心悸多梦，<mark>腰膝酸软、潮热盗汗、五心烦热<\/mark>，头晕耳鸣，男子遗精，舌红少苔，脉细数<\/td><td>滋阴降火，交通心肾<\/td><td>六味地黄丸合交泰丸<\/td><\/tr><\/tbody><\/table><p>证机：肾水亏虚，不能上济于心；心火炽盛，不能下交于肾。<\/p><ul><li>交泰丸 = 黄连 + <b>肉桂<\/b>（引火归原）<\/li><li>阴血不足、心火亢盛 → <b>朱砂安神丸<\/b><\/li><li>心阴不足为主 → 天王补心丹<\/li><\/ul>","src":"讲义 5-4 证治 4; 题库 #10 #17 #19 #24 解析"},{"id":"p7","name":"出处与附多寐","teach":"<ul><li>病名首见《<b>难经<\/b>·四十六难》；《内经》称不得卧、目不瞑<\/li><li>《素问·逆调论》：<b>胃不和则卧不安<\/b><\/li><li>《灵枢·邪客》：补其不足，泻其有余，调其虚实，去其邪，饮以半夏汤<\/li><li>许叔微《普济本事方》：肝经血虚，魂不守舍<\/li><li>王清任：瘀血致不寐，血府逐瘀汤<\/li><\/ul><p>附 多寐（题库无题）：不分昼夜时时欲睡，呼之能醒，醒后复睡；本虚标实。<\/p><table><thead><tr><th>证<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>湿盛困脾<\/td><td>燥湿健脾，醒神开窍<\/td><td>平胃散<\/td><\/tr><tr><td>瘀血阻滞<\/td><td>活血通络<\/td><td>通窍活血汤<\/td><\/tr><tr><td>脾气虚弱<\/td><td>健脾益气<\/td><td>香砂六君子汤<\/td><\/tr><tr><td>阳气虚弱<\/td><td>益气温阳<\/td><td>附子理中丸<\/td><\/tr><\/tbody><\/table>","src":"讲义 5-4 历史沿革、附多寐; 题库 #1-5 解析"}],"q":[{"n":1,"t":"A1型","q":"不寐的病名，首见于","pre":"","o":[["A","《黄帝内经》"],["B","《景岳全书》"],["C","《金匮要略》"],["D","《类证治裁》"],["E","《难经》"]],"a":"E","x":"不寐病名首见于《难经·四十六难》。故选E。","p":"p7"},{"n":2,"t":"A1型","q":"“胃不和则卧不安”之说出自","pre":"","o":[["A","《黄帝内经》"],["B","《景岳全书》"],["C","《金匮要略》"],["D","《丹溪心法》"],["E","《普济本事方》"]],"a":"A","x":"“胃不和则卧不安”出自《素问·逆调论》，为《黄帝内经》引用《下经》的原文。《下经》云：“胃不和则卧不安，此之谓也。”故选A。","p":"p7"},{"n":3,"t":"A1型","q":"下列属于《灵枢·邪客》所载不寐治疗原则的是","pre":"","o":[["A","补其不足"],["B","泻其有余"],["C","调其虚实"],["D","去其邪"],["E","以上皆是"]],"a":"E","x":"《灵枢·邪客》云：“补其不足，泻其有余，调其虚实，以通其道，而去其邪，饮以半夏汤一剂，阴阳已通，其卧立至。”故选E。","p":"p7"},{"n":4,"t":"A1型","q":"提出肝经血虚，魂不守舍，心神不安而发生不寐的著作是","pre":"","o":[["A","《金匮要略》"],["B","《普济本事方》"],["C","《景岳全书》"],["D","《医宗必读》"],["E","《证治要诀》"]],"a":"B","x":"许叔微《普济本事方》提出，肝经血虚，魂不守舍，心神不安而发生不寐。故选B。","p":"p7"},{"n":5,"t":"A1型","q":"提出瘀血可致不寐，以血府逐瘀汤辨治的医家是","pre":"","o":[["A","王清任"],["B","唐宗海"],["C","沈金鳌"],["D","冯兆张"],["E","张锡纯"]],"a":"A","x":"王清任《医林改错·血府逐瘀汤所治之症目》提出瘀血可致不寐，以血府逐瘀汤辨治。故选A。","p":"p7"},{"n":6,"t":"A1型","q":"下列不属于不寐常见病因的是","pre":"","o":[["A","饮食不节"],["B","情志失常"],["C","劳逸失调"],["D","病后体虚"],["E","跌仆损伤"]],"a":"E","x":"不寐的常见病因包括饮食不节、情志失常、劳逸失调、病后体虚。故选E。","p":"p2"},{"n":7,"t":"A1型","q":"不寐的病位主要在","pre":"","o":[["A","脑"],["B","心"],["C","脾"],["D","肾"],["E","肝"]],"a":"B","x":"不寐病位主要在心，与肝、脾、肾关系密切。故选B。","p":"p2"},{"n":8,"t":"A1型","q":"不寐的基本病机为","pre":"","o":[["A","阳盛阴衰，阴阳失交"],["B","胃气不和，心神被扰"],["C","心肾不交，水火不济"],["D","心虚胆怯，决断失权"],["E","精血内耗，心神失养"]],"a":"A","x":"不寐的基本病机总属阳盛阴衰，阴阳失交。故选A。","p":"p2"},{"n":9,"t":"A1型","q":"不寐的辨证，应首辨","pre":"","o":[["A","病位"],["B","虚实"],["C","标本"],["D","寒热"],["E","阴阳"]],"a":"B","x":"不寐首先应辨虚实，再辨受病脏腑。故选B。","p":"p3"},{"n":10,"t":"A1型","q":"阴血不足，心火亢盛而致不寐者，治疗方选","pre":"","o":[["A","安神定志丸"],["B","酸枣仁汤"],["C","天王补心丹"],["D","知柏地黄丸"],["E","朱砂安神丸"]],"a":"E","x":"治疗不寐阴血不足证的代表方剂是朱砂安神丸。故选E。","p":"p6"},{"n":11,"t":"A1型","q":"治疗不寐肝火扰心证的代表方剂为","pre":"","o":[["A","归脾汤"],["B","交泰丸"],["C","龙胆泻肝汤"],["D","酸枣仁汤"],["E","朱砂安神丸"]],"a":"C","x":"治疗不寐肝火扰心证的代表方剂为龙胆泻肝汤。故选C。","p":"p4"},{"n":12,"t":"A1型","q":"治疗不寐痰热扰心证的代表方剂为","pre":"","o":[["A","黄连温胆汤"],["B","半夏秫米汤"],["C","龙胆泻肝汤"],["D","黄连阿胶汤"],["E","栀子豉汤"]],"a":"A","x":"治疗不寐痰热扰心证的首选方为黄连温胆汤。故选A。","p":"p4"},{"n":13,"t":"A1型","q":"不寐，痰热重，痰火上扰心神，大便秘结者，可用","pre":"","o":[["A","保和丸"],["B","礙石滚痰丸"],["C","龙胆泻肝汤"],["D","黄连阿胶汤"],["E","黄连清心饮"]],"a":"B","x":"不寐痰热盛，痰火上扰心神，彻夜不寐，大便秘结者，加大黄或用礙石滚痰丸以泻火逐痰。故选B。","p":"p4"},{"n":14,"t":"A1型","q":"下列不属于不寐肝火扰心证常见临床表现的是","pre":"","o":[["A","急躁易怒"],["B","目赤耳鸣"],["C","口干而苦"],["D","神疲食少"],["E","脉弦而数"]],"a":"D","x":"不寐肝火扰心证常见不寐多梦，甚则彻夜不眠，急躁易怒，伴头晕头胀，目赤耳鸣，口干而苦，不思饮食，便秘溲赤，舌红苔黄，脉弦而数。故选D。","p":"p4"},{"n":15,"t":"A1型","q":"不寐痰热扰心证，若饮食停滞，嗳腐吞酸，脘腹胀痛，可在黄连温胆汤基础上加用","pre":"","o":[["A","礙石滚痰丸"],["B","保和丸"],["C","六味地黄丸"],["D","犀黄丸"],["E","七味都气丸"]],"a":"B","x":"不寐痰热扰心证，若饮食停滞，嗳腐吞酸，脘腹胀痛，加神曲、焦山楂、莱菔子，或用保和丸消导和中。故选B。","p":"p4"},{"n":16,"t":"A1型","q":"下列不属于不寐心脾两虚证常见临床表现的是","pre":"","o":[["A","心悸健忘"],["B","神疲食少"],["C","头晕目眩"],["D","面色少华"],["E","舌红少苔"]],"a":"E","x":"不寐心脾两虚证常见不易入睡，多梦易醒，心悸健忘，神疲食少，伴头晕目眩，面色少华，四肢倦怠，腹胀便溏，舌淡苔薄，脉细无力。故选E。","p":"p5"},{"n":17,"t":"A1型","q":"具有引火归原的作用，常用于治疗不寐心肾不交证的药物是","pre":"","o":[["A","熟地黄"],["B","肉桂"],["C","黄连"],["D","山茱萸"],["E","牡丹皮"]],"a":"B","x":"肉桂具有引火归原的作用，与黄连相配伍，常用于治疗不寐心肾不交证。故选B。","p":"p6"},{"n":18,"t":"A1型","q":"不寐心胆气虚证，木不疏土，胸闷，善太息，纳呆腹胀者，可加用","pre":"","o":[["A","柴胡、陈皮、山药、白术"],["B","熟地、白芍、当归、黄芪"],["C","朱砂、磁石、龙骨、龙齿"],["D","苍术、半夏、陈皮、茯苓"],["E","柏子仁、五味子、夜交藤、合欢皮"]],"a":"A","x":"不寐心胆气虚证，木不疏土，胸闷，善太息，纳呆腹胀者，应加用柴胡、陈皮、山药、白术。故选A。","p":"p5"},{"n":19,"t":"A1型","q":"不寐心肾不交证，阴血不足，心火亢盛者，宜选用","pre":"","o":[["A","天王补心丹"],["B","归脾汤"],["C","朱砂安神丸"],["D","酸枣仁汤"],["E","安神定志丸"]],"a":"C","x":"不寐心肾不交证，阴血不足，心火亢盛者，用朱砂安神丸。故选C。","p":"p6"},{"n":20,"t":"A1型","q":"不寐心脾两虚证，若脘闷纳呆、苔腻，可加用","pre":"","o":[["A","苍术、半夏、陈皮、厚朴"],["B","柴胡、黄芩、香附、甘草"],["C","熟地、当归、白芍、川芎"],["D","附子、干姜、肉桂、丁香"],["E","龙骨、牡蛎、朱砂、磁石"]],"a":"A","x":"不寐心脾两虚证，若脘闷纳呆、苔腻，重用白术，加苍术、半夏、陈皮、茯苓、厚朴以健脾燥湿，理气化痰。故选A。","p":"p5"},{"n":21,"t":"A2型","q":"患者，女，30岁。症见不易入睡，多梦易醒，心悸健忘，神疲食少，伴头晕目眩，四肢倦怠，腹胀便溏，面色少华，舌淡苔薄，脉细无力。其证候类型是","pre":"","o":[["A","肝火扰心"],["B","痰热扰心"],["C","心脾两虚"],["D","心肾不交"],["E","心胆气虚"]],"a":"C","x":"心悸健忘，神疲食少，伴头晕目眩，四肢倦怠，腹胀便溏，面色少华，舌淡苔薄，脉细无力，均为心脾两虚证典型临床表现。故选C。","p":"p5"},{"n":22,"t":"A2型","q":"患者，男。症见失眠，性情急躁易怒，不思饮食，口渴喜饮，目赤口苦，小便黄赤，大便秘结，舌质红苔黄，脉弦数。其证机概要为","pre":"","o":[["A","心肾阴虚，虚火扰神"],["B","肝郁化火，上扰心神"],["C","心脾两虚，心神失养"],["D","痰热内阻，上扰心神"],["E","心胆气虚，神不内守"]],"a":"B","x":"性情急躁易怒为肝火偏旺之征。口渴喜饮，目赤口苦，小便黄赤，大便秘结，舌质红苔黄，脉弦数，为实热之象。故选B。","p":"p4"},{"n":23,"t":"A2型","q":"李某，女，48岁。失眠多年，表现为虚烦不寐，终日惕惕，胆怯心悸，气短自汗，倦怠乏力，舌淡，脉弦细。其证机概要为","pre":"","o":[["A","肾水亏虚，心火亢盛，心肾不交"],["B","脾虚血亏，心神失养，神不安舍"],["C","心胆虚怯，心神失养，神魂不安"],["D","肝郁化火，上扰心神"],["E","湿食生痰，郁痰生热，扰动心神"]],"a":"C","x":"由虚烦不寐，终日惕惕，胆怯心悸，气短自汗，可辨为心胆气虚证，因此其证机概要为心胆虚怯，心神失养，神魂不安。故选C。","p":"p5"},{"n":24,"t":"A2型","q":"患者，女，50岁，农民。近半年心烦不寐，入睡困难，心悸多梦，伴头晕耳鸣，腰膝酸软，潮热盗汗，五心烦热，咽干少津，舌红少苔，脉细数。其证候类型为","pre":"","o":[["A","心胆气虚"],["B","心肾不交"],["C","肝郁化火"],["D","心火偏亢"],["E","痰热内扰"]],"a":"B","x":"肾水亏虚，不能上济于心，心火炽盛，不能下交于肾，故见心烦不寐，入睡困难，心悸多梦，伴头晕耳鸣，腰膝酸软，潮热盗汗，五心烦热，咽干少津，舌红少苔，脉细数之象。故选B。","p":"p6"},{"n":25,"t":"A2型","q":"患者张某，男，46岁。症见心烦不寐，胸闷泛恶，头重目眩，口苦，舌红苔黄腻，脉滑数。其治法为","pre":"","o":[["A","清心泻火，安神宁心"],["B","清化痰热，和中安神"],["C","滋阴降火，养心安神"],["D","益气镇惊，安神定志"],["E","燥湿化痰，镇静安神"]],"a":"B","x":"胸闷泛恶，头重目眩，口苦，舌红苔黄腻，脉滑数，均为痰热扰心之象，故治疗当清化痰热，和中安神。故选B。","p":"p4"},{"n":26,"t":"A3型","q":"其证候类型是","pre":"患者，女，18岁。半年来因学习紧张，压力较大，晚上经常难以入眠，或多梦易醒，伴心悸健忘，四肢倦怠，饮食乏味，面色少华，舌质淡，脉细弱。","o":[["A","忧郁伤神"],["B","心胆气虚"],["C","心脾两虚"],["D","阴虚火旺"],["E","痰气郁结"]],"a":"C","x":"依据不寐，多梦易醒，伴心悸健忘，四肢倦怠，饮食乏味，面色少华，舌质淡，脉细弱，当辨为心脾两虚。故选C。","p":"p5"},{"n":27,"t":"A3型","q":"其治法是","pre":"患者，女，18岁。半年来因学习紧张，压力较大，晚上经常难以入眠，或多梦易醒，伴心悸健忘，四肢倦怠，饮食乏味，面色少华，舌质淡，脉细弱。","o":[["A","清肝泻火，佐以安神"],["B","清心泻火，安神宁心"],["C","滋阴降火，养心安神"],["D","补益心脾，养血安神"],["E","益气镇惊，安神定志"]],"a":"D","x":"不寐心脾两虚，治当补益心脾，养血安神。故选D。","p":"p5"},{"n":28,"t":"A3型","q":"治疗方选","pre":"患者，女，18岁。半年来因学习紧张，压力较大，晚上经常难以入眠，或多梦易醒，伴心悸健忘，四肢倦怠，饮食乏味，面色少华，舌质淡，脉细弱。","o":[["A","黄连阿胶汤"],["B","天王补心丹"],["C","安神定志丸"],["D","柴胡疏肝散"],["E","归脾汤"]],"a":"E","x":"根据临床表现，辨证为心脾两虚，治当补益心脾，养血安神，方选归脾汤。故选E。","p":"p5"},{"n":29,"t":"B型","q":"不寐，急躁易怒，伴头晕头胀，目赤耳鸣，口干而苦，不思饮食。治疗方选","pre":"","o":[["A","朱砂安神丸"],["B","龙胆泻肝汤"],["C","黄连温胆汤"],["D","保和丸"],["E","归脾汤"]],"a":"B","x":"此为肝郁化火，上扰心神，选龙胆泻肝汤疏肝泄热，镇心安神。故选B。","p":"p4"},{"n":30,"t":"B型","q":"不寐，心烦胸闷，泛恶，嗳气，头重目眩，口苦，舌红，苔黄腻，脉滑数。治疗方选","pre":"","o":[["A","朱砂安神丸"],["B","龙胆泻肝汤"],["C","黄连温胆汤"],["D","保和丸"],["E","归脾汤"]],"a":"C","x":"不寐伴泛恶，嗳气，头重目眩，口苦，舌红，苔黄腻，脉滑数，应属痰热扰心，故方选黄连温胆汤。故选C。","p":"p4"},{"n":31,"t":"B型","q":"不寐心脾两虚，若心血不足较甚者，可加用","pre":"","o":[["A","陈皮、茯苓、半夏"],["B","柴胡、陈皮、白术、山药"],["C","熟地黄、白芍、阿胶"],["D","朱砂、茯苓、丹皮"],["E","神曲、焦山楂、莱菔子"]],"a":"C","x":"熟地黄、白芍、阿胶具有养血之功，故不寐心脾两虚，心血不足较甚者可用。故选C。","p":"p5"},{"n":32,"t":"B型","q":"不寐心胆气虚，若伴见胸闷，善太息，纳呆腹胀者，可加用","pre":"","o":[["A","陈皮、茯苓、半夏"],["B","柴胡、陈皮、白术、山药"],["C","熟地黄、白芍、阿胶"],["D","朱砂、茯苓、丹皮"],["E","神曲、焦山楂、莱菔子"]],"a":"B","x":"不寐心胆气虚，伴见胸闷，善太息，纳呆腹胀者，为木不疏土，故加柴胡、陈皮、白术、山药疏肝健脾。故选B。","p":"p5"},{"n":33,"t":"多选","q":"不寐的常见病因包括","pre":"","o":[["A","情志所伤"],["B","饮食不节"],["C","病后体虚"],["D","劳逸失调"],["E","感受外邪"]],"a":"ABCD","x":"不寐的常见病因有饮食不节，情志失常，劳逸失调，及病后、年迈体虚等因素，感受外邪不是常见病因。故选A、B、C、D。","p":"p2"},{"n":34,"t":"多选","q":"下列属于不寐患者常见伴随症状的是","pre":"","o":[["A","头痛头昏"],["B","神疲乏力"],["C","心悸健忘"],["D","恶心呕吐"],["E","多梦"]],"a":"ABCE","x":"不寐主要表现为睡眠时间、深度的不足，轻者入寐困难或寐而易醒，醒后不寐，重者彻夜难眠，常伴有头痛、头昏、心悸、健忘、神疲乏力、心神不宁、多梦等症。无恶心呕吐症状。故选A、B、C、E。","p":"p1"},{"n":35,"t":"多选","q":"不寐在临床上可表现为","pre":"","o":[["A","入睡困难"],["B","寐而不酣"],["C","时寐时醒"],["D","醒后不能再寐"],["E","彻夜不寐"]],"a":"ABCDE","x":"不寐主要表现为睡眠时间、深度的不足，轻者入睡困难，或寐而不酣，时寐时醒，或醒后不能再寐，重者彻夜不寐。故选A、B、C、D、E。","p":"p1"}]},"06-01":{"name":"头痛","lecture":"6-1 头痛.pdf","points":[{"id":"p1","name":"概念与外感内伤","teach":"<p><b>头痛<\/b>（亦称头风）：以自觉头部疼痛为主的疾病。病例以头痛为主症 → 辨病为头痛（不是眩晕）。<\/p><table><thead><tr><th><\/th><th>外感头痛<\/th><th>内伤头痛<\/th><\/tr><\/thead><tbody><tr><td>起病<\/td><td>较急，病程短<\/td><td>缓慢，反复发作，病程长<\/td><\/tr><tr><td>痛性<\/td><td><mark>掣痛、跳痛、灼痛、重痛<\/mark>，痛无休止<\/td><td><mark>胀痛、刺痛、隐痛、空痛、昏痛<\/mark>，痛势绵绵，遇劳加重，时作时止<\/td><\/tr><tr><td>性质<\/td><td>表实证，多伴外感表证<\/td><td>以虚证为多<\/td><\/tr><\/tbody><\/table><p>陷阱：“空痛”属内伤；“痛无休止”属外感。<\/p><p><b>真头痛<\/b>：起病急骤，突发剧烈头痛，持续不解，手足逆冷至肘膝，呕吐如喷，本病凶险。<\/p>","src":"讲义 6-1 概述、鉴别诊断、辨证要点1; 题库 #11 #12 #41 解析"},{"id":"p2","name":"病因病机","teach":"<ul><li><b>外感<\/b>：风、寒、湿、热，<mark>以风邪为主<\/mark>，与它邪合病；外邪上扰清空，壅滞经络 → 表实证。<\/li><li><b>内伤病因<\/b>：情志失调、饮食劳伤、先天不足或房事不节、头部外伤或久病入络。“感受外邪”不属内伤。<\/li><li><b>内伤脏腑<\/b>：<b>肝、脾、肾<\/b>三脏失调；多关乎气、血、痰、瘀、虚。<\/li><li><b>虚实<\/b>：肝阳、痰浊、瘀血 = 实证；气血亏虚、肾精不足 = 虚证。<\/li><li><b>转化<\/b>：虚实可互转——痰浊日久 → 气血亏虚头痛；肝阳、肝火日久伤阴 → 肾精亏虚或阴虚阳亢；各种头痛迁延不愈，久病入络 → <b>瘀血头痛<\/b>。<\/li><\/ul><p>病理因素总括：外感风寒湿热 + 内伤气血痰瘀虚（多选题全选）。<\/p>","src":"讲义 6-1 病因、病机; 题库 #6 #7 #10 #57-#60 解析"},{"id":"p3","name":"部位与引经药","teach":"<table><thead><tr><th>经<\/th><th>部位<\/th><th>引经药<\/th><\/tr><\/thead><tbody><tr><td>太阳<\/td><td>脑后，下连于项（后颈、项背）<\/td><td>羌活、蔓荆子、川芎<\/td><\/tr><tr><td>阳明<\/td><td>前额及眉棱骨<\/td><td>葛根、白芷、知母<\/td><\/tr><tr><td>少阳<\/td><td>头之两侧，连及于耳<\/td><td>柴胡、黄芩、川芎<\/td><\/tr><tr><td>厥阴<\/td><td><mark>颠顶<\/mark>，或连目系<\/td><td>吴茱萸、藁本<\/td><\/tr><tr><td>太阴<\/td><td>全头<\/td><td>苍术<\/td><\/tr><tr><td>少阴<\/td><td>全头<\/td><td>细辛<\/td><\/tr><\/tbody><\/table><p>川芎同见于太阳、少阳：配<b>羌活、蔓荆子<\/b> → 太阳；配<b>柴胡、黄芩<\/b> → 少阳。<\/p>","src":"讲义 6-1 辨头痛部位、头痛引经药; 题库 #8 #9 #22 #33 #39 #51-#54 解析"},{"id":"p4","name":"风寒·风热·风湿","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>风寒<\/td><td>痛连项背，掣痛，恶风畏寒，<mark>头痛喜裹，口不渴<\/mark>，苔薄白，脉浮紧<\/td><td>疏散风寒止痛<\/td><td>川芎茶调散<\/td><\/tr><tr><td>风热<\/td><td><mark>头痛而胀，甚则头胀如裂<\/mark>，发热，面红目赤，口渴喜饮，便秘尿赤，脉浮数<\/td><td>疏风清热和络<\/td><td>芎芷石膏汤<\/td><\/tr><tr><td>风湿<\/td><td><mark>头痛如裹，肢体困重<\/mark>，胸闷纳呆，小便不利，便溏，苔白腻，脉濡<\/td><td>祛风胜湿通窍<\/td><td>羌活胜湿汤<\/td><\/tr><\/tbody><\/table><p>“喜裹”（怕风，喜欢包头）= 风寒；“如裹”（头像被裹住）= 风湿。风湿证机：风湿之邪，上蒙头窍，困遏清阳。风热方不是桑菊饮。<\/p>","src":"讲义 6-1 证治分类 外感头痛(1)-(3); 题库 #13 #15 #18 #23 #24 #30 #43 #44 #48 #50 #55 #56 解析"},{"id":"p5","name":"肝阳·痰浊·瘀血","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝阳<\/td><td><mark>头胀痛而眩，以两侧为主<\/mark>，心烦易怒，口苦面红，或兼胁痛，舌红苔薄黄，脉弦数<\/td><td>平肝潜阳息风<\/td><td>天麻钩藤饮<\/td><\/tr><tr><td>痰浊<\/td><td><mark>头痛昏蒙沉重<\/mark>，胸脘痞闷，纳呆呕恶，苔白腻，脉滑<\/td><td>健脾燥湿，化痰降逆<\/td><td>半夏白术天麻汤<\/td><\/tr><tr><td>瘀血<\/td><td>经久不愈，<mark>痛处固定，痛如锥刺<\/mark>，或有头部外伤史，舌紫暗有瘀斑，脉细涩<\/td><td>活血化瘀，通窍止痛<\/td><td>通窍活血汤<\/td><\/tr><\/tbody><\/table><p>证机：肝阳 = 肝失条达，气郁化火，阳亢风动；痰浊 = 脾失健运，痰浊中阻，上蒙清窍。痰浊“昏蒙沉重+呕恶、脉滑”，风湿“如裹+肢体困重、脉濡”。<\/p>","src":"讲义 6-1 证治分类 内伤头痛(1)(4)(6); 题库 #14 #16 #17 #21 #25 #27 #31 #32 #34 #35 #40 #42 #45-#47 解析。瘀血治法讲义仅写“活血化瘀”，按题库 #14 解析写“活血化瘀，通窍止痛”"},{"id":"p6","name":"血虚·气虚·肾虚","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>血虚<\/td><td>头痛而晕，<mark>心悸怔忡<\/mark>，神疲乏力，面色少华，舌淡，脉细弱<\/td><td>滋阴养血，和络止痛<\/td><td>加味四物汤<\/td><\/tr><tr><td>气虚<\/td><td>头痛隐隐，时发时止，<mark>遇劳则加重<\/mark>，纳少，倦怠乏力，气短自汗，脉细弱<\/td><td>健脾益气升清<\/td><td>益气聪明汤<\/td><\/tr><tr><td>肾虚<\/td><td><mark>头痛且空<\/mark>，眩晕耳鸣，腰膝酸软，少寐健忘，遗精带下，舌红少苔，脉细无力<\/td><td>养阴补肾，填精生髓<\/td><td>大补元煎<\/td><\/tr><\/tbody><\/table><p>血虚、气虚舌脉相同（舌淡脉细弱）：心悸、面色少华 → 血虚；遇劳加重、气短自汗 → 气虚。胸脘痞闷不属气虚（属痰浊）。血虚证机：营血不足，不能上荣，窍络失养。<\/p>","src":"讲义 6-1 证治分类 内伤头痛(2)(3)(5); 题库 #14 #19 #20 #26 #28 #29 #36-#38 #49 解析"},{"id":"p7","name":"历代医家","teach":"<ul><li>《黄帝内经》：<mark>首载<\/mark>头痛病名（脑风、首风）。<\/li><li>张仲景《伤寒论》：论太阳、阳明、少阳、厥阴头痛。<\/li><li>李东垣《兰室秘藏》：分外感、内伤，<b>补充太阴、少阴头痛<\/b>，主张分经用药。<\/li><li>朱丹溪《丹溪心法》：“头痛多主于痰，痛甚者火多，有可吐者，可下者”。<\/li><li>王肯堂《证治准绳》：区别头痛与头风。<\/li><li>张景岳《景岳全书》：“凡诊头痛者，当先审久暂，次辨表里”。<\/li><li>王清任《医林改错》：首创<b>血府逐瘀汤<\/b>治头痛顽疾（瘀血头痛主方仍是通窍活血汤）。<\/li><\/ul>","src":"讲义 6-1 历史沿革; 题库 #1-#5 解析"}],"q":[{"n":1,"t":"A1型","q":"首载头痛病名的著作是","pre":"","o":[["A","《伤寒论》"],["B","《东垣十书》"],["C","《丹溪心法》"],["D","《黄帝内经》"],["E","《难经》"]],"a":"D","x":"头痛病名首载于《黄帝内经》。故选D。","p":"p7"},{"n":2,"t":"A1型","q":"补充了太阴、少阴头痛，并主张分经用药的医著是","pre":"","o":[["A","《黄帝内经》"],["B","《证治准绳》"],["C","《伤寒论》"],["D","《医林改错》"],["E","《兰室秘藏》"]],"a":"E","x":"李东垣《兰室秘藏·头痛门》补充了太阴、少阴头痛，主张分经用药。故选E。","p":"p7"},{"n":3,"t":"A1型","q":"提出“头痛多主于痰，痛甚者火多，有可吐者，可下者”的医家是","pre":"","o":[["A","李东垣"],["B","朱丹溪"],["C","张仲景"],["D","王肯堂"],["E","王清任"]],"a":"B","x":"朱丹溪《丹溪心法·头痛》云：“头痛多主于痰，痛甚者火多，有可吐者，可下者。”强调了痰与火在头痛发病中的作用。故选B。","p":"p7"},{"n":4,"t":"A1型","q":"提出“凡诊头痛者，当先审久暂，次辨表里”的医家是","pre":"","o":[["A","张景岳"],["B","王肯堂"],["C","张仲景"],["D","李东垣"],["E","王清任"]],"a":"A","x":"张景岳《景岳全书·头痛》云：“凡诊头痛者，当先审久暂，次辨表里。”故选A。","p":"p7"},{"n":5,"t":"A1型","q":"首创血府逐瘀汤治疗头痛顽疾的医家是","pre":"","o":[["A","张景岳"],["B","李东垣"],["C","王清任"],["D","张仲景"],["E","朱丹溪"]],"a":"C","x":"王清任《医林改错》首创血府逐瘀汤治疗头痛顽疾，颇具新意。故选C。","p":"p7"},{"n":6,"t":"A1型","q":"外感头痛的致病因素以何者为主","pre":"","o":[["A","风邪"],["B","寒邪"],["C","湿邪"],["D","热邪"],["E","燥邪"]],"a":"A","x":"外感头痛以风邪为主，并与它邪合而为病。故选A。","p":"p2"},{"n":7,"t":"A1型","q":"与内伤头痛关系最为密切的脏腑是","pre":"","o":[["A","肺、脾、肾"],["B","肝、脾、肾"],["C","心、肝、肾"],["D","肝、肺、肾"],["E","肝、脾、肺"]],"a":"B","x":"内伤头痛多与肝、脾、肾三脏功能失调有关。故选B。","p":"p2"},{"n":8,"t":"A1型","q":"阳明头痛的“引经药”应首选","pre":"","o":[["A","羌活、川芎、蔓荆子"],["B","葛根、白芷、知母"],["C","柴胡、黄芩、川芎"],["D","藁本、吴茱萸、钩藤"],["E","细辛、白芷、羌活"]],"a":"B","x":"根据头痛部位的不同，参照经络循行部位选用适当的引经药，可提高疗效。太阳经常用羌活、蔓荆子、川芎；阳明经常用葛根、白芷、知母；少阳经常用柴胡、黄芩、川芎；太阴经常用苍术；少阴经常用细辛；厥阴经常用吴茱萸、藁本。故选B。","p":"p3"},{"n":9,"t":"A1型","q":"太阳头痛，多痛在","pre":"","o":[["A","前额部及眉棱骨"],["B","头之两侧，连及于耳"],["C","颠顶部位，或连目系"],["D","头后部，下连于颈"],["E","以上均非"]],"a":"D","x":"太阳经头痛部位在后颈部及项背部。故选D。","p":"p3"},{"n":10,"t":"A1型","q":"下列不属于内伤头痛病机的是","pre":"","o":[["A","肝脾肾功能失调"],["B","风火上扰清窍"],["C","痰瘀痹阻脑络"],["D","气血阴精亏损，清窍失养"],["E","风寒湿热之邪外袭，上扰清窍"]],"a":"E","x":"外感头痛多责之于风、寒、湿、热，属表实证；内伤头痛与肝、脾、肾三脏功能失调有关，多关乎气、血、痰、瘀、虚，其中气血亏虚、肾精不足属虚证，肝阳、痰浊、瘀血所致之头痛多属实证。故选E。","p":"p2"},{"n":11,"t":"A1型","q":"下列不属于内伤头痛辨证要点的是","pre":"","o":[["A","痛无休止"],["B","起病缓慢"],["C","反复发作"],["D","劳累痛甚"],["E","多表现为隐痛、空痛、昏痛"]],"a":"A","x":"内伤头痛多起病缓慢，反复发作，病程较长，多表现为胀痛、刺痛、隐痛、空痛、昏痛，痛势绵绵，遇劳加重，时作时止，以虚证为多。故选A。","p":"p1"},{"n":12,"t":"A1型","q":"下列不属于外感头痛常见临床表现的是","pre":"","o":[["A","跳痛"],["B","灼痛"],["C","重痛"],["D","掣痛"],["E","空痛"]],"a":"E","x":"外感头痛多呈掣痛、跳痛、灼痛、重痛，痛无休止；内伤头痛多呈胀痛、刺痛、隐痛、空痛、昏痛，痛势绵绵，遇劳加重，时作时止。故选E。","p":"p1"},{"n":13,"t":"A1型","q":"治疗风寒头痛的代表方剂是","pre":"","o":[["A","川芎茶调散"],["B","芎芷石膏汤"],["C","羌活胜湿汤"],["D","天麻钩藤饮"],["E","半夏白术天麻汤"]],"a":"A","x":"治疗风寒头痛的代表方剂为川芎茶调散。故选A。","p":"p4"},{"n":14,"t":"A1型","q":"肾虚头痛的治法为","pre":"","o":[["A","健脾燥湿，化痰降逆"],["B","滋阴养血，和络止痛"],["C","养阴补肾，填精生髓"],["D","活血化瘀，通窍止痛"],["E","平肝潜阳息风"]],"a":"C","x":"痰浊头痛治当健脾燥湿，化痰降逆；血虚头痛治当滋阴养血，和络止痛；肾虚头痛治当养阴补肾，填精生髓；瘀血头痛治当活血化瘀，通窍止痛；肝阳头痛治当平肝潜阳息风。故选C。","p":"p6"},{"n":15,"t":"A1型","q":"头痛而胀，甚则头胀如裂，常见于","pre":"","o":[["A","风寒头痛"],["B","风热头痛"],["C","风湿头痛"],["D","肝阳头痛"],["E","痰浊头痛"]],"a":"B","x":"风热头痛主要临床表现头痛而胀，甚则头胀如裂，发热或恶风，面红目赤，口渴喜饮，便秘尿赤等。故选B。","p":"p4"},{"n":16,"t":"A1型","q":"痰浊头痛的证机概要为","pre":"","o":[["A","风热外袭，上扰清窍，窍络失和"],["B","风湿之邪，上蒙头窍，困遏清阳"],["C","肝失条达，气郁化火，阳亢风动"],["D","脾失健运，痰浊中阻，上蒙清窍"],["E","肾精亏虚，髓海不足，脑窍失充"]],"a":"D","x":"痰浊头痛证机概要属脾失健运，痰浊中阻，上蒙清窍。故选D。","p":"p5"},{"n":17,"t":"A1型","q":"天麻钩藤饮主要用于治疗","pre":"","o":[["A","痰浊头痛"],["B","血虚头痛"],["C","肝阳头痛"],["D","肾虚头痛"],["E","瘀血头痛"]],"a":"C","x":"痰浊头痛方选半夏白术天麻汤；血虚头痛方选加味四物汤；肝阳头痛方选天麻钩藤饮；肾虚头痛方选大补元煎；瘀血头痛方选通窍活血汤。故选C。","p":"p5"},{"n":18,"t":"A1型","q":"治疗风湿头痛的代表方剂是","pre":"","o":[["A","通窍活血汤"],["B","天麻钩藤饮"],["C","半夏白术天麻汤"],["D","羌活胜湿汤"],["E","川芎茶调散"]],"a":"D","x":"痰浊头痛方选半夏白术天麻汤；血虚头痛方选加味四物汤；肝阳头痛方选天麻钩藤饮；肾虚头痛方选大补元煎；瘀血头痛方选通窍活血汤。故选D。","p":"p4"},{"n":19,"t":"A1型","q":"血虚头痛的证机概要为","pre":"","o":[["A","风热外袭，上扰清窍，窍络失和"],["B","营血不足，不能上荣，窍 "治疗痰浊头痛的代表方剂是半夏白术天麻汤。故选E。","p":"p5"},{"n":48,"t":"B型","q":"治疗风湿头痛的代表方剂是","pre":"","o":[["A","益气聪明汤"],["B","川芎茶调散"],["C","羌活胜湿汤"],["D","加味四物汤"],["E","半夏白术天麻汤"]],"a":"C","x":"治疗风湿头痛的代表方剂是羌活胜湿汤。故选C。","p":"p4"},{"n":49,"t":"B型","q":"治疗气虚头痛的代表方剂是","pre":"","o":[["A","益气聪明汤"],["B","川芎茶调散"],["C","羌活胜湿汤"],["D","加味四物汤"],["E","半夏白术天麻汤"]],"a":"A","x":"治疗气虚头痛的代表方剂是益气聪明汤。故选A。","p":"p6"},{"n":50,"t":"B型","q":"治疗风寒头痛的代表方剂是","pre":"","o":[["A","益气聪明汤"],["B","川芎茶调散"],["C","羌活胜湿汤"],["D","加味四物汤"],["E","半夏白术天麻汤"]],"a":"B","x":"治疗风寒头痛的代表方剂是川芎茶调散。故选B。","p":"p4"},{"n":51,"t":"B型","q":"太阳头痛的部位在","pre":"","o":[["A","头后部"],["B","前额部"],["C","眉棱骨"],["D","颠顶部"],["E","头之两侧"]],"a":"A","x":"太阳经头痛部位在后颈部及项背部。故选A。","p":"p3"},{"n":52,"t":"B型","q":"厥阴头痛的部位在","pre":"","o":[["A","头后部"],["B","前额部"],["C","眉棱骨"],["D","颠顶部"],["E","头之两侧"]],"a":"D","x":"厥阴经头痛部位在颠顶部位，或连及目系。故选D。","p":"p3"},{"n":53,"t":"B型","q":"常用于治疗太阳头痛的引经药是","pre":"","o":[["A","柴胡、黄芩、川芎"],["B","杜仲、桑寄生、续断"],["C","羌活、蔓荆子、川芎"],["D","葛根、白芷、知母"],["E","吴茱萸、藁本"]],"a":"C","x":"部位的不同，参照经络循行部位选用适当的引经药，可提高疗效。太阳经常用羌活、蔓荆子、川芎。故选C。","p":"p3"},{"n":54,"t":"B型","q":"常用于治疗阳明头痛的引经药是","pre":"","o":[["A","柴胡、黄芩、川芎"],["B","杜仲、桑寄生、续断"],["C","羌活、蔓荆子、川芎"],["D","葛根、白芷、知母"],["E","吴茱萸、藁本"]],"a":"D","x":"部位的不同，参照经络循行部位选用适当的引经药，可提高疗效。阳明经常用葛根、白芷、知母。故选D。","p":"p3"},{"n":55,"t":"B型","q":"症见头痛而胀，甚则头痛如裂，发热微恶风，面红目赤，口渴喜饮，大便秘结，小便黄，舌质红，苔黄，脉浮数者，属于","pre":"","o":[["A","风寒头痛"],["B","风热头痛"],["C","风湿头痛"],["D","肝阳头痛"],["E","痰浊头痛"]],"a":"B","x":"头痛而胀，甚则头痛如裂，发热恶风，面红目赤，口渴喜饮，属风热外袭，上扰清窍，窍络失和。故选B。","p":"p4"},{"n":56,"t":"B型","q":"症见头痛如裹，肢体困重，纳呆胸闷，小便不利，大便溏，苔白腻，脉濡者，属于","pre":"","o":[["A","风寒头痛"],["B","风热头痛"],["C","风湿头痛"],["D","肝阳头痛"],["E","痰浊头痛"]],"a":"C","x":"头痛如裹，肢体困重，纳呆胸闷，属风湿之邪，上蒙头窍，困遏清阳。故选C。","p":"p4"},{"n":57,"t":"多选","q":"与内伤头痛关系密切的脏腑是","pre":"","o":[["A","肺"],["B","肝"],["C","脾"],["D","心"],["E","肾"]],"a":"BCE","x":"内伤头痛多与肝、脾、肾三脏功能失调有关。故选B、C、E。","p":"p2"},{"n":58,"t":"多选","q":"下列属于内伤头痛病因的是","pre":"","o":[["A","情志失调"],["B","感受外邪"],["C","跌仆损伤"],["D","先天不足"],["E","饮食劳伤"]],"a":"ACDE","x":"感受外邪为外感头痛病因。故选A、C、D、E。","p":"p2"},{"n":59,"t":"多选","q":"头痛的主要病理因素包括","pre":"","o":[["A","风"],["B","热"],["C","痰"],["D","寒"],["E","瘀"]],"a":"ABCDE","x":"外感头痛多责之于风、寒、湿、热；内伤头痛多关乎气、血、痰、瘀、虚。故选A、B、C、D、E。","p":"p2"},{"n":60,"t":"多选","q":"下列对头痛病机转化的叙述，正确的是","pre":"","o":[["A","头痛虚实在一定条件下可以相互转化"],["B","痰浊中阻日久，脾胃受损，气血生化不足，营血亏虚，不养脑窍，可转化为气血亏虚之头痛"],["C","肝阳、肝火日久，阳明伤阴，肾虚阴亏，可转化为肾精亏虚的头痛，或阴虚阳亢，虚实夹杂之头痛"],["D","各种头痛迁延不愈，病久入络，又可以转变为瘀血头痛"],["E","头痛虚实不可以相互转化"]],"a":"ABCD","x":"头痛病机演变常可由实转虚或见本虚标实、虚实夹杂。如痰浊中阻日久，脾胃受损，气血生化不足，营血亏虚，脑窍失养，可转为气血亏虚之头痛；肝阳、肝火日久，阳热伤阴，肾虚精亏，可转为肾精亏虚之头痛，或阴虚阳亢，虚实夹杂之头痛。各种头痛迁延不愈，病久入络，又可转变为瘀血头痛。故选A、B、C、D。","p":"p2"}]},"06-02":{"name":"眩晕","lecture":"6-2 眩晕.pdf","points":[{"id":"p1","name":"概念诊断与鉴别","teach":"<p><b>眩晕<\/b>：以<mark>头晕目眩<\/mark>为主症。头晕 = 自身或外界景物旋转；目眩 = 眼花或眼前发黑。轻者闭目即止，重者如坐车船，甚则仆倒；可伴恶心呕吐、汗出、耳鸣。<\/p><p>辅助检查：颈椎X线、经颅多普勒、颅脑CT/MRI、血常规及血液系统检查（多选题全选）。<\/p><table><thead><tr><th>鉴别<\/th><th>要点<\/th><\/tr><\/thead><tbody><tr><td>厥证<\/td><td>突然昏仆、<b>不省人事<\/b>、四肢厥冷；眩晕仆倒无昏迷、无肢冷<\/td><\/tr><tr><td>中风<\/td><td>昏仆 + <b>半身不遂、口舌歪斜<\/b>；眩晕无此。部分中风以眩晕为先兆<\/td><\/tr><\/tbody><\/table>","src":"讲义 6-2 概述、诊断、鉴别诊断; 题库 #8 #55 解析"},{"id":"p2","name":"病因病机","teach":"<ul><li><b>病因<\/b>：情志不遂、年老体虚、饮食不节、久病劳倦、跌仆坠损（全选）。<\/li><li><b>病位<\/b>：<mark>在脑（脑窍）<\/mark>，与<b>肝、脾、肾<\/b>三脏关系密切。<\/li><li><b>病理因素<\/b>：风、火、痰、瘀、虚。<\/li><li><b>性质<\/b>：本虚标实，以虚证居多。本虚 = 肝肾亏虚、气血不足、髓海不足；标实 = 风、火、痰、瘀扰乱清窍。<\/li><li>看病例找主因：突发较重、形体壮实、呕恶痰涎、头沉、苔腻脉滑 → 病理因素为<b>痰<\/b>。<\/li><li>治则：补虚泻实，调整阴阳。<\/li><\/ul>","src":"讲义 6-2 病因、病机、治则; 题库 #6 #7 #13 #21 #52-#54 解析"},{"id":"p3","name":"肝阳上亢证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>肝阳上亢<\/td><td>眩晕耳鸣，头目胀痛，<mark>遇烦劳郁怒而加重<\/mark>，急躁易怒，口苦，失眠多梦，颜面潮红，肢麻震颤，甚则仆倒，舌红苔黄，脉弦或数<\/td><td>平肝潜阳，清火息风<\/td><td>天麻钩藤饮<\/td><\/tr><\/tbody><\/table><p>证机：<b>肝阳风火，上扰清窍<\/b>。<\/p><p>陷阱：“乏力”不属本证（属气虚）。<\/p>","src":"讲义 6-2 证治分类1; 题库 #10 #11 #16 #22 #23 #30 #36 #37 #42 #50 解析"},{"id":"p4","name":"痰湿中阻证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰湿（浊）中阻<\/td><td>眩晕，<mark>头重如蒙<\/mark>，或伴视物旋转，胸闷恶心，呕吐痰涎，食少多寐，苔白腻，脉濡滑<\/td><td>化痰祛湿，健脾和胃<\/td><td>半夏白术天麻汤<\/td><\/tr><\/tbody><\/table><p>证机：痰浊中阻，上蒙清窍，清阳不升。<\/p><p>易混方：苓桂术甘汤 = 阳虚水盛；黄连温胆汤 = 痰热；半夏厚朴汤 = 痰气交阻；半夏秫米汤 = 湿痰胃不和之失眠。<\/p>","src":"讲义 6-2 证治分类2; 题库 #9 #17 #24 #26 #31 #38 #39 #43 #51 解析"},{"id":"p5","name":"瘀血阻窍证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>瘀血阻窍<\/td><td>眩晕，头痛<mark>且痛有定处<\/mark>，健忘，失眠，心悸，耳鸣耳聋，面唇紫暗，舌暗有瘀斑，舌下脉络迂曲增粗，脉涩或细涩<\/td><td>祛瘀生新，活血通窍<\/td><td>通窍活血汤<\/td><\/tr><\/tbody><\/table><p>证机：瘀血阻络，气血不畅，脑失所养。<\/p><p>陷阱：“面色少华”不属本证（属气血亏虚）；主方不是血府逐瘀汤。<\/p>","src":"讲义 6-2 证治分类3; 题库 #15 #18 #27 #28 #35 #48 解析"},{"id":"p6","name":"气血亏虚vs肾精不足","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>气血亏虚<\/td><td>眩晕<mark>动则加剧，劳累即发<\/mark>，面色㿠白，神疲自汗，唇甲不华，发色不泽，心悸少寐，纳少腹胀，舌淡，脉细弱<\/td><td>补益气血，调养心脾<\/td><td>归脾汤<\/td><\/tr><tr><td>肾精不足<\/td><td>眩晕<mark>日久不愈，精神萎靡，腰酸膝软<\/mark>，少寐健忘，两目干涩，或颧红咽干、五心烦热，舌红少苔，脉细数<\/td><td>滋养肝肾，填精益髓<\/td><td>左归丸<\/td><\/tr><\/tbody><\/table><p>证机：气血亏虚，清阳不展，脑失所养；肾精不足，髓海空虚，脑失所养。肾精不足阴损及阳 → 右归丸。<\/p>","src":"讲义 6-2 证治分类4、5; 题库 #12 #14 #19 #25 #29 #32-#34 #40 #41 #44 #45 #49 解析"},{"id":"p7","name":"医家与调护","teach":"<ul><li>《素问·至真要大论》：“诸风掉眩，皆属于肝”。<\/li><li>张仲景《金匮要略》：痰饮致眩，泽泻汤。<\/li><li>刘完素：主张<mark>从风火立论<\/mark>。<\/li><li>朱丹溪《丹溪心法》：“无痰则不作眩”。<\/li><li>张景岳《景岳全书》：“无虚不能作眩”，当以治虚为主。<\/li><li>虞抟《医学正传》：“眩运者，中风之渐也”；瘀血可致眩。<\/li><\/ul><p><b>调护<\/b>：作息规律，饮食清淡，情绪稳定，严重者卧床休息，避免突然剧烈体位改变 → “以上皆是”。<\/p>","src":"讲义 6-2 历史沿革、预防调护; 题库 #1-#5 #20 #46 #47 解析"}],"q":[{"n":1,"t":"A1型","q":"“诸风掉眩，皆属于肝”出自","pre":"","o":[["A","《黄帝内经》"],["B","《伤寒杂病论》"],["C","《金匮要略》"],["D","《医学正传》"],["E","《景岳全书》"]],"a":"A","x":"《素问·至真要大论》云：“诸风掉眩，皆属于肝。”指出眩晕属肝所主。故选A。","p":"p7"},{"n":2,"t":"A1型","q":"主张眩晕应从风火立论的医家是","pre":"","o":[["A","朱丹溪"],["B","刘完素"],["C","张仲景"],["D","张景岳"],["E","严用和"]],"a":"B","x":"金·刘完素《素问玄机原病式·五运主病》云：“风火皆属阳，多为兼化，阳主乎动，两动相搏，则为之旋转。”故选B。","p":"p7"},{"n":3,"t":"A1型","q":"强调“无痰则不作眩”的医家是","pre":"","o":[["A","朱丹溪"],["B","刘完素"],["C","虞抟"],["D","张景岳"],["E","严用和"]],"a":"A","x":"朱丹溪《丹溪心法·头眩》强调“无痰则不作眩”。故选A。","p":"p7"},{"n":4,"t":"A1型","q":"强调“无虚不能作眩”的医家是","pre":"","o":[["A","朱丹溪"],["B","刘完素"],["C","虞抟"],["D","张景岳"],["E","严用和"]],"a":"D","x":"张景岳《景岳全书·眩运》云：“眩运一证，虚者居其八九，而兼火兼痰者，不过十中一二耳。”强调“无虚不能作眩”。故选D。","p":"p7"},{"n":5,"t":"A1型","q":"“眩运者，中风之渐也”，出自","pre":"","o":[["A","《医学正传》"],["B","《黄帝内经》"],["C","《金匮要略》"],["D","《丹溪心法》"],["E","《景岳全书》"]],"a":"A","x":"虞抟《医学正传·眩运》云：“眩运者，中风之渐也。”故选A。","p":"p7"},{"n":6,"t":"A1型","q":"眩晕常见的病理因素有","pre":"","o":[["A","风、痰"],["B","风、火、痰"],["C","虚、火、痰"],["D","风、火、痰、瘀"],["E","风、火、痰、瘀、虚"]],"a":"E","x":"眩晕的病理因素有风、火、痰、瘀、虚。故选E。","p":"p2"},{"n":7,"t":"A1型","q":"下列与眩晕的发生密切相关的脏腑是","pre":"","o":[["A","心、肝、脾"],["B","肺、脾、肾"],["C","心、肝、肾"],["D","肝、脾、肾"],["E","心、脾、肾"]],"a":"D","x":"眩晕病位在脑窍，与肝、脾、肾三脏关系密切。故选D。","p":"p2"},{"n":8,"t":"A1型","q":"眩晕主要临床表现为","pre":"","o":[["A","坐立不安"],["B","头重如蒙"],["C","头痛头胀"],["D","头晕目眩"],["E","恶心呕吐"]],"a":"D","x":"眩晕以头晕目眩、视物旋转为主要临床表现，轻者闭目即止，重者如坐车船，甚则仆倒。故选D。","p":"p1"},{"n":9,"t":"A1型","q":"治疗眩晕痰湿中阻的代表方剂是","pre":"","o":[["A","二陈汤"],["B","半夏白术天麻汤"],["C","天麻钩藤饮"],["D","异功散"],["E","参苓白术丸"]],"a":"B","x":"治疗眩晕痰湿中阻的代表方剂是半夏白术天麻汤。故选B。","p":"p4"},{"n":10,"t":"A1型","q":"治疗眩晕肝阳上亢的代表方剂是","pre":"","o":[["A","通窍活血汤"],["B","半夏白术天麻汤"],["C","天麻钩藤饮"],["D","异功散"],["E","参苓白术丸"]],"a":"C","x":"治疗眩晕肝阳上亢的代表方剂是天麻钩藤饮。故选C。","p":"p3"},{"n":11,"t":"A1型","q":"下列不属于眩晕肝阳上亢常见临床表现的是","pre":"","o":[["A","头痛"],["B","面赤"],["C","急躁"],["D","肢麻"],["E","乏力"]],"a":"E","x":"眩晕肝阳上亢常见临床表现为眩晕，耳鸣，头目胀痛，急躁易怒，口苦，失眠多梦，遇烦劳郁怒而加重，甚则仆倒，颜面潮红，肢麻震颤等。乏力多见于气虚证。故选E。","p":"p3"},{"n":12,"t":"A1型","q":"治疗眩晕气血亏虚的代表方剂是","pre":"","o":[["A","炙甘草汤"],["B","归脾汤"],["C","加味四物汤"],["D","当归补血汤"],["E","人参养营汤"]],"a":"B","x":"治疗眩晕气血亏虚的代表方剂是归脾汤。故选B。","p":"p6"},{"n":13,"t":"A1型","q":"眩晕的病位在","pre":"","o":[["A","心"],["B","肝"],["C","脑"],["D","肾"],["E","三焦"]],"a":"C","x":"眩晕病位在脑，与肝、脾、肾三脏关系密切。故选C。","p":"p2"},{"n":14,"t":"A1型","q":"治疗眩晕肾精不足的代表方剂是","pre":""," "","o":[["A","肝阳上亢"],["B","气血亏虚"],["C","痰湿中阻"],["D","肾精不足"],["E","瘀血阻窍"]],"a":"E","x":"眩晕瘀血阻窍的常见临床表现为眩晕，头痛，且痛有定处，兼见健忘，失眠，心悸，精神不振，耳鸣耳聋，面唇紫暗，舌质暗，有瘀斑，多伴见舌下脉络迂曲增粗，脉涩或细涩。故选E。","p":"p5"},{"n":49,"t":"B型","q":"眩晕动则加剧，劳累即发，面色白，神疲乏力，倦怠懒言，唇甲不华，发色不泽，心悸少寐，纳少腹胀，舌淡苔薄白，脉细弱。其证候类型当属","pre":"","o":[["A","肝阳上亢"],["B","气血亏虚"],["C","痰湿中阻"],["D","肾精不足"],["E","瘀血阻窍"]],"a":"B","x":"眩晕气血亏虚的常见临床表现为眩晕动则加剧，劳累即发，面色㑿白，神疲自汗，倦怠懒言，唇甲不华，发色不泽，心悸少寐，纳少腹胀，舌质淡，苔薄白，脉细弱。故选B。","p":"p6"},{"n":50,"t":"B型","q":"眩晕，耳鸣，头目胀痛，口苦，失眠多梦，遇烦劳、郁怒而加重，甚则仆倒，颜面潮红，急躁易怒，肢麻震颤，舌红苔黄，脉弦数。其证候类型是","pre":"","o":[["A","肝阳上亢"],["B","气血亏虚"],["C","痰湿中阻"],["D","肾精不足"],["E","瘀血阻窍"]],"a":"A","x":"眩晕肝阳上亢的常见临床表现为眩晕，耳鸣，头目胀痛，急躁易怒，口苦，失眠多梦，遇烦劳、郁怒而加重，甚则仆倒，颜面潮红，肢麻震颤，舌质红，苔黄，脉弦或数。故选A。","p":"p3"},{"n":51,"t":"B型","q":"眩晕，头重如蒙，或伴视物旋转，胸闷恶心，呕吐痰涎，食少多寐，舌苔白腻，脉濡滑。其证候类型是","pre":"","o":[["A","肝阳上亢"],["B","气血亏虚"],["C","痰湿中阻"],["D","肾精不足"],["E","瘀血阻窍"]],"a":"C","x":"眩晕痰浊中阻的常见临床表现为眩晕，头重如蒙，或伴视物旋转，胸闷恶心，呕吐痰涎，食少多寐，舌苔白腻，脉濡滑。故选C。","p":"p4"},{"n":52,"t":"多选","q":"与眩晕密切相关的脏腑是","pre":"","o":[["A","肺"],["B","肝"],["C","脾"],["D","心"],["E","肾"]],"a":"BCE","x":"病位在脑窍，与肝、脾、肾三脏关系密切。故选B、C、E。","p":"p2"},{"n":53,"t":"多选","q":"眩晕的病因包括","pre":"","o":[["A","情志不遂"],["B","年老体虚"],["C","饮食不节"],["D","久病劳倦"],["E","跌仆坠损"]],"a":"ABCDE","x":"眩晕的病因包括情志不遂、年老体虚、饮食不节、久病劳倦、跌仆坠损。故选A、B、C、D、E。","p":"p2"},{"n":54,"t":"多选","q":"眩晕的主要病理因素包括","pre":"","o":[["A","风"],["B","火"],["C","痰"],["D","虚"],["E","瘀"]],"a":"ABCDE","x":"眩晕的病理因素主要有风、火、痰、瘀、虚。故选A、B、C、D、E。","p":"p2"},{"n":55,"t":"多选","q":"有助于眩晕病因诊断的辅助检查有","pre":"","o":[["A","颈椎X线片"],["B","经颅多普勒"],["C","颅脑CT"],["D","颅脑MRI"],["E","血液系统检查"]],"a":"ABCDE","x":"颈椎X线片、经颅多普勒、颅脑CT、MRI扫描、血常规及血液系统检查等有助于对眩晕的诊断。故选A、B、C、D、E。","p":"p1"}]},"06-03":{"name":"中风","lecture":"6-3 中风.pdf","points":[{"id":"p1","name":"概念诊断与鉴别","teach":"<p><b>主症<\/b>：猝然昏仆、不省人事、半身不遂、口舌歪斜、言语不利、肌肤不仁；轻者可无昏仆。多40岁以上，急性起病。“口中怪叫”不属中风。<\/p><p><b>先兆<\/b>：眩晕、头痛、耳鸣，一过性言语不利或<mark>肢体麻木<\/mark>、视物昏花，一日数发。<\/p><table><thead><tr><th>鉴别<\/th><th>特征<\/th><\/tr><\/thead><tbody><tr><td>痫证<\/td><td>猝发仆地，口中作声，四肢抽搐，<b>口吐白沫<\/b><\/td><\/tr><tr><td>痉证<\/td><td>四肢抽搐，项背强直，角弓反张；无半身不遂<\/td><\/tr><tr><td>痿证<\/td><td>起病缓，双下肢或四肢瘫痪、肌肉萎缩<\/td><\/tr><tr><td>厥证<\/td><td>四肢逆冷，移时多可自行苏醒<\/td><\/tr><tr><td>口僻<\/td><td>口眼歪斜，伴耳背疼痛，无半身不遂<\/td><\/tr><\/tbody><\/table>","src":"讲义 6-3 概述、诊断、鉴别诊断; 题库 #11 #31 #38 #39 #44 #45 解析"},{"id":"p2","name":"病因病机","teach":"<ul><li><b>病因<\/b>：内伤积损、情志过极（尤以暴怒多见）、饮食不节、劳欲过度。“疮毒内侵”不是。<\/li><li><b>基本病机<\/b>：<mark>阴阳失调，气血逆乱，上犯于脑<\/mark>。<\/li><li><b>病位<\/b>在脑，与<b>心、肝、脾、肾<\/b>密切。<\/li><li><b>本<\/b>：气血不足或肝肾阴虚；<b>标<\/b>：风、火、痰、瘀。病理因素多选题（火、瘀、痰、风、虚）全选。<\/li><li>中经络：病位浅，风痰瘀阻滞经脉；中脏腑：病位深，风阳痰火蒙蔽清窍。<\/li><\/ul>","src":"讲义 6-3 病因、病机; 题库 #5 #6 #10 #43 解析"},{"id":"p3","name":"经络脏腑·闭脱","teach":"<p><b>首辨中经络与中脏腑<\/b>：两者均有半身不遂、口舌歪斜，区别在<mark>有无神志昏蒙<\/mark>。中脏腑再辨闭证与脱证。<\/p><table><thead><tr><th><\/th><th>闭证（邪闭，实）<\/th><th>脱证（阳脱，虚）<\/th><\/tr><\/thead><tbody><tr><td>表现<\/td><td>牙关紧闭，口噤不开，两手握固，肢体强痉，<b>大小便闭<\/b><\/td><td>目合口张，手撒肢冷，汗多，鼻鼾息微，<b>二便自遗<\/b><\/td><\/tr><\/tbody><\/table><p><b>治则<\/b>：急性期治标祛邪（平肝息风、化痰通腑、活血通络）；中脏腑醒神开窍，闭证清热或化痰开窍，脱证回阳固脱，内闭外脱则醒神开窍与扶正固脱兼用。益气养血属恢复期，不属急性期。脱证由闭证演变，非骤然起病。口吐白沫属痫病。<\/p>","src":"讲义 6-3 辨证要点1-2、治则治法; 题库 #12 #14 #15 #16 #20 #23 解析"},{"id":"p4","name":"中经络三证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>风痰入络<\/td><td>平素头晕目眩，手足麻木，口角流涎，<mark>苔白腻，脉弦滑<\/mark><\/td><td>息风化痰，活血通络<\/td><td>半夏白术天麻汤合桃仁红花煎<\/td><\/tr><tr><td>风阳上扰<\/td><td>平素<mark>急躁易怒<\/mark>，头痛眩晕，面红目赤，口苦，舌红苔黄，脉弦有力<\/td><td>清肝泻火，息风潜阳<\/td><td>天麻钩藤饮<\/td><\/tr><tr><td>阴虚风动<\/td><td>耳鸣目眩，双目干涩，<mark>腰酸腿软<\/mark>，舌红绛少苔，脉细弦<\/td><td>滋养肝肾，潜阳息风<\/td><td>镇肝息风汤<\/td><\/tr><\/tbody><\/table><p>三证共同：神志清楚 + 半身不遂、口舌歪斜、舌强语謇。风痰入络证机：脉络空虚，风痰乘虚入中，气血闭阻。风阳上扰头痛较重 → 加羚羊角、夏枯草。<\/p>","src":"讲义 6-3 证治分类 中经络(1)-(3); 题库 #17 #18 #21 #24 解析"},{"id":"p5","name":"闭证三证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰热腑实<\/td><td>神志欠清，痰多而黏，<mark>腹胀便秘<\/mark>，苔黄腻，脉弦滑<\/td><td>通腑泄热，息风化痰<\/td><td>桃仁承气汤<\/td><\/tr><tr><td>痰火瘀闭（阳闭）<\/td><td>昏仆，牙关紧闭，<mark>面赤身热，气粗口臭，躁扰不宁<\/mark>，苔黄腻，脉弦滑数<\/td><td>息风清火，豁痰开窍<\/td><td>羚角钩藤汤，另服至宝丹或安宫牛黄丸<\/td><\/tr><tr><td>痰浊瘀闭（阴闭）<\/td><td>昏仆，牙关紧闭，<mark>面白唇暗，静卧不烦，四肢不温<\/mark>，痰涎壅盛，苔白腻，脉沉滑缓<\/td><td>化痰息风，宣郁开窍<\/td><td>涤痰汤，另用苏合香丸<\/td><\/tr><\/tbody><\/table><p>阳闭、阴闭鉴别要点：<b>火热<\/b>。阳闭病机：肝阳暴张，阳亢风动，痰火壅盛，气血上逆，神窍闭阻。阴闭见面赤、颧红如妆 = 戴阳，病情恶化，急进参附汤、白通加猪胆汁汤。<\/p>","src":"讲义 6-3 证治分类 中脏腑闭证1)-3); 题库 #13 #19 #22 #25 #26 #30 #32 #33 #40 解析。题库 #32 给答案C（痰热腑实），题库自注“按照教材应该选E”（痰火瘀闭），讲义亦为痰火瘀闭——昏迷+面赤身热、气粗口臭按痰火瘀闭记"},{"id":"p6","name":"脱证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>脱证<\/td><td>突然昏仆，目合口张，鼻鼾息微，<mark>手撒肢冷，汗多，二便自遗<\/mark>，肢体软瘫，舌痿，脉微欲绝<\/td><td>回阳救逆，益气固脱<\/td><td>参附汤合生脉散<\/td><\/tr><\/tbody><\/table><p>病机：风阳痰火炽盛，耗灼阴精，阴虚及阳，<b>阴竭阳亡，阴阳离决<\/b>（讲义证机：正不胜邪，元气衰微，阴阳欲绝）。<\/p><p>干扰方：归脾汤、六味地黄丸、肾气丸、补阳还五汤都不是。<\/p>","src":"讲义 6-3 证治分类 脱证、病机; 题库 #27 #41 解析"},{"id":"p7","name":"恢复期三证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>风痰瘀阻<\/td><td><mark>舌强语謇或失语<\/mark>，口舌歪斜，半身不遂，肢体麻木，舌紫暗，苔滑腻<\/td><td>搜风化痰，行瘀通络<\/td><td>解语丹<\/td><\/tr><tr><td>气虚络瘀<\/td><td>偏枯不用，<mark>肢软无力，面色萎黄<\/mark>，气短乏力，自汗，舌淡紫有瘀斑，脉细涩<\/td><td>益气养血，化瘀通络<\/td><td>补阳还五汤<\/td><\/tr><tr><td>肝肾亏虚<\/td><td>患肢<mark>僵硬拘挛变形<\/mark>，肌肉萎缩，舌强不语，脉细<\/td><td>滋养肝肾<\/td><td>左归丸合地黄饮子<\/td><\/tr><\/tbody><\/table><p>分期：急性期 2周内（中脏腑可至1个月），恢复期 2周–6个月，后遗症期 6个月以上。<\/p>","src":"讲义 6-3 诊断（分期）、恢复期和后遗症期(1)-(3); 题库 #28 #29 #34-#37 解析。讲义称“气虚血瘀”、治法“益气扶正，化瘀通络”；按题库十四五写“气虚络瘀”“益气养血，化瘀通络”"},{"id":"p8","name":"历代医家","teach":"<ul><li>《黄帝内经》：卒中昏迷称仆击、大厥、薄厥；半身不遂称偏枯、风痱。<\/li><li>张仲景《金匮要略》：<mark>“中风”病名始见<\/mark>。<\/li><li>刘完素“心火暴甚”；李东垣“正气自虚”；朱丹溪“痰生热，热生风”。<\/li><li>王履《医经溯洄集》：“真中风”“类中风”。<\/li><li>《医学发明》：“凡人年逾四旬，气衰之际……多有此疾”——指中风。<\/li><li>张景岳《景岳全书》：“中风非风”，内伤积损。<\/li><li>李中梓《医宗必读》：重证分<b>闭证、脱证<\/b>。<\/li><li>叶天士：明确以“内风”立论，滋阴息风、滋阴潜阳、开闭、固脱。<\/li><li>王清任：气虚血瘀立论，创<b>补阳还五汤<\/b>治偏瘫。<\/li><\/ul>","src":"讲义 6-3 历史沿革; 题库 #1-#4 #7-#9 #42 解析"}],"q":[{"n":1,"t":"A1型","q":"“中风”病名始见于","pre":"","o":[["A","《素问》"],["B","《丹溪心法》"],["C","《金匮要略》"],["D","《医学正传》"],["E","《景岳全书》"]],"a":"C","x":"汉·张仲景《金匮要略·中风历节病脉证并治》开始有“中风”病名。故选C。","p":"p8"},{"n":2,"t":"A1型","q":"在《医经溯洄集·中风辨》提出“真中风”和“类中风”病名的医家是","pre":"","o":[["A","刘河间"],["B","朱丹溪"],["C","李东垣"],["D","王履"],["E","张元素"]],"a":"D","x":"《医经溯洄集》的作者是王履。故选D。","p":"p8"},{"n":3,"t":"A1型","q":"明确以“内风”立论，认为“精血衰耗，水不涵木……肝阳偏亢，内风时起”，提出滋阴息风、滋阴潜阳以及开闭、固脱等治法的医家是","pre":"","o":[["A","刘河间"],["B","朱丹溪"],["C","李东垣"],["D","叶天士"],["E","张元素"]],"a":"D","x":"叶天士始明确以“内风”立论，认为“精血衰耗，水不涵木……肝阳偏亢，内风时起”，提出滋阴息风、滋阴潜阳以及开闭、固脱等治法。故选D。","p":"p8"},{"n":4,"t":"A1型","q":"王清任以气虚血瘀立论，创立治疗偏瘫并且至今仍应用于临床的方剂是","pre":"","o":[["A","血府逐瘀汤"],["B","补阳还五汤"],["C","桃红四物汤"],["D","复元活血汤"],["E","桃仁红花煎"]],"a":"B","x":"王清任以气虚血瘀立论，并创立补阳还五汤治疗偏瘫。故选B。","p":"p8"},{"n":5,"t":"A1型","q":"下列不属于中风病因的是","pre":"","o":[["A","内伤积损"],["B","饮食不节"],["C","情志过极"],["D","疮毒内侵"],["E","劳欲过度"]],"a":"D","x":"中风的发病主要因内伤积损、情志过极、饮食不节、劳欲过度等，致肝阳上亢，或痰热内生，引动内风，气血逆乱，直冲犯脑，或气虚无力运血，致血瘀脑脉或血溢脉外，致本病发生。故选D。","p":"p2"},{"n":6,"t":"A1型","q":"与中风密切相关的脏腑是","pre":"","o":[["A","心、肝、脾、肾"],["B","心、肺、肝、脾"],["C","肺、脾、肾、肝"],["D","心、肺、肝、肾"],["E","心、肺、脾、肾"]],"a":"A","x":"中风与心、肝、脾、肾关系密切。故选A。","p":"p2"},{"n":7,"t":"A1型","q":"《医学发明》云：“凡人年逾四旬，气衰之际，或因忧喜愤怒伤其气者，多有此疾。”“此疾”所指的疾病是","pre":"","o":[["A","郁证"],["B","厥证"],["C","癫狂"],["D","中风"],["E","胁痛"]],"a":"D","x":"语出《医学发明·中风有三》，此疾指中风。故选D。","p":"p8"},{"n":8,"t":"A1型","q":"下列把中风重证分为闭证和脱证的著作是","pre":"","o":[["A","《医学发明》"],["B","《丹溪心法》"],["C","《医宗必读》"],["D","《医学正传》"],["E","《景岳全书》"]],"a":"C","x":"李中梓《医宗必读·卷六》首次将中风重证分为闭证和脱证。故选C。","p":"p8"},{"n":9,"t":"A1型","q":"对于中风的病因认识，倡导“非风”之说的医家是","pre":"","o":[["A","张景岳"],["B","李中梓"],["C","叶天士"],["D","朱丹溪"],["E","王清任"]],"a":"A","x":"明·张景岳《景岳全书·非风》提出“中风非风”说，认为中风乃“内伤积损”。故选A。","p":"p8"},{"n":10,"t":"A1型","q":"中风的基本病机为","pre":"","o":[["A","阴阳失调，神机逆乱"],["B","阴阳失调，气血逆乱，上犯于脑"],["C","脑髓空虚，清窍失养"],["D","痰火上逆，扰动清窍"],["E","外邪阻滞经络，脑窍失养"]],"a":"B","x":"中风发病以气血不足或肝肾阴虚为本，以饮食不节、情志过极、劳欲过度为诱发因素，致瘀血阻滞，痰热内生，心火亢盛，肝阳上亢，导致阴阳严重失调，气血发生逆乱而致卒中。故选B。","p":"p2"},{"n":11,"t":"A1型","q":"下列属于中风先兆的临床表现为","pre":"","o":[["A","鼻痒、喷嚏、胸闷"],["B","高热、寒战"],["C","眩晕、胸闷"],["D","头痛、恶心呕吐、眼球震颤"],["E","头晕、一侧肢体麻木"]],"a":"E","x":"中风发病前常有如眩晕、头痛、耳鸣，或一过性言语不利或肢体麻木、视物昏花等先兆症状，一日内发作数次，或几日内多次发作。故选E。","p":"p1"},{"n":12,"t":"A1型","q":"下列不属于中风闭证特点的是","pre":"","o":[["A","突然昏仆"],["B","牙关紧闭"],["C","大便秘结"],["D","二便自遗"],["E","肢体强痉"]],"a":"D","x":"中风闭证为邪气内闭清窍所致，可见肢体强痉、口噝不开、牙关紧闭、两手握固、大便秘结等症，而二便自遗是中风脱证的表现。故选D。","p":"p3"},{"n":13,"t":"A1型","q":"下列何种病理因素是中风阳闭、阴闭的鉴别要点","pre":"","o":[["A","痰浊"],["B","火热"],["C","血瘀"],["D","气滞"],["E","肝风"]],"a":"B","x":"阳闭症状兼有面赤身热，口臭气粗，躁扰不宁，舌红，苔黄腻，脉弦滑数，突出热象；阴闭可有面白唇暗，四肢不温，痰涎壅盛，舌淡苔腻，脉沉滑或缓，则是阴寒之象。故选B。","p":"p5"},{"n":14,"t":"A1型","q":"下列关于中风辨证要点的叙述正确的是","pre":"","o":[["A","首辨闭证与脱证"],["B","中经络者辨闭证与脱证"],["C","中经络者仅出现肢体不用，无口眼歪斜"],["D","中经络者意识清楚，中脏腑者神志昏迷"],["E","脱证常骤然起病"]],"a":"D","x":"中风辨证方面首辨中经络与中脏腑，中经络者表现为半身不遂，肌肤不仁，口舌歪斜，中脏腑者伴有神志昏蒙或神志恍惚；中脏腑进一步需鉴别闭证与脱证，其中风阳痰火炽盛耗灼阴精，阴虚及阳，阴竭阳亡，阴阳离决，则出现脱证，所以脱证非骤然起病。故选D。","p":"p3"},{"n":15,"t":"A1型","q":"下列有关中风的论述错误的是","pre":"","o":[["A","中经络以平肝息风、化痰祛瘀通络为主"],["B","中脏腑闭证，治当息风清火，豁痰开窍，通腑泄热"],["C","对内闭外脱之证，则须醒神开窍与扶正固脱兼用"],["D","脱证急宜救阴回阳固脱"],["E","发作时口吐白沫"]],"a":"E","x":"中经络之证，病位较浅，每因风痰瘀阻滞经脉，或肝风夹痰引发，治以平肝息风、化痰祛瘀通络为主；中脏腑之证为风阳痰火蒙蔽清窍，治当息风清火，豁痰开窍，通腑泄热；中脏腑因邪正虚实的不同，有闭、脱之分，又可出现内闭外脱、由闭转脱的演变，对内闭外脱之证，则须醒神开窍与扶正固脱兼用；脱证急宜救阴回阳固脱。发作时口吐白沫是痫病的症状。故选E。","p":"p3"},{"n":16,"t":"A1型","q":"中风之中经络与中脏腑之区别在于","pre":"","o":[["A","有无神志不清"],["B","有无后遗症"],["C","外风与内风"],["D","夹痰与夹瘀"],["E","有无半身不遂"]],"a":"A","x":"中风中经络、中脏腑均有半身不遂，肌肤不仁，口舌歪斜症状；中经络病位较浅，病情较轻，多不伴有神志昏蒙或神志恍惚；中脏腑病位较深，病情较重，多伴有神志昏蒙或神志恍惚。故选A。","p":"p3"},{"n":17,"t":"A1型","q":"治疗中风中经络阴虚风动的代表方剂是","pre":"","o":[["A","羚角钩藤汤"],["B","天麻钩藤饮"],["C","镇肝息风汤"],["D","解语丹"],["E","地黄饮子"]],"a":"C","x":"中风阴虚风动的病机是肝肾亏虚，风阳内动，上扰清窍，治疗当用镇肝息风汤滋养肝肾，潜阳息风。故选C。","p":"p4"},{"n":18,"t":"A1型","q":"用天麻钩藤饮治疗中风中经络风阳上扰，若头痛较重，应加用","pre":"","o":[["A","生地、沙参"],["B","龙胆草、栀子"],["C","厚朴、元明粉"],["D","羚羊角、夏枯草"],["E","熟地黄、山药"]],"a":"D","x":"中经络风阳上扰，若头痛较重，加羚羊角、夏枯草以助清肝息风之用。故选D。","p":"p4"},{"n":19,"t":"A1型","q":"治疗中风中脏腑痰火瘀闭的代表方剂是","pre":"","o":[["A","参附汤合生脉散加减"],["B","羚角钩藤汤，另服至宝丹或安宫牛黄丸"],["C","桃仁承气汤合涤痰汤加减"],["D","涤痰汤，另用苏合香丸"],["E","左归丸合地黄饮子加减"]],"a":"B","x":"治疗中风中脏腑痰火瘀闭的代表方剂为羚角钩藤汤，另服至宝丹或安宫牛黄丸以清心开窍。故选B。","p":"p5"},{"n":20,"t":"A1型","q":"下列哪项不属于中风急性期的治疗方法","pre":"","o":[["A","益气养血"],["B","平肝潜阳"],["C","化痰息风"],["D","清热通腑"],["E","活血化瘀"]],"a":"A","x":"中风急性期，当急则治其标，以祛邪为主，常用平肝息风、化痰通腑、活血通络等治法。如为中脏腑者，当以醒神开窍为治则，闭证宜清热开窍或化痰开窍，脱证则回阳固脱，如内闭外脱并存，则醒神开窍与扶正固本兼用。益气养血多为中风恢复期所选治法。故选A。","p":"p3"},{"n":21,"t":"A2型","q":"郭某，男，62岁。平素急躁，常感头晕头痛，耳鸣目眩，突然发生口眼歪斜，舌强语謇，手足重滞，但其神志清楚，舌质红苔黄，脉弦而有力。治疗方选","pre":"","o":[["A","镇肝息风汤"],["B","桃仁承气汤"],["C","羚角钩藤汤"],["D","涤痰汤"],["E","天麻钩藤饮"]],"a":"E","x":"患者突然发生口眼歪斜，舌强语謇，手足重滞，是中风的特征性表现，因神志清楚，故诊断为中经络。平素急躁，肝阳上亢，故见头痛头晕耳鸣；风阳上扰，血随气逆，脉络瘀阻，见口眼歪斜，舌强语謇；舌质红苔黄，脉弦而有力，提示有热象。故辨为风阳上扰证，代表方剂为天麻钩藤饮。故选E。","p":"p4"},{"n":22,"t":"A2型","q":"患者，男，48岁。3天前突发右侧身体无力，肌肤不仁，口舌歪斜，言语不利，头晕目眩，咳黏稠痰，伴腹胀，便秘，舌质暗红，苔黄腻，脉弦滑。辨证应属","pre":"","o":[["A","风阳上扰"],["B","风痰入络"],["C","痰热腑实"],["D","气虚血瘀"],["E","阴虚风动"]],"a":"C","x":"中风证兼见痰多质黏、腹胀、便秘等症状，结合舌、脉，辨为痰热腑实证。故选C。","p":"p5"},{"n":23,"t":"A2型","q":"王某，男，58岁。突然昏仆，不省人事，牙关紧闭，口噝不开，两手握固，大小便闭，肢体偏瘫，拘急、抽搐。辨证应属","pre":"","o":[["A","风痰瘀阻"],["B","气虚络瘀"],["C","肝肾亏虚"],["D","中脏腑脱证"],["E","中脏腑闭证"]],"a":"E","x":"患者突然昏仆，不省人事，是中脏腑的特征性表现。牙关紧闭，口噝不开，两手握固，大小便闭，肢体偏瘫，拘急抽搐，是闭证的诊断依据。故选E。","p":"p3"},{"n":24,"t":"A2型","q":"李某，男，45岁。头晕头痛，手足麻木，突然发生口舌歪斜，口角流涎，舌强语謇，半身不遂，舌质紫暗，有瘀斑，苔薄白腻，脉弦涩。其证机概要为","pre":"","o":[["A","脉络空虚，风痰乘虚入中，气血闭阻"],["B","肝阳暴张，阳亢风动，痰火壅盛，气血上逆，神窍闭阻"],["C","痰浊偏盛，上壅清窍，内蒙心神，神机闭塞"],["D","气血运行不利"],["E","肝阳化风，风阳上扰，横窜经络"]],"a":"A","x":"患者头晕头痛，手足麻木，突然发生口舌歪斜，口角流涎，舌强语謇，半身不遂，苔白腻，辨为中经络风痰入络；舌质紫暗，有瘀斑，脉弦涩，示有气血瘀阻之病机。故选A。","p":"p4"},{"n":25,"t":"A2型","q":"患者突然昏仆，不省人事，牙关紧闭，口噝不开，两手握固，大小便闭，肢体强痉，面赤身热，气粗口臭，躁扰不宁，舌苔黄腻，脉弦滑而数。治疗方选","pre":"","o":[["A","天麻钩藤饮"],["B","星蒌承气汤"],["C","补阳还五汤"],["D","羚角钩藤汤"],["E","镇肝息风汤"]],"a":"D","x":"根据患者症状表现，可诊断为中风闭证；兼面赤身热，气粗口臭，躁扰不宁，舌苔黄腻，脉弦滑而数，辨为闭证的痰火瘀闭。治疗方选羚角钩藤汤，另服至宝丹或安宫牛黄丸以清心开窍。故选D。","p":"p5"},{"n":26,"t":"A2型","q":"患者突然昏仆，不省人事，牙关紧闭，口噝不开，两手握固，大小便闭，肢体强痉，面白唇暗，静卧不烦，四肢不温，痰涎壅盛，苔白腻，脉沉滑缓。辨证应属","pre":"","o":[["A","中经络"],["B","脱证"],["C","中脏腑"],["D","阳闭"],["E","阴闭"]],"a":"E","x":"根据患者症状，可诊断为中风闭证。闭证可分为阳闭和阴闭，由面白唇暗，静卧不烦，四肢不温，痰涎壅盛，苔白腻，脉沉滑缓，可辨为阴闭。故选E。","p":"p5"},{"n":27,"t":"A2型","q":"赵某，男，58岁。突然昏仆，不省人事，面色苍白，目合口张，鼻鼾息微，手撒肢冷，汗多，大小便自遗，肢体软瘫，舌痿，脉微欲绝。治疗方选","pre":"","o":[["A","归脾汤"],["B","参附汤合生脉散加味"],["C","六味地黄丸"],["D","肾气丸"],["E","补阳还五汤"]],"a":"B","x":"据患者突然昏仆、不省人事、肢体软瘫，可诊断为中风中脏腑。面色苍白，目合口张，鼻鼾息微，手撒肢冷，汗多，大小便自遗，舌痿，脉微欲绝，是脱证的表现。治疗代表方剂是参附汤合生脉散加减。归脾汤可用治疗心血不足之心悸及心脾两虚之不寐等病证；六味地黄丸三补三泻，常用于肝肾阴虚之证；肾气丸可治疗肾阳衰微的水肿；补阳还五汤治疗中风后遗症期气虚络瘀。故选B。","p":"p6"},{"n":28,"t":"A2型","q":"张某，男，63岁。患者中风5个月。现症见肢体偏枯不用，肢软无力，面色萎黄，舌质淡紫，有瘀斑，苔薄白，脉细涩。辨证应属","pre":"","o":[["A","风痰瘀阻"],["B","肝肾亏虚"],["C","闭证"],["D","脱证"],["E","气虚络瘀"]],"a":"E","x":"案例中患者表现为肢体偏枯不用，肢软无力，面色萎黄，表明是中风恢复期气血衰少；舌象与脉象是脉络瘀阻的表现。故选E。","p":"p7"},{"n":29,"t":"A2型","q":"中风后遗症患者，舌强言謇，言语不清，或舌喑不语，伸舌多偏斜，属风痰瘀阻，舌窍不利。治疗方选","pre":"","o":[["A","大活络丹"],["B","小续命汤"],["C","天麻钩藤饮"],["D","建瓴汤"],["E","解语丹"]],"a":"E","x":"本题考查中风后遗症期的辨证论治。风痰瘀阻方选解语丹以搜风化痰通络。故选E。","p":"p7"},{"n":30,"t":"A2型","q":"患者中风闭证阴闭，出现面赤，颧红如妆。治疗方选","pre":"","o":[["A","四逆汤"],["B","生脉散"],["C","苏合香丸"],["D","白通加猪胆汁汤"],["E","清开灵注射液"]],"a":"D","x":"中风闭证见面赤、颧红如妆等症状，为戴阳证，属病情恶化，需急进参附汤、白通加猪胆汁汤救治。故选D。","p":"p5"},{"n":31,"t":"A3型","q":"该患者最可能的诊断是","pre":"患者，男，76岁。2小时前突然昏倒，不省人事，半身不遂，二便闭结，牙关紧闭，面赤身热，气粗口臭，躁扰不宁，舌质红，苔黄腻，脉弦滑而数。","o":[["A","痫证"],["B","痿证"],["C","厥证"],["D","中风"],["E","痉证"]],"a":"D","x":"中风表现为突然昏仆，不省人事，半身不遂等。故选D。","p":"p1"},{"n":32,"t":"A3型","q":"其证候类型是","pre":"患者，男，76岁。2小时前突然昏倒，不省人事，半身不遂，二便闭结，牙关紧闭，面赤身热，气粗口臭，躁扰不宁，舌质红，苔黄腻，脉弦滑而数。","o":[["A","风痰入络"],["B","风阳上扰"],["C","痰热腑实"],["D","阴虚风动"],["E","痰火瘀闭"]],"a":"C","x":"根据患者有无昏迷中风分为中经络和中脏腑，中脏腑又分为闭证与脱证。根据患者临床表现，宜诊断为阳闭之痰热腑实证。故选C。","p":"p5"},{"n":33,"t":"A3型","q":"治疗此证应首选的方剂是","pre":"患者，男，76岁。2小时前突然昏倒，不省人事，半身不遂，二便闭结，牙关紧闭，面赤身热，气粗口臭，躁扰不宁，舌质红，苔黄腻，脉弦滑而数。","o":[["A","镇肝息风汤加减"],["B","天麻钩藤饮加减"],["C","半夏白术天麻汤合桃仁红花煎加减"],["D","涤痰汤合用苏合香丸加减"],["E","羚角钩藤汤，另服安宫牛黄丸"]],"a":"E","x":"此证宜选羚角钩藤汤，另服安宫牛黄丸治疗以息风清火，豁痰开窍。故选E。","p":"p5"},{"n":34,"t":"A3型","q":"其证候类型是","pre":"患者，男，65岁。半身不遂10余年，肌肤不仁，口舌歪斜，言语不利，面色无华，气短乏力，自汗，心悸，便溏，舌质暗淡，舌苔薄白，脉沉细。","o":[["A","风阳上扰"],["B","风痰阻络"],["C","痰热腑实"],["D","阴虚风动"],["E","气虚络瘀"]],"a":"E","x":"患者半身不遒10余年，肌肤不仁，口舌歪斜，言语不利，可诊断为中风后遗症期。结合兼症，面色无华，气短乏力，自汗，及舌脉表现，可辨为气虚络瘀证。故选E","p":"p7"},{"n":35,"t":"A3型","q":"治疗方选","pre":"患者，男，65岁。半身不遂10余年，肌肤不仁，口舌歪斜，言语不利，面色无华，气短乏力，自汗，心悸，便溏，舌质暗淡，舌苔薄白，脉沉细。","o":[["A","天麻钩藤饮"],["B","镇肝息风汤"],["C","补阳还五汤"],["D","半夏白术天麻汤"],["E","桃仁承气汤"]],"a":"C","x":"中风后遗症期气虚络瘀，病机为气虚血滞，瘀阻脉络，治宜补阳还五汤益气养血，化瘀通络。故选C。","p":"p7"},{"n":36,"t":"B型","q":"治疗中风恢复期气虚络瘀的代表方剂是","pre":"","o":[["A","解语丹"],["B","真方白丸子"],["C","血府逐瘀汤"],["D","补阳还五汤"],["E","左归丸合地黄饮子加减"]],"a":"D","x":"治疗中风恢复期气虚络瘀的代表方剂为补阳还五汤，用以益气养血，化瘀通络。故选D。","p":"p7"},{"n":37,"t":"B型","q":"治疗中风恢复期肝肾亏虚的代表方剂是","pre":"","o":[["A","解语丹"],["B","真方白丸子"],["C","血府逐瘀汤"],["D","补阳还五汤"],["E","左归丸合地黄饮子加减"]],"a":"E","x":"治疗中风恢复期肝肾亏虚的代表方剂是左归丸合地黄饮子加减。故选E。","p":"p7"},{"n":38,"t":"B型","q":"上述各项，属痫证临床特征的是","pre":"","o":[["A","猝发仆地，时常口中作声，四肢抽搐，口吐白沫"],["B","双下肢或四肢瘫痪，或肌肉萎缩"],["C","昏仆倒地，不省人事，半身不遂，舌强语謇"],["D","伴有四肢逆冷，移时多可自行苏醒"],["E","四肢抽搐，项背强直，甚至角弓反张"]],"a":"A","x":"痫证发作时精神恍惚，甚则突然仆倒，两目上视，口吐涎沫，四肢抽搐，或口中怪叫。故选A。","p":"p1"},{"n":39,"t":"B型","q":"上述各项，属中风临床特征的是","pre":"","o":[["A","猝发仆地，时常口中作声，四肢抽搐，口吐白沫"],["B","双下肢或四肢瘫痪，或肌肉萎缩"],["C","昏仆倒地，不省人事，半身不遂，舌强语謇"],["D","伴有四肢逆冷，移时多可自行苏醒"],["E","四肢抽搐，项背强直，甚至角弓反张"]],"a":"C","x":"中风以昏仆倒地、不省人事、半身不遂、舌强语謇为主要临床表现。故选C。","p":"p1"},{"n":40,"t":"B型","q":"中风中脏腑阳闭的主要病机是","pre":"","o":[["A","脉络空虚，风邪乘虚入中，气血闭阻"],["B","肝肾阴虚，阳亢化风，上扰清空"],["C","肝阳暴张，阳亢风动，痰火壅盛，气血上逆，神窍闭阻"],["D","痰浊偏盛，上壅清窍，内蒙心神，神机闭塞"],["E","阴虚及阳，阴竭阳亡，阴阳离决"]],"a":"C","x":"阳闭主要表现为面赤身热，口臭气粗，或痰多而黏，伴腹胀、便秘等，突出痰火之象，因此病机属痰火壅盛致神窍闭阻。故选C。","p":"p5"},{"n":41,"t":"B型","q":"中风脱证的主要病机是","pre":"","o":[["A","脉络空虚，风邪乘虚入中，气血闭阻"],["B","肝肾阴虚，阳亢化风，上扰清空"],["C","肝阳暴张，阳亢风动，痰火壅盛，气血上逆，神窍闭阻"],["D","痰浊偏盛，上壅清窍，内蒙心神，神机闭塞"],["E","阴虚及阳，阴竭阳亡，阴阳离决"]],"a":"E","x":"风阳痰火炽盛，致阴精耗损，阴虚及阳，阴竭阳亡，阳脱于外，阴阳离决，即出现脱证。故选E。","p":"p6"},{"n":42,"t":"多选","q":"《黄帝内经》中记载的中风名称包括","pre":"","o":[["A","仆击"],["B","风痱"],["C","大厥"],["D","偏枯"],["E","薄厥"]],"a":"ABCDE","x":"中风的记载始见于《黄帝内经》，书中称卒中昏迷为“仆击”“大厥”“薄厥”，称半身不遂为“偏枯”“偏风”“身偏不用”“风痱”等。故选A、B、C、D、E。","p":"p8"},{"n":43,"t":"多选","q":"中风发病主要有内伤积损、情志过极、饮食不节、劳欲过度等病因，其病理因素包括","pre":"","o":[["A","火（热）"],["B","瘀"],["C","痰"],["D","风"],["E","虚"]],"a":"ABCDE","x":"气血不足或肝肾阴虚是致病之本，风、火、痰、瘀是发病之标。故选A、B、C、D、E。","p":"p2"},{"n":44,"t":"多选","q":"下列可作为中风诊断主要依据的临床表现为","pre":"","o":[["A","半身不遂"],["B","口舌歪斜、言语不利"],["C","突然昏仆、不省人事"],["D","口中怪叫"],["E","肌肤不仁"]],"a":"ABCE","x":"中风以猝然昏仆、不省人事、半身不遂、口舌歪斜、肌肤不仁为主症，病轻者可无昏仆而仅见口舌歪斜及半身不遂等症。故选A、B、C、E。","p":"p1"},{"n":45,"t":"多选","q":"下列属于中风先兆的临床表现为","pre":"","o":[["A","一过性言语不利或肢体麻木"],["B","视物昏花"],["C","伴外感表证或耳背疼痛"],["D","眩晕、头痛、耳鸣"],["E","颈项强直，四肢肌肉萎缩"]],"a":"ABD","x":"中风发病前常有先兆症状，如眩晕，头痛，耳鸣，或一过性言语不利，或肢体麻木，视物昏花，一日内发作数次，或几日内多次发作。故选A、B、D。","p":"p1"}]},"06-04":{"name":"痴呆","lecture":"6-4 痴呆.pdf","points":[{"id":"p1","name":"概念·诊断·鉴别","teach":"<p><b>痴呆<\/b>：以<mark>获得性智能缺损<\/mark>为主，主症善忘、失语、失认、失用、执行不能、生活能力下降，又称呆病。常见表现＝善忘、呆傻愚笨、智能缺损。<\/p><p><b>诊断四条<\/b>：①善忘 ②智能缺损（1项或以上）③生活或工作能力下降 ④除外郁证、癫狂、谵妄。心境不佳、表情淡漠、少言寡语是郁证表现，<b>不属<\/b>痴呆诊断要点。<\/p><table><thead><tr><th>鉴别<\/th><th>痴呆<\/th><th>对方<\/th><\/tr><\/thead><tbody><tr><td>健忘<\/td><td>渐进加重，<mark>智能缺失<\/mark>，生活能力受损<\/td><td>无渐进，无智能缺失，生活正常<\/td><\/tr><tr><td>郁证<\/td><td>以智能症状为主<\/td><td>以抑郁为主，无智能缺损，抗抑郁有效<\/td><\/tr><tr><td>癫狂<\/td><td>早期即善忘、智能缺失<\/td><td>早期以情志失常为主，后期才智能缺损<\/td><\/tr><\/tbody><\/table><p>病例：记忆、计算力减退＋兴趣缺失，或洁秽不分、亲疏不辨＋善忘 → 痴呆（不是健忘、癫证）。<\/p>","src":"讲义 6-4 概述、诊断、鉴别诊断; 题库 #1 #6 #9 #47 #29 #34 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：禀赋不足、后天失养、年老肾虚、情志所伤、中风外伤（久病耗损）。<mark>感受六淫<\/mark>不在其中。<\/p><p><b>基本病机<\/b>：<mark>髓减脑消，神机失用<\/mark>。（对比：痫证＝气机逆乱，元神失控。）<\/p><p><b>病位<\/b>在脑，与心、肝、脾、肾相关（不含肺），<b>尤与肾虚<\/b>关系密切，本虚主要是肾虚。<\/p><p><b>病理因素<\/b>：痰、瘀、火为主（可动风），<mark>寒凝不属<\/mark>。<\/p><p><b>病性<\/b>：本虚标实。本虚辨精、气、血；标实辨痰、瘀、火。<\/p>","src":"讲义 6-4 病因、病机、辨虚实; 题库 #7 #8 #10 #18 #43 #44 #50 #51 解析"},{"id":"p3","name":"分期论治与治则","teach":"<table><thead><tr><th>期<\/th><th>特点<\/th><th>常见证<\/th><th>重点<\/th><\/tr><\/thead><tbody><tr><td>平台期<\/td><td>多虚；以智能缺损为主，少见情志异常，相对稳定<\/td><td>髓海不足、脾肾亏虚、气血不足<\/td><td>肾虚为主，<mark>补肾<\/mark><\/td><\/tr><tr><td>波动期<\/td><td>虚实夹杂；智能缺损较重，常见行为症状，明显波动<\/td><td>痰浊蒙窍、瘀阻脑络、心肝火旺<\/td><td>痰浊为主，<mark>治痰<\/mark>（兼补脾）<\/td><\/tr><tr><td>下滑期<\/td><td>正虚极＋热毒盛；智能丧失殆尽，神惫如寐、知动失司、形神失控、虚极风动；躯体性日常生活能力相对保留<\/td><td>热毒内盛<\/td><td>热毒为主，<mark>解毒为急<\/mark>（勿忘大补元气）<\/td><\/tr><\/tbody><\/table><p><b>治则<\/b>：补虚泻实。补虚＝补肾填精益髓、健脾补气血（治本）；泻实＝开郁逐痰、活血通窍、平肝泻火（治标）。可加血肉有情之品，兼顾脾胃；但要<b>缓补不峻补，补而不腻<\/b>，以免生痰（“重加滋腻”是错的）。各期可交叉，方药随时调整。<\/p>","src":"讲义 6-4 病机(初/中/后期)、辨证要点(识病期)、治则治法、临证备要; 题库 #11 #12 #45 #46 #48 #52 #53 解析"},{"id":"p4","name":"髓海不足证","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>髓海不足<\/td><td>忘失前后，兴趣缺失，起居怠惰，行走缓慢，甚则振掉；<mark>腰胫酸软，齿枯发焦，脑转耳鸣，目无所见<\/mark>；舌瘦色淡，脉沉细<\/td><td>滋补肝肾，填精补髓<\/td><td>七福饮<\/td><\/tr><\/tbody><\/table><p>证机：肾精亏虚，髓海失养。题库治法也写作“滋补肝肾，生精养髓”，两种写法都认。<\/p><p><b>加减<\/b>：<\/p><ul><li>心烦溲赤，舌红少苔，脉细弦数 → <b>知柏地黄丸<\/b>加丹参、莲子心<\/li><li>舌红苔黄腻 → 加<b>清心滚痰丸<\/b><\/li><li>病重 → 加肉苁蓉、鹿角胶、龟板胶等<\/li><\/ul>","src":"讲义 6-4 证治分类 1.髓海不足; 题库 #21 #24 #26 #30 #31 #32 #33 #37 #39 解析（#39 治法“生精养髓”从题库）"},{"id":"p5","name":"脾肾亏虚 vs 气血不足","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>脾肾亏虚<\/td><td>迷惑善忘，易惊善恐，食少纳呆，口涎外溢；<mark>四肢不温，小便混浊，夜尿频多<\/mark>；舌淡胖有齿痕，脉沉细弱、两尺尤甚<\/td><td>温补脾肾，养元安神<\/td><td>还少丹<\/td><\/tr><tr><td>气血不足<\/td><td>善忘茫然，不识人物，多梦易惊，少言倦怠；<mark>面唇无华，爪甲苍白<\/mark>，纳呆便溏；舌淡苔白，脉细弱<\/td><td>益气健脾，养血安神<\/td><td>归脾汤<\/td><\/tr><\/tbody><\/table><p>两证都纳呆。见<b>阳虚<\/b>（肢冷、夜尿）→ 脾肾亏虚；见<b>血虚<\/b>（面唇、爪甲淡白）→ 气血不足。二证与髓海不足同属平台期。<\/p>","src":"讲义 6-4 证治分类 2.脾肾亏虚 3.气血不足; 题库 #14 #23 #27 #28 解析"},{"id":"p6","name":"痰浊蒙窍 vs 瘀阻脑络","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰浊蒙窍<\/td><td>表情呆滞，忽歌忽笑，洁秽不分，亲疏不辨；<mark>口吐痰涎，体肥懒动，苔黏腻浊<\/mark>，脉弦滑<\/td><td>化痰开窍，健脾醒神<\/td><td>洗心汤<\/td><\/tr><tr><td>瘀阻脑络<\/td><td>喜忘，神呆，妄思离奇；<mark>头痛难愈，面色晦暗，伴半身不遂<\/mark>、口眼歪斜；舌紫瘀斑<\/td><td>活血化瘀，通窍醒神<\/td><td>通窍活血汤<\/td><\/tr><\/tbody><\/table><p>痰浊蒙窍若<b>言语颠倒，歌笑不休，反喜污秽<\/b>（喜食炭）→ <b>改用转呆丹<\/b>。<\/p><p>题库痰浊蒙窍治法有时写“化痰开窍，醒神益智”，遇到也认。<\/p>","src":"讲义 6-4 证治分类 4.痰浊蒙窍 5.瘀阻脑络; 题库 #13 #15 #20 #22 #25 #35 #36 #38 #40 #41 解析（#35 解析写“醒神益智”，讲义与答案选项为“健脾醒神”）"},{"id":"p7","name":"心肝火旺 vs 热毒内盛","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>心肝火旺（波动期）<\/td><td>急躁易怒，妄闻妄见；<mark>头晕目眩，耳鸣如潮，口臭口疮<\/mark>，尿赤便干；舌红苔黄，脉弦数<\/td><td>清心平肝，安神定志<\/td><td>天麻钩藤饮<\/td><\/tr><tr><td>热毒内盛（下滑期）<\/td><td><mark>迷蒙昏睡，无欲无语，二便失禁，肢体僵硬或痫痉<\/mark>，躁扰甚至狂越；舌红绛，苔黏腻浊或腐秽<\/td><td>清热解毒，通络达邪<\/td><td>黄连解毒汤<\/td><\/tr><\/tbody><\/table><p>心肝火旺若<b>烦躁不安属热毒炽盛<\/b> → 用安宫牛黄丸。热毒内盛痰迷热闭 → 合至宝丹；虚极生风 → 合紫雪丹。<\/p>","src":"讲义 6-4 证治分类 6.心肝火旺 7.热毒内盛; 题库 #16 #17 #19 #42 解析"},{"id":"p8","name":"医家·预防调护","teach":"<ul><li><b>张景岳<\/b>《景岳全书》：提出“痴呆”病名；“速扶正气”，创<b>七福饮、大补元煎<\/b><\/li><li><b>陈士铎<\/b>《辨证录·呆病门》：<mark>因郁、因痰致呆<\/mark>，开郁逐痰，创<b>洗心汤、转呆丹<\/b><\/li><li><b>王清任<\/b>《医林改错·脑髓说》：<mark>“灵机记性，不在心在脑”<\/mark><\/li><li>王叔和称“健忘”，巢元方称“多忘”，孙思邈称“好忘”<\/li><\/ul><p><b>预防调护<\/b>：危险人群在无症状期干预，前驱期积极治疗、跟踪随访；饮食清淡，生活规律；帮患者正确对待疾病、解除情志刺激。精神调理、智能训练、饮食、运动对治疗<b>意义重大<\/b>（说“意义不大”是错的）。<\/p>","src":"讲义 6-4 历史沿革、预防调护; 题库 #2 #3 #4 #5 #49 解析"}],"q":[{"n":1,"t":"A1型","q":"由于髓减脑消，神机失用而致的以呆傻愚笨为主要临床表现的神志疾病是","pre":"","o":[["A","郁病"],["B","癫病"],["C","健忘"],["D","痴呆"],["E","痫病"]],"a":"D","x":"痴呆的基本病机为髓减脑消，神机失用。故选D。","p":"p1"},{"n":2,"t":"A1型","q":"提出以“速扶正气为主，宜七福饮，或大补元煎主之”治疗痴呆的医家是","pre":"","o":[["A","张仲景"],["B","张景岳"],["C","葛洪"],["D","王孟英"],["E","陈士铎"]],"a":"B","x":"张景岳创立七福饮、大补元煎。故选B。","p":"p8"},{"n":3,"t":"A1型","q":"用“洗心汤”治疗痴呆的医家是","pre":"","o":[["A","张仲景"],["B","葛洪"],["C","陈士铎"],["D","张景岳"],["E","王孟英"]],"a":"C","x":"陈士铎《辨证录》创制洗心汤、转呆丹等方。故选C。","p":"p8"},{"n":4,"t":"A1型","q":"设立了“呆病”专篇，而且提出了“呆病成于郁”和“呆病成于痰”两种病机学说的著作是","pre":"","o":[["A","《金匮要略》"],["B","《千金要方》"],["C","《丹溪心法》"],["D","《辨证录》"],["E","《临证指南医案》"]],"a":"D","x":"陈士铎《辨证录》强调因郁、因痰致呆。故选D。","p":"p8"},{"n":5,"t":"A1型","q":"明确指出痴呆的病位不在心在脑，认为“灵机记性，不在心在脑”的医家是","pre":"","o":[["A","王清任"],["B","张景岳"],["C","葛洪"],["D","王孟英"],["E","陈士铎"]],"a":"A","x":"王清任《医林改错·脑髓说》谓：“灵机记性，不在心在脑。”故选A。","p":"p8"},{"n":6,"t":"A1型","q":"下列不属于痴呆诊断要点的是","pre":"","o":[["A","善忘，包括短期记忆或长期记忆减退"],["B","智能缺损，包括失语、失认、失用、执行不能等"],["C","生活或工作能力部分或完全丧失"],["D","除外如郁证、癫狂、谵妄等引起智能缺损的其他原因"],["E","心境不佳、表情淡漠、少言寡语"]],"a":"E","x":"痴呆诊断不包括心境不佳、表情淡漠、少言寡语。故选E。","p":"p1"},{"n":7,"t":"A1型","q":"痴呆病位主要在","pre":"","o":[["A","脑"],["B","心"],["C","肝"],["D","脾"],["E","肾"]],"a":"A","x":"痴呆病位在脑，与心、肝、脾、肾功能失调相关。故选A。","p":"p2"},{"n":8,"t":"A1型","q":"痴呆的基本病机为","pre":"","o":[["A","心气虚衰，心血不足"],["B","以虚为本，虚实夹杂"],["C","气机不畅，血行瘀滞"],["D","肾精亏损，痰蒙清窍"],["E","髓减脑消，神机失用"]],"a":"E","x":"痴呆的基本病机为髓减脑消，神机失用。故选E。","p":"p2"},{"n":9,"t":"A1型","q":"下列临床表现可作为痴呆与健忘鉴别要点的是","pre":"","o":[["A","善忘前事"],["B","善忘后事"],["C","智能缺失"],["D","神志障碍"],["E","沉默寡言"]],"a":"C","x":"痴呆也有健忘症状，通常有渐进加重，且智能缺失，生活能力同时受损。故选C。","p":"p1"},{"n":10,"t":"A1型","q":"痴呆病性属本虚标实，其本虚主要是","pre":"","o":[["A","肾虚"],["B","肝虚"],["C","脾虚"],["D","心虚"],["E","肺虚"]],"a":"A","x":"痴呆与心、肝、脾、肾功能失调相关，尤其与肾虚关系密切。故选A。","p":"p2"},{"n":11,"t":"A1型","q":"下列对痴呆波动期特征的描述，不正确的是","pre":"","o":[["A","病情多虚实夹杂"],["B","病机多属痰浊蒙窍、瘀阻脑络、心肝火旺"],["C","病情多表现为虚证"],["D","一般智能缺损症状较重"],["E","常见行为症状，病情明显波动"]],"a":"C","x":"痴呆波动期多属虚实夹杂。故选C。","p":"p3"},{"n":12,"t":"A1型","q":"痴呆分期论治指明了本病不同阶段的治疗重点，下列关于痴呆分期不正确的是","pre":"","o":[["A","平台期以肾虚为主，补肾为法"],["B","波动期以痰浊为主，重在治痰"],["C","下滑期以热毒为主，解毒为急"],["D","各期常相互交叉或重叠，治法方药应随机调整"],["E","平台期以脾虚湿盛为主，重在补脾"]],"a":"E","x":"平台期以肾虚为主，补肾为法。故选E。","p":"p3"},{"n":13,"t":"A1型","q":"治疗痴呆瘀阻脑络的代表方剂是","pre":"","o":[["A","还少丹"],["B","洗心汤"],["C","七福饮"],["D","转呆丹"],["E","通窍活血汤"]],"a":"E","x":"治疗痴呆瘀阻脑络的代表方剂是通窍活血汤。故选E。","p":"p6"},{"n":14,"t":"A1型","q":"痴呆脾肾亏虚的治法是","pre":"","o":[["A","滋补肝肾，填精补髓"],["B","健脾化浊，豁痰开窍"],["C","活血化瘀，通窍醒神"],["D","益气养血，清心宣窍"],["E","温补脾肾，养元安神"]],"a":"E","x":"痴呆脾肾亏虚的治法是温补脾肾，养元安神。故选E。","p":"p5"},{"n":15,"t":"A1型","q":"痴呆痰浊蒙窍，伴若言语颠倒，歌笑不休，甚至反喜污秽，喜食炭，治疗方选","pre":"","o":[["A","还少丹"],["B","洗心汤"],["C","转呆丹"],["D","七福饮"],["E","肾气丸"]],"a":"C","x":"痴呆痰浊蒙窍，伴若言语颠倒，歌笑不休，甚至反喜污秽，喜食炭，选用转呆丹。故选C。","p":"p6"},{"n":16,"t":"A1型","q 多虚实夹杂"],["C","多表现为髓海不足、脾肾亏虚、气血不足"],["D","临床表现以智能缺损症状为主"],["E","少见情志异常症状，病情相对稳定"]],"a":"ACDE","x":"平台期以虚为主，故排除B，选A、C、D、E。","p":"p3"}]},"06-05":{"name":"癫狂","lecture":"6-5 癫狂.pdf","points":[{"id":"p1","name":"癫 vs 狂·诊断鉴别","teach":"<table><thead><tr><th><\/th><th>癫<\/th><th>狂<\/th><\/tr><\/thead><tbody><tr><td>属性<\/td><td>阴（重阴者癫）<\/td><td>阳（重阳者狂）<\/td><\/tr><tr><td>表现<\/td><td>精神抑郁，表情淡漠，<mark>沉默呆钝，静而少动<\/mark>，语无伦次或喃喃自语<\/td><td>精神亢奋，狂躁刚暴，喧扰不宁，毁物打骂，<mark>动而多怒<\/mark><\/td><\/tr><tr><td>起病<\/td><td>多缓，痰气作祟<\/td><td>多急，痰火作祟<\/td><\/tr><\/tbody><\/table><p>二者症状并存、可互相转化，故并称。<\/p><p><b>诊断<\/b>：各年龄性别均可发病，<mark>青壮年女性<\/mark>多见（“男性多见”是错的）；有家族史、脑外伤史或久郁、久思、易怒史；近期常有惊恐、变故等诱因；排除药物、中毒、外感。<\/p><p><b>鉴别<\/b>：痫证（发作性仆倒抽搐，醒后如常）、痴呆、郁病、谵语（急性重症神昏胡言）、郑声（晚期语声低怯、断续重复）。<\/p><p><b>辨证要点<\/b>：辨癫与狂、辨虚实、辨轻重（无寒热、气血）。<\/p>","src":"讲义 6-5 概述、诊断、鉴别诊断、辨证要点; 题库 #26 #30 #39 #44 #51 #52 #55 #57 #58 解析"},{"id":"p2","name":"病因病机","teach":"<p><b>病因<\/b>：情志所伤、饮食不节、禀赋异常（遗传）。阴阳失调是结果，不算病因。<\/p><p><b>病机<\/b>：脏腑失调、阴阳失衡 → 生<mark>气滞、痰结、火郁、血瘀<\/mark> → 蒙蔽心窍、神明逆乱。以<b>气郁为先<\/b>，继而化火生痰，日久致瘀。（湿浊、风不在列。）<\/p><table><thead><tr><th><\/th><th>癫<\/th><th>狂<\/th><\/tr><\/thead><tbody><tr><td>病理因素为先<\/td><td><mark>痰气<\/mark>：痰气郁结，蒙蔽脑窍<\/td><td><mark>痰火<\/mark>：痰火上扰，神明错乱<\/td><\/tr><tr><td>涉及脏腑<\/td><td>肝、心、脾<\/td><td>心、肝、胆、胃<\/td><\/tr><tr><td>情志<\/td><td>忧郁<\/td><td>恼怒（肝胆木火）<\/td><\/tr><\/tbody><\/table><p>对比：痫证情志主责<b>惊恐<\/b>。与禀赋异常密切：痴呆、癫狂、虚劳、痫病（郁病不是）。<\/p>","src":"讲义 6-5 病因、病机; 题库 #8 #9 #10 #11 #15 #47 #48 #56 #60 #61 解析"},{"id":"p3","name":"癫证：痰气 vs 心脾","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰气郁结<\/td><td>精神抑郁，沉默痴呆，时时太息，多疑多虑，喃喃自语，不思饮食；<mark>苔腻而白，脉弦滑<\/mark><\/td><td>疏肝解郁，化痰醒神<\/td><td>逍遥散合涤痰汤<\/td><\/tr><tr><td>心脾两虚<\/td><td>神思恍惚，魂梦颠倒，心悸易惊，善悲欲哭；<mark>面色苍白，肢体困乏，舌淡，脉细弱无力<\/mark><\/td><td>健脾养心，解郁安神<\/td><td>养心汤合越鞠丸<\/td><\/tr><\/tbody><\/table><p>证机：痰气郁结＝肝郁脾虚，气郁痰结，蒙蔽神窍；心脾两虚＝<b>脾失健运，生化乏源，心神失养<\/b>。<\/p><p>痰气郁结痰浊甚 → 加<b>控涎丹<\/b>（姜汤送下）。<\/p><p>注意：题库 #36 心脾两虚样症状、突出“善悲欲哭”，答<b>甘麦大枣汤<\/b>（解析按《金匮》脏躁）；单问心脾两虚主方仍选养心汤合越鞠丸。<\/p>","src":"讲义 6-5 证治分类 癫证(1)(2); 题库 #12 #16 #18 #21 #24 #27 #28 #36 #37 #45 #46 解析（控涎丹、甘麦大枣汤只见于题库解析）"},{"id":"p4","name":"狂证：痰火扰神","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰火扰神<\/td><td>性情急躁，头痛失眠，两目怒视，面红目赤；<mark>突发狂暴无知，逾垣上屋，骂詈号叫，不避亲疏<\/mark>，毁物伤人，登高而歌，弃衣而走，不食不眠；舌红绛，苔黄腻，脉弦滑数<\/td><td>镇心涤痰，清肝泻火<\/td><td>生铁落饮<\/td><\/tr><\/tbody><\/table><p>证机：<b>五志化火，炼液为痰，上扰清窍，扰乱心神<\/b>。<\/p><p>加减：<mark>脉弦实、肝胆火盛<\/mark> → <b>当归龙荟丸<\/b>（不是龙胆泻肝汤）。<\/p><p>陷阱：“疏肝解郁，化痰醒神”是癫证痰气郁结的治法。<\/p>","src":"讲义 6-5 证治分类 狂证(1); 题库 #13 #17 #19 #22 #25 #32 #40 #41 #42 #43 #53 解析（#19 题干写“癫证”，按解析内容实指狂证；当归龙荟丸见于题库解析）"},{"id":"p5","name":"痰热瘀结 vs 火盛伤阴","teach":"<table><thead><tr><th>证<\/th><th>辨点<\/th><th>治法<\/th><th>主方<\/th><\/tr><\/thead><tbody><tr><td>痰热瘀结<\/td><td>狂证日久，躁扰不安，多言不序，恼怒不休，妄见妄闻，妄思离奇；<mark>面色晦滞而秽，舌紫暗有瘀斑<\/mark>，苔薄黄而干，脉弦细或细涩<\/td><td>豁痰化瘀，调畅气血<\/td><td>癫狂梦醒汤<\/td><\/tr><tr><td>火盛伤阴<\/td><td>狂证日久，<mark>病势较缓，时作时止<\/mark>，精神疲惫，情绪焦虑，烦躁不眠，形瘦面红，五心烦热；舌红少苔，脉细数<\/td><td>滋阴降火，安神定志<\/td><td>二阴煎合琥珀养心丹<\/td><\/tr><\/tbody><\/table><p>两证都是“狂证日久”：有<b>瘀象<\/b>（晦滞、紫暗）→ 痰热瘀结；狂势<b>减弱＋阴虚<\/b> → 火盛伤阴（讲义写“火盛阴伤”）。<\/p><p>加减：痰瘀入络、不饥不食（顽痰）→ 加<b>白金丸<\/b>；火盛伤阴睡不安稳 → 加<b>孔圣枕中丹<\/b>。<\/p>","src":"讲义 6-5 证治分类 狂证(2)(3); 题库 #14 #23 #29 #31 #33 #34 #35 #38 #49 #50 #54 解析（白金丸、孔圣枕中丹见于题库解析）"},{"id":"p6","name":"医家出处·预防","teach":"<ul><li><b>《黄帝内经》<\/b>：癫狂病名首见；“得之在母腹中”→ 先天遗传；《灵枢》“治癫疾者常与之居”；以生铁落为饮<\/li><li><b>《难经》<\/b>：<mark>“重阳者狂，重阴者癫”<\/mark><\/li><li>张仲景：阴气病为癫，阳气病为狂<\/li><li>刘完素：五志化火，尤以心肝为甚<\/li><li><b>朱丹溪<\/b>：癫狂与<mark>痰<\/mark>有关，用吐下法<\/li><li><b>《景岳全书》<\/b>：设“癫狂痴呆”专篇，“癫病多由痰气”<\/li><li>王肯堂：详细分辨癫、狂、痫<\/li><li><b>王清任<\/b>：与脑相关，开<mark>活血化瘀<\/mark>先河，创癫狂梦醒汤<\/li><\/ul><p><b>预防调护<\/b>：精神调摄最关键，避免精神刺激（“忍受刺激磨炼意志”是错的）；阳性家族史劝不生育，加强妇幼保健；重症严密看护；饮食均衡，保持心情愉悦。<\/p>","src":"讲义 6-5 历史沿革、预防调护; 题库 #1 #2 #3 #4 #5 #6 #7 #20 #59 解析（《难经》《景岳全书》条见于题库解析）"}],"q":[{"n":1,"t":"A1型","q":"癫狂的病名首见于","pre":"","o":[["A","《金匮要略》"],["B","《难经》"],["C","《黄帝内经》"],["D","《丹溪心法》"],["E","《诸病源候论》"]],"a":"C","x":"癫狂的病名首见于《黄帝内经》。故选C。","p":"p6"},{"n":2,"t":"A1型","q":"提出癫狂的发病与遗传因素相关的是","pre":"","o":[["A","《诸病源候论》"],["B","《神农本草经》"],["C","《金匮要略》"],["D","《丹溪心法》"],["E","《黄帝内经》"]],"a":"E","x":"《素问·奇病论》云：“人生而有病癫疾者……此得之在母腹中时。”指出癫狂由先天遗传因素致病。故选E。","p":"p6"},{"n":3,"t":"A1型","q":"提出“重阳者狂，重阴者癫”的著作是","pre":"","o":[["A","《黄帝内经》"],["B","《难经》"],["C","《金匮要略》"],["D","《丹溪心法》"],["E","《医学心悟》"]],"a":"B","x":"《难经·二十难》谓“重阳者狂，重阴者癫”，重阳者乃火热亢盛及其所致狂证，重阴者乃痰气郁结或心肝脾虚及其所致癫证。故选B。","p":"p6"},{"n":4,"t":"A1型","q":"指出“治癫疾者常与之居”的著作是","pre":"","o":[["A","《黄帝内经》"],["B","《金匮要略》"],["C","《证治准绳》"],["D","《医林改错》"],["E","《丹溪心法》"]],"a":"A","x":"对于癫狂的治疗，《灵枢·癫狂》云“治癫疾者常与之居，察其所当取之处”，即常与患者居住，观察其发病过程中的情况和变化，取得丰富的材料。故选A。","p":"p6"},{"n":5,"t":"A1型","q":"提出癫狂与痰有密切关系的医家是","pre":"","o":[["A","张仲景"],["B","王肯堂"],["C","刘完素"],["D","朱丹溪"],["E","张介宾"]],"a":"D","x":"元·朱丹溪《丹溪心法·癫狂》云：“癫多喜而狂多怒，脉虚者可治，实则死。大率多因痰结于心胸间。”提出癫狂发病与痰有关。故选D。","p":"p6"},{"n":6,"t":"A1型","q":"设“癫狂痴呆”专篇，提出“癫病多由痰气，凡气有所逆，痰有所滞，皆能壅闭经络，格塞心窍”，对癫狂进行专门论述的著作是","pre":"","o":[["A","《金匮要略》"],["B","《千金要方》"],["C","《丹溪心法》"],["D","《景岳全书》"],["E","《临证指南》"]],"a":"D","x":"《景岳全书》设“癫狂痴呆”专论，该书谓：“癫病多由痰气，凡气有所逆，痰有所滞，皆能壅闭经络，格塞心窍。”故选D。","p":"p6"},{"n":7,"t":"A1型","q":"清·王清任开创了活血化瘀治疗癫狂，其代表方是","pre":"","o":[["A","癫狂梦醒汤"],["B","血府逐瘀汤"],["C","通窍活血汤"],["D","桃红四物汤"],["E","丹参饮"]],"a":"A","x":"清·王清任《医林改错·癫狂梦醒汤》认为：“癫狂一症，哭笑不休，詈骂歌唱，不避亲疏，许多恶态，乃气血凝滞，脑气与脏腑气不接。”认识到癫狂与脑有密切联系，瘀血凝滞脏腑经络，致脑气不展，灵机逆乱，神智失常，并以癫狂梦醒汤治疗，开创了活血化瘀法治疗癫狂的先河。故选A。","p":"p6"},{"n":8,"t":"A1型","q":"狂证的病理因素以何者为先","pre":"","o":[["A","痰火"],["B","气滞"],["C","水湿"],["D","血瘀"],["E","毒损"]],"a":"A","x":"狂证起病多急，发病多伴痰火之邪，火热扰窍，神明错乱而发狂。故选A。","p":"p2"},{"n":9,"t":"A1型","q":"癫证的病理因素以何者为先","pre":"","o":[["A","水湿"],["B","气滞"],["C","痰气"],["D","血瘀"],["E","毒损"]],"a":"C","x":"癫证起病多缓，发病多有痰气作祟，痰气郁结，蒙蔽脑窍而发癫。故选C。","p":"p2"},{"n":10,"t":"A1型","q":"癫狂的病理因素主要是","pre":"","o":[["A","郁、痰、火、瘀"],["B","风、火、痰、瘀"],["C","风、气、火、瘀"],["D","风、痰、气、瘀"],["E","风、痰、火、气"]],"a":"A","x":"癫狂的基本病机为脏腑功能失调或阴阳失于平衡，产生气滞、痰结、火郁、血瘀，蒙蔽心窍，或心神被扰，神明逆乱，引起精神异常。故选A。","p":"p2"},{"n":11,"t":"A1型","q":"癫证病位在脑，与其发病关系密切的脏腑有","pre":"","o":[["A","心、肝、胆"],["B","心、肝、肾"],["C","肝、胆、胃"],["D","肝、心、脾"],["E","心、脾、肾"]],"a":"D","x":"癫证发病多由痰气作祟，病位在脑，涉及肝、心、脾。故选D。","p":"p2"},{"n":12,"t":"A1型","q":"癫证痰气郁结，若痰浊甚者，可加用","pre":"","o":[["A","涤痰汤"],["B","半夏厚朴汤"],["C","苏合香丸"],["D","控涎丹"],["E","越鞠丸"]],"a":"D","x":"癫证痰气郁结，若痰浊甚者，加控涎丹，临卧姜汤送下。故选D。","p":"p3"},{"n":13,"t":"A1型","q":"生铁落饮常用于","pre":"","o":[["A","癫证，痰气郁结"],["B","癫证，心脾两虚"],["C","狂证，痰火扰神"],["D","狂证，火盛伤阴"],["E","狂证，痰热瘀结"]],"a":"C","x":"狂证痰火扰神，乃五志化火，炼液为痰，上扰清窍，扰乱心神，宜镇心涤痰，清肝泻火，代表方剂为生铁落饮。故选C。","p":"p4"},{"n":14,"t":"A1型","q":"治疗狂证痰热瘀结的代表方剂是","pre":"","o":[["A","涤痰汤"],["B","生铁落饮"],["C","癫狂梦醒汤"],["D","通窍活血汤"],["E","大黄䷪虫丸"]],"a":"C","x":"狂证痰热瘀结，乃气郁痰结，血气凝滞，瘀热互结，神窍被扰，宜豁痰化瘀，调畅气血，代表方剂为癫狂梦醒汤。故选C。","p":"p5"},{"n":15,"t":"A1型","q":"下列属于狂证病机要点的是","pre":"","o":[["A","痰气郁结，蒙蔽脑窍"],["B","心肝脾虚，神明失养"],["C","气郁化火，炼液为痰"],["D","痰火上扰，神明错乱"],["E","气机逆乱，元神失控"]],"a":"D","x":"狂证起病多急，发病多伴痰火之邪，火热扰窍，神明错乱而发狂。故选D。","p":"p2"},{"n":16,"t":"A1型","q":"癫证痰气郁结，治疗方剂选","pre":"","o":[["A","半夏厚朴汤"],["B","养心汤合越鞠丸"],["C","黄连温胆汤"],["D","柴胡疏肝散"],["E","逍遥散合涤痰汤"]],"a":"E","x":"癫证痰气郁结，病机为肝气郁结，脾失健运，气郁痰结，蒙蔽神窍，治宜疏肝解郁，化痰醒神，代表方剂为逍遥散合涤痰汤加减。前方重在疏肝解郁，后方重在化痰开窍。故选E。","p":"p3"},{"n":17,"t":"A1型","q":"狂证痰火扰神的治法是","pre":"","o":[["A","疏肝解郁，化痰醒神"],["B","镇心涤痰，清肝泻火"],["C","疏肝解郁，清肝泻火"],["D","化痰开窍，养心安神"],["E","清肝泻火，化痰宁心"]],"a":"B","x":"狂证痰火扰神，病机为五志化火，炼液为痰，上扰清窍，扰乱心神，治宜镇心涤痰，清肝泻火。故选B。","p":"p4"},{"n":18,"t":"A1型","q":"癫证心脾两虚的治法是","pre":"","o":[["A","健脾养心，解郁安神"],["B","镇心涤痰，清肝泻火"],["C","甘润缓急，养心安神"],["D","补益心脾，养血安神"],["E","疏肝解郁，化痰醒神"]],"a":"A","x":"癫证心脾两虚，病机为脾失健运，生化乏源，心神失养，治宜健脾养心，解郁安神，代表方剂为养心汤合越鞠丸加减。故选A。","p":"p3"},{"n":19,"t":"A1型","q":"癫证痰火扰神，若脉弦实，肝胆火盛者，当选用","pre":"","o":[["A","龙胆泻肝汤"],["B","黄连温胆汤"],["C","大柴胡汤"],["D","当归龙荟丸"],["E","柴胡疏肝散"]],"a":"D","x":"癫证痰火扰神，若脉弦实，肝胆火盛者，用当归龙荟丸清肝泻火。故选D。","p":"p4"},{"n":20,"t":"A1型","q":"癫狂常用预防调护方法不包括","pre":"","o":[["A","重视精神疗法"],["B","避免遭受精神刺激"],["C","饮食调理"],["D","忍受刺激磨炼意志"],["E","加强妇幼保健工作"]],"a":"D","x":"癫狂之病多由内伤七情引起，故注意精神调摄最为关键，重视精神呵护，避免精神刺激。
