<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f2ef">
<title>内科积木</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23c8281e%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2234%22 text-anchor=%22middle%22 fill=%22white%22%3E%E8%AF%8D%3C/text%3E%3C/svg%3E">
<style>
/* Desktop workbench first (sidebar | main | drawer), phone below 860px (bottom tab bar, bottom sheet).
   Ink black on neutral paper; cinnabar 朱 only for 秒杀词 (marked with 着重号 like a teacher's red-ink notes) and the main button. */
:root{color-scheme:light;
  --paper:#f2f2ef;--card:#fff;--ink:#000;--ink-2:rgba(0,0,0,.64);--ink-3:rgba(0,0,0,.44);
  --sep:rgba(0,0,0,.11);--fill:rgba(0,0,0,.04);--fill-2:rgba(0,0,0,.075);
  --zhu:#c8281e;--zhu-bg:#fcebe8;--dai:#1f4e8c;--dai-bg:#e6eef8;--qing:#1d7046;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --r:12px;--bar:60px;--side:300px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--dai);outline-offset:2px;border-radius:4px}
select{height:32px;border:1px solid var(--sep);border-radius:8px;background:#fff;padding:0 8px;font-size:14px;min-width:0}

/* top bar */
.bar{position:sticky;top:0;z-index:20;height:var(--bar);display:grid;grid-template-columns:calc(var(--side) - 24px) 1fr minmax(240px,380px);align-items:center;gap:24px;padding:0 24px;background:rgba(242,242,239,.92);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--sep)}
.brand b{font-size:18px;font-weight:600;letter-spacing:.04em}
.brand span{margin-left:10px;color:var(--ink-3);font-size:13px}
.tabs{display:flex;gap:2px;padding:3px;background:var(--fill-2);border-radius:10px;justify-self:start}
.tabs button{padding:5px 20px;border-radius:8px;font-size:14px;color:var(--ink-2);text-align:center}
.tabs [aria-selected=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{position:relative}
.search input{width:100%;height:36px;padding:0 36px 0 12px;border:0;border-radius:10px;background:var(--fill-2);font-size:15px}
.search input:focus{background:#fff;outline:2px solid var(--dai);outline-offset:0}
.search kbd{position:absolute;right:8px;top:8px;font:12px/18px var(--sans);color:var(--ink-3);border:1px solid var(--sep);border-radius:5px;padding:0 6px;background:#fff}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
body[data-v=find] .shell{grid-template-columns:minmax(0,1fr)}
body[data-v=find] #side{display:none}
#side{position:sticky;top:var(--bar);height:calc(100vh - var(--bar));overflow:auto;padding:20px 16px 48px 24px;border-right:1px solid var(--sep)}
#main{min-width:0;padding:28px 40px 80px;max-width:1120px}
body[data-v=find] #main{max-width:900px;margin:0 auto;width:100%}
body[data-v=grid] #main{max-width:none}
.head{margin-bottom:24px;max-width:48em}
.head h1{font-size:32px;line-height:1.2;font-weight:600;margin:0 0 8px}
.head p{margin:0;color:var(--ink-2)}
.chain{list-style:none;display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:14px 0 0;counter-reset:l}
.chain li{counter-increment:l;font-size:13px;padding:2px 10px 2px 6px;background:var(--fill-2);border-radius:6px}
.chain li::before{content:counter(l);display:inline-block;min-width:1.5em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.foot{margin-top:40px;font-size:12px;color:var(--ink-3)}

/* sidebar */
#side h4{font-size:12px;font-weight:600;color:var(--ink-3);margin:22px 0 6px 8px}
#side h4:first-child{margin-top:0}
#side h4 span{font-weight:400}
.nav{list-style:none;margin:0;padding:0}
.nav a{display:flex;justify-content:space-between;padding:5px 8px;border-radius:8px;color:var(--ink);text-decoration:none}
.nav a span{color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.nav a:hover{background:var(--fill)}
.nav a.on{background:var(--dai-bg);color:var(--dai);font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pgrid button{padding:6px 9px;border-radius:8px;font-size:13px;line-height:1.35;background:var(--card);border:1px solid var(--sep)}
.pgrid button:hover{border-color:var(--ink-3)}
.pgrid button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mine{list-style:none;margin:0;padding:0}
.mine li{display:flex;align-items:center;gap:2px}
.mine li>button:first-child{flex:1;min-width:0;padding:6px 8px;border-radius:8px;font-size:14px;line-height:1.35}
.mine li>button:first-child:hover{background:var(--fill)}
.mine li>button.on{background:var(--ink);color:#fff}
.mine small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine .on small{color:rgba(255,255,255,.7)}
.x{flex:none;width:28px;height:28px;border-radius:6px;color:var(--ink-3);font-size:17px;line-height:28px;text-align:center}
.x:hover{background:var(--fill-2);color:var(--ink)}
.hint{font-size:13px;color:var(--ink-3);margin:4px 8px}
.lv{list-style:none;margin:0;padding:0;counter-reset:l}
.lv li{counter-increment:l;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.lv li::before{content:counter(l);width:1.6em;flex:none;text-align:right;color:var(--ink-3);font-size:13px;font-variant-numeric:tabular-nums}
.lv select{flex:1}
.addlv{width:calc(100% - 1.6em - 6px);margin-left:calc(1.6em + 6px);color:var(--dai);border-style:dashed}
.row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin:14px 0 0 8px}
.save{display:flex;gap:6px;margin-top:18px}
.save input{flex:1;min-width:0;height:34px;border:1px solid var(--sep);border-radius:8px;padding:0 10px;background:#fff;font-size:14px}
.pri{height:34px;padding:0 14px;border-radius:8px;background:var(--zhu);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.pri:hover{filter:brightness(1.08)}

/* 证 rows: the same four columns everywhere (证 | 秒杀词 | 组合 | 方) */
h2.sys{font-size:13px;font-weight:600;color:var(--ink-3);margin:40px 0 12px}
.head+h2.sys{margin-top:0}
.dis{margin-bottom:32px;scroll-margin-top:calc(var(--bar) + 16px)}
.dhd{display:flex;align-items:baseline;gap:16px;margin:0 0 10px}
.dhd h3{font-size:24px;line-height:1.25;font-weight:600;margin:0;flex:none}
.dhd p{margin:0;color:var(--ink-2);font-size:14px}
.lab{font-size:12px;color:var(--ink-3);margin-right:8px}
.tbl{background:var(--card);border-radius:var(--r);overflow:hidden}
.zr{display:grid;grid-template-columns:8.5em minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:18px;width:100%;padding:10px 16px;text-align:left;align-items:baseline;border-top:1px solid var(--sep)}
.tbl>.zr:first-child{border-top:0}
button.zr:hover{background:var(--fill)}
.zh{font-size:12px;color:var(--ink-3);padding-top:7px;padding-bottom:5px;background:#fafaf8}
.zn{font-weight:600}
.zn small{display:block;font-weight:400;font-size:12px;color:var(--ink-3)}
.kw em,b.k{font-style:normal;font-weight:600;color:var(--zhu);-webkit-text-emphasis:filled dot var(--zhu);text-emphasis:filled dot var(--zhu);-webkit-text-emphasis-position:under;text-emphasis-position:under right}
.kw em{margin-right:14px;line-height:2.1}
.kw sup{color:var(--ink-3);font-weight:400;font-size:10px;margin-left:2px;-webkit-text-emphasis:none;text-emphasis:none}
.kw i{color:var(--ink-3);font-style:normal}
.cb{font-size:13px;color:var(--ink-2)}
.rx{grid-column:1/-1;font-size:13px;color:var(--ink-2);line-height:2}
mark{background:#fff0a8;color:inherit;border-radius:2px;padding:0 1px}

/* drawer: right on desktop, bottom sheet on phone */
dialog.drawer{position:fixed;inset:0 0 0 auto;margin:0;width:min(500px,100vw);height:100dvh;max-height:none;max-width:none;padding:0;border:0;background:var(--paper);color:var(--ink);box-shadow:-12px 0 40px rgba(0,0,0,.18);overflow:auto;overscroll-behavior:contain}
dialog.drawer[open]{animation:in-r .2s ease-out}
@keyframes in-r{from{transform:translateX(28px);opacity:0}}
dialog.drawer::backdrop{background:rgba(0,0,0,.22)}
.dt{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;padding:14px 20px;background:rgba(242,242,239,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--sep)}
.dt b{flex:1;font-size:20px;font-weight:600;line-height:1.3}
.dt button{color:var(--dai);font-size:15px}
#dlgb{padding:16px 20px 40px}
#dlgb .zr{grid-template-columns:7.5em minmax(0,1fr) minmax(0,1fr)}
#dlgb .zr .cb,#dlgb .zh span:nth-child(3){display:none}
.zsub{margin:0 0 10px;color:var(--ink-2);font-size:14px}
.raw{font-size:16px;line-height:2.2;margin:0 0 6px}
.dl{display:grid;grid-template-columns:4em minmax(0,1fr);gap:10px 12px;margin:16px 0 0;background:var(--card);border-radius:var(--r);padding:14px 16px}
.dl dt{font-size:13px;color:var(--ink-3);padding-top:3px}
.dl dd{margin:0}
.kl{margin-bottom:6px}
.chip{display:inline-block;padding:2px 9px;margin:0 4px 4px 0;border-radius:6px;background:var(--fill-2);font-size:13px;line-height:1.7}
.chip:hover{background:var(--dai-bg);color:var(--dai)}
.chip.k{background:var(--zhu-bg);color:var(--zhu);font-weight:600}
.ev{font-size:12px;color:var(--ink-3)}
.tp{font-size:13px;margin-bottom:6px}
.tp b{font-weight:600}
.src{margin-top:14px}

/* 查词 */
.verdict{background:var(--card);border-radius:var(--r);padding:18px 20px}
.vk{font-size:13px;color:var(--ink-3)}
.vt{font-size:26px;font-weight:600;line-height:1.3;margin:2px 0 6px}
.verdict.one .vt{color:var(--zhu)}
.verdict p{margin:0;color:var(--ink-2);font-size:14px}
.verdict .dl{padding:12px 0 0;margin:0}
.sec{margin:32px 0 10px;font-size:13px;font-weight:600;color:var(--ink-3)}
.box{background:var(--card);border-radius:var(--r);padding:14px 16px}
.bq{padding:12px 16px;border-top:1px solid var(--sep);font-size:14px}
.bq:first-child{border-top:0}
.bq .m{font-size:12px;color:var(--ink-3)}
.bq .a{color:var(--qing);margin-top:2px}
.more{display:block;width:100%;padding:12px;color:var(--dai);text-align:center;border-top:1px solid var(--sep)}
.ex{margin-top:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px;align-items:start}
.two .dl{margin:0}
.dl.wide{grid-template-columns:7em minmax(0,1fr)}

/* 积木 tree: any depth, children drawn when a row opens */
.tree{background:var(--card);border-radius:var(--r);overflow:hidden}
.nd>summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px;border-top:1px solid var(--sep);cursor:pointer}
.nd>summary::-webkit-details-marker{display:none}
.nd>summary::before{content:"";width:7px;height:7px;flex:none;border:solid var(--ink-3);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);transition:transform .15s}
.nd[open]>summary::before{transform:rotate(45deg)}
.tree>.nd:first-child>summary{border-top:0}
.nd>summary:hover{background:var(--fill)}
.nd .t{flex:1;min-width:0;font-size:16px}
.nd[open]>summary .t{font-weight:600}
.nd .t small{margin-left:8px;font-size:12px;color:var(--ink-3);font-weight:400}
.c{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:3.8em;text-align:right}
.c b{font-weight:600;color:var(--ink-2)}
.kids{margin-left:20px;border-left:2px solid var(--fill-2)}
.kids>.tbl{border-radius:0}
.empty{padding:16px;color:var(--ink-3)}

/* 表格 */
.pool{display:flex;flex-wrap:wrap;gap:4px;padding:2px}
.zone{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:44px;padding:6px 8px;margin-top:6px;background:var(--card);border:1px dashed rgba(0,0,0,.22);border-radius:10px}
.zl{min-width:3.5em;flex:none;white-space:nowrap;font-size:13px;color:var(--ink-2);line-height:1.2}
.zl small{display:block;font-size:10px;color:var(--ink-3)}
.zone.over{border:2px solid var(--dai);background:var(--dai-bg)}
.pill{padding:4px 10px;border-radius:7px;font-size:13px;line-height:1.4;background:var(--card);border:1px solid var(--sep);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
.zone .pill{background:var(--ink);color:#fff;border-color:var(--ink)}
.pool .pill.used{opacity:.38}
.pill.src{opacity:.25}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:grabbing}
.caret{width:2px;height:24px;background:var(--dai);border-radius:1px;margin:0 -1px}
.menu{position:fixed;z-index:60;min-width:170px;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:4px}
.menu .mt{font-size:12px;color:var(--ink-3);padding:4px 10px}
.menu button{display:block;width:100%;padding:7px 10px;border-radius:6px;font-size:14px}
.menu button:hover:not(:disabled){background:var(--fill-2)}
.menu button:disabled{color:var(--ink-3);cursor:default}
.seg2{display:inline-flex;padding:2px;background:var(--fill-2);border-radius:8px}
.seg2 button{padding:3px 12px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.seg2 [aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.warn{color:var(--zhu);font-size:13px;margin:8px 8px 0}
.gw{overflow:auto;max-height:calc(100vh - var(--bar) - 150px);background:var(--card);border-radius:var(--r);border:1px solid var(--sep)}
.pt{border-collapse:separate;border-spacing:0;font-size:13px;line-height:1.5}
.pt th,.pt td{border-right:1px solid var(--sep);border-bottom:1px solid var(--sep);padding:5px 9px;vertical-align:top;text-align:left}
.pt td{min-width:6.5em;max-width:17em}
.pt thead th{position:sticky;top:0;z-index:2;background:#f6f6f3;font-weight:600;white-space:nowrap}
.pt th[data-c]{position:sticky;z-index:1;background:#fbfbf9;font-weight:600;white-space:nowrap}
.pt thead th[data-c]{z-index:3;background:#efefeb;color:var(--ink-3);font-weight:400;font-size:12px}
.pt .ct{color:var(--ink-3);font-weight:400;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pt .it{display:inline;line-height:1.5}
.pt .it.b{display:block}
.pt .it:not(.b)+.it:not(.b)::before{content:"、";color:var(--ink-3)}
.pt .it small{color:var(--ink-3);font-weight:400;font-size:11px;margin-left:4px}
.pt button.it:hover{color:var(--dai);text-decoration:underline}
.pt td.n{text-align:center;padding:0;background:rgba(31,78,140,calc(var(--a)*.45 + .04))}
.pt td.n button{display:block;width:100%;padding:5px 9px;font-variant-numeric:tabular-nums}
.pt td.n button:hover{outline:2px solid var(--dai);outline-offset:-2px}
.pt td.dot{text-align:center}
.gnote{font-size:12px;color:var(--ink-3);margin:8px 2px}
.chq{width:100%;height:36px;margin-top:4px;border:1px solid var(--sep);border-radius:8px;padding:0 10px;font-size:15px}
.chl{max-height:58dvh;overflow:auto;margin-top:10px;background:var(--card);border-radius:var(--r)}
.chl label{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--sep);cursor:pointer}
.chl label:first-child{border-top:0}
.chl label[hidden]{display:none}
.chl label>span{flex:1}
.chl small{font-size:12px;color:var(--ink-3);margin-left:6px}
.chb{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.chb button:not(.pri){height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--sep);background:#fff}

@media (prefers-reduced-motion:reduce){dialog.drawer[open]{animation:none}.nd>summary::before{transition:none}}

/* phone */
@media (max-width:860px){
  :root{--bar:0px}
  .bar{position:static;height:auto;grid-template-columns:1fr;gap:10px;padding:16px 16px 6px;background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none;border:0}
  .tabs{position:fixed;left:0;right:0;bottom:0;justify-self:stretch;z-index:30;border-radius:0;padding:4px 8px calc(4px + env(safe-area-inset-bottom));background:rgba(248,248,246,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--sep)}
  .tabs button{flex:1;padding:10px 0;font-size:15px}
  .tabs [aria-selected=true]{background:none;box-shadow:none;color:var(--dai)}
  .search kbd{display:none}
  .shell{grid-template-columns:minmax(0,1fr)}
  #side{position:static;height:auto;overflow:visible;border:0;padding:4px 16px 0}
  #main{padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
  body[data-v=kill] #side{position:sticky;top:0;z-index:10;padding:8px 16px;overflow-x:auto;white-space:nowrap;background:rgba(242,242,239,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--sep)}
  body[data-v=kill] #side h4{display:none}
  body[data-v=kill] .nav{display:inline-flex;gap:2px}
  body[data-v=kill] .nav a span{display:none}
  .dis{scroll-margin-top:64px}
  #side h4{margin-left:0}
  .pgrid{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
  .pgrid button{flex:none}
  .head h1{font-size:26px}
  .zr,#dlgb .zr{grid-template-columns:1fr;gap:0;padding:12px 16px}
  .zr .cb:empty{display:none}
  .zh{display:none}
  .dhd{display:block}
  .dhd h3{font-size:22px;margin-bottom:2px}
  .two{grid-template-columns:1fr}
  dialog.drawer{inset:auto 0 0 0;width:100%;height:auto;max-height:90dvh;border-radius:16px 16px 0 0}
  dialog.drawer[open]{animation-name:in-b}
  .gw{max-height:calc(100dvh - 120px)}
}
@keyframes in-b{from{transform:translateY(36px);opacity:0}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><b>内科积木</b><span>总论至噎膈</span></div>
  <nav class="tabs" role="tablist" aria-label="视图">
    <button role="tab" data-v="kill">秒杀词</button><button role="tab" data-v="find">查词</button><button role="tab" data-v="tree">积木</button><button role="tab" data-v="grid">表格</button>
  </nav>
  <div class="search"><input id="q" type="search" placeholder="查一个词：头晕、拽锯、天麻钩藤饮" autocomplete="off" enterkeyhint="search" aria-label="查词"><kbd>/</kbd></div>
</header>
<div class="shell"><aside id="side"></aside><main id="main"></main></div>

03-00 中医内科疾病辨证论治概要",69,"下列不属于血病血寒证常见临床表现的是","E. 皮疹紫红、密集"],["03-00 中医内科疾病辨证论治概要",70,"血病血虚证的治法是","A. 补气养血"],["03-00 中医内科疾病辨证论治概要",71,"与津液的生成和运行关系最为密切的脏腑是","D. 肺、脾、肾"],["03-00 中医内科疾病辨证论治概要",72,"下列不属于津液病痰证常见临床表现的是","D. 肋间饱满"],["03-00 中医内科疾病辨证论治概要",73,"津液病水停证的治法为","C. 温阳利水"],["03-00 中医内科疾病辨证论治概要",74,"津液病中可引起神志失常的病证是","A. 痰证"],["03-00 中医内科疾病辨证论治概要",75,"六经辨证的创立者是","A. 张仲景"],["03-00 中医内科疾病辨证论治概要",76,"太阳伤寒证的治法是","B. 发汗解表，宣肺平喘"],["03-00 中医内科疾病辨证论治概要",77,"太阳中风证病机要点是","D. 营卫失和"],["03-00 中医内科疾病辨证论治概要",78,"下列临床表现可作为太阳伤寒证与中风证鉴别点的是","A. 有汗无汗"],["03-00 中医内科疾病辨证论治概要",79,"下列属于太阳蓄血证常见临床表现的是","B. 小便自利"],["03-00 中医内科疾病辨证论治概要",80,"下列不属于阳明腑实证常见临床表现的是","E. 脉洪大"],["03-00 中医内科疾病辨证论治概要",81,"下列不属于少阳病常见临床表现的是","A. 腹满而吐"],["03-00 中医内科疾病辨证论治概要",82,"下列不属于太阴病常见临床表现的是","A. 口渴"],["03-00 中医内科疾病辨证论治概要",83,"卫气营血辨证的创立者是","C. 叶天士"],["03-00 中医内科疾病辨证论治概要",84,"卫气营血病证卫分证的病机要点为","A. 温邪外袭，表卫郁阻"],["03-00 中医内科疾病辨证论治概要",85,"下列不属于卫气营血病证中血分证常见临床表现的是","D. 斑疹隐隐"],["03-00 中医内科疾病辨证论治概要",86,"患者，女，30岁。昨日不慎淋雨后出现恶寒，发热，无汗，头痛身痛，鼻流清涕，咳嗽，痰稀，舌苔白润，脉浮紧。辨证应属","A. 风寒证"],["03-00 中医内科疾病辨证论治概要",87,"患者，男，50岁。既往有癫痫病史10年，今日再次发作。刻诊：壮热如焚，头痛，两目上视，手足抽搐，项强，甚则角弓反张，神志不清，舌红苔黄，脉弦数有力。其治法为","B. 清热凉肝息风"],["03-00 中医内科疾病辨证论治概要",88,"患者，女，57岁。平素面色苍白，腰膝酸冷，兼见脘腹冷痛，畏寒喜暖，五更泄泻，小便清长，舌淡胖，边有齿印，脉沉细无力。其病机要点是","D. 脾肾阳虚，阴寒凝结"],["03-00 中医内科疾病辨证论治概要",89,"患者，女，50岁。形寒怕冷，四末不温，呕吐清水，腹中冷痛，下利清谷，舌淡，苔白滑，脉沉细。辨证应属","C. 阴寒内盛"],["03-00 中医内科疾病辨证论治概要",90,"患者，女，45岁。入夏时常发热，肌肤灼热，汗少，午后热甚，口渴引饮，食少，倦怠无力，舌苔薄白，舌质微红，脉细数。其诊断是","B. 暑热"],["03-00 中医内科疾病辨证论治概要",91,"患者，女，30岁。面色萎黄不华，神疲乏力，脘腹胀满，纳谷欠香，大便溏软，甚或濡泻，肢体困重，舌质淡胖，舌苔白腻，脉濡细。辨证应属","C. 脾虚湿困"],["03-00 中医内科疾病辨证论治概要",92,"患者，女，35岁。身热不甚，迁延缠绵，微恶风寒，汗少而黏，头痛如裹，肢体酸重疼痛，胸膈闷胀，脘痞泛恶，口中黏腻，大便稀溏，脉浮濡。辨证应属","A. 湿困卫表"],["03-00 中医内科疾病辨证论治概要",93,"患者，女，35岁。于秋冬交替时出现头痛，鼻塞，恶寒，发热，无汗，咽干唇燥，干咳痰少，痰质清稀，舌干苔薄，脉浮弦。其治法为","B. 宣肺达表，化痰润燥"],["03-00 中医内科疾病辨证论治概要",94,"患者，男，40岁。脘腹胀闷，纳呆，恶心欲呕，口中黏腻，渴不多饮，便溏不爽，小便短黄，肢体困重，皮肤瘙痒，舌质红，苔黄腻，脉滑数。其病机要点是","A. 湿热内蕴，脾失健运"],["03-00 中医内科疾病辨证论治概要",95,"患者，女，12岁。因被狗惊吓后出现胆怯易惊，精神恍惚，眩晕呕吐，口苦，胸闷，痰多，舌苔白滑，脉小弦。其治法是","A. 靖胆化痰"],["03-00 中医内科疾病辨证论治概要",96,"患者，男，20岁。脘腹胀痛拒按，呕吐酸腐，嗳 /* dimensions */
function vals(z,d){switch(d){case"系统":return[z.sys];case"病":return[z.dis];case"证":return[z.id];case"证名":return[z.name];
  case"病·病因":return DIS[z.dis].病因;case"秒杀词":return kws(z);default:return z[d]||[]}}
const label=(d,v)=>v===null?"（无）":d==="证"?Z[v].name:v;
const XORD={病性:["实","虚","寒","热"],系统:SYS};
function sortEs(d,es){const o=d==="病"?e=>DIS[e.k].i:d==="证"?e=>Z[e.k].i:XORD[d]?e=>XORD[d].indexOf(e.k):null;
  return es.sort((a,b)=>(a.k===null)-(b.k===null)||(o?o(a)-o(b):b.nd-a.nd||b.l.length-a.l.length||String(a.k).localeCompare(b.k,"zh")))}
// a 证 sits under every value it has; ex = values already used higher up for the same dimension (a dimension nested in itself)
function group(zs,d,{ex=[],min="",none=false}={}){const m=new Map(),no=[];
  for(const z of zs){const vs=[...new Set(vals(z,d))].filter(v=>!ex.includes(v));if(!vs.length){no.push(z);continue}
    for(const v of vs){if(!m.has(v))m.set(v,[]);m.get(v).push(z)}}
  let es=[...m].map(([k,l])=>({k,l,nd:new Set(l.map(z=>z.dis)).size}));
  if(min&&!AX.has(d)){const n=+min[0],u=min[1];es=es.filter(e=>(u==="证"?e.l.length:e.nd)>=n)}
  if(none&&no.length)es.push({k:null,l:no,nd:new Set(no.map(z=>z.dis)).size});
  return sortEs(d,es)}

/* shared pieces */
function hl(s,ms=[],red=[]){const ws=[...new Set([...ms,...red])].filter(Boolean).sort((a,b)=>b.length-a.length);if(!ws.length)return esc(s);
  const re=new RegExp("("+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","g");
  return s.split(re).map((p,i)=>i%2?(red.includes(p)?`<b class="k">${esc(p)}</b>`:`<mark>${esc(p)}</mark>`):esc(p)).join("")}
const ZH=`<div class="zr zh" aria-hidden="true"><span>证</span><span>秒杀词</span><span>组合</span><span>方</span></div>`;

  const sub=o.dis?z.dis+(z.group?"，"+z.group:""):z.group;
  return `<button class="zr" data-z="${z.id}"><span class="zn">${esc(z.name)}${sub?`<small>${esc(sub)}</small>`:""}</span><span class="kw">${kw||"<i>—</i>"}</span><span class="cb">${esc(z.combo||"")}</span><span class="fa">${esc(z.方.join("、"))}</span>${o.q?`<span class="rx">${hl(z.raw,[o.q],kws(z))}</span>`:""}</button>`}

/* 查词 */
function verdict(q,zs){const dis=[...new Set(zs.map(z=>z.dis))];
  const V=(cls,k,t,p,x="")=>`<div class="verdict ${cls}"><div class="vk">${k}</div><div class="vt">${t}</div><p>${p}</p>${x}</div>`;
  if(!zs.length)return V("none","没找到",`没有证含「${esc(q)}」`,"换个写法试试，比如拉锯和拽锯。下面还会列出题干含这个词的题。");
  const kz=D.z.filter(z=>z.kill.some(k=>k.w===q)),tz=D.z.filter(z=>(z.trap||[]).some(t=>t.w===q));
  if(kz.length)return V("one","秒杀词",kz.map(z=>`${esc(z.dis)}　${esc(z.name)}`).join("；"),"两套题库都核对过。"+(kz.some(z=>z.kill.find(k=>k.w===q).also.length)?"别的病也有这个词，先定病再用。":""));
  if(tz.length)return V("trap","陷阱词","别凭它选",`它看着像${tz.map(z=>esc(z.dis)+"　"+esc(z.name)).join("、")}的秒杀词，原因在下面。`);
  if(zs.length===1)return V("one","只见于一个证",`${esc(zs[0].dis)}　${esc(zs[0].name)}`,`${D.dis.length} 个病里只有这个证的原文有「${esc(q)}」。它不在核对过的秒杀词里，先看下面的题库再信。`);
  if(dis.length===1)return V("dis","定病",esc(dis[0]),`只见于这个病的 ${zs.length} 个证。能定病，还要再找一个词定证。`);
  const top=d=>{const c={};for(const z of zs)for(const t of z[d])c[t]=(c[t]||0)+1;
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([t,n])=>`<button class="chip" data-q="${esc(t)}">${esc(t)} <span class="ev">${n}</span></button>`).join("")};
  return V("many","通用词",`${dis.length} 个病，${zs.length} 个证`,"单凭它选不出答案，要配上定位和定性的词。这些证落在：",`<dl class="dl"><dt>病位</dt><dd>${top("病位")}</dd><dt>病理</dt><dd>${top("病理")}</dd></dl>`)}
const bqRow=q=>b=>`<div class="bq"><div class="m">${esc(b[0])} 第 ${b[1]} 题</div>${hl(b[2],[q])}<div class="a">答案：${esc(b[3])}</div></div>`;

let NODES=[];
function nodes(zs,dep,path){const c=state.tree.c;

const gsum=P=>[P.r.length?"行 "+P.r.join("、"):"",P.c.length?"列 "+P.c.join("、"):"","值 "+(P.v.length?P.v.join("、"):"证")].filter(Boolean).join("；");
const onG=()=>[PRE_G.findIndex(p=>key(normG(p.p))===key(state.pv)),state.mineG.findIndex(m=>key(normG(m.p))===key(state.pv))];
function sGrid(){const P=state.pv,[on,mi]=onG(),used=new Set([...P.f,...P.r,...P.c,...P.v]);
  const pill=(f,zn)=>{const s=P.sel[f]||[];const lab=zn==="f"?`${f}：${!s.length?"全部":s.length<3?s.map(v=>label(f,v)).join("、"):s.length+" 项"}`:f;
    return `<button class="pill${zn==="pool"&&used.has(f)?" used":""}" data-f="${esc(f)}" data-in="${zn}">${esc(lab)}</button>`};
  return `<h4>推荐</h4><div class="pgrid">${PRE_G.map((p,i)=>`<button data-gp="${i}" class="${i===on?"on":""}">${esc(p.n)}</button>`).join("")}</div>
  <h4>我的表格</h4>${mineList(state.mineG,mi,"g",m=>gsum(normG(m.p)))}
  <h4>字段 <span>拖到下面的格子里，或点一下选位置</span></h4><div class="pool" data-zone="pool">${F.map(f=>pill(f,"pool")).join("")}</div>
  ${["f","r","c","v"].map(zn=>`<div class="zone" data-zone="${zn}"><span class="zl">${ZL[zn]}<small>最多 ${LIM[zn]} 个</small></span>${P[zn].map(f=>pill(f,zn)).join("")}</div>`).join("")}
  ${state.warn?`<p class="warn" role="alert">${esc(state.warn)}</p>`:""}
  <div class="row">格子里<span class="seg2">${[["list","列出"],["count","计数"]].map(([m,l])=>`<button data-mode="${m}" aria-pressed="${P.mode===m}">${l}</button>`).join("")}</span></div>
  <label class="row">行和列至少<select id="gmin">${[["","不限"],["2病","2 个病"],["3病","3 个病"],["2证","2 个证"],["3证","3 个证"]].map(([v,l])=>`<option value="${v}"${P.min===v?" selected":""}>${l}</option>`).join("")}</select></label>
  <div class="save"><input id="gname" placeholder="${esc(gsum(P))}" aria-label="表格名"><button class="pri" data-gsave>存为我的表格</button></div>`}
function mGrid(){const P=state.pv,[on,mi]=onG();
  return `<div class="head"><h1>${esc(on>-1?PRE_G[on].n:mi>-1?state.mineG[mi].n:"自定义表格")}</h1><p>${esc(on>-1?PRE_G[on].d:gsum(P))}</p></div>${grid(P)}`+foot()}
function leaves(zs,dims,min,dep=0){if(!dims.length)return[{p:[],l:zs}];
  return group(zs,dims[0],{min:dep?"":min}).flatMap(e=>leaves(e.l,dims.slice(1),min,dep+1).map(x=>({p:[e.k,...x.p],l:x.l})))}
const pre=(x,i)=>x.p.slice(0,i+1).join("\u0001");
function span(ls,i,j){if(j&&pre(ls[j-1],i)===pre(ls[j],i))return 0;let n=1;while(j+n<ls.length&&pre(ls[j+n],i)===pre(ls[j],i))n++;return n}
function item(d,v,sd){
  if(d==="证"){const z=Z[v];return `<button class="it b" data-z="${z.id}">${esc(z.name)}${sd?`<small>${esc(z.dis)}</small>`:""}</button>`}
  if(d==="证名")return `<button class="it b" data-zs="${D.z.filter(z=>z.name===v).map(z=>z.id).join(",")}">${esc(v)}</button>`;
  if(d==="病")return `<button class="it b" data-dis="${esc(v)}">${esc(v)}</button>`;
  if(d==="系统")return `<span class="it b">${esc(v)}</span>`;
  return `<button class="it" data-q="${esc(v)}">${esc(v)}</button>`}
function grid(P){
  const S=P.sel,V=P.v.length?P.v:["证"],R=P.r,C=P.c,ax=[...R,...C];
  const zs=D.z.filter(z=>P.f.every(f=>!(S[f]||[]).length||vals(z,f).some(v=>S[f].includes(v))));
  let rows=leaves(zs,R,P.min);
  let cols=leaves([...new Set(rows.flatMap(x=>x.l))],C,P.min);const nc=cols.length;cols=cols.slice(0,MAXC);
  cols.forEach(c=>c.s=new Set(c.l.map(z=>z.id)));
  rows.forEach(x=>x.cz=cols.map(c=>x.l.filter(z=>c.s.has(z.id))));
  const nr=rows.length;rows=rows.filter(x=>x.cz.some(a=>a.length));
  if(!rows.length)return `<div class="tbl"><p class="empty">没有符合的证。换个筛选，或把「行和列至少」调低。</p></div>`;
  const sd=!ax.includes("病")&&!(P.f.includes("病")&&(S.病||[]).length===1);  // show the 病 next to a 证 name only when no axis says it
  const items=(cz,d)=>d==="证"?cz.map(z=>z.id):[...new Set(cz.flatMap(z=>vals(z,d)))];
  const mx={};if(P.mode==="count")for(const x of rows)x.cz.forEach(cz=>V.forEach(d=>mx[d]=Math.max(mx[d]||1,items(cz,d).length)));
  const cell=(cz,d)=>{if(!cz.length)return "<td></td>";const ids=cz.map(z=>z.id).join(","),it=items(cz,d);
    if(P.mode==="count")return `<td class="n" style="--a:${(it.length/mx[d]).toFixed(2)}"><button data-zs="${ids}" aria-label="${it.length} 个，点开看证">${it.length}</button></td>`;
    if(d==="证"&&ax.includes("证"))return `<td class="dot"><button class="it" data-zs="${ids}" aria-label="有">●</button></td>`;
    return `<td>${it.map(v=>item(d,v,sd)).join("")}</td>`};
  const VR=!C.length||V.length>1,H=C.length+(VR?1:0),RL=R.length?R:["全部"],cnt=R.length&&R.at(-1)!=="证",LW=RL.length+(cnt?1:0);
  let h="";
  for(let i=0;i<H;i++){h+="<tr>";
    if(i<H-1)h+=`<th data-c="0" colspan="${LW}">${i<C.length?"列："+esc(C[i]):""}</th>`;
    else{const cl=!VR?`　列：${esc(C.at(-1))}`:"";h+=RL.map((d,k)=>`<th data-c="${k}">${esc(d)}${!cnt&&k===RL.length-1?cl:""}</th>`).join("")+(cnt?`<th data-c="${RL.length}">病 / 证${cl}</th>`:"")}
    if(i<C.length)cols.forEach((c,j)=>{const s=span(cols,i,j);if(s)h+=`<th colspan="${s*(VR?V.length:1)}">${item(C[i],c.p[i],sd)}</th>`});
    else cols.forEach(()=>V.forEach(d=>h+=`<th>${esc(d)}</th>`));
    h+="</tr>"}
  let b="";
  rows.forEach((x,j)=>{b+="<tr>";
    if(R.length)R.forEach((d,i)=>{const s=span(rows,i,j);if(s)b+=`<th data-c="${i}"${s>1?` rowspan="${s}"`:""}>${item(d,x.p[i],sd)}</th>`});
    else b+=`<th data-c="0">全部</th>`;
    if(cnt)b+=`<th class="ct" data-c="${R.length}">${new Set(x.l.map(z=>z.dis)).size} / ${x.l.length}</th>`;
    x.cz.forEach(cz=>V.forEach(d=>b+=cell(cz,d)));b+="</tr>"});
  const note=[`${rows.length} 行，${cols.length*V.length} 列，用到 ${zs.length} 个证${P.f.some(f=>(S[f]||[]).length)?"（已筛选）":""}。`];
  if(nc>MAXC)note.push(`列太多，只显示前 ${MAXC} 列（共 ${nc} 列），加筛选或把「至少」调高。`);
  if(nr>rows.length)note.push(`${nr-rows.length} 行在这些列里没有证，已隐藏。`);
  if(P.mode==="count")note.push("点数字看是哪些证。");
  return `<div class="gw"><table class="pt"><thead>${h}</thead><tbody>${b}</tbody></table></div><p class="gnote">${note.join("")}</p>`}
function freeze(){const t=$(".pt");if(!t)return;  // sticky header rows and row-label columns, like frozen panes
  for(const tr of t.tHead.rows)for(const c of tr.cells)c.style.top=tr.offsetTop+"px";
  const w=[];t.querySelectorAll("[data-c]").forEach(c=>{if(c.colSpan===1)w[+c.dataset.c]??=c.offsetWidth});
  const L=[];w.reduce((a,x,i)=>(L[i]=a,a+x),0);
  t.querySelectorAll("[data-c]").forEach(c=>c.style.left=(L[+c.dataset.c]||0)+"px")}
function chooser(f){const cur=new Set(state.pv.sel[f]||[]);
  return [`筛选：${f}`,`<input id="chq" class="chq" type="search" placeholder="在 ${esc(f)} 里找" autocomplete="off"><div class="chl">${group(D.z,f).map(e=>`<label data-t="${esc(label(f,e.k))}"><input type="checkbox" value="${esc(e.k)}"${cur.has(e.k)?" checked":""}><span>${esc(label(f,e.k))}${f==="证"?`<small>${esc(Z[e.k].dis)}</small>`:""}</span><small>${e.nd} 病，${e.l.length} 证</small></label>`).join("")}</div>
  <div class="chb"><button data-chs="all">不筛选</button><button class="pri" data-chs="ok">筛选</button></div>`]}
function place(f,to,i){const P=state.pv;
  if(to&&!P[to].includes(f)&&P[to].length>=LIM[to]){state.warn=`${ZL[to]}最多放 ${LIM[to]} 个字段，先拿掉一个。`;return render()}
  state.warn="";
  for(const k of ["f","r","c","v"])P[k]=P[k].filter(x=>x!==f);
  if(to!=="f")delete P.sel[f];
  if(to)P[to].splice(i==null?P[to].length:i,0,f);
  render();if(to==="f"&&!(P.sel[f]||[]).length)sheet("chs",f)}
function closeMenu(){$(".menu")?.remove()}
function menu(p){closeMenu();const f=p.dataset.f,from=p.dataset.in,P=state.pv;
  const acts=[...(from==="f"?[["sel","选要看的值"]]:[]),...["r","c","v","f"].filter(z=>z!==from).map(z=>[z,`放到${ZL[z]}`+(P[z].length>=LIM[z]?`（已满 ${LIM[z]} 个）`:""),P[z].length>=LIM[z]]),...(from!=="pool"?[["x","拿掉"]]:[])];
  const m=document.createElement("div");m.className="menu";m.setAttribute("role","menu");
  m.innerHTML=`<div class="mt">${esc(f)}</div>`+acts.map(([a,l,off])=>`<button role="menuitem" data-act="${a}" data-mf="${esc(f)}"${off?" disabled":""}>${l}</button>`).join("");
  document.body.append(m);const r=p.getBoundingClientRect();
  m.style.left=Math.max(8,Math.min(r.left,innerWidth-m.offsetWidth-8))+"px";
  m.style.top=(r.bottom+4+m.offsetHeight>innerHeight?r.top-m.offsetHeight-4:r.bottom+4)+"px";
  m.querySelector("button:not(:disabled)")?.focus()}
function act(f,a){closeMenu();if(a==="sel")return sheet("chs",f);place(f,a==="x"?null:a)}
function saveMine(isT){const inp=$(isT?"#tname":"#gname"),n=inp.value.trim()||inp.placeholder,arr=isT?state.mineT:state.mineG;
  const cfg=isT?normT(state.tree):{p:normG(state.pv)},i=arr.findIndex(m=>isT?key(normT(m))===key(cfg):key(normG(m.p))===key(cfg.p));
  if(i>-1)arr[i].n=n;else arr.push({n,...cfg});render()}

/* drag a field: pointer events, so mouse and touch behave the same */
let dg=null,dragged=false;
document.addEventListener("pointerdown",e=>{const p=e.target.closest(".pill[data-f]");if(p&&e.button===0)dg={p,x:e.clientX,y:e.clientY,on:false}});
document.addEventListener("pointermove",e=>{if(!dg)return;
  if(!dg.on){if(Math.hypot(e.clientX-dg.x,e.clientY-dg.y)<6)return;
    const r=dg.p.getBoundingClientRect();Object.assign(dg,{on:true,dx:dg.x-r.left,dy:dg.y-r.top,g:dg.p.cloneNode(true)});
    dg.g.classList.add("ghost");document.body.append(dg.g);dg.p.classList.add("src");closeMenu()}
  e.preventDefault();dg.g.style.transform=`translate(${e.clientX-dg.dx}px,${e.clientY-dg.dy}px)`;
  const z=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-zone]");
  $$("[data-zone]").forEach(x=>x.classList.toggle("over",x===z));$(".caret")?.remove();dg.z=z;dg.i=null;
  if(z&&z.dataset.zone!=="pool"){const ps=[...z.querySelectorAll(".pill")].filter(q=>q!==dg.p);let i=0;
    for(const q of ps){const r=q.getBoundingClientRect();if(e.clientY>r.bottom||(e.clientY>=r.top&&e.clientX>r.left+r.width/2))i++}
    dg.i=i;const c=document.createElement("span");c.className="caret";z.insertBefore(c,ps[i]||null)}},{passive:false});
function endDrag(e){if(!dg)return;const d=dg;dg=null;if(!d.on)return;
  d.g.remove();dragged=true;setTimeout(()=>dragged=false);
  const to=e.type==="pointerup"?d.z?.dataset.zone:null,f=d.p.dataset.f;
  if(to&&to!=="pool")place(f,to,d.i);else if(e.type==="pointerup"&&d.p.dataset.in!=="pool")place(f,null);else render()}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);

/* render + events */
function render(){const v=state.v;
  $$(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  document.body.dataset.v=v;
  $("#side").innerHTML=v==="kill"?sKill():v==="tree"?sTree():v==="grid"?sGrid():"";
  $("#main").innerHTML=v==="kill"?mKill():v==="find"?mFind():v==="tree"?mTree():mGrid();
  if(v==="grid")freeze();if(v==="kill")spy();
  save()}
function go(v,q){state.v=v;if(q!=null){state.q=q;$("#q").value=q}render();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target;let el;
  if(!t.closest(".menu"))closeMenu();
  if(el=t.closest("[data-act]"))return act(el.dataset.mf,el.dataset.act);
  if(el=t.closest(".pill[data-f]")){if(!dragged)menu(el);return}
  if(t.closest("#dlgx"))return dlg.close();
  if(t.closest("#dlgback")){if(stack.length>1){stack.pop();paint()}return}
  if(el=t.closest(".tabs [data-v]"))return go(el.dataset.v);
  if(el=t.closest("[data-q]")){e.preventDefault();if(dlg.open)dlg.close();return go("find",el.dataset.q)}
  if(el=t.closest("[data-z]"))return sheet("z",el.dataset.z,dlg.open);
  if(el=t.closest("[data-zs]"))return sheet("zs",el.dataset.zs,dlg.open);
  if(el=t.closest("[data-dis]"))return sheet("dis",el.dataset.dis,dlg.open);
  if(el=t.closest("[data-tp]")){state.tree=normT(PRE_T[+el.dataset.tp]);return render()}
  if(el=t.closest("[data-tm]")){state.tree=normT(state.mineT[+el.dataset.tm]);return render()}
  if(el=t.closest("[data-tmx]")){state.mineT.splice(+el.dataset.tmx,1);return render()}
  if(el=t.closest("[data-lvx]")){state.tree.c.splice(+el.dataset.lvx,1);return render()}
  if(t.closest("[data-tsave]"))return saveMine(true);
  if(el=t.closest("[data-gp]")){state.pv=normG(PRE_G[+el.dataset.gp].p);state.warn="";return render()}
  if(el=t.closest("[data-gm]")){state.pv=normG(state.mineG[+el.dataset.gm].p);state.warn="";return render()}
  if(el=t.closest("[data-gmx]")){state.mineG.splice(+el.dataset.gmx,1);return render()}
  if(t.closest("[data-gsave]"))return saveMine(false);
  if(el=t.closest("[data-mode]")){state.pv.mode=el.dataset.mode;return render()}
  if(el=t.closest("[data-chs]")){state.pv.sel[stack.at(-1)[1]]=el.dataset.chs==="ok"?$$(".chl input:checked").map(i=>i.value):[];dlg.close();return render()}
  if(el=t.closest("[data-more]")){const q=state.q.trim();el.insertAdjacentHTML("beforebegin",D.bank.filter(b=>b[2].includes(q)).slice(20).map(bqRow(q)).join(""));return el.remove()}
  if(t===dlg)dlg.close()});
document.addEventListener("change",e=>{const t=e.target;
  if(t.matches("[data-lv]")){state.tree.c[+t.dataset.lv]=t.value;render()}
  else if(t.matches("[data-lvadd]")&&t.value){const c=state.tree.c;c.splice(c.at(-1)==="证"?c.length-1:c.length,0,t.value);render()}  // a new level goes above a closing 证
  else if(t.id==="tmin"){state.tree.min=t.value;render()}
  else if(t.id==="gmin"){state.pv.min=t.value;render()}});
document.addEventListener("input",e=>{if(e.target.id==="chq"){const q=e.target.value.trim();$$(".chl label").forEach(l=>l.hidden=!!q&&!l.dataset.t.includes(q))}});
document.addEventListener("toggle",e=>{const n=e.target;  // draw a tree node's children the first time it opens
  if(n.matches?.("details.nd")&&n.open&&!n.dataset.done){n.dataset.done=1;const N=NODES[+n.dataset.n];n.insertAdjacentHTML("beforeend",`<div class="kids">${nodes(N.zs,N.dep,N.path)}</div>`)}},true);
let tm;$("#q").addEventListener("input",e=>{clearTimeout(tm);tm=setTimeout(()=>{state.q=e.target.value;if(state.v!=="find"){state.v="find";scrollTo(0,0)}render()},180)});
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!e.target.closest("input,select,textarea")&&!dlg.open){e.preventDefault();$("#q").focus()}
  if(e.key==="Escape")closeMenu()});
addEventListener("resize",()=>{if(state.v==="grid")freeze()});
render();
</script>
</body>
</html>
